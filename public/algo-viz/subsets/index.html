<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsets</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; color: #fff; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .code-panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .viz-inputs input[type="text"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; }
    .viz-inputs select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }

    .tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; width: 100%; }
    #tree-svg { display: block; width: 100%; }

    .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 13px 16px; display: flex; flex-direction: column; gap: 8px; }
    .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }

    #subsets-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; }
    .subset-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; font-family: monospace; font-size: 0.82rem; color: var(--text-dim); }
    .subset-chip.new { border-color: var(--green); color: var(--green); background: rgba(22,163,74,0.08); }

    #active-path { font-family: monospace; font-size: 1.1rem; font-weight: 700; color: var(--accent); min-height: 1.5em; letter-spacing: 0.04em; }
    #step-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }

    .code-body { padding: 8px 0; font-size: 0.76rem; line-height: 1.72; font-family: 'JetBrains Mono', 'Fira Code', monospace; overflow-x: auto; }
    .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 14px 0 0; white-space: pre; }
    .cl .ln { width: 26px; min-width: 26px; text-align: right; color: #3d4468; user-select: none; padding-right: 12px; font-size: 0.7rem; line-height: 1.72; }
    .cl .code { color: var(--text-muted); }

    .leg-row { display: flex; flex-direction: column; gap: 6px; font-size: 0.76rem; color: var(--text-muted); }
    .leg-item { display: flex; align-items: center; gap: 6px; }

    .kw  { color: var(--purple); }
    .fn  { color: var(--blue); }
    .bi  { color: var(--orange); }
    .cm  { color: #3d4468; font-style: italic; }
    .op  { color: var(--text); }
    .nb  { color: var(--green); }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="preset-sel" onchange="loadPreset()">
      <option value="1,2,3" selected>[1,2,3]</option>
      <option value="1,2,3,4">[1,2,3,4]</option>
      <option value="0,1,2">[0,1,2]</option>
    </select>
  </div>
  <div class="field">
    <label>Custom (comma-sep)</label>
    <input id="inp-nums" type="text" value="1,2,3" style="width:160px" />
  </div>
  <button class="btn-primary" onclick="buildAndRun()">Build &amp; Run</button>
  <button onclick="randomExample()" style="padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.85rem">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">Subsets</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>
  <div id="sidebar">
    <div id="step-desc">Choose a preset or enter numbers, then click Build &amp; Run.</div>
    <div class="panel-box">
      <div class="panel-title">Current path</div>
      <div id="active-path">[ ]</div>
      <div style="font-size:0.74rem;color:var(--text-muted)" id="path-hint"></div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Collected subsets <span id="subset-count" style="font-weight:400;color:var(--text-faint)"></span></div>
      <div id="subsets-list"><span style="color:var(--text-faint);font-size:0.8rem;font-style:italic">none yet</span></div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Legend</div>
      <div class="leg-row">
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1e2130" stroke="#2d3148" stroke-width="2"/></svg>Unvisited</div>
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#4338ca" stroke="var(--accent)" stroke-width="2"/></svg>Active</div>
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#052e16" stroke="#16a34a" stroke-width="2"/></svg>Leaf / done</div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ── Code lines ──────────────────────────────────────────────────────────────
var CODE_LINES = [
  [1,  '<span class="kw">def</span> <span class="fn">subsets</span><span class="op">(</span>nums<span class="op">):</span>'],
  [2,  '    res <span class="op">=</span> <span class="op">[]</span>'],
  [3,  '    <span class="kw">def</span> <span class="fn">backtrack</span><span class="op">(</span>i<span class="op">,</span> path<span class="op">):</span>'],
  [4,  '        res<span class="op">.</span><span class="fn">append</span><span class="op">(</span>path<span class="op">[:])</span>  <span class="cm"># record current subset</span>'],
  [5,  '        <span class="kw">for</span> j <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>i<span class="op">,</span> <span class="bi">len</span><span class="op">(</span>nums<span class="op">)):</span>'],
  [6,  '            path<span class="op">.</span><span class="fn">append</span><span class="op">(</span>nums<span class="op">[</span>j<span class="op">])</span>'],
  [7,  '            <span class="fn">backtrack</span><span class="op">(</span>j <span class="op">+</span> <span class="nb">1</span><span class="op">,</span> path<span class="op">)</span>'],
  [8,  '            path<span class="op">.</span><span class="fn">pop</span><span class="op">()</span>'],
  [9,  '    <span class="fn">backtrack</span><span class="op">(</span><span class="nb">0</span><span class="op">,</span> <span class="op">[])</span>'],
  [10, '    <span class="kw">return</span> res'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE_LINES.map(function(e) {
    return '<div class="cl" id="cl-' + e[0] + '">'
      + '<span class="ln">' + e[0] + '</span>'
      + '<span class="code">' + e[1] + '</span></div>';
  }).join('');
}

// ── SVG helpers ─────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

// ── Colors ──────────────────────────────────────────────────────────────────
var C = {
  idle:   { fill: '#1e2130', stroke: '#2d3148', text: '#7b82a3' },
  active: { fill: '#4338ca', stroke: '#818cf8', text: '#e0e7ff' },
  leaf:   { fill: '#052e16', stroke: '#16a34a', text: '#4ade80' },
  path:   { stroke: '#818cf8' },
  done:   { stroke: '#2d3148' },
};

// ── Global ──────────────────────────────────────────────────────────────────
var gNums = [];
var gNodes = [];
var gSteps = [];
var prevLines = [];
var nav;

// ── Tree layout ─────────────────────────────────────────────────────────────
function buildDecisionTree(nums) {
  var nodes = [];
  var id = 0;

  function rec(idx, path, parentId, edgeLabel) {
    var nid = id++;
    nodes.push({ id: nid, idx: idx, path: path.slice(), parentId: parentId, edgeLabel: edgeLabel, children: [] });
    if (parentId >= 0) nodes[parentId].children.push(nid);
    for (var j = idx; j < nums.length; j++) {
      path.push(nums[j]);
      rec(j + 1, path, nid, (idx === j ? 'include ' : 'skip→') + nums[j]);
      path.pop();
    }
  }

  rec(0, [], -1, '');
  return nodes;
}

function layoutTree(nodes) {
  var n = nodes.length;
  var leafCount = new Array(n).fill(0);
  var leafStart = new Array(n).fill(0);
  var totalLeaves = 0;

  function countLeaves(nid) {
    var node = nodes[nid];
    if (node.children.length === 0) {
      node._leafSpan = 1;
      return;
    }
    node.children.forEach(function(cid) { countLeaves(cid); });
    node._leafSpan = node.children.reduce(function(s, cid) { return s + nodes[cid]._leafSpan; }, 0);
  }
  countLeaves(0);
  totalLeaves = nodes[0]._leafSpan;

  var leafIdx = 0;
  function assignX(nid) {
    var node = nodes[nid];
    if (node.children.length === 0) {
      node._leafIdx = leafIdx++;
      node.x = node._leafIdx;
      return;
    }
    node.children.forEach(function(cid) { assignX(cid); });
    var first = nodes[node.children[0]].x;
    var last  = nodes[node.children[node.children.length - 1]].x;
    node.x = (first + last) / 2;
  }
  assignX(0);

  function depth(nid) {
    var node = nodes[nid];
    node.depth = node.parentId < 0 ? 0 : nodes[node.parentId].depth + 1;
    node.children.forEach(function(cid) { depth(cid); });
  }
  depth(0);

  var maxDepth = 0;
  nodes.forEach(function(nd) { if (nd.depth > maxDepth) maxDepth = nd.depth; });

  return { totalLeaves: totalLeaves, maxDepth: maxDepth };
}

function renderTree(nodes, totalLeaves, maxDepth) {
  var svg = document.getElementById('tree-svg');
  svg.innerHTML = '';

  var R = 20;
  var PAD_X = 32, PAD_Y = 36;
  var Y_STEP = Math.min(72, Math.max(52, 320 / Math.max(1, maxDepth)));
  var xUnit = Math.max(38, Math.min(80, (900 - PAD_X * 2) / Math.max(1, totalLeaves - 1)));

  var VW = Math.max(500, PAD_X * 2 + (totalLeaves - 1) * xUnit);
  var VH = PAD_Y * 2 + maxDepth * Y_STEP + R * 2 + 30;

  svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);

  nodes.forEach(function(nd) {
    nd.px = PAD_X + nd.x * xUnit;
    nd.py = PAD_Y + nd.depth * Y_STEP + R;
  });

  var edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeG.id = 'edges';
  var nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeG.id = 'nodes';
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  nodes.forEach(function(nd) {
    if (nd.parentId < 0) return;
    var par = nodes[nd.parentId];
    var line = svgEl('line', {
      id: 'edge-' + par.id + '-' + nd.id,
      x1: par.px, y1: par.py, x2: nd.px, y2: nd.py,
      stroke: C.done.stroke, 'stroke-width': 1.5, 'stroke-linecap': 'round',
    });
    edgeG.appendChild(line);

    var mx = (par.px + nd.px) / 2;
    var my = (par.py + nd.py) / 2;
    var lbl = svgEl('text', {
      id: 'elbl-' + par.id + '-' + nd.id,
      x: mx, y: my,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#3d4468', 'font-size': Math.max(8, Math.min(11, xUnit * 0.18)),
      'font-family': 'JetBrains Mono, monospace',
    });
    lbl.textContent = nd.edgeLabel;
    edgeG.appendChild(lbl);
  });

  nodes.forEach(function(nd) {
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'node-g-' + nd.id;

    var circle = svgEl('circle', {
      id: 'nc-' + nd.id, cx: nd.px, cy: nd.py, r: R,
      fill: C.idle.fill, stroke: C.idle.stroke, 'stroke-width': 2,
    });
    g.appendChild(circle);

    var label = nd.path.length === 0 ? '∅' : '[' + nd.path.join(',') + ']';
    var fontSize = nd.path.length <= 2 ? 11 : nd.path.length <= 3 ? 9 : 8;
    var txt = svgEl('text', {
      id: 'nt-' + nd.id, x: nd.px, y: nd.py,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: C.idle.text,
      'font-size': fontSize, 'font-weight': '700',
      'font-family': 'JetBrains Mono, monospace',
    });
    txt.textContent = label;
    g.appendChild(txt);
    nodeG.appendChild(g);
  });
}

// ── Simulate ────────────────────────────────────────────────────────────────
function simulate(nums, nodes) {
  var steps = [];
  var collected = [];
  var stateMap = {};
  nodes.forEach(function(nd) { stateMap[nd.id] = 'idle'; });

  function snap(phase, desc, lines, activeId, pathNow, newSubset) {
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines,
      activeId: activeId,
      stateMap: Object.assign({}, stateMap),
      path: pathNow ? pathNow.slice() : [],
      collected: collected.slice(),
      newSubset: newSubset || null,
    });
  }

  function rec(nodeId) {
    var nd = nodes[nodeId];
    stateMap[nodeId] = 'active';

    var pathStr = nd.path.length === 0 ? '[ ]' : '[ ' + nd.path.join(', ') + ' ]';
    var subset = nd.path.slice();
    collected.push(subset);

    if (nd.children.length === 0) {
      snap('Leaf', 'Leaf reached. Record subset ' + pathStr + '.', [4], nodeId, nd.path, subset);
      stateMap[nodeId] = 'leaf';
    } else {
      snap('Record', 'Record subset ' + pathStr + '. Now try including each remaining element.', [4, 5], nodeId, nd.path, subset);

      nd.children.forEach(function(cid, ci) {
        var child = nodes[cid];
        var addedEl = child.path[child.path.length - 1];
        snap('Include', 'Include ' + addedEl + ' → descend with path ' + (child.path.length === 0 ? '[ ]' : '[ ' + child.path.join(', ') + ' ]') + '.', [5, 6, 7], nodeId, nd.path, null);
        rec(cid);
        snap('Pop', 'Backtrack: remove ' + addedEl + '. Resume from ' + pathStr + '.', [8], nodeId, nd.path, null);
      });

      stateMap[nodeId] = 'leaf';
      snap('Done', 'All branches from ' + pathStr + ' explored. Return.', [8], nodeId, nd.path, null);
    }
  }

  snap('Start', 'Begin backtracking from root (empty path). We record every node we visit.', [3, 9], 0, [], null);
  rec(0);
  snap('Done', 'All ' + collected.length + ' subsets collected.', [10], -1, [], null);
  return steps;
}

// ── Apply step ──────────────────────────────────────────────────────────────
function applyStep(s, animate) {
  Object.keys(s.stateMap).forEach(function(idStr) {
    var id = +idStr;
    var st = s.stateMap[id];
    var c = st === 'active' ? C.active : st === 'leaf' ? C.leaf : C.idle;
    var nc = document.getElementById('nc-' + id);
    var nt = document.getElementById('nt-' + id);
    if (!nc) return;
    if (animate) {
      gsap.to(nc, { duration: 0.25, attr: { fill: c.fill, stroke: c.stroke } });
      gsap.to(nt, { duration: 0.25, attr: { fill: c.text } });
    } else {
      nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke);
      if (nt) nt.setAttribute('fill', c.text);
    }
  });

  if (animate && s.activeId >= 0) {
    var nc = document.getElementById('nc-' + s.activeId);
    if (nc) gsap.fromTo(nc, { attr: { r: 20 } }, { attr: { r: 24 }, duration: 0.15, yoyo: true, repeat: 1 });
  }

  gNodes.forEach(function(nd) {
    if (nd.parentId < 0) return;
    var edge = document.getElementById('edge-' + nd.parentId + '-' + nd.id);
    var lbl  = document.getElementById('elbl-' + nd.parentId + '-' + nd.id);
    if (!edge) return;
    var onPath = s.stateMap[nd.id] === 'active' || s.stateMap[nd.id] === 'leaf';
    var col = onPath ? C.path.stroke : C.done.stroke;
    var lblCol = onPath ? '#a5b4fc' : '#3d4468';
    if (animate) {
      gsap.to(edge, { duration: 0.2, attr: { stroke: col } });
    } else {
      edge.setAttribute('stroke', col);
    }
    if (lbl) lbl.setAttribute('fill', lblCol);
  });

  var ap = document.getElementById('active-path');
  var pathStr = s.path.length === 0 ? '[ ]' : '[ ' + s.path.join(', ') + ' ]';
  if (ap) {
    if (animate) gsap.fromTo(ap, { opacity: 0.3 }, { opacity: 1, duration: 0.2 });
    ap.textContent = pathStr;
  }

  var listEl = document.getElementById('subsets-list');
  var countEl = document.getElementById('subset-count');
  if (listEl) {
    if (s.collected.length === 0) {
      listEl.innerHTML = '<span style="color:var(--text-faint);font-size:0.8rem;font-style:italic">none yet</span>';
    } else {
      listEl.innerHTML = s.collected.map(function(sub, idx) {
        var label = sub.length === 0 ? '[ ]' : '[' + sub.join(',') + ']';
        var isNew = s.newSubset && idx === s.collected.length - 1;
        return '<span class="subset-chip' + (isNew ? ' new' : '') + '">' + label + '</span>';
      }).join('');
      if (animate && s.newSubset) {
        var chips = listEl.querySelectorAll('.subset-chip.new');
        if (chips.length) gsap.from(chips[chips.length - 1], { scale: 0.6, opacity: 0, duration: 0.25, ease: 'back.out(1.7)' });
      }
    }
    if (countEl) countEl.textContent = s.collected.length ? '(' + s.collected.length + ')' : '';
  }

  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

function setCodeLines(oldLines, newLines, animate) {
  var HL_BG   = 'rgba(99,102,241,0.13)';
  var HL_BORD = 'var(--accent)';
  var DUR = 0.2;
  (oldLines || []).filter(function(n) { return (newLines || []).indexOf(n) < 0; }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: 'transparent', borderLeftColor: 'transparent', duration: DUR });
    else { el.style.backgroundColor = ''; el.style.borderLeftColor = ''; }
  });
  (newLines || []).filter(function(n) { return (oldLines || []).indexOf(n) < 0; }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.06 });
    else { el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD; }
  });
}

// ── Build & Run ─────────────────────────────────────────────────────────────
function buildAndRun() {
  var raw = document.getElementById('inp-nums').value;
  var nums = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
  if (nums.length === 0 || nums.length > 4) {
    alert('Please enter 1–4 unique integers.');
    return;
  }

  gNums = nums;
  prevLines = [];

  buildCodePanel();

  var nodes = buildDecisionTree(nums);
  var info = layoutTree(nodes);
  gNodes = nodes;
  renderTree(nodes, info.totalLeaves, info.maxDepth);

  gSteps = simulate(nums, nodes);
  nav.load(gSteps);
}

function applyPreset() {
  var val = document.getElementById('preset-sel').value;
  document.getElementById('inp-nums').value = val;
}

function loadPreset() {
  applyPreset();
}

function randomExample() {
  var examples = ['1,2,3', '1,2,3,4', '0,1,2', '1,2', '1,2,3,4,5'];
  var idx = Math.floor(Math.random() * examples.length);
  document.getElementById('inp-nums').value = examples[idx];
  document.getElementById('preset-sel').value = '';
  buildAndRun();
}

// ── Init ────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();

  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var pb = document.getElementById('phase-badge');
      if (pb) pb.textContent = snap.phase;
      var sc = document.getElementById('step-counter');
      if (sc) sc.textContent = 'Step ' + (cur + 1) + ' / ' + total;
      var sd = document.getElementById('step-desc');
      if (sd) { gsap.fromTo(sd, { opacity: 0.3 }, { opacity: 1, duration: 0.15 }); sd.textContent = snap.desc; }
    }
  });

  buildAndRun();
});
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
<script>
if (window.self !== window.top) { var bl = document.querySelector('.back-link'); if (bl) bl.style.display = 'none'; }
</script>
</body>
