<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decode Ways</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 20px; gap: 16px; overflow-y: auto; }

    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 4px; }

    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-step:hover:not(:disabled) { background: #334155; }
    .btn-step:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--accent); background: var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

    /* ── Decode track ── */
    .decode-track { display: flex; gap: 8px; padding: 20px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; min-height: 140px; align-items: flex-end; width: 100%; }
    .decode-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
    .str-cell { width: 54px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 7px; background: #0f0f0f; transition: border-color 0.18s, background 0.18s, color 0.18s; position: relative; flex-shrink: 0; }
    .str-cell[data-state="single"] { border-color: #b45309; background: #1c0e00; }
    .str-cell[data-state="double"] { border-color: #b91c1c; background: #1c0000; }
    .str-cell[data-state="both"]   { border-color: #9a5a00; background: #1c0a00; }
    .str-cell-idx { position: absolute; top: 3px; left: 0; right: 0; text-align: center; font-size: 0.52rem; color: var(--text-ghost); font-family: monospace; }
    .str-cell-char { font-size: 1.05rem; font-weight: 700; font-family: monospace; color: var(--text-dim); margin-top: 8px; }
    .str-cell[data-state="single"] .str-cell-char { color: #fbbf24; }
    .str-cell[data-state="double"] .str-cell-char { color: #f87171; }
    .str-cell[data-state="both"]   .str-cell-char { color: #fb923c; }
    .str-spacer { width: 54px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--text-ghost); font-style: italic; }
    .dp-cell-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
    .dp-cell-box { width: 54px; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 7px; background: #0f0f0f; transition: border-color 0.18s, background 0.18s; position: relative; flex-shrink: 0; }
    .dp-cell-box[data-state="empty"]   { border-style: dashed; opacity: 0.45; }
    .dp-cell-box[data-state="filled"]  { border-color: #166534; }
    .dp-cell-box[data-state="current"] { border-color: var(--accent); background: var(--surface-dark); }
    .dp-cell-box[data-state="single"]  { border-color: #b45309; background: #1c0e00; }
    .dp-cell-box[data-state="double"]  { border-color: #b91c1c; background: #1c0000; }
    .dp-cell-box[data-state="answer"]  { border-color: #15803d; background: #052e16; }
    .dp-cell-idx { font-size: 0.52rem; color: var(--text-ghost); font-family: monospace; position: absolute; top: 4px; left: 0; right: 0; text-align: center; }
    .dp-cell-val { font-size: 1.1rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); margin-top: 10px; }
    .dp-cell-box[data-state="filled"]  .dp-cell-val { color: var(--green); }
    .dp-cell-box[data-state="current"] .dp-cell-val { color: var(--accent-pale); }
    .dp-cell-box[data-state="single"]  .dp-cell-val { color: #fbbf24; }
    .dp-cell-box[data-state="double"]  .dp-cell-val { color: #f87171; }
    .dp-cell-box[data-state="answer"]  .dp-cell-val { color: #4ade80; }
    .dp-cell-label-bot { font-size: 0.58rem; color: var(--text-ghost); font-family: monospace; text-align: center; min-height: 14px; }

    /* Code in panels */
    .code-body { padding: 8px 0; font-size: 0.78rem; line-height: 1.8; white-space: pre; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.72rem; }

    /* Recurrence */
    .sum-readout { font-size: 0.82rem; font-family: monospace; color: var(--text-muted); padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 28px; line-height: 1.6; }
    .val-p1  { color: #fbbf24; }
    .val-p2  { color: #f87171; }
    .val-ans { color: #4ade80; font-weight: 700; }

    /* Syntax */
    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .op { color: var(--text); }
    .nb { color: var(--green); }
    .st { color: var(--yellow); }
    .cm { color: var(--text-dim); font-style: italic; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"s":"226"}'>226 (Multiple decodings)</option>
      <option value='{"s":"12"}'>12 (2-char, two ways)</option>
      <option value='{"s":"123"}'>123 (3-char)</option>
      <option value='{"s":"111"}'>111 (All same digit)</option>
      <option value='{"s":"10"}'>10 (Has zero)</option>
      <option value='{"s":"206"}'>206 (Zero in middle)</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>String s (digits only)</label>
    <input id="inp-s" type="text" value="226" maxlength="12" style="width:130px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:600;color:var(--text)">Decode Ways</span>
  <span style="font-size:11px;color:var(--text-dim)">LC 91 &middot; 1-D DP &middot; O(n)</span>
  <span id="step-counter"></span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc" style="font-size:0.82rem;color:var(--text-muted);padding:2px 0;width:100%">Enter a digit string and click Run.</div>
    <div class="decode-track" id="decode-track">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter a digit string and click Run.</span>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div>
      <div class="code-panel-title">Python</div>
      <div class="code-body" id="code-body"></div>
    </div>
    <div>
      <div class="code-panel-title">Pseudocode</div>
      <div class="code-body" id="pseudo-body"></div>
    </div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Recurrence</div>
      <div class="sum-readout" id="sum-readout">&#8212;</div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&#8592; Prev</button>
  <button class="btn-step" id="stepBtn" disabled>Step &#8594;</button>
  <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="700">Slow</option>
    <option value="350" selected>Medium</option>
    <option value="100">Fast</option>
  </select>
</div>

<script>
var simSteps = [], nav;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">numDecodings</span><span class="op">(</span>s<span class="op">):</span>'],
  [2,  '    n <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>s<span class="op">)</span>'],
  [3,  '    dp <span class="op">=</span> <span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">*</span> <span class="op">(</span>n <span class="op">+</span> <span class="nb">1</span><span class="op">)</span>'],
  [4,  '    dp<span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">=</span> <span class="nb">1</span>'],
  [5,  '    dp<span class="op">[</span><span class="nb">1</span><span class="op">]</span> <span class="op">=</span> <span class="nb">1</span> <span class="kw">if</span> s<span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">!=</span> <span class="st">\'0\'</span> <span class="kw">else</span> <span class="nb">0</span>'],
  [0,  ''],
  [7,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">2</span><span class="op">,</span> n <span class="op">+</span> <span class="nb">1</span><span class="op">):</span>'],
  [8,  '        <span class="kw">if</span> s<span class="op">[</span>i<span class="op">-</span><span class="nb">1</span><span class="op">]</span> <span class="op">!=</span> <span class="st">\'0\'</span><span class="op">:</span>'],
  [9,  '            dp<span class="op">[</span>i<span class="op">]</span> <span class="op">+=</span> dp<span class="op">[</span>i<span class="op">-</span><span class="nb">1</span><span class="op">]</span>'],
  [10, '        two <span class="op">=</span> <span class="bi">int</span><span class="op">(</span>s<span class="op">[</span>i<span class="op">-</span><span class="nb">2</span><span class="op">:</span>i<span class="op">])</span>'],
  [11, '        <span class="kw">if</span> <span class="nb">10</span> <span class="op">&lt;=</span> two <span class="op">&lt;=</span> <span class="nb">26</span><span class="op">:</span>'],
  [12, '            dp<span class="op">[</span>i<span class="op">]</span> <span class="op">+=</span> dp<span class="op">[</span>i<span class="op">-</span><span class="nb">2</span><span class="op">]</span>'],
  [0,  ''],
  [14, '    <span class="kw">return</span> dp<span class="op">[</span>n<span class="op">]</span>'],
];

var PSEUDO = [
  [1,  'numDecodings(s):'],
  [2,  '  dp[0] = 1              // empty prefix'],
  [3,  '  dp[1] = s[0]!=\'0\' ? 1 : 0'],
  [0,  ''],
  [5,  '  for i = 2 to n:'],
  [6,  '    if s[i-1] != \'0\':'],
  [7,  '      dp[i] += dp[i-1]  // 1-digit ok'],
  [8,  '    two = s[i-2..i-1]'],
  [9,  '    if 10 <= two <= 26:'],
  [10, '      dp[i] += dp[i-2]  // 2-digit ok'],
  [0,  ''],
  [12, '  return dp[n]'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel('code-body', CODE);
  buildCodePanel('pseudo-body', PSEUDO);

  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      renderSnap(snap, cur > 0);
      var badgeEl = document.getElementById('phase-badge');
      var descEl  = document.getElementById('desc');
      var ctrEl   = document.getElementById('step-counter');
      if (badgeEl) badgeEl.textContent = snap.phase;
      if (descEl)  descEl.textContent  = snap.desc;
      if (ctrEl)   ctrEl.textContent   = 'Step ' + (cur + 1) + ' / ' + total;
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    nav.stopPlay();
    buildAndRun();
  });

  buildAndRun();
});

function buildCodePanel(id, lines) {
  var body = document.getElementById(id);
  body.innerHTML = lines.map(function(e) {
    var ln = e[0], html = e[1];
    var idAttr = ln > 0 ? ' id="' + id + '-cl-' + ln + '"' : '';
    return '<div class="code-line"' + idAttr + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var raw = document.getElementById('inp-s').value.replace(/[^0-9]/g, '');
  if (!raw) raw = '226';
  if (raw.length > 12) raw = raw.slice(0, 12);
  document.getElementById('inp-s').value = raw;
  buildTrack(raw);
  simSteps = buildSteps(raw);
  nav.load(simSteps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-s').value = d.s;
  buildAndRun();
}

function randomExample() {
  var lengths = [2, 3, 4, 5, 6];
  var len = lengths[Math.floor(Math.random() * lengths.length)];
  var s = '';
  for (var i = 0; i < len; i++) {
    s += Math.floor(Math.random() * 10);
  }
  document.getElementById('inp-s').value = s;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildTrack(s) {
  var n = s.length;
  var track = document.getElementById('decode-track');
  track.innerHTML = '';

  for (var i = 0; i <= n; i++) {
    var col = document.createElement('div');
    col.className = 'decode-col';
    col.id = 'col-' + i;

    if (i === 0) {
      var spacer = document.createElement('div');
      spacer.className = 'str-spacer';
      spacer.textContent = '\u03b5';
      col.appendChild(spacer);
    } else {
      var sc = document.createElement('div');
      sc.className = 'str-cell';
      sc.id = 'str-' + (i - 1);
      sc.dataset.state = 'normal';
      sc.innerHTML =
        '<span class="str-cell-idx">[' + (i - 1) + ']</span>' +
        '<span class="str-cell-char">' + s[i - 1] + '</span>';
      col.appendChild(sc);
    }

    var dpWrap = document.createElement('div');
    dpWrap.className = 'dp-cell-wrap';
    dpWrap.id = 'dpw-' + i;
    dpWrap.innerHTML =
      '<div class="dp-cell-box" id="dpb-' + i + '" data-state="empty">' +
        '<span class="dp-cell-idx">dp[' + i + ']</span>' +
        '<span class="dp-cell-val" id="dpv-' + i + '">?</span>' +
      '</div>' +
      '<div class="dp-cell-label-bot" id="dpl-' + i + '"></div>';
    col.appendChild(dpWrap);
    track.appendChild(col);
  }
}

function buildSteps(s) {
  var n = s.length;
  var dp = new Array(n + 1).fill(null);
  var steps = [];

  function snap(opts) {
    steps.push({
      s:          s,
      n:          n,
      dp:         dp.slice(),
      phase:      opts.phase   || 'Init',
      desc:       opts.desc    || '',
      lines:      opts.lines   || [],
      dpCurrent:  opts.dpCurrent  !== undefined ? opts.dpCurrent  : -1,
      dpSrc1:     opts.dpSrc1     !== undefined ? opts.dpSrc1     : -1,
      dpSrc2:     opts.dpSrc2     !== undefined ? opts.dpSrc2     : -1,
      singleOk:   opts.singleOk !== undefined ? opts.singleOk : false,
      doubleOk:   opts.doubleOk !== undefined ? opts.doubleOk : false,
    });
  }

  snap({ phase: 'Init', desc: 'Allocate dp[0..' + n + '] — all cells start empty.', lines: [2, 3] });

  dp[0] = 1;
  snap({ phase: 'Base', desc: 'dp[0] = 1 — the empty prefix has exactly one decoding.', lines: [4], dpCurrent: 0 });

  if (n >= 1) {
    var base1Ok = s[0] !== '0';
    dp[1] = base1Ok ? 1 : 0;
    snap({
      phase: 'Base',
      desc: base1Ok
        ? 'dp[1] = 1 — s[0]="' + s[0] + '" is a valid single digit (1-9).'
        : 'dp[1] = 0 — s[0]="0" cannot stand alone as a digit.',
      lines: [5],
      dpCurrent: 1,
      dpSrc1: base1Ok ? 0 : -1,
      singleOk: base1Ok,
    });
  }

  for (var i = 2; i <= n; i++) {
    var singleOk = s[i - 1] !== '0';
    var twoStr   = s.substring(i - 2, i);
    var twoVal   = parseInt(twoStr, 10);
    var doubleOk = twoVal >= 10 && twoVal <= 26;

    var src1 = singleOk ? i - 1 : -1;
    var src2 = doubleOk ? i - 2 : -1;

    var parts = [];
    if (singleOk) {
      parts.push('s[' + (i-1) + ']="' + s[i-1] + '" \u2260 0 \u2192 add dp[' + (i-1) + ']=' + dp[i-1]);
    } else {
      parts.push('s[' + (i-1) + ']="0" \u2192 skip 1-digit');
    }
    if (doubleOk) {
      parts.push('"' + twoStr + '" \u2208 [10,26] \u2192 add dp[' + (i-2) + ']=' + dp[i-2]);
    } else {
      parts.push('"' + twoStr + '" \u2209 [10,26] \u2192 skip 2-digit');
    }
    snap({
      phase: 'Compute',
      desc: 'i=' + i + ': ' + parts.join(' | '),
      lines: [7, 8, 9, 10, 11, 12],
      dpCurrent: i,
      dpSrc1: src1,
      dpSrc2: src2,
      singleOk: singleOk,
      doubleOk: doubleOk,
    });

    var addends = [];
    if (singleOk) addends.push('dp[' + (i-1) + ']=' + dp[i-1]);
    if (doubleOk) addends.push('dp[' + (i-2) + ']=' + dp[i-2]);
    if (!addends.length) addends.push('0');
    dp[i] = (singleOk ? dp[i-1] : 0) + (doubleOk ? dp[i-2] : 0);
    snap({
      phase: 'Compute',
      desc: 'dp[' + i + '] = ' + addends.join(' + ') + ' = ' + dp[i] + '.',
      lines: [9, 12],
      dpCurrent: i,
      dpSrc1: src1,
      dpSrc2: src2,
      singleOk: singleOk,
      doubleOk: doubleOk,
    });
  }

  snap({
    phase: 'Done',
    desc: 'dp[' + n + '] = ' + dp[n] + ' \u2014 total distinct decodings of "' + s + '".',
    lines: [14],
  });

  return steps;
}

function renderSnap(snap, animate) {
  gsap.killTweensOf('.dp-cell-box');
  gsap.killTweensOf('.dp-cell-val');
  gsap.killTweensOf('.str-cell');
  gsap.killTweensOf('.sum-readout');

  var n = snap.n;
  var i = snap.dpCurrent;
  var isDone = snap.phase === 'Done';

  for (var j = 0; j < n; j++) {
    var sc = document.getElementById('str-' + j);
    if (!sc) continue;
    var state = 'normal';
    if (i >= 2) {
      var isSingleChar = (j === i - 1) && snap.singleOk;
      var isDoubleChar = (j === i - 2 || j === i - 1) && snap.doubleOk;
      if (isSingleChar && isDoubleChar) state = 'both';
      else if (isSingleChar) state = 'single';
      else if (isDoubleChar) state = 'double';
    } else if (i === 1 && j === 0 && snap.singleOk) {
      state = 'single';
    }
    sc.dataset.state = state;
  }

  for (var k = 0; k <= n; k++) {
    var box   = document.getElementById('dpb-' + k);
    var valEl = document.getElementById('dpv-' + k);
    var lbl   = document.getElementById('dpl-' + k);
    if (!box || !valEl) continue;

    var prevText = valEl.textContent;
    var val  = snap.dp[k];
    var text = val === null ? '?' : String(val);

    var state = 'empty';
    if (isDone && k === n) {
      state = 'answer';
    } else if (k === snap.dpCurrent) {
      state = 'current';
    } else if (k === snap.dpSrc1) {
      state = 'single';
    } else if (k === snap.dpSrc2) {
      state = 'double';
    } else if (val !== null) {
      state = 'filled';
    }

    box.dataset.state = state;
    valEl.textContent = text;

    if (animate && text !== '?' && prevText !== text) {
      gsap.fromTo(box, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' });
    }
    if (animate && (state === 'single' || state === 'double')) {
      gsap.fromTo(box, { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1 });
    }

    if (lbl) {
      if (k === snap.dpSrc1) lbl.innerHTML = '<span style="font-size:0.55rem;color:#fbbf24">1-dig</span>';
      else if (k === snap.dpSrc2) lbl.innerHTML = '<span style="font-size:0.55rem;color:#f87171">2-dig</span>';
      else lbl.innerHTML = '';
    }
  }

  var readout = document.getElementById('sum-readout');
  if (readout) {
    var html = '&mdash;';
    if (isDone) {
      html = 'Answer: <span class="val-ans">dp[' + n + '] = ' + snap.dp[n] + '</span>';
    } else if (i === 0) {
      html = 'dp[0] = <span class="val-ans">1</span> &nbsp;<span style="color:var(--text-dim)">(empty prefix)</span>';
    } else if (i === 1) {
      var c0 = snap.s[0];
      var v1 = snap.dp[1];
      html = 'dp[1] = s[0]\u2260"0" ? <span class="val-ans">1</span> : <span style="color:var(--text-dim)">0</span>' +
             ' &nbsp;&rarr; <span class="val-ans">' + (v1 !== null ? v1 : '?') + '</span>' +
             ' &nbsp;<span style="color:var(--text-dim)">[s[0]="' + c0 + '"]</span>';
    } else if (i >= 2) {
      var sSnap = snap.s;
      var p1 = snap.dp[i - 1];
      var p2 = snap.dp[i - 2];
      var cur = snap.dp[i];
      var twoStrSnap = sSnap.substring(i - 2, i);

      var p1html = snap.singleOk
        ? '<span class="val-p1">dp[' + (i-1) + ']=' + (p1 !== null ? p1 : '?') + '</span>'
        : '<span style="color:var(--text-dim);text-decoration:line-through">s[' + (i-1) + ']="0"</span>';
      var p2html = snap.doubleOk
        ? '<span class="val-p2">dp[' + (i-2) + ']=' + (p2 !== null ? p2 : '?') + '</span>'
        : '<span style="color:var(--text-dim);text-decoration:line-through">"' + twoStrSnap + '"\u2209[10,26]</span>';

      html = 'dp[' + i + '] = ' + p1html + ' + ' + p2html;
      if (cur !== null) html += ' = <span class="val-ans">' + cur + '</span>';
    }
    readout.innerHTML = html;
    if (animate) gsap.from(readout, { opacity: 0, y: 6, duration: 0.25 });
  }

  setCodeLines('code-body', CODE, snap.lines);
  setCodeLines('pseudo-body', PSEUDO, snap.lines.map(function(l) {
    var map = { 2:null, 3:null, 4:2, 5:3, 7:5, 8:6, 9:7, 10:8, 11:9, 12:10, 14:12 };
    return map[l] !== undefined ? map[l] : l;
  }).filter(function(l) { return l; }));
}

function setCodeLines(panelId, lines, activeLines) {
  lines.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById(panelId + '-cl-' + ln);
    if (!el) return;
    if (activeLines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
