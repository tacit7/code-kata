<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Count Good Nodes in Binary Tree</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 16px; overflow-y: auto; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* PAGE-SPECIFIC */
  .tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; width: 100%; }
  #tree-svg { display: block; width: 100%; }

  /* Code panel inner styles */
  .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 4px 0 0; white-space: pre; }
  .cl .ln { width: 28px; min-width: 28px; text-align: right; color: #3d4468; user-select: none; padding-right: 10px; font-size: 0.72rem; line-height: 1.75; }
  .cl .code { color: var(--text-muted); font-size: 0.78rem; line-height: 1.75; }

  /* Sidebar styles */
  .path-row { display: flex; align-items: center; gap: 6px; }
  .path-slot { flex: 1; background: var(--surface-dark); border: 1px solid var(--border); border-radius: 5px; padding: 6px; font-family: 'JetBrains Mono', monospace; text-align: center; }
  .path-slot.node-slot { border-color: var(--accent); }
  .ps-label { color: var(--text-dim); font-size: 0.62rem; margin-bottom: 3px; white-space: nowrap; }
  .ps-val { color: var(--text-bright); font-size: 0.95rem; font-weight: 700; }
  .ps-val.faint { color: var(--text-faint, #444); }
  .path-op { color: var(--text-dim); font-size: 0.78rem; font-weight: 600; flex-shrink: 0; white-space: nowrap; }

  .good-badge { margin-top: 6px; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 5px; display: none; }
  .good-badge.is-good  { display: block; background: #052e16; color: #4ade80; border: 1px solid #16a34a; }
  .good-badge.not-good { display: block; background: #1a1a2e; color: #7c7c8a; border: 1px solid #3a3a5c; }

  .count-display { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 0; }
  .count-num { font-size: 2.2rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: #4ade80; line-height: 1; text-shadow: 0 0 20px rgba(74,222,128,0.4); }
  .count-label { font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; }
  .count-label strong { color: var(--text-bright); display: block; }

  .result-badge-sb { font-size: 0.82rem; font-weight: 700; padding: 7px 12px; border-radius: 6px; text-align: center; background: #052e16; color: #4ade80; border: 1px solid #16a34a; display: none; }

  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }

  .kw  { color: var(--purple); }
  .fn  { color: var(--blue); }
  .bi  { color: var(--orange); }
  .cm  { color: #3d4468; font-style: italic; }
  .op  { color: var(--text); }
  .nm  { color: #f7768e; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="preset-sel" onchange="applyPreset()">
      <option value="3,1,4,3,null,1,5">Example 1: [3,1,4,3,null,1,5] &rarr; 4</option>
      <option value="3,3,null,4,2">Example 2: [3,3,null,4,2] &rarr; 3</option>
      <option value="1">Single node &rarr; 1</option>
      <option value="5,3,7,1,4,6,8">All good (sorted)</option>
      <option value="5,4,8,11,null,13,4,7,2,null,null,null,1">Deep tree</option>
    </select>
  </div>
  <div>
    <label>Tree (level-order, null for empty)</label>
    <input id="inp-tree" type="text" value="3,1,4,3,null,1,5" style="width:240px" />
  </div>
  <button class="vi-btn-run" onclick="build()">Build &amp; Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Count Good Nodes in Binary Tree</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="desc" style="font-size:13px;color:var(--text-muted);text-align:center;max-width:560px;min-height:36px;line-height:1.5;">Choose a preset and click Build &amp; Run.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Path Check</div>
      <div class="path-row">
        <div class="path-slot">
          <div class="ps-label">max_so_far</div>
          <div class="ps-val faint" id="rv-max">&mdash;</div>
        </div>
        <div class="path-op">&le;?</div>
        <div class="path-slot node-slot">
          <div class="ps-label">node.val</div>
          <div class="ps-val" id="rv-val">&mdash;</div>
        </div>
      </div>
      <div class="good-badge" id="good-badge"></div>
    </div>
    <div>
      <div class="sidebar-title">Good Nodes Found</div>
      <div class="count-display">
        <div class="count-num" id="good-count">0</div>
        <div class="count-label"><strong id="count-strong">good nodes</strong>val &ge; max ancestor</div>
      </div>
      <div class="result-badge-sb" id="result-badge"></div>
    </div>
    <div>
      <div class="sidebar-title">Legend</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1e2130" stroke="#2d3148" stroke-width="2"/></svg>Unvisited</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1a1a3a" stroke="#818cf8" stroke-width="3"/></svg>Active</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#052e16" stroke="#16a34a" stroke-width="2.5"/></svg>Good node</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="2"/></svg>Not good</div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&larr; Prev</button>
  <button id="stepBtn" class="btn-step">Step &rarr;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
const CODE_LINES = [
  [1,  `<span class="kw">def</span> <span class="fn">goodNodes</span><span class="op">(</span>root<span class="op">):</span>`],
  [2,  `    <span class="kw">def</span> <span class="fn">dfs</span><span class="op">(</span>node<span class="op">,</span> max_so_far<span class="op">):</span>`],
  [3,  `        <span class="kw">if not</span> node<span class="op">:</span>`],
  [4,  `            <span class="kw">return</span> <span class="nm">0</span>              <span class="cm"># null → 0 good nodes</span>`],
  [0,  ``],
  [5,  `        is_good <span class="op">=</span> node.val <span class="op">&gt;=</span> max_so_far`],
  [6,  `        count   <span class="op">=</span> <span class="nm">1</span> <span class="kw">if</span> is_good <span class="kw">else</span> <span class="nm">0</span>`],
  [0,  ``],
  [7,  `        new_max <span class="op">=</span> <span class="bi">max</span><span class="op">(</span>max_so_far<span class="op">,</span> node.val<span class="op">)</span>`],
  [8,  `        count  <span class="op">+=</span> <span class="fn">dfs</span><span class="op">(</span>node.left<span class="op">,</span>  new_max<span class="op">)</span>`],
  [9,  `        count  <span class="op">+=</span> <span class="fn">dfs</span><span class="op">(</span>node.right<span class="op">,</span> new_max<span class="op">)</span>`],
  [10, `        <span class="kw">return</span> count`],
  [0,  ``],
  [11, `    <span class="kw">return</span> <span class="fn">dfs</span><span class="op">(</span>root<span class="op">,</span> <span class="bi">float</span><span class="op">(</span><span class="nm">'-inf'</span><span class="op">))</span>`],
];

const COLORS = {
  idle:     { fill: '#1e2130', stroke: '#2d3148', text: '#565f89', sw: 2 },
  active:   { fill: '#1a1a3a', stroke: '#818cf8', text: '#c4b5fd', sw: 3.5 },
  good:     { fill: '#052e16', stroke: '#16a34a', text: '#4ade80', sw: 2.5 },
  not_good: { fill: '#1a1a2e', stroke: '#3a3a5c', text: '#7c7c8a', sw: 2 },
};

let nodeMap = {};
let R = 22;
let VW = 800, VH = 300;
let prevLines = [];

function parseLevelOrder(s) {
  return s.split(',').map(t => t.trim()).map(t =>
    (t === '' || t.toLowerCase() === 'null' || t === 'n') ? null : Number(t)
  );
}

let nextId = 0;
function buildTree(vals) {
  nodeMap = {};
  nextId = 0;
  if (!vals.length || vals[0] === null) return null;
  const make = val => {
    const n = { id: nextId++, val, left: null, right: null, x: 0, y: 0, depth: 0 };
    nodeMap[n.id] = n;
    return n;
  };
  const root = make(vals[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < vals.length) {
    const cur = queue.shift();
    if (i < vals.length) {
      if (vals[i] !== null) { cur.left = make(vals[i]); cur.left.depth = cur.depth + 1; queue.push(cur.left); }
      i++;
    }
    if (i < vals.length) {
      if (vals[i] !== null) { cur.right = make(vals[i]); cur.right.depth = cur.depth + 1; queue.push(cur.right); }
      i++;
    }
  }
  return root;
}

function layout(root) {
  let idx = 0, maxD = 0;
  function inorder(n) {
    if (!n) return;
    inorder(n.left);
    n._inIdx = idx++;
    if (n.depth > maxD) maxD = n.depth;
    inorder(n.right);
  }
  inorder(root);
  const count = idx;
  const xSpace = Math.max(60, Math.min(110, 680 / Math.max(1, count)));
  const ySpace = 76;
  const padX = 50, padY = 36;
  VW = Math.max(480, padX * 2 + (count - 1) * xSpace);
  VH = padY * 2 + maxD * ySpace + R * 2 + 44;
  for (const id in nodeMap) {
    const n = nodeMap[id];
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + 26 + n.depth * ySpace + R;
  }
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id;
  return g;
}

function renderSVG(root) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  R = VW > 650 ? 22 : 18;

  const edgeG = svgG('edges');
  const nodeG = svgG('nodes');
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  (function drawEdges(n) {
    if (!n) return;
    [n.left, n.right].forEach(c => {
      if (!c) return;
      edgeG.appendChild(svgEl('line', {
        id: `edge-${n.id}-${c.id}`,
        x1: n.x, y1: n.y, x2: c.x, y2: c.y,
        stroke: '#2d3148', 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);

  for (const id in nodeMap) {
    const n = nodeMap[id];
    const g = svgG(`node-g-${n.id}`);
    g.appendChild(svgEl('circle', {
      id: `nc-${n.id}`, cx: n.x, cy: n.y, r: R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': COLORS.idle.sw,
    }));
    const t = svgEl('text', {
      id: `nt-${n.id}`, x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.round(R * 0.75), 'font-weight': 'bold',
      'font-family': 'JetBrains Mono, monospace',
    });
    t.textContent = n.val;
    g.appendChild(t);
    const at = svgEl('text', {
      id: `na-${n.id}`, x: n.x, y: n.y - R - 8,
      'text-anchor': 'middle', 'dominant-baseline': 'auto',
      fill: '#818cf8', 'font-size': 10, 'font-weight': '600',
      'font-family': 'JetBrains Mono, monospace',
      opacity: 0,
    });
    at.textContent = '';
    g.appendChild(at);
    nodeG.appendChild(g);
  }
}

function simulate(root) {
  const stateMap = {};
  for (const id in nodeMap) stateMap[id] = 'idle';
  const out = [];
  let goodCount = 0;

  function snap(phase, desc, lines, activeId, maxSoFar) {
    out.push({
      phase, desc, lines: lines || [],
      stateMap: { ...stateMap },
      activeId: activeId !== undefined ? activeId : null,
      maxSoFar: maxSoFar !== undefined ? maxSoFar : null,
      goodCount,
    });
  }

  function dfs(node, maxSoFar) {
    if (!node) {
      snap('Base', 'Reached null → return 0.', [3, 4]);
      return 0;
    }

    stateMap[node.id] = 'active';
    snap('Enter', `Visit node ${node.val}. max_so_far from parent = ${maxSoFar === -Infinity ? '-∞' : maxSoFar}.`, [2, 5], node.id, maxSoFar);

    const isGood = node.val >= maxSoFar;
    snap('Check', `${node.val} ${isGood ? '≥' : '<'} ${maxSoFar === -Infinity ? '-∞' : maxSoFar} → node ${node.val} is ${isGood ? 'GOOD ✓' : 'NOT good ✗'}.`, [5, 6], node.id, maxSoFar);

    if (isGood) {
      goodCount++;
      stateMap[node.id] = 'good';
      snap('Good', `Node ${node.val} is good! Running total: ${goodCount}.`, [6], node.id, maxSoFar);
    } else {
      stateMap[node.id] = 'not_good';
      snap('NotGood', `Node ${node.val} is not good (${node.val} < ${maxSoFar}). Not counted.`, [6], node.id, maxSoFar);
    }

    const newMax = Math.max(maxSoFar, node.val);
    snap('NewMax', `new_max = max(${maxSoFar === -Infinity ? '-∞' : maxSoFar}, ${node.val}) = ${newMax}. Recurse left with max=${newMax}.`, [7, 8], node.id, maxSoFar);

    dfs(node.left, newMax);

    snap('Right', `Back at node ${node.val}. Now recurse right with max=${newMax}.`, [9], node.id, maxSoFar);
    dfs(node.right, newMax);

    snap('Return', `Node ${node.val} done. Subtree contributed to running count.`, [10], node.id, maxSoFar);
  }

  snap('Start', `Begin DFS from root. Initial max_so_far = -∞ (no ancestors yet).`, [1, 11]);
  dfs(root, -Infinity);
  snap('Done', `All nodes visited. Total good nodes = ${goodCount}.`, [], null, null);
  return out;
}

function setNodeColor(id, colorKey, animate) {
  const c = COLORS[colorKey] || COLORS.idle;
  const nc = document.getElementById('nc-' + id);
  const nt = document.getElementById('nt-' + id);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: 0.28, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke, 'stroke-width': c.sw } });
    if (nt) gsap.to(nt, { duration: 0.28, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill);
    nc.setAttribute('stroke', c.stroke);
    nc.setAttribute('stroke-width', c.sw);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

function setCodeLines(oldLines, newLines, animate) {
  const HL_BG   = 'rgba(99,102,241,0.16)';
  const NO_BG   = 'rgba(99,102,241,0)';
  const HL_BORD = '#818cf8';
  const NO_BORD = 'transparent';
  (oldLines || []).filter(n => !(newLines || []).includes(n)).forEach(n => {
    const el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: NO_BG, borderLeftColor: NO_BORD, duration: 0.2 });
    else { el.style.backgroundColor = ''; el.style.borderLeftColor = ''; }
  });
  (newLines || []).filter(n => !(oldLines || []).includes(n)).forEach(n => {
    const el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: 0.2, delay: 0.05 });
    else { el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD; }
  });
}

function applyStep(s, animate) {
  Object.entries(s.stateMap).forEach(([id, state]) => {
    const colorKey = (state === 'active' && +id === s.activeId) ? 'active' : state;
    setNodeColor(+id, colorKey, animate);
  });

  for (const id in nodeMap) {
    const at = document.getElementById('na-' + id);
    if (!at) continue;
    if (s.activeId !== null && +id === s.activeId && s.maxSoFar !== null) {
      const maxStr = s.maxSoFar === -Infinity ? 'max=-∞' : `max=${s.maxSoFar}`;
      at.textContent = maxStr;
      if (animate) gsap.to(at, { opacity: 1, duration: 0.2 });
      else at.setAttribute('opacity', '1');
    } else {
      at.textContent = '';
      at.setAttribute('opacity', '0');
    }
  }

  const setPS = function(id, val, faint) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = val;
    el.className = 'ps-val' + (faint ? ' faint' : '');
    if (animate) gsap.fromTo(el, { opacity: 0.3 }, { opacity: 1, duration: 0.18 });
  };
  if (s.activeId !== null) {
    const node = nodeMap[s.activeId];
    const maxTxt = s.maxSoFar === -Infinity ? '-∞' : (s.maxSoFar === null ? '—' : String(s.maxSoFar));
    setPS('rv-max', maxTxt, s.maxSoFar === -Infinity || s.maxSoFar === null);
    setPS('rv-val', node ? String(node.val) : '—', false);
  } else {
    setPS('rv-max', '—', true);
    setPS('rv-val', '—', true);
  }

  const badge = document.getElementById('good-badge');
  if (badge) {
    badge.className = 'good-badge';
    badge.textContent = '';
    if (s.phase === 'Good') {
      badge.className = 'good-badge is-good';
      badge.textContent = '✓ Good — val ≥ max ancestor';
    } else if (s.phase === 'NotGood') {
      badge.className = 'good-badge not-good';
      badge.textContent = '✗ Not good — val < max';
    }
  }

  const countEl = document.getElementById('good-count');
  if (countEl) {
    const prev = parseInt(countEl.textContent) || 0;
    if (animate && s.goodCount !== prev) {
      gsap.fromTo(countEl, { scale: 0.85, color: '#4ade80' }, { scale: 1, color: '#4ade80', duration: 0.3, ease: 'back.out(1.5)' });
    }
    countEl.textContent = s.goodCount;
  }

  const rb = document.getElementById('result-badge');
  if (rb) {
    if (s.phase === 'Done') {
      rb.style.display = 'block';
      rb.textContent = `✓ Answer: ${s.goodCount} good node${s.goodCount !== 1 ? 's' : ''}`;
      if (animate) gsap.from(rb, { opacity: 0, scale: 0.9, duration: 0.35, ease: 'back.out(1.7)' });
    } else {
      rb.style.display = 'none';
    }
  }

  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

function applyPreset() {
  const sel = document.getElementById('preset-sel');
  document.getElementById('inp-tree').value = sel.value;
}

var PRESET_VALUES = [
  '3,1,4,3,null,1,5',
  '3,3,null,4,2',
  '1',
  '5,3,7,1,4,6,8',
  '5,4,8,11,null,13,4,7,2,null,null,null,1',
];

function randomExample() {
  var idx = Math.floor(Math.random() * PRESET_VALUES.length);
  document.getElementById('preset-sel').selectedIndex = idx;
  document.getElementById('inp-tree').value = PRESET_VALUES[idx];
  build();
}

function build() {
  const txt = document.getElementById('inp-tree').value.trim();
  const vals = parseLevelOrder(txt);
  buildCodePanel();
  const root = buildTree(vals);
  if (!root) {
    document.getElementById('tree-svg').innerHTML = '';
    document.getElementById('desc').textContent = 'Empty tree — nothing to traverse.';
    return;
  }
  layout(root);
  renderSVG(root);
  prevLines = [];
  document.getElementById('good-badge').className = 'good-badge';
  document.getElementById('good-count').textContent = '0';
  document.getElementById('result-badge').style.display = 'none';
  nav.load(simulate(root));
}

var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    document.getElementById('phase-badge').textContent = snap.phase;
    document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
    var sd = document.getElementById('desc');
    if (sd) {
      if (cur > 0) gsap.fromTo(sd, { opacity: 0.5 }, { opacity: 1, duration: 0.15 });
      sd.textContent = snap.desc;
    }
  }
});

document.getElementById('resetBtn').addEventListener('click', function() { build(); });

build();
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
