<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick Sort — Lomuto Partition</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run  { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; overflow-y: auto; }

  #bracket-row { display: flex; gap: 4px; min-height: 18px; align-items: flex-end; margin-bottom: 1px; }
  .br-cell { width: 48px; flex-shrink: 0; text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--accent); line-height: 1; }

  #ptr-row { display: flex; gap: 4px; min-height: 16px; align-items: flex-end; margin-bottom: 3px; }
  .ptr-cell { width: 48px; flex-shrink: 0; text-align: center; font-size: 0.65rem; font-weight: 700; line-height: 1; }

  #array-row { display: flex; gap: 4px; }
  .arr-cell { display: flex; flex-direction: column; align-items: center; width: 48px; flex-shrink: 0; }
  .arr-box { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; font-weight: 700; background: var(--bg); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .arr-box.pivot    { background: #f59e0b22; border-color: #f59e0b; color: #f59e0b; }
  .arr-box.i-ptr    { background: #3b82f622; border-color: #3b82f6; color: #3b82f6; }
  .arr-box.j-ptr    { background: #ef444422; border-color: #ef4444; color: #ef4444; }
  .arr-box.sorted   { background: #22c55e22; border-color: #22c55e; color: #22c55e; }
  .arr-box.in-range { border-color: var(--accent); }
  .arr-idx { font-size: 0.65rem; color: var(--text-dim); margin-top: 3px; }

  #msg-box { padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; min-height: 36px; width: 100%; max-width: 560px; text-align: center; }

  #legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .li { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-dim); }
  .ld { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }
  .ld-p { border-color: #f59e0b; background: #f59e0b22; }
  .ld-i { border-color: #3b82f6; background: #3b82f622; }
  .ld-j { border-color: #ef4444; background: #ef444422; }
  .ld-s { border-color: #22c55e; background: #22c55e22; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }

  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value="3,6,8,10,1,2,1">Mixed [3,6,8,10,1,2,1]</option>
      <option value="9,8,7,6,5,4,3,2,1">Reverse sorted ↓</option>
      <option value="1,2,3,4,5,6,7,8,9">Already sorted ↑</option>
      <option value="5,3,5,1,5,2,5">Many duplicates</option>
      <option value="4,2,7,1,9,3">Small array</option>
      <option value="2,2,2,2,2">All same</option>
      <option value="5,1">Two elements</option>
      <option value="42">Single element</option>
    </select>
  </div>
  <div>
    <label>Array</label>
    <input id="arrInput" type="text" value="3,6,8,10,1,2,1" style="width:180px;" placeholder="e.g. 3,6,8,10,1,2,1" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Quick Sort — Lomuto Partition</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="bracket-row"></div>
    <div id="ptr-row"></div>
    <div id="array-row"></div>
    <div id="msg-box">Press Run to start.</div>
    <div id="legend">
      <div class="li"><div class="ld ld-p"></div>Pivot (P)</div>
      <div class="li"><div class="ld ld-i"></div>i (boundary)</div>
      <div class="li"><div class="ld ld-j"></div>j (scanner)</div>
      <div class="li"><div class="ld ld-s"></div>Sorted</div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Variables</div>
      <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var steps = [];
var curIdx = 0;
var playInterval = null;

var codeLines = [
  { id: 'cl0',  n: 1,  t: '<span class="kw">quicksort</span>(A, lo, hi):' },
  { id: 'cl1',  n: 2,  t: '  <span class="kw">if</span> lo &lt; hi:' },
  { id: 'cl2',  n: 3,  t: '    p = partition(A, lo, hi)' },
  { id: 'cl3',  n: 4,  t: '    <span class="kw">quicksort</span>(A, lo, p-1)' },
  { id: 'cl4',  n: 5,  t: '    <span class="kw">quicksort</span>(A, p+1, hi)' },
  { id: 'cl5',  n: 6,  t: '' },
  { id: 'cl6',  n: 7,  t: '<span class="kw">def</span> <span class="nb">partition</span>(arr, lo, hi):' },
  { id: 'cl7',  n: 8,  t: '  pivot = arr[hi]' },
  { id: 'cl8',  n: 9,  t: '  i = lo' },
  { id: 'cl9',  n: 10, t: '  <span class="kw">for</span> j <span class="kw">in</span> range(lo, hi):' },
  { id: 'cl10', n: 11, t: '    <span class="kw">if</span> arr[j] &lt;= pivot:' },
  { id: 'cl11', n: 12, t: '      arr[i], arr[j] = arr[j], arr[i]' },
  { id: 'cl12', n: 13, t: '      i += 1' },
  { id: 'cl13', n: 14, t: '  arr[i], arr[hi] = arr[hi], arr[i]' },
  { id: 'cl14', n: 15, t: '  <span class="kw">return</span> i' },
];

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = line.id;
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  document.getElementById('prevBtn').addEventListener('click', function() {
    stopPlay();
    if (curIdx > 0) { curIdx--; render(curIdx); }
  });
  document.getElementById('stepBtn').addEventListener('click', function() {
    stopPlay();
    if (curIdx < steps.length - 1) { curIdx++; render(curIdx); }
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    stopPlay();
    curIdx = 0;
    render(0);
  });
  document.getElementById('playBtn').addEventListener('click', function() {
    if (playInterval) { stopPlay(); } else { startPlay(); }
  });

  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });

  buildAndRun();
});

function startPlay() {
  var speed = parseInt(document.getElementById('speedSel').value) || 400;
  document.getElementById('playBtn').textContent = 'Pause';
  playInterval = setInterval(function() {
    if (curIdx >= steps.length - 1) { stopPlay(); return; }
    curIdx++;
    render(curIdx);
  }, speed);
}

function stopPlay() {
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
  document.getElementById('playBtn').textContent = 'Play';
}

function buildAndRun() {
  stopPlay();
  var raw = document.getElementById('arrInput').value;
  var arr = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
  if (!arr.length) return;

  steps = [];
  var sortedSet = new Set();

  function push(A, lo, hi, pivotIdx, iPtr, jPtr, codeLine, msg) {
    steps.push({
      arr: A.slice(),
      lo: lo, hi: hi,
      pivotIdx: pivotIdx,
      iPtr: iPtr,
      jPtr: jPtr,
      sorted: new Set(sortedSet),
      codeLine: codeLine,
      msg: msg
    });
  }

  function doPartition(A, lo, hi) {
    var pivotVal = A[hi];
    push(A, lo, hi, hi, -1, -1, 7, 'pivot = arr[' + hi + '] = ' + pivotVal);

    var i = lo;
    push(A, lo, hi, hi, i, -1, 8, 'i = lo = ' + i);

    for (var j = lo; j < hi; j++) {
      push(A, lo, hi, hi, i, j, 9, 'j = ' + j + ' → arr[' + j + '] = ' + A[j]);
      push(A, lo, hi, hi, i, j, 10, 'arr[' + j + '] = ' + A[j] + ' <= pivot ' + pivotVal + '? ' + (A[j] <= pivotVal ? 'Yes' : 'No'));

      if (A[j] <= pivotVal) {
        if (i !== j) {
          var tmp = A[i]; A[i] = A[j]; A[j] = tmp;
          push(A, lo, hi, hi, i, j, 11, 'arr[i], arr[j] = arr[j], arr[i]  → [' + A.slice(lo, hi + 1).join(',') + ']');
        } else {
          push(A, lo, hi, hi, i, j, 11, 'i === j, no swap needed');
        }
        i++;
        push(A, lo, hi, hi, i, j, 12, 'i += 1  → i = ' + i);
      }
    }

    if (i !== hi) {
      var tmp2 = A[i]; A[i] = A[hi]; A[hi] = tmp2;
    }
    sortedSet.add(i);
    push(A, lo, hi, i, i, -1, 13, 'arr[i], arr[hi] = arr[hi], arr[i]  → pivot ' + pivotVal + ' at index ' + i);
    push(A, lo, hi, i, -1, -1, 14, 'return ' + i);

    return i;
  }

  function quicksort(A, lo, hi) {
    push(A, lo, hi, -1, -1, -1, 0, 'quicksort(A, ' + lo + ', ' + hi + ')');
    push(A, lo, hi, -1, -1, -1, 1, lo < hi ? 'lo(' + lo + ') < hi(' + hi + ') → continue' : 'lo(' + lo + ') >= hi(' + hi + ') → base case');

    if (lo >= hi) {
      if (lo === hi) sortedSet.add(lo);
      return;
    }

    push(A, lo, hi, -1, -1, -1, 2, 'Calling partition(A, ' + lo + ', ' + hi + ')');
    var p = doPartition(A, lo, hi);

    push(A, 0, A.length - 1, p, -1, -1, 3, 'Left subarray: quicksort(A, ' + lo + ', ' + (p - 1) + ')');
    quicksort(A, lo, p - 1);

    push(A, 0, A.length - 1, p, -1, -1, 4, 'Right subarray: quicksort(A, ' + (p + 1) + ', ' + hi + ')');
    quicksort(A, p + 1, hi);
  }

  quicksort(arr, 0, arr.length - 1);

  for (var k = 0; k < arr.length; k++) sortedSet.add(k);
  steps.push({
    arr: arr.slice(),
    lo: 0, hi: arr.length - 1,
    pivotIdx: -1, iPtr: -1, jPtr: -1,
    sorted: new Set(sortedSet),
    codeLine: -1,
    msg: '✓ Sorted: [' + arr.join(', ') + ']'
  });

  curIdx = 0;
  render(0);
}

function getPhase(s) {
  if (s.codeLine < 0) return 'Done';
  if (s.codeLine <= 4) return 'Quicksort';
  return 'Partition';
}

function render(idx) {
  if (!steps.length) return;
  idx = Math.max(0, Math.min(idx, steps.length - 1));
  curIdx = idx;

  var s = steps[idx];
  var n = s.arr.length;

  // bracket row
  var brRow = document.getElementById('bracket-row');
  brRow.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var bc = document.createElement('div');
    bc.className = 'br-cell';
    if (s.lo >= 0 && s.hi >= 0 && s.lo <= s.hi) {
      if (i === s.lo && i === s.hi)  bc.textContent = '[ ]';
      else if (i === s.lo)           bc.textContent = '[';
      else if (i === s.hi)           bc.textContent = ']';
      else if (i > s.lo && i < s.hi) bc.textContent = '─';
    }
    brRow.appendChild(bc);
  }

  // pointer label row
  var ptrRow = document.getElementById('ptr-row');
  ptrRow.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var pc = document.createElement('div');
    pc.className = 'ptr-cell';
    var lbls = [];
    var col = '';
    if (i === s.pivotIdx) { lbls.push('P');  col = col || '#f59e0b'; }
    if (i === s.iPtr)     { lbls.push('i');  col = col || '#3b82f6'; }
    if (i === s.jPtr)     { lbls.push('j');  col = col || '#ef4444'; }
    pc.textContent = lbls.join('/');
    pc.style.color = col;
    ptrRow.appendChild(pc);
  }

  // array row
  var arrRow = document.getElementById('array-row');
  arrRow.innerHTML = '';
  s.arr.forEach(function(val, i) {
    var cell = document.createElement('div');
    cell.className = 'arr-cell';

    var box = document.createElement('div');
    box.className = 'arr-box';
    box.textContent = val;

    var inRange = (s.lo >= 0 && s.hi >= 0 && i >= s.lo && i <= s.hi);

    if (s.sorted.has(i))        box.classList.add('sorted');
    else if (i === s.pivotIdx)  box.classList.add('pivot');
    else if (i === s.iPtr)      box.classList.add('i-ptr');
    else if (i === s.jPtr)      box.classList.add('j-ptr');
    else if (inRange)           box.classList.add('in-range');

    var idxEl = document.createElement('div');
    idxEl.className = 'arr-idx';
    idxEl.textContent = i;

    cell.appendChild(box);
    cell.appendChild(idxEl);
    arrRow.appendChild(cell);
  });

  // message
  document.getElementById('msg-box').textContent = s.msg;

  // step counter + phase badge
  document.getElementById('step-counter').textContent = 'Step ' + (idx + 1) + ' / ' + steps.length;
  document.getElementById('phase-badge').textContent = getPhase(s);

  // code highlight
  for (var l = 0; l <= 14; l++) {
    var el = document.getElementById('cl' + l);
    if (el) el.classList.remove('hl');
  }
  if (s.codeLine >= 0 && s.codeLine <= 14) {
    var el2 = document.getElementById('cl' + s.codeLine);
    if (el2) el2.classList.add('hl');
  }

  // sidebar variables
  var html = '';
  html += '<div class="var-item"><span class="var-key">lo</span> = <span class="var-val">' + s.lo + '</span></div>';
  html += '<div class="var-item"><span class="var-key">hi</span> = <span class="var-val">' + s.hi + '</span></div>';
  if (s.pivotIdx >= 0) {
    html += '<div class="var-item"><span class="var-key">pivot</span> = <span class="var-val">' + s.arr[s.pivotIdx] + '</span></div>';
  }
  if (s.iPtr >= 0) {
    html += '<div class="var-item"><span class="var-key">i</span> = <span class="var-val">' + s.iPtr + '</span></div>';
  }
  if (s.jPtr >= 0) {
    html += '<div class="var-item"><span class="var-key">j</span> = <span class="var-val">' + s.jPtr + '</span></div>';
  }
  html += '<div class="var-item"><span class="var-key">sorted</span> = <span class="var-val">' + s.sorted.size + '</span></div>';
  document.getElementById('vars-items').innerHTML = html || '<span style="color:var(--text-dim);">—</span>';
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  document.getElementById('arrInput').value = sel.value;
  buildAndRun();
}

function randomExample() {
  var n = 5 + Math.floor(Math.random() * 5);
  var arr = [];
  for (var i = 0; i < n; i++) arr.push(1 + Math.floor(Math.random() * 20));
  document.getElementById('arrInput').value = arr.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}
</script>
</body>
</html>
