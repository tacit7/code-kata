<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick Sort — Lomuto Partition</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run  { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px 20px; gap: 4px; overflow-y: auto; }

  /* Array chrome */
  #bracket-row { display: flex; gap: 4px; min-height: 18px; align-items: flex-end; }
  .br-cell { width: 48px; flex-shrink: 0; text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--accent); line-height: 1; }

  #ptr-row { display: flex; gap: 4px; min-height: 18px; align-items: flex-end; margin-top: 2px; }
  .ptr-cell { width: 48px; flex-shrink: 0; text-align: center; font-size: 0.6rem; font-weight: 700; line-height: 1; }

  #array-row { display: flex; gap: 4px; margin-top: 2px; }
  .arr-cell { display: flex; flex-direction: column; align-items: center; width: 48px; flex-shrink: 0; }
  .arr-box { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; font-weight: 700; background: var(--bg); transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s; }
  .arr-idx { font-size: 0.6rem; color: var(--text-dim); margin-top: 3px; }

  /* Zone colors — distinct from "sorted" green */
  .arr-box.le-zone    { background: rgba(22,163,74,0.12); border-color: #16a34a; color: #86efac; }
  .arr-box.gt-zone    { background: rgba(249,115,22,0.12); border-color: #f97316; color: #fdba74; }
  .arr-box.unk-zone   { background: var(--bg); border-color: #334155; color: var(--text-muted); }
  .arr-box.pivot-held { background: rgba(245,158,11,0.14); border-color: #f59e0b; color: #f59e0b; }
  .arr-box.sorted     { background: rgba(34,197,94,0.18); border-color: #22c55e; color: #22c55e; }
  .arr-box.in-range   { border-color: var(--accent); color: var(--text); }
  .arr-box.outside    { background: var(--bg); border-color: #1e293b; color: #334155; opacity: 0.4; }

  /* Zones label row */
  #zones-row { display: flex; gap: 4px; min-height: 14px; margin-top: 2px; margin-bottom: 8px; }
  .zone-lbl { width: 48px; flex-shrink: 0; text-align: center; font-size: 0.58rem; font-weight: 700; letter-spacing: .02em; line-height: 1; }

  /* Decision panel */
  #decision-panel { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: none; flex-direction: column; gap: 3px; margin-top: 4px; }
  .dp-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 2px; }
  .dp-expr  { font-family: monospace; color: var(--text-muted); font-size: 0.78rem; }
  .dp-vals  { font-family: monospace; font-size: 1.05rem; font-weight: 700; color: var(--text); }
  .dp-result { font-weight: 700; font-size: 0.9rem; }
  .dp-action { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--border-soft); line-height: 1.4; }

  #msg-box { width: 100%; max-width: 520px; padding: 8px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; min-height: 34px; text-align: center; color: var(--text-muted); line-height: 1.4; margin-top: 4px; }

  #legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .li { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-dim); }
  .ld { width: 11px; height: 11px; border-radius: 3px; border: 2px solid; flex-shrink: 0; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 310px; min-width: 120px; max-width: 500px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.73rem; line-height: 1.8; transition: all 0.15s; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .cl-hint { font-size: 8.5px; color: #3b4261; margin-left: 6px; align-self: center; }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.68rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .sidebar-section { }
  .sidebar-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 3px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }
  .var-hint { display: block; font-size: 9px; color: #3b4261; line-height: 1.2; margin-top: 1px; }

  .stack-frame { font-size: 10px; font-family: monospace; padding: 2px 0; border-bottom: 1px solid var(--border-soft); }
  .stack-frame:last-child { border-bottom: none; }
  .stack-fn { color: var(--blue); }
  .stack-args { color: var(--text-dim); }
  .stack-frame.active { color: var(--text); }
  .stack-frame.active .stack-fn { color: var(--accent); }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { opacity: 0.85; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value="3,6,8,10,1,2,1">Mixed [3,6,8,10,1,2,1]</option>
      <option value="9,8,7,6,5,4,3,2,1">Reverse sorted ↓</option>
      <option value="1,2,3,4,5,6,7,8,9">Already sorted ↑</option>
      <option value="5,3,5,1,5,2,5">Many duplicates</option>
      <option value="4,2,7,1,9,3">Small array</option>
      <option value="2,2,2,2,2">All same</option>
      <option value="5,1">Two elements</option>
      <option value="42">Single element</option>
    </select>
  </div>
  <div>
    <label>Array</label>
    <input id="arrInput" type="text" value="3,6,8,10,1,2,1" style="width:180px;" placeholder="e.g. 3,6,8,10,1,2,1" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Quick Sort — Lomuto Partition</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="bracket-row"></div>
    <div id="ptr-row"></div>
    <div id="array-row"></div>
    <div id="zones-row"></div>
    <div id="decision-panel">
      <div class="dp-title">Comparing</div>
      <div class="dp-expr" id="dp-expr"></div>
      <div class="dp-vals" id="dp-vals"></div>
      <div class="dp-result" id="dp-result"></div>
      <div class="dp-action" id="dp-action"></div>
    </div>
    <div id="msg-box">Press Run to start.</div>
    <div id="legend">
      <div class="li"><div class="ld" style="border-color:#f59e0b;background:rgba(245,158,11,0.14)"></div>pivot</div>
      <div class="li"><div class="ld" style="border-color:#16a34a;background:rgba(22,163,74,0.12)"></div>≤ pivot zone</div>
      <div class="li"><div class="ld" style="border-color:#f97316;background:rgba(249,115,22,0.12)"></div>&gt; pivot zone</div>
      <div class="li"><div class="ld" style="border-color:#334155;background:var(--bg)"></div>unknown</div>
      <div class="li"><div class="ld" style="border-color:#22c55e;background:rgba(34,197,94,0.18)"></div>sorted</div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Variables</div>
      <div id="vars-items"><span style="color:var(--text-dim)">—</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Counters</div>
      <div id="counters-items"><span style="color:var(--text-dim)">—</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Call Stack</div>
      <div id="stack-items"><span style="color:var(--text-dim)">—</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var steps = [];
var curIdx = 0;
var playInterval = null;
var lastRenderedIdx = -1;

var CODE_LINES = [
  { id:'cl0',  n:1,  t:'<span class="kw">def</span> <span class="nb">quicksort</span>(arr, lo, hi):', hint:'' },
  { id:'cl1',  n:2,  t:'  <span class="kw">if</span> lo &lt; hi:', hint:'' },
  { id:'cl2',  n:3,  t:'    p = partition(arr, lo, hi)', hint:'' },
  { id:'cl3',  n:4,  t:'    <span class="kw">quicksort</span>(arr, lo, p-1)', hint:'' },
  { id:'cl4',  n:5,  t:'    <span class="kw">quicksort</span>(arr, p+1, hi)', hint:'' },
  { id:'cl5',  n:6,  t:'', hint:'' },
  { id:'cl6',  n:7,  t:'<span class="kw">def</span> <span class="nb">partition</span>(arr, lo, hi):', hint:'' },
  { id:'cl7',  n:8,  t:'  pivot = arr[hi]', hint:'choose last element' },
  { id:'cl8',  n:9,  t:'  boundary = lo', hint:'next ≤ pivot slot' },
  { id:'cl9',  n:10, t:'  <span class="kw">for</span> scan <span class="kw">in</span> range(lo, hi):', hint:'' },
  { id:'cl10', n:11, t:'    <span class="kw">if</span> arr[scan] &lt;= pivot:', hint:'classify' },
  { id:'cl11', n:12, t:'      arr[boundary], arr[scan] =', hint:'' },
  { id:'cl11b',n:'',  t:'        arr[scan], arr[boundary]', hint:'swap into ≤ zone' },
  { id:'cl12', n:13, t:'      boundary += 1', hint:'≤ zone grows' },
  { id:'cl13', n:14, t:'  arr[boundary], arr[hi] =', hint:'' },
  { id:'cl13b',n:'',  t:'    arr[hi], arr[boundary]', hint:'pivot to final pos' },
  { id:'cl14', n:15, t:'  <span class="kw">return</span> boundary', hint:'' },
];

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  CODE_LINES.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = line.id;
    var lnTxt = line.n !== '' ? String(line.n) : '';
    el.innerHTML = '<span class="ln">' + lnTxt + '</span>' + line.t +
      (line.hint ? '<span class="cl-hint">← ' + line.hint + '</span>' : '');
    codeBody.appendChild(el);
  });

  document.getElementById('prevBtn').addEventListener('click', function() {
    stopPlay(); if (curIdx > 0) { curIdx--; render(curIdx); }
  });
  document.getElementById('stepBtn').addEventListener('click', function() {
    stopPlay(); if (curIdx < steps.length - 1) { curIdx++; render(curIdx); }
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    stopPlay(); curIdx = 0; render(0);
  });
  document.getElementById('playBtn').addEventListener('click', function() {
    if (playInterval) stopPlay(); else startPlay();
  });

  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    panel.style.width = Math.min(500, Math.max(120, startW + (startX - e.clientX))) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return; dragging = false; handle.classList.remove('dragging');
  });

  buildAndRun();
});

function startPlay() {
  var speed = parseInt(document.getElementById('speedSel').value) || 400;
  document.getElementById('playBtn').textContent = 'Pause';
  playInterval = setInterval(function() {
    if (curIdx >= steps.length - 1) { stopPlay(); return; }
    curIdx++; render(curIdx);
  }, speed);
}

function stopPlay() {
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
  document.getElementById('playBtn').textContent = 'Play';
}

// ── Simulation ─────────────────────────────────────────────────────────────
function buildAndRun() {
  stopPlay();
  var raw = document.getElementById('arrInput').value;
  var arr = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
  if (!arr.length) return;

  steps = [];
  lastRenderedIdx = -1;
  var sortedSet = new Set();
  var comparisons = 0, swaps = 0;
  var callStack = [];

  function push(A, lo, hi, pivotIdx, iPtr, jPtr, codeLine, msg, decision) {
    steps.push({
      arr: A.slice(), lo: lo, hi: hi,
      pivotIdx: pivotIdx, iPtr: iPtr, jPtr: jPtr,
      sorted: new Set(sortedSet),
      codeLine: codeLine, msg: msg,
      comparisons: comparisons, swaps: swaps,
      callStack: callStack.map(function(f) { return { fn: f.fn, lo: f.lo, hi: f.hi }; }),
      decision: decision || null
    });
  }

  function doPartition(A, lo, hi) {
    callStack.push({ fn: 'partition', lo: lo, hi: hi });

    var pivotVal = A[hi];
    push(A, lo, hi, hi, -1, -1, 7, 'pivot = arr[' + hi + '] = ' + pivotVal);

    var boundary = lo;
    push(A, lo, hi, hi, boundary, -1, 8, 'boundary = lo = ' + boundary + '  (next slot for a value ≤ pivot)');

    for (var scan = lo; scan < hi; scan++) {
      push(A, lo, hi, hi, boundary, scan, 9, 'scan = ' + scan + '  →  arr[' + scan + '] = ' + A[scan]);

      comparisons++;
      var result = A[scan] <= pivotVal;
      push(A, lo, hi, hi, boundary, scan, 10,
        'arr[' + scan + '] (' + A[scan] + ') ≤ pivot (' + pivotVal + ')? ' + (result ? 'YES' : 'NO'),
        { scanIdx: scan, scanVal: A[scan], pivotVal: pivotVal, result: result, boundary: boundary }
      );

      if (result) {
        if (boundary !== scan) {
          var tmp = A[boundary]; A[boundary] = A[scan]; A[scan] = tmp;
          swaps++;
          push(A, lo, hi, hi, boundary, scan, 11,
            'Swap arr[' + boundary + '] ↔ arr[' + scan + ']  →  [' + A.slice(lo, hi + 1).join(', ') + ']');
        } else {
          push(A, lo, hi, hi, boundary, scan, 11, 'boundary === scan, already in the right place');
        }
        boundary++;
        push(A, lo, hi, hi, boundary, scan, 12, 'boundary += 1  →  boundary = ' + boundary + '  (≤ pivot zone grew by one)');
      } else {
        // "No swap" moment — value classified into > zone
        // no extra snap; the color change in the next scan step makes it visible
      }
    }

    // Dedicated "why the final swap works" step
    push(A, lo, hi, hi, boundary, -1, 13,
      'Loop done. Indices [' + lo + '..' + (boundary - 1) + '] are ≤ pivot. ' +
      'Indices [' + boundary + '..' + (hi - 1) + '] are > pivot. ' +
      'Pivot belongs exactly at boundary (' + boundary + ').');

    if (boundary !== hi) {
      var tmp2 = A[boundary]; A[boundary] = A[hi]; A[hi] = tmp2;
      swaps++;
    }
    sortedSet.add(boundary);
    push(A, lo, hi, boundary, boundary, -1, 13,
      'Pivot ' + pivotVal + ' placed at index ' + boundary + ' — its final sorted position.');
    push(A, lo, hi, boundary, -1, -1, 14, 'return boundary = ' + boundary);

    callStack.pop();
    return boundary;
  }

  function quicksort(A, lo, hi) {
    callStack.push({ fn: 'quicksort', lo: lo, hi: hi });

    push(A, lo, hi, -1, -1, -1, 0, 'quicksort(arr, ' + lo + ', ' + hi + ')');
    push(A, lo, hi, -1, -1, -1, 1,
      lo < hi
        ? 'lo(' + lo + ') < hi(' + hi + ')  →  continue'
        : 'lo(' + lo + ') ≥ hi(' + hi + ')  →  base case, one element is always sorted');

    if (lo >= hi) {
      if (lo === hi) sortedSet.add(lo);
      callStack.pop();
      return;
    }

    push(A, lo, hi, -1, -1, -1, 2, 'Calling partition(arr, ' + lo + ', ' + hi + ')');
    var p = doPartition(A, lo, hi);

    push(A, 0, A.length - 1, p, -1, -1, 3, 'Pivot at ' + p + '. Sort left side: quicksort(arr, ' + lo + ', ' + (p - 1) + ')');
    quicksort(A, lo, p - 1);

    push(A, 0, A.length - 1, p, -1, -1, 4, 'Sort right side: quicksort(arr, ' + (p + 1) + ', ' + hi + ')');
    quicksort(A, p + 1, hi);

    callStack.pop();
  }

  quicksort(arr, 0, arr.length - 1);

  for (var k = 0; k < arr.length; k++) sortedSet.add(k);
  steps.push({
    arr: arr.slice(),
    lo: 0, hi: arr.length - 1,
    pivotIdx: -1, iPtr: -1, jPtr: -1,
    sorted: new Set(sortedSet),
    codeLine: -1,
    msg: '✓ Sorted: [' + arr.join(', ') + ']',
    comparisons: comparisons, swaps: swaps,
    callStack: [],
    decision: null
  });

  curIdx = 0;
  render(0);
}

// ── Zone helper ─────────────────────────────────────────────────────────────
function getZone(i, s) {
  if (s.sorted.has(i)) return 'sorted';
  var lo = s.lo, hi = s.hi;
  if (lo < 0 || hi < 0 || i < lo || i > hi) return 'outside';

  var b  = s.iPtr;  // boundary (-1 when not in partition)
  var sc = s.jPtr;  // scan (-1 when not scanning)

  // Pivot held at hi during partition
  if (s.pivotIdx === hi && hi >= 0 && i === hi && !s.sorted.has(hi)) return 'pivot-held';

  // Not in a partition frame
  if (b < 0) return 'in-range';

  // In partition frame
  if (i < b) return 'le-zone';
  if (sc >= 0 && i >= b && i < sc) return 'gt-zone';
  if (i < hi) return 'unk-zone';

  return 'in-range';
}

var ZONE_INFO = {
  'le-zone':    { lbl: '≤ P', color: '#16a34a' },
  'gt-zone':    { lbl: '> P',     color: '#f97316' },
  'unk-zone':   { lbl: '?',       color: '#64748b' },
  'pivot-held': { lbl: 'P',       color: '#f59e0b' },
  'sorted':     { lbl: '✓',  color: '#22c55e' },
  'outside':    { lbl: '',        color: '' },
  'in-range':   { lbl: '',        color: '' }
};

// ── Render ───────────────────────────────────────────────────────────────────
function getPhase(s) {
  if (s.codeLine < 0) return 'Done';
  if (s.codeLine <= 5) return 'Quicksort';
  return 'Partition';
}

function render(idx) {
  if (!steps.length) return;
  idx = Math.max(0, Math.min(idx, steps.length - 1));

  // Detect swap for FLIP animation
  var swapI = -1, swapJ = -1;
  if (idx > lastRenderedIdx && idx > 0) {
    var prev = steps[idx - 1].arr, curr = steps[idx].arr;
    var diffs = [];
    for (var d = 0; d < curr.length; d++) { if (prev[d] !== curr[d]) diffs.push(d); }
    if (diffs.length === 2 && prev[diffs[0]] === curr[diffs[1]] && prev[diffs[1]] === curr[diffs[0]]) {
      swapI = diffs[0]; swapJ = diffs[1];
    }
  }

  var oldRects = {};
  if (swapI !== -1) {
    var oldBoxes = document.querySelectorAll('#array-row .arr-box');
    if (oldBoxes[swapI]) oldRects[swapI] = oldBoxes[swapI].getBoundingClientRect();
    if (oldBoxes[swapJ]) oldRects[swapJ] = oldBoxes[swapJ].getBoundingClientRect();
  }

  lastRenderedIdx = idx;
  curIdx = idx;
  var s = steps[idx];
  var n = s.arr.length;

  // Bracket row
  var brRow = document.getElementById('bracket-row');
  brRow.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var bc = document.createElement('div'); bc.className = 'br-cell';
    if (s.lo >= 0 && s.hi >= 0 && s.lo <= s.hi) {
      if      (i === s.lo && i === s.hi)  bc.textContent = '[ ]';
      else if (i === s.lo)                bc.textContent = '[';
      else if (i === s.hi)                bc.textContent = ']';
      else if (i > s.lo && i < s.hi)     bc.textContent = '─';
    }
    brRow.appendChild(bc);
  }

  // Pointer row — teaching labels
  var ptrRow = document.getElementById('ptr-row');
  ptrRow.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var pc = document.createElement('div'); pc.className = 'ptr-cell';
    var lbls = [], col = '';
    if (i === s.pivotIdx && s.pivotIdx === s.hi && !s.sorted.has(i)) { lbls.push('pivot'); col = '#f59e0b'; }
    if (i === s.iPtr) { lbls.push('next≤'); col = col || '#3b82f6'; }
    if (i === s.jPtr) { lbls.push('check'); col = col || '#ef4444'; }
    if (s.sorted.has(i) && i === s.pivotIdx && s.pivotIdx !== s.hi) { lbls.push('pivot'); col = '#22c55e'; }
    pc.textContent = lbls.join('/');
    pc.style.color = col;
    ptrRow.appendChild(pc);
  }

  // Array row
  var arrRow = document.getElementById('array-row');
  arrRow.innerHTML = '';
  s.arr.forEach(function(val, i) {
    var cell = document.createElement('div'); cell.className = 'arr-cell';
    var box  = document.createElement('div'); box.className = 'arr-box ' + getZone(i, s);
    box.textContent = val;
    var idxEl = document.createElement('div'); idxEl.className = 'arr-idx'; idxEl.textContent = i;
    cell.appendChild(box); cell.appendChild(idxEl);
    arrRow.appendChild(cell);
  });

  // Zones label row
  var zonesRow = document.getElementById('zones-row');
  zonesRow.innerHTML = '';
  s.arr.forEach(function(_, i) {
    var zl = document.createElement('div'); zl.className = 'zone-lbl';
    var info = ZONE_INFO[getZone(i, s)] || { lbl: '', color: '' };
    zl.textContent = info.lbl;
    zl.style.color = info.color;
    zonesRow.appendChild(zl);
  });

  // FLIP swap animation
  if (swapI !== -1 && oldRects[swapI] && oldRects[swapJ]) {
    requestAnimationFrame(function() {
      var newBoxes = document.querySelectorAll('#array-row .arr-box');
      var bI = newBoxes[swapI], bJ = newBoxes[swapJ];
      if (!bI || !bJ) return;
      gsap.killTweensOf([bI, bJ]);
      gsap.fromTo(bI, { x: oldRects[swapJ].left - oldRects[swapI].left }, { x: 0, duration: 0.35, ease: 'power2.out' });
      gsap.fromTo(bJ, { x: oldRects[swapI].left - oldRects[swapJ].left }, { x: 0, duration: 0.35, ease: 'power2.out' });
    });
  }

  // Decision panel
  var dp = document.getElementById('decision-panel');
  if (s.decision) {
    dp.style.display = 'flex';
    var d = s.decision;
    document.getElementById('dp-expr').textContent = 'arr[scan=' + d.scanIdx + '] ≤ pivot';
    document.getElementById('dp-vals').textContent = d.scanVal + ' ≤ ' + d.pivotVal;
    var resEl = document.getElementById('dp-result');
    resEl.textContent = d.result ? '✔ True' : '✘ False';
    resEl.style.color = d.result ? '#22c55e' : '#ef4444';
    document.getElementById('dp-action').textContent = d.result
      ? 'Action: swap arr[boundary=' + d.boundary + '] ↔ arr[scan=' + d.scanIdx + '], then boundary += 1\n        Value moves into the ≤ pivot zone.'
      : 'Action: do nothing. scan moves right.\n        Value stays — classified as > pivot zone.';
  } else {
    dp.style.display = 'none';
  }

  // Message
  document.getElementById('msg-box').textContent = s.msg;

  // Header
  document.getElementById('step-counter').textContent = 'Step ' + (idx + 1) + ' / ' + steps.length;
  document.getElementById('phase-badge').textContent = getPhase(s);

  // Code highlight — clear all, set active
  CODE_LINES.forEach(function(cl) {
    var el = document.getElementById(cl.id);
    if (el) el.classList.remove('hl');
  });
  var activeIds = { 11: ['cl11', 'cl11b'], 13: ['cl13', 'cl13b'] };
  if (activeIds[s.codeLine]) {
    activeIds[s.codeLine].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.classList.add('hl');
    });
  } else if (s.codeLine >= 0) {
    var el = document.getElementById('cl' + s.codeLine);
    if (el) el.classList.add('hl');
  }

  // Sidebar: Variables
  var vHtml = '';
  vHtml += '<div class="var-item"><span class="var-key">lo</span> = <span class="var-val">' + s.lo + '</span></div>';
  vHtml += '<div class="var-item"><span class="var-key">hi</span> = <span class="var-val">' + s.hi + '</span></div>';
  if (s.pivotIdx >= 0 && s.pivotIdx < s.arr.length) {
    vHtml += '<div class="var-item"><span class="var-key">pivot</span> = <span class="var-val">' + s.arr[s.pivotIdx] + '</span></div>';
  }
  if (s.iPtr >= 0) {
    vHtml += '<div class="var-item"><span class="var-key">boundary</span> = <span class="var-val">' + s.iPtr + '</span><span class="var-hint">next slot for ≤ pivot</span></div>';
  }
  if (s.jPtr >= 0) {
    vHtml += '<div class="var-item"><span class="var-key">scan</span> = <span class="var-val">' + s.jPtr + '</span><span class="var-hint">currently checking</span></div>';
  }
  document.getElementById('vars-items').innerHTML = vHtml || '<span style="color:var(--text-dim)">—</span>';

  // Sidebar: Counters
  var cHtml = '';
  cHtml += '<div class="var-item"><span class="var-key">comparisons</span> = <span class="var-val">' + s.comparisons + '</span></div>';
  cHtml += '<div class="var-item"><span class="var-key">swaps</span> = <span class="var-val">' + s.swaps + '</span></div>';
  document.getElementById('counters-items').innerHTML = cHtml;

  // Sidebar: Call stack (most recent on top)
  var stHtml = '';
  if (s.callStack && s.callStack.length) {
    var stack = s.callStack.slice().reverse();
    stack.forEach(function(frame, fi) {
      stHtml += '<div class="stack-frame' + (fi === 0 ? ' active' : '') + '">'
        + '<span class="stack-fn">' + frame.fn + '</span>'
        + '<span class="stack-args">(' + frame.lo + ', ' + frame.hi + ')</span>'
        + '</div>';
    });
  } else {
    stHtml = '<span style="color:var(--text-dim)">empty</span>';
  }
  document.getElementById('stack-items').innerHTML = stHtml;
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  document.getElementById('arrInput').value = sel.value;
  buildAndRun();
}

function randomExample() {
  var n = 5 + Math.floor(Math.random() * 5);
  var arr = [];
  for (var i = 0; i < n; i++) arr.push(1 + Math.floor(Math.random() * 20));
  document.getElementById('arrInput').value = arr.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}
</script>
</body>
