<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number of Islands</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area {
      width: 100%; max-width: 90%;
      display: flex; flex-direction: column; gap: 12px;
    }

    .grid-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
    }

    #grid {
      display: grid;
      gap: 3px;
      user-select: none;
    }

    .cell {
      border-radius: 4px;
      box-sizing: border-box;
      border: 2px solid transparent;
      transition: none;
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 55% 1fr;
      gap: 12px;
      align-items: start;
    }
    .right-col { display: flex; flex-direction: column; gap: 12px; }

    @media (max-width: 680px) { .bottom-row { grid-template-columns: 1fr; } }

    .code-panel {
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .code-header {
      padding: 9px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--text-dim);
    }
    .code-body {
      padding: 10px 0;
      flex: 1;
      font-family: 'JetBrains Mono','Fira Code','Cascadia Code',monospace;
      font-size: 0.73rem;
      line-height: 1.7;
      overflow-x: auto;
    }
    .cl {
      display: flex;
      align-items: stretch;
      border-left: 3px solid transparent;
      padding: 0 14px 0 0;
      white-space: pre;
    }
    .cl .ln {
      width: 28px; min-width: 28px;
      text-align: right;
      color: #3d4468;
      user-select: none;
      padding-right: 14px;
      font-size: 0.68rem;
      line-height: 1.7;
    }
    .cl .code { color: var(--text-muted); }
    .kw  { color: var(--purple); }
    .fn  { color: var(--blue); }
    .bi  { color: var(--orange); }
    .op  { color: var(--text); }
    .cm  { color: #3d4468; font-style: italic; }
    .nb  { color: var(--green); }
    .st  { color: var(--yellow); }

    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 18px;
    }
    .panel-title {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-sub {
      font-size: 0.72rem; font-weight: 400;
      text-transform: none; letter-spacing: 0; color: var(--text-faint);
    }

    /* Island count display */
    #island-count-display {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1;
      margin-bottom: 8px;
    }
    #island-swatches {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 22px;
    }
    .swatch-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      font-family: monospace;
    }
    .swatch-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* DFS stack panel */
    .stack-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 36px;
      max-height: 140px;
      overflow-y: auto;
    }
    .stack-chip {
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: monospace;
      color: #fff;
    }
    .stack-hint { font-size: 0.7rem; color: var(--text-faint); white-space: nowrap; }
    .stack-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }

    .btn-play {
      background: #15803d;
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 9px 20px;
      transition: background 0.2s;
    }
    .btn-play:hover { background: #166534; }
    .btn-play.playing { background: #c2410c; }
    .btn-play.playing:hover { background: #9a3412; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }

    .speed-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
    }

    .nav-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 90%;
    }

    textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'JetBrains Mono','Fira Code',monospace;
      font-size: 0.9rem;
      padding: 8px 11px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
      width: 100%;
      min-height: 90px;
    }
    textarea:focus { border-color: var(--accent); }
  </style>
</head>

<script>
// ── Island colors (bright / dim pairs) ──────────────────────────────────────
var ISLAND_BRIGHT = ['#bb9af7','#7dcfff','#ff9e64','#f7768e','#e0af68','#9ece6a','#2ac3de','#ff79c6'];
var ISLAND_MED    = ['#7a4fbf','#2d6a9f','#9a5020','#9a2030','#9a7020','#3a7a20','#1a6070','#9a2070'];
var ISLAND_DIM    = ['#3d2060','#143050','#4a2810','#4a1018','#4a3810','#1a4010','#0a2830','#4a0030'];

function islandBright(idx) { return ISLAND_BRIGHT[(idx - 1) % ISLAND_BRIGHT.length]; }
function islandMed(idx)    { return ISLAND_MED[(idx - 1) % ISLAND_MED.length]; }
function islandDim(idx)    { return ISLAND_DIM[(idx - 1) % ISLAND_DIM.length]; }

// ── Code ─────────────────────────────────────────────────────────────────────
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">numIslands</span><span class="op">(</span>grid<span class="op">):</span>'],
  [2,  '    rows, cols <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>grid<span class="op">),</span> <span class="bi">len</span><span class="op">(</span>grid<span class="op">[</span><span class="nb">0</span><span class="op">])</span>'],
  [3,  '    islands <span class="op">=</span> <span class="nb">0</span>'],
  [4,  '    <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>rows<span class="op">):</span>'],
  [5,  '        <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>cols<span class="op">):</span>'],
  [6,  '            <span class="kw">if</span> grid<span class="op">[</span>r<span class="op">][</span>c<span class="op">] ==</span> <span class="st">"1"</span><span class="op">:</span>'],
  [7,  '                islands <span class="op">+=</span> <span class="nb">1</span>'],
  [8,  '                stack <span class="op">= [(</span>r, c<span class="op">)]</span>'],
  [9,  '                grid<span class="op">[</span>r<span class="op">][</span>c<span class="op">] =</span> <span class="st">"0"</span>  <span class="cm"># mark visited</span>'],
  [0,  ''],
  [10, '                <span class="kw">while</span> stack<span class="op">:</span>'],
  [11, '                    sr, sc <span class="op">=</span> stack<span class="op">.</span><span class="fn">pop</span><span class="op">()</span>'],
  [12, '                    <span class="kw">for</span> dr, dc <span class="kw">in</span> <span class="op">[(-</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),(</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),</span>'],
  [13, '                                       <span class="op">(</span><span class="nb">0</span><span class="op">,-</span><span class="nb">1</span><span class="op">),(</span><span class="nb">0</span><span class="op">,</span><span class="nb">1</span><span class="op">)]:</span>'],
  [14, '                        nr, nc <span class="op">=</span> sr<span class="op">+</span>dr, sc<span class="op">+</span>dc'],
  [15, '                        <span class="kw">if</span> <span class="op">(</span><span class="nb">0</span> <span class="op">&lt;=</span> nr <span class="op">&lt;</span> rows <span class="kw">and</span>'],
  [16, '                            <span class="nb">0</span> <span class="op">&lt;=</span> nc <span class="op">&lt;</span> cols <span class="kw">and</span>'],
  [17, '                            grid<span class="op">[</span>nr<span class="op">][</span>nc<span class="op">] ==</span> <span class="st">"1"</span><span class="op">):</span>'],
  [18, '                            grid<span class="op">[</span>nr<span class="op">][</span>nc<span class="op">] =</span> <span class="st">"0"</span>'],
  [19, '                            stack<span class="op">.</span><span class="fn">append</span><span class="op">((</span>nr, nc<span class="op">))</span>'],
  [0,  ''],
  [20, '    <span class="kw">return</span> islands'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE.forEach(function(pair) {
    var ln = pair[0], html = pair[1];
    var row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

// ── State ────────────────────────────────────────────────────────────────────
var ROWS = 0, COLS = 0;
var simSteps = [];

// ── Parse grid input ─────────────────────────────────────────────────────────
function parseGrid() {
  var raw = document.getElementById('inp-grid').value.trim();
  var lines = raw.split(/\n+/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  if (!lines.length) return null;
  var parsed = lines.map(function(l) {
    return l.split('').map(function(ch) { return ch === '1' ? 1 : 0; });
  });
  // Normalize column count
  var maxC = parsed.reduce(function(m, r) { return Math.max(m, r.length); }, 0);
  parsed = parsed.map(function(r) {
    while (r.length < maxC) r.push(0);
    return r;
  });
  return parsed;
}

// ── Build simulation steps ───────────────────────────────────────────────────
function buildSteps(grid) {
  var rows = grid.length;
  var cols = grid[0].length;
  var steps = [];
  var islandCount = 0;

  // Working copy of cell status: 'water' | 'unvisited' | 'queued' | 'current' | 'claimed'
  var cellSt = grid.map(function(row) {
    return row.map(function(v) { return v ? 'unvisited' : 'water'; });
  });
  // Island index per cell (0 = none)
  var cellIsland = grid.map(function(row) { return row.map(function() { return 0; }); });

  function snap(phase, desc, lines, stack) {
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines || [],
      cells: cellSt.map(function(r) { return r.slice(); }),
      islandOf: cellIsland.map(function(r) { return r.slice(); }),
      islandCount: islandCount,
      stack: (stack || []).slice(),
    });
  }

  snap('Init', 'Gray cells are unvisited land. Dark cells are water. Scanning from top-left.', [4, 5]);

  var DIRS = [[-1,0],[1,0],[0,-1],[0,1]];

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (cellSt[r][c] !== 'unvisited') continue;

      islandCount++;
      var iIdx = islandCount;

      // Mark start cell as queued and push to stack
      cellSt[r][c] = 'queued';
      cellIsland[r][c] = iIdx;
      var stack = [[r, c]];

      snap('Scan', 'Cell (' + r + ',' + c + ') is unvisited land — new island #' + islandCount + ' discovered. Pushing to DFS stack.', [6, 7, 8, 9], stack);

      while (stack.length) {
        var top = stack.pop();
        var cr = top[0], cc = top[1];

        cellSt[cr][cc] = 'current';
        snap('DFS', 'Popped (' + cr + ',' + cc + ') from stack. Checking 4 neighbors.', [10, 11], stack);

        var pushed = 0;
        for (var d = 0; d < DIRS.length; d++) {
          var nr = cr + DIRS[d][0], nc = cc + DIRS[d][1];
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          if (cellSt[nr][nc] !== 'unvisited') continue;

          cellSt[nr][nc] = 'queued';
          cellIsland[nr][nc] = iIdx;
          stack.push([nr, nc]);
          pushed++;
          snap('DFS', 'Neighbor (' + nr + ',' + nc + ') is land — mark visited and push to stack.', [12, 13, 14, 15, 16, 17, 18, 19], stack);
        }

        cellSt[cr][cc] = 'claimed';
        if (!pushed && stack.length > 0) {
          snap('DFS', '(' + cr + ',' + cc + ') has no new neighbors. Stack has ' + stack.length + ' cell' + (stack.length !== 1 ? 's' : '') + ' remaining.', [10, 11], stack);
        }
      }

      snap('DFS', 'Island #' + islandCount + ' fully explored. Resuming outer scan.', [4, 5], []);
    }
  }

  snap('Done', 'Scan complete. Found ' + islandCount + ' island' + (islandCount !== 1 ? 's' : '') + '.', [20]);
  return steps;
}

// ── Render grid ──────────────────────────────────────────────────────────────
function renderGridShell() {
  var container = document.getElementById('grid');
  var maxW = container.parentElement.clientWidth - 40;
  var cellSize = Math.max(20, Math.min(70, Math.floor(maxW / COLS) - 3));
  container.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellSize + 'px)';
  container.innerHTML = '';

  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-' + r + '-' + c;
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      container.appendChild(cell);
    }
  }
}

// ── Cell color computation ───────────────────────────────────────────────────
function cellColor(st, island) {
  switch (st) {
    case 'water':     return { bg: '#060810', border: 'transparent' };
    case 'unvisited': return { bg: '#1c2a40', border: '#2d3a50' };
    case 'queued':    return { bg: islandDim(island),    border: islandBright(island) };
    case 'current':   return { bg: islandBright(island), border: '#ffffff' };
    case 'claimed':   return { bg: islandMed(island),    border: islandBright(island) };
    default:          return { bg: '#060810', border: 'transparent' };
  }
}

function applyCellColor(r, c, st, island, animate) {
  var el = document.getElementById('cell-' + r + '-' + c);
  if (!el) return;
  var col = cellColor(st, island);
  if (animate) {
    gsap.to(el, { backgroundColor: col.bg, borderColor: col.border, duration: 0.18, ease: 'power2.out' });
  } else {
    el.style.backgroundColor = col.bg;
    el.style.borderColor = col.border;
  }
}

function applyStep(snap, animate) {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      applyCellColor(r, c, snap.cells[r][c], snap.islandOf[r][c], animate);
    }
  }
  renderStack(snap.stack, snap.islandOf, snap.islandCount);
  renderIslandCount(snap.islandCount, snap.islandOf);
  setCodeLines(snap.lines || []);
}

// ── Stack panel ──────────────────────────────────────────────────────────────
function renderStack(stack, islandOf, islandCount) {
  var container = document.getElementById('stack-items');
  container.innerHTML = '';
  if (!stack || !stack.length) {
    container.innerHTML = '<span class="stack-empty">empty</span>';
    return;
  }
  // Show top first (last element = top)
  for (var i = stack.length - 1; i >= 0; i--) {
    var rc = stack[i];
    var iIdx = islandOf[rc[0]][rc[1]] || islandCount;
    var chip = document.createElement('div');
    chip.className = 'stack-chip';
    chip.style.backgroundColor = islandDim(iIdx);
    chip.style.borderLeft = '3px solid ' + islandBright(iIdx);
    chip.textContent = '(' + rc[0] + ',' + rc[1] + ')';
    container.appendChild(chip);
  }
}

// ── Island count panel ───────────────────────────────────────────────────────
function renderIslandCount(count, islandOf) {
  document.getElementById('island-count-display').textContent = count > 0 ? count : '—';
  var swatches = document.getElementById('island-swatches');
  swatches.innerHTML = '';
  for (var i = 1; i <= count; i++) {
    var chip = document.createElement('div');
    chip.className = 'swatch-chip';
    var dot = document.createElement('div');
    dot.className = 'swatch-dot';
    dot.style.backgroundColor = islandBright(i);
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode('#' + i));
    swatches.appendChild(chip);
  }
}

// ── Code highlighting ─────────────────────────────────────────────────────────
var HL_BG   = 'rgba(122,162,247,0.12)';
var prevLines = [];

function setCodeLines(newLines) {
  var dur = 0.18;
  prevLines.forEach(function(n) {
    if (newLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = '';
      el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  newLines.forEach(function(n) {
    if (prevLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = HL_BG;
      el.style.borderLeftColor = 'var(--accent)';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--accent)';
    }
  });
  if (newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  prevLines = newLines.slice();
}

// ── Build viz ─────────────────────────────────────────────────────────────────
function buildViz() {
  nav.stopPlay();
  var grid = parseGrid();
  if (!grid) {
    document.getElementById('step-desc').textContent = 'Could not parse grid. Use 0s and 1s, one row per line.';
    return;
  }
  ROWS = grid.length;
  COLS = grid[0].length;
  simSteps = buildSteps(grid);
  renderGridShell();
  prevLines = [];
  document.getElementById('island-count-display').textContent = '—';
  document.getElementById('island-swatches').innerHTML = '';
  document.getElementById('stack-items').innerHTML = '<span class="stack-empty">not started</span>';
  nav.load(simSteps);
}

// ── VizNav ────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev: document.getElementById('btn-back'),
  btnNext: document.getElementById('btn-next'),
  btnPlay: document.getElementById('btn-play'),
  speedSel: document.getElementById('speed-select'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var phaseEl = document.getElementById('phase-label');
    var descEl  = document.getElementById('step-desc');
    if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
    if (descEl)  descEl.textContent  = snap.desc;
  }
});

window.addEventListener('resize', function() { if (ROWS > 0) renderGridShell(); });

buildCodePanel();
buildViz();
</script>

<script>
if (window.self !== window.top) {
  var bl = document.querySelector('.back-link');
  if (bl) bl.style.display = 'none';
}
</script>
</body>
</html>
