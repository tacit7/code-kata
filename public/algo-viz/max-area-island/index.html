<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Max Area of Island</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .viz-inputs textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 0.82rem; font-family: inherit; line-height: 1.5; resize: vertical; outline: none; }
  .viz-inputs textarea:focus { border-color: var(--accent); }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }

  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 620px; min-height: 20px; line-height: 1.5; }

  .grid-wrap { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 120px; }
  #grid { display: grid; gap: 3px; user-select: none; }
  .cell { border-radius: 4px; box-sizing: border-box; border: 2px solid transparent; transition: none; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .code-body { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',monospace; font-size: 0.73rem; line-height: 1.7; overflow-x: auto; }
  .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 14px 0 0; white-space: pre; }
  .cl .ln { width: 28px; min-width: 28px; text-align: right; color: #3d4468; user-select: none; padding-right: 14px; font-size: 0.68rem; line-height: 1.7; }
  .cl .code { color: var(--text-muted); }
  .kw  { color: var(--purple); }
  .fn  { color: var(--blue); }
  .bi  { color: var(--orange); }
  .op  { color: var(--text); }
  .cm  { color: #3d4468; font-style: italic; }
  .nb  { color: var(--green); }
  .st  { color: var(--yellow); }

  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }

  .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 14px; }
  .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .panel-sub { font-size: 0.72rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-faint); }

  .area-row { display: flex; gap: 24px; margin-bottom: 10px; align-items: flex-end; }
  .area-stat { display: flex; flex-direction: column; gap: 3px; }
  .area-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
  .area-val { font-size: 2rem; font-weight: 700; line-height: 1; }
  #cur-area-val { color: var(--cyan); }
  #max-area-val { color: var(--yellow); }
  #max-area-val.new-max { color: var(--green); }

  #island-swatches { display: flex; gap: 8px; flex-wrap: wrap; min-height: 22px; }
  .swatch-chip { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); font-family: monospace; }
  .swatch-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .swatch-area { font-size: 0.65rem; color: var(--text-faint); }

  .stack-col { display: flex; flex-direction: column; gap: 4px; min-height: 36px; max-height: 200px; overflow-y: auto; }
  .stack-chip { border-radius: 5px; padding: 3px 9px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; font-family: monospace; color: #fff; }
  .stack-hint { font-size: 0.7rem; color: var(--text-faint); white-space: nowrap; }
  .stack-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:180px;">
      <option value="">— custom —</option>
      <option value="0" selected>Scattered islands</option>
      <option value="1">One big island</option>
      <option value="2">All water</option>
      <option value="3">Diagonal X</option>
      <option value="4">Full land</option>
      <option value="5">Checker corners</option>
    </select>
  </div>
  <div>
    <label>Grid (1 = land, 0 = water)</label>
    <textarea id="inp-grid" style="width:180px;height:96px;">00110
01110
01000
00010
11110</textarea>
  </div>
  <button class="vi-btn-run" onclick="buildViz()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Max Area of Island</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Edit the grid and click Run.</div>

    <div class="grid-wrap">
      <div id="grid"></div>
    </div>

    <div class="legend">
      <div class="leg-item">
        <div class="leg-swatch square" style="background:#060810;border:1px solid #1a1e2a"></div>Water
      </div>
      <div class="leg-item">
        <div class="leg-swatch square" style="background:#1c2a40;border:1px solid #2d3a50"></div>Unvisited land
      </div>
      <div class="leg-item">
        <div class="leg-swatch square" style="background:#bb9af7;border:2px solid #fff"></div>Current (DFS head)
      </div>
      <div class="leg-item">
        <div class="leg-swatch square" style="background:#4a2f7a;border:1px solid #bb9af7"></div>Queued (on stack)
      </div>
      <div class="leg-item">
        <div class="leg-swatch square" style="background:#7a4fbf;border:1px solid #bb9af7"></div>Claimed (island)
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python — Iterative DFS</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Area Tracker</div>
      <div class="area-row">
        <div class="area-stat">
          <span class="area-label">Current Island</span>
          <span class="area-val" id="cur-area-val">—</span>
        </div>
        <div class="area-stat">
          <span class="area-label">Max Area</span>
          <span class="area-val" id="max-area-val">—</span>
        </div>
      </div>
      <div id="island-swatches"></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">DFS Stack <span class="panel-sub">(top → bottom)</span></div>
      <div style="display:flex;align-items:flex-start;gap:8px">
        <span class="stack-hint" style="padding-top:4px">↑ next pop</span>
        <div id="stack-items" class="stack-col"><span class="stack-empty">not started</span></div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ── Island colors ────────────────────────────────────────────────────────────
var ISLAND_BRIGHT = ['#bb9af7','#7dcfff','#ff9e64','#f7768e','#e0af68','#9ece6a','#2ac3de','#ff79c6'];
var ISLAND_MED    = ['#7a4fbf','#2d6a9f','#9a5020','#9a2030','#9a7020','#3a7a20','#1a6070','#9a2070'];
var ISLAND_DIM    = ['#3d2060','#143050','#4a2810','#4a1018','#4a3810','#1a4010','#0a2830','#4a0030'];

function islandBright(idx) { return ISLAND_BRIGHT[(idx - 1) % ISLAND_BRIGHT.length]; }
function islandMed(idx)    { return ISLAND_MED[(idx - 1) % ISLAND_MED.length]; }
function islandDim(idx)    { return ISLAND_DIM[(idx - 1) % ISLAND_DIM.length]; }

// ── Presets ──────────────────────────────────────────────────────────────────
var PRESETS = [
  '00110\n01110\n01000\n00010\n11110',
  '11110\n11110\n11000\n00000',
  '00000\n00000\n00000',
  '10001\n01010\n00100\n01010\n10001',
  '111\n111\n111',
  '10101\n00000\n10101',
];

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (sel.value === '') return;
  document.getElementById('inp-grid').value = PRESETS[parseInt(sel.value)];
  buildViz();
}

function randomExample() {
  var rows = 4 + Math.floor(Math.random() * 3);
  var cols = 4 + Math.floor(Math.random() * 3);
  var lines = [];
  for (var r = 0; r < rows; r++) {
    var s = '';
    for (var c = 0; c < cols; c++) { s += (Math.random() < 0.5 ? '1' : '0'); }
    lines.push(s);
  }
  document.getElementById('inp-grid').value = lines.join('\n');
  document.getElementById('presetSel').value = '';
  buildViz();
}

// ── Code ─────────────────────────────────────────────────────────────────────
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">maxAreaOfIsland</span><span class="op">(</span>grid<span class="op">):</span>'],
  [2,  '    rows, cols <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>grid<span class="op">),</span> <span class="bi">len</span><span class="op">(</span>grid<span class="op">[</span><span class="nb">0</span><span class="op">])</span>'],
  [3,  '    max_area <span class="op">=</span> <span class="nb">0</span>'],
  [4,  '    <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>rows<span class="op">):</span>'],
  [5,  '        <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>cols<span class="op">):</span>'],
  [6,  '            <span class="kw">if</span> grid<span class="op">[</span>r<span class="op">][</span>c<span class="op">] ==</span> <span class="nb">1</span><span class="op">:</span>'],
  [7,  '                area <span class="op">=</span> <span class="nb">0</span>'],
  [8,  '                stack <span class="op">= [(</span>r, c<span class="op">)]</span>'],
  [9,  '                grid<span class="op">[</span>r<span class="op">][</span>c<span class="op">] =</span> <span class="nb">0</span>  <span class="cm"># mark visited</span>'],
  [0,  ''],
  [10, '                <span class="kw">while</span> stack<span class="op">:</span>'],
  [11, '                    sr, sc <span class="op">=</span> stack<span class="op">.</span><span class="fn">pop</span><span class="op">()</span>'],
  [12, '                    area <span class="op">+=</span> <span class="nb">1</span>'],
  [13, '                    <span class="kw">for</span> dr, dc <span class="kw">in</span> <span class="op">[(-</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),(</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),</span>'],
  [14, '                                       <span class="op">(</span><span class="nb">0</span><span class="op">,-</span><span class="nb">1</span><span class="op">),(</span><span class="nb">0</span><span class="op">,</span><span class="nb">1</span><span class="op">)]:</span>'],
  [15, '                        nr, nc <span class="op">=</span> sr<span class="op">+</span>dr, sc<span class="op">+</span>dc'],
  [16, '                        <span class="kw">if</span> <span class="op">(</span><span class="nb">0</span> <span class="op">&lt;=</span> nr <span class="op">&lt;</span> rows <span class="kw">and</span>'],
  [17, '                            <span class="nb">0</span> <span class="op">&lt;=</span> nc <span class="op">&lt;</span> cols <span class="kw">and</span>'],
  [18, '                            grid<span class="op">[</span>nr<span class="op">][</span>nc<span class="op">] ==</span> <span class="nb">1</span><span class="op">):</span>'],
  [19, '                            grid<span class="op">[</span>nr<span class="op">][</span>nc<span class="op">] =</span> <span class="nb">0</span>'],
  [20, '                            stack<span class="op">.</span><span class="fn">append</span><span class="op">((</span>nr, nc<span class="op">))</span>'],
  [0,  ''],
  [21, '                max_area <span class="op">=</span> <span class="bi">max</span><span class="op">(</span>max_area, area<span class="op">)</span>'],
  [22, '    <span class="kw">return</span> max_area'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE.forEach(function(pair) {
    var ln = pair[0], html = pair[1];
    var row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

// ── State ────────────────────────────────────────────────────────────────────
var ROWS = 0, COLS = 0;
var simSteps = [];

// ── Parse grid input ─────────────────────────────────────────────────────────
function parseGrid() {
  var raw = document.getElementById('inp-grid').value.trim();
  var lines = raw.split(/\n+/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  if (!lines.length) return null;
  var parsed = lines.map(function(l) {
    return l.split('').map(function(ch) { return ch === '1' ? 1 : 0; });
  });
  var maxC = parsed.reduce(function(m, r) { return Math.max(m, r.length); }, 0);
  parsed = parsed.map(function(r) {
    while (r.length < maxC) r.push(0);
    return r;
  });
  return parsed;
}

// ── Build simulation steps ───────────────────────────────────────────────────
function buildSteps(grid) {
  var rows = grid.length;
  var cols = grid[0].length;
  var steps = [];
  var islandCount = 0;
  var maxArea = 0;
  // islandAreas[i] = final area of island i (populated when island is fully explored)
  var islandAreas = [0]; // 1-indexed

  var cellSt = grid.map(function(row) {
    return row.map(function(v) { return v ? 'unvisited' : 'water'; });
  });
  var cellIsland = grid.map(function(row) { return row.map(function() { return 0; }); });

  function snap(phase, desc, lines, stack, curArea, isNewMax) {
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines || [],
      cells: cellSt.map(function(r) { return r.slice(); }),
      islandOf: cellIsland.map(function(r) { return r.slice(); }),
      islandCount: islandCount,
      islandAreas: islandAreas.slice(),
      stack: (stack || []).slice(),
      curArea: curArea,
      maxArea: maxArea,
      isNewMax: !!isNewMax,
    });
  }

  snap('Init', 'Gray cells are unvisited land. Dark cells are water. Scanning from top-left.', [4, 5], [], 0, false);

  var DIRS = [[-1,0],[1,0],[0,-1],[0,1]];

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (cellSt[r][c] !== 'unvisited') continue;

      islandCount++;
      var iIdx = islandCount;
      var area = 0;

      cellSt[r][c] = 'queued';
      cellIsland[r][c] = iIdx;
      var stack = [[r, c]];

      snap('Scan', 'Cell (' + r + ',' + c + ') is unvisited land — island #' + islandCount + ' discovered. Pushing to DFS stack.', [6, 7, 8, 9], stack, area, false);

      while (stack.length) {
        var top = stack.pop();
        var cr = top[0], cc = top[1];

        cellSt[cr][cc] = 'current';
        area++;
        snap('DFS', 'Popped (' + cr + ',' + cc + '). area → ' + area + '. Checking 4 neighbors.', [10, 11, 12], stack, area, false);

        var pushed = 0;
        for (var d = 0; d < DIRS.length; d++) {
          var nr = cr + DIRS[d][0], nc = cc + DIRS[d][1];
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          if (cellSt[nr][nc] !== 'unvisited') continue;

          cellSt[nr][nc] = 'queued';
          cellIsland[nr][nc] = iIdx;
          stack.push([nr, nc]);
          pushed++;
          snap('DFS', 'Neighbor (' + nr + ',' + nc + ') is land — mark visited and push to stack.', [13, 14, 15, 16, 17, 18, 19, 20], stack, area, false);
        }

        cellSt[cr][cc] = 'claimed';
        if (!pushed && stack.length > 0) {
          snap('DFS', '(' + cr + ',' + cc + ') has no new neighbors. Stack has ' + stack.length + ' cell' + (stack.length !== 1 ? 's' : '') + ' remaining.', [10, 11], stack, area, false);
        }
      }

      // Island fully explored — update max
      islandAreas[iIdx] = area;
      var isNewMax = area > maxArea;
      if (isNewMax) maxArea = area;
      snap('MaxUpdate', 'Island #' + islandCount + ' fully explored. Area = ' + area + '. max_area = max(' + (isNewMax ? (maxArea - area === 0 ? '0' : maxArea - area) : maxArea) + ', ' + area + ') = ' + maxArea + '.', [21], [], area, isNewMax);

      snap('Scan', 'Island #' + islandCount + ' done (area ' + area + '). Resuming outer scan.', [4, 5], [], 0, false);
    }
  }

  snap('Done', 'Scan complete. Max area of island = ' + maxArea + '.', [22], [], 0, false);
  return steps;
}

// ── Render grid ──────────────────────────────────────────────────────────────
function renderGridShell() {
  var container = document.getElementById('grid');
  var maxW = container.parentElement.clientWidth - 40;
  var cellSize = Math.max(20, Math.min(70, Math.floor(maxW / COLS) - 3));
  container.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellSize + 'px)';
  container.innerHTML = '';

  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-' + r + '-' + c;
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      container.appendChild(cell);
    }
  }
}

// ── Cell color ───────────────────────────────────────────────────────────────
function cellColor(st, island) {
  switch (st) {
    case 'water':     return { bg: '#060810', border: 'transparent' };
    case 'unvisited': return { bg: '#1c2a40', border: '#2d3a50' };
    case 'queued':    return { bg: islandDim(island),    border: islandBright(island) };
    case 'current':   return { bg: islandBright(island), border: '#ffffff' };
    case 'claimed':   return { bg: islandMed(island),    border: islandBright(island) };
    default:          return { bg: '#060810', border: 'transparent' };
  }
}

function applyCellColor(r, c, st, island, animate) {
  var el = document.getElementById('cell-' + r + '-' + c);
  if (!el) return;
  var col = cellColor(st, island);
  if (animate) {
    gsap.to(el, { backgroundColor: col.bg, borderColor: col.border, duration: 0.18, ease: 'power2.out' });
  } else {
    el.style.backgroundColor = col.bg;
    el.style.borderColor = col.border;
  }
}

function applyStep(snap, animate) {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      applyCellColor(r, c, snap.cells[r][c], snap.islandOf[r][c], animate);
    }
  }
  renderStack(snap.stack, snap.islandOf, snap.islandCount);
  renderAreaStats(snap.curArea, snap.maxArea, snap.isNewMax, snap.islandCount, snap.islandAreas);
  setCodeLines(snap.lines || []);
}

// ── Stack panel ──────────────────────────────────────────────────────────────
function renderStack(stack, islandOf, islandCount) {
  var container = document.getElementById('stack-items');
  container.innerHTML = '';
  if (!stack || !stack.length) {
    container.innerHTML = '<span class="stack-empty">empty</span>';
    return;
  }
  for (var i = stack.length - 1; i >= 0; i--) {
    var rc = stack[i];
    var iIdx = islandOf[rc[0]][rc[1]] || islandCount;
    var chip = document.createElement('div');
    chip.className = 'stack-chip';
    chip.style.backgroundColor = islandDim(iIdx);
    chip.style.borderLeft = '3px solid ' + islandBright(iIdx);
    chip.textContent = '(' + rc[0] + ',' + rc[1] + ')';
    container.appendChild(chip);
  }
}

// ── Area stats panel ─────────────────────────────────────────────────────────
function renderAreaStats(curArea, maxArea, isNewMax, islandCount, islandAreas) {
  var curEl = document.getElementById('cur-area-val');
  var maxEl = document.getElementById('max-area-val');

  curEl.textContent = (curArea > 0) ? curArea : '—';
  maxEl.textContent = (maxArea > 0) ? maxArea : '—';
  if (isNewMax) {
    maxEl.classList.add('new-max');
  } else {
    maxEl.classList.remove('new-max');
  }

  var swatches = document.getElementById('island-swatches');
  swatches.innerHTML = '';
  for (var i = 1; i <= islandCount; i++) {
    var area = islandAreas[i];
    var chip = document.createElement('div');
    chip.className = 'swatch-chip';
    var dot = document.createElement('div');
    dot.className = 'swatch-dot';
    dot.style.backgroundColor = islandBright(i);
    chip.appendChild(dot);
    var label = document.createElement('span');
    label.textContent = '#' + i;
    chip.appendChild(label);
    if (area) {
      var areaSpan = document.createElement('span');
      areaSpan.className = 'swatch-area';
      areaSpan.textContent = '(' + area + ')';
      chip.appendChild(areaSpan);
    }
    swatches.appendChild(chip);
  }
}

// ── Code highlighting ─────────────────────────────────────────────────────────
var HL_BG = 'rgba(122,162,247,0.12)';
var prevLines = [];

function setCodeLines(newLines) {
  prevLines.forEach(function(n) {
    if (newLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = '';
      el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  newLines.forEach(function(n) {
    if (prevLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = HL_BG;
      el.style.borderLeftColor = 'var(--accent)';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--accent)';
    }
  });
  if (newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  prevLines = newLines.slice();
}

// ── Build viz ─────────────────────────────────────────────────────────────────
function buildViz() {
  if (window.nav) nav.stopPlay();
  var grid = parseGrid();
  if (!grid) {
    document.getElementById('desc').textContent = 'Could not parse grid. Use 0s and 1s, one row per line.';
    return;
  }
  ROWS = grid.length;
  COLS = grid[0].length;
  simSteps = buildSteps(grid);
  renderGridShell();
  prevLines = [];
  document.getElementById('cur-area-val').textContent = '—';
  document.getElementById('max-area-val').textContent = '—';
  document.getElementById('max-area-val').classList.remove('new-max');
  document.getElementById('island-swatches').innerHTML = '';
  document.getElementById('stack-items').innerHTML = '<span class="stack-empty">not started</span>';
  nav.load(simSteps);
}

// ── Status ───────────────────────────────────────────────────────────────────
function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

// ── VizNav ────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var descEl = document.getElementById('desc');
    if (descEl) descEl.textContent = snap.desc;
    updateStatus(snap, cur, total);
  }
});
window.nav = nav;

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.goTo(0);
});

window.addEventListener('resize', function() { if (ROWS > 0) renderGridShell(); });

buildCodePanel();
buildViz();

// ── Resize handle ──────────────────────────────────────────────────────────────
(function(){ var h=document.getElementById('resize-handle'),p=document.getElementById('code-panel'),d=false,sx=0,sw=0; h.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('dragging');e.preventDefault();}); document.addEventListener('mousemove',function(e){if(!d)return;p.style.width=Math.min(560,Math.max(120,sw+(sx-e.clientX)))+'px';}); document.addEventListener('mouseup',function(){if(!d)return;d=false;h.classList.remove('dragging');}); })();
</script>
</body>
