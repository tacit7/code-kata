<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valid Palindrome - Algorithm Visualization</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <style>
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(24px, 1fr));
      gap: 4px;
      margin-bottom: 20px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .char-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      position: relative;
      min-height: 32px;
      word-break: break-all;
      font-weight: 600;
    }
    .char-cell.dimmed {
      opacity: 0.4;
      background: rgba(0, 0, 0, 0.1);
    }
    .char-cell.l-pointer {
      border-color: var(--blue);
      border-width: 2px;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
    }
    .char-cell.r-pointer {
      border-color: var(--orange);
      border-width: 2px;
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.5);
    }
    .char-cell.match {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--green);
    }
    .char-cell.mismatch {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--red);
    }
    .var-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .var-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
    }
    .var-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .var-value {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 600;
    }
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .control-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .control-row:last-child {
      margin-bottom: 0;
    }
    .control-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      min-width: 80px;
    }
    .control-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: monospace;
    }
    .btn-build {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-build:hover {
      opacity: 0.9;
    }
    .btn-build:active {
      opacity: 0.8;
    }
    .error-message {
      color: var(--red);
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
  </style>
</head>
<body class="page">
  <div class="page-header">
    <a class="back-link" href="../index.html">← All Algorithms</a>
    <div class="page-title">Valid Palindrome</div>
    <div class="page-sub">LeetCode #125 · Two-Pointer · O(n) time · O(1) space</div>
  </div>

  <div class="viz-inputs">
    <div class="control-row">
      <span class="control-label">Input string:</span>
      <input type="text" class="control-input" id="input-string" value="A man, a plan, a canal: Panama" />
      <button class="btn-build" id="build-btn">Build &amp; Run</button>
    </div>
    <div class="error-message" id="error-msg"></div>
  </div>

  <div class="viz-area" style="width: 100%; max-width: 90%; margin: 0 auto;">
    <div style="display: flex; gap: 12px; margin-bottom: 14px;">
      <div class="panel-box" style="flex: 0 0 auto;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn-step" id="prevBtn" disabled>&#8592;</button>
          <button class="btn-step" id="stepBtn" disabled>&#8594;</button>
          <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
          <select
            id="speedSel"
            style="
              background: var(--bg);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: 8px;
              padding: 6px 10px;
              font-size: 0.85rem;
            "
          >
            <option value="700">Slow</option>
            <option value="250" selected>Medium</option>
            <option value="80">Fast</option>
          </select>
        </div>
      </div>
      <div class="panel-box" style="flex: 1; min-width: 0;">
        <div
          style="
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
          "
          id="phase-label"
        >
          —
        </div>
        <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 3px;" id="step-desc">
          Click Build &amp; Run to start.
        </div>
      </div>
    </div>

    <div class="panel-box" style="margin-bottom: 20px;">
      <div
        style="font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 12px;"
      >
        String
      </div>
      <div class="char-grid" id="char-grid"></div>
    </div>

    <div class="panel-box" style="margin-bottom: 20px;">
      <div
        style="font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 12px;"
      >
        Variables
      </div>
      <div class="var-panel">
        <div class="var-box">
          <div class="var-label">l (left index)</div>
          <div class="var-value" id="var-l">0</div>
        </div>
        <div class="var-box">
          <div class="var-label">r (right index)</div>
          <div class="var-value" id="var-r">0</div>
        </div>
        <div class="var-box">
          <div class="var-label">s[l]</div>
          <div class="var-value" id="var-sl">—</div>
        </div>
        <div class="var-box">
          <div class="var-label">s[r]</div>
          <div class="var-value" id="var-sr">—</div>
        </div>
        <div class="var-box">
          <div class="var-label">Comparison</div>
          <div class="var-value" id="var-cmp">—</div>
        </div>
        <div class="var-box">
          <div class="var-label">Result</div>
          <div class="var-value" id="var-result">—</div>
        </div>
      </div>
    </div>

    <div class="panel-box" style="font-family: monospace; font-size: 0.78rem; line-height: 1.75;">
      <div
        style="
          font-size: 0.68rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          color: var(--text-dim);
          margin-bottom: 8px;
        "
      >
        Python Solution
      </div>
      <div id="code-body"></div>
    </div>
  </div>

  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>

  <script>
    var nav;
    var currentState = {};
    var cleanedString = '';
    var allSteps = [];

    const pythonCode = `def is_palindrome(s):
    l, r = 0, len(s) - 1
    while l < r:
        while l < r and not s[l].isalnum():
            l += 1
        while l < r and not s[r].isalnum():
            r -= 1
        if s[l].lower() != s[r].lower():
            return False
        l += 1
        r -= 1
    return True`;

    function setCodeLines(activeLines) {
      const codeBody = document.getElementById('code-body');
      if (!codeBody.childNodes.length) {
        const lines = pythonCode.split('\n');
        lines.forEach((line, idx) => {
          const lineEl = document.createElement('div');
          lineEl.id = 'cl-' + idx;
          lineEl.textContent = line;
          codeBody.appendChild(lineEl);
        });
      }

      document.querySelectorAll('#code-body > div').forEach((el) => {
        el.classList.remove('hl');
      });

      activeLines.forEach((lineNum) => {
        const el = document.getElementById('cl-' + lineNum);
        if (el) el.classList.add('hl');
      });
    }

    function initializeCodeLines() {
      setCodeLines([1]);
    }

    function simulate(inputString) {
      const steps = [];

      function isAlnum(ch) {
        return /[a-z0-9]/i.test(ch);
      }

      const s = inputString;
      let l = 0;
      let r = s.length - 1;

      // Step 1: Initialize
      steps.push({
        phase: 'Initialize',
        desc: 'Set left pointer l=0, right pointer r=len(s)-1',
        l: l,
        r: r,
        s: s,
        lines: [1, 2],
        action: 'init',
        result: null,
      });

      while (l < r) {
        // Step: Skip non-alphanumeric on left
        while (l < r && !isAlnum(s[l])) {
          steps.push({
            phase: 'Skip left',
            desc: `Skip non-alnum at l=${l} ('${s[l]}'), move to l=${l + 1}`,
            l: l,
            r: r,
            s: s,
            lines: [3, 4, 5],
            action: 'skip_left',
            result: null,
          });
          l += 1;
        }

        // Step: Skip non-alphanumeric on right
        while (l < r && !isAlnum(s[r])) {
          steps.push({
            phase: 'Skip right',
            desc: `Skip non-alnum at r=${r} ('${s[r]}'), move to r=${r - 1}`,
            l: l,
            r: r,
            s: s,
            lines: [3, 6, 7],
            action: 'skip_right',
            result: null,
          });
          r -= 1;
        }

        if (l >= r) break;

        // Step: Compare characters
        const leftChar = s[l].toLowerCase();
        const rightChar = s[r].toLowerCase();
        const match = leftChar === rightChar;

        if (match) {
          steps.push({
            phase: 'Compare',
            desc: `Compare s[${l}]='${s[l]}' and s[${r}]='${s[r]}' (case-insensitive): MATCH`,
            l: l,
            r: r,
            s: s,
            lines: [3, 8, 9],
            action: 'compare_match',
            result: null,
          });
        } else {
          steps.push({
            phase: 'Compare',
            desc: `Compare s[${l}]='${s[l]}' and s[${r}]='${s[r]}' (case-insensitive): MISMATCH`,
            l: l,
            r: r,
            s: s,
            lines: [3, 8, 9],
            action: 'compare_mismatch',
            result: null,
          });
          steps.push({
            phase: 'Result',
            desc: 'Characters do not match. Return False.',
            l: l,
            r: r,
            s: s,
            lines: [9, 10],
            action: 'return_false',
            result: false,
          });
          return steps;
        }

        l += 1;
        r -= 1;

        if (l < r) {
          steps.push({
            phase: 'Advance',
            desc: `Increment l to ${l}, decrement r to ${r}`,
            l: l,
            r: r,
            s: s,
            lines: [11, 12],
            action: 'advance',
            result: null,
          });
        }
      }

      steps.push({
        phase: 'Result',
        desc: 'Loop complete (l >= r). All characters match. Return True.',
        l: l,
        r: r,
        s: s,
        lines: [13],
        action: 'return_true',
        result: true,
      });

      return steps;
    }

    function applyStep(snap, animate) {
      const s = snap.s;
      const l = snap.l;
      const r = snap.r;

      // Update char grid
      const charGrid = document.getElementById('char-grid');
      charGrid.innerHTML = '';

      for (let i = 0; i < s.length; i++) {
        const cell = document.createElement('div');
        cell.className = 'char-cell';
        cell.textContent = s[i];

        const isAlnum = /[a-z0-9]/i.test(s[i]);
        if (!isAlnum) {
          cell.classList.add('dimmed');
        }

        if (i === l && i === r) {
          cell.classList.add('l-pointer', 'r-pointer');
        } else if (i === l) {
          cell.classList.add('l-pointer');
        } else if (i === r) {
          cell.classList.add('r-pointer');
        }

        if (snap.action === 'compare_match' && (i === l || i === r)) {
          cell.classList.add('match');
        }
        if (snap.action === 'compare_mismatch' && (i === l || i === r)) {
          cell.classList.add('mismatch');
        }

        charGrid.appendChild(cell);
      }

      // Update variables
      document.getElementById('var-l').textContent = l;
      document.getElementById('var-r').textContent = r;

      const isAlnum = /[a-z0-9]/i.test(s[l]);
      document.getElementById('var-sl').textContent = isAlnum ? `'${s[l]}'` : `'${s[l]}' (skip)`;

      const isRAlnum = /[a-z0-9]/i.test(s[r]);
      document.getElementById('var-sr').textContent = isRAlnum ? `'${s[r]}'` : `'${s[r]}' (skip)`;

      if (snap.action === 'compare_match') {
        document.getElementById('var-cmp').textContent = `'${s[l]}' = '${s[r]}' ✓`;
      } else if (snap.action === 'compare_mismatch') {
        document.getElementById('var-cmp').textContent = `'${s[l]}' ≠ '${s[r]}' ✗`;
      } else {
        document.getElementById('var-cmp').textContent = '—';
      }

      if (snap.result === true) {
        document.getElementById('var-result').textContent = 'True';
      } else if (snap.result === false) {
        document.getElementById('var-result').textContent = 'False';
      } else {
        document.getElementById('var-result').textContent = '—';
      }

      // Update code lines
      setCodeLines(snap.lines);

      // Update phase and description
      document.getElementById('phase-label').textContent = snap.phase;
      document.getElementById('step-desc').textContent = snap.desc;
    }

    function buildAndRun() {
      const inputStr = document.getElementById('input-string').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.classList.remove('show');

      if (!inputStr || inputStr.trim().length === 0) {
        errorMsg.textContent = 'Please enter a string.';
        errorMsg.classList.add('show');
        return;
      }

      allSteps = simulate(inputStr);
      if (allSteps.length === 0) {
        errorMsg.textContent = 'No steps generated.';
        errorMsg.classList.add('show');
        return;
      }

      nav.load(allSteps);
    }

    window.addEventListener('DOMContentLoaded', function () {
      initializeCodeLines();

      nav = VizNav({
        btnPrev: document.getElementById('prevBtn'),
        btnNext: document.getElementById('stepBtn'),
        btnPlay: document.getElementById('playBtn'),
        speedSel: document.getElementById('speedSel'),
        render: function (snap, cur, total) {
          applyStep(snap, cur > 0);
        },
      });

      document.getElementById('build-btn').addEventListener('click', buildAndRun);

      // Auto-run default example
      buildAndRun();
    });
  </script>

  <script>
    if (window.self !== window.top) {
      var bl = document.querySelector('.back-link');
      if (bl) bl.style.display = 'none';
    }
  </script>
</body>
</html>
