<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trapping Rain Water</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Fira Code', 'Cascadia Code', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  /* Main layout */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* Viz area */
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; overflow: hidden; }

  /* Description */
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 620px; min-height: 40px; line-height: 1.5; }

  /* Bar chart wrapper */
  #bar-chart-wrap { width: 100%; max-width: 740px; overflow-x: auto; display: flex; justify-content: center; }
  #bar-chart { display: flex; align-items: flex-end; gap: 5px; padding: 4px 4px 0; flex-shrink: 0; }

  .bar-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .bar-inner { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 42px; }
  .bar-water { width: 38px; background: #3b82f655; border: 1px solid #3b82f6; border-bottom: none; }
  .bar-solid {
    width: 38px; border-radius: 4px 4px 0 0;
    background: #334155; border: 2px solid #475569;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #94a3b8;
    transition: border-color .2s, box-shadow .2s, background .2s;
    min-height: 4px;
  }
  .bar-solid.bs-left  { border-color: #3b82f6; box-shadow: 0 0 0 2px #3b82f630; color: #93c5fd; }
  .bar-solid.bs-right { border-color: #f97316; box-shadow: 0 0 0 2px #f9731630; color: #fdba74; }
  .bar-solid.bs-both  { border-color: #eab308; box-shadow: 0 0 0 2px #eab30830; color: #fef08a; }
  .bar-solid.bs-done  { border-color: #22c55e; background: #14532d40; color: #4ade80; }
  .bar-solid.bs-last  { border-color: #a855f7; box-shadow: 0 0 0 2px #a855f730; }

  .bar-idx { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .badges { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 3px; min-height: 16px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .05em; }
  .badge-l { background: #1e3a5f; color: #3b82f6; border: 1px solid #3b82f6; }
  .badge-r { background: #431407; color: #f97316; border: 1px solid #f97316; }

  /* Right sidebar */
  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .ptr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptr-table td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
  .ptr-table td:first-child { color: var(--text-muted); width: 72px; }
  .ptr-table td:last-child { color: var(--text); font-weight: 600; }
  .water-big { font-size: 26px; font-weight: 800; color: #3b82f6; }
  .water-lbl { font-size: 10px; color: var(--text-dim); }
  .wmap-text { font-size: 11px; color: var(--text-muted); line-height: 1.7; word-break: break-all; }

  /* Code panel */
  #code-panel {
    width: 220px;
    min-width: 120px;
    max-width: 560px;
    overflow-x: auto;
    flex-shrink: 0;
    background: var(--surface-dark);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
  }
  .code-panel-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  pre { font-size: 11px; line-height: 1.7; font-family: inherit; }
  .code-line { padding: 0 4px; border-radius: 3px; display: block; transition: background .2s; white-space: pre; }
  .code-line.active { background: #451a0350; color: #fbbf24; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .cm { color: #546e7a; font-style: italic; }
  .str { color: #c3e88d; } .num { color: #f78c6c; }

  /* Nav */
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  #resize-handle { width:5px; flex-shrink:0; cursor:col-resize; background:transparent; border-right:1px solid var(--border); transition:background .15s; z-index:10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
</style>
</head>
<body>

<div class="viz-inputs" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;">
  <div style="display:flex;flex-direction:column;gap:4px;">
    <label style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);">Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:0.85rem;">
      <option value="">-- pick a preset --</option>
      <option value="0,1,0,2,1,0,1,3,2,1,2,1">Classic [0,1,0,2,1,0,1,3,2,1,2,1] = 6</option>
      <option value="4,2,0,3,2,5">[4,2,0,3,2,5] = 9</option>
      <option value="3,0,2,0,4">[3,0,2,0,4] = 7</option>
      <option value="1,0,1">[1,0,1] = 1</option>
      <option value="0,0,0">[0,0,0] = 0</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <label style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);">Heights (comma-separated)</label>
    <input type="text" id="heightInput" value="0,1,0,2,1,0,1,3,2,1,2,1" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:0.85rem;width:260px;" />
  </div>
  <button onclick="buildAndRun()" style="padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;">Run</button>
  <button onclick="randomExample()" style="padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;">&#127922; Random</button>
</div>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Trapping Rain Water</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <pre id="code-pre"></pre>
  </div>
  <div id="resize-handle"></div>
  <div id="viz-area">
    <div id="desc">Initializing...</div>
    <div id="bar-chart-wrap">
      <div id="bar-chart"></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <table class="ptr-table" id="ptr-table"><tbody></tbody></table>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Total Water</div>
      <div class="water-big" id="water-total">0</div>
      <div class="water-lbl">units trapped</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Water per Index</div>
      <div class="wmap-text" id="wmap-display">No water yet</div>
    </div>
  </div>
</div>


<div class="nav-row" id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8634; Reset</button>
  <select id="speedSel">
    <option value="800">0.5x</option>
    <option value="400" selected>1x</option>
    <option value="200">2x</option>
    <option value="100">4x</option>
  </select>
</div>

<script>
// ─── Code lines ────────────────────────────────────────────────────────────
const CODE_LINES = [
  { n:  1, t: '<span class="kw">def</span> <span class="fn">trap</span>(height: list[int]) -> int:' },
  { n:  2, t: '    left, right = <span class="num">0</span>, len(height) - <span class="num">1</span>' },
  { n:  3, t: '    leftMax, rightMax = height[<span class="num">0</span>], height[-<span class="num">1</span>]' },
  { n:  4, t: '    water = <span class="num">0</span>' },
  { n:  5, t: '    <span class="kw">while</span> left &lt; right:' },
  { n:  6, t: '        <span class="kw">if</span> leftMax &lt; rightMax:' },
  { n:  7, t: '            left += <span class="num">1</span>' },
  { n:  8, t: '            leftMax = max(leftMax, height[left])' },
  { n:  9, t: '            water += leftMax - height[left]' },
  { n: 10, t: '        <span class="kw">else</span>:  <span class="cm"># leftMax >= rightMax</span>' },
  { n: 11, t: '            right -= <span class="num">1</span>' },
  { n: 12, t: '            rightMax = max(rightMax, height[right])' },
  { n: 13, t: '            water += rightMax - height[right]' },
  { n: 14, t: '    <span class="kw">return</span> water' },
];

// ─── Build snapshots ────────────────────────────────────────────────────────
function buildSnapshots(heights) {
  var n = heights.length;
  var snaps = [];

  if (n < 2) {
    snaps.push({
      phase: 'done',
      description: 'Array needs at least 2 elements to trap water. Total: 0.',
      heights: heights.slice(),
      left: 0, right: 0,
      leftMax: heights[0] || 0, rightMax: heights[0] || 0,
      waterMap: {}, totalWater: 0, lastProcessed: -1, active_line: 0
    });
    return snaps;
  }

  var waterMap = {};
  for (var i = 0; i < n; i++) waterMap[i] = 0;

  function total() {
    return Object.values(waterMap).reduce(function(a, b) { return a + b; }, 0);
  }

  function snap(phase, desc, left, right, lM, rM, lp, al) {
    return {
      phase: phase, description: desc,
      heights: heights.slice(),
      left: left, right: right,
      leftMax: lM, rightMax: rM,
      waterMap: Object.assign({}, waterMap),
      totalWater: total(),
      lastProcessed: lp,
      active_line: al
    };
  }

  var left = 0, right = n - 1;
  var leftMax = heights[0], rightMax = heights[n - 1];

  snaps.push(snap('init',
    'Initialize: left=0, right=' + (n - 1) + '. leftMax=h[0]=' + leftMax +
    ', rightMax=h[' + (n - 1) + ']=' + rightMax +
    '. We process from both ends — always advance the pointer with the smaller running max.',
    left, right, leftMax, rightMax, -1, 2
  ));

  while (left < right) {
    if (leftMax < rightMax) {
      left++;
      var oldLM = leftMax;
      leftMax = Math.max(leftMax, heights[left]);
      var wL = leftMax - heights[left];
      waterMap[left] = wL;
      snaps.push(snap('trap',
        'leftMax(' + oldLM + ') < rightMax(' + rightMax + '): rightMax is larger so the water level at left is bounded by leftMax. ' +
        'Advance left to [' + left + '] (h=' + heights[left] + '). ' +
        'leftMax=max(' + oldLM + ',' + heights[left] + ')=' + leftMax + '. water[' + left + ']=' + leftMax + '-' + heights[left] + '=' + wL + '.',
        left, right, leftMax, rightMax, left, 7
      ));
    } else {
      right--;
      var oldRM = rightMax;
      rightMax = Math.max(rightMax, heights[right]);
      var wR = rightMax - heights[right];
      waterMap[right] = wR;
      snaps.push(snap('trap',
        'leftMax(' + leftMax + ') ≥ rightMax(' + oldRM + '): leftMax is larger so the water level at right is bounded by rightMax. ' +
        'Advance right to [' + right + '] (h=' + heights[right] + '). ' +
        'rightMax=max(' + oldRM + ',' + heights[right] + ')=' + rightMax + '. water[' + right + ']=' + rightMax + '-' + heights[right] + '=' + wR + '.',
        left, right, leftMax, rightMax, right, 11
      ));
    }
  }

  snaps.push(snap('done',
    'Complete! left=right=' + left + ', loop exits. Total water trapped: ' + total() + ' units.',
    left, right, leftMax, rightMax, -1, 14
  ));

  return snaps;
}

// ─── Render bar chart ───────────────────────────────────────────────────────
function renderChart(snap) {
  var heights = snap.heights;
  var n = heights.length;
  if (n === 0) return '<div style="color:var(--text-dim);padding:20px">Empty array</div>';

  var maxH = Math.max.apply(null, heights.concat([1]));
  var scale = Math.min(150 / maxH, 44);
  var chartH = (maxH + 1) * scale;

  var html = '';
  for (var i = 0; i < n; i++) {
    var h = heights[i];
    var w = snap.waterMap[i] || 0;
    var barPx = Math.max(h * scale, 4);
    var waterPx = w * scale;

    var barCls = 'bar-solid';
    if (snap.phase === 'done') {
      barCls += ' bs-done';
    } else if (i === snap.left && i === snap.right) {
      barCls += ' bs-both';
    } else if (i === snap.left) {
      barCls += ' bs-left';
    } else if (i === snap.right) {
      barCls += ' bs-right';
    } else if (i === snap.lastProcessed) {
      barCls += ' bs-last';
    }

    var badges = [];
    if (snap.phase !== 'done') {
      if (i === snap.left) badges.push('<span class="badge badge-l">L</span>');
      if (i === snap.right) badges.push('<span class="badge badge-r">R</span>');
    }

    var valLabel = barPx >= 20 ? h : '';
    var waterBlock = waterPx > 0
      ? '<div class="bar-water" style="width:38px;height:' + waterPx + 'px"></div>'
      : '';

    html += '<div class="bar-col">';
    html += '<div class="bar-inner" style="width:42px;height:' + chartH + 'px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">';
    html += waterBlock;
    html += '<div class="' + barCls + '" style="height:' + barPx + 'px">' + valLabel + '</div>';
    html += '</div>';
    html += '<div class="bar-idx">' + i + '</div>';
    html += '<div class="badges">' + badges.join('') + '</div>';
    html += '</div>';
  }
  return html;
}

// ─── Update sidebar ─────────────────────────────────────────────────────────
function updateSidebar(snap) {
  var tbody = document.querySelector('#ptr-table tbody');
  var h = snap.heights;
  var lp = snap.lastProcessed;

  var rows = '';
  rows += '<tr><td>left</td><td>' + snap.left + ' <span style="color:var(--text-dim)">(h=' + h[snap.left] + ')</span></td></tr>';
  rows += '<tr><td>right</td><td>' + snap.right + ' <span style="color:var(--text-dim)">(h=' + h[snap.right] + ')</span></td></tr>';
  rows += '<tr><td>leftMax</td><td><span style="color:#3b82f6">' + snap.leftMax + '</span></td></tr>';
  rows += '<tr><td>rightMax</td><td><span style="color:#f97316">' + snap.rightMax + '</span></td></tr>';
  if (lp >= 0) {
    rows += '<tr><td>water[' + lp + ']</td><td><span style="color:#60a5fa">+' + (snap.waterMap[lp] || 0) + '</span></td></tr>';
  }
  tbody.innerHTML = rows;

  document.getElementById('water-total').textContent = snap.totalWater;

  var entries = Object.entries(snap.waterMap).filter(function(e) { return e[1] > 0; });
  var wmEl = document.getElementById('wmap-display');
  if (entries.length === 0) {
    wmEl.innerHTML = '<span style="color:var(--text-dim)">No water yet</span>';
  } else {
    wmEl.innerHTML = entries.map(function(e) {
      return '<span style="color:#60a5fa">[' + e[0] + ']:' + e[1] + '</span>';
    }).join(' ');
  }
}

// ─── Render code ────────────────────────────────────────────────────────────
function renderCode(activeLine) {
  var pre = document.getElementById('code-pre');
  pre.innerHTML = CODE_LINES.map(function(l) {
    var cls = l.n === activeLine ? 'code-line active' : 'code-line';
    return '<span class="' + cls + '">' + l.t + '</span>';
  }).join('');
  var active = pre.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ─── Phase labels ────────────────────────────────────────────────────────────
var PHASE_LABELS = { init: 'Init', trap: 'Trapping', done: 'Done' };

// ─── Apply step ─────────────────────────────────────────────────────────────
function applyStep(snap, animated) {
  document.getElementById('phase-badge').textContent = PHASE_LABELS[snap.phase] || snap.phase;
  document.getElementById('desc').textContent = snap.description;
  document.getElementById('bar-chart').innerHTML = renderChart(snap);
  updateSidebar(snap);
  renderCode(snap.active_line);
}

function updateStatus(snap, cur, total) {
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

// ─── viz-inputs ──────────────────────────────────────────────────────────────
function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (sel.value) {
    document.getElementById('heightInput').value = sel.value;
    buildAndRun();
  }
}

function buildAndRun() {
  var raw = document.getElementById('heightInput').value;
  var heights = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n) && n >= 0; });
  if (heights.length < 1) return;
  var snaps = buildSnapshots(heights);
  if (window.nav) window.nav.load(snaps);
}

function randomExample() {
  var len = 6 + Math.floor(Math.random() * 6);
  var heights = [];
  for (var i = 0; i < len; i++) heights.push(Math.floor(Math.random() * 6));
  document.getElementById('heightInput').value = heights.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ─── Reset ───────────────────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.reset();
});

// ─── Init ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var defaultHeights = [0,1,0,2,1,0,1,3,2,1,2,1];
  var snaps = buildSnapshots(defaultHeights);

  window.nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) { applyStep(snap, cur > 0); updateStatus(snap, cur, total); }
  });

  window.nav.load(snaps);
});

(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = e.clientX - startX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
