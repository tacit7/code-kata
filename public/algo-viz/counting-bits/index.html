<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Counting Bits</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); max-width: 560px; min-height: 32px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); } .cm { color: var(--text-ghost); }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* PAGE-SPECIFIC */
  .array-section { padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 10px; min-height: 80px; width: 100%; }
  .arr-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
  .arr-cell-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .arr-idx { font-size: 0.6rem; color: var(--text-ghost); font-family: monospace; text-align: center; }
  .arr-cell { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--border-soft); border-radius: 5px; background: #0f0f0f; font-size: 0.92rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); }
  .arr-cell[data-state="filled"]  { border-style: solid; color: var(--text-dim); border-color: #2d3148; }
  .arr-cell[data-state="current"] { border-style: solid; color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); }
  .arr-cell[data-state="parent"]  { border-style: solid; color: #f59e0b; border-color: #b45309; background: #1c1200; }
  .binary-section { padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .binary-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .binary-row { display: flex; align-items: center; gap: 8px; }
  .binary-idx-label { font-size: 0.72rem; font-family: monospace; color: var(--text-ghost); min-width: 40px; }
  .binary-bits { display: flex; gap: 4px; }
  .bit-cell { width: 24px; height: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-soft); border-radius: 3px; background: #0f0f0f; font-size: 0.82rem; font-weight: 700; font-family: monospace; color: var(--text-dim); }
  .bit-cell.lo-bit { border-color: var(--accent); color: var(--accent-pale); background: var(--surface-dark); }
  /* sidebar vars */
  .var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .var-box { padding: 8px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .var-box.accent-border { border-color: var(--accent); }
  .var-box.amber-border  { border-color: #b45309; }
  .var-label { font-size: 0.6rem; font-family: monospace; color: var(--text-faint); text-align: center; }
  .var-val   { font-size: 1.2rem; font-weight: 700; color: var(--text-bright); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"n":"2"}'>Small (n=2)</option>
      <option value='{"n":"5"}'>Basic (n=5)</option>
      <option value='{"n":"8"}'>Default (n=8)</option>
      <option value='{"n":"15"}'>Power of 2 minus 1 (n=15)</option>
      <option value='{"n":"16"}'>Power of 2 (n=16)</option>
      <option value='{"n":"31"}'>Max (n=31)</option>
    </select>
  </div>
  <div>
    <label>n</label>
    <input id="inp-n" type="number" value="8" min="1" max="32" style="width:70px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Counting Bits</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Set n and click Run.</div>
    <div class="array-section" id="array-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Set n and click Run.</span>
    </div>
    <div class="binary-section" id="binary-section" style="display:none">
      <div class="binary-label">Binary Representation</div>
      <div class="binary-row">
        <span class="binary-idx-label" id="bin-i-label">i = ?</span>
        <div class="binary-bits" id="bin-bits"></div>
      </div>
      <div style="font-size:0.7rem;color:var(--text-ghost);margin-top:2px">
        <span style="color:var(--accent-pale)">highlighted bit</span> = lowest bit (i&amp;1)
      </div>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div class="var-grid">
      <div class="var-box accent-border" style="grid-column:span 2">
        <div class="var-label">i</div>
        <div class="var-val" id="vv-i">&mdash;</div>
      </div>
      <div class="var-box amber-border">
        <div class="var-label">i &gt;&gt; 1</div>
        <div class="var-val" id="vv-parent">&mdash;</div>
      </div>
      <div class="var-box">
        <div class="var-label">bits[i&gt;&gt;1]</div>
        <div class="var-val" id="vv-pval">&mdash;</div>
      </div>
      <div class="var-box">
        <div class="var-label">i &amp; 1</div>
        <div class="var-val" id="vv-bit">&mdash;</div>
      </div>
      <div class="var-box">
        <div class="var-label">bits[i]</div>
        <div class="var-val" id="vv-result">&mdash;</div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentN = 0;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">count_bits</span><span class="op">(</span>n<span class="op">):</span>'],
  [2,  '    bits <span class="op">=</span> <span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">*</span> <span class="op">(</span>n <span class="op">+</span> <span class="nb">1</span><span class="op">)  </span><span class="cm"># bits[0] = 0</span>'],
  [3,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">1</span><span class="op">,</span> n <span class="op">+</span> <span class="nb">1</span><span class="op">):</span>'],
  [4,  '        bits<span class="op">[</span>i<span class="op">]</span> <span class="op">=</span> bits<span class="op">[</span>i <span class="op">&gt;&gt;</span> <span class="nb">1</span><span class="op">]</span> <span class="op">+</span> <span class="op">(</span>i <span class="op">&amp;</span> <span class="nb">1</span><span class="op">)</span>'],
  [5,  '    <span class="kw">return</span> bits'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (snap.desc) {
        gsap.fromTo(document.getElementById('desc'), { opacity: 0 }, { opacity: 1, duration: 0.15 });
        document.getElementById('desc').textContent = snap.desc;
      }
    }
  });
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    return '<div class="cl" id="cl-' + ln + '"><span class="ln">' + ln + '</span><span>' + html + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  if (d.n !== undefined) document.getElementById('inp-n').value = d.n;
  buildAndRun();
}

function randomExample() {
  var n = Math.floor(Math.random() * 30) + 2;
  document.getElementById('inp-n').value = n;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var n = parseInt(document.getElementById('inp-n').value, 10);
  if (isNaN(n) || n < 1 || n > 32) return;
  currentN = n;
  buildArraySection(n);
  buildBinarySection();
  simSteps = simulate(n);
  nav.load(simSteps);
}

function buildArraySection(n) {
  var sec = document.getElementById('array-section');
  var html = '<div class="arr-wrap" id="arr-wrap">';
  for (var i = 0; i <= n; i++) {
    html += '<div class="arr-cell-group">'
      + '<div class="arr-idx">' + i + '</div>'
      + '<div class="arr-cell" id="ac-' + i + '" data-state="empty">'
      + (i === 0 ? '0' : '')
      + '</div>'
      + '</div>';
  }
  html += '</div>';
  sec.innerHTML = html;
  var c0 = document.getElementById('ac-0');
  if (c0) c0.dataset.state = 'filled';
}

function buildBinarySection() {
  document.getElementById('binary-section').style.display = '';
}

function simulate(n) {
  var steps = [];
  var bits = new Array(n + 1).fill(null);
  bits[0] = 0;

  function snap(phase, desc, lines, i, parentIdx, parentVal, bitVal, arr) {
    steps.push({
      phase: phase, desc: desc, lines: lines,
      i: i,
      parentIdx: parentIdx !== undefined ? parentIdx : null,
      parentVal: parentVal !== undefined ? parentVal : null,
      bitVal: bitVal !== undefined ? bitVal : null,
      arr: arr.slice(),
    });
  }

  snap('Init', 'Allocate bits[0..n]. bits[0] = 0 (zero has no set bits).', [1, 2], -1, null, null, null, bits);

  for (var i = 1; i <= n; i++) {
    var pIdx = i >> 1;
    var bVal = i & 1;
    var pVal0 = bits[pIdx];
    snap('read-prev',
      'i = ' + i + '. Parent index = i >> 1 = ' + pIdx + '. bits[' + pIdx + '] = ' + pVal0 + '.',
      [3, 4], i, pIdx, pVal0, null, bits);
    snap('read-bit',
      'i & 1 = ' + i + ' & 1 = ' + bVal + '. Low bit is ' + (bVal ? '1 (i is odd)' : '0 (i is even)') + '.',
      [4], i, pIdx, pVal0, bVal, bits);
    var pVal = bits[pIdx];
    bits[i] = pVal + bVal;
    snap('write',
      'bits[' + i + '] = bits[' + pIdx + '] + (i&1) = ' + pVal + ' + ' + bVal + ' = ' + bits[i] + '.',
      [4], i, pIdx, pVal, bVal, bits);
  }

  snap('Done', 'Done. bits = [' + bits.join(', ') + '].', [5], -1, null, null, null, bits);
  return steps;
}

function applyStep(s, animate) {
  applyArrayCells(s, animate);
  applyBinary(s, animate);
  applyVars(s, animate);
  setCodeLines(s.lines);
}

function applyArrayCells(s, animate) {
  for (var i = 0; i <= currentN; i++) {
    var el = document.getElementById('ac-' + i);
    if (!el) continue;
    var val = s.arr[i];
    var state = 'empty';
    if (i === s.i) state = 'current';
    else if (i === s.parentIdx && (s.phase === 'read-prev' || s.phase === 'read-bit')) state = 'parent';
    else if (val !== null) state = 'filled';
    el.dataset.state = state;
    el.textContent = val !== null ? String(val) : '';
    if (animate && s.phase === 'write' && i === s.i) {
      gsap.fromTo(el, { scale: 0.5 }, { scale: 1.1, duration: 0.15, ease: 'power2.out',
        onComplete: function(el2) { gsap.to(el2, { scale: 1, duration: 0.1 }); }.bind(null, el)
      });
    }
    if (animate && s.phase === 'read-prev' && i === s.parentIdx) {
      gsap.fromTo(el, { backgroundColor: '#3d2b00' }, { backgroundColor: '#1c1200', duration: 0.3 });
    }
  }
}

function applyBinary(s, animate) {
  var sec = document.getElementById('binary-section');
  if (!sec) return;
  var bitsEl = document.getElementById('bin-bits');
  var label  = document.getElementById('bin-i-label');
  if (!bitsEl || !label) return;
  if (s.i < 1) { label.textContent = 'i = \u2014'; bitsEl.innerHTML = ''; return; }
  label.textContent = 'i = ' + s.i;
  var binStr = s.i.toString(2).padStart(6, '0');
  var html = '';
  for (var k = 0; k < binStr.length; k++) {
    var isLo = (k === binStr.length - 1);
    var cls = 'bit-cell' + (isLo ? ' lo-bit' : '');
    html += '<div class="' + cls + '" id="bit-' + k + '">' + binStr[k] + '</div>';
  }
  bitsEl.innerHTML = html;
  if (animate && s.phase === 'read-bit') {
    var loBit = document.getElementById('bit-' + (binStr.length - 1));
    if (loBit) gsap.fromTo(loBit, { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 });
  }
}

function applyVars(s, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null || val === undefined ? '\u2014' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setVal('vv-i',      s.i >= 1 ? s.i : null);
  setVal('vv-parent', s.parentIdx !== null ? s.parentIdx : null);
  setVal('vv-pval',   s.parentVal !== null ? s.parentVal : null);
  setVal('vv-bit',    s.bitVal !== null ? s.bitVal : null);
  setVal('vv-result', s.i >= 1 && s.arr[s.i] !== null ? s.arr[s.i] : null);
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0];
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) { dragging = false; handle.classList.remove('dragging'); }
  });
})();
</script>
</body>
</html>
