<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unique Paths</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    #sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; color: #fff; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .code-panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .viz-inputs input[type="number"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; width: 80px; }
    .viz-inputs select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }

    .grid-section { width: 100%; }
    .grid-scroll { overflow-x: auto; }
    .dp-table { border-collapse: separate; border-spacing: 5px; }
    .grid-corner { width: 34px; }
    .grid-col-hdr { font-size: 0.62rem; font-family: monospace; color: var(--text-ghost); text-align: center; padding-bottom: 2px; min-width: 52px; }
    .grid-row-hdr { font-size: 0.62rem; font-family: monospace; color: var(--text-ghost); text-align: right; padding-right: 6px; white-space: nowrap; vertical-align: middle; }
    .grid-cell { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--border-soft); border-radius: 5px; background: #0f0f0f; font-size: 0.95rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); transition: border-color 0.15s, background 0.15s, color 0.15s; }
    .grid-cell[data-state="filled"] { border-style: solid; color: var(--text-dim); border-color: #2d3148; }
    .grid-cell[data-state="current"] { border-style: solid; color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); }
    .grid-cell[data-state="above"] { border-style: solid; color: var(--green); border-color: var(--green-border); background: var(--green-bg); }
    .grid-cell[data-state="left"] { border-style: solid; color: var(--orange); border-color: #b45309; background: #1c1200; }
    .grid-cell[data-state="done"] { border-style: solid; color: var(--yellow); border-color: var(--yellow); background: #1e1b00; }

    .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }

    .formula-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-family: monospace; font-size: 0.82rem; color: var(--text-dim); min-height: 36px; line-height: 1.5; }
    .fabove { color: var(--green); font-weight: 700; }
    .fleft  { color: var(--orange); font-weight: 700; }
    .fcur   { color: var(--accent-pale); font-weight: 700; }

    .var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .var-box { padding: 10px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .var-box.accent-border { border-color: var(--accent); }
    .var-box.green-border  { border-color: var(--green-border); }
    .var-box.amber-border  { border-color: #b45309; }
    .var-box.blue-border   { border-color: var(--blue-border); }
    .var-label { font-size: 0.63rem; font-family: monospace; color: var(--text-faint); text-align: center; }
    .var-val   { font-size: 1.3rem; font-weight: 700; color: var(--text-bright); }

    .code-body { padding: 10px 0; font-size: 0.78rem; line-height: 1.75; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }

    .result-badge { font-size: 0.88rem; font-weight: 700; padding: 4px 13px; border-radius: 6px; display: none; width: fit-content; }
    .result-badge.found { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); display: block; }

    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .op { color: var(--text); }
    .nb { color: var(--green); }
    .cm { color: var(--text-ghost); }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"m":"3","n":"7"}'>3&#215;7 (default)</option>
      <option value='{"m":"3","n":"3"}'>3&#215;3 (small square)</option>
      <option value='{"m":"4","n":"4"}'>4&#215;4 (medium)</option>
      <option value='{"m":"5","n":"5"}'>5&#215;5 (larger)</option>
      <option value='{"m":"2","n":"10"}'>2&#215;10 (wide)</option>
      <option value='{"m":"10","n":"2"}'>10&#215;2 (tall)</option>
    </select>
  </div>
  <div class="field">
    <label>Rows (m)</label>
    <input id="inp-m" type="number" value="3" min="1" max="7" />
  </div>
  <div class="field">
    <label>Cols (n)</label>
    <input id="inp-n" type="number" value="7" min="1" max="10" />
  </div>
  <button onclick="buildAndRun()" style="padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;">Run</button>
  <button onclick="randomExample()" style="padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">Unique Paths</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="grid-section" id="grid-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Set m &amp; n, then click Run.</span>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>
  <div id="sidebar">
    <div id="step-desc" style="font-size:0.8rem;color:var(--text-muted);line-height:1.5;">Set m &amp; n, then click Run.</div>
    <div class="result-badge" id="result-badge"></div>
    <div class="panel-box">
      <div class="panel-title">Formula</div>
      <div class="formula-box" id="formula-box">&#8212;</div>
      <div class="var-grid">
        <div class="var-box accent-border">
          <div class="var-label">position (i, j)</div>
          <div class="var-val" id="vv-pos">&#8212;</div>
        </div>
        <div class="var-box blue-border">
          <div class="var-label">dp[i][j] = result</div>
          <div class="var-val" id="vv-cur">&#8212;</div>
        </div>
        <div class="var-box green-border">
          <div class="var-label">dp[i&#8722;1][j] above</div>
          <div class="var-val" id="vv-above">&#8212;</div>
        </div>
        <div class="var-box amber-border">
          <div class="var-label">dp[i][j&#8722;1] left</div>
          <div class="var-val" id="vv-left">&#8212;</div>
        </div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:0.78rem;color:var(--text-muted)">
        <div style="display:flex;align-items:center;gap:8px"><div style="width:16px;height:16px;border-radius:3px;border:2px solid var(--accent);background:var(--surface-dark)"></div><span>Current cell dp[i][j]</span></div>
        <div style="display:flex;align-items:center;gap:8px"><div style="width:16px;height:16px;border-radius:3px;border:2px solid var(--green-border);background:var(--green-bg)"></div><span>Above dp[i&#8722;1][j]</span></div>
        <div style="display:flex;align-items:center;gap:8px"><div style="width:16px;height:16px;border-radius:3px;border:2px solid #b45309;background:#1c1200"></div><span>Left dp[i][j&#8722;1]</span></div>
        <div style="display:flex;align-items:center;gap:8px"><div style="width:16px;height:16px;border-radius:3px;border:2px solid #2d3148;background:#0f0f0f"></div><span>Filled cell</span></div>
        <div style="display:flex;align-items:center;gap:8px"><div style="width:16px;height:16px;border-radius:3px;border:2px dashed var(--border-soft);background:#0f0f0f"></div><span>Unfilled cell</span></div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentM = 0, currentN = 0;

var CODE = [
  [1, '<span class="kw">def</span> <span class="fn">uniquePaths</span><span class="op">(</span>m<span class="op">,</span> n<span class="op">):</span>'],
  [2, '    dp <span class="op">=</span> <span class="op">[[</span><span class="nb">1</span><span class="op">]</span> <span class="op">*</span> n <span class="kw">for</span> _ <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>m<span class="op">)]</span>  <span class="cm"># first row &amp; col = 1</span>'],
  [3, '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">1</span><span class="op">,</span> m<span class="op">):</span>'],
  [4, '        <span class="kw">for</span> j <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">1</span><span class="op">,</span> n<span class="op">):</span>'],
  [5, '            dp<span class="op">[</span>i<span class="op">][</span>j<span class="op">]</span> <span class="op">=</span> dp<span class="op">[</span>i<span class="op">-</span><span class="nb">1</span><span class="op">][</span>j<span class="op">]</span> <span class="op">+</span> dp<span class="op">[</span>i<span class="op">][</span>j<span class="op">-</span><span class="nb">1</span><span class="op">]</span>'],
  [6, '    <span class="kw">return</span> dp<span class="op">[</span>m<span class="op">-</span><span class="nb">1</span><span class="op">][</span>n<span class="op">-</span><span class="nb">1</span><span class="op">]</span>'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      renderGrid(snap, cur > 0);
      renderVars(snap, cur > 0);
      setCodeLines(snap.lines);

      var phaseEl  = document.getElementById('phase-badge');
      var counterEl = document.getElementById('step-counter');
      var descEl   = document.getElementById('step-desc');
      if (phaseEl)  phaseEl.textContent  = snap.phase;
      if (counterEl) counterEl.textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (descEl) {
        gsap.fromTo(descEl, { opacity: 0 }, { opacity: 1, duration: 0.15 });
        descEl.textContent = snap.desc;
      }
      var badge = document.getElementById('result-badge');
      if (badge) {
        badge.className = 'result-badge';
        badge.textContent = '';
        if (snap.phase === 'Done') {
          var ans = snap.dp[snap.m - 1][snap.n - 1];
          badge.className = 'result-badge found';
          badge.textContent = 'Answer: ' + ans + ' path' + (ans === 1 ? '' : 's');
        }
      }
    }
  });
  setPreset(3, 7);
  buildAndRun();
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="code-line" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function setPreset(m, n) {
  document.getElementById('inp-m').value = m;
  document.getElementById('inp-n').value = n;
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-m').value = d.m;
  document.getElementById('inp-n').value = d.n;
  buildAndRun();
}

function randomExample() {
  var m = Math.floor(Math.random() * 6) + 2;
  var n = Math.floor(Math.random() * 8) + 2;
  document.getElementById('presetSel').value = '';
  document.getElementById('inp-m').value = m;
  document.getElementById('inp-n').value = n;
  buildAndRun();
}

function buildAndRun() {
  var m = parseInt(document.getElementById('inp-m').value, 10);
  var n = parseInt(document.getElementById('inp-n').value, 10);
  if (isNaN(m) || m < 1 || m > 7) return;
  if (isNaN(n) || n < 1 || n > 10) return;

  currentM = m;
  currentN = n;

  buildGrid(m, n);
  simSteps = simulate(m, n);
  nav.load(simSteps);
}

function buildGrid(m, n) {
  var sec = document.getElementById('grid-section');
  var html = '<div class="grid-scroll"><table class="dp-table">';
  html += '<tr><td class="grid-corner"></td>';
  for (var j = 0; j < n; j++) {
    html += '<td class="grid-col-hdr">j=' + j + '</td>';
  }
  html += '</tr>';
  for (var i = 0; i < m; i++) {
    html += '<tr><td class="grid-row-hdr">i=' + i + '</td>';
    for (var j = 0; j < n; j++) {
      html += '<td><div class="grid-cell" id="gc-' + i + '-' + j + '" data-state="empty">?</div></td>';
    }
    html += '</tr>';
  }
  html += '</table></div>';
  sec.innerHTML = html;
}

function simulate(m, n) {
  var steps = [];
  var dp = [];
  for (var i = 0; i < m; i++) dp.push(new Array(n).fill(-1));

  function snap(phase, desc, lines, cur, above, left) {
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines,
      dp: dp.map(function(row) { return row.slice(); }),
      m: m, n: n,
      cur: cur || null,
      above: above || null,
      left: left || null,
    });
  }

  snap('Init',
    'Create a ' + m + '×' + n + ' dp grid. dp[i][j] = number of unique paths to reach cell (i,j). ' +
    'First row and first column all equal 1 (only one way to reach any cell along the edge).',
    [1, 2], null, null, null);

  for (var i = 0; i < m; i++) {
    for (var j = 0; j < n; j++) {
      if (i === 0 || j === 0) {
        dp[i][j] = 1;
        var edgeMsg = i === 0 && j === 0
          ? 'dp[0][0] = 1. Starting cell — one path (we’re already here).'
          : i === 0
            ? 'dp[0][' + j + '] = 1. First row — can only move right, exactly one path.'
            : 'dp[' + i + '][0] = 1. First column — can only move down, exactly one path.';
        snap('Base Case', edgeMsg, [2], [i, j], null, null);
      } else {
        var aval = dp[i - 1][j];
        var lval = dp[i][j - 1];
        dp[i][j] = aval + lval;
        snap('Compute',
          'dp[' + i + '][' + j + '] = dp[' + (i - 1) + '][' + j + '] + dp[' + i + '][' + (j - 1) + '] = ' +
          aval + ' + ' + lval + ' = ' + dp[i][j] + '.',
          [3, 4, 5], [i, j], [i - 1, j], [i, j - 1]);
      }
    }
  }

  var answer = dp[m - 1][n - 1];
  snap('Done',
    'dp[' + (m - 1) + '][' + (n - 1) + '] = ' + answer + '. There ' +
    (answer === 1 ? 'is 1 unique path' : 'are ' + answer + ' unique paths') +
    ' from top-left to bottom-right.',
    [6], [m - 1, n - 1], null, null);

  return steps;
}

function renderGrid(snap, animate) {
  for (var i = 0; i < snap.m; i++) {
    for (var j = 0; j < snap.n; j++) {
      var el = document.getElementById('gc-' + i + '-' + j);
      if (!el) continue;
      var val = snap.dp[i][j];
      var state = 'empty';

      if (snap.cur && snap.cur[0] === i && snap.cur[1] === j) {
        state = snap.phase === 'Done' ? 'done' : 'current';
      } else if (snap.above && snap.above[0] === i && snap.above[1] === j) {
        state = 'above';
      } else if (snap.left && snap.left[0] === i && snap.left[1] === j) {
        state = 'left';
      } else if (val >= 0) {
        state = 'filled';
      }

      el.dataset.state = state;
      el.textContent = val >= 0 ? String(val) : '?';

      if (animate && snap.phase === 'Compute' && snap.cur && snap.cur[0] === i && snap.cur[1] === j) {
        gsap.fromTo(el, { scale: 0.5 }, { scale: 1.15, duration: 0.18, ease: 'power2.out',
          onComplete: function(e) { gsap.to(e, { scale: 1, duration: 0.12 }); }.bind(null, el)
        });
      }
    }
  }
}

function renderVars(snap, animate) {
  var fbox = document.getElementById('formula-box');
  if (fbox) {
    if (snap.cur && snap.above && snap.left) {
      var ai = snap.above[0], aj = snap.above[1];
      var li = snap.left[0],  lj = snap.left[1];
      var ci = snap.cur[0],   cj = snap.cur[1];
      var aval = snap.dp[ai][aj];
      var lval = snap.dp[li][lj];
      var cval = snap.dp[ci][cj];
      fbox.innerHTML =
        '<span class="fcur">dp[' + ci + '][' + cj + ']</span> = ' +
        '<span class="fabove">dp[' + ai + '][' + aj + ']</span> + ' +
        '<span class="fleft">dp[' + li + '][' + lj + ']</span> = ' +
        '<span class="fabove">' + aval + '</span> + ' +
        '<span class="fleft">' + lval + '</span> = ' +
        '<span class="fcur">' + (cval >= 0 ? cval : '?') + '</span>';
    } else {
      fbox.textContent = '—';
    }
  }

  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = (val === null || val === undefined) ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }

  setVal('vv-pos',   snap.cur   ? '(' + snap.cur[0] + ', ' + snap.cur[1] + ')' : null);
  setVal('vv-cur',   snap.cur   ? (snap.dp[snap.cur[0]][snap.cur[1]] >= 0 ? snap.dp[snap.cur[0]][snap.cur[1]] : '?') : null);
  setVal('vv-above', snap.above ? snap.dp[snap.above[0]][snap.above[1]] : null);
  setVal('vv-left',  snap.left  ? snap.dp[snap.left[0]][snap.left[1]]  : null);
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (!el) return;
    if (lines.indexOf(e[0]) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
</body>
</html>
