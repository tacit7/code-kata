<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Longest Substring Without Repeating Characters</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.6rem 0.75rem;
      gap: 0.4rem;
      overflow: hidden;
      min-height: 0;
    }

    /* ── String display ────────────────────────────── */
    .string-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .string-row {
      display: flex;
      gap: 0.4rem;
      position: relative;
      padding-top: 1.75rem;
    }

    .char-cell {
      position: relative;
      min-width: 3rem;
      height: 3rem;
      border-radius: 0.5rem;
      background: var(--surface);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-family: monospace;
      font-weight: bold;
      transition: background 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
      user-select: none;
    }

    .char-cell .idx {
      position: absolute;
      bottom: -1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: var(--text-muted);
    }

    .char-cell .ptr-label {
      position: absolute;
      top: -1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }

    .char-cell.in-window {
      background: #1d4ed8;
    }

    .char-cell.best-window {
      box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.45);
    }

    .char-cell.in-window.best-window {
      background: #1d4ed8;
      box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.6);
    }

    .char-cell.left-ptr { border-left-color: var(--green); }
    .char-cell.right-ptr { border-right-color: var(--orange); }
    .char-cell.lr-ptr { border-left-color: var(--green); border-right-color: var(--orange); }

    .char-cell.pulse-red { animation: pulse-red 350ms ease; }
    .char-cell.pulse-gold { animation: pulse-gold-bg 450ms ease; }

    /* ── Pointer info bar ──────────────────────────── */
    .ptr-bar {
      display: flex;
      gap: 2rem;
      justify-content: center;
      font-size: 0.825rem;
      flex-shrink: 0;
      margin-top: 0.8rem;
    }

    .ptr-bar .lbl { color: var(--text-muted); }
    .ptr-bar .left-val { color: var(--green); font-weight: bold; font-family: monospace; }
    .ptr-bar .right-val { color: var(--orange); font-weight: bold; font-family: monospace; }

    /* ── Metrics row ───────────────────────────────── */
    .metrics-row {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .metric-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.6rem;
    }

    .metric-card .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-card .value {
      font-size: 1.1rem;
      font-weight: bold;
      font-family: monospace;
    }

    .metric-card .value.gold { color: var(--yellow); }

    .metric-card.pulse-max .value {
      animation: pulse-gold-text 400ms ease;
    }

    /* ── Message panel ─────────────────────────────── */
    .message-panel {
      background: var(--surface);
      border-left: 4px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      transition: border-color 200ms ease;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .message-panel .msg-text { flex: 1; }
    .message-panel .step-counter {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Bottom two-column row ─────────────────────── */
    .bottom-row {
      flex: 1;
      display: flex;
      gap: 0.4rem;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Char set panel ────────────────────────────── */
    .set-panel {
      width: 190px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow: hidden;
    }

    .panel-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .chip-container {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-content: flex-start;
      overflow-y: auto;
    }

    .chip {
      height: 2rem;
      padding: 0 0.75rem;
      border-radius: 9999px;
      background: #1d4ed8;
      color: white;
      font-family: monospace;
      font-size: 0.875rem;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    .chip.entering { animation: chip-enter 200ms ease forwards; }
    .chip.leaving { animation: chip-leave 150ms ease forwards; }

    .empty-set {
      color: var(--text-dim, #475569);
      font-size: 0.8rem;
      font-style: italic;
    }

    /* ── Code panel ────────────────────────────────── */
    .code-panel {
      flex: 1;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: var(--radius-sm);
      padding: 0.5rem;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
    }

    .code-panel .panel-title {
      color: #6b7280;
      margin-bottom: 0.25rem;
    }

    .code-line {
      display: flex;
      align-items: center;
      line-height: 1.7;
      border-radius: 3px;
      transition: background 200ms;
    }

    .code-line .ln {
      width: 2rem;
      text-align: right;
      color: #6b7280;
      flex-shrink: 0;
      margin-right: 0.75rem;
      user-select: none;
      font-size: 0.7rem;
    }

    .code-line .code-text {
      white-space: pre;
      color: #c9d1d9;
    }

    .code-line.active {
      background: rgba(254, 240, 138, 0.13);
    }

    /* ── Nav row ───────────────────────────────────── */
    .nav-row {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      padding: 0.3rem 0 0.1rem;
      flex-shrink: 0;
    }

    /* ── Keyframes ─────────────────────────────────── */
    @keyframes pulse-red {
      0%   { background: var(--surface); }
      40%  { background: #ef4444; }
      100% { background: var(--surface); }
    }

    @keyframes pulse-red-in-window {
      0%   { background: #1d4ed8; }
      40%  { background: #ef4444; }
      100% { background: #1d4ed8; }
    }

    @keyframes pulse-gold-bg {
      0%   { box-shadow: none; }
      50%  { box-shadow: 0 0 0 3px var(--yellow); }
      100% { box-shadow: none; }
    }

    @keyframes pulse-gold-text {
      0%, 100% { color: var(--text); }
      50%       { color: var(--yellow); }
    }

    @keyframes chip-enter {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes chip-leave {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(-16px); }
    }
  </style>
</head>
<body>
<div class="main-area">

  <!-- String display -->
  <div class="string-panel">
    <div class="string-row" id="stringRow"></div>
  </div>

  <!-- Pointer info bar -->
  <div class="ptr-bar">
    <span><span class="lbl">left = </span><span class="left-val" id="ptrLeft">0</span></span>
    <span><span class="lbl">right = </span><span class="right-val" id="ptrRight">&#x2014;</span></span>
  </div>

  <!-- Metrics row -->
  <div class="metrics-row">
    <div class="metric-card">
      <div class="label">Current Window</div>
      <div class="value" id="metricWindow">&#x2014;</div>
    </div>
    <div class="metric-card">
      <div class="label">Window Size</div>
      <div class="value" id="metricSize">0</div>
    </div>
    <div class="metric-card" id="cardMax">
      <div class="label">Max Length</div>
      <div class="value" id="metricMax">0</div>
    </div>
    <div class="metric-card">
      <div class="label">Best Found</div>
      <div class="value gold" id="metricBest">&#x2014;</div>
    </div>
  </div>

  <!-- Message panel -->
  <div class="message-panel" id="messagePanel">
    <span class="msg-text" id="msgText">Initializing&hellip;</span>
    <span class="step-counter" id="stepCounter">Step 0 / 0</span>
  </div>

  <!-- Bottom two-column: set + code -->
  <div class="bottom-row">
    <div class="set-panel">
      <div class="panel-title">Window Set</div>
      <div class="chip-container" id="chipContainer">
        <span class="empty-set">empty</span>
      </div>
    </div>
    <div class="code-panel" id="codePanel">
      <div class="panel-title">Python</div>
    </div>
  </div>

  <!-- Nav controls -->
  <div class="nav-row">
    <button id="prevBtn" class="btn-step">&#8592; Prev</button>
    <button id="stepBtn" class="btn-step">Step &#8594;</button>
    <button id="playBtn" class="btn-play">Play</button>
    <button id="resetBtn" class="btn-step">&#8634; Reset</button>
    <select id="speedSel">
      <option value="800">0.5&times;</option>
      <option value="400" selected>1&times;</option>
      <option value="200">2&times;</option>
      <option value="100">4&times;</option>
    </select>
  </div>

</div>
<script>
(function() {
  var INPUT = "abcabcbb";

  var PHASE_COLORS = {
    init:      'var(--border)',
    check:     'var(--blue)',
    duplicate: 'var(--red)',
    shrink:    'var(--orange)',
    add:       'var(--green)',
    done:      'var(--yellow)'
  };

  var CODE_LINES = [
    'def length_of_longest_substring(s: str) -> int:',
    '    char_set = set()',
    '    left = 0',
    '    max_len = 0',
    '',
    '    for right in range(len(s)):',
    '        while s[right] in char_set:',
    '            char_set.remove(s[left])',
    '            left += 1',
    '        char_set.add(s[right])',
    '        max_len = max(max_len, right - left + 1)',
    '',
    '    return max_len',
  ];

  // ── Build snapshots ─────────────────────────────────────────────────────────
  function buildSnapshots(s) {
    var snaps = [];

    function push(phase, message, left, right, char_set_arr, max_len, best_start, best_end, opts) {
      opts = opts || {};
      var window_size = (right >= left && right >= 0) ? right - left + 1 : 0;
      var current_window_str = (right >= 0) ? s.slice(left, right + 1) : '';
      var best_window_str = (best_end >= best_start && best_end >= 0) ? s.slice(best_start, best_end + 1) : '';
      snaps.push({
        step: snaps.length,
        phase: phase,
        message: message,
        left: left,
        right: right,
        char_set: char_set_arr.slice(),
        max_len: max_len,
        best_start: best_start,
        best_end: best_end,
        window_size: window_size,
        current_window_str: current_window_str,
        best_window_str: best_window_str,
        duplicate_char: opts.duplicate_char || null,
        active_line: opts.active_line || 1,
        new_max: opts.new_max || false,
        highlight_best: opts.highlight_best || false
      });
    }

    // Step 0 - init
    push('init',
      'Initialize: left=0, right=−≈1 (not started), char_set={}, max_len=0.',
      0, -1, [], 0, 0, -1, { active_line: 2 });

    var left = 0, max_len = 0, best_start = 0, best_end = -1;
    var char_set = [];

    function setHas(ch) { return char_set.indexOf(ch) !== -1; }
    function setAdd(ch) { if (!setHas(ch)) char_set.push(ch); }
    function setRemove(ch) { var i = char_set.indexOf(ch); if (i !== -1) char_set.splice(i, 1); }

    for (var right = 0; right < s.length; right++) {
      var ch = s[right];
      var hasDup = setHas(ch);

      // check step
      push('check',
        'right=' + right + ', char=\'' + ch + '\'. Is \'' + ch + '\' in set? ' + (hasDup ? 'Yes.' : 'No.'),
        left, right, char_set, max_len, best_start, best_end,
        { active_line: 7, duplicate_char: hasDup ? ch : null });

      if (hasDup) {
        // duplicate step
        push('duplicate',
          'right=' + right + ', char=\'' + ch + '\'. \'' + ch + '\' is already in set! Must shrink from left.',
          left, right, char_set, max_len, best_start, best_end,
          { active_line: 7, duplicate_char: ch });

        // shrink steps
        while (setHas(ch)) {
          var removed = s[left];
          setRemove(removed);
          left++;
          var stillHas = setHas(ch);
          push('shrink',
            'Remove s[' + (left - 1) + ']=\'' + removed + '\' from set. Advance left to ' + left + '.' +
            (stillHas ? ' \'' + ch + '\' still in set.' : ' \'' + ch + '\' cleared.'),
            left, right, char_set, max_len, best_start, best_end,
            { active_line: 8, duplicate_char: ch });
        }
      }

      // add + update max
      setAdd(ch);
      var new_size = right - left + 1;
      var is_new_max = new_size > max_len;
      if (is_new_max) {
        max_len = new_size;
        best_start = left;
        best_end = right;
      }
      push('add',
        (is_new_max ? 'New max! ' : '') +
        'Add \'' + ch + '\' to set. Window=[' + s.slice(left, right + 1) + '], length=' + new_size + '.' +
        (is_new_max ? ' Max length is now ' + max_len + '.' : ''),
        left, right, char_set, max_len, best_start, best_end,
        { active_line: 11, new_max: is_new_max });
    }

    // done
    push('done',
      'Traversal complete. Longest substring without repeating chars: "' +
      s.slice(best_start, best_end + 1) + '" (length ' + max_len + ').',
      left, s.length - 1, char_set, max_len, best_start, best_end,
      { active_line: 13, highlight_best: true });

    return snaps;
  }

  var SNAPS = buildSnapshots(INPUT);
  var TOTAL = SNAPS.length - 1;

  // ── Build code panel ────────────────────────────────────────────────────────
  var codePanel = document.getElementById('codePanel');
  CODE_LINES.forEach(function(line, i) {
    var lineEl = document.createElement('div');
    lineEl.className = 'code-line';
    lineEl.id = 'cl-' + (i + 1);
    var lnSpan = document.createElement('span');
    lnSpan.className = 'ln';
    lnSpan.textContent = i + 1;
    var codeSpan = document.createElement('span');
    codeSpan.className = 'code-text';
    codeSpan.textContent = line;
    lineEl.appendChild(lnSpan);
    lineEl.appendChild(codeSpan);
    codePanel.appendChild(lineEl);
  });

  // ── Build string row ────────────────────────────────────────────────────────
  var stringRow = document.getElementById('stringRow');
  INPUT.split('').forEach(function(ch, i) {
    var cell = document.createElement('div');
    cell.className = 'char-cell';
    cell.id = 'cell-' + i;
    var chSpan = document.createElement('span');
    chSpan.textContent = ch;
    var idxSpan = document.createElement('span');
    idxSpan.className = 'idx';
    idxSpan.textContent = i;
    cell.appendChild(chSpan);
    cell.appendChild(idxSpan);
    stringRow.appendChild(cell);
  });

  // ── Apply step ──────────────────────────────────────────────────────────────
  function applyStep(snap, animate) {
    // String cells
    INPUT.split('').forEach(function(ch, i) {
      var cell = document.getElementById('cell-' + i);

      // Remove animation classes via reflow trick
      cell.classList.remove('in-window', 'left-ptr', 'right-ptr', 'lr-ptr',
                            'best-window', 'pulse-red', 'pulse-gold');
      // Remove old ptr labels
      var oldLabels = cell.querySelectorAll('.ptr-label');
      for (var j = 0; j < oldLabels.length; j++) oldLabels[j].remove();

      var inWindow = snap.right >= 0 && i >= snap.left && i <= snap.right;
      var isBest   = snap.best_end >= snap.best_start && snap.best_end >= 0 &&
                     i >= snap.best_start && i <= snap.best_end;
      var isLeft   = snap.right >= 0 && i === snap.left;
      var isRight  = snap.right >= 0 && i === snap.right;

      if (isBest) cell.classList.add('best-window');
      if (inWindow) cell.classList.add('in-window');

      if (isLeft && isRight) {
        cell.classList.add('lr-ptr');
      } else if (isLeft) {
        cell.classList.add('left-ptr');
      } else if (isRight) {
        cell.classList.add('right-ptr');
      }

      // Pointer labels
      if (snap.right >= 0) {
        if (isLeft && isRight) {
          var lbl = document.createElement('span');
          lbl.className = 'ptr-label';
          lbl.innerHTML = '<span style="color:var(--green)">L</span>/<span style="color:var(--orange)">R</span>';
          cell.appendChild(lbl);
        } else if (isLeft) {
          var lbl = document.createElement('span');
          lbl.className = 'ptr-label';
          lbl.style.color = 'var(--green)';
          lbl.textContent = 'L';
          cell.appendChild(lbl);
        } else if (isRight) {
          var lbl = document.createElement('span');
          lbl.className = 'ptr-label';
          lbl.style.color = 'var(--orange)';
          lbl.textContent = 'R';
          cell.appendChild(lbl);
        }
      }

      // Pulse animations
      if (animate) {
        if (snap.phase === 'duplicate' && snap.duplicate_char) {
          // Flash right cell AND the matching char already in window
          if (i === snap.right) {
            void cell.offsetWidth;
            cell.classList.add('pulse-red');
          } else if (inWindow && ch === snap.duplicate_char) {
            void cell.offsetWidth;
            cell.classList.add('pulse-red');
          }
        }
        if (snap.phase === 'shrink' && i === snap.left - 1) {
          // Cell just evicted
          void cell.offsetWidth;
          cell.classList.add('pulse-red');
        }
        if (snap.highlight_best && isBest) {
          void cell.offsetWidth;
          cell.classList.add('pulse-gold');
        }
      }
    });

    // Pointer bar
    document.getElementById('ptrLeft').textContent = snap.left;
    document.getElementById('ptrRight').textContent =
      snap.right < 0 ? '— (not started)' : snap.right;

    // Metrics
    document.getElementById('metricWindow').textContent = snap.current_window_str || '—';
    document.getElementById('metricSize').textContent = snap.window_size;
    document.getElementById('metricMax').textContent = snap.max_len;
    document.getElementById('metricBest').textContent = snap.best_window_str || '—';

    // Pulse max card
    var cardMax = document.getElementById('cardMax');
    cardMax.classList.remove('pulse-max');
    if (animate && snap.new_max) {
      void cardMax.offsetWidth;
      cardMax.classList.add('pulse-max');
    }

    // Message panel
    var msgPanel = document.getElementById('messagePanel');
    document.getElementById('msgText').textContent = snap.message;
    document.getElementById('stepCounter').textContent =
      'Step ' + snap.step + ' / ' + TOTAL;
    msgPanel.style.borderLeftColor = PHASE_COLORS[snap.phase] || 'var(--border)';

    // Code panel highlight
    var prevActive = document.querySelector('.code-line.active');
    if (prevActive) prevActive.classList.remove('active');
    var activeEl = document.getElementById('cl-' + snap.active_line);
    if (activeEl) {
      activeEl.classList.add('active');
      activeEl.scrollIntoView({ block: 'nearest' });
    }

    // Chip container
    var container = document.getElementById('chipContainer');
    var currentSet = snap.char_set;

    // Remove chips not in current set
    var existingChips = container.querySelectorAll('.chip');
    for (var k = 0; k < existingChips.length; k++) {
      var chip = existingChips[k];
      if (currentSet.indexOf(chip.dataset.char) === -1) {
        chip.classList.add('leaving');
        (function(el) {
          setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 150);
        })(chip);
      }
    }

    // Add new chips (in insertion order)
    currentSet.forEach(function(c) {
      var existing = container.querySelector('.chip[data-char="' + c + '"]');
      if (!existing) {
        var newChip = document.createElement('span');
        newChip.className = 'chip entering';
        newChip.dataset.char = c;
        newChip.textContent = c;
        container.appendChild(newChip);
      }
    });

    // Empty state
    var emptyEl = container.querySelector('.empty-set');
    if (currentSet.length === 0) {
      if (!emptyEl) {
        var e = document.createElement('span');
        e.className = 'empty-set';
        e.textContent = 'empty';
        container.appendChild(e);
      }
    } else if (emptyEl) {
      container.removeChild(emptyEl);
    }
  }

  function updateStatus(snap, cur, total) {
    // handled inside applyStep
  }

  // ── VizNav init ─────────────────────────────────────────────────────────────
  var nav;

  window.addEventListener('DOMContentLoaded', function() {
    nav = VizNav({
      btnPrev: document.getElementById('prevBtn'),
      btnNext: document.getElementById('stepBtn'),
      btnPlay: document.getElementById('playBtn'),
      speedSel: document.getElementById('speedSel'),
      render: function(snap, cur, total) { applyStep(snap, cur > 0); updateStatus(snap, cur, total); }
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      nav.load(SNAPS);
    });

    nav.load(SNAPS);

    // Hide back-link in iframe context
    if (window.self !== window.top) {
      var bl = document.querySelector('.back-link');
      if (bl) bl.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
