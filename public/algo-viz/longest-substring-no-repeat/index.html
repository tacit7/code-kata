<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Longest Substring Without Repeating Characters</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Fira Code', 'Cascadia Code', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 10px 16px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .viz-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .viz-inputs select, .viz-inputs input[type=text] { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; font-family: inherit; }
  .viz-inputs input[type=text] { width: 180px; }
  .btn-run { padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
  .btn-rand { padding: 7px 14px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 24px; overflow: hidden; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 580px; min-height: 36px; line-height: 1.5; }

  #str-canvas { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 740px; overflow-x: auto; }
  .idx-row { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; }
  .idx-cell { width: 48px; text-align: center; font-size: 10px; color: var(--text-dim); }
  .char-row { display: flex; align-items: flex-start; flex-wrap: nowrap; gap: 6px; padding: 4px 0; }

  .char-wrap { display: flex; flex-direction: column; align-items: center; }
  .char-box { width: 48px; height: 48px; border-radius: 8px; background: #1e293b; border: 2px solid #334155; color: #f1f5f9; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: border-color .25s, background .25s; }
  .char-box.in-window { background: #14532d25; border-color: #22c55e40; }
  .char-box.hl-left  { border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f620; }
  .char-box.hl-right { border-color: #f97316; box-shadow: 0 0 0 3px #f9731620; }
  .char-box.hl-both  { border-color: #a855f7; box-shadow: 0 0 0 3px #a855f720; }
  .char-box.hl-dup   { border-color: #ef4444; background: #7f1d1d30; box-shadow: 0 0 0 3px #ef444420; color: #f87171; }
  .char-box.hl-done  { border-color: #22c55e; background: #14532d40; color: #4ade80; }
  .char-box.past { opacity: 0.3; }

  .badges { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 4px; min-height: 18px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .05em; }
  .badge-L { background: #1e3a5f; color: #3b82f6; border: 1px solid #3b82f6; }
  .badge-R { background: #431407; color: #f97316; border: 1px solid #f97316; }

  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .ptr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptr-table td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
  .ptr-table td:first-child { color: var(--text-muted); width: 52px; }
  .ptr-table td:last-child { color: var(--text); font-weight: 600; }
  .charset-pills { font-size: 11px; min-height: 24px; }
  .c-pill { display: inline-block; background: #14532d40; color: #4ade80; border: 1px solid #22c55e60; border-radius: 4px; padding: 1px 7px; margin: 2px; font-weight: 700; }

  #code-panel { width: 220px; min-width: 120px; max-width: 560px; overflow-x: auto; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; flex-shrink: 0; }
  #code-pre { font-size: 11px; line-height: 1.7; font-family: inherit; overflow-x: auto; }
  .code-line { padding: 0 4px; border-radius: 3px; display: block; transition: background .2s; white-space: pre; }
  .code-line.active { background: #451a0350; color: #fbbf24; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .cm { color: #546e7a; font-style: italic; }
  .str { color: #c3e88d; } .num { color: #f78c6c; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  #resize-handle { width:5px; flex-shrink:0; cursor:col-resize; background:transparent; border-right:1px solid var(--border); transition:background .15s; z-index:10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
</style>
</head>
<body>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Longest Substring Without Repeating Characters</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div class="viz-inputs">
  <div>
    <span class="viz-label">Preset</span>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value="abcabcbb">abcabcbb (ans: 3)</option>
      <option value="bbbbb">bbbbb (ans: 1)</option>
      <option value="pwwkew">pwwkew (ans: 3)</option>
      <option value="dvdf">dvdf (ans: 3)</option>
      <option value="abcdefg">abcdefg (ans: 7)</option>
    </select>
  </div>
  <div>
    <span class="viz-label">Input String</span>
    <input id="strInput" type="text" value="abcabcbb" maxlength="16" />
  </div>
  <button class="btn-run" onclick="buildAndRun()">Run</button>
  <button class="btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>

<div id="main">
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <pre id="code-pre"></pre>
  </div>
  <div id="resize-handle"></div>
  <div id="viz-area">
    <div id="desc">Initializing...</div>
    <div id="str-canvas"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <table class="ptr-table"><tbody id="ptr-body"></tbody></table>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Window (charSet)</div>
      <div class="charset-pills" id="charset-pills"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Result</div>
      <div id="result-display"></div>
    </div>
  </div>
</div>

<div class="controls"></div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8634; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var CODE_LINES = [
  { n: 1,  t: '<span class="kw">def</span> <span class="fn">lengthOfLongestSubstring</span>(s):' },
  { n: 2,  t: '    charSet = <span class="fn">set</span>()' },
  { n: 3,  t: '    left = maxLen = <span class="num">0</span>' },
  { n: 4,  t: '    <span class="kw">for</span> right <span class="kw">in</span> <span class="fn">range</span>(<span class="fn">len</span>(s)):' },
  { n: 5,  t: '        <span class="kw">while</span> s[right] <span class="kw">in</span> charSet:' },
  { n: 6,  t: '            charSet.remove(s[left])' },
  { n: 7,  t: '            left += <span class="num">1</span>' },
  { n: 8,  t: '        charSet.add(s[right])' },
  { n: 9,  t: '        maxLen = <span class="fn">max</span>(maxLen, right - left + <span class="num">1</span>)' },
  { n: 10, t: '    <span class="kw">return</span> maxLen' },
];

function buildSnapshots(s) {
  var snaps = [];
  var charSet = new Set();
  var left = 0;
  var maxLen = 0;

  function mkSnap(phase, desc, extra) {
    var base = {
      phase: phase,
      desc: desc,
      s: s,
      left: left,
      right: -1,
      charSet: Array.from(charSet),
      maxLen: maxLen,
      currentLen: 0,
      dupIdx: null,
      activeLine: 0,
    };
    if (extra) {
      Object.keys(extra).forEach(function(k) { base[k] = extra[k]; });
    }
    return base;
  }

  snaps.push(mkSnap('init',
    'Initialize: charSet = {}, left = 0, maxLen = 0. The right pointer will scan each character in "' + s + '".',
    { right: -1, activeLine: 2 }
  ));

  for (var right = 0; right < s.length; right++) {
    var c = s[right];

    if (charSet.has(c)) {
      snaps.push(mkSnap('shrink',
        'right=' + right + ': s[' + right + ']="' + c + '" already in charSet {' + Array.from(charSet).join(', ') + '}. Collision! Must shrink window from the left.',
        { right: right, dupIdx: right, activeLine: 5 }
      ));

      while (charSet.has(c)) {
        var removed = s[left];
        charSet.delete(removed);
        var stillDup = charSet.has(c);
        snaps.push(mkSnap('shrink',
          'Remove s[' + left + ']="' + removed + '" from charSet. left becomes ' + (left + 1) + '. charSet = {' + Array.from(charSet).join(', ') + '}' + (stillDup ? '. Still colliding, continue.' : '. Collision resolved.'),
          { right: right, left: left + 1, charSet: Array.from(charSet), dupIdx: stillDup ? right : null, activeLine: 6 }
        ));
        left++;
      }
    } else {
      snaps.push(mkSnap('expand',
        'right=' + right + ': s[' + right + ']="' + c + '" not in charSet. Expand window to include it.',
        { right: right, activeLine: 4 }
      ));
    }

    charSet.add(c);
    maxLen = Math.max(maxLen, right - left + 1);

    snaps.push(mkSnap('expand',
      'Add "' + c + '" to charSet. Window = "' + s.slice(left, right + 1) + '" (len=' + (right - left + 1) + '). maxLen = ' + maxLen + '.',
      { right: right, charSet: Array.from(charSet), maxLen: maxLen, currentLen: right - left + 1, activeLine: 8 }
    ));
  }

  snaps.push(mkSnap('done',
    'Done! The longest substring without repeating characters has length ' + maxLen + '.',
    { right: s.length - 1, charSet: Array.from(charSet), maxLen: maxLen, currentLen: charSet.size, activeLine: 10 }
  ));

  return snaps;
}

function buildStrHtml(snap) {
  var s = snap.s;
  var left = snap.left;
  var right = snap.right;
  var dupIdx = snap.dupIdx;
  var phase = snap.phase;

  var idxHtml = '<div class="idx-row">';
  var rowHtml = '<div class="char-row">';

  for (var i = 0; i < s.length; i++) {
    idxHtml += '<div class="idx-cell">' + i + '</div>';

    var classes = ['char-box'];

    if (phase === 'done') {
      classes.push('hl-done');
    } else if (right < 0) {
      /* init: no window highlighting */
    } else if (i === dupIdx) {
      classes.push('hl-dup');
    } else if (i === left && i === right) {
      classes.push('hl-both');
    } else if (i === left) {
      classes.push('hl-left');
    } else if (i === right) {
      classes.push('hl-right');
    } else if (i > left && i < right) {
      classes.push('in-window');
    } else if (i < left) {
      classes.push('past');
    }

    var badges = [];
    if (phase !== 'done' && right >= 0) {
      if (i === left) badges.push('<span class="badge badge-L">L</span>');
      if (i === right) badges.push('<span class="badge badge-R">R</span>');
    }

    rowHtml += '<div class="char-wrap">'
      + '<div class="' + classes.join(' ') + '">' + s[i] + '</div>'
      + '<div class="badges">' + badges.join('') + '</div>'
      + '</div>';
  }

  idxHtml += '</div>';
  rowHtml += '</div>';

  return '<div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;">'
    + idxHtml + rowHtml + '</div>';
}

function updateSidebar(snap) {
  var s = snap.s;
  var left = snap.left;
  var right = snap.right;
  var charSet = snap.charSet;
  var maxLen = snap.maxLen;
  var currentLen = snap.currentLen;

  var tbody = document.getElementById('ptr-body');
  var rows = '';
  if (right >= 0) {
    rows += '<tr><td>left</td><td>' + left + ' &rarr; "' + (s[left] || '') + '"</td></tr>';
    rows += '<tr><td>right</td><td>' + right + ' &rarr; "' + s[right] + '"</td></tr>';
    rows += '<tr><td>len</td><td>' + currentLen + '</td></tr>';
  } else {
    rows += '<tr><td>left</td><td>0</td></tr>';
    rows += '<tr><td>right</td><td>&mdash;</td></tr>';
    rows += '<tr><td>len</td><td>0</td></tr>';
  }
  tbody.innerHTML = rows;

  var pills = document.getElementById('charset-pills');
  if (!charSet || charSet.length === 0) {
    pills.innerHTML = '<span style="color:var(--text-dim)">{ } empty</span>';
  } else {
    pills.innerHTML = charSet.map(function(c) {
      return '<span class="c-pill">' + c + '</span>';
    }).join('');
  }

  document.getElementById('result-display').innerHTML =
    '<span style="color:var(--text-muted);font-size:11px;">maxLen: </span>'
    + '<span style="color:#fbbf24;font-weight:700;font-size:16px;">' + maxLen + '</span>';
}

function renderCode(activeLine) {
  var pre = document.getElementById('code-pre');
  pre.innerHTML = CODE_LINES.map(function(l) {
    var cls = (l.n === activeLine) ? 'code-line active' : 'code-line';
    return '<span class="' + cls + '">' + (l.t || ' ') + '</span>';
  }).join('');
  var active = pre.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

var PHASE_LABELS = { init: 'Init', expand: 'Expand', shrink: 'Shrink', done: 'Done' };
var PHASE_STYLES = {
  init:   { bg: '#1e293b',   color: '#94a3b8', border: '#475569' },
  expand: { bg: '#0d2d1a',   color: '#4ade80', border: '#22c55e' },
  shrink: { bg: '#2d1200',   color: '#f97316', border: '#f97316' },
  done:   { bg: '#14532d',   color: '#4ade80', border: '#22c55e' },
};

function applyStep(snap) {
  var badge = document.getElementById('phase-badge');
  var ps = PHASE_STYLES[snap.phase] || PHASE_STYLES.init;
  badge.textContent = PHASE_LABELS[snap.phase] || snap.phase;
  badge.style.background = ps.bg;
  badge.style.color = ps.color;
  badge.style.borderColor = ps.border;

  document.getElementById('desc').textContent = snap.desc;
  document.getElementById('str-canvas').innerHTML = buildStrHtml(snap);

  updateSidebar(snap);
  renderCode(snap.activeLine);
}

function updateStatus(snap, cur, total) {
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.reset();
});

function loadPreset() {
  var v = document.getElementById('presetSel').value;
  if (v) {
    document.getElementById('strInput').value = v;
    buildAndRun();
  }
}

function buildAndRun() {
  var s = document.getElementById('strInput').value.trim() || 'abcabcbb';
  document.getElementById('presetSel').value = '';
  var snaps = buildSnapshots(s);
  if (window.nav) window.nav.load(snaps);
}

function randomExample() {
  var examples = ['abcabcbb', 'bbbbb', 'pwwkew', 'dvdf', 'abcdefg', 'tmmzuxt', 'aab', 'anvisl', 'ohvhjdml'];
  var s = examples[Math.floor(Math.random() * examples.length)];
  document.getElementById('strInput').value = s;
  document.getElementById('presetSel').value = '';
  var snaps = buildSnapshots(s);
  if (window.nav) window.nav.load(snaps);
}

document.addEventListener('DOMContentLoaded', function() {
  var s = document.getElementById('strInput').value || 'abcabcbb';
  var snaps = buildSnapshots(s);

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) { applyStep(snap); updateStatus(snap, cur, total); }
  });

  window.nav.load(snaps);
});

(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = e.clientX - startX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
