<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kth Largest Element in a Stream</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-size: 0.75rem; line-height: 1.8; }
    .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
    .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
    .kw { color: var(--purple); }
    .nb { color: var(--green); }
    .fn { color: var(--blue); }
    .cm { color: var(--text-dim); font-style: italic; }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border-color: var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }

    /* page-specific */
    .panels-row { display: flex; gap: 14px; flex: 1; min-height: 0; overflow: hidden; }
    .panel {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:14px 16px;
      display:flex; flex-direction:column; gap:10px;
      overflow:hidden; min-height:0; flex: 1;
    }
    .panel-title {
      font-size:0.72rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim);
      flex-shrink:0;
    }
    .panel-meta {
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    #heap-badge {
      font-size:0.72rem; font-weight:700; font-family:monospace;
      padding:2px 10px; border-radius:20px;
      background:var(--bg); border:1px solid var(--border);
      color:var(--text-dim);
    }
    .heap-rows { display:flex; flex-direction:column; gap:4px; overflow-y:auto; flex:1; }
    .heap-row {
      display:flex; align-items:center; gap:10px;
      padding:7px 12px; border-radius:6px;
      background:var(--bg); border:1px solid var(--border);
      font-family:monospace; font-size:0.82rem;
      transition:border-color 0.2s, background 0.2s;
    }
    .heap-row.is-min   { border-color:#7c3aed; background:#1a0e2e; }
    .heap-row.is-new   { border-color:var(--accent); background:#1e1a3a; }
    .heap-row.is-evict { border-color:#dc2626; background:#1f0a0a; }
    .heap-rank { width:18px; color:var(--text-ghost); font-size:0.7rem; text-align:right; }
    .heap-val  { color:var(--text-bright); flex:1; font-size:0.9rem; font-weight:600; }
    .heap-note { color:var(--text-dim); font-size:0.73rem; }
    .stream-log { display:flex; flex-direction:column; gap:5px; overflow-y:auto; flex:1; }
    .log-row {
      display:flex; align-items:center; gap:10px;
      padding:8px 12px; border-radius:6px;
      background:var(--bg); border:1px solid var(--border);
      font-family:monospace; font-size:0.82rem;
      transition:border-color 0.2s, background 0.2s;
    }
    .log-row.current  { border-color:var(--accent); background:#1e1a3a; }
    .log-row.answered { border-color:#166534; background:#052e16; }
    .log-num   { color:var(--text-bright); font-weight:600; min-width:28px; }
    .log-arrow { color:var(--text-ghost); }
    .log-ans   { color:#4ade80; font-weight:700; }
    .log-pending { color:var(--text-ghost); font-style:italic; }
    .kth-badge {
      display:inline-flex; align-items:center; gap:6px;
      font-size:0.78rem; font-family:monospace;
      padding:3px 10px; border-radius:20px;
      background:#1a0e2e; border:1px solid #7c3aed;
      color:#a78bfa;
    }
    .kth-badge .kth-val { font-weight:700; font-size:0.9rem; color:#c4b5fd; }
    #step-desc-box { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"k":3,"nums":"4,5,8,2","stream":"3,5,10,9,4"}'>k=3, nums=[4,5,8,2], stream=[3,5,10,9,4]</option>
      <option value='{"k":1,"nums":"","stream":"1,2,3,4,5"}'>k=1 (always max)</option>
      <option value='{"k":2,"nums":"1","stream":"7,2,9,3"}'>k=2 small init</option>
      <option value='{"k":4,"nums":"10,20,30,40,50","stream":"5,15,25"}'>k=4 large init</option>
      <option value='{"k":3,"nums":"","stream":"5,3,1,9,7,2"}'>k=3 no init</option>
    </select>
  </div>
  <div>
    <label>k</label>
    <input id="inp-k" type="number" value="3" min="1" max="20" style="width:60px" />
  </div>
  <div>
    <label>Initial nums</label>
    <input id="inp-nums" type="text" value="4,5,8,2" style="width:150px;font-family:monospace" />
  </div>
  <div>
    <label>Stream values</label>
    <input id="inp-stream" type="text" value="3,5,10,9,4" style="width:150px;font-family:monospace" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Build &amp; Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Kth Largest in Stream</span>
  <span style="font-size:12px;color:var(--text-muted)">LeetCode 703 &middot; Min-heap of size k &middot; O(n log k) time &middot; O(k) space</span>
  <span id="step-counter"></span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="panels-row">
      <div class="panel">
        <div class="panel-meta">
          <div class="panel-title">Min-Heap (size k)</div>
          <span id="heap-badge">size: 0 / k: —</span>
        </div>
        <div style="flex-shrink:0" id="kth-answer-wrap"></div>
        <div class="heap-rows" id="heap-rows">
          <div style="color:var(--text-ghost);font-size:0.82rem;text-align:center;padding:24px 0">Heap is empty</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Stream Log</div>
        <div class="stream-log" id="stream-log">
          <div style="color:var(--text-ghost);font-size:0.82rem;text-align:center;padding:24px 0">No stream values yet</div>
        </div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Step</div>
      <div id="step-desc-box">Enter values and click Build &amp; Run.</div>
    </div>
    <div>
      <div class="sidebar-title">State</div>
      <div style="font-size:11px;font-family:monospace;color:var(--text-muted)">
        <div style="padding:4px 0;border-bottom:1px solid var(--border-soft)"><span style="color:var(--text-dim)">k:</span> <span id="sb-k" style="color:var(--accent);font-weight:700">—</span></div>
        <div style="padding:4px 0;border-bottom:1px solid var(--border-soft)"><span style="color:var(--text-dim)">heap size:</span> <span id="sb-size" style="color:var(--accent);font-weight:700">—</span></div>
        <div style="padding:4px 0"><span style="color:var(--text-dim)">kth largest:</span> <span id="sb-kth" style="color:#c4b5fd;font-weight:700">—</span></div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&larr;</button>
  <button class="btn-step" id="stepBtn" disabled>&rarr;</button>
  <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="900">Slow</option>
    <option value="450" selected>Medium</option>
    <option value="140">Fast</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentK = 0, currentNums = [], currentStream = [];

var CODE_LINES = [
  [1,  '<span class="kw">import</span> heapq'],
  [2,  '<span class="kw">class</span> <span class="fn">KthLargest</span>:'],
  [3,  '  <span class="kw">def</span> <span class="fn">__init__</span>(self, k, nums):'],
  [4,  '    self.k = k'],
  [5,  '    self.heap = []'],
  [6,  '    <span class="kw">for</span> n <span class="kw">in</span> nums:'],
  [7,  '      heapq.heappush(self.heap, n)'],
  [8,  '      <span class="kw">if</span> len(self.heap) > k:'],
  [9,  '        heapq.heappop(self.heap)'],
  [0,  ''],
  [11, '  <span class="kw">def</span> <span class="fn">add</span>(self, val):'],
  [12, '    heapq.heappush(self.heap, val)'],
  [13, '    <span class="kw">if</span> len(self.heap) > self.k:'],
  [14, '      heapq.heappop(self.heap)'],
  [15, '    <span class="kw">return</span> self.heap[<span class="nb">0</span>]'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE_LINES.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="cl"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function minHeapPush(heap, val) {
  heap.push(val);
  var i = heap.length - 1;
  while (i > 0) {
    var pi = (i - 1) >> 1;
    if (heap[i] < heap[pi]) { var t=heap[i]; heap[i]=heap[pi]; heap[pi]=t; i=pi; }
    else break;
  }
}
function minHeapPop(heap) {
  var top = heap[0];
  var last = heap.pop();
  if (heap.length > 0) {
    heap[0] = last;
    var i = 0;
    while (true) {
      var l=2*i+1, r=2*i+2, smallest=i;
      if (l<heap.length && heap[l]<heap[smallest]) smallest=l;
      if (r<heap.length && heap[r]<heap[smallest]) smallest=r;
      if (smallest!==i) { var t=heap[i]; heap[i]=heap[smallest]; heap[smallest]=t; i=smallest; }
      else break;
    }
  }
  return top;
}

function simulate(k, nums, stream) {
  var steps = [];
  var heap = [];

  function snap(phase, desc, opts) {
    opts = opts || {};
    steps.push({
      phase:        phase,
      desc:         desc,
      heap:         heap.slice(),
      newVal:       opts.newVal !== undefined ? opts.newVal : null,
      evictVal:     opts.evictVal !== undefined ? opts.evictVal : null,
      streamIdx:    opts.streamIdx !== undefined ? opts.streamIdx : -1,
      streamAnswers: opts.streamAnswers ? opts.streamAnswers.slice() : [],
      initIdx:      opts.initIdx !== undefined ? opts.initIdx : -1,
      isInit:       !!opts.isInit,
    });
  }

  var streamAnswers = [];

  snap('Start', 'Initialize: push each num into the min-heap, evict the minimum whenever size exceeds k=' + k + '.', { isInit:true, initIdx:-1 });

  for (var i = 0; i < nums.length; i++) {
    var v = nums[i];
    minHeapPush(heap, v);
    snap('Init:push', 'Push ' + v + ' → heap size ' + heap.length + '.', { isInit:true, initIdx:i, newVal:v });
    if (heap.length > k) {
      var evicted = minHeapPop(heap);
      snap('Init:evict', 'Heap size ' + (heap.length+1) + ' > k=' + k + ' → evict min (' + evicted + '). Heap now has ' + heap.length + ' elements.', { isInit:true, initIdx:i, evictVal:evicted });
    }
  }

  var initAns = heap.length >= k ? heap[0] : null;
  snap('Init:done', 'Init complete. Heap: [' + heap.slice().sort(function(a,b){return a-b;}).join(', ') + ']. ' + (initAns !== null ? 'Kth largest = ' + initAns + '.' : 'Heap has fewer than k elements — need more values.'), { isInit:true, initIdx:-1 });

  for (var si = 0; si < stream.length; si++) {
    var sv = stream[si];
    snap('Stream:consider', 'add(' + sv + '): push ' + sv + ' into the heap.', { streamIdx:si, streamAnswers:streamAnswers, newVal:sv });

    minHeapPush(heap, sv);
    snap('Stream:push', 'Pushed ' + sv + '. Heap size = ' + heap.length + '.', { streamIdx:si, streamAnswers:streamAnswers, newVal:sv });

    if (heap.length > k) {
      var ev2 = minHeapPop(heap);
      snap('Stream:evict', 'Size ' + (heap.length+1) + ' > k=' + k + ' → evict min (' + ev2 + '). Heap size back to k.', { streamIdx:si, streamAnswers:streamAnswers, evictVal:ev2 });
    }

    var ans = heap[0];
    streamAnswers = streamAnswers.concat([ans]);
    snap('Stream:answer', 'Heap min = ' + ans + ' → kth largest is ' + ans + '.', { streamIdx:si, streamAnswers:streamAnswers });
  }

  snap('Done', 'All ' + stream.length + ' stream values processed. Answers: [' + streamAnswers.join(', ') + '].', { streamIdx:-1, streamAnswers:streamAnswers });
  return steps;
}

function applyStep(s, animate) {
  renderHeap(s);
  renderStreamLog(s);
  var sbK   = document.getElementById('sb-k');
  var sbSz  = document.getElementById('sb-size');
  var sbKth = document.getElementById('sb-kth');
  if (sbK)   sbK.textContent   = currentK;
  if (sbSz)  sbSz.textContent  = s.heap.length;
  var kthVal = s.heap.length >= currentK ? s.heap[0] : null;
  if (sbKth) sbKth.textContent = kthVal !== null ? kthVal : '—';
}

function renderHeap(s) {
  var badge   = document.getElementById('heap-badge');
  var rows    = document.getElementById('heap-rows');
  var ansWrap = document.getElementById('kth-answer-wrap');

  badge.textContent = 'size: ' + s.heap.length + ' / k: ' + currentK;

  var heapMin = s.heap.length >= currentK ? s.heap[0] : null;
  if (heapMin !== null) {
    ansWrap.innerHTML = '<span class="kth-badge">kth largest = <span class="kth-val">' + heapMin + '</span></span>';
  } else {
    ansWrap.innerHTML = '<span style="color:var(--text-ghost);font-size:0.78rem">waiting for k values…</span>';
  }

  if (s.heap.length === 0) {
    rows.innerHTML = '<div style="color:var(--text-ghost);font-size:0.82rem;text-align:center;padding:24px 0">Heap is empty</div>';
    return;
  }

  var sorted = s.heap.slice().sort(function(a,b){return a-b;});
  rows.innerHTML = sorted.map(function(val, rank) {
    var isMin    = (rank === 0);
    var isNew    = (s.newVal !== null && val === s.newVal && (s.phase === 'Stream:push' || s.phase === 'Init:push'));
    var isEvict  = (s.evictVal !== null && val === s.evictVal);
    var cls = 'heap-row' + (isEvict ? ' is-evict' : isNew ? ' is-new' : isMin ? ' is-min' : '');
    var note = isMin ? '← min (kth largest)' : '';
    return '<div class="' + cls + '">'
      + '<span class="heap-rank">' + (rank+1) + '</span>'
      + '<span class="heap-val">' + val + '</span>'
      + (note ? '<span class="heap-note">' + note + '</span>' : '')
      + '</div>';
  }).join('');
}

function renderStreamLog(s) {
  var log = document.getElementById('stream-log');

  if (!currentStream.length) {
    log.innerHTML = '<div style="color:var(--text-ghost);font-size:0.82rem;text-align:center;padding:24px 0">No stream values</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < currentStream.length; i++) {
    var answered = i < s.streamAnswers.length;
    var isCurrent = (i === s.streamIdx);
    var cls = 'log-row' + (isCurrent ? ' current' : answered ? ' answered' : '');
    html += '<div class="' + cls + '">'
      + '<span class="log-num">add(' + currentStream[i] + ')</span>'
      + '<span class="log-arrow">→</span>';
    if (answered) {
      html += '<span class="log-ans">' + s.streamAnswers[i] + '</span>';
    } else {
      html += '<span class="log-pending">…</span>';
    }
    html += '</div>';
  }

  log.innerHTML = html;

  var currentEl = log.querySelector('.log-row.current');
  if (currentEl) currentEl.scrollIntoView({block:'nearest'});
}

function parseCSV(raw) {
  return raw.split(',').map(function(s){return parseInt(s.trim(),10);}).filter(function(n){return !isNaN(n);});
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-k').value      = d.k;
  document.getElementById('inp-nums').value   = d.nums;
  document.getElementById('inp-stream').value = d.stream;
  buildAndRun();
}

function randomExample() {
  var examples = [
    {k:2, nums:'1,5', stream:'3,7,2,8'},
    {k:3, nums:'2,4,6', stream:'1,3,5,7,9'},
    {k:1, nums:'', stream:'4,2,8,1,6'},
    {k:4, nums:'10,20,30,40', stream:'5,25,15,35'},
    {k:2, nums:'1,2,3,4,5', stream:'6,0,4'},
  ];
  var pick = examples[Math.floor(Math.random() * examples.length)];
  document.getElementById('inp-k').value      = pick.k;
  document.getElementById('inp-nums').value   = pick.nums;
  document.getElementById('inp-stream').value = pick.stream;
  document.getElementById('presetSel').value  = '';
  buildAndRun();
}

function buildAndRun() {
  var k      = parseInt(document.getElementById('inp-k').value, 10);
  var nums   = parseCSV(document.getElementById('inp-nums').value);
  var stream = parseCSV(document.getElementById('inp-stream').value);

  if (isNaN(k) || k < 1) return;

  currentK      = k;
  currentNums   = nums;
  currentStream = stream;

  simSteps = simulate(k, nums, stream);
  nav.load(simSteps);
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var badge   = document.getElementById('phase-badge');
      var counter = document.getElementById('step-counter');
      var descEl  = document.getElementById('step-desc-box');
      if (badge)   badge.textContent   = snap.phase;
      if (counter) counter.textContent = 'Step ' + (cur+1) + ' / ' + total;
      if (descEl)  descEl.textContent  = snap.desc;
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
  buildAndRun();
});
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return; dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
