<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valid Sudoku</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2d3148;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #4a5568;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --purple: #a855f7;
      --blue: #3b82f6;
      --yellow: #eab308;
      --radius-sm: 4px;
      --radius-lg: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Fira Mono', 'Cascadia Code', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex-shrink: 0; }
    .vi-btn { padding: 5px 12px; border-radius: var(--radius-sm); font-size: 0.8rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: all 0.15s; }
    .vi-btn:hover { border-color: var(--accent); color: var(--accent-hover); }
    .vi-btn.invalid-active { border-color: var(--red); color: var(--red); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; gap: 12px; padding: 12px; overflow: auto; align-items: flex-start; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 340px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; padding: 10px; gap: 8px; }
    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: all 0.15s; }
    .btn-step:hover { border-color: var(--accent); color: var(--accent-hover); }
    .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-play:hover { background: var(--accent-hover); }
    select#speedSel { padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); font-family: inherit; font-size: 0.8rem; cursor: pointer; }

    /* Sudoku grid */
    .grid-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
    .sudoku-grid { display: grid; grid-template-columns: repeat(9, 42px); grid-template-rows: repeat(9, 42px); border: 2px solid var(--text-muted); border-radius: var(--radius-sm); overflow: hidden; }
    .cell { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 600; color: var(--text); background: var(--surface); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transition: background 0.15s, color 0.15s; cursor: default; user-select: none; }
    .cell.col-2, .cell.col-5 { border-right: 2px solid var(--text-muted); }
    .cell.row-2, .cell.row-5 { border-bottom: 2px solid var(--text-muted); }
    .cell.col-8 { border-right: none; }
    .cell.row-8 { border-bottom: none; }
    .cell.empty { color: var(--text-dim); }
    .cell.visited { background: #22304a; color: var(--text-muted); }
    .cell.current { background: var(--orange); color: #000; }
    .cell.conflict { background: var(--red); color: #fff; }
    .cell.skipped { background: #1e293b; color: var(--text-dim); }

    /* Set groups panel */
    .sets-panel { display: flex; flex-direction: column; gap: 10px; min-width: 180px; max-width: 280px; }
    .set-group { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
    .set-group.highlighted { border-color: var(--orange); }
    .set-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .set-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
    .chip { background: var(--accent); color: #fff; border-radius: var(--radius-sm); padding: 2px 7px; font-size: 0.75rem; font-weight: 700; }
    .chip.new { background: var(--orange); color: #000; }

    /* Status in sidebar */
    .status-bar { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
    .status-bar .ok { color: var(--green); }
    .status-bar .err { color: var(--red); }
    .status-bar .hi { color: var(--orange); }

    /* Code in code-panel */
    .code-toggle-btn { background: none; border: none; color: var(--text-muted); font-size: 0.78rem; cursor: pointer; text-align: left; padding: 0; font-family: inherit; }
    .code-toggle-btn:hover { color: var(--text); }
    .code-block { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .code-block pre { margin: 0; padding: 10px 14px; font-size: 0.76rem; line-height: 1.65; overflow-x: auto; color: var(--text-muted); }
    .code-block .code-line { display: block; padding: 0 2px; border-radius: 2px; }
    .code-block .code-line.active { background: rgba(245,158,11,0.2); color: var(--orange); }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <button class="vi-btn" id="boardToggle" onclick="toggleBoard()">Switch to Invalid Board</button>
  <button class="vi-btn" onclick="loadPreset()">&#9654; Valid Board</button>
  <button class="vi-btn" onclick="randomExample()">&#127922; Invalid Board</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Valid Sudoku</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="grid-wrap">
      <div class="sudoku-grid" id="grid"></div>
    </div>
    <div class="sets-panel">
      <div class="set-group" id="rowSetDisplay">
        <div class="set-label" id="rowSetLabel">Row &mdash; set</div>
        <div class="set-chips" id="rowSetChips"></div>
      </div>
      <div class="set-group" id="colSetDisplay">
        <div class="set-label" id="colSetLabel">Col &mdash; set</div>
        <div class="set-chips" id="colSetChips"></div>
      </div>
      <div class="set-group" id="boxSetDisplay">
        <div class="set-label" id="boxSetLabel">Box &mdash; set</div>
        <div class="set-chips" id="boxSetChips"></div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <button class="code-toggle-btn" id="codeToggle">&#9654; Show Code</button>
    <div class="code-block" id="codePanel" style="display:none">
      <pre id="codePre"></pre>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-title">Status</div>
    <div class="status-bar" id="statusBar">Ready. Press Step or Play to begin.</div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
  var VALID_BOARD = [
    ["5","3",".",".","7",".",".",".","."],
    ["6",".",".","1","9","5",".",".","."],
    [".","9","8",".",".",".",".","6","."],
    ["8",".",".",".","6",".",".",".","3"],
    ["4",".",".","8",".","3",".",".","1"],
    ["7",".",".",".","2",".",".",".","6"],
    [".","6",".",".",".",".","2","8","."],
    [".",".",".","4","1","9",".",".","5"],
    [".",".",".",".","8",".",".","7","9"]
  ];

  var INVALID_BOARD = VALID_BOARD.map(function(r) { return r.slice(); });
  INVALID_BOARD[0] = ["5","5",".",".","7",".",".",".","."];

  var currentBoard = VALID_BOARD;
  var useInvalid = false;
  var steps = [];

  function cloneSets(arr) { return arr.map(function(s) { return s.slice(); }); }

  function buildSteps() {
    steps = [];
    var board = currentBoard;
    var rows  = Array.from({length:9}, function() { return []; });
    var cols  = Array.from({length:9}, function() { return []; });
    var boxes = Array.from({length:9}, function() { return []; });

    steps.push({ r:-1, c:-1, val:null, phase:'init', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:null, result:null, checkedCells:[], highlightRow:-1, highlightCol:-1, highlightBox:-1 });

    var checked = [];
    var done = false;

    for (var r = 0; r < 9 && !done; r++) {
      for (var c = 0; c < 9 && !done; c++) {
        var val = board[r][c];
        var boxIdx = Math.floor(r/3)*3 + Math.floor(c/3);

        if (val === '.') {
          steps.push({ r:r, c:c, val:val, phase:'skip', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:null, result:null, checkedCells:checked.slice(), highlightRow:r, highlightCol:c, highlightBox:boxIdx });
          checked.push([r, c]);
          continue;
        }

        var conflictType = null;
        if (rows[r].indexOf(val) >= 0) conflictType = 'row';
        else if (cols[c].indexOf(val) >= 0) conflictType = 'col';
        else if (boxes[boxIdx].indexOf(val) >= 0) conflictType = 'box';

        if (conflictType) {
          steps.push({ r:r, c:c, val:val, phase:'conflict', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:conflictType, result:false, checkedCells:checked.slice(), highlightRow:r, highlightCol:c, highlightBox:boxIdx });
          steps.push({ r:-1, c:-1, val:null, phase:'done', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:null, result:false, checkedCells:checked.slice(), highlightRow:-1, highlightCol:-1, highlightBox:-1 });
          done = true;
          break;
        }

        steps.push({ r:r, c:c, val:val, phase:'check', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:null, result:null, checkedCells:checked.slice(), highlightRow:r, highlightCol:c, highlightBox:boxIdx });

        rows[r].push(val);
        cols[c].push(val);
        boxes[boxIdx].push(val);

        steps.push({ r:r, c:c, val:val, phase:'add', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:null, result:null, checkedCells:checked.slice(), highlightRow:r, highlightCol:c, highlightBox:boxIdx });

        checked.push([r, c]);
      }
    }

    if (steps[steps.length-1].phase !== 'done') {
      steps.push({ r:-1, c:-1, val:null, phase:'done', rowSets:cloneSets(rows), colSets:cloneSets(cols), boxSets:cloneSets(boxes), conflictType:null, result:true, checkedCells:checked.slice(), highlightRow:-1, highlightCol:-1, highlightBox:-1 });
    }
  }

  var gridEl = document.getElementById('grid');
  var cells = [];

  function buildGrid() {
    gridEl.innerHTML = '';
    cells.length = 0;
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        var el = document.createElement('div');
        el.className = 'cell row-' + r + ' col-' + c;
        var val = currentBoard[r][c];
        el.textContent = val === '.' ? '' : val;
        gridEl.appendChild(el);
        cells.push(el);
      }
    }
  }

  function cellEl(r, c) { return cells[r*9+c]; }

  var CODE_LINES = [
    'def is_valid_sudoku(board):',
    '    rows = [set() for _ in range(9)]',
    '    cols = [set() for _ in range(9)]',
    '    boxes = [set() for _ in range(9)]',
    '',
    '    for r in range(9):',
    '        for c in range(9):',
    '            val = board[r][c]',
    '            if val == ".":',
    '                continue',
    '            box_idx = (r // 3) * 3 + (c // 3)',
    '            if (val in rows[r] or val in cols[c]',
    '                    or val in boxes[box_idx]):',
    '                return False',
    '            rows[r].add(val)',
    '            cols[c].add(val)',
    '            boxes[box_idx].add(val)',
    '    return True'
  ];

  function phaseToLine(phase) {
    switch(phase) {
      case 'init':     return [1,2,3];
      case 'skip':     return [8,9];
      case 'check':    return [11,12];
      case 'conflict': return [13];
      case 'add':      return [14,15,16];
      case 'done':     return [17];
      default:         return [];
    }
  }

  function renderCode(snap) {
    var active = {};
    phaseToLine(snap.phase).forEach(function(i) { active[i] = true; });
    var codePre = document.getElementById('codePre');
    codePre.innerHTML = CODE_LINES.map(function(line, i) {
      var cls = active[i] ? 'code-line active' : 'code-line';
      var escaped = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<span class="' + cls + '">' + (escaped || ' ') + '</span>';
    }).join('\n');
  }

  function renderSets(snap) {
    var hr = snap.highlightRow, hc = snap.highlightCol, hb = snap.highlightBox;
    document.getElementById('rowSetDisplay').classList.toggle('highlighted', hr >= 0);
    document.getElementById('colSetDisplay').classList.toggle('highlighted', hc >= 0);
    document.getElementById('boxSetDisplay').classList.toggle('highlighted', hb >= 0);
    document.getElementById('rowSetLabel').textContent = hr >= 0 ? 'Row ' + hr + ' set' : 'Row sets';
    document.getElementById('colSetLabel').textContent = hc >= 0 ? 'Col ' + hc + ' set' : 'Col sets';
    document.getElementById('boxSetLabel').textContent = hb >= 0 ? 'Box ' + hb + ' set' : 'Box sets';
    renderChips('rowSetChips', hr >= 0 ? snap.rowSets[hr] : [], snap.val, snap.phase);
    renderChips('colSetChips', hc >= 0 ? snap.colSets[hc] : [], snap.val, snap.phase);
    renderChips('boxSetChips', hb >= 0 ? snap.boxSets[hb] : [], snap.val, snap.phase);
  }

  function renderChips(id, arr, newVal, phase) {
    var el = document.getElementById(id);
    el.innerHTML = arr.map(function(v) {
      var isNew = v === newVal && phase === 'add';
      return '<span class="chip' + (isNew ? ' new' : '') + '">' + v + '</span>';
    }).join('');
  }

  function applyStep(snap) {
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        var el = cellEl(r, c);
        el.className = 'cell row-' + r + ' col-' + c;
        var val = currentBoard[r][c];
        el.textContent = val === '.' ? '' : val;
        if (val === '.') el.classList.add('empty');
      }
    }
    for (var i = 0; i < snap.checkedCells.length; i++) {
      var vr = snap.checkedCells[i][0], vc = snap.checkedCells[i][1];
      var ce = cellEl(vr, vc);
      var cv = currentBoard[vr][vc];
      ce.classList.add(cv === '.' ? 'skipped' : 'visited');
    }
    if (snap.r >= 0 && snap.c >= 0) {
      var cur = cellEl(snap.r, snap.c);
      cur.classList.add(snap.phase === 'conflict' ? 'conflict' : 'current');
    }
    renderSets(snap);
    renderCode(snap);
  }

  function updateStatus(snap, cur, total) {
    var bar = document.getElementById('statusBar');
    var phaseMap = { init:'Init', skip:'Skip', check:'Check', conflict:'Conflict', add:'Add', done:'Done' };
    document.getElementById('phase-badge').textContent = phaseMap[snap.phase] || snap.phase;
    document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;

    if (snap.phase === 'init') { bar.innerHTML = 'Ready — scanning board cell by cell.'; return; }
    if (snap.phase === 'done') {
      if (snap.result === true) bar.innerHTML = '<span class="ok">Result: VALID ✓ — no duplicates found.</span>';
      else bar.innerHTML = '<span class="err">Result: INVALID ✗ — duplicate digit detected.</span>';
      return;
    }
    if (snap.phase === 'skip') { bar.innerHTML = 'Cell (r=' + snap.r + ', c=' + snap.c + ') → <span class="hi">"."</span> — skipping empty.'; return; }
    if (snap.phase === 'conflict') { bar.innerHTML = '<span class="err">Conflict at (r=' + snap.r + ', c=' + snap.c + ') → "' + snap.val + '" already in ' + (snap.conflictType === 'row' ? 'Row ' + snap.r : snap.conflictType === 'col' ? 'Col ' + snap.c : 'Box ' + snap.highlightBox) + '!</span>'; return; }
    if (snap.phase === 'check') { bar.innerHTML = 'Checking (r=' + snap.r + ', c=' + snap.c + ') → digit <span class="hi">"' + snap.val + '"</span> | row ' + snap.r + ', col ' + snap.c + ', box ' + snap.highlightBox + '…'; return; }
    if (snap.phase === 'add') { bar.innerHTML = 'Added <span class="hi">"' + snap.val + '"</span> to sets. <span class="ok">✓</span>'; }
  }

  function loadPreset() {
    useInvalid = false;
    currentBoard = VALID_BOARD;
    var btn = document.getElementById('boardToggle');
    btn.textContent = 'Switch to Invalid Board';
    btn.classList.remove('invalid-active');
    buildGrid(); buildSteps(); if (nav) nav.load(steps);
  }

  function randomExample() {
    useInvalid = true;
    currentBoard = INVALID_BOARD;
    var btn = document.getElementById('boardToggle');
    btn.textContent = 'Switch to Valid Board';
    btn.classList.add('invalid-active');
    buildGrid(); buildSteps(); if (nav) nav.load(steps);
  }

  function toggleBoard() {
    if (useInvalid) loadPreset(); else randomExample();
  }

  var nav;

  document.addEventListener('DOMContentLoaded', function() {
    buildGrid();
    buildSteps();
    nav = VizNav({
      btnPrev:  document.getElementById('prevBtn'),
      btnNext:  document.getElementById('stepBtn'),
      btnPlay:  document.getElementById('playBtn'),
      speedSel: document.getElementById('speedSel'),
      render: function(snap, cur, total) {
        applyStep(snap);
        updateStatus(snap, cur, total);
      }
    });
    nav.load(steps);

    document.getElementById('resetBtn').addEventListener('click', function() {
      buildSteps(); nav.load(steps);
    });

    document.getElementById('codeToggle').addEventListener('click', function() {
      var panel = document.getElementById('codePanel');
      var visible = panel.style.display !== 'none';
      panel.style.display = visible ? 'none' : 'block';
      this.textContent = visible ? '► Show Code' : '▼ Hide Code';
    });
  });
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return; dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
