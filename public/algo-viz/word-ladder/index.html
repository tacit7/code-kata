<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Ladder</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; }
    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
    #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

    /* ── viz-specific ─────────────────────────────────────────── */
    .graph-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px;
      display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 300px;
    }
    .graph-svg-wrap {
      width: 100%; flex: 1; min-height: 260px;
      background: var(--bg); border-radius: var(--radius-sm); overflow: hidden;
    }
    #graph-svg { width: 100%; height: 100%; }

    .node-circle { stroke-width: 2; transition: fill 0.22s, stroke 0.22s, opacity 0.22s; }
    .node-circle.state-unvisited { fill: var(--surface-dark); stroke: var(--border-soft); opacity: 0.35; }
    .node-circle.state-start     { fill: #1a2540; stroke: #7aa2f7; stroke-width: 3; }
    .node-circle.state-active    { fill: #3d2010; stroke: #ff9e64; stroke-width: 3; }
    .node-circle.state-frontier  { fill: #2d2010; stroke: #e0af68; }
    .node-circle.state-found     { fill: #0d2535; stroke: #7dcfff; stroke-width: 3; }
    .node-circle.state-visited   { fill: #1a2b14; stroke: #9ece6a; }
    .node-circle.state-end-found { fill: #2a0a3a; stroke: #bb9af7; stroke-width: 3; }
    .node-circle.state-no-path   { fill: var(--surface-dark); stroke: #f7768e; stroke-dasharray: 4 3; opacity: 0.55; }

    .node-label {
      fill: var(--text-bright); font-size: 11px; font-weight: 700;
      font-family: monospace; text-anchor: middle; dominant-baseline: central;
      pointer-events: none; transition: opacity 0.22s;
    }
    .node-label.faint { opacity: 0.3; }

    .edge-line { stroke-width: 1.5; fill: none; stroke: #414868; transition: stroke 0.22s; }
    .edge-line.faint  { opacity: 0.18; }
    .edge-line.active { stroke: #7dcfff; }
    .edge-line.done   { stroke: #9ece6a; }

    .depth-label {
      fill: var(--text-ghost); font-size: 10px; font-family: monospace;
      text-anchor: end; dominant-baseline: central;
    }

    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }

    .lvl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .level-badge {
      font-size: 0.8rem; font-weight: 700; font-family: monospace;
      padding: 3px 10px; border-radius: 4px;
      background: #1a2540; border: 1px solid #7aa2f7; color: #7aa2f7;
    }
    .result-badge {
      font-size: 0.8rem; font-weight: 700; font-family: monospace;
      padding: 3px 10px; border-radius: 4px; display: none;
    }
    .result-badge.found { display: inline-block; background: #1a2b14; border: 1px solid #9ece6a; color: #9ece6a; }
    .result-badge.nope  { display: inline-block; background: #3d1515; border: 1px solid #f7768e; color: #f7768e; }

    .chip-list { display: flex; gap: 5px; flex-wrap: wrap; min-height: 22px; align-items: center; }
    .chip { padding: 2px 9px; border-radius: 4px; font-size: 0.76rem; font-family: monospace; font-weight: 700; }
    .chip-frontier { background: #2d2010; border: 1px solid #e0af68; color: #e0af68; }
    .chip-found    { background: #0d2535; border: 1px solid #7dcfff; color: #7dcfff; }
    .chip-visited  { background: #1a2b14; border: 1px solid #9ece6a; color: #9ece6a; }

    .legend-row { display: flex; align-items: center; gap: 7px; font-size: 0.74rem; color: var(--text-muted); }
    .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }

    .code-header { padding: 7px 12px; font-size: 0.7rem; font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg); }
    .code-body { padding: 8px 0; font-size: 0.74rem; line-height: 1.7; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 12px; }
    .code-line.hl { background: rgba(122,162,247,0.12); border-left: 2px solid var(--accent); }
    .ln { min-width: 22px; color: var(--text-ghost); user-select: none; font-size: 0.67rem; }
    .kw { color: var(--purple); } .fn { color: var(--blue); }
    .bi { color: var(--orange); } .cm { color: var(--text-ghost); }
    .nb { color: var(--green); }  .st { color: #e0af68; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— custom —</option>
      <option value="default" selected>hit → cog (5 steps)</option>
      <option value="short">hot → dog (3 steps)</option>
      <option value="cat">cat → dog</option>
      <option value="big">big → dog</option>
      <option value="nope">No path</option>
    </select>
  </div>
  <div>
    <label>Begin</label>
    <input type="text" id="beginInput" value="hit" style="width:80px;" />
  </div>
  <div>
    <label>End</label>
    <input type="text" id="endInput" value="cog" style="width:80px;" />
  </div>
  <div>
    <label>Word List</label>
    <input type="text" id="listInput" value="hot,dot,dog,lot,log,cog" style="width:240px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Word Ladder</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="section-label" id="graph-label">Word Ladder — BFS Frontier Expansion</div>
    <div style="font-size:0.82rem;color:var(--text-muted);min-height:20px" id="step-desc">Select a preset and click Run.</div>
    <div class="graph-panel">
      <div class="graph-svg-wrap">
        <svg id="graph-svg" viewBox="0 0 580 340" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="arr-default" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L7,3 z" fill="#414868"/>
            </marker>
            <marker id="arr-active" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L7,3 z" fill="#7dcfff"/>
            </marker>
            <marker id="arr-done" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L7,3 z" fill="#9ece6a"/>
            </marker>
          </defs>
          <g id="depth-labels-g"></g>
          <g id="edges-g"></g>
          <g id="nodes-g"></g>
        </svg>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-header">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Status</div>
      <div class="lvl-row">
        <div class="level-badge" id="level-badge">Level —</div>
        <div class="result-badge" id="result-badge"></div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">BFS Queue</div>
      <div class="chip-list" id="queue-list">
        <span style="color:var(--text-ghost);font-size:0.76rem">empty</span>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Visited</div>
      <div class="chip-list" id="visited-list">
        <span style="color:var(--text-ghost);font-size:0.76rem">none</span>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <div class="legend-row"><div class="legend-dot" style="background:#1a2540;border-color:#7aa2f7"></div>beginWord</div>
        <div class="legend-row"><div class="legend-dot" style="background:#3d2010;border-color:#ff9e64"></div>processing (dequeued)</div>
        <div class="legend-row"><div class="legend-dot" style="background:#2d2010;border-color:#e0af68"></div>frontier (current level)</div>
        <div class="legend-row"><div class="legend-dot" style="background:#0d2535;border-color:#7dcfff"></div>just discovered</div>
        <div class="legend-row"><div class="legend-dot" style="background:#1a2b14;border-color:#9ece6a"></div>visited (prev levels)</div>
        <div class="legend-row"><div class="legend-dot" style="background:#2a0a3a;border-color:#bb9af7"></div>endWord reached!</div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">ladderLength</span>(beginWord, endWord, wordList):'],
  [2,  '    wordSet = <span class="bi">set</span>(wordList)'],
  [3,  '    <span class="kw">if</span> endWord <span class="kw">not in</span> wordSet: <span class="kw">return</span> <span class="nb">0</span>'],
  [4,  '    queue = <span class="fn">deque</span>([beginWord])'],
  [5,  '    visited, level = {beginWord}, <span class="nb">1</span>'],
  [6,  '    <span class="kw">while</span> queue:'],
  [7,  '        <span class="kw">for</span> _ <span class="kw">in</span> <span class="bi">range</span>(<span class="bi">len</span>(queue)):'],
  [8,  '            word = queue.popleft()'],
  [9,  '            <span class="kw">if</span> word == endWord: <span class="kw">return</span> level'],
  [10, '            <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span>(<span class="bi">len</span>(word)):'],
  [11, '                <span class="kw">for</span> c <span class="kw">in</span> <span class="st">\'abcdefghijklmnopqrstuvwxyz\'</span>:'],
  [12, '                    nw = word[:i] + c + word[i+<span class="nb">1</span>:]'],
  [13, '                    <span class="kw">if</span> nw <span class="kw">in</span> wordSet <span class="kw">and</span> nw <span class="kw">not in</span> visited:'],
  [14, '                        visited.add(nw); queue.append(nw)'],
  [15, '        level += <span class="nb">1</span>'],
  [16, '    <span class="kw">return</span> <span class="nb">0</span>'],
];

var PRESETS = {
  'default': {beginWord: 'hit', endWord: 'cog', wordList: ['hot','dot','dog','lot','log','cog']},
  'short':   {beginWord: 'hot', endWord: 'dog', wordList: ['hot','dot','dog','lot','log']},
  'cat':     {beginWord: 'cat', endWord: 'dog', wordList: ['cat','cot','cog','dog','bat','bag']},
  'big':     {beginWord: 'big', endWord: 'dog', wordList: ['big','bog','dog','bag','bat']},
  'nope':    {beginWord: 'hit', endWord: 'cog', wordList: ['hot','dot','lot']},
};

var RANDOM_POOL = ['default','short','cat','big','nope'];

var currentData = null;
var simSteps = [];

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var p = PRESETS[sel.value];
  if (!p) return;
  document.getElementById('beginInput').value = p.beginWord;
  document.getElementById('endInput').value = p.endWord;
  document.getElementById('listInput').value = p.wordList.join(',');
  buildAndRun();
}

function randomExample() {
  var key = RANDOM_POOL[Math.floor(Math.random() * RANDOM_POOL.length)];
  var p = PRESETS[key];
  document.getElementById('beginInput').value = p.beginWord;
  document.getElementById('endInput').value = p.endWord;
  document.getElementById('listInput').value = p.wordList.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ── Full BFS: discover all reachable nodes for layout ─────────────────────
function fullBFS(beginWord, wordList) {
  var wordSet = {};
  wordList.forEach(function(w) { wordSet[w] = true; });

  var nodes = [{word: beginWord, depth: 0, parent: null}];
  var edges = [];
  var visited = {};
  visited[beginWord] = true;
  var queue = [beginWord];
  var depth = 0;

  while (queue.length > 0) {
    var nextQ = [];
    for (var qi = 0; qi < queue.length; qi++) {
      var word = queue[qi];
      for (var i = 0; i < word.length; i++) {
        for (var cc = 0; cc < 26; cc++) {
          var ch = String.fromCharCode(97 + cc);
          if (ch === word[i]) continue;
          var nw = word.slice(0, i) + ch + word.slice(i + 1);
          if (wordSet[nw] && !visited[nw]) {
            visited[nw] = true;
            nextQ.push(nw);
            nodes.push({word: nw, depth: depth + 1, parent: word});
            edges.push({from: word, to: nw});
          }
        }
      }
    }
    depth++;
    queue = nextQ;
  }

  return {nodes: nodes, edges: edges};
}

// ── Layout: group by BFS depth, spread horizontally ───────────────────────
function computeLayout(nodes, W, H) {
  var byDepth = {};
  var maxDepth = 0;
  nodes.forEach(function(n) {
    if (!byDepth[n.depth]) byDepth[n.depth] = [];
    byDepth[n.depth].push(n.word);
    if (n.depth > maxDepth) maxDepth = n.depth;
  });

  var padX = 70, padY = 50;
  var usableW = W - 2 * padX;
  var usableH = H - 2 * padY;

  var positions = {};
  for (var d = 0; d <= maxDepth; d++) {
    var row = byDepth[d] || [];
    var y = padY + (maxDepth > 0 ? d * usableH / maxDepth : usableH / 2);
    row.forEach(function(word, i) {
      var x = padX + (row.length > 1 ? i * usableW / (row.length - 1) : usableW / 2);
      positions[word] = {x: x, y: y};
    });
  }

  return {positions: positions, byDepth: byDepth, maxDepth: maxDepth};
}

// ── Simulation: generate animation steps ──────────────────────────────────
function simulate(beginWord, endWord, wordList) {
  var steps = [];
  var wordSet = {};
  wordList.forEach(function(w) { wordSet[w] = true; });

  var visited = {};
  visited[beginWord] = true;

  function getStates(opts) {
    opts = opts || {};
    var proc     = opts.processing || null;
    var frontier = opts.frontier || [];
    var found    = opts.foundThisStep || [];
    var done     = !!opts.done;
    var noPath   = !!opts.noPath;

    var states = {};
    currentData.nodes.forEach(function(n) {
      var w = n.word;
      if (done && w === endWord)            { states[w] = 'end-found'; return; }
      if (noPath && w === endWord)          { states[w] = 'no-path'; return; }
      if (w === proc)                       { states[w] = 'active'; return; }
      if (found.indexOf(w) >= 0)            { states[w] = 'found'; return; }
      if (visited[w]) {
        if (frontier.indexOf(w) >= 0 && w !== proc) { states[w] = 'frontier'; return; }
        states[w] = w === beginWord ? 'start' : 'visited';
        return;
      }
      states[w] = 'unvisited';
    });
    return states;
  }

  function snap(phase, desc, lines, extra) {
    extra = extra || {};
    steps.push({
      phase: phase, desc: desc, lines: lines || [],
      queue:          (extra.queue || []).slice(),
      level:          extra.level || 1,
      result:         extra.result || 0,
      done:           !!extra.done,
      noPath:         !!extra.noPath,
      processing:     extra.processing || null,
      frontier:       (extra.frontier || []).slice(),
      foundThisStep:  (extra.foundThisStep || []).slice(),
      highlightEdges: (extra.highlightEdges || []).slice(),
      visitedSnap:    Object.keys(visited).slice(),
      states:         getStates(extra),
    });
  }

  if (!wordSet[endWord]) {
    snap('NoPath',
      '"' + endWord + '" is not in wordList — transformation impossible. Return 0.',
      [2, 3], {queue: [], level: 0, result: 0, noPath: true});
    return steps;
  }

  snap('Init',
    'Build wordSet from wordList. Push "' + beginWord + '" onto queue, mark visited. Target: "' + endWord + '". Level = 1.',
    [1, 2, 4, 5], {queue: [beginWord], level: 1, frontier: [beginWord]});

  var queue = [beginWord];
  var level = 1;

  while (queue.length > 0) {
    var frontier = queue.slice();
    var nextQueue = [];

    snap('LevelStart',
      'BFS level ' + level + ': process ' + frontier.length + ' word(s) — [' + frontier.join(', ') + '].',
      [6, 7], {queue: frontier.slice(), level: level, frontier: frontier.slice()});

    for (var fi = 0; fi < frontier.length; fi++) {
      var word = frontier[fi];
      var remaining = frontier.slice(fi + 1).concat(nextQueue);

      snap('Dequeue',
        'Dequeue "' + word + '". Check if it equals endWord "' + endWord + '", then scan one-letter mutations.',
        [8], {queue: remaining, level: level, frontier: frontier.slice(), processing: word});

      if (word === endWord) {
        snap('Found',
          '"' + word + '" === endWord! Sequence length = ' + level + '. Return ' + level + '.',
          [9], {queue: [], level: level, result: level, done: true,
                frontier: frontier.slice(), processing: word});
        return steps;
      }

      var foundNeighbors = [];
      var newEdges = [];
      for (var i = 0; i < word.length; i++) {
        for (var cc = 0; cc < 26; cc++) {
          var ch = String.fromCharCode(97 + cc);
          if (ch === word[i]) continue;
          var nw = word.slice(0, i) + ch + word.slice(i + 1);
          if (wordSet[nw] && !visited[nw]) {
            visited[nw] = true;
            nextQueue.push(nw);
            foundNeighbors.push(nw);
            newEdges.push({from: word, to: nw});
          }
        }
      }

      var desc2 = foundNeighbors.length > 0
        ? 'Try 26\xd7' + word.length + ' mutations of "' + word + '" — new: [' + foundNeighbors.join(', ') + ']. Enqueue them.'
        : 'Try 26\xd7' + word.length + ' mutations of "' + word + '" — all neighbors already visited or not in wordSet.';

      snap(foundNeighbors.length > 0 ? 'Neighbors' : 'NoNeighbors', desc2,
        [10, 11, 12, 13, 14], {
          queue: frontier.slice(fi + 1).concat(nextQueue),
          level: level, frontier: frontier.slice(), processing: word,
          foundThisStep: foundNeighbors.slice(), highlightEdges: newEdges.slice()
        });
    }

    queue = nextQueue;
    level++;

    if (queue.length === 0) {
      snap('NoPath',
        'Queue exhausted — "' + endWord + '" not reachable from "' + beginWord + '". Return 0.',
        [15, 16], {queue: [], level: level, result: 0, noPath: true});
      break;
    }

    snap('NextLevel',
      'Level ' + (level - 1) + ' done. Advance to level ' + level + ' — new frontier: [' + queue.join(', ') + '].',
      [15], {queue: queue.slice(), level: level, frontier: queue.slice()});
  }

  return steps;
}

// ── SVG rendering ─────────────────────────────────────────────────────────
var NODE_R = 22;
var SVG_W = 580, SVG_H = 340;

function renderDepthLabels(layout) {
  var g = document.getElementById('depth-labels-g');
  g.innerHTML = '';
  for (var d = 0; d <= layout.maxDepth; d++) {
    var row = layout.byDepth[d];
    if (!row || !row.length) continue;
    var pos = currentData.positions[row[0]];
    if (!pos) continue;
    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', 54);
    text.setAttribute('y', pos.y);
    text.setAttribute('class', 'depth-label');
    text.textContent = 'L' + (d + 1);
    g.appendChild(text);
  }
}

function renderGraph(snap) {
  var edgesG = document.getElementById('edges-g');
  var nodesG = document.getElementById('nodes-g');
  edgesG.innerHTML = '';
  nodesG.innerHTML = '';
  if (!currentData) return;

  var states = snap ? snap.states : {};
  var hlEdgeSet = {};
  if (snap && snap.highlightEdges) {
    snap.highlightEdges.forEach(function(e) { hlEdgeSet[e.from + '->' + e.to] = true; });
  }

  currentData.edges.forEach(function(e) {
    var pa = currentData.positions[e.from];
    var pb = currentData.positions[e.to];
    if (!pa || !pb) return;
    var dx = pb.x - pa.x, dy = pb.y - pa.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return;
    var ux = dx / dist, uy = dy / dist;

    var toState = states[e.to] || 'unvisited';
    var isActive = !!hlEdgeSet[e.from + '->' + e.to];
    var isDone = toState === 'visited' || toState === 'end-found' || toState === 'start';

    var x1 = pa.x + ux * NODE_R;
    var y1 = pa.y + uy * NODE_R;
    var x2 = pb.x - ux * (NODE_R + 5);
    var y2 = pb.y - uy * (NODE_R + 5);

    var cls = 'edge-line';
    var marker = 'arr-default';
    if (isActive)    { cls += ' active'; marker = 'arr-active'; }
    else if (isDone) { cls += ' done';   marker = 'arr-done'; }
    else             { cls += ' faint'; }

    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', cls);
    line.setAttribute('marker-end', 'url(#' + marker + ')');
    edgesG.appendChild(line);
  });

  currentData.nodes.forEach(function(n) {
    var pos = currentData.positions[n.word];
    if (!pos) return;
    var state = states[n.word] || 'unvisited';

    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y);
    circle.setAttribute('r', NODE_R);
    circle.setAttribute('class', 'node-circle state-' + state);

    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x); text.setAttribute('y', pos.y);
    text.setAttribute('class', 'node-label' + (state === 'unvisited' ? ' faint' : ''));
    text.textContent = n.word;

    g.appendChild(circle);
    g.appendChild(text);
    nodesG.appendChild(g);
  });
}

// ── Apply step ────────────────────────────────────────────────────────────
function applyStep(snap) {
  renderGraph(snap);

  var qEl = document.getElementById('queue-list');
  if (snap.queue && snap.queue.length > 0) {
    qEl.innerHTML = snap.queue.map(function(w) {
      var isNew = snap.foundThisStep && snap.foundThisStep.indexOf(w) >= 0;
      return '<span class="chip ' + (isNew ? 'chip-found' : 'chip-frontier') + '">' + w + '</span>';
    }).join('');
  } else {
    qEl.innerHTML = '<span style="color:var(--text-ghost);font-size:0.76rem">empty</span>';
  }

  var vEl = document.getElementById('visited-list');
  if (snap.visitedSnap && snap.visitedSnap.length > 0) {
    vEl.innerHTML = snap.visitedSnap.map(function(w) {
      return '<span class="chip chip-visited">' + w + '</span>';
    }).join('');
  } else {
    vEl.innerHTML = '<span style="color:var(--text-ghost);font-size:0.76rem">none</span>';
  }

  document.getElementById('level-badge').textContent = snap.level ? 'Level ' + snap.level : 'Level —';

  var rb = document.getElementById('result-badge');
  rb.className = 'result-badge';
  if (snap.done) {
    rb.className = 'result-badge found';
    rb.textContent = '→ ' + snap.result + ' steps';
  } else if (snap.noPath) {
    rb.className = 'result-badge nope';
    rb.textContent = '→ 0 (no path)';
  }

  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (el) el.classList.toggle('hl', !!(snap.lines && snap.lines.indexOf(e[0]) >= 0));
  });
}

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

// ── Build & Run ───────────────────────────────────────────────────────────
function buildAndRun() {
  var beginWord = (document.getElementById('beginInput').value || '').trim();
  var endWord   = (document.getElementById('endInput').value || '').trim();
  var wordList  = (document.getElementById('listInput').value || '')
                    .split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  if (!beginWord || !endWord || wordList.length === 0) return;

  var bfsResult    = fullBFS(beginWord, wordList);
  var layoutResult = computeLayout(bfsResult.nodes, SVG_W, SVG_H);

  currentData = {
    nodes:     bfsResult.nodes,
    edges:     bfsResult.edges,
    positions: layoutResult.positions,
    beginWord: beginWord,
    endWord:   endWord,
  };

  renderDepthLabels(layoutResult);
  renderGraph(null);

  simSteps = simulate(beginWord, endWord, wordList);
  window.nav.load(simSteps);

  document.getElementById('graph-label').textContent =
    beginWord + ' → ' + endWord + '  —  wordList: [' + wordList.join(', ') + ']';
}

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="code-line" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
      document.getElementById('step-desc').textContent = snap.desc;
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  document.getElementById('presetSel').value = 'default';
  loadPreset();
});

(function() {
  var h = document.getElementById('resize-handle'),
      p = document.getElementById('code-panel'),
      d = false, sx = 0, sw = 0;
  h.addEventListener('mousedown', function(e) {
    d = true; sx = e.clientX; sw = p.offsetWidth; h.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!d) return;
    p.style.width = Math.min(560, Math.max(120, sw + (sx - e.clientX))) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!d) return;
    d = false; h.classList.remove('dragging');
  });
})();
</script>
</body>
