<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Search II</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .viz-inputs input[type="text"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; width: 200px; font-family: monospace; }
    .viz-inputs select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
    .btn-primary { padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 10px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; border-radius: var(--radius-sm); color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600; padding: 6px 14px; transition: background 0.2s; }
    .btn-play:hover { background: #166534; }
    .btn-play.playing { background: #c2410c; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    .code-panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    .sect { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; box-sizing: border-box; }
    .grid-wrap { display: flex; justify-content: center; margin-top: 6px; }
    .grid-table { display: grid; gap: 5px; }
    .grid-cell { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 1.25rem; font-weight: 700; font-family: monospace; color: var(--text-dim); transition: border-color 0.12s, color 0.12s, background 0.12s; position: relative; user-select: none; }
    .grid-cell .cell-coord { position: absolute; top: 2px; left: 4px; font-size: 0.44rem; color: var(--text-ghost); font-family: monospace; }
    .grid-cell.current  { border-color: var(--yellow); color: var(--yellow-light); background: #201700; }
    .grid-cell.on-path  { border-color: var(--accent); color: var(--accent-pale);  background: #0d1a3e; }
    .grid-cell.found    { border-color: var(--green);  color: var(--green-light);  background: var(--green-bg); }
    .grid-cell.fail     { border-color: var(--red);    color: var(--red-light);    background: #280a10; }
    .trie-nodes { display: flex; flex-direction: column; gap: 4px; font-family: monospace; font-size: 0.78rem; max-height: 140px; overflow-y: auto; }
    .trie-row { display: flex; gap: 4px; align-items: center; }
    .trie-prefix { color: var(--text-dim); letter-spacing: 0.05em; }
    .trie-active { color: var(--accent-pale); font-weight: 700; }
    .trie-end    { color: var(--green); font-weight: 700; }
    .trie-matched { color: var(--green); }
    .trie-arrow  { color: var(--text-ghost); margin: 0 2px; }
    .words-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .word-chip { padding: 4px 10px; border: 2px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 0.82rem; color: var(--text-dim); background: var(--bg); transition: border-color 0.12s, color 0.12s, background 0.12s; font-weight: 600; }
    .word-chip.searching { border-color: var(--yellow); color: var(--yellow-light); background: #201700; }
    .word-chip.found     { border-color: var(--green);  color: var(--green-light);  background: var(--green-bg); }
    .path-row { display: flex; gap: 4px; flex-wrap: wrap; min-height: 32px; align-items: center; }
    .path-chip { padding: 2px 7px; border: 1px solid var(--accent); border-radius: 4px; font-family: monospace; font-size: 0.74rem; color: var(--accent-pale); background: #0d1a3e; }
    .path-chip.won { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .path-empty { color: var(--text-ghost); font-size: 0.82rem; font-style: italic; }
    .found-list { display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; align-items: center; }
    .found-chip { padding: 3px 10px; border: 1px solid var(--green); border-radius: 5px; font-family: monospace; font-size: 0.82rem; font-weight: 700; color: var(--green); background: var(--green-bg); }
    .stack-body { font-family: monospace; font-size: 0.73rem; max-height: 140px; overflow-y: auto; margin-top: 2px; }
    .stack-frame { padding: 1px 0; color: var(--text-muted); white-space: nowrap; }
    .stack-frame.top { color: var(--accent-pale); font-weight: 700; }
    .stack-frame.win { color: var(--green); font-weight: 700; }
    .code-body { padding: 10px 0; font-size: 0.76rem; line-height: 1.75; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }
    .var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .var-box { padding: 10px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .var-box.ab { border-color: var(--accent); }
    .var-box.ob { border-color: #b45309; }
    .var-label { font-size: 0.6rem; font-family: monospace; color: var(--text-faint); text-align: center; }
    .var-val   { font-size: 0.95rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }
    .kw { color: var(--purple); } .fn { color: var(--blue); } .bi { color: var(--orange); }
    .nb { color: var(--green); } .cm { color: var(--text-ghost); } .st { color: var(--yellow-light); }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"board":"oaan;etae;ihkr;iflv","words":"oath,pea,eat,rain"}'>Example: 4x4 multi-word</option>
      <option value='{"board":"abcd;efgh;ijkl;mnop","words":"ace,fhk,beg"}'>Example: No matches</option>
      <option value='{"board":"aab;aab;aab","words":"aaab,abab,baa"}'>Example: Repeated chars</option>
      <option value='{"board":"oa;at;th","words":"oath"}'>Example: Diagonal-like</option>
      <option value='{"board":"cat;art;tar","words":"car,cat,tar,rat"}'>Example: Circular path</option>
      <option value='{"board":"x;y;z","words":"xyz,yx"}'>Example: 3x1 tall board</option>
    </select>
  </div>
  <div class="field">
    <label>Board rows (semicolon-separated)</label>
    <input id="inp-board" type="text" value="oaan;etae;ihkr;iflv" />
  </div>
  <div class="field">
    <label>Words (comma-separated)</label>
    <input id="inp-words" type="text" value="oath,pea,eat,rain" />
  </div>
  <button class="btn-primary" onclick="buildAndRun()">Build</button>
  <button class="btn-step" onclick="randomExample()">&#x1F3B2; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">Word Search II</span>
  <span id="step-desc" style="font-size:11px;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px;">Click Build to start.</span>
  <span id="step-counter"></span>
</div>

<div id="main">
  <div id="viz-area">

    <div class="sect">
      <div class="panel-title">Board <span class="panel-sub" id="board-sub"></span></div>
      <div class="grid-wrap">
        <div class="grid-table" id="grid-table">
          <span style="color:var(--text-ghost);font-size:0.82rem">Click Build.</span>
        </div>
      </div>
    </div>

    <div class="sect">
      <div class="panel-title">Words to Find</div>
      <div class="words-row" id="words-row"><span class="path-empty">&#8212;</span></div>
    </div>

    <div class="sect">
      <div class="panel-title">Current Path</div>
      <div class="path-row" id="path-row"><span class="path-empty">none</span></div>
    </div>

    <div class="sect">
      <div class="panel-title">Result &#8212; Found Words</div>
      <div class="found-list" id="found-list"><span class="path-empty">none yet</span></div>
    </div>

  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python &middot; Trie + DFS backtracking</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">

    <div class="sect">
      <div class="panel-title">Trie &#8212; Active Path <span class="panel-sub" id="trie-sub"></span></div>
      <div class="trie-nodes" id="trie-nodes">
        <span style="color:var(--text-ghost);font-size:0.82rem">&#8212;</span>
      </div>
    </div>

    <div class="sect">
      <div class="panel-title">Variables</div>
      <div class="var-grid">
        <div class="var-box ab">
          <div class="var-label">DFS cell (r, c)</div>
          <div class="var-val" id="vv-cell">&#8212;</div>
        </div>
        <div class="var-box ob">
          <div class="var-label">prefix built</div>
          <div class="var-val" id="vv-prefix">&#8212;</div>
        </div>
      </div>
    </div>

    <div class="sect">
      <div class="panel-title">Call Stack <span class="panel-sub" id="stack-sub"></span></div>
      <div class="stack-body" id="stack-body">
        <span style="color:var(--text-ghost);font-size:0.82rem">&#8212;</span>
      </div>
    </div>

  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var CODE = [
  { t: '<span class="kw">class</span> <span class="fn">TrieNode</span>:' },
  { t: '    children = {}; word = <span class="nb">None</span>' },
  { t: '' },
  { t: '<span class="kw">def</span> <span class="fn">findWords</span>(board, words):' },
  { t: '    root = TrieNode()' },
  { t: '    <span class="kw">for</span> w <span class="kw">in</span> words:  <span class="cm"># build trie</span>' },
  { t: '        node = root' },
  { t: '        <span class="kw">for</span> ch <span class="kw">in</span> w:' },
  { t: '            <span class="kw">if</span> ch <span class="kw">not in</span> node.children:' },
  { t: '                node.children[ch] = TrieNode()' },
  { t: '            node = node.children[ch]' },
  { t: '        node.word = w' },
  { t: '    res = []' },
  { t: '' },
  { t: '    <span class="kw">def</span> <span class="fn">dfs</span>(r, c, node):' },
  { t: '        ch = board[r][c]' },
  { t: '        <span class="kw">if</span> ch <span class="kw">not in</span> node.children: <span class="kw">return</span>' },
  { t: '        nxt = node.children[ch]' },
  { t: '        <span class="kw">if</span> nxt.word:' },
  { t: '            res.append(nxt.word); nxt.word = <span class="nb">None</span>' },
  { t: '        board[r][c] = <span class="st">"#"</span>  <span class="cm"># mark visited</span>' },
  { t: '        <span class="kw">for</span> dr,dc <span class="kw">in</span> [(1,0),(-1,0),(0,1),(0,-1)]:' },
  { t: '            nr,nc = r+dr, c+dc' },
  { t: '            <span class="kw">if</span> 0&lt;=nr&lt;ROWS <span class="kw">and</span> 0&lt;=nc&lt;COLS:' },
  { t: '                <span class="fn">dfs</span>(nr, nc, nxt)' },
  { t: '        board[r][c] = ch  <span class="cm"># backtrack</span>' },
  { t: '' },
  { t: '    <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span>(ROWS):' },
  { t: '        <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span>(COLS):' },
  { t: '            <span class="fn">dfs</span>(r, c, root)' },
  { t: '    <span class="kw">return</span> res' },
];

function renderCode(hlLines) {
  var html = '';
  CODE.forEach(function(line, i) {
    var cls = (hlLines && hlLines.indexOf(i) !== -1) ? ' hl' : '';
    html += '<div class="code-line' + cls + '"><span class="ln">' + (i+1) + '</span>' + line.t + '</div>';
  });
  document.getElementById('code-body').innerHTML = html;
}

function buildTrie(words) {
  var root = { children: {}, word: null, char: '' };
  words.forEach(function(w) {
    var node = root;
    for (var i = 0; i < w.length; i++) {
      var ch = w[i];
      if (!node.children[ch]) node.children[ch] = { children: {}, word: null, char: ch };
      node = node.children[ch];
    }
    node.word = w;
  });
  return root;
}

var BOARD = [], WORDS = [], ROWS = 0, COLS = 0;

function buildSteps() {
  var steps = [];
  var board = BOARD.map(function(r) { return r.slice(); });
  var trieRoot = buildTrie(WORDS);
  var found = [];
  var foundSet = {};

  steps.push({
    type: 'build-trie',
    boardState: board.map(function(r) { return r.slice(); }),
    path: [], stack: ['findWords()'],
    found: [], prefix: '', triePath: [],
    desc: 'Build trie from words: [' + WORDS.map(function(w){return '"'+w+'"';}).join(', ') + ']. Each word inserted char-by-char; leaf stores the full word.',
    codeHl: [3, 4, 5, 6, 7, 8, 9, 10, 11],
    highlightWords: [],
  });

  function dfs(r, c, node, path, callStack, prefix) {
    var ch = board[r][c];
    var frame = 'dfs(' + r + ',' + c + ',"' + prefix + '")';
    var stack = callStack.concat([frame]);

    if (!node.children[ch]) {
      steps.push({ type: 'trie-miss', r: r, c: c, boardState: board.map(function(r2){return r2.slice();}), path: path.slice(), stack: stack.slice(), found: found.slice(), prefix: prefix, triePath: prefix.split(''), desc: '"' + ch + '" not in trie children of "' + (prefix||'root') + '" — prune branch.', codeHl: [15, 16], highlightWords: [] });
      return;
    }

    var nxt = node.children[ch];
    var newPrefix = prefix + ch;
    var newPath = path.concat([[r, c]]);

    if (nxt.word && !foundSet[nxt.word]) {
      foundSet[nxt.word] = true;
      found = found.concat([nxt.word]);
      nxt.word = null;
      steps.push({ type: 'word-found', r: r, c: c, boardState: board.map(function(r2){return r2.slice();}), path: newPath.slice(), stack: stack.slice(), found: found.slice(), prefix: newPrefix, triePath: newPrefix.split(''), desc: 'Found word "' + newPrefix + '" at (' + r + ',' + c + ')! Added to results.', codeHl: [18, 19], highlightWords: [newPrefix] });
    } else {
      steps.push({ type: 'trie-hit', r: r, c: c, boardState: board.map(function(r2){return r2.slice();}), path: newPath.slice(), stack: stack.slice(), found: found.slice(), prefix: newPrefix, triePath: newPrefix.split(''), desc: '"' + ch + '" matches trie node — prefix "' + newPrefix + '" valid. Mark visited, explore neighbors.', codeHl: [15, 16, 17, 20], highlightWords: [] });
    }

    var tmp = board[r][c];
    board[r][c] = '#';
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    dirs.forEach(function(d) {
      var nr = r + d[0], nc = c + d[1];
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) dfs(nr, nc, nxt, newPath, stack, newPrefix);
    });
    board[r][c] = tmp;
    if (newPath.length > 1) {
      steps.push({ type: 'backtrack', r: r, c: c, boardState: board.map(function(r2){return r2.slice();}), path: path.slice(), stack: callStack.slice(), found: found.slice(), prefix: prefix, triePath: prefix.split(''), desc: 'Backtrack from (' + r + ',' + c + ') — restore "' + tmp + '", pop prefix back to "' + prefix + '".', codeHl: [25], highlightWords: [] });
    }
  }

  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      steps.push({ type: 'try-start', r: r, c: c, boardState: board.map(function(r2){return r2.slice();}), path: [], stack: ['findWords()'], found: found.slice(), prefix: '', triePath: [], desc: 'Try DFS from (' + r + ',' + c + ') = "' + board[r][c] + '" against trie root.', codeHl: [27, 28, 29], highlightWords: [] });
      dfs(r, c, trieRoot, [], ['findWords()'], '');
    }
  }

  steps.push({ type: 'done', r: -1, c: -1, boardState: board.map(function(r2){return r2.slice();}), path: [], stack: [], found: found.slice(), prefix: '', triePath: [], desc: 'Done! Found: [' + found.map(function(w){return '"'+w+'"';}).join(', ') + ']', codeHl: [30], highlightWords: found.slice() });

  return steps;
}

var STEPS = [], GRID_CELLS = [];

function renderSnap(snap, cursor, total) {
  document.getElementById('step-counter').textContent = 'Step ' + (cursor + 1) + ' / ' + total;
  document.getElementById('step-desc').textContent = snap.desc;

  var pathSet = {};
  (snap.path || []).forEach(function(p) { pathSet[p[0] + ',' + p[1]] = true; });
  var isCurrent = snap.r >= 0 && snap.c >= 0;

  GRID_CELLS.forEach(function(row, r) {
    row.forEach(function(el, c) {
      var key = r + ',' + c;
      var cls = '';
      if (isCurrent && snap.r === r && snap.c === c) {
        if (snap.type === 'trie-miss') cls = 'fail';
        else if (snap.type === 'word-found') cls = 'found';
        else cls = 'current';
      } else if (pathSet[key]) {
        cls = snap.type === 'word-found' ? 'found' : 'on-path';
      }
      el.className = 'grid-cell' + (cls ? ' ' + cls : '');
    });
  });

  var wordsHtml = '';
  WORDS.forEach(function(w) {
    var cls = 'word-chip';
    if (snap.found && snap.found.indexOf(w) !== -1) cls += ' found';
    else if (snap.prefix && w.indexOf(snap.prefix) === 0 && snap.prefix.length > 0) cls += ' searching';
    wordsHtml += '<div class="' + cls + '">' + w + '</div>';
  });
  document.getElementById('words-row').innerHTML = wordsHtml;

  var pathHtml = '';
  var isWon = snap.type === 'word-found';
  if (snap.path && snap.path.length > 0) {
    snap.path.forEach(function(p, pi) {
      pathHtml += '<div class="path-chip' + (isWon ? ' won' : '') + '">(' + p[0] + ',' + p[1] + ')</div>';
      if (pi < snap.path.length - 1) pathHtml += '<span style="color:var(--text-ghost);font-size:0.7rem">→</span>';
    });
  } else {
    pathHtml = '<span class="path-empty">none</span>';
  }
  document.getElementById('path-row').innerHTML = pathHtml;

  var foundHtml = '';
  if (snap.found && snap.found.length > 0) {
    snap.found.forEach(function(w) { foundHtml += '<div class="found-chip">' + w + '</div>'; });
  } else {
    foundHtml = '<span class="path-empty">none yet</span>';
  }
  document.getElementById('found-list').innerHTML = foundHtml;

  var prefix = snap.prefix || '';
  var trieSub = document.getElementById('trie-sub');
  var trieNodes = document.getElementById('trie-nodes');
  if (prefix.length > 0) {
    trieSub.textContent = '(matching "' + prefix + '")';
    var trieHtml = '';
    for (var i = 0; i < prefix.length; i++) {
      var indent = '  '.repeat(i);
      var isLast = i === prefix.length - 1;
      var cls = isLast ? (snap.type === 'word-found' ? 'trie-end' : 'trie-active') : 'trie-matched';
      trieHtml += '<div class="trie-row"><span class="trie-prefix">' + indent + '</span>';
      trieHtml += '<span class="' + cls + '">' + prefix[i] + '</span>';
      if (isLast && snap.type === 'word-found') trieHtml += '<span style="color:var(--green);margin-left:6px;font-size:0.7rem">← WORD</span>';
      trieHtml += '</div>';
    }
    trieNodes.innerHTML = trieHtml;
  } else {
    trieSub.textContent = '(at root)';
    trieNodes.innerHTML = '<div class="trie-row"><span class="trie-prefix">root</span><span class="trie-arrow">→ {' + WORDS.map(function(w){return w[0];}).filter(function(c,i,a){return a.indexOf(c)===i;}).join(',') + ',...}</span></div>';
  }

  document.getElementById('vv-cell').textContent = snap.r >= 0 ? '(' + snap.r + ',' + snap.c + ')' : '—';
  document.getElementById('vv-prefix').textContent = prefix ? '"' + prefix + '"' : '""';

  var stackBody = document.getElementById('stack-body');
  if (snap.stack && snap.stack.length > 0) {
    var frames = snap.stack.slice().reverse();
    var stackHtml = '';
    frames.forEach(function(f, fi) {
      var cls = fi === 0 ? (snap.type === 'word-found' ? 'win' : 'top') : '';
      stackHtml += '<div class="stack-frame' + (cls ? ' ' + cls : '') + '">' + f + '</div>';
    });
    document.getElementById('stack-sub').textContent = '(depth ' + snap.stack.length + ')';
    stackBody.innerHTML = stackHtml;
  } else {
    document.getElementById('stack-sub').textContent = '';
    stackBody.innerHTML = '<span style="color:var(--text-ghost);font-size:0.82rem">—</span>';
  }

  renderCode(snap.codeHl);
}

var nav;

function buildAndRun() {
  var rawBoard = document.getElementById('inp-board').value.trim();
  var rawWords = document.getElementById('inp-words').value.trim();
  if (!rawBoard || !rawWords) return;

  BOARD = rawBoard.toLowerCase().split(';').map(function(row) { return row.trim().split(''); });
  WORDS = rawWords.toLowerCase().split(',').map(function(w) { return w.trim(); });
  ROWS = BOARD.length;
  COLS = BOARD[0].length;

  var table = document.getElementById('grid-table');
  table.style.gridTemplateColumns = 'repeat(' + COLS + ', 48px)';
  table.innerHTML = '';
  GRID_CELLS = [];
  BOARD.forEach(function(row, r) {
    GRID_CELLS.push([]);
    row.forEach(function(ch, c) {
      var el = document.createElement('div');
      el.className = 'grid-cell';
      el.innerHTML = '<span class="cell-coord">' + r + ',' + c + '</span>' + ch;
      table.appendChild(el);
      GRID_CELLS[r].push(el);
    });
  });

  document.getElementById('board-sub').textContent = '(' + ROWS + 'x' + COLS + ')';
  STEPS = buildSteps();

  if (!nav) {
    nav = VizNav({
      btnPrev:  document.getElementById('prevBtn'),
      btnNext:  document.getElementById('stepBtn'),
      btnPlay:  document.getElementById('playBtn'),
      btnReset: document.getElementById('resetBtn'),
      speedSel: document.getElementById('speedSel'),
      render:   renderSnap,
    });
  }
  nav.load(STEPS);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-board').value = d.board;
  document.getElementById('inp-words').value = d.words;
  buildAndRun();
}

function randomExample() {
  var chars = 'abcdefghijklmnopqrstuvwxyz'.split('');
  var rc = function() { return chars[Math.floor(Math.random() * chars.length)]; };
  var rows = 2 + Math.floor(Math.random() * 4);
  var cols = 2 + Math.floor(Math.random() * 4);
  var board = [];
  for (var r = 0; r < rows; r++) {
    var row = '';
    for (var c = 0; c < cols; c++) row += rc();
    board.push(row);
  }
  var numWords = 2 + Math.floor(Math.random() * 3);
  var words = [];
  for (var w = 0; w < numWords; w++) {
    var len = 2 + Math.floor(Math.random() * 3);
    var word = '';
    for (var i = 0; i < len; i++) word += rc();
    words.push(word);
  }
  document.getElementById('inp-board').value = board.join(';');
  document.getElementById('inp-words').value = words.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

renderCode([]);
window.addEventListener('DOMContentLoaded', buildAndRun);
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
