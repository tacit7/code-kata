<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product of Array Except Self</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run  { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; overflow-y: auto; }

  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 600px; min-height: 36px; line-height: 1.5; }

  /* Array display */
  .array-group { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 640px; }
  .array-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
  .arr-row { display: flex; gap: 6px; flex-wrap: nowrap; }
  .arr-cell {
    min-width: 48px; height: 52px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border); border-radius: 6px;
    background: var(--bg); font-size: 1.1rem; font-weight: 700;
    font-family: monospace; color: var(--text-dim); position: relative;
    transition: all 0.2s ease;
  }
  .arr-cell[data-state="ready"]    { color: var(--text); border-color: var(--border); }
  .arr-cell[data-state="current"]  { color: var(--orange); border-color: var(--orange); background: rgba(var(--orange-ch),0.08); }
  .arr-cell[data-state="computed"] { color: var(--green);  border-color: var(--green);  background: rgba(var(--green-ch),0.08); }
  .arr-indices { display: flex; gap: 6px; }
  .arr-idx { min-width: 48px; flex-shrink: 0; text-align: center; font-size: 0.6rem; color: var(--text-dim); }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(var(--accent-ch),0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .fn { color: var(--blue); }
  .bi { color: var(--orange); }
  .op { color: var(--text); }
  .nb { color: var(--green); }

  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value="1,2,3,4" selected>Basic [1,2,3,4]</option>
      <option value="2,3,4,5">Basic [2,3,4,5]</option>
      <option value="1,0">With zero [1,0]</option>
      <option value="5,2">Small [5,2]</option>
      <option value="1,1,1,1">All ones</option>
      <option value="-1,1,0,-3,3">Negatives + zero</option>
    </select>
  </div>
  <div>
    <label>nums</label>
    <input type="text" id="inp-nums" value="1,2,3,4" style="width:160px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Product of Array Except Self</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div id="array-section" style="display:flex;flex-direction:column;gap:14px;width:100%;max-width:640px;"></div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Variables</div>
      <div class="var-item"><span class="var-key">i       </span> <span class="var-val" id="vv-i">&#8212;</span></div>
      <div class="var-item"><span class="var-key">prefix  </span> <span class="var-val" id="vv-prefix">&#8212;</span></div>
      <div class="var-item"><span class="var-key">suffix  </span> <span class="var-val" id="vv-suffix">&#8212;</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step" onclick="buildAndRun()">&#8635; Reset</button>
  <select id="speedSel">
    <option value="900">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">product_except_self</span>(nums):'],
  [2,  '  n      = len(nums)'],
  [3,  '  result = [1] * n'],
  [0,  ''],
  [4,  '  prefix = 1'],
  [5,  '  <span class="kw">for</span> i <span class="kw">in</span> range(n):'],
  [6,  '    result[i] = prefix'],
  [7,  '    prefix *= nums[i]'],
  [0,  ''],
  [9,  '  suffix = 1'],
  [10, '  <span class="kw">for</span> i <span class="kw">in</span> range(n - 1, -1, -1):'],
  [11, '    result[i] *= suffix'],
  [12, '    suffix *= nums[i]'],
  [0,  ''],
  [14, '  <span class="kw">return</span> result'],
];

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  CODE.forEach(function(e, lineIdx) {
    var ln = e[0], html = e[1];
    var el = document.createElement('div');
    el.className = 'cl';
    if (ln > 0) el.id = 'cl-' + ln;
    el.innerHTML = '<span class="ln">' + (ln || '') + '</span>' + html;
    codeBody.appendChild(el);
  });

  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      document.getElementById('phase-badge').textContent  = snap.phase;
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      document.getElementById('desc').textContent         = snap.desc;
    }
  });

  buildAndRun();
});

// ── Controls ──────────────────────────────────────────────────────────────────
function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  document.getElementById('inp-nums').value = sel.value;
  buildAndRun();
}

function randomExample() {
  var len = Math.floor(Math.random() * 5) + 2;
  var nums = [];
  for (var i = 0; i < len; i++) nums.push(Math.floor(Math.random() * 10) - 2);
  document.getElementById('inp-nums').value = nums.join(', ');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var raw = document.getElementById('inp-nums').value;
  var nums = raw.split(/[,\s]+/).map(function(x) { return parseInt(x.trim()); }).filter(function(x) { return !isNaN(x); });
  if (nums.length < 1) return;
  buildArraySection(nums);
  window.nav.load(simulate(nums));
}

// ── Array display ─────────────────────────────────────────────────────────────
function buildArraySection(nums) {
  var sec = document.getElementById('array-section');
  sec.innerHTML = '';
  var n = nums.length;

  function makeGroup(labelText, idPrefix) {
    var g = document.createElement('div');
    g.className = 'array-group';
    var lbl = document.createElement('div'); lbl.className = 'array-label'; lbl.textContent = labelText;
    var row = document.createElement('div'); row.className = 'arr-row'; row.id = idPrefix + '-row';
    var idx = document.createElement('div'); idx.className = 'arr-indices'; idx.id = idPrefix + '-idx';
    g.appendChild(lbl); g.appendChild(row); g.appendChild(idx);
    for (var k = 0; k < n; k++) {
      var cell = document.createElement('div');
      cell.className = 'arr-cell'; cell.id = idPrefix + '-' + k;
      row.appendChild(cell);
      var idxEl = document.createElement('div');
      idxEl.className = 'arr-idx'; idxEl.textContent = k;
      idx.appendChild(idxEl);
    }
    sec.appendChild(g);
  }

  makeGroup('nums (input)', 'nums');
  makeGroup('prefix pass (left → right)', 'prefix');
  makeGroup('result = prefix × suffix (fills right → left)', 'result');

  for (var k = 0; k < n; k++) {
    document.getElementById('nums-' + k).textContent = nums[k];
    document.getElementById('nums-' + k).dataset.state = 'ready';
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
function simulate(nums) {
  var n = nums.length;
  var result = new Array(n).fill(1);
  // The prefix row has to survive the suffix pass. `result` is mutated in place
  // by the second loop, so keep a frozen copy of the left-to-right products for
  // display — otherwise the row labelled "prefix pass" silently turns into the
  // final answer while the user is still watching the suffix pass run.
  var prefixRow = new Array(n).fill(null);
  var steps = [];
  var prefix = 1, suffix = 1;

  // pfxFilled: how many prefix cells have been written, left to right.
  // sfxFrom:   leftmost result cell already finalised by the suffix pass (n = none).
  function snap(phase, desc, lines, i, p, s, pfxFilled, sfxFrom) {
    steps.push({
      phase: phase, desc: desc, lines: lines || [],
      nums: nums.slice(), result: result.slice(), prefixRow: prefixRow.slice(),
      prefix: p, suffix: s, i: i,
      pfxFilled: pfxFilled, sfxFrom: sfxFrom,
      phaseType: phase.indexOf('Prefix') >= 0 ? 'prefix'
               : phase.indexOf('Suffix') >= 0 ? 'suffix'
               : phase === 'Done' ? 'done' : 'init'
    });
  }

  // suffix is null, not 0 — it does not exist yet during the prefix pass.
  snap('Init', 'n = ' + n + ', result = [1, …, 1], prefix = 1. Starting left-to-right pass.', [1, 2, 3, 4], -1, 1, null, 0, n);

  for (var i = 0; i < n; i++) {
    snap('Prefix Pass', 'i = ' + i + ': result[' + i + '] = prefix = ' + prefix, [5, 6], i, prefix, null, i, n);
    result[i] = prefix;
    prefixRow[i] = prefix;
    prefix *= nums[i];
    snap('Prefix Pass', 'i = ' + i + ': prefix *= nums[' + i + '] (' + nums[i] + ')  →  prefix = ' + prefix, [7], i, prefix, null, i + 1, n);
  }

  suffix = 1;
  snap('Suffix Pass', 'Prefix pass done. suffix = 1. Starting right-to-left pass.', [9], -1, prefix, 1, n, n);

  for (var i = n - 1; i >= 0; i--) {
    snap('Suffix Pass', 'i = ' + i + ': result[' + i + '] *= suffix (' + suffix + ')  =  ' + result[i] + ' * ' + suffix + ' = ' + (result[i] * suffix), [10, 11], i, prefix, suffix, n, i + 1);
    result[i] *= suffix;
    suffix *= nums[i];
    snap('Suffix Pass', 'i = ' + i + ': suffix *= nums[' + i + '] (' + nums[i] + ')  →  suffix = ' + suffix, [12], i, prefix, suffix, n, i);
  }

  snap('Done', 'result = [' + result.join(', ') + ']', [14], -1, prefix, suffix, n, 0);
  return steps;
}

// ── Apply step ────────────────────────────────────────────────────────────────
function applyStep(s, animate) {
  var n = s.result.length;

  // Prefix row: renders the FROZEN left-to-right products, never `result`.
  // A cell is filled once the prefix pass has written it (k < pfxFilled), and it
  // stays filled for the rest of the run — including the Done step.
  for (var k = 0; k < n; k++) {
    var prefixEl = document.getElementById('prefix-' + k);
    if (!prefixEl) continue;
    var filled = k < s.pfxFilled;
    var state = 'idle';
    if (filled) state = (s.phaseType === 'prefix' && k === s.i) ? 'current' : 'computed';
    else if (s.phaseType === 'prefix' && k === s.i) state = 'current';
    prefixEl.dataset.state = state;
    prefixEl.textContent = filled ? s.prefixRow[k] : '';
    if (animate && state === 'current' && filled) {
      gsap.fromTo(prefixEl, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
  }

  // Result row: fills in right-to-left as the suffix pass finalises each cell,
  // so the second pass is actually watchable instead of appearing all at once.
  for (var k = 0; k < n; k++) {
    var resultEl = document.getElementById('result-' + k);
    if (!resultEl) continue;
    var done = k >= s.sfxFrom;
    var rState = 'idle';
    if (done) rState = (s.phaseType === 'suffix' && k === s.i) ? 'current' : 'computed';
    resultEl.dataset.state = rState;
    resultEl.textContent = done ? s.result[k] : '';
    if (animate && rState === 'current') {
      gsap.fromTo(resultEl, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
  }

  // Sidebar vars
  function setVar(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null || val === undefined || val === -1 ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setVar('vv-i', s.i < 0 ? null : s.i);
  setVar('vv-prefix', s.prefix);
  setVar('vv-suffix', s.suffix);

  // Code highlight
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (s.lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

// ── Resize handle ─────────────────────────────────────────────────────────────
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    panel.style.width = Math.min(560, Math.max(120, startW + (startX - e.clientX))) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
