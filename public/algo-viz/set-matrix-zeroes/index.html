<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Matrix Zeroes</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-size: 0.75rem; line-height: 1.8; }
    .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
    .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
    .kw { color: var(--purple); }
    .nb { color: var(--green); }
    .cm { color: var(--text-dim); font-style: italic; }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
    .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
    .var-key { color: var(--text-dim); }
    .var-val-span { color: var(--accent); font-weight: 700; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border-color: var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }

    /* viz-specific */
    .matrix-section { padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 14px; }
    .matrix-wrap { display: flex; justify-content: center; }
    .matrix-grid { display: grid; gap: 5px; }
    .cell { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 6px; background: #0f0f0f; font-size: 1rem; font-weight: 700; font-family: monospace; color: var(--text-dim); transition: border-color 0.15s, color 0.15s, background 0.15s; }
    .cell[data-state="scan"] { border-color: var(--accent); color: var(--accent-pale); background: var(--surface-dark); }
    .cell[data-state="zero-found"] { border-color: #c2410c; color: var(--orange); background: #1c1200; }
    .cell[data-state="marker"] { border-color: #7c3aed; color: #c4b5fd; background: #1a1030; }
    .cell[data-state="zeroing"] { border-color: #0891b2; color: #67e8f9; background: #041f2a; }
    .cell[data-state="zeroed"] { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
    .cell[data-state="done"] { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
    .phase-tag { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 4px; display: inline-block; width: fit-content; }
    .phase-tag.scan    { background: #1a1a3e; color: var(--accent-pale); border: 1px solid var(--accent); }
    .phase-tag.mark    { background: #1a1030; color: #c4b5fd;           border: 1px solid #7c3aed; }
    .phase-tag.zero    { background: #041f2a; color: #67e8f9;           border: 1px solid #0891b2; }
    .phase-tag.handle  { background: #1c1200; color: var(--orange);     border: 1px solid #b45309; }
    .phase-tag.done    { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .phase-tag.init    { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
    .var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .var-box { padding: 10px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .var-box.purple-border { border-color: #7c3aed; }
    .var-box.cyan-border   { border-color: #0891b2; }
    .var-label { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); text-align: center; }
    .var-val { font-size: 0.95rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }
    .flag-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .flag-box { padding: 7px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 90px; }
    .flag-label { font-size: 0.62rem; font-family: monospace; color: var(--text-faint); }
    .flag-val   { font-size: 0.9rem; font-weight: 700; font-family: monospace; color: var(--text-bright); }
    .flag-box.active { border-color: #c2410c; }
    .flag-box.active .flag-val { color: var(--orange); }
    .fn { color: var(--blue); }
    .op { color: var(--text); }
    .st { color: var(--orange); }
    #step-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="0">[[1,1,1],[1,0,1],[1,1,1]]</option>
      <option value="1">[[0,1,2,0],[3,4,5,2],[1,3,1,5]]</option>
      <option value="2">[[1,2,3],[4,5,6],[7,8,0]]</option>
    </select>
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span>Set Matrix Zeroes</span>
  <span id="step-counter">&#8212;</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="matrix-section" id="matrix-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Select a preset and click Run.</span>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Phase</div>
      <div id="phase-tag-wrap"><span class="phase-tag init">&#8212;</span></div>
    </div>
    <div id="step-desc">Select a preset and click Run.</div>
    <div>
      <div class="sidebar-title">Flags</div>
      <div class="flag-row" id="flag-row">
        <div class="flag-box" id="flag-row0">
          <div class="flag-label">firstRowZero</div>
          <div class="flag-val" id="fv-row0">False</div>
        </div>
        <div class="flag-box" id="flag-col0">
          <div class="flag-label">firstColZero</div>
          <div class="flag-val" id="fv-col0">False</div>
        </div>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Current Cell</div>
      <div class="var-grid">
        <div class="var-box purple-border">
          <div class="var-label">row</div>
          <div class="var-val" id="vv-row">&#8212;</div>
        </div>
        <div class="var-box purple-border">
          <div class="var-label">col</div>
          <div class="var-val" id="vv-col">&#8212;</div>
        </div>
        <div class="var-box cyan-border">
          <div class="var-label">value</div>
          <div class="var-val" id="vv-val">&#8212;</div>
        </div>
        <div class="var-box cyan-border">
          <div class="var-label">action</div>
          <div class="var-val" id="vv-action">&#8212;</div>
        </div>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:0.78rem;color:var(--text-muted)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;border-radius:3px;border:2px solid var(--accent);background:var(--surface-dark)"></div>
          <span>Scanning</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;border-radius:3px;border:2px solid #c2410c;background:#1c1200"></div>
          <span>Zero found</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;border-radius:3px;border:2px solid #7c3aed;background:#1a1030"></div>
          <span>Marker (row 0 / col 0)</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;border-radius:3px;border:2px solid #0891b2;background:#041f2a"></div>
          <span>Being zeroed</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;border-radius:3px;border:2px solid var(--green-border);background:var(--green-bg)"></div>
          <span>Confirmed zero</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&#8592; Prev</button>
  <button class="btn-step" id="stepBtn" disabled>Next &#8594;</button>
  <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
  <button class="btn-step" id="resetBtn" onclick="buildAndRun()">&#8635; Reset</button>
  <select id="speedSel" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:4px 8px;">
    <option value="700">Slow</option>
    <option value="350" selected>Medium</option>
    <option value="100">Fast</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentRows = 0, currentCols = 0;

var PRESETS = [
  [[1,1,1],[1,0,1],[1,1,1]],
  [[0,1,2,0],[3,4,5,2],[1,3,1,5]],
  [[1,2,3],[4,5,6],[7,8,0]]
];

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">setZeroes</span><span class="op">(matrix):</span>'],
  [2,  '    rows, cols <span class="op">=</span> <span class="fn">len</span><span class="op">(matrix),</span> <span class="fn">len</span><span class="op">(matrix[</span><span class="nb">0</span><span class="op">])</span>'],
  [3,  '    <span class="cm"># track if first row/col originally had a zero</span>'],
  [4,  '    firstRowZero <span class="op">=</span> <span class="nb">0</span> <span class="kw">in</span> matrix<span class="op">[</span><span class="nb">0</span><span class="op">]</span>'],
  [5,  '    firstColZero <span class="op">=</span> <span class="nb">0</span> <span class="kw">in</span> <span class="op">[</span>matrix<span class="op">[r][</span><span class="nb">0</span><span class="op">]</span> <span class="kw">for</span> r <span class="kw">in</span> <span class="fn">range</span><span class="op">(rows)]</span>'],
  [6,  '    <span class="cm"># Step 1: scan interior, write markers to row 0 / col 0</span>'],
  [7,  '    <span class="kw">for</span> r <span class="kw">in</span> <span class="fn">range</span><span class="op">(</span><span class="nb">1</span><span class="op">, rows):</span>'],
  [8,  '        <span class="kw">for</span> c <span class="kw">in</span> <span class="fn">range</span><span class="op">(</span><span class="nb">1</span><span class="op">, cols):</span>'],
  [9,  '            <span class="kw">if</span> matrix<span class="op">[r][c] ==</span> <span class="nb">0</span><span class="op">:</span>'],
  [10, '                matrix<span class="op">[r][</span><span class="nb">0</span><span class="op">] = matrix[</span><span class="nb">0</span><span class="op">][c] =</span> <span class="nb">0</span>'],
  [11, '    <span class="cm"># Step 2: zero interior cells using markers</span>'],
  [12, '    <span class="kw">for</span> r <span class="kw">in</span> <span class="fn">range</span><span class="op">(</span><span class="nb">1</span><span class="op">, rows):</span>'],
  [13, '        <span class="kw">for</span> c <span class="kw">in</span> <span class="fn">range</span><span class="op">(</span><span class="nb">1</span><span class="op">, cols):</span>'],
  [14, '            <span class="kw">if</span> matrix<span class="op">[r][</span><span class="nb">0</span><span class="op">] ==</span> <span class="nb">0</span> <span class="kw">or</span> matrix<span class="op">[</span><span class="nb">0</span><span class="op">][c] ==</span> <span class="nb">0</span><span class="op">:</span>'],
  [15, '                matrix<span class="op">[r][c] =</span> <span class="nb">0</span>'],
  [16, '    <span class="cm"># Step 3: handle first row and col</span>'],
  [17, '    <span class="kw">if</span> firstRowZero<span class="op">:</span>'],
  [18, '        <span class="kw">for</span> c <span class="kw">in</span> <span class="fn">range</span><span class="op">(cols):</span> matrix<span class="op">[</span><span class="nb">0</span><span class="op">][c] =</span> <span class="nb">0</span>'],
  [19, '    <span class="kw">if</span> firstColZero<span class="op">:</span>'],
  [20, '        <span class="kw">for</span> r <span class="kw">in</span> <span class="fn">range</span><span class="op">(rows):</span> matrix<span class="op">[r][</span><span class="nb">0</span><span class="op">] =</span> <span class="nb">0</span>'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var phaseBadge = document.getElementById('phase-badge');
      if (phaseBadge) {
        var phaseLabels = { init: 'Initial', scan: 'Scan', mark: 'Mark', zero: 'Zero', handle: 'Handle', done: 'Done' };
        phaseBadge.textContent = phaseLabels[snap.phase] || snap.phase || '—';
      }
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      var descEl = document.getElementById('step-desc');
      if (descEl) {
        gsap.fromTo(descEl, { opacity: 0 }, { opacity: 1, duration: 0.15 });
        descEl.textContent = snap.desc;
      }
    }
  });
  buildAndRun();
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="cl" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function loadPreset() {
  buildAndRun();
}

function randomExample() {
  var rows = 2 + Math.floor(Math.random() * 2);
  var cols = 3 + Math.floor(Math.random() * 2);
  var mat = [];
  for (var r = 0; r < rows; r++) {
    var row = [];
    for (var c = 0; c < cols; c++) {
      row.push(Math.random() < 0.25 ? 0 : Math.floor(Math.random() * 9) + 1);
    }
    mat.push(row);
  }
  PRESETS.push(mat);
  document.getElementById('presetSel').value = '';
  currentRows = rows; currentCols = cols;
  buildMatrixSection(rows, cols);
  simSteps = simulate(mat);
  nav.load(simSteps);
}

function buildAndRun() {
  var selEl = document.getElementById('presetSel');
  var idx = parseInt(selEl.value, 10);
  if (isNaN(idx) || idx < 0 || idx >= PRESETS.length) idx = 0;
  var preset = PRESETS[idx];
  currentRows = preset.length;
  currentCols = preset[0].length;
  buildMatrixSection(currentRows, currentCols);
  simSteps = simulate(preset);
  nav.load(simSteps);
}

function buildMatrixSection(rows, cols) {
  var cellSize = (cols <= 3 && rows <= 3) ? 60 : 52;
  var sec = document.getElementById('matrix-section');
  var html = '<div class="matrix-wrap"><div class="matrix-grid" id="mat-grid" style="grid-template-columns:repeat(' + cols + ',' + cellSize + 'px);gap:5px">';
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      html += '<div class="cell" id="cell-' + r + '-' + c + '" data-state="" style="width:' + cellSize + 'px;height:' + cellSize + 'px"></div>';
    }
  }
  html += '</div></div>';
  sec.innerHTML = html;
}

function simulate(initMat) {
  var rows = initMat.length, cols = initMat[0].length;
  var mat = initMat.map(function(r) { return r.slice(); });
  var steps = [];

  function snapMat() { return mat.map(function(r) { return r.slice(); }); }

  function push(phase, desc, lines, cellRow, cellCol, action, cellStates, firstRowZero, firstColZero) {
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines || [],
      cellRow: cellRow !== undefined ? cellRow : null,
      cellCol: cellCol !== undefined ? cellCol : null,
      action: action || '',
      cellStates: cellStates || {},
      firstRowZero: !!firstRowZero,
      firstColZero: !!firstColZero,
      mat: snapMat(),
    });
  }

  var firstRowZero = mat[0].indexOf(0) >= 0;
  var firstColZero = false;
  for (var r = 0; r < rows; r++) { if (mat[r][0] === 0) { firstColZero = true; break; } }

  push('init',
    'Original matrix. Strategy: use row 0 and col 0 as markers. First check if they contain zeros themselves (those flags are saved separately).',
    [1, 2], null, null, '', {}, firstRowZero, firstColZero);

  push('init',
    'firstRowZero=' + firstRowZero + ', firstColZero=' + firstColZero + '. These flags tell us whether to zero out row 0 / col 0 at the very end.',
    [3, 4, 5], null, null, '', {}, firstRowZero, firstColZero);

  var markerStates = {};
  for (var ri = 1; ri < rows; ri++) {
    for (var ci = 1; ci < cols; ci++) {
      var val = mat[ri][ci];
      var curStates = {};
      Object.keys(markerStates).forEach(function(k) { curStates[k] = markerStates[k]; });
      curStates[ri + ',' + ci] = 'scan';

      push('scan',
        'Scan [' + ri + '][' + ci + '] = ' + val + '. ' + (val === 0 ? 'Zero found — mark row 0 col ' + ci + ' and col 0 row ' + ri + '.' : 'Non-zero. Continue.'),
        val === 0 ? [7, 8, 9] : [7, 8],
        ri, ci, val === 0 ? 'zero' : 'non-zero',
        Object.assign({}, curStates),
        firstRowZero, firstColZero);

      if (val === 0) {
        curStates[ri + ',' + ci] = 'zero-found';
        mat[ri][0] = 0;
        curStates[ri + ',0'] = 'marker';
        markerStates[ri + ',0'] = 'marker';
        mat[0][ci] = 0;
        curStates['0,' + ci] = 'marker';
        markerStates['0,' + ci] = 'marker';

        push('mark',
          'Marked mat[' + ri + '][0]=0 and mat[0][' + ci + ']=0. These tell Step 2 to zero the entire row ' + ri + ' and col ' + ci + '.',
          [10],
          ri, ci, 'mark',
          Object.assign({}, curStates),
          firstRowZero, firstColZero);
      }
    }
  }

  push('zero',
    'Scan complete. Now use the markers in row 0 and col 0 to zero out interior cells.',
    [11, 12, 13],
    null, null, '',
    Object.assign({}, markerStates),
    firstRowZero, firstColZero);

  for (var ri2 = 1; ri2 < rows; ri2++) {
    for (var ci2 = 1; ci2 < cols; ci2++) {
      var rowMarker = mat[ri2][0] === 0;
      var colMarker = mat[0][ci2] === 0;
      if (rowMarker || colMarker) {
        var curStates2 = Object.assign({}, markerStates);
        curStates2[ri2 + ',' + ci2] = 'zeroing';
        push('zero',
          'mat[' + ri2 + '][0]=' + mat[ri2][0] + ', mat[0][' + ci2 + ']=' + mat[0][ci2] + ' — at least one is 0, so zero [' + ri2 + '][' + ci2 + '].',
          [12, 13, 14, 15],
          ri2, ci2, 'zero',
          Object.assign({}, curStates2),
          firstRowZero, firstColZero);

        mat[ri2][ci2] = 0;
        curStates2[ri2 + ',' + ci2] = 'zeroed';
        push('zero',
          'Set mat[' + ri2 + '][' + ci2 + '] = 0.',
          [15],
          ri2, ci2, 'zeroed',
          Object.assign({}, curStates2),
          firstRowZero, firstColZero);
      }
    }
  }

  push('handle',
    firstRowZero
      ? 'firstRowZero=True — zero the entire first row now.'
      : 'firstRowZero=False — first row stays as markers (no original zeros there).',
    [16, 17],
    null, null, firstRowZero ? 'zero row 0' : 'skip row 0',
    Object.assign({}, markerStates),
    firstRowZero, firstColZero);

  if (firstRowZero) {
    for (var c2 = 0; c2 < cols; c2++) {
      mat[0][c2] = 0;
    }
    var s3a = Object.assign({}, markerStates);
    for (var c3 = 0; c3 < cols; c3++) { s3a['0,' + c3] = 'zeroed'; }
    push('handle',
      'First row zeroed.',
      [18],
      0, null, 'zeroed row 0',
      s3a,
      firstRowZero, firstColZero);
    markerStates = s3a;
  }

  push('handle',
    firstColZero
      ? 'firstColZero=True — zero the entire first column now.'
      : 'firstColZero=False — first column stays as markers (no original zeros there).',
    [19],
    null, null, firstColZero ? 'zero col 0' : 'skip col 0',
    Object.assign({}, markerStates),
    firstRowZero, firstColZero);

  if (firstColZero) {
    for (var r3 = 0; r3 < rows; r3++) {
      mat[r3][0] = 0;
    }
    var s3b = Object.assign({}, markerStates);
    for (var r4 = 0; r4 < rows; r4++) { s3b[r4 + ',0'] = 'zeroed'; }
    push('handle',
      'First column zeroed.',
      [20],
      null, 0, 'zeroed col 0',
      s3b,
      firstRowZero, firstColZero);
    markerStates = s3b;
  }

  var doneStates = {};
  for (var dr = 0; dr < rows; dr++) {
    for (var dc = 0; dc < cols; dc++) {
      if (mat[dr][dc] === 0) doneStates[dr + ',' + dc] = 'done';
    }
  }
  push('done',
    'Done! All zeros propagated correctly. Rows and columns that contained a zero are fully zeroed out.',
    [1],
    null, null, '',
    doneStates,
    firstRowZero, firstColZero);

  return steps;
}

function applyStep(s, animate) {
  var rows = currentRows, cols = currentCols;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var el = document.getElementById('cell-' + r + '-' + c);
      if (!el) continue;
      el.textContent = s.mat[r][c];
      var key = r + ',' + c;
      var state = (s.cellStates && s.cellStates[key]) ? s.cellStates[key] : '';
      el.dataset.state = state;
      if (animate && (state === 'zeroed' || state === 'done')) {
        gsap.fromTo(el, { scale: 0.75 }, { scale: 1, duration: 0.22, ease: 'back.out(1.7)' });
      }
    }
  }

  // Phase tag
  var tagWrap = document.getElementById('phase-tag-wrap');
  var phaseClass = 'init', phaseText = '—';
  if (s.phase === 'scan')   { phaseClass = 'scan';   phaseText = 'Phase 1: Scan'; }
  if (s.phase === 'mark')   { phaseClass = 'mark';   phaseText = 'Phase 1: Mark Headers'; }
  if (s.phase === 'zero')   { phaseClass = 'zero';   phaseText = 'Phase 2: Zero Interior'; }
  if (s.phase === 'handle') { phaseClass = 'handle'; phaseText = 'Phase 3: Handle Row 0 / Col 0'; }
  if (s.phase === 'done')   { phaseClass = 'done';   phaseText = 'Done'; }
  if (s.phase === 'init')   { phaseClass = 'init';   phaseText = 'Initial State'; }
  tagWrap.innerHTML = '<span class="phase-tag ' + phaseClass + '">' + phaseText + '</span>';

  // Flags
  function setFlag(boxId, valId, active, val) {
    var box = document.getElementById(boxId);
    var el = document.getElementById(valId);
    if (!box || !el) return;
    var text = val ? 'True' : 'False';
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2 });
    }
    el.textContent = text;
    if (active) box.classList.add('active'); else box.classList.remove('active');
  }
  setFlag('flag-row0', 'fv-row0', s.firstRowZero, s.firstRowZero);
  setFlag('flag-col0', 'fv-col0', s.firstColZero, s.firstColZero);

  // Variables
  function setVar(id, text) {
    var el = document.getElementById(id);
    if (!el) return;
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setVar('vv-row', s.cellRow !== null ? String(s.cellRow) : '—');
  setVar('vv-col', s.cellCol !== null ? String(s.cellCol) : '—');
  setVar('vv-val', s.action && s.cellRow !== null ? String(s.mat[s.cellRow] ? s.mat[s.cellRow][s.cellCol] : '—') : '—');
  setVar('vv-action', s.action || '—');

  // Code lines
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (!el) return;
    if (s.lines && s.lines.indexOf(e[0]) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return; dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
