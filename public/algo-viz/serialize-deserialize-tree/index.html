<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serialize and Deserialize Binary Tree</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    /* ── CANONICAL LAYOUT ── */
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: stretch; padding: 16px; gap: 12px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 0; min-width: 0; flex-shrink: 0; background: #0d1117; overflow: hidden; padding: 0; display: flex; flex-direction: column; }
    #sidebar { width: 300px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; color: #fff; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }

    /* ── VIZ-SPECIFIC STYLES ── */
    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .viz-inputs input[type="text"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; width: 220px; font-family: monospace; }
    .viz-inputs select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
    .viz-inputs button { padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .viz-inputs button:hover { opacity: 0.9; }
    .viz-inputs .btn-random { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    #speedSel { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }

    /* Tree panel */
    .tree-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 280px; }
    .panel-header { padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    .phase-badge { font-size: 0.6rem; padding: 2px 7px; border-radius: 4px; font-weight: 700; letter-spacing: 0.08em; }
    .phase-serialize { background: rgba(122,162,247,0.12); color: var(--blue); border: 1px solid rgba(122,162,247,0.25); }
    .phase-deserialize { background: rgba(158,206,106,0.12); color: var(--green); border: 1px solid rgba(158,206,106,0.25); }
    #tree-svg { flex: 1; width: 100%; min-height: 240px; }

    /* Step description */
    .step-desc { font-size: 0.82rem; color: var(--text-muted); padding: 6px 0; min-height: 1.4em; }

    /* Right panel */
    .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 16px; flex-shrink: 0; }
    .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }

    /* Serialized string display */
    .serial-display { font-family: monospace; font-size: 0.88rem; line-height: 1.6; word-break: break-all; min-height: 48px; color: var(--text-muted); }
    .token-done { color: var(--green); }
    .token-active { color: var(--yellow); background: rgba(224,175,104,0.12); border-radius: 3px; padding: 0 2px; text-decoration: underline; text-underline-offset: 2px; }
    .token-pending { color: var(--text-dim); opacity: 0.45; }

    /* Queue display */
    .queue-row { display: flex; gap: 6px; flex-wrap: wrap; min-height: 32px; align-items: center; }
    .q-cell { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; font-family: monospace; font-size: 0.8rem; color: var(--text-bright); transition: background 0.2s, border-color 0.2s; }
    .q-cell.q-head { background: rgba(122,162,247,0.12); border-color: var(--blue); color: var(--blue); font-weight: 700; }

    /* Stats */
    .stat-row { display: flex; flex-direction: column; gap: 6px; }
    .stat-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; }
    .stat-label { color: var(--text-dim); }
    .stat-val { color: var(--text-bright); font-family: monospace; font-weight: 600; }
    .stat-val.blue { color: var(--blue); }
    .stat-val.green { color: var(--green); }
    .stat-val.yellow { color: var(--yellow); }

    /* Tree nodes */
    .tree-node-circle { stroke-width: 2.5; transition: fill 0.2s, stroke 0.2s; }
    .tree-node-label { fill: var(--text-bright); font-size: 13px; font-weight: 700; font-family: monospace; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .tree-edge { stroke: var(--border); stroke-width: 1.5; fill: none; transition: stroke 0.2s; }
    .ns-default   { fill: #1a1b2e; stroke: #3b4261; }
    .ns-active    { fill: #1a2035; stroke: var(--blue); stroke-width: 3; }
    .ns-done      { fill: #1a2a1a; stroke: var(--green); }
    .ns-null-slot { fill: #1c1c28; stroke: #3b4261; stroke-dasharray: 4 3; }
    .ns-creating  { fill: #2d2a14; stroke: var(--yellow); stroke-width: 3; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"input":"1,2,3,4,5,6,7"}'>Balanced Tree (7 nodes)</option>
      <option value='{"input":"1"}'>Single Node</option>
      <option value='{"input":"1,2,null,3,null,4"}'>Left-Skewed Tree</option>
      <option value='{"input":"1,null,2,null,3,null,4"}'>Right-Skewed Tree</option>
      <option value='{"input":"1,2,3,null,null,4,5"}'>Mixed Tree with Nulls</option>
      <option value='{"input":"3,9,20,null,null,15,7"}'>Complex Structure</option>
    </select>
  </div>
  <div class="field">
    <label>Level-order input:</label>
    <input type="text" id="tree-input" value="1,2,3,null,null,4,5" placeholder="e.g. 1,2,3,null,null,4,5" />
  </div>
  <button onclick="buildAndRun()">Run</button>
  <button onclick="randomExample()" class="btn-random">&#127922; Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">Serialize &amp; Deserialize Tree</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="tree-panel">
      <div class="panel-header">
        Binary Tree
        <span class="phase-badge" id="tree-phase-badge">&#8212;</span>
      </div>
      <svg id="tree-svg" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="step-desc" id="step-desc">Press Run to generate steps.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel"></div>

  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Serialized String</div>
      <div class="serial-display" id="serial-display">&#8212;</div>
    </div>

    <div class="panel-box">
      <div class="panel-title">BFS Queue</div>
      <div class="queue-row" id="queue-display"></div>
    </div>

    <div class="panel-box">
      <div class="stat-row">
        <div class="stat-item">
          <span class="stat-label">Phase</span>
          <span class="stat-val blue" id="stat-phase">&#8212;</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Token index (i)</span>
          <span class="stat-val yellow" id="stat-i">&#8212;</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Nodes visited</span>
          <span class="stat-val green" id="stat-visited">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Tokens total</span>
          <span class="stat-val" id="stat-tokens">&#8212;</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ─── Tree building from level-order ──────────────────────────────────────────
function buildTree(vals) {
  if (!vals.length || vals[0] === 'null') return null;
  const root = { val: vals[0], left: null, right: null, id: 0 };
  const queue = [root];
  let i = 1, id = 1;
  while (queue.length && i < vals.length) {
    const node = queue.shift();
    if (i < vals.length && vals[i] !== 'null') {
      node.left = { val: vals[i], left: null, right: null, id: id++ };
      queue.push(node.left);
    }
    i++;
    if (i < vals.length && vals[i] !== 'null') {
      node.right = { val: vals[i], left: null, right: null, id: id++ };
      queue.push(node.right);
    }
    i++;
  }
  return root;
}

// ─── Layout ──────────────────────────────────────────────────────────────────
function layoutTree(root) {
  if (!root) return [];
  const nodes = [];
  const W = 600, H = 280, R = 22;
  function assign(node, depth, left, right) {
    if (!node) return;
    const x = (left + right) / 2;
    const y = 40 + depth * 65;
    node.x = x; node.y = y;
    nodes.push(node);
    assign(node.left,  depth + 1, left,  x);
    assign(node.right, depth + 1, x,     right);
  }
  assign(root, 0, 0, W);
  return nodes;
}

// ─── SVG rendering ───────────────────────────────────────────────────────────
const svg = document.getElementById('tree-svg');
const R = 22;

function clearSVG() { svg.innerHTML = ''; }

function renderTree(nodes, activeId, doneIds, creatingId) {
  clearSVG();
  const doneSet = new Set(doneIds || []);

  // Draw edges first
  for (const node of nodes) {
    for (const child of [node.left, node.right]) {
      if (!child) continue;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('class', 'tree-edge');
      line.setAttribute('x1', node.x);
      line.setAttribute('y1', node.y + R);
      line.setAttribute('x2', child.x);
      line.setAttribute('y2', child.y - R);
      svg.appendChild(line);
    }
  }

  // Draw nodes
  for (const node of nodes) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', node.x);
    circle.setAttribute('cy', node.y);
    circle.setAttribute('r', R);
    circle.setAttribute('class', 'tree-node-circle');

    let state = 'ns-default';
    if (node.id === activeId) state = 'ns-active';
    else if (node.id === creatingId) state = 'ns-creating';
    else if (doneSet.has(node.id)) state = 'ns-done';

    circle.classList.add(state);
    g.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', node.x);
    text.setAttribute('y', node.y);
    text.setAttribute('class', 'tree-node-label');
    text.textContent = node.val;
    g.appendChild(text);

    svg.appendChild(g);
  }
}

// ─── Serial string display ────────────────────────────────────────────────────
function renderSerial(tokens, currentIdx) {
  const el = document.getElementById('serial-display');
  if (!tokens.length) { el.textContent = '—'; return; }
  el.innerHTML = tokens.map((t, i) => {
    if (i < currentIdx) return '<span class="token-done">' + t + '</span>';
    if (i === currentIdx) return '<span class="token-active">' + t + '</span>';
    return '<span class="token-pending">' + t + '</span>';
  }).join('<span style="color:var(--text-dim);">,</span>');
}

function renderQueue(items, headCount) {
  const el = document.getElementById('queue-display');
  if (!items.length) { el.innerHTML = '<span style="color:var(--text-dim);font-size:0.78rem;">empty</span>'; return; }
  el.innerHTML = items.map((v, i) =>
    '<div class="q-cell' + (i < headCount ? ' q-head' : '') + '">' + v + '</div>'
  ).join('');
}

// ─── Step generation ──────────────────────────────────────────────────────────
let steps = [];
let allNodes = [];

function generateSteps(inputStr) {
  const raw = inputStr.split(',').map(s => s.trim());
  const root = buildTree(raw);
  allNodes = layoutTree(root);
  steps = [];

  if (!root) {
    steps.push({
      desc: 'Empty tree — serialized string is empty.',
      phase: 'serialize',
      tokens: [],
      tokenIdx: -1,
      activeId: -1,
      doneIds: [],
      creatingId: -1,
      queue: [],
      visited: 0,
    });
    return;
  }

  // ── Phase 1: Serialize ────────────────────────────────────────────────────
  const serTokens = [];
  const bfsQ = [root];
  const serOrder = [];

  while (bfsQ.length) {
    const node = bfsQ.shift();
    serTokens.push(String(node.val));
    serOrder.push(node.id);
    if (node.left)  bfsQ.push(node.left);
    else            serTokens.push('null');
    if (node.right) bfsQ.push(node.right);
    else            serTokens.push('null');
  }
  while (serTokens[serTokens.length - 1] === 'null') serTokens.pop();

  {
    const bfsQ2 = [root];
    const doneIds = [];

    steps.push({
      desc: 'Serialize — Start BFS from root (' + root.val + '). Queue: [root].',
      phase: 'serialize',
      tokens: [...serTokens],
      tokenIdx: -1,
      activeId: -1,
      doneIds: [],
      creatingId: -1,
      queue: [root.val],
      visited: 0,
    });

    while (bfsQ2.length) {
      const node = bfsQ2.shift();
      const queueSnapshot = bfsQ2.map(n => n.val);

      steps.push({
        desc: 'Serialize — Visit node ' + node.val + ' → append "' + node.val + '" to string. Enqueue children' + (node.left || node.right ? ': ' + [node.left ? node.left.val : 'null', node.right ? node.right.val : 'null'].join(', ') : ' (none)') + '.',
        phase: 'serialize',
        tokens: [...serTokens],
        tokenIdx: doneIds.length,
        activeId: node.id,
        doneIds: [...doneIds],
        creatingId: -1,
        queue: [node.val, ...queueSnapshot],
        visited: doneIds.length + 1,
      });

      doneIds.push(node.id);
      if (node.left)  bfsQ2.push(node.left);
      if (node.right) bfsQ2.push(node.right);
    }

    steps.push({
      desc: 'Serialize complete. Result: "' + serTokens.join(',') + '"',
      phase: 'serialize',
      tokens: [...serTokens],
      tokenIdx: serTokens.length,
      activeId: -1,
      doneIds: allNodes.map(n => n.id),
      creatingId: -1,
      queue: [],
      visited: allNodes.length,
    });
  }

  // ── Phase 2: Deserialize ──────────────────────────────────────────────────
  {
    const vals = serTokens;
    if (!vals.length || vals[0] === 'null') {
      steps.push({ desc: 'Deserialize — token[0] is null, result is empty tree.', phase: 'deserialize', tokens: vals, tokenIdx: 0, activeId: -1, doneIds: [], creatingId: -1, queue: [], visited: 0 });
      return;
    }

    steps.push({
      desc: 'Deserialize — Split "' + vals.join(',') + '" into ' + vals.length + ' tokens. Take token[0]="' + vals[0] + '" as root.',
      phase: 'deserialize',
      tokens: vals,
      tokenIdx: 0,
      activeId: -1,
      doneIds: [],
      creatingId: 0,
      queue: [vals[0]],
      visited: 0,
      dsPartialIds: [],
    });

    const origBFSOrder = [];
    {
      const q = [root];
      while (q.length) {
        const n = q.shift();
        origBFSOrder.push(n);
        if (n.left) q.push(n.left);
        if (n.right) q.push(n.right);
      }
    }

    let i = 1;
    const dsCreatedIds = [];
    dsCreatedIds.push(origBFSOrder[0].id);

    const dsNodeQ = [origBFSOrder[0]];

    while (dsNodeQ.length && i < vals.length) {
      const curOrigNode = dsNodeQ.shift();
      const parentVal = curOrigNode.val;
      const queueAfterPop = dsNodeQ.map(n => n.val);

      const leftTok = vals[i] || 'null';
      const leftMsg = leftTok === 'null'
        ? 'null → left child of ' + parentVal + ' is null'
        : '"' + leftTok + '" → create left child node(' + leftTok + ') of ' + parentVal;

      if (leftTok !== 'null' && curOrigNode.left) {
        dsCreatedIds.push(curOrigNode.left.id);
        dsNodeQ.push(curOrigNode.left);
      }

      steps.push({
        desc: 'Deserialize — token[' + i + ']="' + leftTok + '". ' + leftMsg + '. Enqueue if not null.',
        phase: 'deserialize',
        tokens: vals,
        tokenIdx: i,
        activeId: curOrigNode.id,
        doneIds: [...dsCreatedIds],
        creatingId: (leftTok !== 'null' && curOrigNode.left) ? curOrigNode.left.id : -1,
        queue: [curOrigNode.val, ...queueAfterPop],
        visited: dsCreatedIds.length,
      });
      i++;

      if (i >= vals.length) break;

      const rightTok = vals[i] || 'null';
      const rightMsg = rightTok === 'null'
        ? 'null → right child of ' + parentVal + ' is null'
        : '"' + rightTok + '" → create right child node(' + rightTok + ') of ' + parentVal;

      if (rightTok !== 'null' && curOrigNode.right) {
        dsCreatedIds.push(curOrigNode.right.id);
        dsNodeQ.push(curOrigNode.right);
      }

      steps.push({
        desc: 'Deserialize — token[' + i + ']="' + rightTok + '". ' + rightMsg + '. Enqueue if not null.',
        phase: 'deserialize',
        tokens: vals,
        tokenIdx: i,
        activeId: curOrigNode.id,
        doneIds: [...dsCreatedIds],
        creatingId: (rightTok !== 'null' && curOrigNode.right) ? curOrigNode.right.id : -1,
        queue: [curOrigNode.val, ...queueAfterPop],
        visited: dsCreatedIds.length,
      });
      i++;
    }

    steps.push({
      desc: 'Deserialize complete. All ' + allNodes.length + ' nodes reconstructed. Tree is identical to the original.',
      phase: 'deserialize',
      tokens: vals,
      tokenIdx: vals.length,
      activeId: -1,
      doneIds: allNodes.map(n => n.id),
      creatingId: -1,
      queue: [],
      visited: allNodes.length,
    });
  }
}

// ─── Nav ──────────────────────────────────────────────────────────────────────
let currentStep = 0;

function applyStep(idx) {
  const step = steps[idx];
  if (!step) return;

  renderTree(allNodes, step.activeId, step.doneIds, step.creatingId);
  renderSerial(step.tokens || [], step.tokenIdx);
  renderQueue(step.queue || [], step.activeId !== -1 ? 1 : 0);

  document.getElementById('stat-phase').textContent = step.phase === 'serialize' ? 'Serialize' : 'Deserialize';
  document.getElementById('stat-i').textContent = step.tokenIdx >= 0 ? step.tokenIdx : '—';
  document.getElementById('stat-visited').textContent = step.visited || 0;
  document.getElementById('stat-tokens').textContent = step.tokens ? step.tokens.length : '—';

  // Update canonical phase badge in #header
  const badge = document.getElementById('phase-badge');
  badge.textContent = step.phase === 'serialize' ? 'Serialize' : 'Deserialize';
  badge.style.background = step.phase === 'serialize' ? '#1e3a5f' : '#1a2b14';
  badge.style.color = step.phase === 'serialize' ? 'var(--blue)' : 'var(--green)';
  badge.style.borderColor = step.phase === 'serialize' ? 'var(--blue)' : 'var(--green)';

  // Update tree panel phase badge
  const treeBadge = document.getElementById('tree-phase-badge');
  if (treeBadge) {
    treeBadge.textContent = step.phase === 'serialize' ? 'Serialize' : 'Deserialize';
    treeBadge.className = 'phase-badge ' + (step.phase === 'serialize' ? 'phase-serialize' : 'phase-deserialize');
  }

  document.getElementById('step-desc').textContent = step.desc;
}

function buildAndRun() {
  const input = document.getElementById('tree-input').value.trim();
  generateSteps(input);
  currentStep = 0;
  applyStep(0);
  nav.load(steps);
}

function loadPreset() {
  const sel = document.getElementById('presetSel');
  if (!sel.value) return;
  const d = JSON.parse(sel.value);
  document.getElementById('tree-input').value = d.input;
  buildAndRun();
}

function randomExample() {
  const numNodes = Math.floor(Math.random() * 5) + 3;
  const result = [];
  let nodeCount = 0;
  for (let i = 0; i < 15; i++) {
    if (nodeCount < numNodes && Math.random() > 0.3) {
      result.push(String(Math.floor(Math.random() * 9) + 1));
      nodeCount++;
    } else if (i < 10) {
      result.push('null');
    }
  }
  while (result.length && result[result.length - 1] === 'null') {
    result.pop();
  }
  const input = result.join(',');
  document.getElementById('tree-input').value = input;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// VizNav integration
var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    currentStep = cur;
    applyStep(cur);
    var cnt = document.getElementById('step-counter');
    if (cnt) cnt.textContent = 'Step ' + (cur + 1) + ' / ' + total;
  }
});

document.getElementById('resetBtn').addEventListener('click', function() {
  nav.stopPlay(); nav.goTo(0);
});

document.getElementById('tree-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') buildAndRun();
});

// Init
buildAndRun();
</script>
<script>
// resize handle
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(480, Math.max(0, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
// postMessage bridge
window.addEventListener('message', function(e) {
  if (!nav) return;
  if (e.data === 'prev') { nav.stopPlay(); nav.goTo(nav.cursor() - 1); }
  else if (e.data === 'step') { nav.stopPlay(); nav.goTo(nav.cursor() + 1); }
  else if (e.data === 'play') { nav.goTo(nav.cursor()); /* togglePlay via btn click */ document.getElementById('playBtn').click(); }
  else if (e.data === 'reset') { nav.stopPlay(); nav.goTo(0); }
  else if (e.data && e.data.type === 'speed') {
    var sel = document.getElementById('speedSel');
    if (sel) sel.value = e.data.value;
  }
});
</script>
</body>
</html>
