<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Group Anagrams</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* PAGE-SPECIFIC */
  .panel-title { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .main-row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; width: 100%; align-items: start; }
  @media (max-width: 900px) { .main-row { grid-template-columns: 1fr; } }
  .left-col { display: flex; flex-direction: column; gap: 14px; }
  .words-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  #word-cells { display: flex; gap: 8px; flex-wrap: wrap; }
  .word-cell { min-width: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius-sm); font-weight: 700; font-family: monospace; font-size: 0.95rem; color: var(--text); transition: all 0.25s; padding: 8px 10px; gap: 4px; }
  .word-cell .word-val { font-size: 1rem; }
  .word-cell .word-idx { font-size: 0.6rem; color: var(--text-dim); }
  .word-cell.current { background: rgba(255,158,100,0.15); border-color: var(--orange); color: var(--orange); transform: scale(1.1); }
  .word-cell.done { background: rgba(158,206,106,0.1); border-color: var(--green); color: var(--green); opacity: 0.7; }
  .word-cell.final { background: rgba(158,206,106,0.2); border-color: var(--green); color: var(--green); }
  .key-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .key-display { display: flex; align-items: center; gap: 10px; font-family: monospace; font-size: 0.9rem; margin-top: 6px; }
  .key-word { color: var(--orange); font-weight: 700; font-size: 1.1rem; }
  .key-sorted { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
  .key-dim { color: var(--text-dim); font-size: 0.82rem; }
  .right-col { display: flex; flex-direction: column; gap: 14px; }
  .groups-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  #groups-items { display: flex; flex-direction: column; gap: 8px; }
  .group-entry { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 0.82rem; font-family: monospace; transition: all 0.2s; }
  .group-entry.highlight { border-color: var(--orange); background: rgba(255,158,100,0.08); }
  .group-entry.new-key { border-color: var(--accent); background: rgba(122,162,247,0.1); animation: pulse-in 0.35s ease; }
  @keyframes pulse-in { 0% { transform: scale(0.95); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
  .group-key { color: var(--accent); font-weight: 700; margin-bottom: 4px; font-size: 0.78rem; }
  .group-words { color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .group-word { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; color: var(--text); font-size: 0.8rem; }
  .group-word.just-added { border-color: var(--orange); color: var(--orange); background: rgba(255,158,100,0.1); }
  .result-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: none; }
  .result-panel.visible { display: block; }
  .result-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; margin-bottom: 8px; }
  .result-word { background: rgba(158,206,106,0.15); border: 1px solid var(--green); border-radius: 4px; padding: 3px 8px; color: var(--green); font-family: monospace; font-weight: 700; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"words":"eat,tea,ate"}'>Simple anagrams</option>
      <option value='{"words":"tan,nat,bat"}'>Mixed group</option>
      <option value='{"words":"abc,bca,cab,xyz,zyx,yxz"}'>Two groups (3 each)</option>
      <option value='{"words":"listen,silent,enlist,hello,world"}'>Multiple anagrams</option>
      <option value='{"words":"a,b,c"}'>Single chars</option>
      <option value='{"words":"eat,tea,tan,ate,nat,bat"}'>Classic example</option>
    </select>
  </div>
  <div>
    <label>Words (comma-separated)</label>
    <input type="text" id="wordsInput" value="eat,tea,tan,ate,nat,bat" style="width:240px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Group Anagrams</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>

    <div class="main-row">
      <div class="left-col">
        <div class="words-panel">
          <div class="panel-title">Input Words</div>
          <div id="word-cells"></div>
        </div>
        <div class="key-panel">
          <div class="panel-title">Current Word &rarr; Sorted Key</div>
          <div class="key-display" id="key-display">
            <span style="color: var(--text-dim); font-size: 0.85rem;">Waiting...</span>
          </div>
        </div>
      </div>
      <div class="right-col">
        <div class="groups-panel">
          <div class="panel-title">groups map (sorted_key &rarr; [words])</div>
          <div id="groups-items">
            <div style="color: var(--text-dim); font-size: 0.85rem; font-family: monospace;">{}  (empty)</div>
          </div>
        </div>
        <div class="result-panel" id="result-panel">
          <div class="panel-title">&#10003; Final Groups</div>
          <div id="result-body"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step" disabled>&#8592; Prev</button>
  <button id="stepBtn" class="btn-step" disabled>Step &#8594;</button>
  <button id="playBtn" class="btn-play" disabled>Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
  const codeLines = [
    '<span class="kw">def</span> <span class="nb">group_anagrams</span>(strs):',
    '    groups = {}',
    '    <span class="kw">for</span> s <span class="kw">in</span> strs:',
    '        key = <span class="nb">tuple</span>(<span class="nb">sorted</span>(s))',
    '        groups[key] = groups.<span class="nb">get</span>(key, []) + [s]',
    '    <span class="kw">return</span> <span class="nb">list</span>(groups.<span class="nb">values</span>())',
  ];

  var nav;
  var currentWords = [];

  window.addEventListener('DOMContentLoaded', function() {
    const codeBody = document.getElementById('code-body');
    codeLines.forEach(function(line, idx) {
      const cl = document.createElement('div');
      cl.className = 'cl';
      cl.id = 'cl-' + idx;
      cl.innerHTML = '<span class="ln">' + (idx + 1) + '</span>' + line;
      codeBody.appendChild(cl);
    });

    nav = VizNav({
      btnPrev: document.getElementById('prevBtn'),
      btnNext: document.getElementById('stepBtn'),
      btnPlay: document.getElementById('playBtn'),
      speedSel: document.getElementById('speedSel'),
      render: function(snap, cur, total) {
        applyStep(snap, cur > 0);
        document.getElementById('phase-badge').textContent = snap.phase || 'Step';
        document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + (total - 1);
        if (snap.desc) document.getElementById('desc').textContent = snap.desc;
      }
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      buildAndRun();
    });

    buildAndRun();
  });

  function loadPreset() {
    var sel = document.getElementById('presetSel');
    if (!sel.value) return;
    var d = JSON.parse(sel.value);
    document.getElementById('wordsInput').value = d.words;
    buildAndRun();
  }

  function randomExample() {
    var wordLists = [
      ['cat', 'act', 'tac'],
      ['listen', 'silent', 'enlist'],
      ['hello', 'world'],
      ['a', 'b', 'c', 'd'],
      ['race', 'care', 'acre', 'arc'],
      ['post', 'stop', 'tops'],
    ];
    var chosen = wordLists[Math.floor(Math.random() * wordLists.length)];
    document.getElementById('wordsInput').value = chosen.join(',');
    document.getElementById('presetSel').value = '';
    buildAndRun();
  }

  function buildAndRun() {
    const raw = document.getElementById('wordsInput').value;
    const words = raw.split(',').map(function(w) { return w.trim(); }).filter(function(w) { return w.length > 0; });
    if (words.length === 0) { alert('Enter at least one word.'); return; }
    currentWords = words;
    renderWordCells(words, null, [], false);
    const steps = simulate(words);
    nav.load(steps);
  }

  function renderWordCells(words, currentIdx, doneIdxs, allDone) {
    const container = document.getElementById('word-cells');
    container.innerHTML = '';
    words.forEach(function(word, idx) {
      const cell = document.createElement('div');
      cell.className = 'word-cell';
      cell.id = 'wc-' + idx;
      if (allDone) cell.classList.add('final');
      else if (idx === currentIdx) cell.classList.add('current');
      else if (doneIdxs.indexOf(idx) !== -1) cell.classList.add('done');
      cell.innerHTML = '<div class="word-val">' + escHtml(word) + '</div><div class="word-idx">i=' + idx + '</div>';
      container.appendChild(cell);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function sortedKey(s) { return s.split('').sort().join(''); }

  function simulate(words) {
    const steps = [];
    const groups = {};
    steps.push({ phase: 'Setup', desc: 'Initialize empty groups map.', currentIdx: null, doneIdxs: [], currentWord: null, currentKey: null, groups: {}, justAddedKey: null, justAddedWord: null, isNewKey: false, done: false, lines: [0, 1] });
    for (let i = 0; i < words.length; i++) {
      const s = words[i];
      const key = sortedKey(s);
      steps.push({ phase: 'Iterate — word ' + (i + 1) + ' of ' + words.length, desc: 'Processing "' + s + '" (index ' + i + ').', currentIdx: i, doneIdxs: Object.keys(groups).length > 0 ? range(i) : [], currentWord: s, currentKey: null, groups: deepCopy(groups), justAddedKey: null, justAddedWord: null, isNewKey: false, done: false, lines: [2] });
      steps.push({ phase: 'Compute key for "' + s + '"', desc: 'sorted("' + s + '") = "' + key + '" → key = "' + key + '"', currentIdx: i, doneIdxs: range(i), currentWord: s, currentKey: key, groups: deepCopy(groups), justAddedKey: null, justAddedWord: null, isNewKey: false, done: false, lines: [3] });
      const isNew = !(key in groups);
      groups[key] = (groups[key] || []).concat([s]);
      steps.push({ phase: isNew ? 'New group for key "' + key + '"' : 'Add to existing group "' + key + '"', desc: isNew ? '"' + key + '" not in groups — creating new entry with ["' + s + '"]' : '"' + key + '" already in groups — appending "' + s + '"', currentIdx: i, doneIdxs: range(i + 1), currentWord: s, currentKey: key, groups: deepCopy(groups), justAddedKey: key, justAddedWord: s, isNewKey: isNew, done: false, lines: [4] });
    }
    steps.push({ phase: 'Complete', desc: 'All words processed. Returning ' + Object.keys(groups).length + ' group(s).', currentIdx: null, doneIdxs: range(words.length), currentWord: null, currentKey: null, groups: deepCopy(groups), justAddedKey: null, justAddedWord: null, isNewKey: false, done: true, lines: [5] });
    return steps;
  }

  function range(n) { const a = []; for (let i = 0; i < n; i++) a.push(i); return a; }
  function deepCopy(obj) { const out = {}; for (const k in obj) { out[k] = obj[k].slice(); } return out; }

  function applyStep(snap, animate) {
    renderWordCells(currentWords, snap.currentIdx, snap.doneIdxs, snap.done);
    const keyDiv = document.getElementById('key-display');
    if (snap.currentWord && snap.currentKey) {
      keyDiv.innerHTML = '<span class="key-word">"' + escHtml(snap.currentWord) + '"</span><span style="color:var(--text-dim)">&#8594; sorted &#8594;</span><span class="key-sorted">"' + escHtml(snap.currentKey) + '"</span>';
    } else if (snap.currentWord) {
      keyDiv.innerHTML = '<span class="key-word">"' + escHtml(snap.currentWord) + '"</span><span class="key-dim">&nbsp;&nbsp;(computing key...)</span>';
    } else if (snap.done) {
      keyDiv.innerHTML = '<span style="color: var(--green); font-weight: 700;">&#10003; Done</span>';
    } else {
      keyDiv.innerHTML = '<span style="color: var(--text-dim); font-size: 0.85rem;">Waiting...</span>';
    }
    document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
    snap.lines.forEach(function(lineIdx) {
      const cl = document.getElementById('cl-' + lineIdx);
      if (cl) cl.classList.add('hl');
    });
    const groupsDiv = document.getElementById('groups-items');
    const keys = Object.keys(snap.groups);
    if (keys.length === 0) {
      groupsDiv.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem; font-family: monospace;">{}  (empty)</div>';
    } else {
      groupsDiv.innerHTML = '';
      keys.forEach(function(k) {
        const entry = document.createElement('div');
        entry.className = 'group-entry';
        if (k === snap.justAddedKey && snap.isNewKey) entry.classList.add('new-key');
        else if (k === snap.justAddedKey) entry.classList.add('highlight');
        const keyRow = document.createElement('div');
        keyRow.className = 'group-key';
        keyRow.textContent = '"' + k + '"';
        const wordsRow = document.createElement('div');
        wordsRow.className = 'group-words';
        snap.groups[k].forEach(function(w) {
          const span = document.createElement('span');
          span.className = 'group-word';
          if (w === snap.justAddedWord && k === snap.justAddedKey) span.classList.add('just-added');
          span.textContent = '"' + w + '"';
          wordsRow.appendChild(span);
        });
        entry.appendChild(keyRow);
        entry.appendChild(wordsRow);
        groupsDiv.appendChild(entry);
      });
    }
    const resultPanel = document.getElementById('result-panel');
    const resultBody = document.getElementById('result-body');
    if (snap.done) {
      resultPanel.classList.add('visible');
      resultBody.innerHTML = '';
      Object.values(snap.groups).forEach(function(wordList) {
        const row = document.createElement('div');
        row.className = 'result-group';
        wordList.forEach(function(w) {
          const span = document.createElement('span');
          span.className = 'result-word';
          span.textContent = w;
          row.appendChild(span);
        });
        resultBody.appendChild(row);
      });
    } else {
      resultPanel.classList.remove('visible');
    }
  }

  // ── Resize handle ────────────────────────────────────────────────
  (function() {
    var handle = document.getElementById('resize-handle');
    var panel  = document.getElementById('code-panel');
    var dragging = false, startX = 0, startW = 0;
    handle.addEventListener('mousedown', function(e) { dragging = true; startX = e.clientX; startW = panel.offsetWidth; handle.classList.add('dragging'); e.preventDefault(); });
    document.addEventListener('mousemove', function(e) { if (!dragging) return; var delta = startX - e.clientX; panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px'; });
    document.addEventListener('mouseup', function() { if (dragging) { dragging = false; handle.classList.remove('dragging'); } });
  })();
</script>
</body>
</html>
