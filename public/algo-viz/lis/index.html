<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Longest Increasing Subsequence</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; overflow: auto; padding: 10px 12px; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* code panel */
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }
  .cm { color: var(--text-dim); font-style: italic; }

  /* ── LIS-specific viz styles ─────────────────────────────────────────── */
  #viz-inner { display: flex; flex-direction: column; gap: 16px; padding: 20px; width: 100%; }

  .arrays-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px 22px;
    display: flex; flex-direction: column; gap: 14px;
    overflow-x: auto;
  }
  .row-label-pair { display: flex; align-items: center; gap: 12px; }
  .row-name {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-dim);
    min-width: 36px; text-align: right;
  }
  .cell-row { display: flex; gap: 6px; }
  .cell-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell-idx { font-size: 0.58rem; color: var(--text-ghost); font-family: monospace; text-align: center; }
  .arr-cell {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border-soft); border-radius: 6px;
    background: var(--surface-dark);
    font-size: 0.9rem; font-weight: 700; font-family: monospace;
    color: var(--text-muted);
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }
  .arr-cell.state-i   { border-color: var(--accent); color: var(--accent-pale); background: #0e1a2e; }
  .arr-cell.state-j   { border-color: var(--orange); color: var(--orange-light); background: #1e1200; }
  .arr-cell.state-ij  { border-color: var(--purple); color: #d9bfff; background: #1a1230; }
  .arr-cell.state-dp-updated { border-color: var(--green); color: var(--green-light); background: var(--green-bg); }
  .arr-cell.state-dp-set     { border-color: #2d3148; color: var(--text-dim); background: #0f111a; }

  .arrow-row { display: flex; gap: 6px; padding: 0 0 0 48px; min-height: 20px; align-items: center; }
  .arrow-slot { width: 52px; display: flex; justify-content: center; font-size: 0.7rem; color: var(--green); }

  .bottom-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .result-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px 20px;
    display: flex; flex-direction: column; gap: 6px; min-width: 150px;
  }
  .result-title { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
  .result-value { font-size: 2rem; font-weight: 700; color: var(--green); font-family: monospace; }
  .result-sub { font-size: 0.72rem; color: var(--text-ghost); }

  .vars-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px 20px;
    display: flex; flex-direction: column; gap: 8px; flex: 1;
  }
  .vars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .var-box {
    padding: 9px 8px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .var-box.accent-border { border-color: var(--accent); }
  .var-box.orange-border { border-color: var(--orange); }
  .var-box.green-border  { border-color: var(--green); }
  .var-label { font-size: 0.62rem; font-family: monospace; color: var(--text-faint); text-align: center; }
  .var-val   { font-size: 1.2rem; font-weight: 700; color: var(--text-bright); }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; padding: 0 4px; }
  .leg-item { display: flex; align-items: center; gap: 7px; font-size: 0.76rem; color: var(--text-muted); }
  .leg-sw { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 2px solid; }
  .leg-sw.i   { border-color: var(--accent);  background: #0e1a2e; }
  .leg-sw.j   { border-color: var(--orange);  background: #1e1200; }
  .leg-sw.upd { border-color: var(--green);   background: var(--green-bg); }
  .leg-sw.set { border-color: #2d3148; background: #0f111a; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value='{"nums":"1,2,3,4,5"}'>Sorted ascending</option>
      <option value='{"nums":"5,4,3,2,1"}'>Reverse order</option>
      <option value='{"nums":"10,9,2,5,3,7,101,18"}' selected>Mixed values</option>
      <option value='{"nums":"1,10,2,11,3,12"}'>Alternating jumps</option>
      <option value='{"nums":"3,3,3,3"}'>All duplicates</option>
      <option value='{"nums":"42"}'>Single element</option>
    </select>
  </div>
  <div>
    <label>nums (comma-separated)</label>
    <input id="inp-nums" type="text" value="10,9,2,5,3,7,101,18" style="width:220px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Longest Increasing Subsequence</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="viz-inner">
      <div style="padding:24px;color:var(--text-dim);font-size:0.9rem">Enter numbers and click Run.</div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar"></div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [];
var currentNums = [];

var codeLines = [
  { n: 1, t: '<span class="kw">def</span> <span class="nb">length_of_lis</span>(nums):' },
  { n: 2, t: '  n = <span class="nb">len</span>(nums)' },
  { n: 3, t: '  dp = [1] * n  <span class="cm"># each element alone = length 1</span>' },
  { n: 4, t: '  <span class="kw">for</span> i <span class="kw">in</span> <span class="nb">range</span>(n):' },
  { n: 5, t: '    <span class="kw">for</span> j <span class="kw">in</span> <span class="nb">range</span>(i):' },
  { n: 6, t: '      <span class="kw">if</span> nums[j] &lt; nums[i]:' },
  { n: 7, t: '        dp[i] = <span class="nb">max</span>(dp[i], dp[j] + 1)' },
  { n: 8, t: '  <span class="kw">return</span> <span class="nb">max</span>(dp) <span class="kw">if</span> nums <span class="kw">else</span> 0' },
];

// phase -> highlighted code line indices (0-based)
var phaseLines = {
  'init': [1, 2],
  'outer': [3],
  'update': [5, 6],
  'compare-valid': [5],
  'compare-skip': [5],
  'done': [7],
};

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + (line.n - 1);
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  buildAndRun();
});

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

function parseNums() {
  var raw = document.getElementById('inp-nums').value;
  var parts = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); });
  return parts.filter(function(n) { return !isNaN(n); });
}

function buildAndRun() {
  var nums = parseNums();
  if (nums.length === 0) return;
  currentNums = nums;
  buildVizArea(nums);
  simSteps = simulate(nums);
  window.nav.load(simSteps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-nums').value = d.nums;
  buildAndRun();
}

function randomExample() {
  var len = Math.floor(Math.random() * 8) + 3;
  var nums = [];
  for (var i = 0; i < len; i++) {
    nums.push(Math.floor(Math.random() * 100));
  }
  document.getElementById('inp-nums').value = nums.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ── Build static DOM ──────────────────────────────────────────────────────
function buildVizArea(nums) {
  var n = nums.length;
  var html = '<div style="display:flex;flex-direction:column;gap:16px">';

  // arrays block
  html += '<div class="arrays-wrap">';

  // index row
  html += '<div class="row-label-pair"><div class="row-name">idx</div><div class="cell-row">';
  for (var k = 0; k < n; k++) {
    html += '<div class="cell-group"><div class="arr-cell" style="border-color:transparent;background:transparent;color:var(--text-ghost);font-size:0.72rem">' + k + '</div></div>';
  }
  html += '</div></div>';

  // nums row
  html += '<div class="row-label-pair"><div class="row-name">nums</div><div class="cell-row" id="nums-row">';
  for (var k = 0; k < n; k++) {
    html += '<div class="cell-group">'
      + '<div class="arr-cell state-set" id="nc-' + k + '">' + nums[k] + '</div>'
      + '</div>';
  }
  html += '</div></div>';

  // arrow connector row
  html += '<div class="arrow-row" id="arrow-row">';
  for (var k = 0; k < n; k++) {
    html += '<div class="arrow-slot" id="arr-' + k + '"></div>';
  }
  html += '</div>';

  // dp row
  html += '<div class="row-label-pair"><div class="row-name">dp</div><div class="cell-row" id="dp-row">';
  for (var k = 0; k < n; k++) {
    html += '<div class="cell-group">'
      + '<div class="arr-cell" id="dc-' + k + '">—</div>'
      + '</div>';
  }
  html += '</div></div>';

  html += '</div>'; // arrays-wrap

  // legend
  html += '<div class="legend">'
    + '<div class="leg-item"><div class="leg-sw i"></div>current i (outer)</div>'
    + '<div class="leg-item"><div class="leg-sw j"></div>current j (inner)</div>'
    + '<div class="leg-item"><div class="leg-sw upd"></div>dp[i] just updated</div>'
    + '<div class="leg-item"><div class="leg-sw set"></div>dp filled</div>'
    + '</div>';

  // bottom row: result + vars
  html += '<div class="bottom-row">';

  // result panel
  html += '<div class="result-panel">'
    + '<div class="result-title">LIS Length</div>'
    + '<div class="result-value" id="result-val">—</div>'
    + '<div class="result-sub" id="result-sub">max(dp) so far</div>'
    + '</div>';

  // vars panel
  html += '<div class="vars-panel">'
    + '<div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim)">Variables</div>'
    + '<div class="vars-grid">'
    + '<div class="var-box accent-border"><div class="var-label">i</div><div class="var-val" id="vv-i">—</div></div>'
    + '<div class="var-box accent-border"><div class="var-label">nums[i]</div><div class="var-val" id="vv-ni">—</div></div>'
    + '<div class="var-box orange-border"><div class="var-label">j</div><div class="var-val" id="vv-j">—</div></div>'
    + '<div class="var-box orange-border"><div class="var-label">nums[j]</div><div class="var-val" id="vv-nj">—</div></div>'
    + '<div class="var-box green-border"><div class="var-label">dp[i]</div><div class="var-val" id="vv-di">—</div></div>'
    + '<div class="var-box green-border"><div class="var-label">dp[j]</div><div class="var-val" id="vv-dj">—</div></div>'
    + '</div>'
    + '</div>';

  html += '</div>'; // bottom-row
  html += '</div>'; // outer column

  document.getElementById('viz-inner').innerHTML = html;
}

// ── Simulate ──────────────────────────────────────────────────────────────
function simulate(nums) {
  var n = nums.length;
  var dp = new Array(n).fill(1);
  var steps = [];

  function snap(phase, desc, i, j, dpSnap) {
    steps.push({
      phase: phase, desc: desc,
      i: i, j: j,
      dp: dpSnap.slice(),
      updated: phase === 'update',
      validCompare: phase === 'update' || phase === 'compare-valid',
    });
  }

  snap('init', 'Initialize dp[0..' + (n-1) + '] = 1. Each element alone is a subsequence of length 1.',
    null, null, dp);

  for (var i = 0; i < n; i++) {
    snap('outer',
      'Outer loop: i = ' + i + ', nums[i] = ' + nums[i] + '. dp[' + i + '] currently = ' + dp[i] + '.',
      i, null, dp);

    for (var j = 0; j < i; j++) {
      if (nums[j] < nums[i]) {
        var newVal = dp[j] + 1;
        if (newVal > dp[i]) {
          dp[i] = newVal;
          snap('update',
            'nums[' + j + ']=' + nums[j] + ' < nums[' + i + ']=' + nums[i]
            + ' ✓  dp[' + j + ']+1=' + newVal + ' is better  →  dp[' + i + '] updated to ' + dp[i] + '.',
            i, j, dp);
        } else {
          snap('compare-valid',
            'nums[' + j + ']=' + nums[j] + ' < nums[' + i + ']=' + nums[i]
            + ' ✓  but dp[' + j + ']+1=' + newVal + ' ≤ dp[' + i + ']=' + dp[i] + '  —  no update.',
            i, j, dp);
        }
      } else {
        snap('compare-skip',
          'nums[' + j + ']=' + nums[j] + ' ≥ nums[' + i + ']=' + nums[i] + '  —  not strictly increasing, skip.',
          i, j, dp);
      }
    }
  }

  snap('done',
    'Done. max(dp) = ' + Math.max.apply(null, dp) + '. That is the length of the LIS.',
    null, null, dp);

  return steps;
}

// ── Render ────────────────────────────────────────────────────────────────
function applyStep(s, animate) {
  var n = currentNums.length;
  var maxDp = s.dp.reduce(function(a, b) { return Math.max(a, b); }, 0);

  // nums cells
  for (var k = 0; k < n; k++) {
    var nc = document.getElementById('nc-' + k);
    if (!nc) continue;
    nc.className = 'arr-cell';
    if (k === s.i && k === s.j) nc.classList.add('state-ij');
    else if (k === s.i)         nc.classList.add('state-i');
    else if (k === s.j)         nc.classList.add('state-j');
    else                        nc.classList.add('state-set');
  }

  // dp cells
  for (var k = 0; k < n; k++) {
    var dc = document.getElementById('dc-' + k);
    if (!dc) continue;
    var val = s.dp[k];
    dc.className = 'arr-cell';
    if (k === s.i && s.updated) {
      dc.classList.add('state-dp-updated');
      if (animate) {
        gsap.fromTo(dc, { scale: 0.6, opacity: 0.5 }, {
          scale: 1.15, opacity: 1, duration: 0.2, ease: 'back.out(1.7)',
          onComplete: function(el) { gsap.to(el, { scale: 1, duration: 0.12 }); }.bind(null, dc)
        });
      }
    } else if (val > 1 || (s.i !== null && k < s.i) || s.phase === 'done') {
      dc.classList.add('state-dp-set');
    }
    dc.textContent = val;
  }

  // arrow slots: show ↑ under j for all valid comparisons (nums[j] < nums[i])
  for (var k = 0; k < n; k++) {
    var slot = document.getElementById('arr-' + k);
    if (!slot) continue;
    if (s.j !== null && k === s.j && s.validCompare) {
      slot.textContent = '↑';
      slot.style.color = s.updated ? 'var(--green)' : 'var(--orange)';
    } else {
      slot.textContent = '';
    }
  }

  // result value
  var rv = document.getElementById('result-val');
  if (rv) {
    var prevText = rv.textContent;
    var newText = s.phase === 'init' ? '—' : String(maxDp);
    rv.textContent = newText;
    if (animate && prevText !== newText && s.phase !== 'init') {
      gsap.fromTo(rv, { scale: 0.8 }, { scale: 1, duration: 0.25, ease: 'back.out(1.5)' });
    }
  }
  var rs = document.getElementById('result-sub');
  if (rs) rs.textContent = s.phase === 'done' ? 'final answer' : 'max(dp) so far';

  // vars
  function setVar(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = (val === null || val === undefined) ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { opacity: 0.4, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(1.5)' });
    }
    el.textContent = text;
  }
  setVar('vv-i',  s.i !== null ? s.i  : null);
  setVar('vv-ni', s.i !== null ? currentNums[s.i] : null);
  setVar('vv-j',  s.j !== null ? s.j  : null);
  setVar('vv-nj', s.j !== null ? currentNums[s.j] : null);
  setVar('vv-di', s.i !== null ? s.dp[s.i] : null);
  setVar('vv-dj', s.j !== null ? s.dp[s.j] : null);

  // code highlight
  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  (phaseLines[s.phase] || []).forEach(function(idx) {
    var el = document.getElementById('cl-' + idx);
    if (el) el.classList.add('hl');
  });
}

// ── Resize handle ───────────────────────────────────────────────────────────
(function(){ var h=document.getElementById('resize-handle'),p=document.getElementById('code-panel'),d=false,sx=0,sw=0; h.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('dragging');e.preventDefault();}); document.addEventListener('mousemove',function(e){if(!d)return;p.style.width=Math.min(560,Math.max(120,sw+(sx-e.clientX)))+'px';}); document.addEventListener('mouseup',function(){if(!d)return;d=false;h.classList.remove('dragging');}); })();
</script>
</body>
</html>
