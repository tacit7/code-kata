      display: grid;
      grid-template-columns: 58% 1fr;
      gap: 12px;
      align-items: start;
    }
    .right-col { display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 720px) { .bottom-row { grid-template-columns: 1fr; } }

    /* Code panel */
    .code-panel {
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .code-header {
      padding: 9px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.11em;
      color: var(--text-dim);

    .code-body {
      padding: 8px 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.76rem;
      line-height: 1.65;
      overflow-x: auto;
    }
    .cl {
      display: flex; align-items: stretch;
      border-left: 3px solid transparent;
      padding: 0 14px 0 0;
      white-space: pre;
    }
    .cl .ln {
      width: 26px; min-width: 26px;
      text-align: right; color: #3d4468;
      user-select: none; padding-right: 12px;
      font-size: 0.7rem; line-height: 1.65;
    }
    .cl .code { color: var(--text-muted); }
    .kw  { color: var(--purple); }
    .fn  { color: var(--blue); }
    .bi  { color: var(--orange); }
    .str { color: #9ece6a; }
    .cm  { color: #3d4468; font-style: italic; }
    .op  { color: var(--text); }

    /* Operations list */
    .op-list { display: flex; flex-direction: column; gap: 5px; }
    .op-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 6px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.8rem; color: var(--text-faint);

    .op-icon { font-size: 0.72rem; width: 12px; flex-shrink: 0; }
    .op-type { font-weight: 700; min-width: 72px; font-size: 0.74rem; }
    .op-type.t-insert { color: var(--blue); }
    .op-type.t-search { color: var(--orange); }
    .op-type.t-startsWith { color: var(--purple); }

    /* Result badge override for fail state */
    .result-badge.fail {
      background: #3b0a0a; color: #fca5a5;
      border: 1px solid #7f1d1d;
      display: block;
    }

    /* Page subtitle */
    .page-sub {
      font-size: 0.8rem; color: var(--text-dim); margin-top: 2px;
    }

<script>
// ─── Operations ───────────────────────────────────────────────────────────────
var OPERATIONS = [
  { type: 'insert',     word: 'apple' },
  { type: 'insert',     word: 'app'   },
  { type: 'search',     word: 'apple' },
  { type: 'search',     word: 'app'   },
  { type: 'startsWith', word: 'ap'    },
  { type: 'search',     word: 'appl'  },
];

// ─── Code Lines ───────────────────────────────────────────────────────────────
var CODE_LINES = [
  [1,  '<span class="kw">class</span> <span class="fn">TrieNode</span><span class="op">:</span>'],
  [2,  '    <span class="kw">def</span> <span class="fn">__init__</span><span class="op">(</span>self<span class="op">):</span>'],
  [3,  '        self.children <span class="op">=</span> <span class="op">{}</span>'],
  [4,  '        self.is_end <span class="op">=</span> <span class="bi">False</span>'],
  [0,  ''],
  [6,  '<span class="kw">class</span> <span class="fn">Trie</span><span class="op">:</span>'],
  [7,  '    <span class="kw">def</span> <span class="fn">__init__</span><span class="op">(</span>self<span class="op">):</span>'],
  [8,  '        self.root <span class="op">=</span> TrieNode<span class="op">()</span>'],
  [0,  ''],
  [10, '    <span class="kw">def</span> <span class="fn">insert</span><span class="op">(</span>self<span class="op">,</span> word<span class="op">):</span>'],
  [11, '        node <span class="op">=</span> self.root'],
  [12, '        <span class="kw">for</span> ch <span class="kw">in</span> word<span class="op">:</span>'],
  [13, '            <span class="kw">if</span> ch <span class="kw">not in</span> node.children<span class="op">:</span>'],
  [14, '                node.children<span class="op">[</span>ch<span class="op">]</span> <span class="op">=</span> TrieNode<span class="op">()</span>'],
  [15, '            node <span class="op">=</span> node.children<span class="op">[</span>ch<span class="op">]</span>'],
  [16, '        node.is_end <span class="op">=</span> <span class="bi">True</span>'],
  [0,  ''],
  [18, '    <span class="kw">def</span> <span class="fn">search</span><span class="op">(</span>self<span class="op">,</span> word<span class="op">):</span>'],
  [19, '        node <span class="op">=</span> self.root'],
  [20, '        <span class="kw">for</span> ch <span class="kw">in</span> word<span class="op">:</span>'],
  [21, '            <span class="kw">if</span> ch <span class="kw">not in</span> node.children<span class="op">:</span>'],
  [22, '                <span class="kw">return</span> <span class="bi">False</span>'],
  [23, '            node <span class="op">=</span> node.children<span class="op">[</span>ch<span class="op">]</span>'],
  [24, '        <span class="kw">return</span> node.is_end'],
  [0,  ''],
  [26, '    <span class="kw">def</span> <span class="fn">startsWith</span><span class="op">(</span>self<span class="op">,</span> prefix<span class="op">):</span>'],
  [27, '        node <span class="op">=</span> self.root'],
  [28, '        <span class="kw">for</span> ch <span class="kw">in</span> prefix<span class="op">:</span>'],
  [29, '            <span class="kw">if</span> ch <span class="kw">not in</span> node.children<span class="op">:</span>'],
  [30, '                <span class="kw">return</span> <span class="bi">False</span>'],
  [31, '            node <span class="op">=</span> node.children<span class="op">[</span>ch<span class="op">]</span>'],
  [32, '        <span class="kw">return</span> <span class="bi">True</span>'],
];

// ─── Colors ───────────────────────────────────────────────────────────────────
var C = {
  hidden:    { fill: '#0d1020', stroke: '#1a1d2e', text: '#1e2335' },
  idle:      { fill: '#1e2130', stroke: '#2d3148', text: '#a9b1d6' },
  path:      { fill: '#1e1a3a', stroke: '#6366f1', text: '#b4c6fc' },
  active:    { fill: '#4338ca', stroke: '#818cf8', text: '#ffffff' },
  found:     { fill: '#052e16', stroke: '#16a34a', text: '#4ade80' },
  not_found: { fill: '#3b0a0a', stroke: '#dc2626', text: '#fca5a5' },
};

var EDGE = {
  hidden:    { stroke: '#1a1d2e', opacity: '0.25' },
  idle:      { stroke: '#2d3148', opacity: '1' },
  path:      { stroke: '#6366f1', opacity: '1' },
  found:     { stroke: '#16a34a', opacity: '1' },
  not_found: { stroke: '#dc2626', opacity: '1' },
};

// ─── Trie Build ───────────────────────────────────────────────────────────────
var nextId = 0;
var nodeMap = {};
var trieRoot = null;

function makeNode(ch, parent) {
  var n = {
    id: nextId++,
    char: ch,
    children: {},
    parent: parent || null,
    depth: parent ? parent.depth + 1 : 0,
    x: 0, y: 0,
  };
  nodeMap[n.id] = n;
  return n;
}

function buildTrie() {
  nextId = 0;
  nodeMap = {};
  trieRoot = makeNode('·', null); // middle dot for root

  OPERATIONS.filter(function(op) { return op.type === 'insert'; }).forEach(function(op) {
    var node = trieRoot;
    op.word.split('').forEach(function(ch) {
      if (!node.children[ch]) {
        node.children[ch] = makeNode(ch, node);
      }
      node = node.children[ch];
    });
    // is_end revealed during simulation, not set here
  });
}

// ─── Layout ───────────────────────────────────────────────────────────────────
var R = 22;
var LEVEL_H = 74;
var PAD_X = 55;
var PAD_Y = 42;

function layout() {
  var leafIdx = 0;

  function postOrder(node) {
    var keys = Object.keys(node.children).sort();
    if (keys.length === 0) {
      node._xIdx = leafIdx++;
      return;
    }
    keys.forEach(function(k) { postOrder(node.children[k]); });
    var first = node.children[keys[0]]._xIdx;
    var last  = node.children[keys[keys.length - 1]]._xIdx;
    node._xIdx = (first + last) / 2;
  }
  postOrder(trieRoot);

  var leafCount = Math.max(1, leafIdx);
  var xSpacing  = Math.min(100, Math.max(72, 520 / leafCount));
  var maxDepth  = Object.values(nodeMap).reduce(function(m, n) { return Math.max(m, n.depth); }, 0);

  var VW = Math.max(300, PAD_X * 2 + (leafCount - 1) * xSpacing);
  var VH = PAD_Y * 2 + maxDepth * LEVEL_H + R + 10;

  var treeSpanX = (leafCount - 1) * xSpacing;
  var startX    = VW / 2 - treeSpanX / 2;

  function setCoords(node) {
    node.x = startX + node._xIdx * xSpacing;
    node.y = PAD_Y + node.depth * LEVEL_H;
    Object.keys(node.children).sort().forEach(function(k) { setCoords(node.children[k]); });
  }
  setCoords(trieRoot);

  return { VW: VW, VH: VH };
}

// ─── SVG Render ───────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

function renderSVG(dims) {
  var svg = document.getElementById('trie-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 ' + dims.VW + ' ' + dims.VH);

  var edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeG.id = 'edges';
  var nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeG.id = 'nodes';
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  Object.values(nodeMap).forEach(function(n) {
    // Edge to parent
    if (n.parent) {
      edgeG.appendChild(svgEl('line', {
        id: 'edge-' + n.id,
        x1: n.parent.x, y1: n.parent.y,
        x2: n.x, y2: n.y,
        stroke: EDGE.hidden.stroke,
        'stroke-width': 2.5,
        'stroke-linecap': 'round',
        opacity: EDGE.hidden.opacity,
      }));
    }

    // Node group
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'ng-' + n.id;

    // Outer circle
    g.appendChild(svgEl('circle', {
      id: 'nc-' + n.id,
      cx: n.x, cy: n.y, r: R,
      fill: C.hidden.fill, stroke: C.hidden.stroke, 'stroke-width': 2.5,
    }));

    // Inner ring (is_end indicator, hidden by default)
    var innerRing = svgEl('circle', {
      id: 'ni-' + n.id,
      cx: n.x, cy: n.y, r: R - 7,
      fill: 'none', stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 1.5,
    });
    innerRing.style.display = 'none';
    g.appendChild(innerRing);

    // Character label
    var t = svgEl('text', {
      id: 'nt-' + n.id,
      x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: C.hidden.text,
      'font-size': Math.round(R * 0.78),
      'font-weight': '700',
      'font-family': 'Segoe UI, system-ui, sans-serif',
    });
    t.textContent = n.char;
    g.appendChild(t);

    nodeG.appendChild(g);
  });
}

// ─── Simulation ───────────────────────────────────────────────────────────────
function simulate() {
  var steps = [];
  var existsMap = {};
  var isEndMap  = {};

  Object.values(nodeMap).forEach(function(n) {
    existsMap[n.id] = (n.id === trieRoot.id);
    isEndMap[n.id]  = false;
  });

  function snap(phase, desc, opIdx, highlightIds, resultState, codeLines) {
    steps.push({
      phase: phase,
      desc: desc,
      opIdx: opIdx !== undefined ? opIdx : -1,
      existsMap: Object.assign({}, existsMap),
      isEndMap:  Object.assign({}, isEndMap),
      highlightIds: highlightIds.slice(),
      resultState: resultState || null,
      codeLines: codeLines || [],
    });
  }

  snap('Start', 'Trie initialized with empty root node.', -1, [trieRoot.id], null, []);

  OPERATIONS.forEach(function(op, opIdx) {
    var type = op.type;
    var word = op.word;

    if (type === 'insert') {
      snap(
        'insert("' + word + '")',
        'insert("' + word + '"): node = self.root',
        opIdx, [trieRoot.id], null, [10, 11]
      );

      var node = trieRoot;
      var path = [trieRoot.id];

      word.split('').forEach(function(ch) {
        var childNode = node.children[ch];
        var alreadyExists = existsMap[childNode.id];

        if (!alreadyExists) {
          existsMap[childNode.id] = true;
          snap(
            'insert("' + word + '")',
            "char='" + ch + "': '" + ch + "' not in children → create new TrieNode.",
            opIdx, path.concat([childNode.id]), null, [12, 13, 14]
          );
        } else {
          snap(
            'insert("' + word + '")',
            "char='" + ch + "': '" + ch + "' already exists → follow.",
            opIdx, path.concat([childNode.id]), null, [12, 13, 15]
          );
        }

        node = childNode;
        path.push(node.id);
      });

      isEndMap[node.id] = true;
      snap(
        'insert("' + word + '")',
        'End of "' + word + '" — set node.is_end = True.',
        opIdx, path.slice(), null, [16]
      );

    } else if (type === 'search') {
      snap(
        'search("' + word + '")',
        'search("' + word + '"): node = self.root',
        opIdx, [trieRoot.id], null, [18, 19]
      );

      var node = trieRoot;
      var path = [trieRoot.id];
      var failed = false;

      word.split('').forEach(function(ch) {
        if (failed) return;
        var childNode = node.children[ch];

        if (!childNode || !existsMap[childNode.id]) {
          snap(
            'search("' + word + '")',
            "char='" + ch + "': '" + ch + "' not in children → return False.",
            opIdx, path.slice(), 'not_found', [20, 21, 22]
          );
          failed = true;
          return;
        }

        node = childNode;
        path.push(node.id);
        snap(
          'search("' + word + '")',
          "char='" + ch + "': found → node = node.children['" + ch + "']",
          opIdx, path.slice(), null, [20, 21, 23]
        );
      });

      if (!failed) {
        var result = isEndMap[node.id];
        snap(
          'search("' + word + '")',
          'All chars matched. node.is_end = ' + result + ' → return ' + result + '.',
          opIdx, path.slice(), result ? 'found' : 'not_found', [24]
        );
      }

    } else if (type === 'startsWith') {
      snap(
        'startsWith("' + word + '")',
        'startsWith("' + word + '"): node = self.root',
        opIdx, [trieRoot.id], null, [26, 27]
      );

      var node = trieRoot;
      var path = [trieRoot.id];
      var failed = false;

      word.split('').forEach(function(ch) {
        if (failed) return;
        var childNode = node.children[ch];

        if (!childNode || !existsMap[childNode.id]) {
          snap(
            'startsWith("' + word + '")',
            "char='" + ch + "': '" + ch + "' not in children → return False.",
            opIdx, path.slice(), 'not_found', [28, 29, 30]
          );
          failed = true;
          return;
        }

        node = childNode;
        path.push(node.id);
        snap(
          'startsWith("' + word + '")',
          "char='" + ch + "': found → node = node.children['" + ch + "']",
          opIdx, path.slice(), null, [28, 29, 31]
        );
      });

      if (!failed) {
        snap(
          'startsWith("' + word + '")',
          'All prefix chars matched → return True.',
          opIdx, path.slice(), 'found', [32]
        );
      }
    }
  });

  snap('Done', 'All 6 operations complete.', -1, [], null, []);
  return steps;
}

// ─── Apply Step ───────────────────────────────────────────────────────────────
var prevCodeLines = [];

function applyStep(step, animate) {
  // Node colors
  Object.values(nodeMap).forEach(function(n) {
    var state = getNodeState(n.id, step);
    setNodeColor(n.id, state, animate);
    setIsEnd(n.id, step.isEndMap[n.id], animate);
  });

  // Edge colors
  Object.values(nodeMap).forEach(function(n) {
    if (!n.parent) return;
    setEdgeColor(n.id, step, animate);
  });

  // Code highlight
  setCodeLines(prevCodeLines, step.codeLines, animate);
  prevCodeLines = step.codeLines || [];

  // Ops list
  updateOpsList(step.opIdx);

  // Result badge
  updateResultBadge(step);
}

function getNodeState(nodeId, step) {
  if (!step.existsMap[nodeId]) return 'hidden';

  var idx = step.highlightIds.indexOf(nodeId);
  if (idx === -1) return 'idle';

  var isLast = (idx === step.highlightIds.length - 1);
  if (isLast) {
    if (step.resultState === 'found')     return 'found';
    if (step.resultState === 'not_found') return 'not_found';
    return 'active';
  }
  return 'path';
}

function setNodeColor(id, state, animate) {
  var c  = C[state] || C.idle;
  var nc = document.getElementById('nc-' + id);
  var nt = document.getElementById('nt-' + id);
  if (!nc) return;

  if (animate) {
    gsap.to(nc, { duration: 0.25, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke } });
    if (nt) gsap.to(nt, { duration: 0.25, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill);
    nc.setAttribute('stroke', c.stroke);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

function setIsEnd(id, isEnd, animate) {
  var ni = document.getElementById('ni-' + id);
  if (!ni) return;
  ni.style.display = isEnd ? '' : 'none';
}

function setEdgeColor(childId, step, animate) {
  var edge = document.getElementById('edge-' + childId);
  if (!edge) return;

  var node     = nodeMap[childId];
  var parentId = node.parent.id;

  if (!step.existsMap[parentId] || !step.existsMap[childId]) {
    edge.setAttribute('stroke', EDGE.hidden.stroke);
    edge.setAttribute('opacity', EDGE.hidden.opacity);
    return;
  }

  var parentIdx = step.highlightIds.indexOf(parentId);
  var childIdx  = step.highlightIds.indexOf(childId);

  edge.setAttribute('opacity', '1');

  if (parentIdx !== -1 && childIdx !== -1) {
    var isLastEdge = (childIdx === step.highlightIds.length - 1);
    if (isLastEdge && step.resultState === 'found') {
      edge.setAttribute('stroke', EDGE.found.stroke);
    } else if (isLastEdge && step.resultState === 'not_found') {
      edge.setAttribute('stroke', EDGE.not_found.stroke);
    } else {
      edge.setAttribute('stroke', EDGE.path.stroke);
    }
  } else {
    edge.setAttribute('stroke', EDGE.idle.stroke);
  }
}

// ─── Code Highlighting ────────────────────────────────────────────────────────
var HL_BG   = 'rgba(255,158,100,0.13)';
var HL_NONE = 'rgba(255,158,100,0)';
var HL_BORD = 'var(--orange)';
var NO_BORD = 'transparent';

function setCodeLines(oldLines, newLines, animate) {
  var DUR = 0.2;

  oldLines.filter(function(n) { return newLines.indexOf(n) === -1; }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_NONE, borderLeftColor: NO_BORD, duration: DUR });
      var ln = el.querySelector('.ln');
      if (ln) gsap.to(ln, { color: '#3d4468', duration: DUR });
    } else {
      el.style.backgroundColor = '';
      el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln');
      if (ln) ln.style.color = '';
    }
  });

  newLines.filter(function(n) { return oldLines.indexOf(n) === -1; }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.05 });
      var ln = el.querySelector('.ln');
      if (ln) gsap.to(ln, { color: 'var(--orange)', duration: DUR, delay: 0.05 });
    } else {
      el.style.backgroundColor = HL_BG;
      el.style.borderLeftColor = HL_BORD;
      var ln = el.querySelector('.ln');
      if (ln) ln.style.color = 'var(--orange)';
    }
  });

  if (newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ─── Operations List ──────────────────────────────────────────────────────────
function buildOpsList() {
  var list = document.getElementById('op-list');
  list.innerHTML = '';
  OPERATIONS.forEach(function(op, i) {
    var div = document.createElement('div');
    div.className = 'op-item';
    div.id = 'op-' + i;

    var icon = document.createElement('span');
    icon.className = 'op-icon';
    icon.textContent = '○';

    var typeSpan = document.createElement('span');
    typeSpan.className = 'op-type t-' + op.type;
    typeSpan.textContent = op.type;

    var wordSpan = document.createElement('span');
    wordSpan.textContent = '("' + op.word + '")';

    div.appendChild(icon);
    div.appendChild(typeSpan);
    div.appendChild(wordSpan);
    list.appendChild(div);
  });
}

function updateOpsList(opIdx) {
  OPERATIONS.forEach(function(_, i) {
    var item = document.getElementById('op-' + i);
    if (!item) return;
    var icon = item.querySelector('.op-icon');
    item.className = 'op-item';
    icon.textContent = '○';
    if (i < opIdx) {
      item.classList.add('done');
      icon.textContent = '✓';
    } else if (i === opIdx) {
      item.classList.add('current');
      icon.textContent = '→';
    }
  });
}

// ─── Result Badge ─────────────────────────────────────────────────────────────
function updateResultBadge(step) {
  var badge = document.getElementById('result-badge');
  badge.className = 'result-badge';
  badge.textContent = '';

  if (step.resultState === 'found') {
    badge.classList.add('found');
    badge.textContent = (step.opIdx >= 0 && OPERATIONS[step.opIdx] && OPERATIONS[step.opIdx].type === 'startsWith')
      ? 'True'
      : 'True — found';
  } else if (step.resultState === 'not_found') {
    badge.classList.add('fail');
    badge.textContent = 'False — not found';
  }
}

// ─── Code Panel ───────────────────────────────────────────────────────────────
function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(function(entry) {
    var ln = entry[0], html = entry[1];
    var row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML =
      '<span class="ln">' + (ln > 0 ? ln : '') + '</span>' +
      '<span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
buildTrie();
var dims = layout();
renderSVG(dims);
buildCodePanel();
buildOpsList();
var simSteps = simulate();

var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var phaseEl = document.getElementById('phase-label');
    var descEl  = document.getElementById('step-desc');
    if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
    if (descEl)  descEl.textContent  = snap.desc;
  }
});

nav.load(simSteps);
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
</body>
