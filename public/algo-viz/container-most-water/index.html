<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container With Most Water | Code Kata</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <style>
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 300px;
      padding: 20px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      position: relative;
    }

    .bar {
      flex: 1;
      background: var(--blue);
      border-radius: 4px 4px 0 0;
      position: relative;
      transition: background-color 0.2s;
    }

    .bar.active-l {
      background: var(--text);
      box-shadow: 0 0 8px rgba(0, 150, 255, 0.6);
    }

    .bar.active-r {
      background: var(--orange);
      box-shadow: 0 0 8px rgba(255, 165, 0, 0.6);
    }

    .bar.water-fill {
      background: linear-gradient(to top, rgba(0, 150, 255, 0.3), rgba(0, 150, 255, 0.1));
      border: 1px solid rgba(0, 150, 255, 0.5);
    }

    .bar-label {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .variables-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .var-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .var-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .var-value {
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 600;
      font-family: monospace;
    }

    .code-line {
      padding: 2px 6px;
      border-left: 2px solid transparent;
      transition: all 0.2s;
    }

    .code-line.hl {
      background: rgba(122, 162, 247, 0.12);
      border-left: 2px solid var(--accent);
      padding-left: 6px;
    }

    .controls input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    .controls button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    .controls button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body class="page">
  <div class="page-header">
    <a class="back-link" href="../index.html">← All Algorithms</a>
    <div class="page-title">Container With Most Water</div>
    <div class="page-sub">LeetCode #11 · Two Pointers · O(n) time · O(1) space</div>
  </div>

  <div class="controls" style="display: flex; gap: 12px; margin: 20px auto; width: 100%; max-width: 90%; align-items: center;">
    <input type="text" id="inputField" placeholder="e.g., 1,8,6,2,5,4,8,3,7" value="1,8,6,2,5,4,8,3,7" style="flex: 1; min-width: 200px;">
    <button onclick="buildAndRun()">Build &amp; Run</button>
  </div>

  <div class="viz-area" style="width: 100%; max-width: 90%; margin: 0 auto;">
    <!-- Navigation & Status Row -->
    <div style="display: flex; gap: 12px; margin-bottom: 14px;">
      <div class="panel-box" style="flex: 0 0 auto;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn-step" id="prevBtn" disabled>&#8592;</button>
          <button class="btn-step" id="stepBtn" disabled>&#8594;</button>
          <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
          <select id="speedSel" style="background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem;">
            <option value="700">Slow</option>
            <option value="250" selected>Medium</option>
            <option value="80">Fast</option>
          </select>
        </div>
      </div>
      <div class="panel-box" style="flex: 1; min-width: 0;">
        <div style="font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);" id="phase-label">—</div>
        <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 3px;" id="step-desc">Click Build &amp; Run to start.</div>
      </div>
    </div>

    <!-- Bar Chart Visualization -->
    <div class="bar-chart" id="barChart"></div>

    <!-- Variables Panel -->
    <div class="variables-panel">
      <div class="var-card">
        <div class="var-label">Left Pointer (l)</div>
        <div class="var-value" id="var-l">—</div>
      </div>
      <div class="var-card">
        <div class="var-label">Right Pointer (r)</div>
        <div class="var-value" id="var-r">—</div>
      </div>
      <div class="var-card">
        <div class="var-label">Current Water</div>
        <div class="var-value" id="var-water">—</div>
      </div>
      <div class="var-card">
        <div class="var-label">Max Water</div>
        <div class="var-value" id="var-max">—</div>
      </div>
    </div>

    <!-- Code Panel -->
    <div class="panel-box" style="font-family: monospace; font-size: 0.78rem; line-height: 1.75; margin-top: 20px;">
      <div style="font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px;">Python</div>
      <div id="code-body"></div>
    </div>
  </div>

  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <script>
    var nav;
    var currentHeights = [];
    var currentStep = null;

    const pythonCode = [
      "def max_area(heights):",
      "    l, r = 0, len(heights) - 1",
      "    max_water = 0",
      "    while l < r:",
      "        water = min(heights[l], heights[r]) * (r - l)",
      "        max_water = max(max_water, water)",
      "        if heights[l] < heights[r]:",
      "            l += 1",
      "        else:",
      "            r -= 1",
      "    return max_water"
    ];

    window.addEventListener('DOMContentLoaded', function() {
      renderCodePanel();
      nav = VizNav({
        btnPrev: document.getElementById('prevBtn'),
        btnNext: document.getElementById('stepBtn'),
        btnPlay: document.getElementById('playBtn'),
        speedSel: document.getElementById('speedSel'),
        render: function(snap, cur, total) {
          applyStep(snap, cur > 0);
          updateStatus(snap, cur, total);
        }
      });
      buildAndRun();
    });

    function renderCodePanel() {
      const codeBody = document.getElementById('code-body');
      codeBody.innerHTML = pythonCode.map((line, i) =>
        `<div class="code-line" id="cl-${i}">${escapeHtml(line)}</div>`
      ).join('');
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function setCodeLines(activeLines) {
      document.querySelectorAll('.code-line').forEach(el => el.classList.remove('hl'));
      activeLines.forEach(lineNum => {
        const el = document.getElementById(`cl-${lineNum}`);
        if (el) el.classList.add('hl');
      });
    }

    function buildAndRun() {
      const input = document.getElementById('inputField').value.trim();
      let heights = [];
      try {
        if (input.includes(',')) {
          heights = input.split(',').map(x => parseInt(x.trim()));
        } else {
          heights = input.split(' ').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
        }
        if (heights.length === 0) throw new Error('No valid heights');
      } catch (e) {
        alert('Invalid input. Use comma or space-separated numbers.');
        return;
      }

      currentHeights = heights;
      const steps = simulate(heights);
      nav.load(steps);
    }

    function simulate(heights) {
      const steps = [];
      let l = 0, r = heights.length - 1, max_water = 0;

      // Initial state
      steps.push({
        phase: 'Initialize',
        desc: `Initialize: l=0, r=${heights.length - 1}, max_water=0`,
        l, r, max_water, water: 0,
        lines: [1]
      });

      while (l < r) {
        const hL = heights[l];
        const hR = heights[r];
        const water = Math.min(hL, hR) * (r - l);

        // Calculate water
        steps.push({
          phase: 'Calculate',
          desc: `Calculate water at (l=${l}, r=${r}): min(${hL}, ${hR}) × ${r - l} = ${water}`,
          l, r, water, max_water,
          lines: [4]
        });

        // Update max
        const newMax = Math.max(max_water, water);
        if (newMax !== max_water) {
          steps.push({
            phase: 'Update',
            desc: `Update max_water: ${max_water} → ${newMax}`,
            l, r, water, max_water: newMax,
            lines: [5]
          });
          max_water = newMax;
        }

        // Compare heights
        if (hL < hR) {
          steps.push({
            phase: 'Move',
            desc: `heights[${l}]=${hL} < heights[${r}]=${hR}, move left pointer`,
            l, r, water, max_water,
            lines: [6, 7]
          });
          l++;
        } else {
          steps.push({
            phase: 'Move',
            desc: `heights[${l}]=${hL} >= heights[${r}]=${hR}, move right pointer`,
            l, r, water, max_water,
            lines: [8, 9]
          });
          r--;
        }
      }

      // Final result
      steps.push({
        phase: 'Complete',
        desc: `Algorithm complete. Maximum water area: ${max_water}`,
        l, r, water: max_water, max_water,
        lines: [10]
      });

      return steps;
    }

    function applyStep(snap, animate) {
      const { l, r, water, max_water, lines } = snap;

      // Update code highlighting
      if (lines) {
        setCodeLines(lines);
      }

      // Render bar chart
      renderBarChart(currentHeights, l, r, water, max_water);

      // Update variables
      document.getElementById('var-l').textContent = l !== undefined ? l : '—';
      document.getElementById('var-r').textContent = r !== undefined ? r : '—';
      document.getElementById('var-water').textContent = water !== undefined ? water : '—';
      document.getElementById('var-max').textContent = max_water !== undefined ? max_water : '—';
    }

    function renderBarChart(heights, l, r, water, max_water) {
      const chart = document.getElementById('barChart');
      const maxH = Math.max(...heights);
      const minH = Math.min(...heights);
      const scaleFactor = 250 / maxH;

      chart.innerHTML = heights.map((h, i) => {
        let barClass = 'bar';
        if (i === l) barClass += ' active-l';
        if (i === r) barClass += ' active-r';
        if (i > l && i < r) barClass += ' water-fill';

        const heightPx = h * scaleFactor;
        return `
          <div class="${barClass}" style="height: ${heightPx}px;">
            <div class="bar-label">${h}</div>
          </div>
        `;
      }).join('');
    }

    function updateStatus(snap, cur, total) {
      const { phase, desc, lines } = snap;
      document.getElementById('phase-label').textContent = phase || '—';
      document.getElementById('step-desc').textContent = desc || 'Click Build & Run to start.';
    }

    // Hide back-link in iframe
    if (window.self !== window.top) {
      const backLink = document.querySelector('.back-link');
      if (backLink) backLink.style.display = 'none';
    }
  </script>
</body>
</html>
