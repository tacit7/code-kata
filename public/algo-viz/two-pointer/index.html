<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two Pointer — Remove Duplicates</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; overflow-y: auto; }

  .panel-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }

  #array-row { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .cell-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; border-radius: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); transition: all 0.2s; }
  .cell.left-ptr { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.25); background: rgba(99,102,241,0.12); color: #818cf8; }
  .cell.right-ptr { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.25); background: rgba(249,115,22,0.12); color: #fb923c; }
  .cell.both-ptr { border-color: #a21caf; box-shadow: 0 0 0 3px rgba(162,28,175,0.25); background: rgba(162,28,175,0.12); color: #e879f9; }
  .cell.written { border-color: var(--green, #9ece6a); background: rgba(158,206,106,0.15); color: var(--green, #9ece6a); }
  .cell.dup { border-color: var(--border); background: rgba(128,128,128,0.12); color: var(--text-dim); }
  .cell.done-k { border-color: var(--green, #9ece6a); background: rgba(158,206,106,0.15); }
  .cell.done-tail { border-color: var(--border); background: rgba(128,128,128,0.08); color: var(--text-dim); opacity: 0.45; }
  .ptr-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; height: 14px; }
  .ptr-label.L { color: #6366f1; }
  .ptr-label.R { color: #f97316; }
  .ptr-label.LR { color: #a21caf; }

  #status-msg { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #result-badge { padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-align: center; display: none; }
  #result-badge.show { background: rgba(158,206,106,0.15); border: 1px solid var(--green-border, #4a7c59); color: var(--green, #9ece6a); display: block; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; font-size: 0.72rem; color: var(--text-dim); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: "Fira Code", "Cascadia Code", monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }
  .cm { color: var(--text-dim); font-style: italic; }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value="0,0,1,1,1,2,2,3,3,4">Many duplicates</option>
      <option value="1,2,3,4,5,6">No duplicates</option>
      <option value="7,7,7,7,7">All same</option>
      <option value="1,1,2,2,3,3">3 distinct</option>
      <option value="0,0,0,1,1,2,3,3,4,4,5,5,6">Long sorted array</option>
      <option value="-3,-3,-1,0,0,2">Negative values</option>
      <option value="1,1">Two same</option>
    </select>
  </div>
  <div>
    <label>Array (sorted, comma-separated)</label>
    <input id="arrInput" type="text" value="0,0,1,1,1,2,2,3,3,4" style="width:220px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Two Pointer — Remove Duplicates</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="status-msg">Enter a sorted array and click Run.</div>
    <div style="width:100%;max-width:640px;">
      <div class="panel-label">Array</div>
      <div id="array-row"></div>
    </div>
    <div id="result-badge"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="border-color:#6366f1;background:rgba(99,102,241,0.12)"></div> left (write)</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#f97316;background:rgba(249,115,22,0.12)"></div> right (read)</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#a21caf;background:rgba(162,28,175,0.12)"></div> both</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:var(--green,#9ece6a);background:rgba(158,206,106,0.1)"></div> written</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:var(--border);background:rgba(128,128,128,0.12)"></div> duplicate</div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var codeLines = [
  { n: 1,  t: '<span class="kw">def</span> <span class="nb">removeDuplicates</span>(nums):' },
  { n: 2,  t: '  <span class="kw">if not</span> nums: <span class="kw">return</span> 0' },
  { n: 3,  t: '' },
  { n: 4,  t: '  left = 0' },
  { n: 5,  t: '' },
  { n: 6,  t: '  <span class="kw">for</span> right <span class="kw">in</span> <span class="nb">range</span>(1, <span class="nb">len</span>(nums)):' },
  { n: 7,  t: '    <span class="kw">if</span> nums[right] != nums[left]:' },
  { n: 8,  t: '      left += 1' },
  { n: 9,  t: '      nums[left] = nums[right]' },
  { n: 10, t: '    <span class="cm"># else: skip duplicate</span>' },
  { n: 11, t: '' },
  { n: 12, t: '  <span class="kw">return</span> left + 1' },
];

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl' + line.n;
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-badge').textContent = snap.phase;
      document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
    }
  });

  buildAndRun();
});

var arr = [];

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (sel.value) {
    document.getElementById('arrInput').value = sel.value;
    buildAndRun();
  }
}

function randomExample() {
  var distinctCount = Math.floor(Math.random() * 5) + 3;
  var nums = [];
  var val = Math.floor(Math.random() * 4) - 1;
  for (var i = 0; i < distinctCount; i++) {
    var reps = Math.floor(Math.random() * 3) + 1;
    for (var j = 0; j < reps; j++) nums.push(val);
    val += Math.floor(Math.random() * 3) + 1;
  }
  document.getElementById('arrInput').value = nums.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function parseArr() {
  var raw = document.getElementById('arrInput').value.trim();
  return raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
}

function buildAndRun() {
  arr = parseArr();
  if (arr.length === 0) {
    document.getElementById('status-msg').textContent = 'Enter a valid array.';
    return;
  }
  var steps = [];

  steps.push({ arr: arr.slice(), left: 0, right: -1, phase: 'Init', msg: 'Initialize left = 0. Right pointer will scan from index 1.', codeLines: [1, 4] });

  if (arr.length === 1) {
    steps.push({ arr: arr.slice(), left: 0, right: 0, phase: 'Done', msg: 'Array has only one element. k = 1.', codeLines: [12], k: 1 });
    window.nav.load(steps);
    return;
  }

  var sim = arr.slice();
  var left = 0;

  for (var right = 1; right < sim.length; right++) {
    steps.push({
      arr: sim.slice(), left: left, right: right, phase: 'Check',
      msg: 'nums[' + right + '] = ' + sim[right] + '. Is nums[right] (' + sim[right] + ') != nums[left] (' + sim[left] + ')??',
      codeLines: [6, 7]
    });

    if (sim[right] !== sim[left]) {
      left++;
      sim[left] = sim[right];
      steps.push({
        arr: sim.slice(), left: left, right: right, phase: 'Write',
        msg: 'Unique! Advance left to ' + left + ', write nums[left] = ' + sim[right] + '.',
        codeLines: [8, 9]
      });
    } else {
      steps.push({
        arr: sim.slice(), left: left, right: right, phase: 'Skip',
        msg: 'Duplicate! nums[right] (' + sim[right] + ') == nums[left] (' + sim[left] + '). Skip.',
        codeLines: [10]
      });
    }
  }

  steps.push({
    arr: sim.slice(), left: left, right: sim.length - 1, phase: 'Done',
    msg: 'Done. k = ' + (left + 1) + '. Array has ' + (left + 1) + ' unique elements.',
    codeLines: [12], k: left + 1
  });

  window.nav.load(steps);
}

function applyStep(step) {
  document.getElementById('status-msg').textContent = step.msg;

  var badge = document.getElementById('result-badge');
  if (step.phase === 'Done' && step.k !== undefined) {
    badge.textContent = 'k = ' + step.k;
    badge.classList.add('show');
  } else {
    badge.textContent = '';
    badge.classList.remove('show');
  }

  document.querySelectorAll('.cl').forEach(function(el) { el.classList.remove('hl'); });
  (step.codeLines || []).forEach(function(n) {
    var el = document.getElementById('cl' + n);
    if (el) el.classList.add('hl');
  });

  var row = document.getElementById('array-row');
  row.innerHTML = '';
  var a = step.arr;
  var left = step.left;
  var right = step.right;
  var phase = step.phase;
  var k = step.k;

  a.forEach(function(val, i) {
    var wrap = document.createElement('div');
    wrap.className = 'cell-wrap';

    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.textContent = val;

    var lbl = document.createElement('div');
    lbl.className = 'ptr-label';

    var isLeft = i === left;
    var isRight = i === right;

    if (phase === 'Done' && k !== undefined) {
      if (i < k) cell.classList.add('done-k');
      else cell.classList.add('done-tail');
    } else if (isLeft && isRight) {
      cell.classList.add('both-ptr');
      lbl.textContent = 'L+R';
      lbl.classList.add('LR');
    } else if (isLeft) {
      cell.classList.add('left-ptr');
      lbl.textContent = 'L';
      lbl.classList.add('L');
    } else if (isRight) {
      cell.classList.add('right-ptr');
      lbl.textContent = 'R';
      lbl.classList.add('R');
    } else if (phase === 'Write' && i < left && i >= 0) {
      cell.classList.add('written');
    } else if (right >= 0 && i > left && i <= right && phase !== 'Init') {
      cell.classList.add('dup');
    }

    wrap.appendChild(lbl);
    wrap.appendChild(cell);

    var idxLbl = document.createElement('div');
    idxLbl.style.cssText = 'font-size:0.6rem;color:var(--text-dim);font-family:monospace;';
    idxLbl.textContent = i;
    wrap.appendChild(idxLbl);

    row.appendChild(wrap);
  });

  var varsDiv = document.getElementById('vars-items');
  var html = '';
  html += '<div class="var-item"><span class="var-key">left</span> = <span class="var-val">' + left + '</span></div>';
  if (right >= 0) {
    html += '<div class="var-item"><span class="var-key">right</span> = <span class="var-val">' + right + '</span></div>';
    if (left < a.length) html += '<div class="var-item"><span class="var-key">nums[left]</span> = <span class="var-val">' + a[left] + '</span></div>';
    if (right < a.length) html += '<div class="var-item"><span class="var-key">nums[right]</span> = <span class="var-val">' + a[right] + '</span></div>';
  }
  if (step.k !== undefined) {
    html += '<div class="var-item"><span class="var-key">k</span> = <span class="var-val">' + step.k + '</span></div>';
  }
  varsDiv.innerHTML = html || '<span style="color:var(--text-dim);">—</span>';
}

(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
