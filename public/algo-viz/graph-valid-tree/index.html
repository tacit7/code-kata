<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Valid Tree</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input[type="text"], .viz-inputs input[type="number"] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 16px; gap: 12px; overflow-y: auto; }

    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-step:hover:not(:disabled) { background: #334155; }
    .btn-step:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--accent); background: var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

    /* Graph */
    .graph-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .graph-svg-wrap { width: 100%; aspect-ratio: 1.6; background: var(--bg); border-radius: var(--radius-sm); overflow: hidden; }
    .graph-svg-wrap svg { width: 100%; height: 100%; }

    .nc-default { fill: #1a1b2e; stroke: #3b4261; }
    .nc-active  { fill: #2d1a3d; stroke: #bb9af7; stroke-width: 3; }
    .nc-merged  { fill: #1a2035; stroke: #7aa2f7; }
    .nc-cycle   { fill: #3d1a1a; stroke: #f7768e; stroke-width: 3; }
    .nc-done    { fill: #1a2a1a; stroke: #9ece6a; }
    .node-circle { stroke-width: 2.5; transition: fill 0.25s, stroke 0.25s; }
    .node-label { fill: var(--text-bright); font-size: 13px; font-weight: 700; font-family: monospace; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .edge-line   { stroke: #3b4261; stroke-width: 2; }
    .edge-active { stroke: #bb9af7; stroke-width: 3; }
    .edge-merged { stroke: #7aa2f7; stroke-width: 2.5; }
    .edge-cycle  { stroke: #f7768e; stroke-width: 3; stroke-dasharray: 6 3; }
    .edge-done   { stroke: #9ece6a; stroke-width: 2; }

    /* Step description in viz-area */
    #desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); width: 100%; min-height: 40px; }

    /* Code */
    .code-body { padding: 10px 0; font-size: 0.75rem; line-height: 1.75; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 22px; color: var(--text-ghost); user-select: none; font-size: 0.68rem; }
    .kw { color: var(--purple); } .fn { color: var(--blue); } .bi { color: var(--orange); }
    .cm { color: var(--text-ghost); } .nb { color: var(--green); }

    /* UF state */
    .uf-grid { display: flex; flex-direction: column; gap: 6px; }
    .uf-row { display: flex; gap: 4px; align-items: center; font-size: 0.75rem; font-family: monospace; }
    .uf-label { color: var(--text-dim); width: 52px; flex-shrink: 0; font-weight: 600; }
    .uf-cells { display: flex; gap: 4px; flex-wrap: wrap; }
    .uf-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .uf-val { width: 32px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 700; font-size: 0.82rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); transition: background 0.2s, border-color 0.2s, color 0.2s; }
    .uf-val.is-root   { background: #1a2a1a; border-color: #9ece6a; color: #9ece6a; }
    .uf-val.is-active { background: #2d1a3d; border-color: #bb9af7; color: #bb9af7; }
    .uf-val.changed   { background: #1a2035; border-color: #7aa2f7; color: #7aa2f7; }
    .uf-val.is-cycle  { background: #3d1a1a; border-color: #f7768e; color: #f7768e; }

    /* Result badge */
    .result-badge { font-size: 1.6rem; font-weight: 800; text-align: center; padding: 6px 0 2px; }
    .result-badge.true  { color: var(--green); }
    .result-badge.false { color: var(--red); }
    .result-badge.pending { color: var(--text-dim); }
    .result-label { font-size: 0.75rem; color: var(--text-dim); text-align: center; }

    /* Legend */
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.73rem; color: var(--text-muted); }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"n":"5","edges":"0,1;0,2;0,3;1,4"}'>Valid Tree (5 nodes)</option>
      <option value='{"n":"3","edges":"0,1;1,2"}'>Valid Tree (3 nodes)</option>
      <option value='{"n":"4","edges":"0,1;0,2;1,3"}'>Valid Tree (4 nodes)</option>
      <option value='{"n":"5","edges":"0,1;1,2;2,0"}'>Cycle Detected</option>
      <option value='{"n":"1","edges":""}'>Single Node</option>
      <option value='{"n":"4","edges":"0,1;2,3"}'>Disconnected (2 components)</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Nodes (n)</label>
    <input type="number" id="input-n" value="5" min="1" max="10" style="width:70px" />
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Edges</label>
    <input type="text" id="input-edges" value="0,1;0,2;0,3;1,4" style="width:180px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:600;color:var(--text)">Graph Valid Tree</span>
  <span style="font-size:11px;color:var(--text-dim)">LC 261 &middot; Union-Find &middot; O(E&middot;&alpha;(N))</span>
  <span id="step-counter"></span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc" style="display:none">Enter n and edges, then click Run.</div>
    <div class="graph-panel">
      <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim)">Graph</div>
      <div class="graph-svg-wrap">
        <svg id="graph-svg" viewBox="0 0 460 320" preserveAspectRatio="xMidYMid meet">
          <g id="edges-g"></g>
          <g id="nodes-g"></g>
        </svg>
      </div>
    </div>
    <div id="desc" style="font-size:0.82rem;color:var(--text-muted);padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);width:100%;min-height:40px">Enter n and edges, then click Run.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Union-Find State</div>
      <div class="uf-grid" id="uf-grid">
        <span style="color:var(--text-ghost);font-size:0.78rem">not built</span>
      </div>
    </div>
    <div style="text-align:center;padding:8px 0">
      <div class="result-badge pending" id="result-badge">&#8212;</div>
      <div class="result-label" id="result-label">valid tree</div>
    </div>
    <div>
      <div class="sidebar-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <div class="legend-row"><div class="legend-dot" style="background:#1a1b2e;border-color:#3b4261"></div><span>Untouched</span></div>
        <div class="legend-row"><div class="legend-dot" style="background:#2d1a3d;border-color:#bb9af7"></div><span>Active edge</span></div>
        <div class="legend-row"><div class="legend-dot" style="background:#3d1a1a;border-color:#f7768e"></div><span>Cycle detected!</span></div>
        <div class="legend-row"><div class="legend-dot" style="background:#1a2035;border-color:#7aa2f7"></div><span>Merged</span></div>
        <div class="legend-row"><div class="legend-dot" style="background:#1a2a1a;border-color:#9ece6a"></div><span>Root / processed</span></div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&#8592; Prev</button>
  <button class="btn-step" id="stepBtn" disabled>Step &#8594;</button>
  <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="900">Slow</option>
    <option value="450" selected>Medium</option>
    <option value="140">Fast</option>
  </select>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">validTree</span>(n, edges):'],
  [2,  '    par = <span class="bi">list</span>(<span class="bi">range</span>(n))'],
  [3,  '    rank = [<span class="nb">0</span>] * n'],
  [4,  ''],
  [5,  '    <span class="kw">def</span> <span class="fn">find</span>(x):'],
  [6,  '        <span class="kw">while</span> par[x] != x:'],
  [7,  '            par[x] = par[par[x]]  <span class="cm"># path compression</span>'],
  [8,  '            x = par[x]'],
  [9,  '        <span class="kw">return</span> x'],
  [10, ''],
  [11, '    <span class="kw">for</span> u, v <span class="kw">in</span> edges:'],
  [12, '        ru, rv = <span class="fn">find</span>(u), <span class="fn">find</span>(v)'],
  [13, '        <span class="kw">if</span> ru == rv: <span class="cm"># cycle!</span>'],
  [14, '            <span class="kw">return</span> <span class="nb">False</span>'],
  [15, '        <span class="kw">if</span> rank[ru] < rank[rv]:'],
  [16, '            par[ru] = rv'],
  [17, '        <span class="kw">elif</span> rank[ru] > rank[rv]:'],
  [18, '            par[rv] = ru'],
  [19, '        <span class="kw">else</span>:'],
  [20, '            par[rv] = ru; rank[ru] += <span class="nb">1</span>'],
  [21, '    <span class="kw">return</span> <span class="bi">len</span>(<span class="bi">set</span>(<span class="fn">find</span>(i) <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span>(n))) == <span class="nb">1</span>'],
];

var gN = 5;
var gEdges = [[0,1],[0,2],[0,3],[1,4]];
var gPositions = [];
var simSteps = [];
var nav;

function parseEdges(str) {
  if (!str.trim()) return [];
  return str.trim().split(';').map(function(s) {
    var parts = s.trim().split(',');
    return [parseInt(parts[0]), parseInt(parts[1])];
  }).filter(function(e) { return !isNaN(e[0]) && !isNaN(e[1]); });
}

function computePositions(n) {
  var cx = 230, cy = 160, r = 110;
  var positions = [];
  for (var i = 0; i < n; i++) {
    var angle = (2 * Math.PI * i / n) - Math.PI / 2;
    positions.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
  }
  return positions;
}

function buildAndRun() {
  var nVal = parseInt(document.getElementById('input-n').value);
  var eStr = document.getElementById('input-edges').value;
  if (isNaN(nVal) || nVal < 1 || nVal > 10) { alert('n must be 1\u201310'); return; }
  gN = nVal;
  gEdges = parseEdges(eStr);
  gPositions = computePositions(gN);
  simSteps = simulate(gN, gEdges);
  nav.load(simSteps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('input-n').value = d.n;
  document.getElementById('input-edges').value = d.edges;
  buildAndRun();
}

function randomExample() {
  var n = Math.floor(Math.random() * 5) + 3;
  var hasEdges = Math.random() > 0.3;
  var edges = [];
  if (hasEdges && n > 1) {
    var maxEdges = n - 1;
    var numEdges = Math.floor(Math.random() * (maxEdges + 2));
    for (var i = 0; i < numEdges; i++) {
      var u = Math.floor(Math.random() * n);
      var v = Math.floor(Math.random() * n);
      if (u !== v) { edges.push(u + ',' + v); }
    }
  }
  document.getElementById('input-n').value = n;
  document.getElementById('input-edges').value = edges.join(';');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function simulate(n, edges) {
  var steps = [];
  var par = [];
  var rnk = [];
  for (var i = 0; i < n; i++) { par.push(i); rnk.push(0); }

  var edgeState = edges.map(function() { return 'none'; });
  var cycleDetected = false;
  var finalResult = null;

  function findRoot(x, parArr) {
    var a = x;
    while (parArr[a] !== a) { a = parArr[a]; }
    return a;
  }

  function snap(phase, desc, lines, opts) {
    opts = opts || {};
    steps.push({
      phase: phase, desc: desc, lines: lines,
      par: par.slice(), rnk: rnk.slice(),
      edgeState: edgeState.slice(),
      activeNodes: opts.activeNodes || [],
      cycleNodes: opts.cycleNodes || [],
      mergedNodes: opts.mergedNodes || [],
      changedParent: opts.changedParent !== undefined ? opts.changedParent : -1,
      activeEdge: opts.activeEdge !== undefined ? opts.activeEdge : -1,
      result: opts.result !== undefined ? opts.result : null,
    });
  }

  snap('Initialize', 'parent[i] = i for all nodes \u2014 each node is its own component. rank[i] = 0.', [2, 3], {});

  for (var ei = 0; ei < edges.length; ei++) {
    var u = edges[ei][0], v = edges[ei][1];
    edgeState[ei] = 'active';
    snap('Process Edge', 'Edge (' + u + ', ' + v + '): calling find(' + u + ') and find(' + v + ') to get their roots.', [11, 12], { activeNodes: [u, v], activeEdge: ei });

    var ru = findRoot(u, par);
    var rv = findRoot(v, par);

    var a = u;
    while (par[a] !== a) { var nxt = par[par[a]]; par[a] = nxt; a = nxt; }
    var b = v;
    while (par[b] !== b) { var nxt2 = par[par[b]]; par[b] = nxt2; b = nxt2; }

    if (ru === rv) {
      edgeState[ei] = 'cycle';
      cycleDetected = true;
      snap('Cycle Detected!', 'find(' + u + ')=' + ru + ' == find(' + v + ')=' + rv + ' \u2014 same root means a cycle. Return False.', [13, 14], { cycleNodes: [u, v], activeEdge: ei, result: false });
      finalResult = false;
      break;
    } else {
      var changedIdx = -1;
      if (rnk[ru] < rnk[rv]) {
        par[ru] = rv; changedIdx = ru;
        snap('Union', 'find(' + u + ')=' + ru + ', find(' + v + ')=' + rv + ' \u2014 different roots. rank[' + ru + ']<rank[' + rv + ']: par[' + ru + ']=' + rv + '.', [15, 16], { mergedNodes: [u, v, ru, rv], activeEdge: ei, changedParent: changedIdx });
      } else if (rnk[ru] > rnk[rv]) {
        par[rv] = ru; changedIdx = rv;
        snap('Union', 'find(' + u + ')=' + ru + ', find(' + v + ')=' + rv + ' \u2014 different roots. rank[' + ru + ']>rank[' + rv + ']: par[' + rv + ']=' + ru + '.', [17, 18], { mergedNodes: [u, v, ru, rv], activeEdge: ei, changedParent: changedIdx });
      } else {
        par[rv] = ru; rnk[ru] += 1; changedIdx = rv;
        snap('Union', 'find(' + u + ')=' + ru + ', find(' + v + ')=' + rv + ' \u2014 equal ranks. par[' + rv + ']=' + ru + ', rank[' + ru + '] \u2192 ' + rnk[ru] + '.', [19, 20], { mergedNodes: [u, v, ru, rv], activeEdge: ei, changedParent: changedIdx });
      }
      edgeState[ei] = 'merged';
    }
  }

  if (!cycleDetected) {
    var roots = {};
    for (var i = 0; i < n; i++) { roots[findRoot(i, par)] = true; }
    var numComponents = Object.keys(roots).length;
    finalResult = numComponents === 1;
    snap('Check Connectivity',
      'No cycles. Distinct roots: ' + numComponents + ' component(s). ' +
      (finalResult ? 'Exactly 1 \u2014 valid tree! Return True.' : numComponents + ' components \u2014 disconnected. Return False.'),
      [21], { result: finalResult });
  }

  return steps;
}

function renderGraph(snap) {
  var edgesG = document.getElementById('edges-g');
  var nodesG = document.getElementById('nodes-g');
  edgesG.innerHTML = '';
  nodesG.innerHTML = '';

  var activeSet = {}, cycleSet = {}, mergedSet = {};
  (snap.activeNodes || []).forEach(function(i) { activeSet[i] = true; });
  (snap.cycleNodes || []).forEach(function(i) { cycleSet[i] = true; });
  (snap.mergedNodes || []).forEach(function(i) { mergedSet[i] = true; });

  gEdges.forEach(function(e, ei) {
    var u = e[0], v = e[1];
    if (u >= gPositions.length || v >= gPositions.length) return;
    var pu = gPositions[u], pv = gPositions[v];
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pu.x); line.setAttribute('y1', pu.y);
    line.setAttribute('x2', pv.x); line.setAttribute('y2', pv.y);
    var es = snap.edgeState[ei];
    var cls = 'edge-line';
    if (ei === snap.activeEdge) {
      cls = (es === 'cycle') ? 'edge-cycle' : (es === 'merged' ? 'edge-merged' : 'edge-active');
    } else if (es === 'cycle') { cls = 'edge-cycle'; }
    else if (es === 'merged') { cls = 'edge-merged'; }
    else if (es === 'done') { cls = 'edge-done'; }
    line.setAttribute('class', cls);
    edgesG.appendChild(line);
  });

  for (var i = 0; i < gN; i++) {
    var pos = gPositions[i];
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y); circle.setAttribute('r', 22);
    var cls = 'node-circle nc-default';
    if (cycleSet[i]) cls = 'node-circle nc-cycle';
    else if (activeSet[i]) cls = 'node-circle nc-active';
    else if (mergedSet[i]) cls = 'node-circle nc-merged';
    circle.setAttribute('class', cls);
    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x); text.setAttribute('y', pos.y);
    text.setAttribute('class', 'node-label'); text.textContent = i;
    g.appendChild(circle); g.appendChild(text);
    nodesG.appendChild(g);
  }
}

function renderUF(snap) {
  var el = document.getElementById('uf-grid');
  var par = snap.par, rnk = snap.rnk, n = par.length;
  var changed = snap.changedParent;
  var cycleSet = {}, activeSet = {};
  (snap.cycleNodes || []).forEach(function(i) { cycleSet[i] = true; });
  (snap.activeNodes || []).forEach(function(i) { activeSet[i] = true; });

  var idxHtml = '', parHtml = '', rnkHtml = '';
  for (var i = 0; i < n; i++) {
    var isRoot = par[i] === i, isChanged = i === changed, isCycle = cycleSet[i], isActive = activeSet[i];
    var parCls = 'uf-val';
    if (isCycle) parCls += ' is-cycle';
    else if (isRoot) parCls += ' is-root';
    if (isChanged) parCls += ' changed';
    else if (isActive && !isCycle) parCls += ' is-active';
    idxHtml += '<div class="uf-cell"><div class="uf-val" style="background:transparent;border:none;color:var(--text-ghost)">' + i + '</div></div>';
    parHtml += '<div class="uf-cell"><div class="' + parCls + '">' + par[i] + '</div></div>';
    rnkHtml += '<div class="uf-cell"><div class="uf-val">' + rnk[i] + '</div></div>';
  }
  el.innerHTML =
    '<div class="uf-row"><div class="uf-label">index</div><div class="uf-cells">' + idxHtml + '</div></div>' +
    '<div class="uf-row"><div class="uf-label">parent[]</div><div class="uf-cells">' + parHtml + '</div></div>' +
    '<div class="uf-row"><div class="uf-label">rank[]</div><div class="uf-cells">' + rnkHtml + '</div></div>';
}

function renderResult(snap) {
  var badge = document.getElementById('result-badge');
  var label = document.getElementById('result-label');
  if (snap.result === null) {
    badge.textContent = '\u2014'; badge.className = 'result-badge pending'; label.textContent = 'valid tree';
  } else if (snap.result === true) {
    badge.textContent = 'True'; badge.className = 'result-badge true'; label.textContent = 'valid tree \u2713';
  } else {
    badge.textContent = 'False'; badge.className = 'result-badge false'; label.textContent = 'not a valid tree';
  }
}

function applyStep(snap) {
  renderGraph(snap);
  renderUF(snap);
  renderResult(snap);
  setCodeLines(snap.lines);
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (!el) return;
    if (lines && lines.indexOf(e[0]) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="code-line" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      var badge = document.getElementById('phase-badge');
      var desc  = document.getElementById('desc');
      var ctr   = document.getElementById('step-counter');
      if (badge) badge.textContent = snap.phase;
      if (desc)  desc.textContent  = snap.desc;
      if (ctr)   ctr.textContent   = 'Step ' + (cur + 1) + ' / ' + total;
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    nav.stopPlay();
    buildAndRun();
  });

  buildAndRun();
});
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
