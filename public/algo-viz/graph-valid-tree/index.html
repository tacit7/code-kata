<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Valid Tree</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    .main-row {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      align-items: start;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 900px) { .main-row { grid-template-columns: 1fr; } }

    .graph-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .graph-svg-wrap {
      width: 100%;
      aspect-ratio: 1.4;
      background: var(--bg);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .graph-svg-wrap svg { width: 100%; height: 100%; }

    /* node states */
    .nc-default { fill: #1a1b2e; stroke: #3b4261; }
    .nc-active  { fill: #2d1a3d; stroke: #bb9af7; stroke-width: 3; }
    .nc-merged  { fill: #1a2035; stroke: #7aa2f7; }
    .nc-cycle   { fill: #3d1a1a; stroke: #f7768e; stroke-width: 3; }
    .nc-done    { fill: #1a2a1a; stroke: #9ece6a; }

    .node-circle { stroke-width: 2.5; transition: fill 0.25s, stroke 0.25s; }
    .node-label {
      fill: var(--text-bright); font-size: 13px; font-weight: 700;
      font-family: monospace; text-anchor: middle; dominant-baseline: central;
      pointer-events: none;
    }

    .edge-line   { stroke: #3b4261; stroke-width: 2; }
    .edge-active { stroke: #bb9af7; stroke-width: 3; }
    .edge-merged { stroke: #7aa2f7; stroke-width: 2.5; }
    .edge-cycle  { stroke: #f7768e; stroke-width: 3; stroke-dasharray: 6 3; }
    .edge-done   { stroke: #9ece6a; stroke-width: 2; }

    /* right column */
    .right-col { display: flex; flex-direction: column; gap: 12px; }

    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
    }

    .nav-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .speed-select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 0.85rem; padding: 8px 10px; outline: none; width: 80px;
    }

    /* Union-Find state display */
    .uf-grid { display: flex; flex-direction: column; gap: 6px; }
    .uf-row {
      display: flex; gap: 4px; align-items: center;
      font-size: 0.75rem; font-family: monospace;
    }
    .uf-label { color: var(--text-dim); width: 52px; flex-shrink: 0; font-weight: 600; }
    .uf-cells { display: flex; gap: 4px; flex-wrap: wrap; }
    .uf-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .uf-val {
      width: 32px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; font-weight: 700; font-size: 0.82rem;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .uf-val.is-root    { background: #1a2a1a; border-color: #9ece6a; color: #9ece6a; }
    .uf-val.is-active  { background: #2d1a3d; border-color: #bb9af7; color: #bb9af7; }
    .uf-val.changed    { background: #1a2035; border-color: #7aa2f7; color: #7aa2f7; }
    .uf-val.is-cycle   { background: #3d1a1a; border-color: #f7768e; color: #f7768e; }

    .result-badge {
      font-size: 1.6rem; font-weight: 800; text-align: center; padding: 6px 0 2px;
    }
    .result-badge.true  { color: var(--green); }
    .result-badge.false { color: var(--red); }
    .result-badge.pending { color: var(--text-dim); }
    .result-label { font-size: 0.75rem; color: var(--text-dim); text-align: center; }

    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); }
    .legend-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }

    .code-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .code-header {
      padding: 8px 14px; font-size: 0.72rem; font-weight: 600;
      color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .code-body { padding: 10px 0; font-size: 0.75rem; line-height: 1.75; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 22px; color: var(--text-ghost); user-select: none; font-size: 0.68rem; }
    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .cm { color: var(--text-ghost); }
    .nb { color: var(--green); }

    .input-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .input-field { display: flex; flex-direction: column; gap: 4px; }
    .input-field label { font-size: 0.72rem; color: var(--text-dim); font-weight: 600; }
    .input-field input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 0.85rem; padding: 8px 10px; outline: none; width: 60px;
    }
    .input-field input.wide { width: 220px; }
    .input-field input:focus { border-color: var(--accent); }
  </style>
</head>
<body class="page">

<div class="page-header">
  <a class="back-link" href="../index.html">&larr; All Algorithms</a>
  <div class="page-title">Graph Valid Tree</div>
  <div class="page-sub">LeetCode 261 &middot; Union-Find: no cycles + single component &middot; O(E &middot; &alpha;(N))</div>
</div>

<div class="controls" hidden>
  <div class="input-row" hidden>
    <div class="input-field">
      <label>Nodes (n)</label>
      <input type="number" id="input-n" value="5" min="1" max="10" />
    </div>
    <div class="input-field">
      <label>Edges (e.g. 0,1;0,2;0,3;1,4)</label>
      <input type="text" id="input-edges" value="0,1;0,2;0,3;1,4" class="wide" />
    </div>
    <button class="btn-primary" onclick="buildAndRun()">Build &amp; Run</button>
  </div>
</div>

<div class="viz-area" style="display:flex;flex-direction:column;flex:1;min-height:0;">
  <div class="main-row">

    <!-- Graph -->
    <div class="graph-panel">
      <div class="panel-title">Graph</div>
      <div class="graph-svg-wrap">
        <svg id="graph-svg" viewBox="0 0 460 320" preserveAspectRatio="xMidYMid meet">
          <g id="edges-g"></g>
          <g id="nodes-g"></g>
        </svg>
      </div>
    </div>

    <!-- Right column -->
    <div class="right-col">

      <div class="panel-box">
        <div class="nav-row">
          <button class="btn-step" id="btn-back" disabled>&larr;</button>
          <button class="btn-step" id="btn-next" disabled>&rarr;</button>
          <button class="btn-play" id="btn-play" disabled>&#9654; Play</button>
          <select class="speed-select" id="speed-select">
            <option value="900">Slow</option>
            <option value="450" selected>Medium</option>
            <option value="140">Fast</option>
          </select>
        </div>
      </div>

      <div class="panel-box">
        <div class="panel-title" id="phase-label">&mdash;</div>
        <div style="font-size:0.82rem;color:var(--text-muted);min-height:36px" id="step-desc">Enter n and edges, then click Build &amp; Run.</div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Union-Find State</div>
        <div class="uf-grid" id="uf-grid">
          <span style="color:var(--text-ghost);font-size:0.78rem">not built</span>
        </div>
      </div>

      <div class="panel-box">
        <div class="result-badge pending" id="result-badge">&mdash;</div>
        <div class="result-label" id="result-label">valid tree</div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Legend</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div class="legend-row">
            <div class="legend-dot" style="background:#1a1b2e;border-color:#3b4261"></div>
            <span>Untouched</span>
          </div>
          <div class="legend-row">
            <div class="legend-dot" style="background:#2d1a3d;border-color:#bb9af7"></div>
            <span>Active edge endpoints</span>
          </div>
          <div class="legend-row">
            <div class="legend-dot" style="background:#3d1a1a;border-color:#f7768e"></div>
            <span>Cycle detected!</span>
          </div>
          <div class="legend-row">
            <div class="legend-dot" style="background:#1a2035;border-color:#7aa2f7"></div>
            <span>Just merged</span>
          </div>
          <div class="legend-row">
            <div class="legend-dot" style="background:#1a2a1a;border-color:#9ece6a"></div>
            <span>Processed / root</span>
          </div>
        </div>
      </div>

      <div class="code-panel">
        <div class="code-header">Python</div>
        <div class="code-body" id="code-body"></div>
      </div>

    </div>
  </div>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">validTree</span>(n, edges):'],
  [2,  '    par = <span class="bi">list</span>(<span class="bi">range</span>(n))'],
  [3,  '    rank = [<span class="nb">0</span>] * n'],
  [4,  ''],
  [5,  '    <span class="kw">def</span> <span class="fn">find</span>(x):'],
  [6,  '        <span class="kw">while</span> par[x] != x:'],
  [7,  '            par[x] = par[par[x]]  <span class="cm"># path compression</span>'],
  [8,  '            x = par[x]'],
  [9,  '        <span class="kw">return</span> x'],
  [10, ''],
  [11, '    <span class="kw">for</span> u, v <span class="kw">in</span> edges:'],
  [12, '        ru, rv = <span class="fn">find</span>(u), <span class="fn">find</span>(v)'],
  [13, '        <span class="kw">if</span> ru == rv: <span class="cm"># cycle!</span>'],
  [14, '            <span class="kw">return</span> <span class="nb">False</span>'],
  [15, '        <span class="kw">if</span> rank[ru] < rank[rv]:'],
  [16, '            par[ru] = rv'],
  [17, '        <span class="kw">elif</span> rank[ru] > rank[rv]:'],
  [18, '            par[rv] = ru'],
  [19, '        <span class="kw">else</span>:'],
  [20, '            par[rv] = ru; rank[ru] += <span class="nb">1</span>'],
  [21, '    <span class="kw">return</span> <span class="bi">len</span>(<span class="bi">set</span>(<span class="fn">find</span>(i) <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span>(n))) == <span class="nb">1</span>'],
];

var gN = 5;
var gEdges = [[0,1],[0,2],[0,3],[1,4]];
var gPositions = [];
var simSteps = [];
var nav;

function parseEdges(str) {
  if (!str.trim()) return [];
  return str.trim().split(';').map(function(s) {
    var parts = s.trim().split(',');
    return [parseInt(parts[0]), parseInt(parts[1])];
  }).filter(function(e) { return !isNaN(e[0]) && !isNaN(e[1]); });
}

function computePositions(n) {
  var cx = 230, cy = 160, r = 110;
  var positions = [];
  for (var i = 0; i < n; i++) {
    var angle = (2 * Math.PI * i / n) - Math.PI / 2;
    positions.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
  }
  return positions;
}

function buildAndRun() {
  var nVal = parseInt(document.getElementById('input-n').value);
  var eStr = document.getElementById('input-edges').value;
  if (isNaN(nVal) || nVal < 1 || nVal > 10) { alert('n must be 1–10'); return; }
  gN = nVal;
  gEdges = parseEdges(eStr);
  gPositions = computePositions(gN);
  simSteps = simulate(gN, gEdges);
  nav.load(simSteps);
}

// ---- Simulation ----
function simulate(n, edges) {
  var steps = [];
  var par = [];
  var rnk = [];
  for (var i = 0; i < n; i++) { par.push(i); rnk.push(0); }

  var edgeState = edges.map(function() { return 'none'; });
  var cycleDetected = false;
  var finalResult = null;

  function findRoot(x, parArr) {
    var a = x;
    while (parArr[a] !== a) { a = parArr[a]; }
    return a;
  }

  function snap(phase, desc, lines, opts) {
    opts = opts || {};
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines,
      par: par.slice(),
      rnk: rnk.slice(),
      edgeState: edgeState.slice(),
      activeNodes: opts.activeNodes || [],
      cycleNodes: opts.cycleNodes || [],
      mergedNodes: opts.mergedNodes || [],
      changedParent: opts.changedParent !== undefined ? opts.changedParent : -1,
      activeEdge: opts.activeEdge !== undefined ? opts.activeEdge : -1,
      result: opts.result !== undefined ? opts.result : null,
    });
  }

  snap('Initialize',
    'parent[i] = i for all nodes — each node is its own component. rank[i] = 0.',
    [2, 3],
    {}
  );

  for (var ei = 0; ei < edges.length; ei++) {
    var u = edges[ei][0], v = edges[ei][1];
    edgeState[ei] = 'active';

    snap('Process Edge',
      'Edge (' + u + ', ' + v + '): calling find(' + u + ') and find(' + v + ') to get their roots.',
      [11, 12],
      { activeNodes: [u, v], activeEdge: ei }
    );

    var ru = findRoot(u, par);
    var rv = findRoot(v, par);

    // apply path-halving compression
    var a = u;
    while (par[a] !== a) { var nxt = par[par[a]]; par[a] = nxt; a = nxt; }
    var b = v;
    while (par[b] !== b) { var nxt2 = par[par[b]]; par[b] = nxt2; b = nxt2; }

    if (ru === rv) {
      edgeState[ei] = 'cycle';
      cycleDetected = true;
      snap('Cycle Detected!',
        'find(' + u + ')=' + ru + ' == find(' + v + ')=' + rv + ' — same root means a cycle exists. Return False immediately.',
        [13, 14],
        { cycleNodes: [u, v], activeEdge: ei, result: false }
      );
      finalResult = false;
      break;
    } else {
      var changedIdx = -1;
      if (rnk[ru] < rnk[rv]) {
        par[ru] = rv;
        changedIdx = ru;
        snap('Union',
          'find(' + u + ')=' + ru + ', find(' + v + ')=' + rv + ' — different roots. rank[' + ru + ']<rank[' + rv + ']: par[' + ru + ']=' + rv + '.',
          [15, 16],
          { mergedNodes: [u, v, ru, rv], activeEdge: ei, changedParent: changedIdx }
        );
      } else if (rnk[ru] > rnk[rv]) {
        par[rv] = ru;
        changedIdx = rv;
        snap('Union',
          'find(' + u + ')=' + ru + ', find(' + v + ')=' + rv + ' — different roots. rank[' + ru + ']>rank[' + rv + ']: par[' + rv + ']=' + ru + '.',
          [17, 18],
          { mergedNodes: [u, v, ru, rv], activeEdge: ei, changedParent: changedIdx }
        );
      } else {
        par[rv] = ru;
        rnk[ru] += 1;
        changedIdx = rv;
        snap('Union',
          'find(' + u + ')=' + ru + ', find(' + v + ')=' + rv + ' — equal ranks. par[' + rv + ']=' + ru + ', rank[' + ru + '] → ' + rnk[ru] + '.',
          [19, 20],
          { mergedNodes: [u, v, ru, rv], activeEdge: ei, changedParent: changedIdx }
        );
      }
      edgeState[ei] = 'merged';
    }
  }

  if (!cycleDetected) {
    // Count distinct roots
    var roots = {};
    for (var i = 0; i < n; i++) { roots[findRoot(i, par)] = true; }
    var numComponents = Object.keys(roots).length;
    finalResult = numComponents === 1;
    snap('Check Connectivity',
      'No cycles found. Counting distinct roots: ' + numComponents + ' component(s). ' +
      (finalResult ? 'Exactly 1 — valid tree! Return True.' : numComponents + ' components — graph is disconnected. Return False.'),
      [21],
      { result: finalResult, activeNodes: [] }
    );
  }

  return steps;
}

// ---- Render ----
function renderGraph(snap) {
  var edgesG = document.getElementById('edges-g');
  var nodesG = document.getElementById('nodes-g');
  edgesG.innerHTML = '';
  nodesG.innerHTML = '';

  var activeSet = {};
  var cycleSet = {};
  var mergedSet = {};
  (snap.activeNodes || []).forEach(function(i) { activeSet[i] = true; });
  (snap.cycleNodes || []).forEach(function(i) { cycleSet[i] = true; });
  (snap.mergedNodes || []).forEach(function(i) { mergedSet[i] = true; });

  // Edges
  gEdges.forEach(function(e, ei) {
    var u = e[0], v = e[1];
    if (u >= gPositions.length || v >= gPositions.length) return;
    var pu = gPositions[u], pv = gPositions[v];
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pu.x); line.setAttribute('y1', pu.y);
    line.setAttribute('x2', pv.x); line.setAttribute('y2', pv.y);
    var es = snap.edgeState[ei];
    var cls = 'edge-line';
    if (ei === snap.activeEdge) {
      cls = (es === 'cycle') ? 'edge-cycle' : (es === 'merged' ? 'edge-merged' : 'edge-active');
    } else if (es === 'cycle') {
      cls = 'edge-cycle';
    } else if (es === 'merged') {
      cls = 'edge-merged';
    } else if (es === 'done') {
      cls = 'edge-done';
    }
    line.setAttribute('class', cls);
    edgesG.appendChild(line);
  });

  // Nodes
  for (var i = 0; i < gN; i++) {
    var pos = gPositions[i];
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x);
    circle.setAttribute('cy', pos.y);
    circle.setAttribute('r', 22);

    var cls = 'node-circle nc-default';
    if (cycleSet[i]) cls = 'node-circle nc-cycle';
    else if (activeSet[i]) cls = 'node-circle nc-active';
    else if (mergedSet[i]) cls = 'node-circle nc-merged';
    circle.setAttribute('class', cls);

    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x);
    text.setAttribute('y', pos.y);
    text.setAttribute('class', 'node-label');
    text.textContent = i;

    g.appendChild(circle);
    g.appendChild(text);
    nodesG.appendChild(g);
  }
}

function renderUF(snap) {
  var el = document.getElementById('uf-grid');
  var par = snap.par;
  var rnk = snap.rnk;
  var n = par.length;
  var changed = snap.changedParent;
  var cycleSet = {};
  (snap.cycleNodes || []).forEach(function(i) { cycleSet[i] = true; });
  var activeSet = {};
  (snap.activeNodes || []).forEach(function(i) { activeSet[i] = true; });

  var idxHtml = '';
  var parHtml = '';
  var rnkHtml = '';

  for (var i = 0; i < n; i++) {
    var isRoot = par[i] === i;
    var isChanged = i === changed;
    var isCycle = cycleSet[i];
    var isActive = activeSet[i];
    var parCls = 'uf-val';
    if (isCycle)      parCls += ' is-cycle';
    else if (isRoot)  parCls += ' is-root';
    if (isChanged)    parCls += ' changed';
    else if (isActive && !isCycle) parCls += ' is-active';

    idxHtml += '<div class="uf-cell"><div class="uf-val" style="background:transparent;border:none;color:var(--text-ghost)">' + i + '</div></div>';
    parHtml += '<div class="uf-cell"><div class="' + parCls + '">' + par[i] + '</div></div>';
    rnkHtml += '<div class="uf-cell"><div class="uf-val">' + rnk[i] + '</div></div>';
  }

  el.innerHTML =
    '<div class="uf-row"><div class="uf-label">index</div><div class="uf-cells">' + idxHtml + '</div></div>' +
    '<div class="uf-row"><div class="uf-label">parent[]</div><div class="uf-cells">' + parHtml + '</div></div>' +
    '<div class="uf-row"><div class="uf-label">rank[]</div><div class="uf-cells">' + rnkHtml + '</div></div>';
}

function renderResult(snap) {
  var badge = document.getElementById('result-badge');
  var label = document.getElementById('result-label');
  if (snap.result === null) {
    badge.textContent = '—';
    badge.className = 'result-badge pending';
    label.textContent = 'valid tree';
  } else if (snap.result === true) {
    badge.textContent = 'True';
    badge.className = 'result-badge true';
    label.textContent = 'valid tree ✓';
  } else {
    badge.textContent = 'False';
    badge.className = 'result-badge false';
    label.textContent = 'not a valid tree';
  }
}

function applyStep(snap) {
  renderGraph(snap);
  renderUF(snap);
  renderResult(snap);
  setCodeLines(snap.lines);
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (!el) return;
    if (lines && lines.indexOf(e[0]) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="code-line" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('btn-back'),
    btnNext: document.getElementById('btn-next'),
    btnPlay: document.getElementById('btn-play'),
    speedSel: document.getElementById('speed-select'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-label').textContent =
        'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
      document.getElementById('step-desc').textContent = snap.desc;
    }
  });
  buildAndRun();
});
</script>
