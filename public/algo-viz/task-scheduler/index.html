<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Scheduler</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-sec { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; align-self: center; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); } .var-val { color: var(--accent); font-weight: 700; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* PAGE-SPECIFIC */
  .main-row { display: grid; grid-template-columns: 240px 1fr; gap: 14px; flex: 1; min-height: 0; }
  @media (max-width: 700px) { .main-row { grid-template-columns: 1fr; } }
  .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .freq-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .freq-table { display: flex; flex-direction: column; gap: 6px; }
  .freq-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); transition: border-color 0.18s, background 0.18s; }
  .freq-row.chosen  { border-color: var(--accent); background: var(--surface-dark); }
  .freq-row.cooling { border-color: #c2410c; background: #431407; }
  .freq-row.done    { border-color: #166534; background: #052e16; opacity: 0.6; }
  .freq-letter { font-size: 1.05rem; font-weight: 700; font-family: monospace; width: 22px; text-align: center; color: var(--text-bright); }
  .freq-bar-wrap { flex: 1; height: 8px; background: var(--border-soft); border-radius: 4px; overflow: hidden; }
  .freq-bar { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.25s; }
  .freq-count { font-size: 0.8rem; font-family: monospace; color: var(--text-muted); min-width: 20px; text-align: right; }
  .cooldown-badge { font-size: 0.65rem; font-weight: 700; background: #c2410c; color: #fff; border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
  .timeline-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .timeline-header { display: flex; align-items: center; justify-content: space-between; }
  .total-time-badge { font-size: 0.78rem; font-weight: 700; font-family: monospace; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); }
  .timeline-slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); border: 2px solid var(--border-soft); font-size: 1.1rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); background: #0f0f0f; transition: background 0.18s, border-color 0.18s, color 0.18s; position: relative; }
  .slot-idx { position: absolute; bottom: 2px; right: 4px; font-size: 0.55rem; color: var(--text-ghost); font-family: monospace; }
  .slot[data-state="pending"]      { color: var(--text-ghost); border-color: var(--border-soft); background: #0f0f0f; }
  .slot[data-state="idle"]         { color: var(--text-dim); border-color: #374151; background: #111827; }
  .slot[data-state="task"]         { color: var(--text-bright); border-color: var(--accent); background: var(--surface-dark); }
  .slot[data-state="current-task"] { color: #fef08a; border-color: #ca8a04; background: #422006; }
  .slot[data-state="current-idle"] { color: var(--text-dim); border-color: #6b7280; background: #1f2937; }
  .slot[data-state="done"]         { color: #bbf7d0; border-color: #15803d; background: #14532d; }
  .formula-box { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.75rem; font-family: monospace; color: var(--text-dim); line-height: 1.6; }
  .formula-box strong { color: var(--accent); }
  .legend-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.66rem; color: var(--text-faint); }
  .legend-dot  { width: 10px; height: 10px; border-radius: 2px; border: 1px solid; }
  .inp-n { width: 60px !important; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>tasks</label>
    <input id="inp-tasks" type="text" value="AAABBB" style="width:120px" />
  </div>
  <div>
    <label>n (cooldown)</label>
    <input id="inp-n" class="inp-n" type="number" value="2" min="0" max="20" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Build &amp; Run</button>
  <button class="vi-btn-sec" onclick="loadPreset('default')">Default</button>
  <button class="vi-btn-sec" onclick="loadPreset('heavy')">Heavy A</button>
  <button class="vi-btn-sec" onclick="loadPreset('nocool')">n=0</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Task Scheduler</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Enter tasks and cooldown n, then click Build &amp; Run.</div>
    <div class="main-row">
      <div class="freq-panel">
        <div class="panel-title">Frequency Counts</div>
        <div class="freq-table" id="freq-table">
          <span style="color:var(--text-dim);font-size:0.82rem">Click Build &amp; Run.</span>
        </div>
        <div class="formula-box" id="formula-box" style="display:none"></div>
        <div class="legend-row">
          <div class="legend-item"><div class="legend-dot" style="background:var(--surface-dark);border-color:var(--accent)"></div>chosen</div>
          <div class="legend-item"><div class="legend-dot" style="background:#431407;border-color:#c2410c"></div>cooling</div>
          <div class="legend-item"><div class="legend-dot" style="background:#052e16;border-color:#166534"></div>done</div>
        </div>
      </div>
      <div class="timeline-panel">
        <div class="timeline-header">
          <div class="panel-title">Timeline Slots</div>
          <div class="total-time-badge" id="timeline-badge">— slots</div>
        </div>
        <div class="timeline-slots" id="timeline-slots">
          <span style="color:var(--text-dim);font-size:0.82rem">Build to see timeline.</span>
        </div>
        <div class="legend-row">
          <div class="legend-item"><div class="legend-dot" style="background:#422006;border-color:#ca8a04"></div>current</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--surface-dark);border-color:var(--accent)"></div>task</div>
          <div class="legend-item"><div class="legend-dot" style="background:#1f2937;border-color:#6b7280"></div>idle</div>
          <div class="legend-item"><div class="legend-dot" style="background:#14532d;border-color:#15803d"></div>done</div>
        </div>
      </div>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python &mdash; Greedy</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step" onclick="buildAndRun()">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav = null;
var totalSlots = 0;

var PRESETS = {
  'default': { tasks: 'AAABBB', n: 2 },
  'heavy':   { tasks: 'AAAABBC', n: 3 },
  'nocool':  { tasks: 'AABBCC', n: 0 },
};

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">leastInterval</span><span class="op">(</span>tasks<span class="op">,</span> n<span class="op">):</span>'],
  [2,  '    freq <span class="op">=</span> <span class="bi">Counter</span><span class="op">(</span>tasks<span class="op">)</span>'],
  [3,  '    maxFreq <span class="op">=</span> <span class="bi">max</span><span class="op">(</span>freq<span class="op">.</span><span class="fn">values</span><span class="op">())</span>'],
  [4,  '    cntMax <span class="op">=</span> <span class="bi">sum</span><span class="op">(</span><span class="nb">1</span> <span class="kw">for</span> v <span class="kw">in</span> freq<span class="op">.</span><span class="fn">values</span><span class="op">()</span> <span class="kw">if</span> v <span class="op">==</span> maxFreq<span class="op">)</span>'],
  [5,  '    <span class="kw">return</span> <span class="bi">max</span><span class="op">(</span><span class="bi">len</span><span class="op">(</span>tasks<span class="op">),</span>'],
  [6,  '               <span class="op">(</span>maxFreq <span class="op">-</span> <span class="nb">1</span><span class="op">) *</span> <span class="op">(</span>n <span class="op">+</span> <span class="nb">1</span><span class="op">) +</span> cntMax<span class="op">)</span>'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="cl"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
      var items = document.getElementById('vars-items');
      if (items) {
        items.innerHTML =
          '<div class="var-item"><span class="var-key">slot   </span><span class="var-val">' + (snap.slotsUsed || '—') + '</span></div>' +
          '<div class="var-item"><span class="var-key">chosen </span><span class="var-val">' + (snap.chosen || '—') + '</span></div>' +
          '<div class="var-item"><span class="var-key">total  </span><span class="var-val">' + (snap.totalExpected || '—') + '</span></div>';
      }
    }
  });
  buildAndRun();
});

function loadPreset(key) {
  var p = PRESETS[key];
  document.getElementById('inp-tasks').value = p.tasks;
  document.getElementById('inp-n').value = p.n;
  buildAndRun();
}

function buildAndRun() {
  var raw = document.getElementById('inp-tasks').value.trim().toUpperCase();
  var n   = parseInt(document.getElementById('inp-n').value, 10);
  if (!raw || isNaN(n) || n < 0) return;

  var tasks = raw.replace(/[^A-Z]/g, '').split('');
  if (tasks.length === 0) return;

  simSteps = simulate(tasks, n);
  totalSlots = simSteps.length > 0 ? simSteps[simSteps.length - 1].slotsUsed : 0;

  buildFreqTable(simSteps[0]);
  buildTimelineSlots(totalSlots);
  updateFormula(tasks, n);
  nav.load(simSteps);
}

function computeFreq(tasks) {
  var freq = {};
  tasks.forEach(function(t) { freq[t] = (freq[t] || 0) + 1; });
  return freq;
}

function simulate(tasks, n) {
  var steps = [];
  var freq = computeFreq(tasks);
  var maxFreq = Math.max.apply(null, Object.values(freq));
  var countMax = Object.values(freq).filter(function(v) { return v === maxFreq; }).length;
  var expected = Math.max(tasks.length, (maxFreq - 1) * (n + 1) + countMax);

  var freqCopy = Object.assign({}, freq);
  var cooldowns = {};
  var timeline = [];

  steps.push({
    phase: 'Init',
    desc: 'tasks=' + tasks.join('') + ', n=' + n + '. Formula: max(' + tasks.length + ', (' + maxFreq + '-1)×(' + n + '+1)+' + countMax + ') = ' + expected + '. Starting simulation.',
    freq: Object.assign({}, freqCopy),
    cooldowns: Object.assign({}, cooldowns),
    timeline: timeline.slice(),
    chosen: null,
    slotsUsed: 0,
    totalExpected: expected,
  });

  var remaining = tasks.length;
  var slot = 0;

  while (remaining > 0) {
    var newCooldowns = {};
    Object.keys(cooldowns).forEach(function(k) {
      if (cooldowns[k] - 1 > 0) newCooldowns[k] = cooldowns[k] - 1;
    });
    cooldowns = newCooldowns;

    var best = null, bestFreq = -1;
    Object.keys(freqCopy).forEach(function(k) {
      if (freqCopy[k] > 0 && !cooldowns[k]) {
        if (freqCopy[k] > bestFreq) {
          bestFreq = freqCopy[k];
          best = k;
        }
      }
    });

    slot++;
    if (best !== null) {
      freqCopy[best]--;
      if (freqCopy[best] > 0) {
        cooldowns[best] = n;
      }
      remaining--;
      timeline.push({ letter: best, type: 'task' });

      var freqLeft = freqCopy[best];
      var coolDesc = n > 0 ? (' Cooldown ' + best + ' for ' + n + ' slot' + (n !== 1 ? 's' : '') + '.') : '';
      steps.push({
        phase: 'Slot ' + slot,
        desc: 'Slot ' + slot + ': pick task ' + best + ' (freq ' + (freqLeft + 1) + '→' + freqLeft + ').' + coolDesc + ' Tasks left: ' + remaining + '.',
        freq: Object.assign({}, freqCopy),
        cooldowns: Object.assign({}, cooldowns),
        timeline: timeline.slice(),
        chosen: best,
        slotsUsed: slot,
        totalExpected: expected,
      });
    } else {
      timeline.push({ letter: 'idle', type: 'idle' });
      steps.push({
        phase: 'Slot ' + slot,
        desc: 'Slot ' + slot + ': all tasks in cooldown — insert IDLE. Tasks left: ' + remaining + '.',
        freq: Object.assign({}, freqCopy),
        cooldowns: Object.assign({}, cooldowns),
        timeline: timeline.slice(),
        chosen: null,
        slotsUsed: slot,
        totalExpected: expected,
      });
    }
  }

  if (steps.length > 0) {
    var last = steps[steps.length - 1];
    last.phase = 'Done';
    last.desc = 'All tasks scheduled! Total time = ' + slot + ' slots. Formula predicted: ' + expected + '.';
    last.isDone = true;
  }

  return steps;
}

function buildFreqTable(firstSnap) {
  var freq = firstSnap.freq;
  var maxF = Math.max.apply(null, Object.values(freq).concat([1]));
  var letters = Object.keys(freq).sort();
  var html = '';
  letters.forEach(function(k) {
    var pct = Math.round((freq[k] / maxF) * 100);
    html += '<div class="freq-row" id="fr-' + k + '">';
    html += '<span class="freq-letter">' + k + '</span>';
    html += '<div class="freq-bar-wrap"><div class="freq-bar" id="fb-' + k + '" style="width:' + pct + '%"></div></div>';
    html += '<span class="freq-count" id="fc-' + k + '">' + freq[k] + '</span>';
    html += '<span class="cooldown-badge" id="cd-' + k + '" style="display:none">CD</span>';
    html += '</div>';
  });
  document.getElementById('freq-table').innerHTML = html;
}

function buildTimelineSlots(total) {
  var html = '';
  for (var i = 0; i < total; i++) {
    html += '<div class="slot" id="ts-' + i + '" data-state="pending">';
    html += '<span class="slot-idx">' + (i + 1) + '</span>';
    html += '</div>';
  }
  document.getElementById('timeline-slots').innerHTML = html;
  document.getElementById('timeline-badge').textContent = total + ' slots';
}

function updateFormula(tasks, n) {
  var freq = computeFreq(tasks);
  var maxF = Math.max.apply(null, Object.values(freq));
  var cntMax = Object.values(freq).filter(function(v) { return v === maxF; }).length;
  var expected = Math.max(tasks.length, (maxF - 1) * (n + 1) + cntMax);
  var box = document.getElementById('formula-box');
  box.style.display = '';
  box.innerHTML =
    'formula: max(<strong>' + tasks.length + '</strong>, (<strong>' + maxF + '</strong>-1)×(<strong>' + n + '</strong>+1)+<strong>' + cntMax + '</strong>)\n' +
    '       = max(' + tasks.length + ', ' + ((maxF - 1) * (n + 1) + cntMax) + ') = <strong>' + expected + '</strong>';
}

function applyStep(snap) {
  updateFreqTable(snap);
  updateTimeline(snap);
}

function updateFreqTable(snap) {
  var freq = snap.freq;
  var cooldowns = snap.cooldowns;
  var chosen = snap.chosen;
  var maxF = Math.max.apply(null, Object.values(freq).concat([1]));

  Object.keys(freq).forEach(function(k) {
    var row = document.getElementById('fr-' + k);
    var bar = document.getElementById('fb-' + k);
    var cnt = document.getElementById('fc-' + k);
    var cd  = document.getElementById('cd-' + k);
    if (!row) return;

    var pct = maxF > 0 ? Math.round((freq[k] / maxF) * 100) : 0;
    if (bar) bar.style.width = pct + '%';
    if (cnt) cnt.textContent = freq[k];

    row.className = 'freq-row';
    if (freq[k] === 0) {
      row.classList.add('done');
    } else if (k === chosen) {
      row.classList.add('chosen');
      if (bar) gsap.fromTo(bar, { scaleX: 0.7 }, { scaleX: 1, duration: 0.22, ease: 'back.out(2)', transformOrigin: 'left' });
    } else if (cooldowns[k]) {
      row.classList.add('cooling');
    }

    if (cd) {
      if (cooldowns[k]) {
        cd.style.display = '';
        cd.textContent = 'CD:' + cooldowns[k];
      } else {
        cd.style.display = 'none';
      }
    }
  });
}

function updateTimeline(snap) {
  var timeline = snap.timeline;
  var currentIdx = timeline.length - 1;

  for (var i = 0; i < totalSlots; i++) {
    var el = document.getElementById('ts-' + i);
    if (!el) continue;

    if (i > currentIdx) {
      el.dataset.state = 'pending';
      el.textContent = '';
      el.insertAdjacentHTML('beforeend', '<span class="slot-idx">' + (i + 1) + '</span>');
    } else {
      var entry = timeline[i];
      var isCurrent = (i === currentIdx) && !snap.isDone;

      if (snap.isDone) {
        el.dataset.state = 'done';
      } else if (isCurrent) {
        el.dataset.state = entry.type === 'task' ? 'current-task' : 'current-idle';
      } else {
        el.dataset.state = entry.type === 'task' ? 'task' : 'idle';
      }

      var label = entry.type === 'task' ? entry.letter : '·';
      el.innerHTML = label + '<span class="slot-idx">' + (i + 1) + '</span>';

      if (isCurrent) {
        gsap.fromTo(el, { scale: 0.75 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' });
      }
    }
  }

  var curEl = document.getElementById('ts-' + currentIdx);
  if (curEl) curEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) { dragging = false; handle.classList.remove('dragging'); }
  });
})();
</script>
</body>
