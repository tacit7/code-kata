<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walls and Gates</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area {
      width: 100%; max-width: 90%;
      display: flex; flex-direction: column; gap: 12px;
    }

    .grid-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 140px;
    }

    #grid {
      display: grid;
      gap: 4px;
      user-select: none;
    }

    .cell {
      border-radius: 5px;
      box-sizing: border-box;
      border: 2px solid transparent;
      transition: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono','Fira Code',monospace;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 55% 1fr;
      gap: 12px;
      align-items: start;
    }
    .right-col { display: flex; flex-direction: column; gap: 12px; }

    @media (max-width: 680px) { .bottom-row { grid-template-columns: 1fr; } }

    .code-panel {
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .code-header {
      padding: 9px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--text-dim);
    }
    .code-body {
      padding: 10px 0;
      flex: 1;
      font-family: 'JetBrains Mono','Fira Code','Cascadia Code',monospace;
      font-size: 0.73rem;
      line-height: 1.7;
      overflow-x: auto;
    }
    .cl {
      display: flex;
      align-items: stretch;
      border-left: 3px solid transparent;
      padding: 0 14px 0 0;
      white-space: pre;
    }
    .cl .ln {
      width: 28px; min-width: 28px;
      text-align: right;
      color: #3d4468;
      user-select: none;
      padding-right: 14px;
      font-size: 0.68rem;
      line-height: 1.7;
    }
    .cl .code { color: var(--text-muted); }
    .kw  { color: var(--purple); }
    .fn  { color: var(--blue); }
    .bi  { color: var(--orange); }
    .op  { color: var(--text); }
    .cm  { color: #3d4468; font-style: italic; }
    .nb  { color: var(--green); }
    .st  { color: var(--yellow); }

    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 18px;
    }
    .panel-title {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-sub {
      font-size: 0.72rem; font-weight: 400;
      text-transform: none; letter-spacing: 0; color: var(--text-faint);
    }

    .stats-row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      font-weight: 700;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-bright);
      font-family: monospace;
      line-height: 1;
    }
    .stat-value.green { color: #9ece6a; }
    .stat-value.blue  { color: #7aa2f7; }

    .queue-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 36px;
      max-height: 120px;
      overflow-y: auto;
      align-items: flex-start;
      align-content: flex-start;
    }
    .q-chip {
      background: #0d2240;
      color: #7aa2f7;
      border: 1px solid #3b4d7a;
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: monospace;
    }
    .q-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }

    .btn-play {
      background: #15803d;
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 9px 20px;
      transition: background 0.2s;
    }
    .btn-play:hover { background: #166534; }
    .btn-play.playing { background: #c2410c; }
    .btn-play.playing:hover { background: #9a3412; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }

    .speed-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
    }

    .nav-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 90%;
    }

    textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'JetBrains Mono','Fira Code',monospace;
      font-size: 0.9rem;
      padding: 8px 11px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
      width: 100%;
      min-height: 80px;
    }
    textarea:focus { border-color: var(--accent); }

    select.preset-sel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.88rem;
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body class="page">

<div class="page-header">
  <a class="back-link" href="../index.html">&larr; All Algorithms</a>

</div>

<div class="controls">
  <div class="field">
    <label>Preset</label>
    <select class="preset-sel" id="preset-sel" onchange="loadPreset()">
      <option value="0">Default 3&times;4 &mdash; 2 gates</option>

      <option value="2">No gates (all INF)</option>

  </div>
  <div class="field" style="flex: 2; min-width: 200px;">
    <label>Grid (INF = empty room &middot; -1 = wall &middot; 0 = gate &mdash; one row per line, space-separated)</label>
    <textarea id="inp-grid">INF INF INF 0
INF 0 -1 INF
INF INF INF -1</textarea>
  </div>
  <button class="btn-primary" onclick="buildViz()">Build</button>
</div>

<div class="viz-area">
  <div class="grid-wrap">
    <div id="grid"></div>
  </div>

  <div class="status-bar" style="max-width:100%">
    <span class="phase-label" id="phase-label">&mdash;</span>

  </div>

  <div class="bottom-row">
    <div class="code-panel">
      <div class="code-header">Python &mdash; Multi-Source BFS</div>
      <div class="code-body" id="code-body"></div>
    </div>

    <div class="right-col">
      <div class="panel-box">
        <div class="panel-title">Progress</div>
        <div class="stats-row">
          <div class="stat-item">
            <div class="stat-label">Wave</div>

          </div>

        <div class="panel-title">BFS Queue <span class="panel-sub">(current wave)</span></div>

      </div>
    </div>
  </div>
</div>

<div class="legend">
  <div class="leg-item">
    <div class="leg-swatch square" style="background:#0d1a2d;border:1px solid #1a2a45"></div>INF (empty)
  </div>
  <div class="leg-item">
    <div class="leg-swatch square" style="background:#1a1e2a;border:1px solid #3d4468"></div>Wall
  </div>
  <div class="leg-item">
    <div class="leg-swatch square" style="background:#0d2b1a;border:2px solid #9ece6a"></div>Gate (0)

    <option value="700">Slow</option>
    <option value="280" selected>Medium</option>
    <option value="80">Fast</option>
  </select>
</div>

<script>
var INF = 2147483647;

// ── Presets ────────────────────────────────────────────────────────────────────
var PRESETS = [
  { grid: 'INF INF INF 0\nINF 0 -1 INF\nINF INF INF -1' },
  { grid: 'INF INF INF\nINF -1 INF\nINF INF 0' },
  { grid: 'INF INF INF\nINF INF INF\nINF INF INF' },
];

function loadPreset() {
  var idx = parseInt(document.getElementById('preset-sel').value);
  document.getElementById('inp-grid').value = PRESETS[idx].grid;
  buildViz();
}

// ── Code panel ─────────────────────────────────────────────────────────────────
var CODE = [
  [1,  '<span class="kw">from</span> collections <span class="kw">import</span> <span class="bi">deque</span>'],
  [0,  ''],
  [3,  '<span class="kw">def</span> <span class="fn">wallsAndGates</span><span class="op">(</span>rooms<span class="op">):</span>'],
  [4,  '    rows, cols <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>rooms<span class="op">),</span> <span class="bi">len</span><span class="op">(</span>rooms<span class="op">[</span><span class="nb">0</span><span class="op">])</span>'],
  [5,  '    queue <span class="op">=</span> <span class="bi">deque</span><span class="op">()</span>'],
  [6,  '    <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>rows<span class="op">):</span>'],
  [7,  '        <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>cols<span class="op">):</span>'],
  [8,  '            <span class="kw">if</span> rooms<span class="op">[</span>r<span class="op">][</span>c<span class="op">] ==</span> <span class="nb">0</span><span class="op">:</span>'],
  [9,  '                queue<span class="op">.</span><span class="fn">append</span><span class="op">((</span>r, c<span class="op">))</span>'],
  [0,  ''],
  [11, '    DIRS <span class="op">=</span> <span class="op">[(-</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),(</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),(</span><span class="nb">0</span><span class="op">,-</span><span class="nb">1</span><span class="op">),(</span><span class="nb">0</span><span class="op">,</span><span class="nb">1</span><span class="op">)]</span>'],
  [12, '    <span class="kw">while</span> queue<span class="op">:</span>'],
  [13, '        r, c <span class="op">=</span> queue<span class="op">.</span><span class="fn">popleft</span><span class="op">()</span>'],
  [14, '        <span class="kw">for</span> dr, dc <span class="kw">in</span> DIRS<span class="op">:</span>'],
  [15, '            nr, nc <span class="op">=</span> r<span class="op">+</span>dr, c<span class="op">+</span>dc'],
  [16, '            <span class="kw">if</span> <span class="op">(</span><span class="nb">0</span> <span class="op">&lt;=</span> nr <span class="op">&lt;</span> rows <span class="kw">and</span>'],
  [17, '                <span class="nb">0</span> <span class="op">&lt;=</span> nc <span class="op">&lt;</span> cols <span class="kw">and</span>'],
  [18, '                rooms<span class="op">[</span>nr<span class="op">][</span>nc<span class="op">] ==</span> INF<span class="op">):</span>'],
  [19, '                rooms<span class="op">[</span>nr<span class="op">][</span>nc<span class="op">] =</span> rooms<span class="op">[</span>r<span class="op">][</span>c<span class="op">] +</span> <span class="nb">1</span>'],
  [20, '                queue<span class="op">.</span><span class="fn">append</span><span class="op">((</span>nr, nc<span class="op">))</span>'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE.forEach(function(pair) {
    var ln = pair[0], html = pair[1];
    var row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

// ── State ──────────────────────────────────────────────────────────────────────
var ROWS = 0, COLS = 0;
var simSteps = [];

// ── Parse grid ─────────────────────────────────────────────────────────────────
function parseGrid() {
  var raw = document.getElementById('inp-grid').value.trim();
  var lines = raw.split(/\n+/).map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  if (!lines.length) return null;
  var parsed = lines.map(function(line) {
    var tokens = line.split(/[\s,]+/).filter(function(t) { return t.length > 0; });
    return tokens.map(function(t) {
      var upper = t.toUpperCase();
      if (upper === 'INF' || upper === 'I') return INF;
      var v = parseInt(t, 10);
      if (isNaN(v)) return INF;
      return v;
    });
  });
  var maxC = parsed.reduce(function(m, r) { return Math.max(m, r.length); }, 0);
  parsed = parsed.map(function(r) {
    while (r.length < maxC) r.push(INF);
    return r;
  });
  return parsed;
}

// ── Build simulation steps ─────────────────────────────────────────────────────
function buildSteps(grid) {
  var rows = grid.length, cols = grid[0].length;
  var steps = [];
  var DIRS = [[-1,0],[1,0],[0,-1],[0,1]];

  // dist[r][c]: filled distance or null (INF) or -2 (wall) or 'gate'
  var dist = grid.map(function(row) {
    return row.map(function(v) {
      if (v === -1) return 'wall';
      if (v === 0) return 'gate';
      return null; // INF
    });
  });

  var gates = [];
  var infCount = 0;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (grid[r][c] === 0) gates.push([r, c]);
      else if (grid[r][c] === INF) infCount++;
    }
  }

  var filledCount = 0;

  function snap(phase, desc, lines, qView, wave) {
    steps.push({
      phase: phase,
      desc: desc,
      lines: lines || [],
      dist: dist.map(function(row) { return row.slice(); }),
      queue: (qView || []).slice(),
      wave: wave != null ? wave : 0,
      filled: filledCount,
    });
  }

  if (gates.length === 0) {
    snap('Done', 'No gates found — all ' + infCount + ' room(s) remain INF.', [3,4,5,6,7,8], [], 0);
    return steps;
  }

  snap('Init',
    'Found ' + gates.length + ' gate(s). All gates enqueued as wave 0 sources.',
    [3,4,5,6,7,8,9],
    gates.map(function(rc) { return [rc[0], rc[1], 0]; }),
    0
  );

  var currentLevel = gates.map(function(rc) { return { r: rc[0], c: rc[1], d: 0 }; });
  var visited = {};
  gates.forEach(function(rc) { visited[rc[0]+','+rc[1]] = true; });

  while (currentLevel.length > 0) {
    var wave = currentLevel[0].d;

    // Mark current level as "expanding"
    var prevDist = dist.map(function(row) { return row.slice(); });
    currentLevel.forEach(function(node) {
      dist[node.r][node.c] = 'current';
    });

    snap('BFS',
      'Wave ' + wave + ': dequeuing ' + currentLevel.length + ' cell(s). Checking 4 neighbors for unvisited INF rooms.',
      [12,13,14,15,16,17,18],
      currentLevel.map(function(node) { return [node.r, node.c, node.d]; }),
      wave
    );

    var nextLevel = [];
    currentLevel.forEach(function(node) {
      DIRS.forEach(function(d) {
        var nr = node.r + d[0], nc = node.c + d[1];
        var key = nr + ',' + nc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols
            && grid[nr][nc] === INF
            && !visited[key]) {
          visited[key] = true;
          nextLevel.push({ r: nr, c: nc, d: node.d + 1 });
        }
      });
    });

    // Restore current level back to their filled values
    currentLevel.forEach(function(node) {
      dist[node.r][node.c] = prevDist[node.r][node.c];
    });

    if (nextLevel.length > 0) {
      filledCount += nextLevel.length;

      nextLevel.forEach(function(node) {
        dist[node.r][node.c] = 'filling';
        grid[node.r][node.c] = node.d;
      });

      snap('BFS',
        nextLevel.length + ' room(s) filled with distance ' + nextLevel[0].d + '. ' + filledCount + ' of ' + infCount + ' rooms filled.',
        [19, 20],
        nextLevel.map(function(node) { return [node.r, node.c, node.d]; }),
        nextLevel[0].d
      );

      nextLevel.forEach(function(node) {
        dist[node.r][node.c] = node.d;
      });
    }

    currentLevel = nextLevel;
  }

  var remaining = infCount - filledCount;
  snap('Done',
    remaining > 0
      ? 'BFS complete. ' + filledCount + ' room(s) filled. ' + remaining + ' room(s) unreachable (stay INF).'
      : 'BFS complete. All ' + infCount + ' room(s) filled with shortest distances to a gate.',
    [12],
    [],
    currentLevel.length > 0 ? currentLevel[0].d : 0
  );

  return steps;
}

// ── Grid shell ─────────────────────────────────────────────────────────────────
function renderGridShell() {
  var container = document.getElementById('grid');
  var maxW = container.parentElement.clientWidth - 40;
  var cellSize = Math.max(36, Math.min(80, Math.floor(maxW / COLS) - 4));
  container.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellSize + 'px)';
  container.innerHTML = '';

  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-' + r + '-' + c;
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = Math.max(0.55, Math.min(0.85, cellSize / 60)) + 'rem';
      container.appendChild(cell);
    }
  }
}

// ── Cell colors ────────────────────────────────────────────────────────────────
var CELL_STYLES = {
  wall:    { bg: '#1a1e2a', border: '#3d4468', text: '#4d5580', label: '#' },
  gate:    { bg: '#0d2b1a', border: '#9ece6a', text: '#9ece6a', label: '0' },
  current: { bg: '#7aa2f7', border: '#ffffff', text: '#0a0d14', label: null },
  filling: { bg: '#1a3560', border: '#7aa2f7', text: '#7aa2f7', label: null },
  null:    { bg: '#0d1a2d', border: '#1a2a45', text: '#3d5070', label: 'INF' },
};

function getNumStyle(d) {
  var intensity = Math.max(0, Math.min(1, 1 - d / 10));
  var r = Math.round(13 + intensity * 109);
  var g = Math.round(53 + intensity * 109);
  var b = Math.round(96 + intensity * 71);
  return { bg: 'rgb(' + r + ',' + g + ',' + b + ')', border: '#7aa2f7', text: '#c0d4ff' };
}

function applyCellDist(r, c, dv, animate) {
  var el = document.getElementById('cell-' + r + '-' + c);
  if (!el) return;
  var style, label;
  if (dv === 'wall') {
    style = CELL_STYLES.wall; label = '#';
  } else if (dv === 'gate') {
    style = CELL_STYLES.gate; label = '0';
  } else if (dv === 'current') {
    style = CELL_STYLES.current; label = null;
  } else if (dv === 'filling') {
    style = CELL_STYLES.filling; label = null;
  } else if (dv === null) {
    style = CELL_STYLES['null']; label = 'INF';
  } else {
    style = getNumStyle(dv); label = String(dv);
  }
  if (label === null) label = '';
  if (animate) {
    gsap.to(el, { backgroundColor: style.bg, borderColor: style.border, color: style.text, duration: 0.18, ease: 'power2.out' });
    el.textContent = label;
  } else {
    el.style.backgroundColor = style.bg;
    el.style.borderColor = style.border;
    el.style.color = style.text;
    el.textContent = label;
  }
}

function applyStep(s, animate) {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      applyCellDist(r, c, s.dist[r][c], animate);
    }
  }
  renderQueue(s.queue);
  document.getElementById('wave-display').textContent = s.wave != null ? s.wave : '—';
  var fEl = document.getElementById('filled-display');
  fEl.textContent = s.filled != null ? s.filled : '—';
  setCodeLines(s.lines || []);
}

// ── Queue display ──────────────────────────────────────────────────────────────
function renderQueue(queue) {
  var container = document.getElementById('queue-items');
  container.innerHTML = '';
  if (!queue || queue.length === 0) {
    container.innerHTML = '<span class="q-empty">empty</span>';
    return;
  }
  queue.forEach(function(node) {
    var chip = document.createElement('div');
    chip.className = 'q-chip';
    chip.textContent = '(' + node[0] + ',' + node[1] + ')';
    if (node[2] != null) chip.title = 'd=' + node[2];
    container.appendChild(chip);
  });
}

// ── Code highlighting ──────────────────────────────────────────────────────────
var HL_BG = 'rgba(122,162,247,0.12)';
var prevLines = [];

function setCodeLines(newLines) {
  prevLines.forEach(function(n) {
    if (newLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = '';
      el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  newLines.forEach(function(n) {
    if (prevLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = HL_BG;
      el.style.borderLeftColor = 'var(--accent)';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--accent)';
    }
  });
  if (newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  prevLines = newLines.slice();
}

// ── Build viz ──────────────────────────────────────────────────────────────────
function buildViz() {
  nav.stopPlay();
  var grid = parseGrid();
  if (!grid) {
    document.getElementById('step-desc').textContent = 'Could not parse grid. Use INF/-1/0 per cell, one row per line.';
    return;
  }
  ROWS = grid.length;
  COLS = grid[0].length;
  simSteps = buildSteps(grid);
  renderGridShell();
  prevLines = [];
  document.getElementById('wave-display').textContent = '—';
  document.getElementById('filled-display').textContent = '—';
  document.getElementById('queue-items').innerHTML = '<span class="q-empty">not started</span>';
  nav.load(simSteps);
}

// ── VizNav ─────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev: document.getElementById('btn-prev'),
  btnNext: document.getElementById('btn-next'),
  btnPlay: document.getElementById('btn-play'),
  speedSel: document.getElementById('speed'),
  render: function(s, cur, total) {
    applyStep(s, cur > 0);
    var phaseEl = document.getElementById('phase-label');
    var descEl  = document.getElementById('step-desc');
    if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  \xb7  ' + s.phase;
    if (descEl)  descEl.textContent  = s.desc;
  }
});

window.addEventListener('resize', function() { if (ROWS > 0) renderGridShell(); });

buildCodePanel();
buildViz();
</script>

<script>
if (window.self !== window.top) {
  var bl = document.querySelector('.back-link');
  if (bl) bl.style.display = 'none';
}
</script>
