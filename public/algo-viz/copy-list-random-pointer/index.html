<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>138. Copy List with Random Pointer</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    body { display:flex; flex-direction:column; height:100vh; overflow:hidden; margin:0; }
    .page-title {
      font-size:1rem; font-weight:700; color:var(--text-bright);
      padding:10px 16px 0; letter-spacing:0.01em; flex-shrink:0;
    }
    .viz-root {
      display:flex; flex:1; gap:12px;
      padding:8px 16px 12px; min-height:0;
    }
    .left-col { display:flex; flex-direction:column; gap:10px; flex:0 0 58%; min-width:0; }
    .right-col { display:flex; flex-direction:column; gap:10px; flex:1; min-width:0; }

    /* node list area */
    .list-area {
      position:relative; flex:1; min-height:0;
      display:flex; flex-direction:column; justify-content:center;
    }
    .list-label {
      font-size:0.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.09em; color:var(--text-dim); margin-bottom:4px;
    }
    .node-row {
      display:flex; align-items:center; gap:0; flex-wrap:nowrap;
      position:relative; min-height:60px;
    }
    .node-box {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:62px; height:56px; border-radius:8px; flex-shrink:0;
      border:2px solid var(--border); background:var(--surface-dark);
      color:var(--text-muted); position:relative; transition:border-color 0.15s, background 0.15s;
      cursor:default;
    }
    .node-box .nval { font-size:1rem; font-weight:700; color:var(--text-bright); line-height:1; }
    .node-box .nrnd {
      font-size:0.5rem; color:var(--text-ghost); margin-top:2px;
      font-family:monospace; letter-spacing:0.03em;
    }
    .node-box.active-orig { border-color:var(--accent); background:rgba(var(--accent-ch),0.12); }
    .node-box.active-copy { border-color:var(--green); background:rgba(var(--green-ch),0.12); }
    .node-box.new-copy { border-color:var(--blue); background:rgba(var(--blue-ch),0.15); }
    .node-box.rnd-wired { border-color:var(--green); background:rgba(var(--green-ch),0.09); }
    .node-box.ghost { opacity:0.22; border-style:dashed; }

    .next-arrow { color:var(--text-ghost); font-size:0.85rem; width:14px; text-align:center; flex-shrink:0; }
    .null-end { font-size:0.68rem; color:var(--text-ghost); font-family:monospace; padding:0 4px; }

    /* SVG overlay for random arrows */
    .svg-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible; }

    /* map panel */
    .map-panel { display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; overflow-y:auto; }
    .map-row {
      display:flex; align-items:center; gap:6px;
      padding:4px 8px; border-radius:6px;
      border:1px solid var(--border); background:var(--surface-dark);
      font-size:0.75rem; transition:background 0.15s, border-color 0.15s;
    }
    .map-row.active-lookup { border-color:var(--accent); background:rgba(var(--accent-ch),0.12); }
    .map-row .map-orig { color:var(--text-muted); font-family:monospace; }
    .map-row .map-arr  { color:var(--text-ghost); }
    .map-row .map-copy { color:var(--blue); font-family:monospace; font-weight:600; }

    /* phase + annotation */
    .phase-banner {
      font-size:0.72rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.1em; padding:3px 10px; border-radius:4px; display:inline-block;
    }
    .phase-banner.init  { color:var(--text-muted); background:var(--surface-dark); border:1px solid var(--border); }
    .phase-banner.pass1 { color:var(--blue); background:rgba(var(--blue-ch),0.1); border:1px solid rgba(var(--blue-ch),0.25); }
    .phase-banner.pass2 { color:var(--green); background:rgba(var(--green-ch),0.1); border:1px solid rgba(var(--green-ch),0.25); }
    .phase-banner.done  { color:var(--accent); background:rgba(var(--accent-ch),0.1); border:1px solid rgba(var(--accent-ch),0.25); }

    .annotation { font-size:0.76rem; color:var(--text-muted); line-height:1.5; margin-top:6px; }
    .step-counter { font-size:0.65rem; color:var(--text-dim); margin-top:4px; }

    /* controls inside .controls (hidden by bridge) */
    .ctrl-row { display:flex; align-items:center; gap:6px; }
    .btn { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:0.78rem; }
    .btn:hover { border-color:var(--accent); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .speed-sel { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 6px; font-size:0.75rem; }

    /* viz-inputs visible */
    .viz-inputs { padding:6px 0 8px; flex-shrink:0; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
    .vi-group { display:flex; flex-direction:column; gap:3px; }
    .vi-label { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); }
    .vi-sel, .vi-input { background:var(--surface-dark); color:var(--text-main); border:1px solid var(--border); border-radius:6px; padding:5px 9px; font-size:0.8rem; }
    .vi-sel { min-width:200px; }
    .vi-input { width:260px; font-family:monospace; }
    .vi-btn { padding:6px 16px; border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.82rem; }
    .vi-btn.run { background:var(--accent); color:#fff; }
    .vi-btn.rnd { background:var(--surface-dark); color:var(--text-main); border:1px solid var(--border); }

    /* left column split */
    .list-wrapper { display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; position:relative; }
    .divider-h { height:1px; background:var(--border-soft); flex-shrink:0; }
  </style>
</head>
<body>

<div class="page-title">138. Copy List with Random Pointer</div>

<div class="viz-inputs">
  <div class="vi-group">
    <label class="vi-label">Preset</label>
    <select class="vi-sel" id="presetSel" onchange="loadPreset()">
      <option value="0">Single node, self-random [[7,0]]</option>
      <option value="1">Two nodes, cross-random [[1,1],[2,0]]</option>
      <option value="2" selected>LeetCode canonical [[7,null],[13,0],[11,4],[10,2],[1,0]]</option>
      <option value="3">All-null randoms [[3,null],[3,null],[3,null]]</option>
      <option value="4">All point to head [[1,0],[2,0],[3,0],[4,0]]</option>
      <option value="5">Linear chain [[1,1],[2,2],[3,3],[4,null]]</option>
    </select>
  </div>
  <div class="vi-group">
    <label class="vi-label">Input [[val,rndIdx],...]</label>
    <input class="vi-input" id="listInput" type="text" value="[[7,null],[13,0],[11,4],[10,2],[1,0]]" />
  </div>
  <button class="vi-btn run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn rnd" onclick="randomExample()">🎲 Random</button>
</div>

<div class="viz-root">

  <!-- LEFT COLUMN: original + copy lists -->
  <div class="left-col">
    <div class="panel-box" style="display:flex;flex-direction:column;flex:1;min-height:0;">
      <div class="panel-title">Lists</div>
      <div class="list-wrapper">
        <div>
          <div class="list-label">Original</div>
          <div class="node-row" id="orig-row"></div>
        </div>
        <div class="divider-h"></div>
        <div>
          <div class="list-label">Copy</div>
          <div class="node-row" id="copy-row"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: map + status -->
  <div class="right-col">
    <div class="panel-box" style="flex-shrink:0;">
      <div class="panel-title">Status</div>
      <span class="phase-banner init" id="phaseBanner">📋 Init</span>
      <div class="annotation" id="annotation">Load a preset or enter input and press Run.</div>
      <div class="step-counter" id="stepCounter">Step 0 / 0</div>
    </div>
    <div class="panel-box" style="flex:1;min-height:0;display:flex;flex-direction:column;">
      <div class="panel-title">Hash Map  <span style="font-weight:400;color:var(--text-ghost);font-size:0.7rem;">original id → copy id</span></div>
      <div class="map-panel" id="mapPanel"></div>
    </div>
  </div>
</div>

<!-- VizNav controls (hidden by iframe bridge) -->
<div class="controls" style="display:none;">
  <button id="prevBtn">Prev</button>
  <button id="stepBtn">Step</button>
  <button id="playBtn">Play</button>
  <button id="resetBtn">Reset</button>
  <select id="speedSel">
    <option value="1400">Slow</option>
    <option value="800" selected>Normal</option>
    <option value="380">Fast</option>
  </select>
</div>

<script>
// ── Presets ───────────────────────────────────────────────────────────────
var PRESETS = [
  [[7, 0]],
  [[1, 1], [2, 0]],
  [[7, null], [13, 0], [11, 4], [10, 2], [1, 0]],
  [[3, null], [3, null], [3, null]],
  [[1, 0], [2, 0], [3, 0], [4, 0]],
  [[1, 1], [2, 2], [3, 3], [4, null]],
];

// ── Build steps ───────────────────────────────────────────────────────────
function buildSteps(nodeList) {
  var steps = [];
  var n = nodeList.length;

  if (n === 0) {
    steps.push({
      phase: "done",
      originalNodes: [], copyNodes: [], mapEntries: [],
      activeOrigId: null, activeCopyId: null, highlightedArrow: null,
      annotation: "Empty list — nothing to copy.",
      phaseBanner: "✅ Done", phaseCls: "done",
    });
    return steps;
  }

  // Build original node descriptors
  function makeOrigNodes(activeOrigId, activeCopyId, copyExistsSet, copyNextSet, copyRndSet, mapHighlight) {
    return nodeList.map(function(item, i) {
      return { id: i, val: item[0], nextId: i + 1 < n ? i + 1 : null, randomId: item[1] };
    });
  }

  function makeCopyNodes(copyExistsSet, copyNextSet, copyRndSet) {
    return nodeList.map(function(item, i) {
      var exists = copyExistsSet.has(i);
      return {
        id: i, val: item[0],
        nextId: copyNextSet.has(i) ? (i + 1 < n ? i + 1 : null) : null,
        randomId: copyRndSet.has(i) ? item[1] : undefined,
        exists: exists,
      };
    });
  }

  function snap(phase, phaseBanner, phaseCls, annotation, activeOrigId, activeCopyId, copyExistsSet, copyNextSet, copyRndSet, mapEntries, highlightedArrow, mapHighlight) {
    return {
      phase: phase,
      phaseBanner: phaseBanner,
      phaseCls: phaseCls,
      annotation: annotation,
      originalNodes: makeOrigNodes(activeOrigId, activeCopyId, copyExistsSet, copyNextSet, copyRndSet, mapHighlight),
      copyNodes: makeCopyNodes(copyExistsSet, copyNextSet, copyRndSet),
      mapEntries: mapEntries.map(function(e, i) {
        return { origId: e.origId, copyId: e.copyId, highlighted: mapHighlight === i };
      }),
      activeOrigId: activeOrigId,
      activeCopyId: activeCopyId,
      highlightedArrow: highlightedArrow || null,
    };
  }

  var copyExists = new Set();
  var copyNext   = new Set();
  var copyRnd    = new Set();
  var mapEntries = [];

  // Step 0: init
  steps.push(snap("init", "📋 Original List", "init",
    "Original list loaded. We will deep-copy it in two passes.",
    null, null, copyExists, copyNext, copyRnd, mapEntries, null, -1));

  // Pass 1a: create all copies + populate map
  steps.push(snap("pass1", "🔵 Pass 1: Create Copies", "pass1",
    "Pass 1 begins: walk original list and create a copy of each node.",
    null, null, copyExists, copyNext, copyRnd, mapEntries, null, -1));

  for (var i = 0; i < n; i++) {
    var val = nodeList[i][0];
    // Visit original node
    steps.push(snap("pass1", "🔵 Pass 1: Create Copies", "pass1",
      "Visit node [" + val + "] (id=" + i + "). Create a copy.",
      i, null, copyExists, copyNext, copyRnd, mapEntries, null, -1));

    // Create copy + add to map
    copyExists.add(i);
    mapEntries = mapEntries.concat([{ origId: i, copyId: i }]);
    steps.push(snap("pass1", "🔵 Pass 1: Create Copies", "pass1",
      "Created copy[" + val + "]. Added to map: orig[" + i + "] → copy[" + i + "].",
      i, i, new Set(copyExists), copyNext, copyRnd, mapEntries, null, mapEntries.length - 1));
  }

  // Pass 1b: wire copy.next for all
  steps.push(snap("pass1", "🔵 Pass 1: Wire .next", "pass1",
    "All copies created. Now wire copy.next pointers using the map.",
    null, null, new Set(copyExists), copyNext, copyRnd, mapEntries, null, -1));

  for (var i = 0; i < n; i++) {
    var val = nodeList[i][0];
    var nextId = i + 1 < n ? i + 1 : null;
    var nextVal = nextId !== null ? nodeList[nextId][0] : null;
    copyNext.add(i);
    var arrow = nextId !== null ? { type: "next", fromId: i, toId: nextId, isCopy: true } : null;
    steps.push(snap("pass1", "🔵 Pass 1: Wire .next", "pass1",
      nextId !== null
        ? "Wire copy[" + val + "].next = copy[" + nextVal + "] (id=" + nextId + ")."
        : "copy[" + val + "].next = null (last node).",
      null, i, new Set(copyExists), new Set(copyNext), copyRnd, mapEntries, arrow, -1));
  }

  // Pass 2: wire random pointers
  steps.push(snap("pass2", "🟢 Pass 2: Wire Randoms", "pass2",
    "Pass 2 begins: walk original list and wire copy.random from the map.",
    null, null, new Set(copyExists), new Set(copyNext), copyRnd, mapEntries, null, -1));

  for (var i = 0; i < n; i++) {
    var val = nodeList[i][0];
    var rndIdx = nodeList[i][1];

    // (a) Visit orig, show its random arrow
    steps.push(snap("pass2", "🟢 Pass 2: Wire Randoms", "pass2",
      rndIdx !== null
        ? "Visit node [" + val + "]. orig.random → node[" + nodeList[rndIdx][0] + "] (id=" + rndIdx + ")."
        : "Visit node [" + val + "]. orig.random = null.",
      i, null, new Set(copyExists), new Set(copyNext), new Set(copyRnd), mapEntries,
      rndIdx !== null ? { type: "random", fromId: i, toId: rndIdx, isCopy: false } : null,
      -1));

    if (rndIdx !== null) {
      // (b) Highlight map row for lookup
      var mapIdx = rndIdx; // mapEntries[rndIdx].origId === rndIdx
      steps.push(snap("pass2", "🟢 Pass 2: Wire Randoms", "pass2",
        "Look up map[" + rndIdx + "]: orig[" + rndIdx + "] → copy[" + rndIdx + "].",
        i, null, new Set(copyExists), new Set(copyNext), new Set(copyRnd), mapEntries,
        { type: "random", fromId: i, toId: rndIdx, isCopy: false },
        mapIdx));
    }

    // (c) Wire copy.random
    copyRnd.add(i);
    steps.push(snap("pass2", "🟢 Pass 2: Wire Randoms", "pass2",
      rndIdx !== null
        ? "Set copy[" + val + "].random = copy[" + nodeList[rndIdx][0] + "] (from map)."
        : "copy[" + val + "].random = null.",
      null, i, new Set(copyExists), new Set(copyNext), new Set(copyRnd), mapEntries,
      rndIdx !== null ? { type: "random", fromId: i, toId: rndIdx, isCopy: true } : null,
      rndIdx !== null ? rndIdx : -1));
  }

  // Done
  steps.push(snap("done", "✅ Deep Copy Complete", "done",
    "Deep copy complete! Both lists are independent — no shared nodes.",
    null, null, new Set(copyExists), new Set(copyNext), new Set(copyRnd), mapEntries, null, -1));

  return steps;
}

// ── DOM refs ──────────────────────────────────────────────────────────────
var origRow     = document.getElementById("orig-row");
var copyRow     = document.getElementById("copy-row");
var mapPanel    = document.getElementById("mapPanel");
var phaseBanner = document.getElementById("phaseBanner");
var annotEl     = document.getElementById("annotation");
var counterEl   = document.getElementById("stepCounter");

// ── Render helpers ────────────────────────────────────────────────────────
function renderNodeRow(container, nodes, activeOrigId, activeCopyId, isCopy, snap) {
  container.innerHTML = "";
  var n = nodes.length;
  if (n === 0) {
    var emp = document.createElement("div");
    emp.className = "null-end"; emp.textContent = "(empty)";
    container.appendChild(emp); return;
  }
  nodes.forEach(function(node, i) {
    // Build node box
    var box = document.createElement("div");
    box.className = "node-box";
    box.id = (isCopy ? "copy-" : "orig-") + node.id;

    if (isCopy && !node.exists) {
      box.classList.add("ghost");
    } else if (!isCopy && node.id === activeOrigId) {
      box.classList.add("active-orig");
    } else if (isCopy && node.id === activeCopyId && node.exists) {
      var phase = snap.phase;
      if (phase === "pass1" && phaseBanner.textContent.indexOf("Wire") >= 0) {
        box.classList.add("active-copy");
      } else if (phase === "pass1") {
        box.classList.add("new-copy");
      } else if (phase === "pass2") {
        box.classList.add("rnd-wired");
      } else {
        box.classList.add("active-copy");
      }
    } else if (snap.phase === "pass1" && isCopy && node.id === activeCopyId) {
      box.classList.add("new-copy");
    }

    var valEl = document.createElement("div");
    valEl.className = "nval"; valEl.textContent = node.val;
    box.appendChild(valEl);

    // Show random label
    if (isCopy && node.exists) {
      var rndEl = document.createElement("div");
      rndEl.className = "nrnd";
      if (node.randomId !== undefined) {
        rndEl.textContent = node.randomId !== null ? "rnd:" + node.randomId : "rnd:null";
      } else {
        rndEl.textContent = "rnd:?";
      }
      box.appendChild(rndEl);
    } else if (!isCopy) {
      var rndEl = document.createElement("div");
      rndEl.className = "nrnd";
      rndEl.textContent = node.randomId !== null ? "rnd:" + node.randomId : "rnd:null";
      box.appendChild(rndEl);
    }

    container.appendChild(box);

    // next arrow
    if (i < n - 1) {
      var arr = document.createElement("div");
      arr.className = "next-arrow"; arr.textContent = "→";
      container.appendChild(arr);
    } else {
      var nullEnd = document.createElement("div");
      nullEnd.className = "null-end"; nullEnd.textContent = "→null";
      container.appendChild(nullEnd);
    }
  });
}

function drawRandomArrows(container, nodes, snap, isCopy) {
  // Remove existing SVG
  var existingSvg = container.parentElement.querySelector(".svg-overlay");
  if (existingSvg) existingSvg.remove();

  // Get node positions
  var boxes = Array.from(container.querySelectorAll(".node-box"));
  if (boxes.length === 0) return;

  var containerRect = container.getBoundingClientRect();
  var n = nodes.length;

  // Compute centers
  var centers = boxes.map(function(b) {
    var r = b.getBoundingClientRect();
    return {
      x: r.left - containerRect.left + r.width / 2,
      y: r.top  - containerRect.top  + r.height / 2,
      w: r.width, h: r.height,
    };
  });

  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "svg-overlay");
  svg.style.position = "absolute";
  svg.style.top = "0"; svg.style.left = "0";
  svg.style.width = containerRect.width + "px";
  svg.style.height = containerRect.height + 60 + "px"; // extra space for arcs
  svg.style.overflow = "visible";
  svg.style.pointerEvents = "none";

  // Arrow marker
  var defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  function mkMarker(id, color) {
    var m = document.createElementNS("http://www.w3.org/2000/svg", "marker");
    m.setAttribute("id", id); m.setAttribute("markerWidth", "7"); m.setAttribute("markerHeight", "7");
    m.setAttribute("refX", "6"); m.setAttribute("refY", "3.5"); m.setAttribute("orient", "auto");
    var poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", "0 0, 7 3.5, 0 7"); poly.setAttribute("fill", color);
    m.appendChild(poly); return m;
  }
  defs.appendChild(mkMarker("arr-blue",  "var(--blue)"));
  defs.appendChild(mkMarker("arr-green", "var(--green)"));
  defs.appendChild(mkMarker("arr-dim",   "var(--text-ghost)"));
  svg.appendChild(defs);

  var color = isCopy ? "var(--green)" : "var(--blue)";
  var markerId = isCopy ? "arr-green" : "arr-blue";

  // Determine which random arrows to draw
  // For original: always draw all
  // For copy: only draw nodes where randomId is defined (wired)
  var highlightedArrow = snap.highlightedArrow;

  nodes.forEach(function(node, i) {
    var rndIdx = null;
    if (!isCopy) {
      rndIdx = node.randomId;
    } else {
      if (node.exists && node.randomId !== undefined && node.randomId !== null) {
        rndIdx = node.randomId;
      }
    }
    if (rndIdx === null || rndIdx === undefined) return;

    var fromC = centers[i];
    var toC   = centers[rndIdx];
    if (!fromC || !toC) return;

    var isHighlighted = highlightedArrow &&
      highlightedArrow.type === "random" &&
      highlightedArrow.fromId === node.id &&
      highlightedArrow.isCopy === isCopy;

    var strokeColor = isHighlighted ? (isCopy ? "var(--green)" : "var(--accent)") : color;
    var arrowMarker = isHighlighted ? (isCopy ? "arr-green" : "arr-blue") : markerId;
    var strokeW = isHighlighted ? 2.2 : 1.5;
    var opacity = isHighlighted ? 1 : 0.55;

    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("stroke", strokeColor);
    path.setAttribute("stroke-width", strokeW);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke-dasharray", "5 3");
    path.setAttribute("opacity", opacity);
    path.setAttribute("marker-end", "url(#" + arrowMarker + ")");

    var x1 = fromC.x, y1 = fromC.y - fromC.h / 2;
    var x2 = toC.x,   y2 = toC.y   - toC.h / 2;

    if (i === rndIdx) {
      // Self-loop: small circle above the node
      var cx = fromC.x;
      var cy = fromC.y - fromC.h / 2;
      var r  = 16;
      var d  = "M " + (cx - 4) + " " + cy +
               " C " + (cx - 24) + " " + (cy - 38) +
               ", " + (cx + 24) + " " + (cy - 38) +
               ", " + (cx + 4)  + " " + cy;
      path.setAttribute("d", d);
    } else {
      // Arc above the row (upward)
      var midX = (x1 + x2) / 2;
      var dx   = Math.abs(x2 - x1);
      var arcH = Math.max(28, dx * 0.38);
      // Stagger arcs by index to reduce overlap
      arcH += (i % 3) * 10;
      var controlY = Math.min(y1, y2) - arcH;
      var d = "M " + x1 + " " + y1 +
              " Q " + midX + " " + controlY +
              ", " + (x2 + (i < rndIdx ? -4 : 4)) + " " + y2;
      path.setAttribute("d", d);
    }

    svg.appendChild(path);
  });

  container.style.position = "relative";
  container.appendChild(svg);
}

// ── Map panel render ──────────────────────────────────────────────────────
function renderMap(mapEntries) {
  mapPanel.innerHTML = "";
  if (mapEntries.length === 0) {
    var empty = document.createElement("div");
    empty.style.cssText = "font-size:0.72rem;color:var(--text-ghost);padding:6px;";
    empty.textContent = "(empty)";
    mapPanel.appendChild(empty);
    return;
  }
  mapEntries.forEach(function(e, i) {
    var row = document.createElement("div");
    row.className = "map-row" + (e.highlighted ? " active-lookup" : "");
    var origSpan = document.createElement("span");
    origSpan.className = "map-orig";
    origSpan.textContent = "orig[" + e.origId + "]";
    var arrSpan = document.createElement("span");
    arrSpan.className = "map-arr"; arrSpan.textContent = "→";
    var copySpan = document.createElement("span");
    copySpan.className = "map-copy";
    copySpan.textContent = "copy[" + e.copyId + "]";
    row.appendChild(origSpan); row.appendChild(arrSpan); row.appendChild(copySpan);
    mapPanel.appendChild(row);
  });
}

// ── Main render ───────────────────────────────────────────────────────────
function render(snap, cursor, total) {
  // Phase banner
  phaseBanner.textContent = snap.phaseBanner;
  phaseBanner.className = "phase-banner " + snap.phaseCls;

  // Annotation
  annotEl.textContent = snap.annotation;
  counterEl.textContent = "Step " + (cursor + 1) + " / " + total;

  // Render original list
  renderNodeRow(origRow, snap.originalNodes, snap.activeOrigId, snap.activeCopyId, false, snap);
  // Render copy list
  renderNodeRow(copyRow, snap.copyNodes, snap.activeOrigId, snap.activeCopyId, true, snap);

  // Draw random arrows (after DOM layout)
  requestAnimationFrame(function() {
    drawRandomArrows(origRow, snap.originalNodes, snap, false);
    drawRandomArrows(copyRow, snap.copyNodes, snap, true);
  });

  // Map
  renderMap(snap.mapEntries);
}

// ── VizNav wiring ─────────────────────────────────────────────────────────
var btnPrev  = document.getElementById("prevBtn");
var btnStep  = document.getElementById("stepBtn");
var btnPlay  = document.getElementById("playBtn");
var btnReset = document.getElementById("resetBtn");
var speedSel = document.getElementById("speedSel");

var nav = VizNav({ btnPrev: btnPrev, btnNext: btnStep, btnPlay: btnPlay, speedSel: speedSel, render: render });

// ── Input / presets ───────────────────────────────────────────────────────
var PRESET_STRS = [
  "[[7,0]]",
  "[[1,1],[2,0]]",
  "[[7,null],[13,0],[11,4],[10,2],[1,0]]",
  "[[3,null],[3,null],[3,null]]",
  "[[1,0],[2,0],[3,0],[4,0]]",
  "[[1,1],[2,2],[3,3],[4,null]]",
];

function loadPreset() {
  var idx = parseInt(document.getElementById("presetSel").value);
  document.getElementById("listInput").value = PRESET_STRS[idx];
  buildAndRun();
}

function buildAndRun() {
  var raw = document.getElementById("listInput").value.trim();
  var nodeList;
  try { nodeList = JSON.parse(raw); } catch(e) { annotEl.textContent = "Invalid JSON input."; return; }
  if (!Array.isArray(nodeList)) { annotEl.textContent = "Input must be a JSON array."; return; }
  var n = nodeList.length;
  for (var i = 0; i < n; i++) {
    if (!Array.isArray(nodeList[i]) || nodeList[i].length !== 2) {
      annotEl.textContent = "Each entry must be [val, randomIdx]."; return;
    }
    var rndIdx = nodeList[i][1];
    if (rndIdx !== null && (typeof rndIdx !== "number" || rndIdx < 0 || rndIdx >= n)) {
      annotEl.textContent = "randomIdx " + rndIdx + " is out of range (0–" + (n-1) + ") or not null."; return;
    }
  }
  var steps = buildSteps(nodeList);
  nav.load(steps);
}

function randomExample() {
  var n = Math.floor(Math.random() * 4) + 2;
  var nodes = [];
  for (var i = 0; i < n; i++) {
    var val = Math.floor(Math.random() * 20) + 1;
    var rndIdx = Math.random() < 0.25 ? null : Math.floor(Math.random() * n);
    nodes.push([val, rndIdx]);
  }
  document.getElementById("listInput").value = JSON.stringify(nodes);
  document.getElementById("presetSel").value = "";
  buildAndRun();
}

// ── Auto-load ─────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", function() {
  loadPreset();
});
</script>
