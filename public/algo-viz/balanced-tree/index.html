<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balanced Binary Tree</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area {
      width: 100%; max-width: 90%;
      display: flex; flex-direction: column; gap: 12px;
    }

    .tree-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    #tree-svg { display: block; width: 100%; }

    .bottom-row {
      display: grid;
      grid-template-columns: 50% 1fr;
      gap: 12px;
      align-items: start;
    }
    .right-col { display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 680px) { .bottom-row { grid-template-columns: 1fr; } }

    .code-panel {
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .code-header {
      padding: 9px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.11em;
      color: var(--text-dim);
    }
    .code-body {
      padding: 10px 0;
      flex: 1;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.78rem;
      line-height: 1.7;
      overflow-x: auto;
    }
    .cl {
      display: flex; align-items: stretch;
      border-left: 3px solid transparent;
      padding: 0 14px 0 0;
      transition: background-color 0.01s;
      white-space: pre;
    }
    .cl .ln {
      width: 28px; min-width: 28px;
      text-align: right; color: #3d4468;
      user-select: none; padding-right: 14px;
      font-size: 0.72rem; line-height: 1.7;
    }
    .cl .code { color: var(--text-muted); }

    .kw  { color: var(--purple); }
    .fn  { color: var(--blue); }
    .bi  { color: var(--orange); }
    .cm  { color: #3d4468; font-style: italic; }
    .op  { color: var(--text); }

    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 18px;
    }
    .panel-title {
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.11em;
      color: var(--text-dim); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }

    #call-stack {
      display: flex; flex-direction: column-reverse; gap: 5px;
      min-height: 40px;
    }
    .cs-frame {
      background: #1e1a3a; color: var(--accent-pale);
      border: 1px solid var(--accent); border-radius: 6px;
      padding: 5px 11px; font-size: 0.84rem; font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .cs-frame.top { background: #4338ca; color: #fff; }
    .cs-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }

    .height-row { display: flex; gap: 10px; }
    .height-slot {
      flex: 1;
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }
    .height-slot .hs-label { color: var(--text-dim); font-size: 0.7rem; margin-bottom: 4px; }
    .height-slot .hs-val { color: var(--text-bright); font-size: 1.1rem; font-weight: 700; }
    .height-slot.active-slot { border-color: var(--accent); }
    .height-slot .hs-val.unknown { color: var(--text-faint); }
    .height-slot .hs-val.neg { color: var(--red); }
    .height-slot .hs-val.pos { color: var(--green); }

    .result-banner {
      font-size: 1rem; font-weight: 700;
      padding: 8px 16px; border-radius: 6px;
      display: none; width: fit-content; margin-top: 4px;
    }
    .result-banner.balanced {
      background: var(--green-bg); color: var(--green);
      border: 1px solid var(--green-border); display: block;
    }
    .result-banner.unbalanced {
      background: #2a0f14; color: var(--red);
      border: 1px solid #6b2030; display: block;
    }

    .btn-preset {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-muted);
      cursor: pointer; font-size: 0.80rem; font-weight: 600;
      padding: 7px 14px; transition: background 0.15s, border-color 0.15s;
      white-space: nowrap; align-self: flex-end;
    }
    .btn-preset:hover { background: var(--border); border-color: var(--accent); color: var(--text); }

    .viz-inputs {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      padding: 10px 0 14px; width: 100%; max-width: 90%;
    }
    .viz-inputs .field {
      display: flex; flex-direction: column; gap: 4px;
    }
    .viz-inputs label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    .viz-inputs input[type="text"] {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 6px 10px; font-size: 0.85rem; width: 280px;
    }
    .viz-inputs select {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 6px 10px; font-size: 0.85rem; cursor: pointer;
    }
    .viz-inputs button {
      padding: 7px 18px; border: none; border-radius: var(--radius-sm);
      font-weight: 600; cursor: pointer; font-size: 0.85rem;
      transition: background 0.15s;
    }
    .viz-inputs .btn-run {
      background: var(--accent); color: #fff;
    }
    .viz-inputs .btn-run:hover { opacity: 0.9; }
    .viz-inputs .btn-random {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
    }
    .viz-inputs .btn-random:hover { background: var(--border); }
  </style>
</head>
<body class="page">

<script>
// ── Code lines ────────────────────────────────────────────────────────────────
const CODE_LINES = [
  [1,  `<span class="kw">def</span> <span class="fn">isBalanced</span><span class="op">(</span>root<span class="op">):</span>`],
  [2,  `    <span class="kw">def</span> <span class="fn">dfs</span><span class="op">(</span>node<span class="op">):</span>`],
  [3,  `        <span class="kw">if not</span> node<span class="op">:</span>`],
  [4,  `            <span class="kw">return</span> <span class="bi">0</span>`],
  [0,  ``],
  [6,  `        left <span class="op">=</span> <span class="fn">dfs</span><span class="op">(</span>node.left<span class="op">)</span>`],
  [7,  `        <span class="kw">if</span> left <span class="op">== -</span><span class="bi">1</span><span class="op">:</span> <span class="kw">return</span> <span class="op">-</span><span class="bi">1</span>`],
  [0,  ``],
  [9,  `        right <span class="op">=</span> <span class="fn">dfs</span><span class="op">(</span>node.right<span class="op">)</span>`],
  [10, `        <span class="kw">if</span> right <span class="op">== -</span><span class="bi">1</span><span class="op">:</span> <span class="kw">return</span> <span class="op">-</span><span class="bi">1</span>`],
  [0,  ``],
  [12, `        <span class="kw">if</span> <span class="fn">abs</span><span class="op">(</span>left <span class="op">-</span> right<span class="op">) &gt;</span> <span class="bi">1</span><span class="op">:</span>`],
  [13, `            <span class="kw">return</span> <span class="op">-</span><span class="bi">1</span>`],
  [0,  ``],
  [15, `        <span class="kw">return</span> <span class="fn">max</span><span class="op">(</span>left<span class="op">,</span> right<span class="op">) +</span> <span class="bi">1</span>`],
  [0,  ``],
  [17, `    <span class="kw">return</span> <span class="fn">dfs</span><span class="op">(</span>root<span class="op">) !=</span> <span class="op">-</span><span class="bi">1</span>`],
];

function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = `cl-${ln}`;
    row.innerHTML =
      `<span class="ln">${ln > 0 ? ln : ''}</span>` +
      `<span class="code">${html}</span>`;
    body.appendChild(row);
  });
}

// ── Node state colors ─────────────────────────────────────────────────────────
const COLORS = {
  idle:       { fill: '#1e2130', stroke: '#2d3148',   text: 'var(--text-muted)' },
  active:     { fill: '#4338ca', stroke: 'var(--accent)', text: 'var(--accent-pale)' },
  balanced:   { fill: '#052e16', stroke: '#16a34a',   text: 'var(--green)' },
  unbalanced: { fill: '#2a0f14', stroke: '#6b2030',   text: 'var(--red)' },
};
const EDGE_DEFAULT = '#2d3148';

// ── Global tree state ─────────────────────────────────────────────────────────
let nodeMap = {};
let R = 22;
let VW = 800, VH = 320;

// ── Parse level-order input ───────────────────────────────────────────────────
function parseLevelOrder(s) {
  return s.split(',').map(t => t.trim()).map(t =>
    (t === '' || t.toLowerCase() === 'null' || t === 'n') ? null : Number(t)
  );
}

let nextId = 0;
function buildTree(vals) {
  nodeMap = {};
  nextId = 0;
  if (!vals.length || vals[0] === null) return null;
  const makeNode = (val) => {
    const n = { id: nextId++, val, left: null, right: null, x: 0, y: 0, depth: 0 };
    nodeMap[n.id] = n;
    return n;
  };
  const root = makeNode(vals[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < vals.length) {
    const cur = queue.shift();
    if (i < vals.length) {
      if (vals[i] !== null) { cur.left = makeNode(vals[i]); cur.left.depth = cur.depth + 1; queue.push(cur.left); }
      i++;
    }
    if (i < vals.length) {
      if (vals[i] !== null) { cur.right = makeNode(vals[i]); cur.right.depth = cur.depth + 1; queue.push(cur.right); }
      i++;
    }
  }
  return root;
}

// ── Layout (inorder for x, depth for y) ──────────────────────────────────────
function layout(root) {
  let idx = 0, maxD = 0;
  function inorder(node) {
    if (!node) return;
    inorder(node.left);
    node._inIdx = idx++;
    if (node.depth > maxD) maxD = node.depth;
    inorder(node.right);
  }
  inorder(root);
  const count = idx;
  const xSpace = Math.max(60, Math.min(110, 700 / Math.max(1, count)));
  const ySpace = 70;
  const padX = 40, padY = 30;
  VW = padX * 2 + (count - 1) * xSpace;
  VH = padY * 2 + maxD * ySpace + R * 2 + 24;
  if (VW < 400) VW = 400;
  for (const id in nodeMap) {
    const n = nodeMap[id];
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + 22 + n.depth * ySpace + R;
  }
}

// ── SVG helpers ───────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id;
  return g;
}

// ── Render SVG tree ───────────────────────────────────────────────────────────
function renderSVG(root) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  R = VW > 700 ? 22 : 18;

  const edgeG = svgG('edges');
  const nodeG = svgG('nodes');
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  (function drawEdges(n) {
    if (!n) return;
    [n.left, n.right].forEach(c => {
      if (!c) return;
      edgeG.appendChild(svgEl('line', {
        id: `edge-${n.id}-${c.id}`,
        x1: n.x, y1: n.y, x2: c.x, y2: c.y,
        stroke: EDGE_DEFAULT, 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);

  for (const id in nodeMap) {
    const n = nodeMap[id];
    const g = svgG(`node-g-${n.id}`);

    const badge = svgEl('text', {
      id: `nb-${n.id}`,
      x: n.x, y: n.y - R - 6,
      'text-anchor': 'middle', 'dominant-baseline': 'auto',
      fill: '#16a34a', 'font-size': 13, 'font-weight': '800',
      'font-family': 'JetBrains Mono, monospace',
      opacity: 0,
    });
    badge.textContent = '';
    g.appendChild(badge);

    g.appendChild(svgEl('circle', {
      id: `nc-${n.id}`, cx: n.x, cy: n.y, r: R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': 2.5,
    }));
    const t = svgEl('text', {
      id: `nt-${n.id}`, x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.round(R * 0.75), 'font-weight': 'bold',
      'font-family': 'Segoe UI, system-ui, sans-serif',
    });
    t.textContent = n.val;
    g.appendChild(t);
    nodeG.appendChild(g);
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
function simulate(root) {
  const stateMap = {};
  const heightMap = {};
  for (const id in nodeMap) { stateMap[id] = 'idle'; heightMap[id] = null; }
  const callStack = [];
  const out = [];
  let finalResult = null;

  function snap(phase, desc, lines, activeLeft, activeRight) {
    out.push({
      phase, desc, lines: lines || [],
      stateMap: { ...stateMap },
      heightMap: { ...heightMap },
      callStack: [...callStack],
      finalResult,
      activeLeft: activeLeft !== undefined ? activeLeft : null,
      activeRight: activeRight !== undefined ? activeRight : null,
    });
  }

  function dfs(node) {
    if (!node) {
      callStack.push('dfs(None)');
      snap('Base', 'Node is null → return 0 (empty subtree has height 0).', [3, 4]);
      callStack.pop();
      return 0;
    }

    callStack.push(`dfs(${node.val})`);
    stateMap[node.id] = 'active';
    snap('Visit', `Enter dfs(${node.val}). Node exists — recurse into children.`, [2, 3]);

    snap('Left', `Recurse into left subtree of node ${node.val}.`, [6]);
    const left = dfs(node.left);

    if (left === -1) {
      heightMap[node.id] = -1;
      stateMap[node.id] = 'unbalanced';
      snap('Early Exit', `left = −1 → left subtree is unbalanced. Propagate −1 from node ${node.val}.`, [7], left, null);
      callStack.pop();
      return -1;
    }

    snap('Right', `left = ${left}. Recurse into right subtree of node ${node.val}.`, [9], left, null);
    const right = dfs(node.right);

    if (right === -1) {
      heightMap[node.id] = -1;
      stateMap[node.id] = 'unbalanced';
      snap('Early Exit', `right = −1 → right subtree is unbalanced. Propagate −1 from node ${node.val}.`, [10], left, right);
      callStack.pop();
      return -1;
    }

    const diff = Math.abs(left - right);
    if (diff > 1) {
      heightMap[node.id] = -1;
      stateMap[node.id] = 'unbalanced';
      snap('Unbalanced', `|${left} − ${right}| = ${diff} > 1 → heights diverge. Return −1 from node ${node.val}.`, [12, 13], left, right);
      callStack.pop();
      return -1;
    }

    const h = Math.max(left, right) + 1;
    heightMap[node.id] = h;
    stateMap[node.id] = 'balanced';
    snap('Balanced', `|${left} − ${right}| = ${diff} ≤ 1 → height = max(${left}, ${right}) + 1 = ${h}. Return ${h} from node ${node.val}.`, [15], left, right);
    callStack.pop();
    return h;
  }

  snap('Start', `Begin isBalanced. DFS returns height ≥ 0 if balanced, −1 if not.`, [1, 2]);
  const result = dfs(root);
  finalResult = result !== -1 ? 'balanced' : 'unbalanced';
  snap('Done',
    result !== -1
      ? `dfs(root) = ${result} ≠ −1 → Tree is balanced ✓`
      : `dfs(root) = −1 → Tree is NOT balanced ✗`,
    [17]);
  return out;
}

// ── Apply snapshot ────────────────────────────────────────────────────────────
let prevLines = [];

function applyStep(s, animate) {
  Object.entries(s.stateMap).forEach(([id, st]) => setNodeColor(+id, st, animate));

  for (const id in s.heightMap) {
    const badge = document.getElementById(`nb-${id}`);
    if (!badge) continue;
    const val = s.heightMap[id];
    if (val !== null) {
      badge.textContent = val === -1 ? '−1' : val;
      badge.setAttribute('fill', val === -1 ? 'var(--red)' : '#16a34a');
      if (animate) gsap.to(badge, { opacity: 1, duration: 0.3 });
      else badge.setAttribute('opacity', 1);
    } else {
      badge.textContent = '';
      badge.setAttribute('opacity', 0);
    }
  }

  const banner = document.getElementById('result-banner');
  if (s.finalResult) {
    banner.className = `result-banner ${s.finalResult}`;
    banner.textContent = s.finalResult === 'balanced' ? 'Balanced ✓' : 'Not Balanced ✗';
  } else {
    banner.className = 'result-banner';
    banner.textContent = '';
  }

  const slotL = document.getElementById('slot-left');
  const slotR = document.getElementById('slot-right');
  const hsL   = document.getElementById('hs-left');
  const hsR   = document.getElementById('hs-right');

  if (s.activeLeft !== null) {
    hsL.textContent = s.activeLeft;
    hsL.className   = `hs-val ${s.activeLeft === -1 ? 'neg' : 'pos'}`;
    slotL.className = 'height-slot active-slot';
  } else {
    hsL.textContent = '—';
    hsL.className   = 'hs-val unknown';
    slotL.className = 'height-slot';
  }
  if (s.activeRight !== null) {
    hsR.textContent = s.activeRight;
    hsR.className   = `hs-val ${s.activeRight === -1 ? 'neg' : 'pos'}`;
    slotR.className = 'height-slot active-slot';
  } else {
    hsR.textContent = '—';
    hsR.className   = 'hs-val unknown';
    slotR.className = 'height-slot';
  }

  renderCallStack(s.callStack, animate);
  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

// ── Code line highlighting ────────────────────────────────────────────────────
const HL_BG   = 'rgba(var(--orange-ch),0.13)';
const HL_NONE = 'rgba(var(--orange-ch),0)';
const HL_BORD = 'var(--orange)';
const NO_BORD = 'transparent';

function setCodeLines(oldLines, newLines, animate) {
  const DUR = 0.22;
  (oldLines || []).filter(n => !(newLines || []).includes(n)).forEach(n => {
    const el = document.getElementById(`cl-${n}`);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_NONE, borderLeftColor: NO_BORD, duration: DUR });
      gsap.to(el.querySelector('.ln'), { color: '#3d4468', duration: DUR });
    } else {
      el.style.backgroundColor = ''; el.style.borderLeftColor = '';
      const ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  (newLines || []).filter(n => !(oldLines || []).includes(n)).forEach(n => {
    const el = document.getElementById(`cl-${n}`);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.08 });
      gsap.to(el.querySelector('.ln'), { color: 'var(--orange)', duration: DUR, delay: 0.08 });
    } else {
      el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD;
      const ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--orange)';
    }
  });
  if (newLines && newLines.length) {
    const el = document.getElementById(`cl-${newLines[0]}`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ── Node color ────────────────────────────────────────────────────────────────
function setNodeColor(id, state, animate, dur) {
  dur = dur || 0.3;
  const c  = COLORS[state] || COLORS.idle;
  const nc = document.getElementById(`nc-${id}`);
  const nt = document.getElementById(`nt-${id}`);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: dur, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke } });
    gsap.to(nt, { duration: dur, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

// ── Call stack ────────────────────────────────────────────────────────────────
function renderCallStack(stack, animate) {
  const c = document.getElementById('call-stack');
  c.innerHTML = '';
  if (!stack.length) {
    c.innerHTML = '<span class="cs-empty">empty</span>';
    return;
  }
  stack.forEach((label, i) => {
    const el = document.createElement('div');
    el.className = 'cs-frame' + (i === stack.length - 1 ? ' top' : '');
    el.textContent = label;
    c.appendChild(el);
    if (animate && i === stack.length - 1) gsap.from(el, { opacity: 0, x: -10, duration: 0.2 });
  });
}

// ── Presets ───────────────────────────────────────────────────────────────────
function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-tree').value = d.tree;
  build();
}

// ── Random example ────────────────────────────────────────────────────────────
function randomExample() {
  const presets = [
    "3,9,20,null,null,15,7",
    "1,2,2,3,3,null,null,4,4",
    "1",
    "1,2,3,4,5,6,7",
    "5,3,6,2,4,null,7",
    "10,5,15,2,7,null,20",
  ];
  const idx = Math.floor(Math.random() * presets.length);
  document.getElementById('inp-tree').value = presets[idx];
  document.getElementById('presetSel').value = '';
  build();
}

// ── Build ─────────────────────────────────────────────────────────────────────
function build() {
  const txt = document.getElementById('inp-tree').value.trim();
  const vals = parseLevelOrder(txt);
  buildCodePanel();
  const root = buildTree(vals);
  if (!root) {
    document.getElementById('tree-svg').innerHTML = '';
    document.getElementById('step-desc').textContent = 'Empty tree.';
    return;
  }
  layout(root);
  renderSVG(root);
  prevLines = [];
  nav.load(simulate(root));
}

// ── Init ──────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var el = document.getElementById('phase-label');
    if (el) el.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
    var d = document.getElementById('step-desc');
    if (d) d.textContent = snap.desc;
  }
});

build();
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
