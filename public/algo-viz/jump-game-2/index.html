<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jump Game II</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-size: 0.75rem; line-height: 1.8; }
    .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
    .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
    .kw { color: var(--purple); }
    .nb { color: var(--green); }
    .cm { color: var(--text-dim); font-style: italic; }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
    .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
    .var-key { color: var(--text-dim); }
    .var-val { color: var(--accent); font-weight: 700; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border-color: var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }

    /* page-specific */
    .array-section {
      width: 100%; padding: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column; gap: 4px;
      min-height: 100px;
    }
    .arr-row { display: flex; gap: 6px; flex-wrap: nowrap; }
    .arr-cell {
      width: 48px; height: 48px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border-soft); border-radius: 5px;
      background: #0f0f0f;
      font-size: 0.92rem; font-weight: 700; font-family: monospace;
      color: var(--text-ghost);
      position: relative;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .arr-cell[data-state="done"]         { color: var(--text-ghost); border-color: #2a2a2a; background: #141414; }
    .arr-cell[data-state="current"]      { color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); }
    .arr-cell[data-state="in-level"]     { color: #fde68a; border-color: #d97706; background: #1c1408; }
    .arr-cell[data-state="in-reach"]     { color: #c4b5fd; border-color: #7c3aed; background: #130c23; }
    .arr-cell[data-state="goal"]         { color: #bbf7d0; border-color: #15803d; background: #14532d; }
    .band-row { display: flex; gap: 6px; }
    .band-cell { width: 48px; height: 5px; flex-shrink: 0; border-radius: 3px; background: transparent; }
    .band-cell.cur  { background: #d97706; }
    .band-cell.reach { background: #7c3aed; }
    .arr-indices { display: flex; gap: 6px; }
    .arr-idx {
      width: 48px; flex-shrink: 0;
      text-align: center; font-size: 0.6rem;
      color: var(--text-ghost); font-family: monospace;
    }
    .legend-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.65rem; color: var(--text-faint); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 1px solid transparent; }

    .var-main { display: flex; gap: 8px; }
    .var-box {
      flex: 1; padding: 8px 6px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .var-box.jumps-accent  { border-color: #15803d; }
    .var-box.end-accent    { border-color: #d97706; }
    .var-box.far-accent    { border-color: #7c3aed; }
    .var-label  { font-size: 0.6rem; font-family: monospace; color: var(--text-faint); }
    .vv-val     { font-size: 1.2rem; font-weight: 700; color: var(--text-bright); }
    .var-sub { display: flex; gap: 6px; }
    .var-box-sm {
      flex: 1; padding: 5px 3px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .var-label-sm { font-size: 0.55rem; font-family: monospace; color: var(--text-ghost); text-align: center; }
    .var-val-sm   { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .result-card {
      padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.82rem; font-family: monospace; color: var(--text-muted);
    }
    .result-card.success { border-color: #15803d; background: #052e16; color: #bbf7d0; }
    .result-card strong { color: var(--text-bright); }
    .code-line { display: flex; align-items: center; padding: 0 14px; font-size: 0.75rem; line-height: 1.8; white-space: pre; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .op { color: var(--text); }
    #step-desc-box { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value="2,3,1,1,4">Classic (LC example 1)</option>
      <option value="2,3,0,1,4">Skip Zero (LC example 2)</option>
      <option value="1,1,1,1,1">Step-by-step</option>
      <option value="5,0,0,0,0">Single big jump</option>
      <option value="1,2,3,1,1">Ascending</option>
      <option value="3,2,1,0,4">Stuck at zero</option>
    </select>
  </div>
  <div>
    <label>nums</label>
    <input id="inp-nums" type="text" value="2, 3, 1, 1, 4" style="width:220px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Build &amp; Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Jump Game II</span>
  <span style="font-size:12px;color:var(--text-muted)">LeetCode 45 &middot; Greedy BFS &middot; O(n) time &middot; O(1) space</span>
  <span id="step-counter"></span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="array-section" id="array-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter nums and click Build &amp; Run.</span>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Step</div>
      <div id="step-desc-box">Enter nums and click Build &amp; Run.</div>
    </div>
    <div>
      <div class="sidebar-title">Variables</div>
      <div class="var-main">
        <div class="var-box jumps-accent">
          <div class="var-label">jumps</div>
          <div class="vv-val" id="vv-jumps">&mdash;</div>
        </div>
        <div class="var-box">
          <div class="var-label">i</div>
          <div class="vv-val" id="vv-i">&mdash;</div>
        </div>
      </div>
      <div class="var-sub" style="margin-top:6px">
        <div class="var-box-sm" style="border-color:#d97706">
          <div class="var-label-sm">current_end</div>
          <div class="var-val-sm" id="vv-cend">&mdash;</div>
        </div>
        <div class="var-box-sm" style="border-color:#7c3aed">
          <div class="var-label-sm">farthest</div>
          <div class="var-val-sm" id="vv-far">&mdash;</div>
        </div>
        <div class="var-box-sm">
          <div class="var-label-sm">i+nums[i]</div>
          <div class="var-val-sm" id="vv-reach">&mdash;</div>
        </div>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Result</div>
      <div class="result-card" id="result-card">&mdash;</div>
    </div>
    <div>
      <div class="sidebar-title">Legend</div>
      <div class="legend-row">
        <div class="legend-item"><div style="width:28px;height:5px;background:#d97706;border-radius:3px"></div>current level</div>
        <div class="legend-item"><div style="width:28px;height:5px;background:#7c3aed;border-radius:3px"></div>next level</div>
        <div class="legend-item"><div class="legend-dot" style="background:#1c1408;border-color:#d97706"></div>in-level</div>
        <div class="legend-item"><div class="legend-dot" style="background:#130c23;border-color:#7c3aed"></div>in-reach</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--surface-dark);border-color:var(--accent)"></div>cursor</div>
        <div class="legend-item"><div class="legend-dot" style="background:#14532d;border-color:#15803d"></div>goal</div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&larr;</button>
  <button class="btn-step" id="stepBtn" disabled>&rarr;</button>
  <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="700">Slow</option>
    <option value="350" selected>Medium</option>
    <option value="120">Fast</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var numLen = 0;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">jump</span><span class="op">(</span>nums<span class="op">):</span>'],
  [2,  '    jumps <span class="op">=</span> <span class="nb">0</span>'],
  [3,  '    current_end <span class="op">=</span> <span class="nb">0</span>'],
  [4,  '    farthest <span class="op">=</span> <span class="nb">0</span>'],
  [0,  ''],
  [6,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="bi">len</span><span class="op">(</span>nums<span class="op">)</span> <span class="op">-</span> <span class="nb">1</span><span class="op">):</span>'],
  [7,  '        farthest <span class="op">=</span> <span class="bi">max</span><span class="op">(</span>farthest<span class="op">,</span> i <span class="op">+</span> nums<span class="op">[</span>i<span class="op">])</span>'],
  [8,  '        <span class="kw">if</span> i <span class="op">==</span> current_end<span class="op">:</span>'],
  [9,  '            jumps <span class="op">+=</span> <span class="nb">1</span>'],
  [10, '            current_end <span class="op">=</span> farthest'],
  [0,  ''],
  [12, '    <span class="kw">return</span> jumps'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var badge   = document.getElementById('phase-badge');
      var counter = document.getElementById('step-counter');
      var descEl  = document.getElementById('step-desc-box');
      if (badge)   badge.textContent   = snap.phase;
      if (counter) counter.textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (descEl)  descEl.textContent  = snap.desc;
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="code-line"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  document.getElementById('inp-nums').value = sel.value;
  buildAndRun();
}

function randomExample() {
  var examples = [
    '2,3,1,1,4', '2,3,0,1,4', '1,1,1,1,1', '5,0,0,0,0',
    '1,2,3,1,1', '3,2,1,1,1', '1,2,1,1,1,1', '2,1,2,1,1'
  ];
  var pick = examples[Math.floor(Math.random() * examples.length)];
  document.getElementById('inp-nums').value = pick;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var raw = document.getElementById('inp-nums').value;
  var nums = raw.split(',').map(function(x) { return parseInt(x.trim()); }).filter(function(x) { return !isNaN(x); });
  if (nums.length < 1) return;
  numLen = nums.length;
  buildArraySection(nums);
  simSteps = simulate(nums);
  nav.load(simSteps);
}

function buildArraySection(nums) {
  var sec = document.getElementById('array-section');
  sec.innerHTML =
    '<div class="arr-row" id="arr-row"></div>' +
    '<div class="band-row" id="band-row"></div>' +
    '<div class="arr-indices" id="arr-indices"></div>';

  var arrRow  = document.getElementById('arr-row');
  var bandRow = document.getElementById('band-row');
  var idxRow  = document.getElementById('arr-indices');

  nums.forEach(function(v, i) {
    var cell = document.createElement('div');
    cell.className = 'arr-cell'; cell.id = 'ac-' + i; cell.dataset.state = 'idle';
    cell.textContent = v; arrRow.appendChild(cell);

    var bc = document.createElement('div');
    bc.className = 'band-cell'; bc.id = 'bc-' + i; bandRow.appendChild(bc);

    var idx = document.createElement('div');
    idx.className = 'arr-idx'; idx.textContent = i; idxRow.appendChild(idx);
  });
}

function simulate(nums) {
  var n = nums.length;
  var steps = [];
  var jumps = 0;
  var currentEnd = 0;
  var farthest = 0;
  var levelStart = 0;

  var cellStates = Array.from({length: n}, function() { return 'idle'; });

  function snap(phase, desc, lines, i, reach, result) {
    steps.push({
      phase: phase, desc: desc, lines: lines,
      cellStates: cellStates.slice(),
      jumps: jumps,
      i: i,
      currentEnd: currentEnd,
      farthest: farthest,
      levelStart: levelStart,
      reach: reach,
      result: result,
    });
  }

  cellStates[0] = 'in-level';
  for (var k = 1; k < n; k++) cellStates[k] = 'idle';
  snap('Init', 'jumps=0, current_end=0, farthest=0. Level 0 starts at index 0.', [2, 3, 4], -1, null, null);

  if (n === 1) {
    cellStates[0] = 'goal';
    snap('Done', 'n=1. Already at the goal — 0 jumps needed.', [12], 0, null, 0);
    return steps;
  }

  for (var i = 0; i < n - 1; i++) {
    cellStates[i] = 'current';
    snap('Scan', 'Visit i=' + i + '. Checking i + nums[i] = ' + i + ' + ' + nums[i] + ' = ' + (i + nums[i]) + '.', [6, 7], i, i + nums[i], null);

    var candidate = i + nums[i];
    var prevFar = farthest;
    if (candidate > farthest) farthest = candidate;
    for (var j = currentEnd + 1; j <= Math.min(farthest, n - 1); j++) {
      if (cellStates[j] !== 'done' && cellStates[j] !== 'goal') {
        cellStates[j] = 'in-reach';
      }
    }
    if (n - 1 <= farthest) cellStates[n - 1] = 'goal';

    if (candidate > prevFar) {
      snap('Update', 'farthest updated: ' + prevFar + ' → ' + farthest + '. Purple band extends to index ' + Math.min(farthest, n - 1) + '.', [7], i, candidate, null);
    } else {
      snap('Update', 'i + nums[i] = ' + candidate + ' ≤ farthest=' + prevFar + '. farthest unchanged.', [7], i, candidate, null);
    }

    if (i === currentEnd) {
      jumps++;
      levelStart = currentEnd + 1;
      currentEnd = farthest;
      for (var j = levelStart; j <= Math.min(currentEnd, n - 1); j++) {
        if (cellStates[j] !== 'done' && cellStates[j] !== 'goal') {
          cellStates[j] = 'in-level';
        }
      }
      snap('Jump', 'i=' + i + ' == current_end. Level boundary crossed! jumps → ' + jumps + ', current_end → ' + currentEnd + '. Orange band shifts.', [8, 9, 10], i, candidate, null);
    }

    cellStates[i] = 'done';
  }

  cellStates[n - 1] = 'goal';
  snap('Done', 'Scan complete. Minimum jumps to reach index ' + (n - 1) + ' = ' + jumps + '.', [12], n - 1, null, jumps);
  return steps;
}

function applyStep(s, animate) {
  applyArrayCells(s.cellStates, s.i, animate);
  applyBands(s.levelStart, s.currentEnd, s.farthest);
  applyVars(s, animate);
  applyResult(s.result);
  setCodeLines(s.lines);
}

function applyArrayCells(states, curI, animate) {
  states.forEach(function(state, i) {
    var el = document.getElementById('ac-' + i);
    if (!el) return;
    var prev = el.dataset.state;
    el.dataset.state = state;
    if (animate && i === curI && state === 'current' && prev !== 'current') {
      gsap.fromTo(el, { scale: 0.85 }, { scale: 1, duration: 0.22, ease: 'back.out(2)' });
    }
    if (animate && state === 'goal' && prev !== 'goal') {
      gsap.fromTo(el, { scale: 1.2 }, { scale: 1, duration: 0.35, ease: 'back.out(1.8)' });
    }
  });
}

function applyBands(levelStart, currentEnd, farthest) {
  for (var i = 0; i < numLen; i++) {
    var bc = document.getElementById('bc-' + i);
    if (!bc) continue;
    bc.className = 'band-cell';
    if (i >= levelStart && i <= currentEnd) {
      bc.classList.add('cur');
    } else if (i > currentEnd && i <= farthest) {
      bc.classList.add('reach');
    }
  }
}

function applyVars(s, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null || val === undefined ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setVal('vv-jumps', s.jumps);
  setVal('vv-i',     s.i >= 0 ? s.i : null);
  setVal('vv-cend',  s.currentEnd);
  setVal('vv-far',   s.farthest);
  setVal('vv-reach', s.reach);
}

function applyResult(result) {
  var card = document.getElementById('result-card');
  if (!card) return;
  card.className = 'result-card';
  if (result !== null && result !== undefined) {
    card.className = 'result-card success';
    card.innerHTML = '<strong>' + result + '</strong> jump' + (result !== 1 ? 's' : '') + ' minimum';
  } else {
    card.textContent = '—';
  }
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return; dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
