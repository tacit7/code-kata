<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DFS Traversal</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 12px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* UNIQUE VIZ CSS */
  .tree-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; width: 100%; }
  .panel-title { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  #tree-svg { display: block; width: 100%; height: 260px; }
  .tree-edge { stroke: var(--border); stroke-width: 2; fill: none; }
  .tree-node-bg { fill: var(--bg); stroke: var(--border); stroke-width: 2; transition: fill 0.25s, stroke 0.25s; }
  .tree-node-bg.visited { fill: var(--green); stroke: var(--green); }
  .tree-node-bg.current { fill: var(--accent); stroke: var(--accent); }
  .tree-node-label { fill: var(--text); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; transition: fill 0.25s; }
  .tree-node-label.visited, .tree-node-label.current { fill: #fff; }
  #result-values { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; margin-top: 6px; }
  .result-chip { background: var(--green); color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 0.85rem; font-weight: 700; font-family: monospace; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value="[1,2,3,4,5,null,6]">Balanced [1,2,3,4,5,null,6]</option>
      <option value="[5,3,8,1,4,7,9]">Full BST [5,3,8,1,4,7,9]</option>
      <option value="[4,2,6,1,3,5,7]">Perfect tree [4,2,6,1,3,5,7]</option>
      <option value="[10,5,15,3,7,null,18]">BST with null [10,5,15,3,7,null,18]</option>
      <option value="[1,2,3]">3-node [1,2,3]</option>
      <option value="[1,2,null,4,5]">Left-heavy [1,2,null,4,5]</option>
      <option value="[3,1,4,null,2,null,5]">Varied [3,1,4,null,2,null,5]</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Traversal</label>
    <select id="traversalSel" onchange="buildAndRun()">
      <option value="inorder">Inorder (L &rarr; Root &rarr; R)</option>
      <option value="preorder">Preorder (Root &rarr; L &rarr; R)</option>
      <option value="postorder">Postorder (L &rarr; R &rarr; Root)</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Tree (level-order array)</label>
    <input type="text" id="treeInput" value="[1,2,3,4,5,null,6]" placeholder="[1,2,3,null,5]" style="width:200px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">DFS Traversal</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div class="tree-panel">
      <div class="panel-title">Binary Tree</div>
      <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:8px;">Pseudocode</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Result Array</div>
      <div id="result-values"></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
    // ── Pseudocode definitions ───────────────────────────────────────────────
    var CODE = {
      inorder: [
        '<span class=kw>def</span> <span class=nb>inorder</span>(node):',
        '    <span class=kw>if not</span> node: <span class=kw>return</span>  <span class=cm># base case</span>',
        '    inorder(node.left)         <span class=cm># recurse left</span>',
        '    result.append(node.val)    <span class=cm># visit root</span>',
        '    inorder(node.right)        <span class=cm># recurse right</span>',
      ],
      preorder: [
        '<span class=kw>def</span> <span class=nb>preorder</span>(node):',
        '    <span class=kw>if not</span> node: <span class=kw>return</span>  <span class=cm># base case</span>',
        '    result.append(node.val)    <span class=cm># visit root first</span>',
        '    preorder(node.left)        <span class=cm># recurse left</span>',
        '    preorder(node.right)       <span class=cm># recurse right</span>',
      ],
      postorder: [
        '<span class=kw>def</span> <span class=nb>postorder</span>(node):',
        '    <span class=kw>if not</span> node: <span class=kw>return</span>  <span class=cm># base case</span>',
        '    postorder(node.left)       <span class=cm># recurse left</span>',
        '    postorder(node.right)      <span class=cm># recurse right</span>',
        '    result.append(node.val)    <span class=cm># visit root last</span>',
      ],
    };

    var LINE_MAP = {
      inorder:   { enter: 1, null_return: 2, go_left: 3, visit: 4, go_right: 5 },
      preorder:  { enter: 1, null_return: 2, visit: 3, go_left: 4, go_right: 5 },
      postorder: { enter: 1, null_return: 2, go_left: 3, go_right: 4, visit: 5 },
    };

    var nav;
    var currentNodes = [];
    var positions = {};
    var SVG_W = 500, SVG_H = 240;

    function parseTreeArray(str) {
      str = str.trim();
      try {
        var arr = JSON.parse(str);
        if (!Array.isArray(arr)) return null;
        return arr.map(function(v) {
          return (v === null || v === 'null') ? null : Number(v);
        });
      } catch(e) { return null; }
    }

    function computePositions(nodes) {
      var pos = {};
      var counter = 0;

      function assignInorder(i) {
        if (i >= nodes.length || nodes[i] === null || nodes[i] === undefined) return;
        assignInorder(2 * i + 1);
        pos[i] = { inorderRank: counter++ };
        assignInorder(2 * i + 2);
      }
      assignInorder(0);

      var total = Object.keys(pos).length;
      if (total === 0) return pos;

      function depth(i) {
        var d = 0, idx = i;
        while (idx > 0) { idx = Math.floor((idx - 1) / 2); d++; }
        return d;
      }

      var maxDepth = 0;
      Object.keys(pos).forEach(function(k) {
        var d = depth(parseInt(k));
        pos[k].depth = d;
        if (d > maxDepth) maxDepth = d;
      });

      var padX = 30, padY = 36;
      var usableW = SVG_W - 2 * padX;
      var usableH = SVG_H - 2 * padY;

      Object.keys(pos).forEach(function(k) {
        var p = pos[k];
        p.x = total > 1 ? padX + (p.inorderRank / (total - 1)) * usableW : SVG_W / 2;
        p.y = padY + (maxDepth > 0 ? (p.depth / maxDepth) * usableH : 0);
      });

      return pos;
    }

    function buildSteps(nodes, type) {
      var steps = [];
      var result = [];
      var visited = [];
      var lines = LINE_MAP[type];

      function push(action, nodeIdx) {
        steps.push({
          action: action,
          nodeIdx: nodeIdx,
          result: result.slice(),
          visited: visited.slice(),
          codeLine: lines[action],
        });
      }

      function dfs(i) {
        if (i >= nodes.length || nodes[i] === null || nodes[i] === undefined) {
          push('null_return', null);
          return;
        }
        push('enter', i);

        if (type === 'preorder') {
          result.push(nodes[i]);
          visited.push(i);
          push('visit', i);
          push('go_left', i);
          dfs(2 * i + 1);
          push('go_right', i);
          dfs(2 * i + 2);
        } else if (type === 'inorder') {
          push('go_left', i);
          dfs(2 * i + 1);
          result.push(nodes[i]);
          visited.push(i);
          push('visit', i);
          push('go_right', i);
          dfs(2 * i + 2);
        } else {
          push('go_left', i);
          dfs(2 * i + 1);
          push('go_right', i);
          dfs(2 * i + 2);
          result.push(nodes[i]);
          visited.push(i);
          push('visit', i);
        }
      }

      if (nodes.length > 0 && nodes[0] !== null && nodes[0] !== undefined) {
        dfs(0);
      }

      return steps;
    }

    var SVG_NS = 'http://www.w3.org/2000/svg';

    function renderTree(nodes) {
      var svg = document.getElementById('tree-svg');
      svg.innerHTML = '';
      svg.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + SVG_H);

      positions = computePositions(nodes);
      var R = 18;

      Object.keys(positions).forEach(function(k) {
        var i = parseInt(k);
        if (i === 0) return;
        var pi = Math.floor((i - 1) / 2);
        if (positions[pi] === undefined) return;
        var line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', positions[pi].x);
        line.setAttribute('y1', positions[pi].y);
        line.setAttribute('x2', positions[i].x);
        line.setAttribute('y2', positions[i].y);
        line.setAttribute('class', 'tree-edge');
        svg.appendChild(line);
      });

      Object.keys(positions).forEach(function(k) {
        var i = parseInt(k);
        var p = positions[i];

        var g = document.createElementNS(SVG_NS, 'g');

        var circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        circle.setAttribute('r', R);
        circle.setAttribute('class', 'tree-node-bg');
        circle.setAttribute('id', 'nc-' + i);

        var text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('x', p.x);
        text.setAttribute('y', p.y);
        text.setAttribute('class', 'tree-node-label');
        text.setAttribute('id', 'nt-' + i);
        text.textContent = nodes[i];

        g.appendChild(circle);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    function renderCodePanel(type) {
      var body = document.getElementById('code-body');
      body.innerHTML = '';
      CODE[type].forEach(function(line, idx) {
        var div = document.createElement('div');
        div.className = 'cl';
        div.id = 'cl' + (idx + 1);
        div.innerHTML = '<span class=ln>' + (idx + 1) + '</span>' + line;
        body.appendChild(div);
      });
    }

    var ACTION_PHASE = {
      enter:       'Enter Node',
      null_return: 'Base Case',
      visit:       'Visit Node',
      go_left:     'Recurse Left',
      go_right:    'Recurse Right',
    };

    function descForStep(snap, nodes) {
      var val = snap.nodeIdx !== null ? nodes[snap.nodeIdx] : null;
      if (snap.action === 'enter')       return 'Call dfs(node=' + val + ') — enter function.';
      if (snap.action === 'null_return') return 'Node is null — base case, return.';
      if (snap.action === 'visit')       return 'Append ' + val + ' to result array.';
      if (snap.action === 'go_left')     return 'Recurse into left subtree of node ' + val + '.';
      if (snap.action === 'go_right')    return 'Recurse into right subtree of node ' + val + '.';
      return '';
    }

    function applyStep(snap, nodes) {
      Object.keys(positions).forEach(function(k) {
        var i = parseInt(k);
        var circle = document.getElementById('nc-' + i);
        var label  = document.getElementById('nt-' + i);
        if (!circle) return;
        var isVisited = snap.visited.indexOf(i) !== -1;
        var isCurrent = snap.nodeIdx === i && snap.action !== 'null_return';
        var cls = 'tree-node-bg' + (isCurrent ? ' current' : isVisited ? ' visited' : '');
        circle.setAttribute('class', cls);
        label.setAttribute('class', 'tree-node-label' + (isCurrent || isVisited ? ' visited' : ''));
      });

      for (var ln = 1; ln <= 5; ln++) {
        var el = document.getElementById('cl' + ln);
        if (el) el.classList.toggle('hl', ln === snap.codeLine);
      }

      var rv = document.getElementById('result-values');
      rv.innerHTML = '';
      snap.result.forEach(function(v) {
        var chip = document.createElement('span');
        chip.className = 'result-chip';
        chip.textContent = v;
        rv.appendChild(chip);
      });
    }

    function updateStatus(snap, cursor, total, nodes) {
      document.getElementById('phase-badge').textContent = ACTION_PHASE[snap.action] || '';
      document.getElementById('step-counter').textContent = 'Step ' + (cursor + 1) + ' / ' + total;
      var desc = document.getElementById('desc');
      if (desc) desc.textContent = descForStep(snap, nodes);
    }

    function buildAndRun() {
      var input = document.getElementById('treeInput').value.trim();
      var type  = document.getElementById('traversalSel').value;

      var parsed = parseTreeArray(input);
      if (!parsed || parsed.length === 0) {
        document.getElementById('desc').textContent = 'Invalid tree array. Use format: [1,2,3,null,5]';
        return;
      }

      currentNodes = parsed;
      renderCodePanel(type);
      renderTree(currentNodes);

      var steps = buildSteps(currentNodes, type);

      nav.load(steps);
    }

    function loadPreset() {
      var sel = document.getElementById('presetSel');
      if (!sel.value) return;
      document.getElementById('treeInput').value = sel.value;
      sel.value = '';
      buildAndRun();
    }

    function randomExample() {
      var sizes = [5, 6, 7];
      var size = sizes[Math.floor(Math.random() * sizes.length)];
      var vals = [];
      var pool = [];
      for (var i = 1; i <= 15; i++) pool.push(i);
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      for (var i = 0; i < size; i++) {
        if (i > 0 && Math.random() < 0.15) {
          vals.push(null);
        } else {
          vals.push(pool[i]);
        }
      }
      document.getElementById('treeInput').value = JSON.stringify(vals);
      buildAndRun();
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderCodePanel('inorder');

      nav = VizNav({
        btnPrev:  document.getElementById('prevBtn'),
        btnNext:  document.getElementById('stepBtn'),
        btnPlay:  document.getElementById('playBtn'),
        speedSel: document.getElementById('speedSel'),
        render: function(snap, cursor, total) {
          applyStep(snap, currentNodes);
          updateStatus(snap, cursor, total, currentNodes);
        },
      });

      document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });

      buildAndRun();
    });
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
