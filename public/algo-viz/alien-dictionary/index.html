<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alien Dictionary</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 16px; overflow-y: auto; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }

  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* PAGE-SPECIFIC */
  .graph-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    width: 100%;
  }

  .words-table { display: flex; flex-direction: column; gap: 4px; }
  .word-row { display: flex; align-items: center; gap: 6px; }
  .word-idx { color: var(--text-ghost); font-size: 0.72rem; min-width: 20px; text-align: right; font-family: monospace; }
  .word-chars { display: flex; gap: 3px; }
  .char-box {
    width: 28px; height: 28px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-weight: 700; font-size: 0.9rem;
    border: 1.5px solid var(--border); color: var(--text);
    background: var(--bg); transition: background 0.25s, border-color 0.25s, color 0.25s;
  }
  .char-box.match  { background: #1a2a1a; border-color: #9ece6a; color: #9ece6a; }
  .char-box.differ { background: #3d2a10; border-color: #e0af68; color: #e0af68; }
  .char-box.faded  { opacity: 0.3; }
  .word-arrow { font-size: 0.72rem; color: var(--text-ghost); min-width: 30px; text-align: center; }
  .word-edge-label { font-family: monospace; font-size: 0.8rem; color: #e0af68; font-weight: 700; }

  .graph-svg-wrap { width: 100%; aspect-ratio: 1.5; background: var(--bg); border-radius: var(--radius-sm); overflow: hidden; }
  #graph-svg { width: 100%; height: 100%; }

  .node-circle { stroke-width: 2.5; transition: fill 0.3s, stroke 0.3s; }
  .node-circle.state-white  { fill: #1a1b2e; stroke: #7aa2f7; }
  .node-circle.state-gray   { fill: #3d3524; stroke: #e0af68; }
  .node-circle.state-black  { fill: #1a2a1a; stroke: #9ece6a; }
  .node-circle.state-cycle  { fill: #3d1515; stroke: #f7768e; }

  .node-label { fill: var(--text-bright); font-size: 14px; font-weight: 700; font-family: monospace; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .edge-line { stroke-width: 2; fill: none; stroke: #3b4261; transition: stroke 0.3s; }
  .edge-line.active  { stroke: #e0af68; }
  .edge-line.cycle   { stroke: #f7768e; }
  .edge-line.done    { stroke: #9ece6a; }
  .edge-arrow { fill: #3b4261; transition: fill 0.3s; }

  .section-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 4px; }

  .result-badge {
    font-size: 0.82rem; font-weight: 700;
    padding: 5px 12px; border-radius: 6px; letter-spacing: 0.05em;
    display: none; width: fit-content; font-family: monospace;
    margin-top: 4px;
  }
  .result-badge.valid   { background: #1a2a1a; color: #9ece6a; border: 1px solid #9ece6a; display: block; }
  .result-badge.invalid { background: #3d1515; color: #f7768e; border: 1px solid #f7768e; display: block; }

  .order-list { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; align-items: center; margin-top: 4px; }
  .order-chip { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; font-weight: 700; background: #1a2a1a; border: 1px solid #9ece6a; color: #9ece6a; }
  .stack-chip { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; font-weight: 700; background: #3d3524; border: 1px solid #e0af68; color: #e0af68; }

  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }

  .kw { color: var(--purple); }
  .fn { color: var(--blue); }
  .bi { color: var(--orange); }
  .cm { color: var(--text-ghost); }
  .nb { color: var(--green); }
  .st { color: #e0af68; }

  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-preset {
    padding: 5px 10px; border-radius: var(--radius-sm);
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.8rem; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-preset:hover, .btn-preset.active { border-color: var(--accent); color: var(--accent-pale); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <div class="preset-row">
      <button class="btn-preset active" id="preset-default" onclick="loadPreset('default')">Default (wrt&hellip;)</button>
      <button class="btn-preset" id="preset-two" onclick="loadPreset('two')">Two words</button>
      <button class="btn-preset" id="preset-cycle" onclick="loadPreset('cycle')">Cycle (invalid)</button>
    </div>
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Build &amp; Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Alien Dictionary</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="graph-panel">
      <div class="section-label">Word List (adjacent pairs yield ordering edges)</div>
      <div class="words-table" id="words-table"></div>
      <div class="section-label" style="margin-top:6px">Constraint Graph (char &rarr; char)</div>
      <div class="graph-svg-wrap">
        <svg id="graph-svg" viewBox="0 0 560 320" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="arr-default" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#3b4261"/>
            </marker>
            <marker id="arr-active" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#e0af68"/>
            </marker>
            <marker id="arr-cycle" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#f7768e"/>
            </marker>
            <marker id="arr-done" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#9ece6a"/>
            </marker>
          </defs>
          <g id="edges-g"></g>
          <g id="nodes-g"></g>
        </svg>
      </div>
    </div>
    <div id="desc" style="font-size:13px;color:var(--text-muted);text-align:center;max-width:560px;min-height:36px;line-height:1.5;">Select a preset and click Build &amp; Run.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Result</div>
      <div class="result-badge" id="result-badge"></div>
    </div>
    <div>
      <div class="sidebar-title">DFS Stack (GRAY)</div>
      <div class="order-list" id="stack-list">
        <span style="color:var(--text-ghost);font-size:0.75rem">empty</span>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Topo Order</div>
      <div class="order-list" id="order-list">
        <span style="color:var(--text-ghost);font-size:0.75rem">none yet</span>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Legend</div>
      <div class="legend-row"><div class="legend-dot" style="background:#1a1b2e;border-color:#7aa2f7"></div><span>WHITE</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#3d3524;border-color:#e0af68"></div><span>GRAY</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#1a2a1a;border-color:#9ece6a"></div><span>BLACK</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#3d1515;border-color:#f7768e"></div><span>CYCLE</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&larr; Prev</button>
  <button id="stepBtn" class="btn-step">Step &rarr;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">alienOrder</span>(words):'],
  [2,  '    adj = {c: <span class="bi">set</span>() <span class="kw">for</span> w <span class="kw">in</span> words <span class="kw">for</span> c <span class="kw">in</span> w}'],
  [3,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span>(<span class="bi">len</span>(words) - <span class="nb">1</span>):'],
  [4,  '        w1, w2 = words[i], words[i+<span class="nb">1</span>]'],
  [5,  '        min_len = <span class="bi">min</span>(<span class="bi">len</span>(w1), <span class="bi">len</span>(w2))'],
  [6,  '        <span class="kw">if</span> <span class="bi">len</span>(w1) > <span class="bi">len</span>(w2) <span class="kw">and</span> w1[:min_len] == w2[:min_len]:'],
  [7,  '            <span class="kw">return</span> <span class="st">""</span>  <span class="cm"># invalid prefix ordering</span>'],
  [8,  '        <span class="kw">for</span> j <span class="kw">in</span> <span class="bi">range</span>(min_len):'],
  [9,  '            <span class="kw">if</span> w1[j] != w2[j]:'],
  [10, '                adj[w1[j]].add(w2[j])  <span class="cm"># w1[j] < w2[j]</span>'],
  [11, '                <span class="kw">break</span>'],
  [12, '    WHITE, GRAY, BLACK = <span class="nb">0</span>, <span class="nb">1</span>, <span class="nb">2</span>'],
  [13, '    color = {c: WHITE <span class="kw">for</span> c <span class="kw">in</span> adj}'],
  [14, '    result = []'],
  [15, '    <span class="kw">def</span> <span class="fn">dfs</span>(c):'],
  [16, '        color[c] = GRAY'],
  [17, '        <span class="kw">for</span> nei <span class="kw">in</span> adj[c]:'],
  [18, '            <span class="kw">if</span> color[nei] == GRAY: <span class="kw">return</span> <span class="nb">False</span>'],
  [19, '            <span class="kw">if</span> color[nei] == WHITE:'],
  [20, '                <span class="kw">if not</span> <span class="fn">dfs</span>(nei): <span class="kw">return</span> <span class="nb">False</span>'],
  [21, '        color[c] = BLACK'],
  [22, '        result.append(c)'],
  [23, '        <span class="kw">return</span> <span class="nb">True</span>'],
  [24, '    <span class="kw">for</span> c <span class="kw">in</span> adj:'],
  [25, '        <span class="kw">if</span> color[c] == WHITE:'],
  [26, '            <span class="kw">if not</span> <span class="fn">dfs</span>(c): <span class="kw">return</span> <span class="st">""</span>'],
  [27, '    <span class="kw">return</span> <span class="st">""</span>.join(<span class="bi">reversed</span>(result))'],
];

var PRESETS = {
  default: { words: ['wrt','wrf','er','ett','rftt'], label: "['wrt','wrf','er','ett','rftt'] → 'wertf'" },
  two:     { words: ['abc','ab'],   label: "['abc','ab'] → '' (invalid prefix)" },
  cycle:   { words: ['ab','ba'],    label: "['ab','ba'] → '' (cycle: a→b→a)" }
};

var currentPreset = 'default';
var simSteps = [];
var nav;
var gNodes = [];
var gEdges = [];
var gWords = [];

function loadPreset(name) {
  currentPreset = name;
  Object.keys(PRESETS).forEach(function(p) {
    document.getElementById('preset-' + p).classList.toggle('active', p === name);
  });
}

function randomExample() {
  var keys = Object.keys(PRESETS);
  var k = keys[Math.floor(Math.random() * keys.length)];
  loadPreset(k);
  buildAndRun();
}

function layoutNodes(chars) {
  var list = Array.from(chars).sort();
  var n = list.length;
  var cx = 280, cy = 160, r = 120;
  return list.map(function(c, i) {
    var angle = (2 * Math.PI * i / n) - Math.PI / 2;
    return { char: c, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  });
}

var NODE_R = 20;

function charNode(c) {
  return gNodes.find(function(n) { return n.char === c; });
}

function edgeKey(a, b) { return a + '->' + b; }

function getEdgePts(a, b) {
  var na = charNode(a), nb = charNode(b);
  if (!na || !nb) return null;
  var dx = nb.x - na.x, dy = nb.y - na.y;
  var dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 1) return null;
  var ux = dx/dist, uy = dy/dist;
  return {
    x1: na.x + ux * NODE_R, y1: na.y + uy * NODE_R,
    x2: nb.x - ux * (NODE_R + 6), y2: nb.y - uy * (NODE_R + 6)
  };
}

function renderGraph(snap) {
  var edgesG = document.getElementById('edges-g');
  var nodesG = document.getElementById('nodes-g');
  edgesG.innerHTML = '';
  nodesG.innerHTML = '';

  var edgeStates = {};
  if (snap) {
    (snap.activeEdges || []).forEach(function(e) { edgeStates[edgeKey(e[0],e[1])] = 'active'; });
    (snap.cycleEdges  || []).forEach(function(e) { edgeStates[edgeKey(e[0],e[1])] = 'cycle'; });
    (snap.doneEdges   || []).forEach(function(e) { edgeStates[edgeKey(e[0],e[1])] = 'done'; });
  }

  var nodeStates = {};
  gNodes.forEach(function(n) { nodeStates[n.char] = snap ? (snap.colors[n.char] || 'white') : 'white'; });

  gEdges.forEach(function(e) {
    var pts = getEdgePts(e.from, e.to);
    if (!pts) return;
    var key = edgeKey(e.from, e.to);
    var state = edgeStates[key] || 'default';
    var marker = 'url(#arr-' + (state === 'default' ? 'default' : state) + ')';
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pts.x1); line.setAttribute('y1', pts.y1);
    line.setAttribute('x2', pts.x2); line.setAttribute('y2', pts.y2);
    line.setAttribute('class', 'edge-line' + (state !== 'default' ? ' ' + state : ''));
    line.setAttribute('marker-end', marker);
    edgesG.appendChild(line);
  });

  gNodes.forEach(function(n) {
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y);
    circle.setAttribute('r', NODE_R);
    circle.setAttribute('class', 'node-circle state-' + (nodeStates[n.char] || 'white'));
    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', n.x); text.setAttribute('y', n.y);
    text.setAttribute('class', 'node-label');
    text.textContent = n.char;
    g.appendChild(circle); g.appendChild(text);
    nodesG.appendChild(g);
  });
}

function renderWordTable(snap) {
  var el = document.getElementById('words-table');
  var hl = snap ? (snap.highlightPair || -1) : -1;

  el.innerHTML = gWords.map(function(w, i) {
    var chars = w.split('').map(function(c, j) {
      var cls = 'char-box';
      if (hl === i || hl === i + 1) {
        if (hl === i && snap && snap.compareJ !== undefined) {
          if (j < snap.compareJ) cls += ' match';
          else if (j === snap.compareJ) cls += ' differ';
          else cls += ' faded';
        } else if (hl === i + 1 && snap && snap.compareJ !== undefined) {
          if (j < snap.compareJ) cls += ' match';
          else if (j === snap.compareJ) cls += ' differ';
          else cls += ' faded';
        }
      }
      return '<div class="' + cls + '">' + c + '</div>';
    }).join('');

    var edgeLabel = '';
    if (snap && snap.wordEdge && snap.wordEdge.wordIdx === i) {
      edgeLabel = '<span class="word-edge-label">' + snap.wordEdge.from + '→' + snap.wordEdge.to + '</span>';
    }

    return '<div class="word-row"><span class="word-idx">' + i + '</span><div class="word-chars">' + chars + '</div>' + edgeLabel + '</div>';
  }).join('');
}

function simulate(words) {
  var steps = [];
  var charSet = {};
  words.forEach(function(w) { w.split('').forEach(function(c) { charSet[c] = true; }); });
  var chars = Object.keys(charSet).sort();

  var adj = {};
  chars.forEach(function(c) { adj[c] = []; });
  var edgeList = [];
  var invalidPrefix = false;

  function snap(phase, desc, lines, extra) {
    var colorSnap = Object.assign({}, colors);
    if (extra && extra.colors) Object.assign(colorSnap, extra.colors);
    steps.push(Object.assign({
      phase: phase, desc: desc, lines: lines,
      colors: colorSnap,
      stack: stack.slice(),
      finished: finished.slice(),
      activeEdges: activeEdges.map(function(e){return e.slice();}),
      cycleEdges: cycleEdges.map(function(e){return e.slice();}),
      doneEdges: doneEdges.map(function(e){return e.slice();}),
      foundCycle: foundCycle,
      invalidPrefix: invalidPrefix,
      result: result.slice(),
    }, extra || {}));
  }

  var colors = {};
  chars.forEach(function(c) { colors[c] = 'white'; });
  var stack = [], finished = [], activeEdges = [], cycleEdges = [], doneEdges = [];
  var foundCycle = false;
  var result = [];

  snap('Init', 'Collect all unique characters from every word. Initialize graph with one node per char.', [2], {});

  for (var i = 0; i < words.length - 1; i++) {
    var w1 = words[i], w2 = words[i+1];
    var minLen = Math.min(w1.length, w2.length);

    snap('Compare', 'Compare word[' + i + ']="' + w1 + '" vs word[' + (i+1) + ']="' + w2 + '" — scan char by char until they differ.', [3,4,5], {highlightPair: i, compareJ: -1});

    if (w1.length > w2.length && w1.slice(0, minLen) === w2.slice(0, minLen)) {
      invalidPrefix = true;
      snap('InvalidPrefix', 'word[' + i + ']="' + w1 + '" is longer and is a prefix of word[' + (i+1) + ']="' + w2 + '" — impossible ordering. Return "".', [6,7], {highlightPair: i, compareJ: minLen - 1});
      break;
    }

    var foundDiff = false;
    for (var j = 0; j < minLen; j++) {
      snap('ScanChars', 'Position ' + j + ': "' + w1[j] + '" vs "' + w2[j] + '"' + (w1[j] === w2[j] ? ' — same, continue.' : ' — DIFFERENT! Edge ' + w1[j] + '→' + w2[j] + '.'), [8,9], {highlightPair: i, compareJ: j});
      if (w1[j] !== w2[j]) {
        if (adj[w1[j]].indexOf(w2[j]) === -1) {
          adj[w1[j]].push(w2[j]);
          edgeList.push({from: w1[j], to: w2[j]});
        }
        snap('AddEdge', 'First difference: "' + w1[j] + '" < "' + w2[j] + '" in alien order. Add edge ' + w1[j] + '→' + w2[j] + '.', [10,11], {highlightPair: i, compareJ: j, wordEdge: {wordIdx: i, from: w1[j], to: w2[j]}});
        foundDiff = true;
        break;
      }
    }
    if (!foundDiff && !invalidPrefix) {
      snap('NoDiff', 'Words "' + w1 + '" and "' + w2 + '" share common prefix up to shorter length — no edge extracted.', [8,9,11], {highlightPair: i, compareJ: minLen});
    }
  }

  gEdges = edgeList;

  if (invalidPrefix) {
    steps[steps.length - 1].result = [];
    return steps;
  }

  snap('StartDFS', 'Graph built. Run DFS topo sort: visit each char, mark GRAY on entry, BLACK on exit, append to result.', [12,13,14,24,25,26]);

  function dfs(c) {
    if (foundCycle) return;
    colors[c] = 'gray';
    stack.push(c);
    snap('Enter', 'Enter "' + c + '" → mark GRAY (on DFS stack).', [16], {});

    var neighbors = adj[c];
    for (var k = 0; k < neighbors.length; k++) {
      if (foundCycle) break;
      var nei = neighbors[k];
      activeEdges = [[c, nei]];

      if (colors[nei] === 'gray') {
        cycleEdges.push([c, nei]);
        foundCycle = true;
        var cycleColors = Object.assign({}, colors);
        cycleColors[nei] = 'cycle';
        cycleColors[c] = 'cycle';
        snap('Cycle', 'Edge "' + c + '"→"' + nei + '": "' + nei + '" is GRAY. Back edge! Cycle detected — return "".', [18], {colors: cycleColors});
        activeEdges = [];
        return;
      }

      if (colors[nei] === 'white') {
        snap('Recurse', 'Edge "' + c + '"→"' + nei + '": "' + nei + '" is WHITE — recurse DFS("' + nei + '").', [17,19,20], {});
        activeEdges = [];
        dfs(nei);
        if (foundCycle) return;
        doneEdges.push([c, nei]);
        activeEdges = [];
      } else {
        doneEdges.push([c, nei]);
        snap('SkipBlack', 'Edge "' + c + '"→"' + nei + '": "' + nei + '" is BLACK (done) — safe, skip.', [17,19], {});
        activeEdges = [];
      }
    }

    if (!foundCycle) {
      colors[c] = 'black';
      stack.pop();
      finished.push(c);
      result.push(c);
      snap('Exit', 'Exit "' + c + '" → mark BLACK, append to result.', [21,22,23], {});
    }
  }

  for (var ci = 0; ci < chars.length; ci++) {
    if (foundCycle) break;
    var c = chars[ci];
    if (colors[c] === 'white') {
      snap('StartNode', 'Char "' + c + '" is WHITE — begin DFS from "' + c + '".', [24,25,26], {});
      dfs(c);
    }
  }

  if (!foundCycle) {
    var order = result.slice().reverse().join('');
    snap('Done', 'DFS complete. Reverse post-order = alien alphabet: "' + order + '".', [27], {});
  }

  return steps;
}

function applyStep(snap) {
  renderGraph(snap);
  renderWordTable(snap);
  updateChips('stack-list', snap.stack, 'stack-chip');
  var topoSoFar = snap.result ? snap.result.slice().reverse() : [];
  updateChips('order-list', topoSoFar, 'order-chip');
  setCodeLines(snap.lines);

  var badge = document.getElementById('result-badge');
  badge.className = 'result-badge';
  badge.textContent = '';

  if (snap.phase === 'Done') {
    var order = snap.result.slice().reverse().join('');
    badge.className = 'result-badge valid';
    badge.textContent = '"' + order + '"';
  } else if (snap.phase === 'Cycle' || snap.foundCycle) {
    if (snap.phase === 'Cycle' || snap.phase === 'Done') {
      badge.className = 'result-badge invalid';
      badge.textContent = '"" — cycle';
    }
  } else if (snap.invalidPrefix) {
    badge.className = 'result-badge invalid';
    badge.textContent = '"" — invalid prefix';
  }
}

function updateChips(elId, items, cls) {
  var el = document.getElementById(elId);
  if (!items || items.length === 0) {
    el.innerHTML = '<span style="color:var(--text-ghost);font-size:0.75rem">empty</span>';
    return;
  }
  el.innerHTML = items.map(function(c) {
    return '<div class="' + cls + '">' + c + '</div>';
  }).join('');
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (!el) return;
    el.classList.toggle('hl', !!(lines && lines.indexOf(e[0]) >= 0));
  });
}

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="cl" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var preset = PRESETS[currentPreset];
  gWords = preset.words;

  var charSet = {};
  gWords.forEach(function(w) { w.split('').forEach(function(c) { charSet[c] = true; }); });
  gNodes = layoutNodes(Object.keys(charSet));
  gEdges = [];

  renderWordTable(null);
  renderGraph(null);

  simSteps = simulate(gWords);
  renderGraph(null);
  nav.load(simSteps);
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  loadPreset('default');
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-badge').textContent = snap.phase;
      document.getElementById('step-counter').textContent = 'Step ' + (cur+1) + ' / ' + total;
      document.getElementById('desc').textContent = snap.desc;
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
});
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
