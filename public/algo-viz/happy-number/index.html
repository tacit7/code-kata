<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Number</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; overflow: hidden; }
  #desc { display: none; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 300px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(var(--accent-ch),0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; }
  #sidebar { width: 190px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); } .var-val { color: var(--accent); font-weight: 700; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* UNIQUE VIZ CSS */
  .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .chain-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; }
  .chain-list { display: flex; flex-direction: column; gap: 10px; }
  .chain-node { display: flex; flex-direction: column; gap: 4px; }
  .chain-num { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; height: 40px; padding: 0 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 1.1rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); background: #0f0f0f; transition: border-color 0.2s, color 0.2s, background 0.2s; position: relative; }
  .chain-num[data-state="past"] { border-color: #2d3148; color: var(--text-dim); background: #111420; }
  .chain-num[data-state="active"] { border-color: var(--accent); color: var(--accent-pale); background: var(--surface-dark); }
  .chain-num[data-state="cycle"] { border-color: #f87171; color: #fca5a5; background: rgba(239,68,68,0.08); }
  .chain-num[data-state="happy"] { border-color: #22c55e; color: #86efac; background: rgba(34,197,94,0.08); }
  .chain-breakdown { font-size: 0.75rem; font-family: monospace; color: var(--text-dim); padding-left: 4px; display: none; }
  .chain-breakdown.show { display: block; }
  .chain-arrow { font-size: 1rem; color: var(--text-ghost); padding-left: 20px; line-height: 1; }
  .ptr-labels { display: flex; gap: 6px; padding-left: 4px; }
  .ptr-chip { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.06em; }
  .ptr-chip.slow { background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.4); color: #c084fc; }
  .ptr-chip.fast { background: rgba(251,146,60,0.12); border: 1px solid rgba(251,146,60,0.35); color: var(--orange); }
  .ptr-chip.both { background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.4); color: var(--yellow); }
  .seen-scroll { overflow-y: auto; flex: 1; }
  .seen-grid { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .seen-chip { min-width: 48px; height: 36px; padding: 0 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #2d3148; border-radius: 6px; background: #111420; font-size: 0.88rem; font-weight: 700; font-family: monospace; color: var(--text-dim); transition: border-color 0.2s, color 0.2s; }
  .seen-chip.just-added { border-color: var(--accent); color: var(--accent-pale); background: var(--surface-dark); }
  .seen-chip.cycle-hit { border-color: #f87171; color: #fca5a5; background: rgba(239,68,68,0.08); }
  .result-badge { margin-left: auto; padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; display: none; }
  .result-badge.happy { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #22c55e; }
  .result-badge.sad { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #f87171; }
  @media (max-width: 680px) { #viz-area { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"n":"19"}'>19 (Happy)</option>
      <option value='{"n":"7"}'>7 (Happy)</option>
      <option value='{"n":"10"}'>10 (Cycle)</option>
      <option value='{"n":"23"}'>23 (Happy)</option>
      <option value='{"n":"86"}'>86 (Cycle)</option>
      <option value='{"n":"100"}'>100 (Happy)</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column">
    <label>n</label>
    <input type="number" id="n-input" value="19" min="1" max="9999" style="width:90px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
  <span class="result-badge" id="result-badge"></span>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Happy Number</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc"></div>
    <div class="panel-box">
      <div class="panel-title">Number Chain</div>
      <div class="chain-scroll">
        <div class="chain-list" id="chain-list"></div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Seen Set</div>
      <div class="seen-scroll">
        <div class="seen-grid" id="seen-grid"></div>
      </div>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:8px;">Code</div>
    <div id="code-body">
      <div class="cl" id="cl-0"><span class="ln">1</span><span class="kw">def</span> isHappy(n):</div>
      <div class="cl" id="cl-1"><span class="ln">2</span>    slow = n</div>
      <div class="cl" id="cl-2"><span class="ln">3</span>    fast = sumSq(n)</div>
      <div class="cl" id="cl-3"><span class="ln">4</span>    <span class="kw">while</span> fast != 1 <span class="kw">and</span> slow != fast:</div>
      <div class="cl" id="cl-4"><span class="ln">5</span>        slow = sumSq(slow)</div>
      <div class="cl" id="cl-5"><span class="ln">6</span>        fast = sumSq(sumSq(fast))</div>
      <div class="cl" id="cl-6"><span class="ln">7</span>    <span class="kw">return</span> fast == 1</div>
    </div>
  </div>
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <div class="var-item"><span class="var-key">slow </span><span class="var-val" id="slow-val">—</span></div>
      <div class="var-item"><span class="var-key">fast </span><span class="var-val" id="fast-val">—</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Step Detail</div>
      <div id="step-desc-sidebar" style="font-size:10px;color:var(--text-dim);line-height:1.5;word-break:break-word;"></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
'use strict';

function sumOfSquaredDigits(n) {
  var s=0; while(n>0){var d=n%10;s+=d*d;n=Math.floor(n/10);} return s;
}
function digitBreakdown(n) {
  var digits=String(n).split('').map(Number);
  return digits.map(function(d){return d+'²('+d*d+')';}).join(' + ') + ' = ' + sumOfSquaredDigits(n);
}
function nextF(n){return sumOfSquaredDigits(sumOfSquaredDigits(n));}

function simulate(startN) {
  var out=[], seen={}, chain=[], slow=startN, fast=sumOfSquaredDigits(startN);
  out.push({ phase:'Init', desc:'Start with n='+startN+'. slow='+slow+', fast='+fast+' (one step ahead).', chain:chain.slice(), slowIdx:-1, fastIdx:-1, seenSet:[], justAdded:null, cycleHit:null, slowCalc:'', fastCalc:'' });
  chain.push(startN); seen[startN]=0;
  var maxIter=60;
  for (var i=0;i<maxIter;i++) {
    var slowNext=sumOfSquaredDigits(slow), fastNext=nextF(fast);
    var slowCalcStr=digitBreakdown(slow);
    var fastCalcStr='f('+fast+')='+sumOfSquaredDigits(fast)+' → f('+sumOfSquaredDigits(fast)+')='+fastNext;
    var justAdded=null, cycleHit=null;
    if (!(slowNext in seen)){seen[slowNext]=chain.length;chain.push(slowNext);justAdded=slowNext;}
    slow=slowNext; fast=fastNext;
    var slowIdxCur=seen[slow]!==undefined?seen[slow]:-1;
    var fastIdxCur=seen[fast]!==undefined?seen[fast]:-1;
    if (slow===1) {
      out.push({phase:'Happy!',desc:startN+' is a Happy Number!',chain:chain.slice(),slowIdx:slowIdxCur,fastIdx:fastIdxCur,seenSet:Object.keys(seen).map(Number),justAdded:justAdded,cycleHit:null,result:'happy',slowCalc:slowCalcStr,fastCalc:fastCalcStr});
      break;
    }
    if (slow===fast) {
      cycleHit=slow;
      if(!(fast in seen)){seen[fast]=chain.length;chain.push(fast);}
      out.push({phase:'Cycle!',desc:'slow=fast='+slow+' — cycle detected. '+startN+' is NOT a Happy Number.',chain:chain.slice(),slowIdx:seen[slow],fastIdx:seen[fast],seenSet:Object.keys(seen).map(Number),justAdded:justAdded,cycleHit:cycleHit,result:'sad',slowCalc:slowCalcStr,fastCalc:fastCalcStr});
      break;
    }
    out.push({phase:'Iter '+(i+1),desc:'slow: '+slow+'   fast: '+fast+'   (step '+(i+1)+')',chain:chain.slice(),slowIdx:slowIdxCur,fastIdx:fastIdxCur,seenSet:Object.keys(seen).map(Number),justAdded:justAdded,cycleHit:null,slowCalc:slowCalcStr,fastCalc:fastCalcStr});
  }
  return out;
}

function buildChainDOM(chain) {
  var list=document.getElementById('chain-list'); list.innerHTML='';
  for (var i=0;i<chain.length;i++) {
    var node=document.createElement('div'); node.className='chain-node'; node.id='cn-'+i;
    var numEl=document.createElement('div'); numEl.className='chain-num'; numEl.id='cnum-'+i; numEl.dataset.state='idle'; numEl.textContent=chain[i];
    var bd=document.createElement('div'); bd.className='chain-breakdown'; bd.id='cbd-'+i; bd.textContent=digitBreakdown(chain[i]);
    node.appendChild(numEl); node.appendChild(bd);
    if (i<chain.length-1){var arr=document.createElement('div');arr.className='chain-arrow';arr.textContent='↓';node.appendChild(arr);}
    list.appendChild(node);
  }
}

function buildSeenDOM(seenNums) {
  var grid=document.getElementById('seen-grid'); grid.innerHTML='';
  for (var i=0;i<seenNums.length;i++){var chip=document.createElement('div');chip.className='seen-chip';chip.id='sc-'+seenNums[i];chip.textContent=seenNums[i];grid.appendChild(chip);}
}

function applyStep(snap) {
  var existingCount=document.getElementById('chain-list').children.length;
  if (snap.chain.length!==existingCount) buildChainDOM(snap.chain);
  for (var i=0;i<snap.chain.length;i++) {
    var numEl=document.getElementById('cnum-'+i), bdEl=document.getElementById('cbd-'+i);
    if (!numEl) continue;
    var existing=numEl.querySelector('.ptr-labels'); if(existing)numEl.removeChild(existing);
    var state='idle';
    if (snap.result==='happy'&&snap.chain[i]===1) state='happy';
    else if (snap.cycleHit!==null&&snap.chain[i]===snap.cycleHit) state='cycle';
    else if (i<snap.slowIdx) state='past';
    else if (i===snap.slowIdx) state='active';
    numEl.dataset.state=state;
    if (bdEl){if(i===snap.slowIdx&&snap.slowCalc){bdEl.className='chain-breakdown show';bdEl.textContent=snap.slowCalc;}else{bdEl.className='chain-breakdown';}}
    var hasSlow=i===snap.slowIdx, hasFast=snap.fastIdx!==undefined&&i===snap.fastIdx;
    if (hasSlow||hasFast){
      var labels=document.createElement('div'); labels.className='ptr-labels';
      if (hasSlow&&hasFast){var chip=document.createElement('span');chip.className='ptr-chip both';chip.textContent='slow+fast';labels.appendChild(chip);}
      else{if(hasSlow){var s=document.createElement('span');s.className='ptr-chip slow';s.textContent='slow';labels.appendChild(s);}if(hasFast){var f=document.createElement('span');f.className='ptr-chip fast';f.textContent='fast';labels.appendChild(f);}}
      numEl.appendChild(labels);
    }
  }
  buildSeenDOM(snap.seenSet);
  if (snap.justAdded!==null){var chip=document.getElementById('sc-'+snap.justAdded);if(chip)chip.className='seen-chip just-added';}
  if (snap.cycleHit!==null){var cc=document.getElementById('sc-'+snap.cycleHit);if(cc)cc.className='seen-chip cycle-hit';}
  document.getElementById('slow-val').textContent=snap.slowIdx>=0?snap.chain[snap.slowIdx]:'—';
  document.getElementById('fast-val').textContent=snap.fastIdx>=0?snap.chain[snap.fastIdx]:'—';
  document.getElementById('step-desc-sidebar').textContent=snap.slowCalc||'';
  var badge=document.getElementById('result-badge');
  if (snap.result==='happy'){badge.className='result-badge happy';badge.textContent='✓ Happy Number';badge.style.display='';}
  else if (snap.result==='sad'){badge.className='result-badge sad';badge.textContent='✗ Not Happy';badge.style.display='';}
  else{badge.style.display='none';}
  var activeEl=document.getElementById('cnum-'+snap.slowIdx);
  if (activeEl) activeEl.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function buildAndRun() {
  var n=parseInt(document.getElementById('n-input').value,10);
  if (!n||n<1) return;
  document.getElementById('result-badge').style.display='none';
  var steps=simulate(n);
  buildChainDOM(steps[0].chain);
  buildSeenDOM([]);
  window.nav.load(steps);
}

function loadPreset() {
  var sel=document.getElementById('presetSel'); if(!sel.value)return;
  var d=JSON.parse(sel.value);
  document.getElementById('n-input').value=d.n;
  buildAndRun();
}

function randomExample() {
  var n=Math.floor(Math.random()*9980)+1;
  document.getElementById('n-input').value=n;
  document.getElementById('presetSel').value='';
  buildAndRun();
}

window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('n-input').addEventListener('keydown', function(e){if(e.key==='Enter')buildAndRun();});

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-badge').textContent = snap.phase || '';
      document.getElementById('step-counter').textContent = 'Step '+(cur+1)+' / '+total;
      var descEl = document.getElementById('desc');
      if (descEl) { gsap.fromTo(descEl,{opacity:0},{opacity:1,duration:0.15}); descEl.textContent=snap.desc; }
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
  buildAndRun();
});

(function() {
  var handle=document.getElementById('resize-handle'), panel=document.getElementById('code-panel');
  var dragging=false, startX=0, startW=0;
  handle.addEventListener('mousedown',function(e){dragging=true;startX=e.clientX;startW=panel.offsetWidth;handle.classList.add('dragging');e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!dragging)return;panel.style.width=Math.min(560,Math.max(120,startW-(e.clientX-startX)))+'px';});
  document.addEventListener('mouseup',function(){if(!dragging)return;dragging=false;handle.classList.remove('dragging');});
})();
</script>
</body>
</html>
