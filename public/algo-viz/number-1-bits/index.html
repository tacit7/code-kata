<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Number of 1 Bits</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input[type="text"] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .vi-chk { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-dim); cursor: pointer; }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; }
  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* register */
  .register-section {
    padding: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column; gap: 6px;
    overflow-x: auto;
  }
  .register-label {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-dim);
  }
  .register-row {
    display: flex; gap: 6px; align-items: center;
  }
  .nibble-group { display: flex; gap: 2px; }
  .nibble-sep { width: 6px; flex-shrink: 0; }
  .bit-cell {
    width: 20px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border-soft); border-radius: 3px;
    background: #0f0f0f;
    font-size: 0.78rem; font-weight: 700; font-family: monospace;
    color: var(--text-ghost);
  }
  .bit-cell[data-val="1"] { color: var(--accent-pale); }
  .bit-cell.active { border-color: var(--accent); background: var(--surface-dark); }
  .bit-cell.lsb-glow {
    border-color: #ca8a04;
    box-shadow: 0 0 8px rgba(202,138,4,0.5);
    color: #fde68a;
  }

  .register-indices { display: flex; gap: 6px; }
  .nibble-idx-group { display: flex; gap: 2px; }
  .bit-idx {
    width: 20px; flex-shrink: 0; text-align: center;
    font-size: 0.5rem; color: var(--text-ghost); font-family: monospace;
  }
  .nibble-idx-sep { width: 6px; flex-shrink: 0; }

  /* panel-box */
  .panel-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .panel-title {
    font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
  }

  /* variable boxes */
  .var-main { display: flex; gap: 10px; }
  .var-box {
    flex: 1; padding: 10px 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .var-box.count-accent { border-color: #166534; }
  .var-box.lsb-accent   { border-color: #854d0e; }
  .var-label    { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); }
  .var-val      { font-size: 1.4rem; font-weight: 700; color: var(--text-bright); }
  .var-sub-val  { font-size: 0.72rem; font-family: monospace; color: var(--text-dim); }

  /* code */
  .code-header {
    padding: 4px 2px 10px; font-size: 0.72rem; font-weight: 600;
    color: var(--text-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .code-body { font-size: 0.78rem; line-height: 1.75; white-space: pre; }
  .code-line { display: flex; align-items: center; padding: 0 4px; border-left: 2px solid transparent; }
  .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
  .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }

  /* legend */
  .legend-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-faint); }
  .legend-dot { width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid; }

  /* sidebar desc */
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #step-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }

  .kw { color: var(--purple); }
  .fn { color: var(--blue); }
  .op { color: var(--text); }
  .nb { color: var(--green); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:180px;">
      <option value="">— custom —</option>
      <option value="11" selected>11</option>
      <option value="7">7</option>
      <option value="128">128</option>
      <option value="0">0</option>
      <option value="4294967293">0xFFFFFFFD</option>
      <option value="255">255</option>
      <option value="1023">1023</option>
    </select>
  </div>
  <div>
    <label>n (decimal or 0x hex)</label>
    <input id="inp-n" type="text" value="11" style="width:160px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
  <label class="vi-chk">
    <input type="checkbox" id="chk-kernighan" style="accent-color:var(--accent)" />
    Kernighan trick
  </label>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Number of 1 Bits</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="register-section">
      <div class="register-label">32-bit register &mdash; MSB left, LSB right</div>
      <div class="register-row" id="register-row">
        <span style="color:var(--text-dim);font-size:0.82rem">Enter a number and click Run.</span>
      </div>
      <div class="register-indices" id="register-indices"></div>
      <div class="legend-row">
        <div class="legend-item">
          <div class="legend-dot" style="border-color:#ca8a04;background:rgba(202,138,4,0.15)"></div>
          LSB being read
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="border-color:var(--accent);background:var(--surface-dark)"></div>
          active bit
        </div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Variables</div>
      <div class="var-main">
        <div class="var-box">
          <div class="var-label">n</div>
          <div class="var-val" id="vv-n">&mdash;</div>
          <div class="var-sub-val" id="vv-n-hex">&mdash;</div>
        </div>
        <div class="var-box lsb-accent">
          <div class="var-label">n &amp; 1</div>
          <div class="var-val" id="vv-lsb">&mdash;</div>
        </div>
        <div class="var-box count-accent">
          <div class="var-label">count</div>
          <div class="var-val" id="vv-count">&mdash;</div>
        </div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-header">
      <span id="code-lang-label">Python</span>
    </div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-title">Step</div>
    <div id="step-desc">Enter a number and click Run.</div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var useKernighan = false;

var CODE_SHIFT = [
  [1, '<span class="kw">def</span> <span class="fn">hammingWeight</span><span class="op">(</span>n<span class="op">):</span>'],
  [2, '    count <span class="op">=</span> <span class="nb">0</span>'],
  [0, ''],
  [3, '    <span class="kw">while</span> n <span class="op">!=</span> <span class="nb">0</span><span class="op">:</span>'],
  [4, '        count <span class="op">+=</span> n <span class="op">&amp;</span> <span class="nb">1</span>'],
  [5, '        n <span class="op">&gt;&gt;=</span> <span class="nb">1</span>'],
  [0, ''],
  [6, '    <span class="kw">return</span> count'],
];

var CODE_KERN = [
  [1, '<span class="kw">def</span> <span class="fn">hammingWeight</span><span class="op">(</span>n<span class="op">):</span>'],
  [2, '    count <span class="op">=</span> <span class="nb">0</span>'],
  [0, ''],
  [3, '    <span class="kw">while</span> n <span class="op">!=</span> <span class="nb">0</span><span class="op">:</span>'],
  [4, '        n <span class="op">&amp;=</span> n <span class="op">-</span> <span class="nb">1</span>'],
  [5, '        count <span class="op">+=</span> <span class="nb">1</span>'],
  [0, ''],
  [6, '    <span class="kw">return</span> count'],
];

function toBits(n) {
  var bits = [];
  for (var i = 31; i >= 0; i--) bits.push((n >>> i) & 1);
  return bits;
}

function toHex(n) {
  return '0x' + (n >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel(false);
  nav = window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  document.getElementById('chk-kernighan').addEventListener('change', function() {
    useKernighan = this.checked;
    buildCodePanel(useKernighan);
    buildAndRun();
  });

  buildAndRun();
});

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  var descEl = document.getElementById('step-desc');
  if (descEl) descEl.textContent = snap.desc || '';
}

function buildCodePanel(kernighan) {
  var CODE = kernighan ? CODE_KERN : CODE_SHIFT;
  var lbl = document.getElementById('code-lang-label');
  if (lbl) lbl.textContent = kernighan ? 'Python — Kernighan trick' : 'Python — right-shift';
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="code-line"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function buildAndRun() {
  tryLoad(document.getElementById('inp-n').value.trim());
}

function tryLoad(raw) {
  var n;
  if (raw.toLowerCase().startsWith('0x')) n = parseInt(raw, 16);
  else n = parseInt(raw, 10);
  if (isNaN(n)) return;
  n = n >>> 0;
  buildRegister(toBits(n));
  simSteps = useKernighan ? simulateKernighan(n) : simulateShift(n);
  nav.load(simSteps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  document.getElementById('inp-n').value = sel.value;
  buildAndRun();
}

function randomExample() {
  var n = Math.floor(Math.random() * 1024);
  document.getElementById('inp-n').value = String(n);
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildRegister(bits) {
  var row    = document.getElementById('register-row');
  var idxRow = document.getElementById('register-indices');
  row.innerHTML    = '';
  idxRow.innerHTML = '';

  for (var g = 0; g < 8; g++) {
    if (g > 0) {
      var sep = document.createElement('div');
      sep.className = 'nibble-sep';
      row.appendChild(sep);

      var idxSep = document.createElement('div');
      idxSep.className = 'nibble-idx-sep';
      idxRow.appendChild(idxSep);
    }

    var grp    = document.createElement('div');
    grp.className = 'nibble-group';
    var idxGrp = document.createElement('div');
    idxGrp.className = 'nibble-idx-group';

    for (var b = 0; b < 4; b++) {
      var displayIdx = g * 4 + b;
      var bitNum     = 31 - displayIdx;

      var cell = document.createElement('div');
      cell.className  = 'bit-cell';
      cell.id         = 'bit-' + displayIdx;
      cell.dataset.val = String(bits[displayIdx]);
      cell.textContent = String(bits[displayIdx]);
      grp.appendChild(cell);

      var idxEl = document.createElement('div');
      idxEl.className = 'bit-idx';
      var showLabel = (bitNum === 31) || (bitNum === 23) || (bitNum === 15) || (bitNum === 7) || (bitNum === 0);
      idxEl.textContent = showLabel ? String(bitNum) : '';
      idxGrp.appendChild(idxEl);
    }

    row.appendChild(grp);
    idxRow.appendChild(idxGrp);
  }
}

function updateRegisterBits(bits, highlightIdx, phase) {
  for (var i = 0; i < 32; i++) {
    var cell = document.getElementById('bit-' + i);
    if (!cell) continue;
    cell.textContent  = String(bits[i]);
    cell.dataset.val  = String(bits[i]);
    cell.className    = 'bit-cell';
    if (i === highlightIdx) {
      if (phase === 'mask') cell.classList.add('lsb-glow');
      else cell.classList.add('active');
    }
  }
}

// ── Simulate: right-shift ──────────────────────────────────────────────────
function simulateShift(n0) {
  var steps = [];
  var n     = n0;
  var count = 0;

  function snap(phase, desc, line, nCur, lsb, countCur, hlIdx) {
    steps.push({ phase: phase, desc: desc, line: line,
                 n: nCur, bits: toBits(nCur), lsb: lsb, count: countCur, highlightIdx: hlIdx });
  }

  snap('init', 'n = ' + n0 + ' (' + toHex(n0) + '). count = 0.', 2, n, null, count, -1);

  while (n !== 0) {
    var lsb = n & 1;

    snap('while', 'n = ' + n + ' ≠ 0 → enter loop.', 3, n, null, count, -1);
    snap('mask',  'LSB = n & 1 = ' + lsb + '.', 4, n, lsb, count, 31);

    var newCount = count + lsb;
    if (lsb === 1) {
      snap('add', 'Bit is 1 → count += 1 → ' + newCount + '.', 4, n, lsb, newCount, 31);
    } else {
      snap('add', 'Bit is 0 → count unchanged = ' + count + '.', 4, n, lsb, count, 31);
    }
    count = newCount;

    var nShifted = n >>> 1;
    snap('shift', 'n >>= 1: ' + n + ' → ' + nShifted + '. Shift bits right; MSB becomes 0.', 5, nShifted, lsb, count, -1);
    n = nShifted;
  }

  snap('while', 'n = 0 → exit loop.', 3, 0, null, count, -1);
  snap('done',  'return count = ' + count + '. ' + n0 + ' has ' + count + ' set bit' + (count === 1 ? '' : 's') + '.', 6, 0, null, count, -1);

  return steps;
}

// ── Simulate: Kernighan ────────────────────────────────────────────────────
function simulateKernighan(n0) {
  var steps = [];
  var n     = n0;
  var count = 0;

  function snap(phase, desc, line, nCur, lsb, countCur, hlIdx) {
    steps.push({ phase: phase, desc: desc, line: line,
                 n: nCur, bits: toBits(nCur), lsb: lsb, count: countCur, highlightIdx: hlIdx });
  }

  snap('init', 'n = ' + n0 + ' (' + toHex(n0) + '). count = 0. Each iteration clears the lowest set bit.', 2, n, null, count, -1);

  while (n !== 0) {
    snap('while', 'n = ' + n + ' ≠ 0 → enter loop.', 3, n, null, count, -1);

    // find lowest set bit position for display highlight
    var lsbitPos = 0;
    while (((n >>> lsbitPos) & 1) === 0) lsbitPos++;
    var hlIdx = 31 - lsbitPos;

    var nm1   = (n - 1) >>> 0;
    var nNext = (n & nm1) >>> 0;

    snap('clear', 'n & (n−1): clears lowest set bit (bit ' + lsbitPos + '). ' + n + ' → ' + nNext + '.', 4, nNext, 1, count, hlIdx);
    n = nNext;

    count++;
    snap('add', 'count += 1 → count = ' + count + '.', 5, n, null, count, -1);
  }

  snap('while', 'n = 0 → exit loop.', 3, 0, null, count, -1);
  snap('done',  'return count = ' + count + '. ' + n0 + ' has ' + count + ' set bit' + (count === 1 ? '' : 's') + '.', 6, 0, null, count, -1);

  return steps;
}

// ── Render ─────────────────────────────────────────────────────────────────
function applyStep(s, animate) {
  updateRegisterBits(s.bits, s.highlightIdx, s.phase);
  applyVars(s, animate);
  setCodeLine(s.line);

  if (!animate) return;

  if (s.phase === 'mask' && s.highlightIdx >= 0) {
    var cell = document.getElementById('bit-' + s.highlightIdx);
    if (cell) gsap.fromTo(cell, { scale: 1 }, { scale: 1.25, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out' });
  }

  if (s.phase === 'add' && s.lsb === 1) {
    var cntEl = document.getElementById('vv-count');
    if (cntEl) gsap.fromTo(cntEl, { scale: 1.5, color: '#4ade80' }, { scale: 1, color: '#ffffff', duration: 0.35, ease: 'back.out(1.7)' });
  }

  if (s.phase === 'shift') {
    var cells = [];
    for (var i = 0; i < 32; i++) cells.push(document.getElementById('bit-' + i));
    cells = cells.filter(Boolean);
    gsap.fromTo(cells, { opacity: 0.25 }, { opacity: 1, duration: 0.22, stagger: { each: 0.006, from: 'end' } });
  }

  if (s.phase === 'clear' && s.highlightIdx >= 0) {
    var clrCell = document.getElementById('bit-' + s.highlightIdx);
    if (clrCell) gsap.fromTo(clrCell, { scale: 1.35, opacity: 0.2 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'power2.out' });
  }

  if (s.phase === 'done') {
    var doneEl = document.getElementById('vv-count');
    if (doneEl) gsap.fromTo(doneEl, { scale: 1.4, color: '#4ade80' }, { scale: 1, color: '#ffffff', duration: 0.55, ease: 'elastic.out(1,0.5)' });
  }
}

function applyVars(s, animate) {
  function set(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = (val === null || val === undefined) ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.82, opacity: 0.45 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  set('vv-n',     s.n);
  set('vv-n-hex', toHex(s.n));
  set('vv-lsb',   s.lsb === null || s.lsb === undefined ? null : String(s.lsb));
  set('vv-count', s.count);
}

function setCodeLine(line) {
  var CODE = useKernighan ? CODE_KERN : CODE_SHIFT;
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (ln === line) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

(function() {
  var h = document.getElementById('resize-handle'),
      p = document.getElementById('code-panel'),
      d = false, sx = 0, sw = 0;
  h.addEventListener('mousedown', function(e) { d = true; sx = e.clientX; sw = p.offsetWidth; h.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!d) return; p.style.width = Math.min(560, Math.max(120, sw + (sx - e.clientX))) + 'px'; });
  document.addEventListener('mouseup', function() { if (!d) return; d = false; h.classList.remove('dragging'); });
})();
</script>
</body>
</html>
