<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missing Number</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area { width: 100%; max-width: 90%; }
    .main-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .left-col, .right-col { display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 700px) { .main-row { grid-template-columns: 1fr; } }

    .array-section {
      padding: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column; gap: 6px;
      min-height: 100px;
    }
    .arr-label {
      font-size: 0.62rem; font-family: monospace;
      color: var(--text-ghost); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .arr-row { display: flex; gap: 6px; flex-wrap: nowrap; }
    .arr-cell {
      width: 48px; height: 48px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border-soft); border-radius: 5px;
      background: #0f0f0f;
      font-size: 0.92rem; font-weight: 700; font-family: monospace;
      color: var(--text-ghost);
    }
    .arr-cell[data-state="processed"] { color: var(--text-dim); border-color: #2d3148; }
    .arr-cell[data-state="current"]   { color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); }
    .arr-cell[data-state="missing"]   { color: #86efac; border-color: #15803d; background: #052e16; }

    .arr-cell.idx-cell { background: transparent; border-color: transparent; color: var(--text-faint); font-weight: 600; font-size: 0.8rem; }
    .arr-cell.idx-cell[data-state="current"] { color: #fbbf24; background: transparent; border-color: transparent; }

    .legend {
      display: flex; gap: 14px; margin-top: 4px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-faint); }
    .legend-dot { width: 12px; height: 8px; border-radius: 2px; border: 1px solid var(--border-soft); }
    .legend-dot.current { border-color: var(--accent); background: var(--surface-dark); }
    .legend-dot.processed { border-color: #2d3148; background: #0f0f0f; }
    .legend-dot.missing { border-color: #15803d; background: #052e16; }

    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
    }

    .var-main { display: flex; gap: 10px; }
    .var-box {
      flex: 1; padding: 10px 8px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .var-box.result-accent { border-color: #166534; }
    .var-label  { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); }
    .var-val    { font-size: 1.4rem; font-weight: 700; color: var(--text-bright); }
    .var-bin    { font-size: 0.72rem; font-family: monospace; color: var(--text-muted); letter-spacing: 0.06em; }

    .xor-row {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      padding: 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: monospace; font-size: 0.85rem;
      min-height: 38px;
    }
    .xor-row .op { color: var(--accent); font-weight: 700; padding: 0 2px; }
    .xor-row .arg { color: var(--text-bright); font-weight: 700; }
    .xor-row .lhs { color: var(--text-muted); }
    .xor-row .eq { color: var(--text-faint); }
    .xor-row .new { color: #fbbf24; font-weight: 700; }

    .code-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .code-header {
      padding: 8px 14px; font-size: 0.72rem; font-weight: 600;
      color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg);
      display: flex; justify-content: space-between; align-items: center;
    }
    .code-body { padding: 10px 0; font-size: 0.78rem; line-height: 1.75; flex: 1; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }

    .btn-play {
      background: #15803d; border: none; border-radius: var(--radius-sm);
      color: #fff; cursor: pointer; font-size: 0.88rem; font-weight: 600;
      padding: 9px 16px; transition: background 0.2s;
    }
    .btn-play:hover { background: #166534; }
    .btn-play.playing { background: #c2410c; }
    .btn-play.playing:hover { background: #9a3412; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    .speed-select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 0.85rem; padding: 8px 10px; outline: none; width: 80px;
    }
    .nav-row { display: flex; gap: 8px; align-items: center; }

    .mode-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .mode-toggle button {
      background: var(--bg); border: none; color: var(--text-muted);
      padding: 7px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .mode-toggle button.active { background: var(--accent); color: #fff; }

    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .op { color: var(--text); }
    .nb { color: var(--green); }
  </style>
</head>
<body class="page">

<div class="page-header">
  <a class="back-link" href="../index.html">&larr; All Algorithms</a>
  <div class="page-title">Missing Number</div>
  <div class="page-sub">LeetCode 268 &middot; Bit Manipulation &middot; O(n) time &middot; O(1) space</div>
</div>

<div class="viz-inputs">
  <div class="field">
    <label>nums</label>
    <input id="inp-nums" type="text" value="3, 0, 1" style="width:220px" />
  </div>
  <div class="field">
    <label>mode</label>
    <div class="mode-toggle">
      <button id="mode-xor" class="active" onclick="setMode('xor')">XOR</button>
      <button id="mode-sum" onclick="setMode('sum')">Sum</button>
    </div>
  </div>
  <button class="btn-primary" onclick="buildAndRun()">Build &amp; Run</button>
</div>

<div class="viz-area">
  <div class="main-row">
    <div class="left-col">
      <div class="array-section" id="array-section">
        <span style="color:var(--text-dim);font-size:0.82rem">Enter nums and click Build &amp; Run.</span>
      </div>
      <div class="code-panel">
        <div class="code-header"><span>Python</span><span id="code-mode-label">XOR</span></div>
        <div class="code-body" id="code-body"></div>
      </div>
    </div>

    <div class="right-col">
      <div style="display:flex;gap:12px">
        <div class="panel-box" style="flex:0 0 auto">
          <div class="nav-row">
            <button class="stepBtn" id="prevBtn" disabled>&larr;</button>
            <button class="stepBtn" id="stepBtn" disabled>&rarr;</button>
            <button class="playBtn" id="playBtn" disabled>&#9654; Play</button>
            <select class="speedSel" id="speedSel">
              <option value="700">Slow</option>
              <option value="250" selected>Medium</option>
              <option value="80">Fast</option>
            </select>
          </div>
        </div>
        <div class="panel-box" style="flex:1;min-width:0">
          <div class="panel-title" id="phase-label">&mdash;</div>
          <div style="font-size:0.82rem;color:var(--text-muted);margin-top:2px" id="step-desc">Enter nums and click Build &amp; Run.</div>
        </div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Variables</div>
        <div class="var-main">
          <div class="var-box">
            <div class="var-label" id="vv-i-lbl">i</div>
            <div class="var-val" id="vv-i">&mdash;</div>
          </div>
          <div class="var-box result-accent">
            <div class="var-label" id="vv-res-lbl">result</div>
            <div class="var-val" id="vv-res">&mdash;</div>
            <div class="var-bin" id="vv-res-bin">&mdash;</div>
          </div>
        </div>
      </div>

      <div class="panel-box">
        <div class="panel-title" id="op-title">XOR Operation</div>
        <div class="xor-row" id="xor-row">
          <span class="lhs">result</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var simSteps = [], nav;
var numLen = 0;
var currentMode = 'xor';
var currentNums = [];

var CODE_XOR = [
  [1, '<span class="kw">def</span> <span class="fn">missing_number</span><span class="op">(</span>nums<span class="op">):</span>'],
  [2, '    result <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>nums<span class="op">)</span>'],
  [3, '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="bi">len</span><span class="op">(</span>nums<span class="op">)):</span>'],
  [4, '        result <span class="op">^=</span> i'],
  [5, '        result <span class="op">^=</span> nums<span class="op">[</span>i<span class="op">]</span>'],
  [6, '    <span class="kw">return</span> result'],
];

var CODE_SUM = [
  [1, '<span class="kw">def</span> <span class="fn">missing_number</span><span class="op">(</span>nums<span class="op">):</span>'],
  [2, '    n <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>nums<span class="op">)</span>'],
  [3, '    expected <span class="op">=</span> n <span class="op">*</span> <span class="op">(</span>n <span class="op">+</span> <span class="nb">1</span><span class="op">)</span> <span class="op">//</span> <span class="nb">2</span>'],
  [4, '    actual <span class="op">=</span> <span class="nb">0</span>'],
  [5, '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>n<span class="op">):</span>'],
  [6, '        actual <span class="op">+=</span> nums<span class="op">[</span>i<span class="op">]</span>'],
  [7, '    <span class="kw">return</span> expected <span class="op">-</span> actual'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var phaseEl = document.getElementById('phase-label');
      var descEl  = document.getElementById('step-desc');
      if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
      if (descEl)  descEl.textContent  = snap.desc;
    }
  });
});

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-xor').classList.toggle('active', mode === 'xor');
  document.getElementById('mode-sum').classList.toggle('active', mode === 'sum');
  document.getElementById('code-mode-label').textContent = mode === 'xor' ? 'XOR' : 'Sum';
  document.getElementById('op-title').textContent = mode === 'xor' ? 'XOR Operation' : 'Sum Accumulator';
  document.getElementById('vv-res-lbl').textContent = mode === 'xor' ? 'result' : 'actual';
  buildCodePanel();
  if (currentNums.length) buildAndRun();
}

function buildCodePanel() {
  var body = document.getElementById('code-body');
  var CODE = currentMode === 'xor' ? CODE_XOR : CODE_SUM;
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="code-line"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var raw = document.getElementById('inp-nums').value;
  var nums = raw.split(',').map(function(x) { return parseInt(x.trim()); }).filter(function(x) { return !isNaN(x); });
  if (nums.length < 1) return;
  // Validate: should be distinct from [0..n] with one missing
  var n = nums.length;
  var seen = {};
  for (var k = 0; k < nums.length; k++) {
    if (nums[k] < 0 || nums[k] > n || seen[nums[k]]) return;
    seen[nums[k]] = true;
  }
  currentNums = nums;
  numLen = nums.length;
  buildArraySection(nums);
  simSteps = currentMode === 'xor' ? simulateXor(nums) : simulateSum(nums);
  nav.load(simSteps);
}

function buildArraySection(nums) {
  var sec = document.getElementById('array-section');
  sec.innerHTML =
    '<div class="arr-label">nums[i]</div>' +
    '<div class="arr-row" id="arr-row"></div>' +
    '<div class="arr-label">index i</div>' +
    '<div class="arr-row" id="idx-row"></div>' +
    '<div class="legend">' +
      '<div class="legend-item"><div class="legend-dot current"></div>current</div>' +
      '<div class="legend-item"><div class="legend-dot processed"></div>processed</div>' +
      '<div class="legend-item"><div class="legend-dot missing"></div>missing slot</div>' +
    '</div>';

  var arrRow = document.getElementById('arr-row');
  var idxRow = document.getElementById('idx-row');

  nums.forEach(function(v, i) {
    var cell = document.createElement('div');
    cell.className = 'arr-cell'; cell.id = 'ac-' + i; cell.dataset.state = 'idle';
    cell.textContent = v; arrRow.appendChild(cell);

    var idx = document.createElement('div');
    idx.className = 'arr-cell idx-cell'; idx.id = 'ix-' + i; idx.dataset.state = 'idle';
    idx.textContent = i; idxRow.appendChild(idx);
  });

  // also display n as a trailing index cell (for XOR: result starts at n)
  var nCell = document.createElement('div');
  nCell.className = 'arr-cell idx-cell'; nCell.id = 'ix-n';
  nCell.textContent = nums.length; nCell.style.color = 'var(--accent-pale)';
  idxRow.appendChild(nCell);
}

function simulateXor(nums) {
  var n = nums.length;
  var steps = [];
  var result = n;
  var cellStates = Array.from({length: n}, function() { return 'idle'; });

  steps.push({
    phase: 'Init', desc: 'result = n = ' + n + '. (XOR identity: a ^ a = 0, so we XOR all indices 0..n and all values; the missing index survives.)',
    lines: [2], cellStates: cellStates.slice(),
    i: null, result: result, op: { lhs: 'init', arg: n, kind: 'init', newVal: result }
  });

  for (var i = 0; i < n; i++) {
    cellStates[i] = 'current';

    var prev = result;
    result ^= i;
    steps.push({
      phase: 'Loop · XOR index', desc: 'result ^= i  ⟶  ' + prev + ' ^ ' + i + ' = ' + result + '.',
      lines: [3, 4], cellStates: cellStates.slice(),
      i: i, result: result, op: { lhs: prev, arg: i, kind: 'idx', newVal: result }
    });

    var prev2 = result;
    result ^= nums[i];
    steps.push({
      phase: 'Loop · XOR value', desc: 'result ^= nums[' + i + ']  ⟶  ' + prev2 + ' ^ ' + nums[i] + ' = ' + result + '.',
      lines: [3, 5], cellStates: cellStates.slice(),
      i: i, result: result, op: { lhs: prev2, arg: nums[i], kind: 'val', newVal: result }
    });

    cellStates[i] = 'processed';
  }

  // Mark missing
  var missingIdx = result; // the missing value equals the surviving index
  steps.push({
    phase: 'Done', desc: 'return result = ' + result + '. Every paired (index, value) cancels to 0; only the missing value survives.',
    lines: [6], cellStates: cellStates.slice(),
    i: null, result: result, op: { lhs: 'return', arg: result, kind: 'done', newVal: result },
    missing: missingIdx
  });

  return steps;
}

function simulateSum(nums) {
  var n = nums.length;
  var steps = [];
  var expected = n * (n + 1) / 2;
  var actual = 0;
  var cellStates = Array.from({length: n}, function() { return 'idle'; });

  steps.push({
    phase: 'Init', desc: 'expected = n*(n+1)/2 = ' + n + '*' + (n+1) + '/2 = ' + expected + '. actual = 0.',
    lines: [3, 4], cellStates: cellStates.slice(),
    i: null, result: actual, expected: expected, op: { lhs: 'expected', arg: expected, kind: 'init', newVal: actual }
  });

  for (var i = 0; i < n; i++) {
    cellStates[i] = 'current';
    var prev = actual;
    actual += nums[i];
    steps.push({
      phase: 'Loop · Sum', desc: 'actual += nums[' + i + ']  ⟶  ' + prev + ' + ' + nums[i] + ' = ' + actual + '.',
      lines: [5, 6], cellStates: cellStates.slice(),
      i: i, result: actual, expected: expected, op: { lhs: prev, arg: nums[i], kind: 'val', newVal: actual }
    });
    cellStates[i] = 'processed';
  }

  var missing = expected - actual;
  steps.push({
    phase: 'Done', desc: 'return expected - actual = ' + expected + ' - ' + actual + ' = ' + missing + '.',
    lines: [7], cellStates: cellStates.slice(),
    i: null, result: actual, expected: expected,
    op: { lhs: expected, arg: actual, kind: 'done', newVal: missing },
    missing: missing
  });

  return steps;
}

function applyStep(s, animate) {
  applyArrayCells(s.cellStates, s.i, s.missing, animate);
  applyVars(s, animate);
  applyOp(s.op, animate);
  setCodeLines(s.lines);
}

function applyArrayCells(states, curI, missing, animate) {
  states.forEach(function(state, i) {
    var el = document.getElementById('ac-' + i);
    var ix = document.getElementById('ix-' + i);
    if (el) el.dataset.state = state;
    if (ix) ix.dataset.state = (curI === i) ? 'current' : 'idle';
  });
  // missing reveal: highlight the index cell that matches missing value
  if (missing != null) {
    var target = document.getElementById('ix-' + missing);
    if (!target && missing === states.length) target = document.getElementById('ix-n');
    if (target) {
      target.dataset.state = 'current';
      target.style.color = '#86efac';
      if (animate) gsap.fromTo(target, { scale: 0.6 }, { scale: 1.4, duration: 0.4, ease: 'back.out(2)', yoyo: true, repeat: 1 });
    }
  } else {
    var nCell = document.getElementById('ix-n');
    if (nCell) nCell.style.color = 'var(--accent-pale)';
  }
  if (animate && curI != null) {
    var cur = document.getElementById('ac-' + curI);
    if (cur) gsap.fromTo(cur, { scale: 0.85 }, { scale: 1, duration: 0.25, ease: 'back.out(1.6)' });
  }
}

function applyVars(s, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val == null ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setVal('vv-i',   s.i);
  setVal('vv-res', s.result);
  var binEl = document.getElementById('vv-res-bin');
  if (binEl) {
    if (currentMode === 'xor' && s.result != null) {
      binEl.textContent = '0b' + (s.result >>> 0).toString(2);
    } else if (currentMode === 'sum') {
      binEl.textContent = s.expected != null ? 'expected ' + s.expected : '—';
    } else {
      binEl.textContent = '—';
    }
  }
}

function applyOp(op, animate) {
  var row = document.getElementById('xor-row');
  if (!op) { row.innerHTML = '<span class="lhs">—</span>'; return; }
  var sym = currentMode === 'xor' ? '^' : '+';
  var html = '';
  if (op.kind === 'init') {
    html = '<span class="lhs">' + (currentMode === 'xor' ? 'result' : 'actual') + '</span>'
         + '<span class="op">=</span><span class="new">' + op.newVal + '</span>';
  } else if (op.kind === 'done') {
    html = '<span class="lhs">missing</span><span class="op">=</span><span class="new">' + op.newVal + '</span>';
  } else {
    html = '<span class="lhs">' + op.lhs + '</span>'
         + '<span class="op">' + sym + '</span>'
         + '<span class="arg">' + op.arg + '</span>'
         + '<span class="eq">=</span>'
         + '<span class="new">' + op.newVal + '</span>';
  }
  row.innerHTML = html;
  if (animate) gsap.fromTo(row, { opacity: 0.3, y: -4 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' });
}

function setCodeLines(lines) {
  var CODE = currentMode === 'xor' ? CODE_XOR : CODE_SUM;
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>
  <script>
    if (window.self !== window.top) {
      var bl = document.querySelector('.back-link');
      if (bl) bl.style.display = 'none';
    }
  </script>
</body>
</html>
