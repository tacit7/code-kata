<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validate BST</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; color: #fff; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .code-panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .viz-inputs input[type="text"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; }
    .viz-inputs select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }

    .tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; width: 100%; }
    #tree-svg { display: block; width: 100%; }

    #step-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }

    .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 16px; display: flex; flex-direction: column; gap: 8px; }
    .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); }

    .range-row { display: flex; align-items: center; gap: 6px; }
    .range-slot { flex: 1; background: var(--surface-dark); border: 1px solid var(--border); border-radius: 6px; padding: 8px 8px; font-family: 'JetBrains Mono', monospace; text-align: center; }
    .range-slot.node-slot { border-color: #4f46e5; }
    .rs-label { color: var(--text-dim); font-size: 0.65rem; margin-bottom: 4px; white-space: nowrap; }
    .rs-val { color: var(--text-bright); font-size: 1.05rem; font-weight: 700; }
    .rs-val.faint { color: var(--text-faint); }
    .range-op { color: var(--text-dim); font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }

    .check-badge { margin-top: 9px; font-size: 0.82rem; font-weight: 700; padding: 5px 12px; border-radius: 6px; display: none; }
    .check-badge.pass { display: block; background: #052e16; color: #4ade80; border: 1px solid #16a34a; }
    .check-badge.fail { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }

    #call-stack { display: flex; flex-direction: column-reverse; gap: 4px; min-height: 36px; max-height: 180px; overflow-y: auto; }
    .cs-frame { background: #1e1a3a; color: #a5b4fc; border: 1px solid #4f46e5; border-radius: 5px; padding: 4px 10px; font-size: 0.76rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cs-frame.top { background: #312e81; color: #e0e7ff; }
    .cs-range { color: #6366f1; font-size: 0.7rem; font-weight: 400; white-space: nowrap; }
    .cs-frame.top .cs-range { color: #a5b4fc; }
    .cs-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }

    .result-badge { font-size: 0.95rem; font-weight: 700; padding: 10px 16px; border-radius: 8px; text-align: center; display: none; }
    .result-badge.bst-valid   { background: #052e16; color: #4ade80; border: 1px solid #16a34a; display: block; }
    .result-badge.bst-invalid { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; display: block; }

    .code-body { padding: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; line-height: 1.75; overflow-x: auto; }
    .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 14px 0 0; white-space: pre; }
    .cl .ln { width: 28px; min-width: 28px; text-align: right; color: #3d4468; user-select: none; padding-right: 14px; font-size: 0.72rem; line-height: 1.75; }
    .cl .code { color: var(--text-muted); }

    .leg-item { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; color: var(--text-muted); }

    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .cm { color: #3d4468; font-style: italic; }
    .op { color: var(--text); }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="preset-sel" onchange="applyPreset()">
      <option value="5,3,7,2,4,6,8">Valid BST</option>
      <option value="5,3,7,2,6">Invalid BST (6 tricks naive check)</option>
    </select>
  </div>
  <div class="field">
    <label>Tree (level-order, null for empty)</label>
    <input id="inp-tree" type="text" value="5,3,7,2,4,6,8" style="width:260px" />
  </div>
  <button class="btn-primary" onclick="build()">Build &amp; Run</button>
  <button onclick="randomExample()" style="padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.85rem">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">Validate BST</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="step-desc">Choose a preset and click Build &amp; Run.</div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Range Constraint</div>
      <div class="range-row">
        <div class="range-slot">
          <div class="rs-label">lo (excl. lower)</div>
          <div class="rs-val faint" id="rv-lo">&#8212;</div>
        </div>
        <div class="range-op">&lt;</div>
        <div class="range-slot node-slot">
          <div class="rs-label">node.val</div>
          <div class="rs-val" id="rv-val">&#8212;</div>
        </div>
        <div class="range-op">&lt;</div>
        <div class="range-slot">
          <div class="rs-label">hi (excl. upper)</div>
          <div class="rs-val faint" id="rv-hi">&#8212;</div>
        </div>
      </div>
      <div class="check-badge" id="check-badge"></div>
    </div>
    <div class="panel-box">
      <div class="panel-title">
        Call Stack
        <span style="font-size:0.65rem;font-weight:400;color:var(--text-faint);margin-left:6px">(top = active)</span>
      </div>
      <div id="call-stack"><span class="cs-empty">empty</span></div>
    </div>
    <div class="result-badge" id="result-badge"></div>
    <div class="panel-box">
      <div class="panel-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1e2130" stroke="#2d3148" stroke-width="2"/></svg>Unvisited</div>
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#312e81" stroke="#818cf8" stroke-width="3"/></svg>Active (checking now)</div>
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1e1a3a" stroke="#4f46e5" stroke-width="2"/></svg>On call stack</div>
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#052e16" stroke="#16a34a" stroke-width="2"/></svg>Valid</div>
        <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#450a0a" stroke="#dc2626" stroke-width="2"/></svg>Invalid</div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ─── Code lines ───────────────────────────────────────────────────────────────
const CODE_LINES = [
  [1, `<span class="kw">def</span> <span class="fn">isValidBST</span><span class="op">(</span>root<span class="op">,</span> lo<span class="op">=-</span><span class="bi">inf</span><span class="op">,</span> hi<span class="op">=</span><span class="bi">inf</span><span class="op">):</span>`],
  [2, `    <span class="kw">if</span> <span class="kw">not</span> root<span class="op">:</span>`],
  [3, `        <span class="kw">return</span> <span class="bi">True</span>             <span class="cm"># null is always valid</span>`],
  [0, ``],
  [4, `    <span class="kw">if</span> root.val <span class="op">&lt;=</span> lo <span class="kw">or</span> root.val <span class="op">&gt;=</span> hi<span class="op">:</span>`],
  [5, `        <span class="kw">return</span> <span class="bi">False</span>            <span class="cm"># out of valid range</span>`],
  [0, ``],
  [6, `    <span class="kw">return</span> <span class="op">(</span><span class="fn">isValidBST</span><span class="op">(</span>root.left<span class="op">,</span>  lo<span class="op">,</span>       root.val<span class="op">)</span> <span class="kw">and</span>`],
  [7, `            <span class="fn">isValidBST</span><span class="op">(</span>root.right<span class="op">,</span> root.val<span class="op">,</span> hi<span class="op">))</span>`],
];

// ─── Colors ───────────────────────────────────────────────────────────────────
const COLORS = {
  idle:       { fill: '#1e2130', stroke: '#2d3148', text: '#565f89', sw: 2 },
  active:     { fill: '#1e1a3a', stroke: '#4f46e5', text: '#a5b4fc', sw: 2 },
  active_top: { fill: '#312e81', stroke: '#818cf8', text: '#e0e7ff', sw: 3.5 },
  valid:      { fill: '#052e16', stroke: '#16a34a', text: '#4ade80', sw: 2 },
  invalid:    { fill: '#450a0a', stroke: '#dc2626', text: '#fca5a5', sw: 2 },
};

// ─── Globals ──────────────────────────────────────────────────────────────────
let nodeMap = {};
let R = 22;
let VW = 800, VH = 300;
let prevLines = [];

// ─── Parse level-order ───────────────────────────────────────────────────────
function parseLevelOrder(s) {
  return s.split(',').map(t => t.trim()).map(t =>
    (t === '' || t.toLowerCase() === 'null' || t === 'n') ? null : Number(t)
  );
}

// ─── Build tree ──────────────────────────────────────────────────────────────
let nextId = 0;
function buildTree(vals) {
  nodeMap = {};
  nextId = 0;
  if (!vals.length || vals[0] === null) return null;
  const make = val => {
    const n = { id: nextId++, val, left: null, right: null, x: 0, y: 0, depth: 0 };
    nodeMap[n.id] = n;
    return n;
  };
  const root = make(vals[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < vals.length) {
    const cur = queue.shift();
    if (i < vals.length) {
      if (vals[i] !== null) { cur.left = make(vals[i]); cur.left.depth = cur.depth + 1; queue.push(cur.left); }
      i++;
    }
    if (i < vals.length) {
      if (vals[i] !== null) { cur.right = make(vals[i]); cur.right.depth = cur.depth + 1; queue.push(cur.right); }
      i++;
    }
  }
  return root;
}

// ─── Layout (inorder x, depth y) ─────────────────────────────────────────────
function layout(root) {
  let idx = 0, maxD = 0;
  function inorder(n) {
    if (!n) return;
    inorder(n.left);
    n._inIdx = idx++;
    if (n.depth > maxD) maxD = n.depth;
    inorder(n.right);
  }
  inorder(root);
  const count = idx;
  const xSpace = Math.max(60, Math.min(110, 680 / Math.max(1, count)));
  const ySpace = 76;
  const padX = 50, padY = 36;
  VW = Math.max(480, padX * 2 + (count - 1) * xSpace);
  VH = padY * 2 + maxD * ySpace + R * 2 + 52;
  for (const id in nodeMap) {
    const n = nodeMap[id];
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + 26 + n.depth * ySpace + R;
  }
}

// ─── SVG helpers ─────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id;
  return g;
}

// ─── Render SVG ──────────────────────────────────────────────────────────────
function renderSVG(root) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  R = VW > 650 ? 22 : 18;

  const edgeG = svgG('edges');
  const nodeG = svgG('nodes');
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  (function drawEdges(n) {
    if (!n) return;
    [n.left, n.right].forEach(c => {
      if (!c) return;
      edgeG.appendChild(svgEl('line', {
        id: `edge-${n.id}-${c.id}`,
        x1: n.x, y1: n.y, x2: c.x, y2: c.y,
        stroke: '#2d3148', 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);

  for (const id in nodeMap) {
    const n = nodeMap[id];
    const g = svgG(`node-g-${n.id}`);

    g.appendChild(svgEl('circle', {
      id: `nc-${n.id}`, cx: n.x, cy: n.y, r: R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': COLORS.idle.sw,
    }));

    const t = svgEl('text', {
      id: `nt-${n.id}`, x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.round(R * 0.75), 'font-weight': 'bold',
      'font-family': 'JetBrains Mono, monospace',
    });
    t.textContent = n.val;
    g.appendChild(t);

    const rt = svgEl('text', {
      id: `nr-${n.id}`, x: n.x, y: n.y + R + 14,
      'text-anchor': 'middle', 'dominant-baseline': 'hanging',
      fill: '#818cf8', 'font-size': 10, 'font-weight': '600',
      'font-family': 'JetBrains Mono, monospace',
      opacity: 0,
    });
    rt.textContent = '';
    g.appendChild(rt);

    nodeG.appendChild(g);
  }
}

// ─── Simulation ───────────────────────────────────────────────────────────────
function simulate(root) {
  const stateMap = {};
  for (const id in nodeMap) stateMap[id] = 'idle';
  const callStack = [];
  const out = [];

  function loStr(v) { return v === null ? '-∞' : String(v); }
  function hiStr(v) { return v === null ? '+∞' : String(v); }
  function rng(lo, hi) { return '[' + loStr(lo) + ', ' + hiStr(hi) + ']'; }

  function snap(phase, desc, lines, activeId, lo, hi) {
    out.push({
      phase, desc, lines: lines || [],
      stateMap: { ...stateMap },
      callStack: callStack.map(f => ({ ...f })),
      activeId: activeId !== undefined ? activeId : null,
      lo: lo !== undefined ? lo : null,
      hi: hi !== undefined ? hi : null,
    });
  }

  function dfs(node, lo, hi) {
    if (!node) {
      callStack.push({ label: 'null', lo, hi, nodeId: null });
      snap('Base', 'Node is null → always valid, return True.', [2, 3], null, lo, hi);
      callStack.pop();
      return true;
    }

    callStack.push({ label: 'node(' + node.val + ')', lo, hi, nodeId: node.id });
    stateMap[node.id] = 'active';
    snap('Enter', 'Visit node ' + node.val + '. Valid range: ' + rng(lo, hi) + '.', [1, 2], node.id, lo, hi);

    const failsLo = lo !== null && node.val <= lo;
    const failsHi = hi !== null && node.val >= hi;

    snap('Check', 'Check: is ' + node.val + ' strictly inside ' + rng(lo, hi) + '?', [4], node.id, lo, hi);

    if (failsLo || failsHi) {
      const why = failsLo
        ? node.val + ' ≤ ' + lo + ' (not > lower bound)'
        : node.val + ' ≥ ' + hi + ' (not < upper bound)';
      stateMap[node.id] = 'invalid';
      snap('Fail', 'INVALID: ' + why + '. Short-circuit → return False.', [4, 5], node.id, lo, hi);
      callStack.pop();
      return false;
    }

    snap('Pass', node.val + ' ∈ ' + rng(lo, hi) + '. Range check passed. Recurse into children.', [4], node.id, lo, hi);

    snap('Left', 'Recurse left: hi tightens to ' + node.val + '. New range ' + rng(lo, node.val) + '.', [6], node.id, lo, hi);
    const leftOk = dfs(node.left, lo, node.val);

    if (!leftOk) {
      stateMap[node.id] = 'invalid';
      snap('PropFail', 'Left subtree invalid → node ' + node.val + ' returns False.', [6], node.id, lo, hi);
      callStack.pop();
      return false;
    }

    snap('Right', 'Left OK. Recurse right: lo tightens to ' + node.val + '. New range ' + rng(node.val, hi) + '.', [7], node.id, lo, hi);
    const rightOk = dfs(node.right, node.val, hi);

    if (!rightOk) {
      stateMap[node.id] = 'invalid';
      snap('PropFail', 'Right subtree invalid → node ' + node.val + ' returns False.', [7], node.id, lo, hi);
      callStack.pop();
      return false;
    }

    stateMap[node.id] = 'valid';
    snap('Return', 'Both subtrees valid. Node ' + node.val + ' → return True.', [6, 7], node.id, lo, hi);
    callStack.pop();
    return true;
  }

  snap('Start', 'Begin isValidBST at root=' + root.val + '. Initial range: [-∞, +∞].', [1]);
  const result = dfs(root, null, null);
  snap('Done',
    result
      ? '✓ BST is VALID — all nodes satisfy their range constraints.'
      : '✗ BST is INVALID — a node violated its range constraint.',
    [], null, null, null);
  return out;
}

// ─── Node color ───────────────────────────────────────────────────────────────
function setNodeColor(id, colorKey, animate) {
  const c = COLORS[colorKey] || COLORS.idle;
  const nc = document.getElementById('nc-' + id);
  const nt = document.getElementById('nt-' + id);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: 0.28, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke, 'stroke-width': c.sw } });
    if (nt) gsap.to(nt, { duration: 0.28, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill);
    nc.setAttribute('stroke', c.stroke);
    nc.setAttribute('stroke-width', c.sw);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

// ─── Code line highlighting ───────────────────────────────────────────────────
function setCodeLines(oldLines, newLines, animate) {
  const HL_BG   = 'rgba(var(--accent-ch),0.16)';
  const NO_BG   = 'rgba(var(--accent-ch),0)';
  const HL_BORD = '#818cf8';
  const NO_BORD = 'transparent';
  (oldLines || []).filter(n => !(newLines || []).includes(n)).forEach(n => {
    const el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: NO_BG, borderLeftColor: NO_BORD, duration: 0.2 });
    else { el.style.backgroundColor = ''; el.style.borderLeftColor = ''; }
  });
  (newLines || []).filter(n => !(oldLines || []).includes(n)).forEach(n => {
    const el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: 0.2, delay: 0.05 });
    else { el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD; }
  });
}

// ─── Call stack ──────────────────────────────────────────────────────────────
function renderCallStack(stack, animate) {
  const c = document.getElementById('call-stack');
  c.innerHTML = '';
  if (!stack.length) {
    c.innerHTML = '<span class="cs-empty">empty</span>';
    return;
  }
  const fmtLo = v => v === null ? '-∞' : String(v);
  const fmtHi = v => v === null ? '+∞' : String(v);
  stack.forEach((frame, i) => {
    const el = document.createElement('div');
    el.className = 'cs-frame' + (i === stack.length - 1 ? ' top' : '');
    el.innerHTML =
      '<span>' + frame.label + '</span>' +
      '<span class="cs-range">[' + fmtLo(frame.lo) + ', ' + fmtHi(frame.hi) + ']</span>';
    c.appendChild(el);
    if (animate && i === stack.length - 1) gsap.from(el, { opacity: 0, x: -8, duration: 0.18 });
  });
}

// ─── Apply step ───────────────────────────────────────────────────────────────
function applyStep(s, animate) {
  Object.entries(s.stateMap).forEach(([id, state]) => {
    const colorKey = (state === 'active' && +id === s.activeId) ? 'active_top' : state;
    setNodeColor(+id, colorKey, animate);
  });

  for (const id in nodeMap) {
    const rt = document.getElementById('nr-' + id);
    if (!rt) continue;
    if (s.activeId !== null && +id === s.activeId) {
      const lo = s.lo === null ? '-∞' : String(s.lo);
      const hi = s.hi === null ? '+∞' : String(s.hi);
      rt.textContent = '[' + lo + ', ' + hi + ']';
      if (animate) gsap.to(rt, { opacity: 1, duration: 0.2 });
      else rt.setAttribute('opacity', '1');
    } else {
      rt.textContent = '';
      rt.setAttribute('opacity', '0');
    }
  }

  const setRV = function(id, val, faint) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = val;
    el.className = 'rs-val' + (faint ? ' faint' : '');
    if (animate) gsap.fromTo(el, { opacity: 0.3 }, { opacity: 1, duration: 0.18 });
  };
  if (s.activeId !== null) {
    const node = nodeMap[s.activeId];
    const loTxt = s.lo === null ? '-∞' : String(s.lo);
    const hiTxt = s.hi === null ? '+∞' : String(s.hi);
    setRV('rv-lo',  loTxt, s.lo === null);
    setRV('rv-val', node ? String(node.val) : '—', false);
    setRV('rv-hi',  hiTxt, s.hi === null);
  } else {
    setRV('rv-lo',  '—', true);
    setRV('rv-val', '—', true);
    setRV('rv-hi',  '—', true);
  }

  const badge = document.getElementById('check-badge');
  if (badge) {
    badge.className = 'check-badge';
    badge.textContent = '';
    if (s.phase === 'Pass') {
      badge.className = 'check-badge pass';
      badge.textContent = '✓ lo < val < hi — constraint satisfied';
    } else if (s.phase === 'Fail') {
      badge.className = 'check-badge fail';
      badge.textContent = '✗ Constraint violated — return False';
    }
  }

  renderCallStack(s.callStack, animate);

  const rb = document.getElementById('result-badge');
  if (rb) {
    if (s.phase === 'Done') {
      const isValid = s.desc.startsWith('✓');
      rb.className = 'result-badge ' + (isValid ? 'bst-valid' : 'bst-invalid');
      rb.textContent = isValid ? '✓ Valid BST' : '✗ Invalid BST';
      if (animate) gsap.from(rb, { opacity: 0, scale: 0.9, duration: 0.35, ease: 'back.out(1.7)' });
    } else {
      rb.style.display = 'none';
      rb.className = 'result-badge';
    }
  }

  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

// ─── Build code panel ─────────────────────────────────────────────────────────
function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

// ─── Preset selector ─────────────────────────────────────────────────────────
function applyPreset() {
  const sel = document.getElementById('preset-sel');
  document.getElementById('inp-tree').value = sel.value;
}

// ─── Random Example ───────────────────────────────────────────────────────
function randomExample() {
  const examples = [
    '5,3,7,2,4,6,8',
    '5,3,7,2,6',
    '10,5,15,2,7,12,20',
    '1,null,2',
    '2,1,3',
    '5,5,5',
    '3,1,5,null,null,4,6',
    '1,2,3',
    '10,5,15,null,null,6',
  ];
  const randomIdx = Math.floor(Math.random() * examples.length);
  document.getElementById('inp-tree').value = examples[randomIdx];
  document.getElementById('preset-sel').value = '';
  build();
}

// ─── Build & Run ──────────────────────────────────────────────────────────────
function build() {
  const txt = document.getElementById('inp-tree').value.trim();
  const vals = parseLevelOrder(txt);
  buildCodePanel();
  const root = buildTree(vals);
  if (!root) {
    document.getElementById('tree-svg').innerHTML = '';
    document.getElementById('step-desc').textContent = 'Empty tree — nothing to validate.';
    return;
  }
  layout(root);
  renderSVG(root);
  prevLines = [];
  document.getElementById('check-badge').className = 'check-badge';
  const rb = document.getElementById('result-badge');
  rb.style.display = 'none';
  rb.className = 'result-badge';
  nav.load(simulate(root));
}

// ─── Init ─────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var pb = document.getElementById('phase-badge');
    if (pb) pb.textContent = snap.phase;
    var sc = document.getElementById('step-counter');
    if (sc) sc.textContent = 'Step ' + (cur + 1) + ' / ' + total;
    var sd = document.getElementById('step-desc');
    if (sd) {
      if (cur > 0) gsap.fromTo(sd, { opacity: 0.5 }, { opacity: 1, duration: 0.15 });
      sd.textContent = snap.desc;
    }
  }
});

build();
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
</body>
