<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Break</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-sec { padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
  .vi-btn-sec:hover { border-color: var(--accent); color: var(--accent-pale); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(var(--accent-ch),0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); } .var-val { color: var(--accent); font-weight: 700; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* PAGE-SPECIFIC */
  .word-track { padding: 20px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; min-height: 130px; width: 100%; }
  .track-inner { display: flex; gap: 6px; flex-wrap: nowrap; align-items: flex-end; }
  .track-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
  .str-cell { width: 48px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 6px; background: #0f0f0f; position: relative; flex-shrink: 0; transition: border-color 0.15s, background 0.15s; }
  .str-cell[data-hi="start"]  { border-color: #b45309; background: #1c0e00; }
  .str-cell[data-hi="end"]    { border-color: var(--accent); background: var(--surface-dark); }
  .str-cell[data-hi="span"]   { border-color: #7c3aed; background: #150d28; }
  .str-cell[data-hi="match"]  { border-color: #15803d; background: #052e16; }
  .str-idx { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 0.5rem; color: var(--text-ghost); font-family: monospace; }
  .str-char { font-size: 1.05rem; font-weight: 700; font-family: monospace; color: var(--text-dim); margin-top: 8px; }
  .str-cell[data-hi="start"]  .str-char { color: #fbbf24; }
  .str-cell[data-hi="end"]    .str-char { color: var(--accent-pale); }
  .str-cell[data-hi="span"]   .str-char { color: #c4b5fd; }
  .str-cell[data-hi="match"]  .str-char { color: #4ade80; }
  .str-spacer { width: 48px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-ghost); font-style: italic; }
  .dp-cell { width: 48px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid var(--border-soft); border-radius: 6px; background: #0f0f0f; position: relative; flex-shrink: 0; border-style: dashed; transition: border-color 0.15s, background 0.15s, border-style 0.15s; }
  .dp-cell[data-state="false"]   { border-style: solid; border-color: #3f1212; }
  .dp-cell[data-state="true"]    { border-style: solid; border-color: #166534; background: #052e16; }
  .dp-cell[data-state="current"] { border-style: solid; border-color: var(--accent); background: var(--surface-dark); }
  .dp-cell[data-state="start"]   { border-style: solid; border-color: #b45309; background: #1c0e00; }
  .dp-cell[data-state="answer"]  { border-style: solid; border-color: #15803d; background: #052e16; box-shadow: 0 0 0 2px #166534; }
  .dp-idx { position: absolute; top: 3px; left: 0; right: 0; text-align: center; font-size: 0.5rem; color: var(--text-ghost); font-family: monospace; }
  .dp-val { font-size: 0.7rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); margin-top: 10px; }
  .dp-cell[data-state="false"]   .dp-val { color: #f87171; }
  .dp-cell[data-state="true"]    .dp-val { color: #4ade80; }
  .dp-cell[data-state="current"] .dp-val { color: var(--accent-pale); }
  .dp-cell[data-state="start"]   .dp-val { color: #fbbf24; }
  .dp-cell[data-state="answer"]  .dp-val { color: #4ade80; font-size: 0.75rem; }
  .dict-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .dict-words { display: flex; flex-wrap: wrap; gap: 6px; }
  .dict-word { padding: 5px 10px; border: 2px solid var(--border); border-radius: 5px; background: var(--bg); font-family: monospace; font-size: 0.82rem; color: var(--text-dim); transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .dict-word.checking { border-color: #7c3aed; color: #c4b5fd; background: #150d28; }
  .dict-word.matched  { border-color: #15803d; color: #4ade80; background: #052e16; }
  .dict-word.no-match { opacity: 0.35; }
  .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .result-badge { font-size: 0.88rem; font-weight: 700; padding: 4px 13px; border-radius: 6px; display: none; width: fit-content; }
  .result-badge.yes { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); display: block; }
  .result-badge.no  { background: #1c0000; color: #f87171; border: 1px solid #7f1d1d; display: block; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>String s</label>
    <input id="inp-s" type="text" value="leetcode" style="width:130px" />
  </div>
  <div>
    <label>Word Dictionary (comma-separated)</label>
    <input id="inp-dict" type="text" value="leet,code" style="width:200px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Build &amp; Run</button>
  <div style="display:flex;gap:6px;align-items:center;margin-left:4px">
    <span style="font-size:0.72rem;color:var(--text-ghost)">Presets:</span>
    <button class="vi-btn-sec" onclick="loadPreset(0)">✓ leetcode</button>
    <button class="vi-btn-sec" onclick="loadPreset(1)">✗ catsandog</button>
    <button class="vi-btn-sec" onclick="loadPreset(2)">⚡ applepenapple</button>
  </div>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Word Break</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Enter a string and dictionary, then click Build &amp; Run.</div>
    <div class="word-track" id="word-track">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter a string and dictionary, then click Build &amp; Run.</span>
    </div>
    <div class="dict-panel" id="dict-panel" style="display:none">
      <div class="panel-title">Dictionary</div>
      <div class="dict-words" id="dict-words"></div>
    </div>
    <div class="result-badge" id="result-badge"></div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step" onclick="buildAndRun()">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentS = '', currentDict = [];

var PRESETS = [
  { s: 'leetcode',      dict: 'leet,code' },
  { s: 'catsandog',     dict: 'cats,dog,sand,and,cat' },
  { s: 'applepenapple', dict: 'apple,pen' },
];

function loadPreset(idx) {
  var p = PRESETS[idx];
  document.getElementById('inp-s').value    = p.s;
  document.getElementById('inp-dict').value = p.dict;
  buildAndRun();
}

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">wordBreak</span><span class="op">(</span>s<span class="op">,</span> wordDict<span class="op">):</span>'],
  [2,  '    words <span class="op">=</span> <span class="bi">set</span><span class="op">(</span>wordDict<span class="op">)</span>'],
  [3,  '    n <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>s<span class="op">)</span>'],
  [4,  '    dp <span class="op">=</span> <span class="op">[</span><span class="kw">False</span><span class="op">]</span> <span class="op">*</span> <span class="op">(</span>n <span class="op">+</span> <span class="nb">1</span><span class="op">)</span>'],
  [5,  '    dp<span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">=</span> <span class="kw">True</span>  <span class="cm"># empty prefix always valid</span>'],
  [6,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">1</span><span class="op">,</span> n <span class="op">+</span> <span class="nb">1</span><span class="op">):</span>'],
  [7,  '        <span class="kw">for</span> j <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>i<span class="op">):</span>'],
  [8,  '            <span class="kw">if</span> dp<span class="op">[</span>j<span class="op">]</span> <span class="kw">and</span> s<span class="op">[</span>j<span class="op">:</span>i<span class="op">]</span> <span class="kw">in</span> words<span class="op">:</span>'],
  [9,  '                dp<span class="op">[</span>i<span class="op">]</span> <span class="op">=</span> <span class="kw">True</span>'],
  [10, '                <span class="kw">break</span>'],
  [11, '    <span class="kw">return</span> dp<span class="op">[</span>n<span class="op">]</span>'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      renderSnap(snap, cur > 0);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
      var badge = document.getElementById('result-badge');
      if (badge) {
        badge.className = 'result-badge';
        badge.textContent = '';
        if (snap.phase === 'Done') {
          var finalVal = snap.dp[snap.n];
          if (finalVal) {
            badge.className = 'result-badge yes';
            badge.textContent = 'True — can be segmented';
          } else {
            badge.className = 'result-badge no';
            badge.textContent = 'False — cannot be segmented';
          }
        }
      }
      // sidebar vars
      var items = document.getElementById('vars-items');
      if (items) {
        var matchVal = (snap.j >= 0 && snap.word)
          ? (snap.dpJTrue ? 'T' : 'F') + ' & ' + (snap.inDict ? 'yes' : 'no')
          : '—';
        items.innerHTML =
          '<div class="var-item"><span class="var-key">i        </span><span class="var-val">' + (snap.i >= 0 ? snap.i : '—') + '</span></div>' +
          '<div class="var-item"><span class="var-key">j        </span><span class="var-val">' + (snap.j >= 0 ? snap.j : '—') + '</span></div>' +
          '<div class="var-item"><span class="var-key">s[j..i]  </span><span class="var-val">' + (snap.word || '—') + '</span></div>' +
          '<div class="var-item"><span class="var-key">dp[j]&in; </span><span class="var-val">' + matchVal + '</span></div>';
      }
    }
  });

  buildAndRun();
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="cl" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var s = document.getElementById('inp-s').value.trim().toLowerCase();
  if (!s) return;
  var rawDict = document.getElementById('inp-dict').value;
  var dict = rawDict.split(',').map(function(w) { return w.trim().toLowerCase(); }).filter(function(w) { return w.length > 0; });
  if (!dict.length) return;

  currentS    = s;
  currentDict = dict;

  buildTrack(s);
  buildDictPanel(dict);
  simSteps = buildSteps(s, dict);
  nav.load(simSteps);
}

function buildTrack(s) {
  var n = s.length;
  var track = document.getElementById('word-track');
  track.innerHTML = '';
  var inner = document.createElement('div');
  inner.className = 'track-inner';

  for (var i = 0; i <= n; i++) {
    var col = document.createElement('div');
    col.className = 'track-col';
    col.id = 'tcol-' + i;

    if (i === 0) {
      var spacer = document.createElement('div');
      spacer.className = 'str-spacer';
      spacer.textContent = 'ε';
      col.appendChild(spacer);
    } else {
      var sc = document.createElement('div');
      sc.className = 'str-cell';
      sc.id = 'sc-' + (i - 1);
      sc.dataset.hi = 'none';
      sc.innerHTML =
        '<span class="str-idx">[' + (i - 1) + ']</span>' +
        '<span class="str-char">' + s[i - 1] + '</span>';
      col.appendChild(sc);
    }

    var dp = document.createElement('div');
    dp.className = 'dp-cell';
    dp.id = 'dpc-' + i;
    dp.dataset.state = 'empty';
    dp.innerHTML =
      '<span class="dp-idx">dp[' + i + ']</span>' +
      '<span class="dp-val" id="dpv-' + i + '">?</span>';
    col.appendChild(dp);

    inner.appendChild(col);
  }
  track.appendChild(inner);

  var dpc0 = document.getElementById('dpc-0');
  var dpv0 = document.getElementById('dpv-0');
  if (dpc0) dpc0.dataset.state = 'true';
  if (dpv0) dpv0.textContent = 'T';
}

function buildDictPanel(dict) {
  var panel = document.getElementById('dict-panel');
  var wordsEl = document.getElementById('dict-words');
  panel.style.display = '';
  wordsEl.innerHTML = dict.map(function(w, idx) {
    return '<div class="dict-word" id="dw-' + idx + '">' + w + '</div>';
  }).join('');
}

function buildSteps(s, dict) {
  var n = s.length;
  var wordSet = {};
  dict.forEach(function(w) { wordSet[w] = true; });

  var dp = new Array(n + 1).fill(null);
  dp[0] = true;
  var steps = [];

  function snap(opts) {
    steps.push({
      s:          s,
      n:          n,
      dict:       dict,
      dp:         dp.slice(),
      phase:      opts.phase || 'Init',
      desc:       opts.desc  || '',
      lines:      opts.lines || [],
      i:          opts.i !== undefined ? opts.i : -1,
      j:          opts.j !== undefined ? opts.j : -1,
      word:       opts.word  || '',
      inDict:     opts.inDict !== undefined ? opts.inDict : false,
      dpJTrue:    opts.dpJTrue !== undefined ? opts.dpJTrue : false,
      matchIdx:   opts.matchIdx !== undefined ? opts.matchIdx : -1,
    });
  }

  snap({
    phase: 'Init',
    desc:  'Allocate dp[0..' + n + '] = False. Set dp[0] = True (empty prefix is always valid).',
    lines: [2, 3, 4, 5],
  });

  for (var i = 1; i <= n; i++) {
    snap({
      phase: 'Loop i',
      desc:  'Computing dp[' + i + ']. Try all start indices j from 0 to ' + (i - 1) + '.',
      lines: [6],
      i: i,
      j: -1,
    });

    var found = false;
    for (var j = 0; j < i; j++) {
      var sub = s.substring(j, i);
      var dpJ = dp[j];
      var inD = wordSet[sub] === true;
      var matchIdx = -1;
      if (inD) {
        for (var di = 0; di < dict.length; di++) {
          if (dict[di] === sub) { matchIdx = di; break; }
        }
      }

      snap({
        phase: 'Check j=' + j,
        desc:  'j=' + j + ': s[' + j + '..' + i + '] = "' + sub + '". ' +
               'dp[' + j + ']=' + (dpJ ? 'True' : 'False') + ', in dict=' + (inD ? 'Yes' : 'No') + '.' +
               (dpJ && inD ? ' Both true → dp[' + i + '] = True!' : ' No match.'),
        lines: [7, 8],
        i: i,
        j: j,
        word: sub,
        inDict: inD,
        dpJTrue: !!dpJ,
        matchIdx: matchIdx,
      });

      if (dpJ && inD) {
        dp[i] = true;
        found = true;
        snap({
          phase: 'Set dp[' + i + ']',
          desc:  'dp[' + j + ']=True and "' + sub + '" is in dict. Set dp[' + i + '] = True. Break inner loop.',
          lines: [9, 10],
          i: i,
          j: j,
          word: sub,
          inDict: true,
          dpJTrue: true,
          matchIdx: matchIdx,
        });
        break;
      }
    }

    if (!found && dp[i] === null) {
      dp[i] = false;
      snap({
        phase: 'dp[' + i + '] = False',
        desc:  'No valid j found for i=' + i + '. dp[' + i + '] = False.',
        lines: [6, 7, 8],
        i: i,
        j: -1,
      });
    }
  }

  snap({
    phase: 'Done',
    desc:  'dp[' + n + '] = ' + (dp[n] ? 'True' : 'False') + '. String "' + s + '" ' +
           (dp[n] ? 'CAN' : 'CANNOT') + ' be segmented using the dictionary.',
    lines: [11],
    i: -1,
    j: -1,
  });

  return steps;
}

function renderSnap(snap, animate) {
  renderTrack(snap, animate);
  renderDict(snap, animate);
  setCodeLines(snap.lines);
}

function renderTrack(snap, animate) {
  var n = snap.n;
  var isDone = snap.phase === 'Done';

  for (var ci = 0; ci < n; ci++) {
    var sc = document.getElementById('sc-' + ci);
    if (!sc) continue;
    var hi = 'none';
    if (snap.i > 0 && snap.j >= 0) {
      var charIdx = ci;
      var spanStart = snap.j;
      var spanEnd   = snap.i - 1;
      if (charIdx === spanStart && charIdx === spanEnd) {
        hi = snap.inDict && snap.dpJTrue ? 'match' : 'span';
      } else if (charIdx === spanStart) {
        hi = 'start';
      } else if (charIdx === spanEnd) {
        hi = snap.inDict && snap.dpJTrue ? 'match' : 'end';
      } else if (charIdx > spanStart && charIdx < spanEnd) {
        hi = snap.inDict && snap.dpJTrue ? 'match' : 'span';
      }
    }
    sc.dataset.hi = hi;
  }

  for (var k = 0; k <= n; k++) {
    var dpc = document.getElementById('dpc-' + k);
    var dpv = document.getElementById('dpv-' + k);
    if (!dpc || !dpv) continue;

    var val = snap.dp[k];
    var state = 'empty';

    if (isDone && k === n) {
      state = val ? 'answer' : 'false';
    } else if (k === snap.i) {
      state = val === true ? 'true' : (val === false ? 'false' : 'current');
    } else if (k === snap.j && snap.j >= 0) {
      state = 'start';
    } else if (val === true) {
      state = 'true';
    } else if (val === false) {
      state = 'false';
    }

    dpc.dataset.state = state;

    var text = val === null ? '?' : (val ? 'T' : 'F');
    var prevText = dpv.textContent;
    dpv.textContent = text;

    if (animate && text !== prevText && text !== '?') {
      gsap.fromTo(dpc, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' });
    }
    if (animate && state === 'start') {
      gsap.fromTo(dpc, { scale: 1 }, { scale: 1.1, duration: 0.2, yoyo: true, repeat: 1 });
    }
  }
}

function renderDict(snap, animate) {
  currentDict.forEach(function(w, idx) {
    var el = document.getElementById('dw-' + idx);
    if (!el) return;
    el.className = 'dict-word';
    if (snap.word && snap.inDict && snap.matchIdx === idx) {
      el.classList.add('matched');
      if (animate) gsap.fromTo(el, { scale: 1 }, { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1 });
    } else if (snap.word && !snap.inDict && snap.j >= 0) {
      el.classList.add('no-match');
    } else if (snap.word && snap.matchIdx !== idx && snap.j >= 0) {
      el.classList.add('no-match');
    }
  });
}

function setCodeLines(activeLines) {
  CODE.forEach(function(e) {
    var ln = e[0];
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (activeLines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) { dragging = false; handle.classList.remove('dragging'); }
  });
})();
</script>
