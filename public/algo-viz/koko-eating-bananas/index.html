<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Koko Eating Bananas — Binary Search Visualization</title>
<link rel="stylesheet" href="../shared/style.css"/>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg, #0f172a);
  color: var(--text, #f1f5f9);
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

#msg-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--border, #334155);
  background: var(--surface, #1e293b);
  flex-shrink: 0;
  font-size: 13px;
  gap: 12px;
  transition: background 0.3s;
}
#msg-text { flex: 1; line-height: 1.3; }
#step-counter { color: var(--text-muted, #94a3b8); font-size: 12px; white-space: nowrap; }

#main { flex: 1; display: flex; overflow: hidden; }

#col-left {
  width: 48%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border, #334155);
  overflow: hidden;
}

#col-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.panel { display: flex; flex-direction: column; overflow: hidden; }

.panel-header {
  padding: 7px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted, #94a3b8);
  border-bottom: 1px solid var(--border, #334155);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Piles panel */
#piles-panel { flex: 1; border-bottom: 1px solid var(--border, #334155); }

#piles-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 16px 8px;
  overflow: hidden;
  min-height: 0;
}

#piles-summary {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  min-height: 20px;
  color: var(--text-muted, #94a3b8);
  transition: color 0.3s;
}

#piles-bars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 16px;
  flex: 1;
  min-height: 0;
  padding-bottom: 4px;
}

.pile-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pile-label { font-size: 12px; font-weight: 700; color: var(--text, #f1f5f9); }

.pile-bar-outer {
  width: 52px;
  background: rgba(30,41,59,0.6);
  border: 1px solid var(--border, #334155);
  border-radius: 3px 3px 0 0;
  display: flex;
  align-items: flex-end;
  flex-shrink: 0;
}

.pile-bar {
  width: 100%;
  background: #f59e0b;
  border-radius: 2px 2px 0 0;
  transition: background 0.3s;
  min-height: 4px;
}

.pile-hours {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 9px;
  background: var(--surface, #1e293b);
  border: 1px solid var(--border, #334155);
  color: var(--text-muted, #94a3b8);
  transition: background 0.3s, color 0.3s, border-color 0.3s;
  white-space: nowrap;
  min-width: 28px;
  text-align: center;
}
.pile-hours.lit { color: #f59e0b; border-color: #f59e0b; }

/* Number line panel */
#numline-panel { height: 120px; flex-shrink: 0; }
#numline-svg-wrap { flex: 1; padding: 2px 6px 4px; overflow: hidden; }
#numline-svg { width: 100%; height: 100%; display: block; }

/* History panel */
#history-panel { flex: 1; border-bottom: 1px solid var(--border, #334155); min-height: 0; }
#history-table-wrap { flex: 1; overflow-y: auto; min-height: 0; }

#history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
#history-table th {
  position: sticky; top: 0;
  background: #1e293b;
  padding: 7px 9px;
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  color: var(--text-muted, #94a3b8);
  border-bottom: 1px solid var(--border, #334155);
  z-index: 1;
}
#history-table td { padding: 5px 9px; border-bottom: 1px solid rgba(51,65,85,0.3); }
.h-even { background: #1e293b; }
.h-odd  { background: #263044; }
.h-cur  { background: #2d1f00 !important; border-left: 3px solid #f59e0b; }
.f-yes  { color: #10b981; font-weight: 700; }
.f-no   { color: #ef4444; font-weight: 700; }

/* Code panel */
#code-panel { height: 38%; flex-shrink: 0; }
#code-toggle {
  background: none; border: 1px solid var(--border, #334155);
  color: var(--text-muted, #94a3b8); font-size: 11px;
  padding: 2px 8px; border-radius: 3px; cursor: pointer;
}
#code-toggle:hover { border-color: #94a3b8; }
#code-body { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
#code-body.hidden { display: none; }

.code-line {
  display: flex;
  font-family: 'Fira Code', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.75;
  padding: 0 10px;
  border-left: 3px solid transparent;
  transition: background 0.2s, border-color 0.2s;
}
.code-line.active { background: #3d2b00; border-left-color: #f59e0b; }
.code-line-num {
  color: var(--text-dim, #475569);
  min-width: 26px;
  user-select: none;
  text-align: right;
  margin-right: 10px;
}

/* Nav bar */
#nav-bar {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-top: 1px solid var(--border, #334155);
  background: var(--surface, #1e293b);
  flex-shrink: 0;
  padding: 0 16px;
}
</style>
</head>
<body>

<div id="msg-bar">
  <span id="msg-text">Load the visualization to begin.</span>
  <span id="step-counter">Step 0 / 13</span>
</div>

<div id="main">
  <div id="col-left">

    <div class="panel" id="piles-panel">
      <div class="panel-header">Piles &nbsp;(h = 8 hours)</div>
      <div id="piles-content">
        <div id="piles-summary">—</div>
        <div id="piles-bars"></div>
      </div>
    </div>

    <div class="panel" id="numline-panel">
      <div class="panel-header">Binary Search on Speed k</div>
      <div id="numline-svg-wrap">
        <svg id="numline-svg" viewBox="0 0 420 74" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>

  </div>

  <div id="col-right">

    <div class="panel" id="history-panel">
      <div class="panel-header">Iteration History</div>
      <div id="history-table-wrap">
        <table id="history-table">
          <thead><tr>
            <th>#</th><th>k</th><th>Hours</th><th>OK?</th><th>Decision</th><th>New Range</th>
          </tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="code-panel">
      <div class="panel-header">
        <span>Python</span>
        <button id="code-toggle">Hide</button>
      </div>
      <div id="code-body"></div>
    </div>

  </div>
</div>

<div id="nav-bar">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
const PILES = [3, 6, 7, 11];
const H = 8;
const MAX_PILE = 11;

const SNAPS = [
  {
    step: 0, phase: 'init',
    message: 'Initialize: lo=1, hi=max(piles)=11. Binary search for minimum eating speed k in [1, 11].',
    lo: 1, hi: 11, mid: null, hours_needed: null, feasible: null,
    piles_hours: [], iteration: 0, active_code_lines: [3, 4], stale_mid: false
  },
  {
    step: 1, phase: 'compute_mid',
    message: 'Iteration 1: mid = (1 + 11) // 2 = 6. Test speed k = 6. Search space: [1, 11], width = 11.',
    lo: 1, hi: 11, mid: 6, hours_needed: null, feasible: null,
    piles_hours: [], iteration: 1, active_code_lines: [6, 7], stale_mid: false
  },
  {
    step: 2, phase: 'compute_hours',
    message: 'At k=6: ceil(3/6)+ceil(6/6)+ceil(7/6)+ceil(11/6) = 1+1+2+2 = 6 hours.',
    lo: 1, hi: 11, mid: 6, hours_needed: 6, feasible: null,
    piles_hours: [1, 1, 2, 2], iteration: 1, active_code_lines: [8], stale_mid: false
  },
  {
    step: 3, phase: 'shrink_hi',
    message: '6 ≤ 8 — feasible! Speed 6 works. Try slower: hi = 6. New range: [1, 6], width = 6.',
    lo: 1, hi: 6, mid: 6, hours_needed: 6, feasible: true,
    piles_hours: [1, 1, 2, 2], iteration: 1, active_code_lines: [10, 11], stale_mid: true
  },
  {
    step: 4, phase: 'compute_mid',
    message: 'Iteration 2: mid = (1 + 6) // 2 = 3. Test speed k = 3. Search space: [1, 6], width = 6.',
    lo: 1, hi: 6, mid: 3, hours_needed: null, feasible: null,
    piles_hours: [], iteration: 2, active_code_lines: [6, 7], stale_mid: false
  },
  {
    step: 5, phase: 'compute_hours',
    message: 'At k=3: ceil(3/3)+ceil(6/3)+ceil(7/3)+ceil(11/3) = 1+2+3+4 = 10 hours.',
    lo: 1, hi: 6, mid: 3, hours_needed: 10, feasible: null,
    piles_hours: [1, 2, 3, 4], iteration: 2, active_code_lines: [8], stale_mid: false
  },
  {
    step: 6, phase: 'shrink_lo',
    message: '10 > 8 — too slow! Speed 3 fails. Must go faster: lo = 3+1 = 4. New range: [4, 6], width = 3.',
    lo: 4, hi: 6, mid: 3, hours_needed: 10, feasible: false,
    piles_hours: [1, 2, 3, 4], iteration: 2, active_code_lines: [12, 13], stale_mid: true
  },
  {
    step: 7, phase: 'compute_mid',
    message: 'Iteration 3: mid = (4 + 6) // 2 = 5. Test speed k = 5. Search space: [4, 6], width = 3.',
    lo: 4, hi: 6, mid: 5, hours_needed: null, feasible: null,
    piles_hours: [], iteration: 3, active_code_lines: [6, 7], stale_mid: false
  },
  {
    step: 8, phase: 'compute_hours',
    message: 'At k=5: ceil(3/5)+ceil(6/5)+ceil(7/5)+ceil(11/5) = 1+2+2+3 = 8 hours.',
    lo: 4, hi: 6, mid: 5, hours_needed: 8, feasible: null,
    piles_hours: [1, 2, 2, 3], iteration: 3, active_code_lines: [8], stale_mid: false
  },
  {
    step: 9, phase: 'shrink_hi',
    message: '8 ≤ 8 — feasible! Speed 5 works. Try slower: hi = 5. New range: [4, 5], width = 2.',
    lo: 4, hi: 5, mid: 5, hours_needed: 8, feasible: true,
    piles_hours: [1, 2, 2, 3], iteration: 3, active_code_lines: [10, 11], stale_mid: true
  },
  {
    step: 10, phase: 'compute_mid',
    message: 'Iteration 4: mid = (4 + 5) // 2 = 4. Test speed k = 4. Search space: [4, 5], width = 2.',
    lo: 4, hi: 5, mid: 4, hours_needed: null, feasible: null,
    piles_hours: [], iteration: 4, active_code_lines: [6, 7], stale_mid: false
  },
  {
    step: 11, phase: 'compute_hours',
    message: 'At k=4: ceil(3/4)+ceil(6/4)+ceil(7/4)+ceil(11/4) = 1+2+2+3 = 8 hours.',
    lo: 4, hi: 5, mid: 4, hours_needed: 8, feasible: null,
    piles_hours: [1, 2, 2, 3], iteration: 4, active_code_lines: [8], stale_mid: false
  },
  {
    step: 12, phase: 'shrink_hi',
    message: '8 ≤ 8 — feasible! Speed 4 works. Try slower: hi = 4. New range: [4, 4], width = 1.',
    lo: 4, hi: 4, mid: 4, hours_needed: 8, feasible: true,
    piles_hours: [1, 2, 2, 3], iteration: 4, active_code_lines: [10, 11], stale_mid: true
  },
  {
    step: 13, phase: 'done',
    message: 'lo == hi == 4. Converged! Minimum eating speed k = 4 bananas/hour.',
    lo: 4, hi: 4, mid: 4, hours_needed: 8, feasible: true,
    piles_hours: [1, 2, 2, 3], iteration: 4, active_code_lines: [15], stale_mid: true
  }
];

const TOTAL = SNAPS.length - 1;

const CODE_LINES = [
  'import math',
  '',
  'def minEatingSpeed(piles, h):',
  '    lo, hi = 1, max(piles)',
  '',
  '    while lo < hi:',
  '        mid = (lo + hi) // 2',
  '        hours = sum(math.ceil(p / mid) for p in piles)',
  '',
  '        if hours <= h:',
  '            hi = mid',
  '        else:',
  '            lo = mid + 1',
  '',
  '    return lo'
];

// Build code panel
(function () {
  const el = document.getElementById('code-body');
  el.innerHTML = CODE_LINES.map(function (line, i) {
    var num = i + 1;
    var text = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') || ' ';
    return '<div class="code-line" id="cl-' + num + '"><span class="code-line-num">' + num + '</span><span>' + text + '</span></div>';
  }).join('');
}());

// Build piles bars
var BAR_MAX_H = 130;
(function () {
  var el = document.getElementById('piles-bars');
  el.innerHTML = PILES.map(function (p, i) {
    var h = Math.round((p / MAX_PILE) * BAR_MAX_H);
    return '<div class="pile-wrap">' +
      '<div class="pile-label">' + p + '</div>' +
      '<div class="pile-bar-outer" style="height:' + BAR_MAX_H + 'px">' +
        '<div class="pile-bar" id="pbar-' + i + '" style="height:' + h + 'px"></div>' +
      '</div>' +
      '<div class="pile-hours" id="phrs-' + i + '">&mdash;</div>' +
    '</div>';
  }).join('');
}());

// Number line
var SVG_W = 420, SVG_H = 74;
var NL_ML = 30, NL_MR = 30, NL_Y = 44;
var NL_MIN = 1, NL_MAX = 11;

function nlX(v) {
  return NL_ML + (v - NL_MIN) / (NL_MAX - NL_MIN) * (SVG_W - NL_ML - NL_MR);
}

function renderNumberLine(snap) {
  var lo = snap.lo, hi = snap.hi, mid = snap.mid;
  var isDone = snap.phase === 'done';
  var isStale = snap.stale_mid;
  var parts = [];

  // Search space fill
  var xLo = nlX(lo), xHi = nlX(hi);
  var fillC = isDone ? 'rgba(245,158,11,0.18)' : 'rgba(59,130,246,0.13)';
  parts.push('<rect x="' + (xLo - 1) + '" y="' + (NL_Y - 10) + '" width="' + (xHi - xLo + 2) + '" height="20" fill="' + fillC + '" rx="2"/>');

  // Baseline
  parts.push('<line x1="' + NL_ML + '" y1="' + NL_Y + '" x2="' + (SVG_W - NL_MR) + '" y2="' + NL_Y + '" stroke="#334155" stroke-width="2"/>');

  // Ticks + labels
  for (var v = NL_MIN; v <= NL_MAX; v++) {
    var x = nlX(v);
    var isBnd = (v === lo || v === hi);
    var tickC = isBnd ? (isDone ? '#f59e0b' : '#3b82f6') : '#475569';
    parts.push('<line x1="' + x + '" y1="' + (NL_Y - 5) + '" x2="' + x + '" y2="' + (NL_Y + 5) + '" stroke="' + tickC + '" stroke-width="' + (isBnd ? 2 : 1) + '"/>');
    parts.push('<text x="' + x + '" y="' + (NL_Y + 17) + '" text-anchor="middle" font-size="10" fill="' + (isBnd ? tickC : '#475569') + '">' + v + '</text>');
  }

  // lo/hi labels above
  var loC = isDone ? '#f59e0b' : '#3b82f6';
  if (lo === hi) {
    parts.push('<text x="' + xLo + '" y="' + (NL_Y - 15) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">lo=hi=' + lo + '</text>');
    parts.push('<line x1="' + xLo + '" y1="' + (NL_Y - 10) + '" x2="' + xLo + '" y2="' + NL_Y + '" stroke="#f59e0b" stroke-width="2"/>');
  } else {
    parts.push('<text x="' + xLo + '" y="' + (NL_Y - 15) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="' + loC + '">lo=' + lo + '</text>');
    parts.push('<line x1="' + xLo + '" y1="' + (NL_Y - 10) + '" x2="' + xLo + '" y2="' + NL_Y + '" stroke="' + loC + '" stroke-width="2"/>');
    parts.push('<text x="' + xHi + '" y="' + (NL_Y - 15) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b82f6">hi=' + hi + '</text>');
    parts.push('<line x1="' + xHi + '" y1="' + (NL_Y - 10) + '" x2="' + xHi + '" y2="' + NL_Y + '" stroke="#3b82f6" stroke-width="2"/>');
  }

  // mid triangle (below line); stale = muted
  if (mid !== null) {
    var xm = nlX(mid);
    var midC = isStale ? '#64748b' : '#f59e0b';
    var ty = NL_Y + 8;
    parts.push('<polygon points="' + xm + ',' + ty + ' ' + (xm - 6) + ',' + (ty + 14) + ' ' + (xm + 6) + ',' + (ty + 14) + '" fill="' + midC + '"/>');
    var lbl = isStale ? 'k=' + mid + ' (tested)' : 'k=' + mid;
    parts.push('<text x="' + xm + '" y="' + (ty + 28) + '" text-anchor="middle" font-size="10" fill="' + midC + '">' + lbl + '</text>');
  }

  document.getElementById('numline-svg').innerHTML = parts.join('');
}

// Piles update
function updatePiles(snap) {
  var mid = snap.mid, hours_needed = snap.hours_needed, feasible = snap.feasible;
  var piles_hours = snap.piles_hours, phase = snap.phase;

  var summary = document.getElementById('piles-summary');
  if (hours_needed !== null) {
    var isDone = phase === 'done';
    var color = (feasible === true) ? '#10b981' : (feasible === false) ? '#ef4444' : '#94a3b8';
    var sym = (feasible === true) ? ' ✓' : (feasible === false) ? ' ✗' : '';
    summary.innerHTML = '<span style="color:' + color + '">Total: ' + hours_needed + ' / ' + H + ' hours' + sym + (isDone ? ' — Answer: k = ' + snap.mid : '') + '</span>';
  } else if (mid !== null) {
    summary.innerHTML = '<span style="color:#f59e0b">Testing speed k = ' + mid + '…</span>';
  } else {
    summary.innerHTML = '<span style="color:#94a3b8">piles = [3, 6, 7, 11], h = 8</span>';
  }

  PILES.forEach(function (p, i) {
    var badge = document.getElementById('phrs-' + i);
    if (piles_hours.length > i) {
      badge.textContent = piles_hours[i] + 'h';
      badge.classList.add('lit');
    } else {
      badge.innerHTML = '&mdash;';
      badge.classList.remove('lit');
    }
  });
}

// Code highlighting
function updateCode(snap) {
  var active = {};
  (snap.active_code_lines || []).forEach(function (n) { active[n] = true; });
  CODE_LINES.forEach(function (_, i) {
    var el = document.getElementById('cl-' + (i + 1));
    if (el) el.classList.toggle('active', !!active[i + 1]);
  });
}

// Message bar
function updateMsgBar(snap) {
  var bar = document.getElementById('msg-bar');
  var text = document.getElementById('msg-text');
  text.textContent = snap.message;
  var phase = snap.phase;
  if (phase === 'shrink_hi' || phase === 'done') {
    bar.style.background = 'rgba(16,185,129,0.10)';
  } else if (phase === 'shrink_lo') {
    bar.style.background = 'rgba(239,68,68,0.09)';
  } else {
    bar.style.background = 'var(--surface, #1e293b)';
  }
}

// History table — rebuild from scratch up to step `cur`
function renderHistory(cur) {
  var rows = [];
  for (var i = 0; i <= cur; i++) {
    var s = SNAPS[i];
    if (s.phase === 'shrink_hi' || s.phase === 'shrink_lo') {
      var isHi = s.phase === 'shrink_hi';
      rows.push({
        iter: s.iteration,
        mid: s.mid,
        hours: s.hours_needed,
        feasible: isHi,
        decision: isHi ? 'hi = ' + s.mid : 'lo = ' + (s.mid + 1),
        range: '[' + s.lo + ', ' + s.hi + ']',
        cur: i === cur
      });
    }
  }
  // mark last as current
  if (rows.length > 0) rows[rows.length - 1].cur = true;

  var tbody = document.getElementById('history-body');
  tbody.innerHTML = rows.map(function (r, idx) {
    var cls = r.cur ? 'h-cur' : (idx % 2 === 0 ? 'h-even' : 'h-odd');
    var feasEl = r.feasible ? '<span class="f-yes">✓</span>' : '<span class="f-no">✗</span>';
    return '<tr class="' + cls + '"><td>' + r.iter + '</td><td>' + r.mid + '</td><td>' + r.hours + '</td><td>' + feasEl + '</td><td>' + r.decision + '</td><td>' + r.range + '</td></tr>';
  }).join('');
  var wrap = document.getElementById('history-table-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

// applyStep — called by VizNav render
function applyStep(snap, animate) {
  updateMsgBar(snap);
  renderNumberLine(snap);
  updatePiles(snap);
  updateCode(snap);
}

function updateStatus(snap, cur, total) {
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  renderHistory(cur);
}

// Code toggle
document.getElementById('code-toggle').addEventListener('click', function () {
  var body = document.getElementById('code-body');
  var hidden = body.classList.toggle('hidden');
  this.textContent = hidden ? 'Show' : 'Hide';
});

// Reset
document.getElementById('resetBtn').addEventListener('click', function () {
  if (typeof nav !== 'undefined' && nav) nav.reset();
});

// Init
var nav;
document.addEventListener('DOMContentLoaded', function () {
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function (snap, cur, total) {
      applyStep(snap, cur > 0);
      updateStatus(snap, cur, total);
    }
  });
  nav.load(SNAPS);
});
</script>
</body>
</html>
