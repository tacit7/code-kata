<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Koko Eating Bananas</title>
<link rel="stylesheet" href="../shared/style.css"/>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg, #0f172a); color: var(--text, #f1f5f9); font-family: "Fira Code","Cascadia Code",monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
#step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.viz-inputs { width: 100%; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex-shrink: 0; }
.vi-btn { padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
#main { display: flex; flex: 1; overflow: hidden; }
#viz-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
#resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
#code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
#sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
#nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
.btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
.btn-step:hover { background: #334155; }
.btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-play:hover { background: var(--accent-hover); }
select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

/* Piles panel */
#piles-panel { flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--surface); }
.panel-header { padding: 7px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
#piles-content { display: flex; flex-direction: column; padding: 10px 16px 8px; }
#piles-summary { font-size: 13px; font-weight: 600; margin-bottom: 10px; min-height: 20px; color: var(--text-muted); transition: color 0.3s; }
#piles-bars { display: flex; align-items: flex-end; justify-content: center; gap: 16px; min-height: 0; padding-bottom: 4px; }
.pile-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pile-label { font-size: 12px; font-weight: 700; color: var(--text); }
.pile-bar-outer { width: 52px; background: rgba(30,41,59,0.6); border: 1px solid var(--border); border-radius: 3px 3px 0 0; display: flex; align-items: flex-end; flex-shrink: 0; }
.pile-bar { width: 100%; background: #f59e0b; border-radius: 2px 2px 0 0; transition: background 0.3s; min-height: 4px; }
.pile-hours { font-size: 11px; padding: 2px 6px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); transition: background 0.3s, color 0.3s, border-color 0.3s; white-space: nowrap; min-width: 28px; text-align: center; }
.pile-hours.lit { color: #f59e0b; border-color: #f59e0b; }
/* Numline panel */
#numline-panel { flex-shrink: 0; height: 120px; border-bottom: 1px solid var(--border); }
#numline-svg-wrap { flex: 1; padding: 2px 6px 4px; overflow: hidden; height: 100px; }
#numline-svg { width: 100%; height: 100%; display: block; }
/* Msg bar inside viz area */
#msg-bar { padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; transition: background 0.3s; line-height: 1.4; }
/* Code panel */
.panel-toggle { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 3px; cursor: pointer; }
.panel-toggle:hover { border-color: #94a3b8; }
#code-body { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
#code-body.hidden { display: none; }
.code-line { display: flex; font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; line-height: 1.75; padding: 0 10px; border-left: 3px solid transparent; transition: background 0.2s, border-color 0.2s; }
.code-line.active { background: #3d2b00; border-left-color: #f59e0b; }
.code-line-num { color: var(--text-dim, #475569); min-width: 26px; user-select: none; text-align: right; margin-right: 10px; }
/* Sidebar: history table */
#history-panel { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
.sidebar-header { padding: 7px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#history-table-wrap { flex: 1; overflow-y: auto; min-height: 0; }
#history-table { width: 100%; border-collapse: collapse; font-size: 11px; }
#history-table th { position: sticky; top: 0; background: #1e293b; padding: 6px 7px; text-align: left; font-weight: 600; font-size: 10px; color: var(--text-muted); border-bottom: 1px solid var(--border); z-index: 1; }
#history-table td { padding: 4px 7px; border-bottom: 1px solid rgba(51,65,85,0.3); }
.h-even { background: #1e293b; } .h-odd { background: #263044; } .h-cur { background: #2d1f00 !important; border-left: 3px solid #f59e0b; }
.f-yes { color: #10b981; font-weight: 700; } .f-no { color: #ef4444; font-weight: 700; }
</style>
</head>
<body>

<div class="viz-inputs">
  <span style="font-size:0.78rem;color:var(--text-muted)">piles = [3,6,7,11] &nbsp;·&nbsp; h = 8</span>
  <button class="vi-btn" onclick="loadPreset()">&#9654; Replay</button>
  <button class="vi-btn" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Koko Eating Bananas</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="msg-bar">Load the visualization to begin.</div>
    <div class="panel" id="piles-panel">
      <div class="panel-header">Piles &nbsp;(h = 8 hours)</div>
      <div id="piles-content">
        <div id="piles-summary">&mdash;</div>
        <div id="piles-bars"></div>
      </div>
    </div>
    <div class="panel" id="numline-panel">
      <div class="panel-header">Binary Search on Speed k</div>
      <div id="numline-svg-wrap">
        <svg id="numline-svg" viewBox="0 0 420 74" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="panel-header">
      <span>Python</span>
      <button class="panel-toggle" id="code-toggle">Hide</button>
    </div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div id="history-panel">
      <div class="sidebar-header">Iteration History</div>
      <div id="history-table-wrap">
        <table id="history-table">
          <thead><tr>
            <th>#</th><th>k</th><th>Hrs</th><th>OK?</th><th>Decision</th>
          </tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn">&#8592; Prev</button>
  <button class="btn-step" id="stepBtn">Step &#8594;</button>
  <button class="btn-play" id="playBtn">Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
var PILES = [3, 6, 7, 11];
var H = 8;
var MAX_PILE = 11;

var SNAPS = [
  { step:0, phase:'init', message:'Initialize: lo=1, hi=max(piles)=11. Binary search for minimum eating speed k in [1, 11].', lo:1, hi:11, mid:null, hours_needed:null, feasible:null, piles_hours:[], iteration:0, active_code_lines:[3,4], stale_mid:false },
  { step:1, phase:'compute_mid', message:'Iteration 1: mid = (1 + 11) // 2 = 6. Test speed k = 6. Search space: [1, 11], width = 11.', lo:1, hi:11, mid:6, hours_needed:null, feasible:null, piles_hours:[], iteration:1, active_code_lines:[6,7], stale_mid:false },
  { step:2, phase:'compute_hours', message:'At k=6: ceil(3/6)+ceil(6/6)+ceil(7/6)+ceil(11/6) = 1+1+2+2 = 6 hours.', lo:1, hi:11, mid:6, hours_needed:6, feasible:null, piles_hours:[1,1,2,2], iteration:1, active_code_lines:[8], stale_mid:false },
  { step:3, phase:'shrink_hi', message:'6 ≤ 8 — feasible! Speed 6 works. Try slower: hi = 6. New range: [1, 6], width = 6.', lo:1, hi:6, mid:6, hours_needed:6, feasible:true, piles_hours:[1,1,2,2], iteration:1, active_code_lines:[10,11], stale_mid:true },
  { step:4, phase:'compute_mid', message:'Iteration 2: mid = (1 + 6) // 2 = 3. Test speed k = 3. Search space: [1, 6], width = 6.', lo:1, hi:6, mid:3, hours_needed:null, feasible:null, piles_hours:[], iteration:2, active_code_lines:[6,7], stale_mid:false },
  { step:5, phase:'compute_hours', message:'At k=3: ceil(3/3)+ceil(6/3)+ceil(7/3)+ceil(11/3) = 1+2+3+4 = 10 hours.', lo:1, hi:6, mid:3, hours_needed:10, feasible:null, piles_hours:[1,2,3,4], iteration:2, active_code_lines:[8], stale_mid:false },
  { step:6, phase:'shrink_lo', message:'10 > 8 — too slow! Speed 3 fails. Must go faster: lo = 3+1 = 4. New range: [4, 6], width = 3.', lo:4, hi:6, mid:3, hours_needed:10, feasible:false, piles_hours:[1,2,3,4], iteration:2, active_code_lines:[12,13], stale_mid:true },
  { step:7, phase:'compute_mid', message:'Iteration 3: mid = (4 + 6) // 2 = 5. Test speed k = 5. Search space: [4, 6], width = 3.', lo:4, hi:6, mid:5, hours_needed:null, feasible:null, piles_hours:[], iteration:3, active_code_lines:[6,7], stale_mid:false },
  { step:8, phase:'compute_hours', message:'At k=5: ceil(3/5)+ceil(6/5)+ceil(7/5)+ceil(11/5) = 1+2+2+3 = 8 hours.', lo:4, hi:6, mid:5, hours_needed:8, feasible:null, piles_hours:[1,2,2,3], iteration:3, active_code_lines:[8], stale_mid:false },
  { step:9, phase:'shrink_hi', message:'8 ≤ 8 — feasible! Speed 5 works. Try slower: hi = 5. New range: [4, 5], width = 2.', lo:4, hi:5, mid:5, hours_needed:8, feasible:true, piles_hours:[1,2,2,3], iteration:3, active_code_lines:[10,11], stale_mid:true },
  { step:10, phase:'compute_mid', message:'Iteration 4: mid = (4 + 5) // 2 = 4. Test speed k = 4. Search space: [4, 5], width = 2.', lo:4, hi:5, mid:4, hours_needed:null, feasible:null, piles_hours:[], iteration:4, active_code_lines:[6,7], stale_mid:false },
  { step:11, phase:'compute_hours', message:'At k=4: ceil(3/4)+ceil(6/4)+ceil(7/4)+ceil(11/4) = 1+2+2+3 = 8 hours.', lo:4, hi:5, mid:4, hours_needed:8, feasible:null, piles_hours:[1,2,2,3], iteration:4, active_code_lines:[8], stale_mid:false },
  { step:12, phase:'shrink_hi', message:'8 ≤ 8 — feasible! Speed 4 works. Try slower: hi = 4. New range: [4, 4], width = 1.', lo:4, hi:4, mid:4, hours_needed:8, feasible:true, piles_hours:[1,2,2,3], iteration:4, active_code_lines:[10,11], stale_mid:true },
  { step:13, phase:'done', message:'lo == hi == 4. Converged! Minimum eating speed k = 4 bananas/hour.', lo:4, hi:4, mid:4, hours_needed:8, feasible:true, piles_hours:[1,2,2,3], iteration:4, active_code_lines:[15], stale_mid:true }
];

var CODE_LINES = [
  'import math',
  '',
  'def minEatingSpeed(piles, h):',
  '    lo, hi = 1, max(piles)',
  '',
  '    while lo < hi:',
  '        mid = (lo + hi) // 2',
  '        hours = sum(math.ceil(p / mid) for p in piles)',
  '',
  '        if hours <= h:',
  '            hi = mid',
  '        else:',
  '            lo = mid + 1',
  '',
  '    return lo'
];

(function () {
  var el = document.getElementById('code-body');
  el.innerHTML = CODE_LINES.map(function (line, i) {
    var num = i + 1;
    var text = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') || ' ';
    return '<div class="code-line" id="cl-' + num + '"><span class="code-line-num">' + num + '</span><span>' + text + '</span></div>';
  }).join('');
}());

var BAR_MAX_H = 130;
(function () {
  var el = document.getElementById('piles-bars');
  el.innerHTML = PILES.map(function (p, i) {
    var h = Math.round((p / MAX_PILE) * BAR_MAX_H);
    return '<div class="pile-wrap"><div class="pile-label">' + p + '</div><div class="pile-bar-outer" style="height:' + BAR_MAX_H + 'px"><div class="pile-bar" id="pbar-' + i + '" style="height:' + h + 'px"></div></div><div class="pile-hours" id="phrs-' + i + '">&mdash;</div></div>';
  }).join('');
}());

var SVG_W = 420, SVG_H = 74;
var NL_ML = 30, NL_MR = 30, NL_Y = 44;
var NL_MIN = 1, NL_MAX = 11;

function nlX(v) { return NL_ML + (v - NL_MIN) / (NL_MAX - NL_MIN) * (SVG_W - NL_ML - NL_MR); }

function renderNumberLine(snap) {
  var lo = snap.lo, hi = snap.hi, mid = snap.mid;
  var isDone = snap.phase === 'done', isStale = snap.stale_mid;
  var parts = [];
  var xLo = nlX(lo), xHi = nlX(hi);
  var fillC = isDone ? 'rgba(245,158,11,0.18)' : 'rgba(59,130,246,0.13)';
  parts.push('<rect x="' + (xLo-1) + '" y="' + (NL_Y-10) + '" width="' + (xHi-xLo+2) + '" height="20" fill="' + fillC + '" rx="2"/>');
  parts.push('<line x1="' + NL_ML + '" y1="' + NL_Y + '" x2="' + (SVG_W-NL_MR) + '" y2="' + NL_Y + '" stroke="#334155" stroke-width="2"/>');
  for (var v = NL_MIN; v <= NL_MAX; v++) {
    var x = nlX(v), isBnd = (v === lo || v === hi);
    var tickC = isBnd ? (isDone ? '#f59e0b' : '#3b82f6') : '#475569';
    parts.push('<line x1="' + x + '" y1="' + (NL_Y-5) + '" x2="' + x + '" y2="' + (NL_Y+5) + '" stroke="' + tickC + '" stroke-width="' + (isBnd?2:1) + '"/>');
    parts.push('<text x="' + x + '" y="' + (NL_Y+17) + '" text-anchor="middle" font-size="10" fill="' + (isBnd?tickC:'#475569') + '">' + v + '</text>');
  }
  var loC = isDone ? '#f59e0b' : '#3b82f6';
  if (lo === hi) {
    parts.push('<text x="' + xLo + '" y="' + (NL_Y-15) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">lo=hi=' + lo + '</text>');
    parts.push('<line x1="' + xLo + '" y1="' + (NL_Y-10) + '" x2="' + xLo + '" y2="' + NL_Y + '" stroke="#f59e0b" stroke-width="2"/>');
  } else {
    parts.push('<text x="' + xLo + '" y="' + (NL_Y-15) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="' + loC + '">lo=' + lo + '</text>');
    parts.push('<line x1="' + xLo + '" y1="' + (NL_Y-10) + '" x2="' + xLo + '" y2="' + NL_Y + '" stroke="' + loC + '" stroke-width="2"/>');
    parts.push('<text x="' + xHi + '" y="' + (NL_Y-15) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b82f6">hi=' + hi + '</text>');
    parts.push('<line x1="' + xHi + '" y1="' + (NL_Y-10) + '" x2="' + xHi + '" y2="' + NL_Y + '" stroke="#3b82f6" stroke-width="2"/>');
  }
  if (mid !== null) {
    var xm = nlX(mid), midC = isStale ? '#64748b' : '#f59e0b';
    var ty = NL_Y + 8;
    parts.push('<polygon points="' + xm + ',' + ty + ' ' + (xm-6) + ',' + (ty+14) + ' ' + (xm+6) + ',' + (ty+14) + '" fill="' + midC + '"/>');
    var lbl = isStale ? 'k=' + mid + ' (tested)' : 'k=' + mid;
    parts.push('<text x="' + xm + '" y="' + (ty+28) + '" text-anchor="middle" font-size="10" fill="' + midC + '">' + lbl + '</text>');
  }
  document.getElementById('numline-svg').innerHTML = parts.join('');
}

function updatePiles(snap) {
  var mid = snap.mid, hours_needed = snap.hours_needed, feasible = snap.feasible;
  var piles_hours = snap.piles_hours, phase = snap.phase;
  var summary = document.getElementById('piles-summary');
  if (hours_needed !== null) {
    var isDone = phase === 'done';
    var color = (feasible === true) ? '#10b981' : (feasible === false) ? '#ef4444' : '#94a3b8';
    var sym = (feasible === true) ? ' ✓' : (feasible === false) ? ' ✗' : '';
    summary.innerHTML = '<span style="color:' + color + '">Total: ' + hours_needed + ' / ' + H + ' hours' + sym + (isDone ? ' — Answer: k = ' + snap.mid : '') + '</span>';
  } else if (mid !== null) {
    summary.innerHTML = '<span style="color:#f59e0b">Testing speed k = ' + mid + '…</span>';
  } else {
    summary.innerHTML = '<span style="color:#94a3b8">piles = [3, 6, 7, 11], h = 8</span>';
  }
  PILES.forEach(function (p, i) {
    var badge = document.getElementById('phrs-' + i);
    if (piles_hours.length > i) { badge.textContent = piles_hours[i] + 'h'; badge.classList.add('lit'); }
    else { badge.innerHTML = '&mdash;'; badge.classList.remove('lit'); }
  });
}

function updateCode(snap) {
  var active = {};
  (snap.active_code_lines || []).forEach(function (n) { active[n] = true; });
  CODE_LINES.forEach(function (_, i) {
    var el = document.getElementById('cl-' + (i+1));
    if (el) el.classList.toggle('active', !!active[i+1]);
  });
}

function updateMsgBar(snap) {
  var bar = document.getElementById('msg-bar');
  var phase = snap.phase;
  bar.textContent = snap.message;
  if (phase === 'shrink_hi' || phase === 'done') bar.style.background = 'rgba(16,185,129,0.10)';
  else if (phase === 'shrink_lo') bar.style.background = 'rgba(239,68,68,0.09)';
  else bar.style.background = 'var(--surface)';
}

function renderHistory(cur) {
  var rows = [];
  for (var i = 0; i <= cur; i++) {
    var s = SNAPS[i];
    if (s.phase === 'shrink_hi' || s.phase === 'shrink_lo') {
      var isHi = s.phase === 'shrink_hi';
      rows.push({ iter: s.iteration, mid: s.mid, hours: s.hours_needed, feasible: isHi, decision: isHi ? 'hi='+s.mid : 'lo='+(s.mid+1) });
    }
  }
  if (rows.length > 0) rows[rows.length-1].cur = true;
  var tbody = document.getElementById('history-body');
  tbody.innerHTML = rows.map(function (r, idx) {
    var cls = r.cur ? 'h-cur' : (idx%2===0 ? 'h-even' : 'h-odd');
    var feasEl = r.feasible ? '<span class="f-yes">✓</span>' : '<span class="f-no">✗</span>';
    return '<tr class="' + cls + '"><td>' + r.iter + '</td><td>' + r.mid + '</td><td>' + r.hours + '</td><td>' + feasEl + '</td><td>' + r.decision + '</td></tr>';
  }).join('');
  var wrap = document.getElementById('history-table-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

function loadPreset() { if (typeof nav !== 'undefined' && nav) { nav.reset(); nav.load(SNAPS); } }
function randomExample() { loadPreset(); }

document.getElementById('code-toggle').addEventListener('click', function () {
  var body = document.getElementById('code-body');
  var hidden = body.classList.toggle('hidden');
  this.textContent = hidden ? 'Show' : 'Hide';
});

var nav;
document.addEventListener('DOMContentLoaded', function () {
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function (snap, cur, total) {
      updateMsgBar(snap);
      renderNumberLine(snap);
      updatePiles(snap);
      updateCode(snap);
      renderHistory(cur);
      var phaseMap = { init:'Init', compute_mid:'Compute', compute_hours:'Hours', shrink_hi:'Feasible', shrink_lo:'Too Slow', done:'Done' };
      document.getElementById('phase-badge').textContent = phaseMap[snap.phase] || snap.phase;
      document.getElementById('step-counter').textContent = 'Step ' + (cur+1) + ' / ' + total;
    }
  });
  nav.load(SNAPS);

  document.getElementById('resetBtn').addEventListener('click', function () { nav.reset(); nav.load(SNAPS); });
});
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return; dragging = false; handle.classList.remove('dragging');
  });
})();
