<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House Robber &#8212; DP Visualization</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    /* ── Canonical layout ── */
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; color: #fff; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .code-panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    /* ── Original house-robber CSS ── */
    .houses-wrap {
      display: flex; gap: 10px; flex-wrap: wrap;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      min-height: 80px; align-items: center;
    }
    .house { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .house-cell {
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #0f0f0f;
      font-size: 0.92rem; font-weight: 700;
      color: var(--text-ghost); font-family: monospace;
    }
    .house-idx { font-size: 0.65rem; color: var(--text-faint); font-family: monospace; }

    .panel-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .dp-boxes { display: flex; gap: 8px; }
    .dp-box {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 8px 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .dp-box.accent { border-color: var(--accent); }
    .dp-box-label { font-size: 0.6rem; font-family: monospace; color: var(--text-faint); text-align: center; }
    .dp-box-val { font-size: 1.2rem; font-weight: 700; color: var(--text-bright); }

    .dec-row { display: flex; gap: 8px; }
    .dec-card {
      flex: 1; padding: 8px 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; gap: 4px;
      opacity: 0.25;
    }
    .dec-card.visible { opacity: 1; }
    .dec-card.winner { border-color: #15803d; background: #052e16; opacity: 1; }
    .dec-card.loser  { opacity: 0.3; }
    .dec-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); }
    .dec-formula { font-size: 0.68rem; font-family: monospace; color: var(--text-dim); min-height: 14px; }
    .dec-val { font-size: 1.1rem; font-weight: 700; color: var(--text-bright); }
    .dec-result {
      font-size: 0.75rem; font-family: monospace; color: var(--text-muted);
      padding-top: 6px; border-top: 1px solid var(--border);
      min-height: 18px;
    }
    .dec-result strong { color: var(--text-bright); }

    .code-body { padding: 4px 0; font-size: 0.82rem; line-height: 1.8; flex: 1; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 8px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.72rem; }

    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .op { color: var(--text); }
    .nb { color: var(--green); }

    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    .viz-inputs input[type="text"] {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 6px 10px; font-size: 0.85rem; width: 200px;
    }
    .viz-inputs select {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 6px 10px; font-size: 0.85rem; cursor: pointer;
    }
  </style>
</head>
<body class="page">

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"nums":"1, 2, 3, 4, 5"}'>Ascending</option>
      <option value='{"nums":"1, 5, 1, 3, 9"}'>Mixed with Gap</option>
      <option value='{"nums":"5, 3, 4, 11, 2"}'>Large Numbers</option>
      <option value='{"nums":"10"}'>Single House</option>
      <option value='{"nums":"2, 7"}'>Two Houses</option>
      <option value='{"nums":"5, 5, 5, 5"}'>All Same</option>
    </select>
  </div>
  <div class="field">
    <label>nums</label>
    <input id="inp-nums" type="text" value="2, 7, 9, 3, 1" />
  </div>
  <button onclick="buildAndRun()" style="padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;">Run</button>
  <button onclick="randomExample()" style="padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;">&#127922; Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-label">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">House Robber</span>
  <span id="step-counter" style="margin-left:auto;font-size:12px;color:var(--text-muted)">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="houses-wrap" id="houses-row">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter nums and click Run.</span>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>
  <div id="sidebar">
    <div style="font-size:0.82rem;color:var(--text-muted)" id="step-desc">Enter nums and click Run.</div>
    <div class="panel-box">
      <div class="panel-title">DP Variables</div>
      <div class="dp-boxes">
        <div class="dp-box" id="dp-pt">
          <div class="dp-box-label">prev_two</div>
          <div class="dp-box-val" id="dp-pt-val">&#8212;</div>
        </div>
        <div class="dp-box" id="dp-po">
          <div class="dp-box-label">prev_one</div>
          <div class="dp-box-val" id="dp-po-val">&#8212;</div>
        </div>
        <div class="dp-box accent">
          <div class="dp-box-label">current</div>
          <div class="dp-box-val" id="dp-cur-val">&#8212;</div>
        </div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Decision</div>
      <div class="dec-row">
        <div class="dec-card" id="dec-skip">
          <div class="dec-label">A &#183; Skip</div>
          <div class="dec-formula" id="dec-skip-f">prev_one</div>
          <div class="dec-val" id="dec-skip-v">&#8212;</div>
        </div>
        <div class="dec-card" id="dec-rob">
          <div class="dec-label">B &#183; Rob</div>
          <div class="dec-formula" id="dec-rob-f">prev_two + money</div>
          <div class="dec-val" id="dec-rob-v">&#8212;</div>
        </div>
      </div>
      <div class="dec-result" id="dec-result"></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">rob</span><span class="op">(</span>nums<span class="op">):</span>'],
  [2,  '    prev_two <span class="op">=</span> <span class="nb">0</span>'],
  [3,  '    prev_one <span class="op">=</span> <span class="nb">0</span>'],
  [0,  ''],
  [5,  '    <span class="kw">for</span> money <span class="kw">in</span> nums<span class="op">:</span>'],
  [6,  '        current <span class="op">=</span> <span class="bi">max</span><span class="op">(</span>prev_one<span class="op">,</span> prev_two <span class="op">+</span> money<span class="op">)</span>'],
  [0,  ''],
  [8,  '        prev_two <span class="op">=</span> prev_one'],
  [9,  '        prev_one <span class="op">=</span> current'],
  [0,  ''],
  [11, '    <span class="kw">return</span> prev_one'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var phaseEl = document.getElementById('phase-label');
      var descEl  = document.getElementById('step-desc');
      if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  \u00b7  ' + snap.phase;
      if (descEl)  descEl.textContent  = snap.desc;
    }
  });
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="code-line"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var raw = document.getElementById('inp-nums').value;
  var nums = raw.split(',').map(function(x) { return parseInt(x.trim()); }).filter(function(x) { return !isNaN(x); });
  if (!nums.length) return;
  buildHouses(nums);
  simSteps = simulate(nums);
  nav.load(simSteps);
}

function buildHouses(nums) {
  var row = document.getElementById('houses-row');
  row.innerHTML = '';
  nums.forEach(function(v, i) {
    var h = document.createElement('div');
    h.className = 'house';
    h.innerHTML = '<div class="house-cell" id="hc-' + i + '">$' + v + '</div>' +
                  '<div class="house-idx">[' + i + ']</div>';
    row.appendChild(h);
  });
}

function simulate(nums) {
  var steps = [];
  var hs = nums.map(function() { return 'idle'; });

  function snap(phase, desc, lines, extra) {
    steps.push(Object.assign({ phase: phase, desc: desc, lines: lines, hs: hs.slice() }, extra));
  }

  var pt = 0, po = 0;

  snap('Init', 'Initialize: prev_two = 0, prev_one = 0.', [2, 3], { dp: { pt: 0, po: 0, cur: null }, dec: null });

  for (var i = 0; i < nums.length; i++) {
    var money = nums[i];
    hs[i] = 'current';

    snap('Loop', 'House ' + i + ': money = ' + money + '.', [5], { dp: { pt: pt, po: po, cur: null }, dec: null });

    var skipVal = po;
    var robVal  = pt + money;

    snap('Loop', 'Option A \u2014 skip: keep prev_one = ' + skipVal + '.', [6], {
      dp: { pt: pt, po: po, cur: null },
      dec: { skipVal: skipVal, robVal: null, robCalc: null, cur: null, winner: null }
    });

    snap('Loop', 'Option B \u2014 rob: prev_two + money = ' + pt + ' + ' + money + ' = ' + robVal + '.', [6], {
      dp: { pt: pt, po: po, cur: null },
      dec: { skipVal: skipVal, robVal: robVal, robCalc: pt + ' + ' + money + ' = ' + robVal, cur: null, winner: null }
    });

    var cur    = Math.max(skipVal, robVal);
    var winner = robVal > skipVal ? 'rob' : robVal < skipVal ? 'skip' : 'tie';

    snap('Loop', 'current = max(' + skipVal + ', ' + robVal + ') = ' + cur + '. Winner: ' + (winner === 'tie' ? 'tie.' : winner + '.'), [6], {
      dp: { pt: pt, po: po, cur: cur },
      dec: { skipVal: skipVal, robVal: robVal, robCalc: pt + ' + ' + money + ' = ' + robVal, cur: cur, winner: winner }
    });

    pt = po; po = cur;
    hs[i] = 'done';

    snap('Loop', 'Slide: prev_two \u2190 ' + pt + ',  prev_one \u2190 ' + po + '.', [8, 9], { dp: { pt: pt, po: po, cur: null }, dec: null });
  }

  snap('Done', 'return prev_one = ' + po + '.  Maximum amount: $' + po + '.', [11], { dp: { pt: pt, po: po, cur: null }, dec: null });

  return steps;
}

// --- Render ---
function applyStep(s, animate) {
  applyHouses(s.hs, animate);
  applyDP(s.dp, animate);
  applyDecision(s.dec);
  setCodeLines(s.lines);
}

function applyHouses(states, animate) {
  states.forEach(function(state, i) {
    var el = document.getElementById('hc-' + i);
    if (!el) return;
    var bg     = state === 'current' ? '#15803d' : '#0f0f0f';
    var color  = state === 'current' ? '#fff'    : state === 'done' ? 'var(--border-soft)' : 'var(--text-ghost)';
    var border = state === 'current' ? 'var(--green)' : 'var(--border)';
    if (animate) {
      gsap.to(el, { backgroundColor: bg, color: color, duration: 0.2, ease: 'power2.out' });
    } else {
      el.style.backgroundColor = bg;
      el.style.color = color;
    }
    el.style.borderColor = border;
  });
}

function applyDP(dp, animate) {
  function set(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null ? '?' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  set('dp-pt-val', dp.pt);
  set('dp-po-val', dp.po);
  set('dp-cur-val', dp.cur);
}

function applyDecision(dec) {
  var skipCard = document.getElementById('dec-skip');
  var robCard  = document.getElementById('dec-rob');
  var skipF    = document.getElementById('dec-skip-f');
  var robF     = document.getElementById('dec-rob-f');
  var skipV    = document.getElementById('dec-skip-v');
  var robV     = document.getElementById('dec-rob-v');
  var result   = document.getElementById('dec-result');

  skipCard.className = 'dec-card';
  robCard.className  = 'dec-card';
  skipF.textContent  = 'prev_one';
  robF.textContent   = 'prev_two + money';
  skipV.textContent  = '\u2014';
  robV.textContent   = '\u2014';
  result.innerHTML   = '';

  if (!dec) return;

  skipCard.className = 'dec-card visible';
  skipV.textContent  = String(dec.skipVal);

  if (dec.robVal !== null) {
    robCard.className = 'dec-card visible';
    robF.textContent  = dec.robCalc || 'prev_two + money';
    robV.textContent  = String(dec.robVal);
  }

  if (dec.winner !== null) {
    if (dec.winner === 'rob') {
      robCard.className  = 'dec-card winner';
      skipCard.className = 'dec-card loser';
    } else if (dec.winner === 'skip') {
      skipCard.className = 'dec-card winner';
      robCard.className  = 'dec-card loser';
    } else {
      skipCard.className = 'dec-card winner';
      robCard.className  = 'dec-card winner';
    }
    result.innerHTML = 'current = max(' + dec.skipVal + ', ' + dec.robVal + ') = <strong>' + dec.cur + '</strong>';
  }
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-nums').value = d.nums;
  buildAndRun();
}

function randomExample() {
  var lengths = [3, 4, 5, 6];
  var len = lengths[Math.floor(Math.random() * lengths.length)];
  var nums = [];
  for (var i = 0; i < len; i++) {
    nums.push(Math.floor(Math.random() * 20) + 1);
  }
  document.getElementById('inp-nums').value = nums.join(', ');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
