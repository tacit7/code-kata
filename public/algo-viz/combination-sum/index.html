<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Combination Sum</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 16px 20px; gap: 12px; overflow-y: auto; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* PAGE-SPECIFIC */
  .sect { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .panel-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .panel-sub { font-size: 0.68rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-faint); }

  .cands-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .cand-chip {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border); border-radius: 8px; background: var(--bg);
    font-size: 1rem; font-weight: 700; font-family: monospace; color: var(--text-dim);
    transition: border-color 0.15s, color 0.15s, background 0.15s, opacity 0.15s;
    position: relative;
  }
  .cand-chip .cand-idx { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 0.55rem; color: var(--text-ghost); font-family: monospace; pointer-events: none; }
  .cand-chip.active  { border-color: var(--yellow); color: var(--yellow-light); background: #1e1600; }
  .cand-chip.pruned  { border-color: var(--red);    color: var(--red);          background: #200a0a; opacity: 0.65; }
  .cand-chip.skipped { opacity: 0.3; }

  .path-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 42px; margin-top: 4px; }
  .path-item { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent); border-radius: 6px; background: var(--surface-dark); font-size: 0.95rem; font-weight: 700; font-family: monospace; color: var(--accent-pale); }
  .path-item.found { border-color: var(--green); color: var(--green-light); background: var(--green-bg); }
  .path-sum  { font-size: 0.88rem; color: var(--text-muted); font-family: monospace; margin-left: 4px; }
  .path-tag  { font-size: 0.78rem; font-weight: 700; }
  .path-tag.found { color: var(--green); }
  .path-tag.prune { color: var(--red); }
  .path-empty { color: var(--text-ghost); font-size: 0.82rem; font-style: italic; }

  .stack-body { font-family: monospace; font-size: 0.74rem; max-height: 160px; overflow-y: auto; margin-top: 4px; }
  .stack-frame { padding: 1px 0; color: var(--text-muted); white-space: nowrap; }
  .stack-frame.top  { color: var(--accent-pale); font-weight: 700; }
  .stack-frame.win  { color: var(--green); font-weight: 700; }

  /* sidebar styles */
  .var-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .var-box { padding: 8px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .var-box.ab { border-color: var(--accent); }
  .var-box.ob { border-color: #b45309; }
  .var-box.gb { border-color: var(--green-border); }
  .var-label { font-size: 0.58rem; font-family: monospace; color: var(--text-faint); text-align: center; }
  .var-val   { font-size: 1.1rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }

  .results-list { display: flex; flex-direction: column; gap: 5px; min-height: 30px; }
  .result-combo { display: flex; align-items: center; gap: 5px; padding: 5px 8px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 5px; font-family: monospace; font-size: 0.78rem; color: var(--green); }
  .result-empty { color: var(--text-ghost); font-size: 0.78rem; font-style: italic; }

  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }

  .kw { color: var(--purple); }
  .fn { color: var(--blue); }
  .bi { color: var(--orange); }
  .nb { color: var(--green); }
  .cm { color: var(--text-ghost); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Candidates (comma-sep)</label>
    <input id="inp-cands" type="text" value="2,3,6,7" style="width:150px" />
  </div>
  <div>
    <label>Target</label>
    <input id="inp-target" type="number" value="7" min="1" max="30" style="width:70px" />
  </div>
  <div>
    <label>Preset</label>
    <select id="preset-sel" onchange="loadPreset(this.value)" style="width:160px">
      <option value="0">[2,3,6,7] target=7</option>
      <option value="1">[2,3,5] target=8</option>
      <option value="2">[2] target=6</option>
    </select>
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Build &amp; Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Combination Sum</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="sect">
      <div class="panel-title">Candidates <span class="panel-sub" id="target-sub"></span></div>
      <div class="cands-row" id="cands-row">
        <span style="color:var(--text-ghost);font-size:0.82rem">Click Build &amp; Run.</span>
      </div>
    </div>
    <div class="sect">
      <div class="panel-title">Current Path</div>
      <div class="path-row" id="path-row">
        <span class="path-empty">empty</span>
      </div>
    </div>
    <div class="sect" style="gap:4px">
      <div class="panel-title">Call Stack <span class="panel-sub">(deepest = active)</span></div>
      <div class="stack-body" id="stack-body">
        <div style="color:var(--text-ghost);font-size:0.78rem">No active recursion.</div>
      </div>
    </div>
    <div id="desc" style="font-size:13px;color:var(--text-muted);text-align:center;max-width:560px;min-height:36px;line-height:1.5;">Set candidates &amp; target, then click Build &amp; Run.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Variables</div>
      <div class="var-grid">
        <div class="var-box ab"><div class="var-label">start</div><div class="var-val" id="vv-start">&mdash;</div></div>
        <div class="var-box ob"><div class="var-label">sum</div><div class="var-val" id="vv-sum">&mdash;</div></div>
        <div class="var-box gb"><div class="var-label">rem</div><div class="var-val" id="vv-rem">&mdash;</div></div>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Results <span style="font-size:0.65rem;color:var(--text-faint)" id="result-count"></span></div>
      <div class="results-list" id="results-list">
        <span class="result-empty">No combinations yet.</span>
      </div>
    </div>
    <div>
      <div class="sidebar-title">Legend</div>
      <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;border:2px solid var(--yellow);background:#1e1600;flex-shrink:0"></div><span>Trying</span></div>
      <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;border:2px solid var(--red);background:#200a0a;flex-shrink:0"></div><span>Pruned</span></div>
      <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;border:2px solid var(--accent);background:var(--surface-dark);flex-shrink:0"></div><span>In path</span></div>
      <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;background:var(--green-bg);border:1px solid var(--green-border);flex-shrink:0"></div><span>Found</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&larr; Prev</button>
  <button id="stepBtn" class="btn-step">Step &rarr;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentCands = [], currentTarget = 0;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">combination_sum</span>(candidates, target):'],
  [2,  '    candidates.<span class="bi">sort</span>()'],
  [3,  '    results = []'],
  [4,  '    <span class="kw">def</span> <span class="fn">backtrack</span>(start, path, s):'],
  [5,  '        <span class="kw">if</span> s == target:            <span class="cm"># base case: found</span>'],
  [6,  '            results.<span class="bi">append</span>(path[:])'],
  [7,  '            <span class="kw">return</span>'],
  [8,  '        <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span>(start, <span class="bi">len</span>(candidates)):'],
  [9,  '            c = candidates[i]'],
  [10, '            <span class="kw">if</span> s + c > target: <span class="kw">break</span>   <span class="cm"># prune</span>'],
  [11, '            path.<span class="bi">append</span>(c)           <span class="cm"># choose</span>'],
  [12, '            <span class="fn">backtrack</span>(i, path, s + c) <span class="cm"># explore</span>'],
  [13, '            path.<span class="bi">pop</span>()               <span class="cm"># unchoose</span>'],
  [14, '    <span class="fn">backtrack</span>(<span class="nb">0</span>, [], <span class="nb">0</span>)'],
  [15, '    <span class="kw">return</span> results'],
];

var PHASE_LINES = {
  'enter':   [4],
  'found':   [5, 6, 7],
  'try':     [8, 9],
  'prune':   [10],
  'add':     [11, 12],
  'remove':  [13],
  'done':    [14, 15],
};

var PRESETS = [
  { cands: '2,3,6,7', target: 7 },
  { cands: '2,3,5',   target: 8 },
  { cands: '2',       target: 6 },
];

function loadPreset(idx) {
  var p = PRESETS[parseInt(idx, 10)];
  document.getElementById('inp-cands').value = p.cands;
  document.getElementById('inp-target').value = p.target;
  buildAndRun();
}

function randomExample() {
  var idx = Math.floor(Math.random() * PRESETS.length);
  document.getElementById('preset-sel').value = String(idx);
  loadPreset(idx);
}

function simulate(cands, target) {
  var steps = [];
  var results = [];
  var callStack = [];

  function snap(phase, desc, candIdx, path) {
    var curSum = path.reduce(function(a, b) { return a + b; }, 0);
    steps.push({
      phase: phase,
      desc: desc,
      stack: callStack.map(function(f) {
        return { start: f.start, sum: f.sum, path: f.path.slice() };
      }),
      path: path.slice(),
      sum: curSum,
      candIdx: candIdx,
      results: results.slice(),
      lines: PHASE_LINES[phase] || [],
    });
  }

  function backtrack(start, path, sum) {
    callStack.push({ start: start, sum: sum, path: path.slice() });

    snap('enter',
      'backtrack(start=' + start + ', sum=' + sum + '). ' +
      (path.length ? 'path=[' + path.join(', ') + ']. ' : 'path empty. ') +
      'Will try candidates[' + start + '..].',
      -1, path);

    if (sum === target) {
      results.push(path.slice());
      snap('found',
        'sum (' + sum + ') == target (' + target + '). ' +
        'Found: [' + path.join(', ') + ']. Append copy to results and return.',
        -1, path);
      callStack.pop();
      return;
    }

    for (var i = start; i < cands.length; i++) {
      var c = cands[i];

      if (sum + c > target) {
        snap('prune',
          'sum + ' + c + ' = ' + (sum + c) + ' > ' + target + '. ' +
          'Prune — candidates are sorted so all remaining exceed. Break.',
          i, path);
        break;
      }

      snap('try',
        'Try candidate ' + c + ' (index ' + i + '). ' +
        'sum + ' + c + ' = ' + (sum + c) + ' ≤ ' + target + '. Safe to add.',
        i, path);

      path.push(c);
      snap('add',
        'Appended ' + c + ' → path=[' + path.join(', ') + '], sum=' + (sum + c) + '. ' +
        'Recurse with same start=' + i + ' (reuse allowed).',
        i, path);

      backtrack(i, path, sum + c);

      path.pop();
      snap('remove',
        'Back from recursion. Pop ' + c + ' → path=[' + path.join(', ') + '], sum=' + sum + '. ' +
        'Try next candidate.',
        i, path);
    }

    callStack.pop();
  }

  backtrack(0, [], 0);

  var summary = results.length
    ? results.map(function(r) { return '[' + r.join(',') + ']'; }).join(', ')
    : 'none';
  snap('done',
    'All branches explored. ' + results.length + ' combination' +
    (results.length === 1 ? '' : 's') + ' found: ' + summary + '.',
    -1, []);

  return steps;
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(s, cur, total) {
      renderStep(s, cur > 0, cur, total);
    },
  });
  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
  buildAndRun();
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="cl" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var raw    = document.getElementById('inp-cands').value;
  var target = parseInt(document.getElementById('inp-target').value, 10);
  if (isNaN(target) || target < 1 || target > 30) return;

  var cands = raw.split(',')
    .map(function(s) { return parseInt(s.trim(), 10); })
    .filter(function(n) { return !isNaN(n) && n > 0; });
  if (cands.length === 0) return;

  cands.sort(function(a, b) { return a - b; });
  currentCands  = cands;
  currentTarget = target;

  document.getElementById('target-sub').textContent = '— target = ' + target;
  var row = document.getElementById('cands-row');
  row.innerHTML = cands.map(function(c, idx) {
    return '<div class="cand-chip" id="cand-' + idx + '">' +
           '<span class="cand-idx">' + idx + '</span>' + c + '</div>';
  }).join('');

  simSteps = simulate(cands, target);
  nav.load(simSteps);
}

function renderStep(s, animate, cur, total) {
  document.getElementById('phase-badge').textContent = s.phase;
  document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;

  var descEl = document.getElementById('desc');
  if (descEl) {
    if (animate) gsap.fromTo(descEl, { opacity: 0 }, { opacity: 1, duration: 0.15 });
    descEl.textContent = s.desc;
  }

  renderCands(s, animate);
  renderPath(s, animate);
  renderStack(s, animate);
  renderVars(s, animate);
  renderResults(s, animate);
  setCodeLines(s.lines);
}

function renderCands(s, animate) {
  currentCands.forEach(function(c, idx) {
    var el = document.getElementById('cand-' + idx);
    if (!el) return;
    el.className = 'cand-chip';
    el.style.opacity = '';

    if (idx === s.candIdx) {
      if (s.phase === 'prune') {
        el.classList.add('pruned');
      } else {
        el.classList.add('active');
        if (animate) {
          gsap.fromTo(el, { scale: 1 }, { scale: 1.18, duration: 0.1, yoyo: true, repeat: 1 });
        }
      }
    } else {
      var topFrame = s.stack.length ? s.stack[s.stack.length - 1] : null;
      if (topFrame && idx < topFrame.start) {
        el.classList.add('skipped');
      }
    }
  });
}

function renderPath(s, animate) {
  var row = document.getElementById('path-row');
  if (!row) return;

  if (s.path.length === 0) {
    row.innerHTML = '<span class="path-empty">empty</span>';
    return;
  }

  var isFound = s.phase === 'found';
  var isPrune = s.phase === 'prune';
  var itemClass = 'path-item' + (isFound ? ' found' : '');

  var html = s.path.map(function(v) {
    return '<div class="' + itemClass + '">' + v + '</div>';
  }).join('');
  html += '<span class="path-sum">= ' + s.sum + '</span>';

  if (isFound) html += '<span class="path-tag found">&nbsp;✓ found!</span>';
  else if (isPrune) html += '<span class="path-tag prune">&nbsp;✗ pruned</span>';

  row.innerHTML = html;

  if (animate && s.phase === 'add') {
    var items = row.querySelectorAll('.path-item');
    var last = items[items.length - 1];
    if (last) {
      gsap.fromTo(last, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(2)' });
    }
  }
  if (animate && isFound) {
    gsap.fromTo(row, { backgroundColor: 'rgba(158,206,106,0.12)' }, { backgroundColor: 'transparent', duration: 0.6 });
  }
}

function renderStack(s, animate) {
  var body = document.getElementById('stack-body');
  if (!body) return;

  if (s.stack.length === 0) {
    body.innerHTML = '<div style="color:var(--text-ghost);font-size:0.78rem">No active recursion.</div>';
    return;
  }

  var isWin = s.phase === 'found';
  body.innerHTML = s.stack.map(function(f, depth) {
    var isTop = depth === s.stack.length - 1;
    var cls = isTop ? (isWin ? 'stack-frame win' : 'stack-frame top') : 'stack-frame';
    var indent = '  '.repeat(depth * 2);
    var pathStr = f.path.length ? '[' + f.path.join(', ') + ']' : '[]';
    return '<div class="' + cls + '">' + indent +
           '► backtrack(start=' + f.start + ', sum=' + f.sum + ', path=' + pathStr + ')</div>';
  }).join('');

  body.scrollTop = body.scrollHeight;
}

function renderVars(s, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = (val === null || val === undefined) ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  var top = s.stack.length ? s.stack[s.stack.length - 1] : null;
  setVal('vv-start', top ? top.start : null);
  setVal('vv-sum',   s.phase !== 'done' ? s.sum : null);
  setVal('vv-rem',   s.phase !== 'done' ? (currentTarget - s.sum) : null);
}

function renderResults(s, animate) {
  var list     = document.getElementById('results-list');
  var countEl  = document.getElementById('result-count');
  if (!list) return;

  if (countEl) countEl.textContent = s.results.length ? '(' + s.results.length + ' found)' : '';

  if (s.results.length === 0) {
    list.innerHTML = '<span class="result-empty">No combinations yet.</span>';
    return;
  }

  list.innerHTML = s.results.map(function(combo) {
    var total = combo.reduce(function(a, b) { return a + b; }, 0);
    return '<div class="result-combo">[' + combo.join(', ') + ']&nbsp;= ' + total + '</div>';
  }).join('');

  if (animate && s.phase === 'found') {
    var last = list.querySelector('.result-combo:last-child');
    if (last) {
      gsap.fromTo(last, { x: -8, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: 'power2.out' });
    }
  }
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0];
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
