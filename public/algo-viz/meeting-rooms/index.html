<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Rooms</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  .panel-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .code-line { display: flex; align-items: center; padding: 2px 0 2px 6px; white-space: pre; border-left: 2px solid transparent; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .code-line.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* page-specific */
  .timeline-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  #timeline-svg { width: 100%; display: block; overflow: visible; }
  .var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .var-box { padding: 8px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .var-box.accent-border { border-color: var(--accent); }
  .var-box.yellow-border { border-color: var(--yellow); }
  .var-label { font-size: 0.6rem; font-family: monospace; color: var(--text-faint); text-align: center; }
  .var-val { font-size: 1rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }
  .cmp-box { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .cmp-row { display: flex; align-items: center; gap: 5px; font-family: monospace; font-size: 0.75rem; flex-wrap: wrap; }
  .cmp-side { color: var(--text-dim); }
  .cmp-op { color: var(--yellow); font-weight: 700; }
  .cmp-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; display: none; font-family: monospace; }
  .cmp-badge.ok { display: inline-block; background: #1a2b14; color: #9ece6a; border: 1px solid #4d7a23; }
  .cmp-badge.clash { display: inline-block; background: #2b1420; color: #f7768e; border: 1px solid #8b3a4a; }
  .result-badge { font-size: 0.78rem; font-weight: 700; padding: 5px 10px; border-radius: 6px; font-family: monospace; display: none; }
  .result-badge.can { display: block; background: #1a2b14; color: #9ece6a; border: 1px solid #4d7a23; }
  .result-badge.cannot { display: block; background: #2b1420; color: #f7768e; border: 1px solid #8b3a4a; }
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); }
  .legend-swatch { width: 22px; height: 12px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"intervals":"0,30;5,10;15,20"}'>Has conflict</option>
      <option value='{"intervals":"7,10;2,4"}'>No conflict</option>
      <option value='{"intervals":"0,5;5,10;10,15"}'>Touching only</option>
      <option value='{"intervals":"1,5;2,3;4,6"}'>Nested intervals</option>
      <option value='{"intervals":"10,20;30,40;50,60"}'>Far apart</option>
      <option value='{"intervals":"5,10;5,15;10,20"}'>Complex overlaps</option>
    </select>
  </div>
  <div>
    <label>Intervals (start,end;...)</label>
    <input id="inp-intervals" type="text" value="0,30;5,10;15,20" style="width:180px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Meeting Rooms</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div class="timeline-panel">
      <div class="panel-label">Timeline</div>
      <svg id="timeline-svg" viewBox="0 0 700 100" preserveAspectRatio="xMidYMid meet">
        <text x="350" y="55" text-anchor="middle" fill="#3b4261" font-size="13" font-family="monospace">Run simulation to see timeline</text>
      </svg>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Comparison</div>
    <div class="var-grid">
      <div class="var-box yellow-border">
        <div class="var-label">intervals[i]</div>
        <div class="var-val" id="vv-curr">&mdash;</div>
      </div>
      <div class="var-box accent-border">
        <div class="var-label">intervals[i-1]</div>
        <div class="var-val" id="vv-prev">&mdash;</div>
      </div>
    </div>
    <div class="cmp-box">
      <div class="panel-label" style="margin-bottom:4px">Overlap check</div>
      <div class="cmp-row">
        <span class="cmp-side" id="cmp-lhs">start</span>
        <span class="cmp-op">&lt;</span>
        <span class="cmp-side" id="cmp-rhs">prev.end</span>
        <span class="cmp-badge" id="cmp-badge"></span>
      </div>
    </div>
    <div class="result-badge" id="result-badge"></div>
    <div class="sidebar-title" style="margin-top:4px">Legend</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="legend-row"><div class="legend-swatch" style="background:#2a2007;border:1.5px solid #e0af68"></div><span>Current (i)</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#0d1a35;border:1.5px solid #7aa2f7"></div><span>Previous (i-1)</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#1a2b14;border:1.5px solid #4d7a23"></div><span>OK &#8212; no overlap</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#2b1420;border:1.5px solid #8b3a4a"></div><span>Conflict</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#1a1b26;border:1.5px solid #414868"></div><span>Pending</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">canAttendMeetings</span><span class="op">(</span>intervals<span class="op">):</span>'],
  [2,  '    intervals<span class="op">.</span><span class="bi">sort</span><span class="op">(</span><span class="kw">key</span><span class="op">=</span><span class="kw">lambda</span> x<span class="op">:</span> x<span class="op">[</span><span class="nb">0</span><span class="op">])</span>  <span class="cm"># sort by start</span>'],
  [3,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">1</span><span class="op">,</span> <span class="bi">len</span><span class="op">(</span>intervals<span class="op">)):</span>'],
  [4,  '        <span class="kw">if</span> intervals<span class="op">[</span>i<span class="op">][</span><span class="nb">0</span><span class="op">]</span> <span class="op">&lt;</span> intervals<span class="op">[</span>i<span class="op">-</span><span class="nb">1</span><span class="op">][</span><span class="nb">1</span><span class="op">]:</span>'],
  [5,  '            <span class="kw">return</span> <span class="bi">False</span>  <span class="cm"># overlap found</span>'],
  [6,  '    <span class="kw">return</span> <span class="bi">True</span>'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  loadPreset();

  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      renderStep(snap, cur > 0);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
      var badge = document.getElementById('result-badge');
      if (badge) {
        badge.className = 'result-badge';
        badge.textContent = '';
        if (snap.phase === 'Done') {
          if (snap.canAttend) {
            badge.className = 'result-badge can';
            badge.textContent = '✓ CAN attend all meetings';
          } else {
            badge.className = 'result-badge cannot';
            badge.textContent = '✗ CANNOT attend all meetings';
          }
        }
      }
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    nav.stopPlay(); nav.goTo(0);
  });
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="code-line" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) { document.getElementById('inp-intervals').value = '0,30;5,10;15,20'; return; }
  var d = JSON.parse(sel.value);
  document.getElementById('inp-intervals').value = d.intervals;
}

function randomExample() {
  var intervals = [];
  var n = Math.floor(Math.random() * 4) + 2;
  for (var i = 0; i < n; i++) {
    var s = Math.floor(Math.random() * 40);
    intervals.push(s + ',' + (s + Math.floor(Math.random() * 30) + 5));
  }
  document.getElementById('presetSel').value = '';
  document.getElementById('inp-intervals').value = intervals.join(';');
}

function parseIntervals(raw) {
  var result = [];
  raw.split(';').forEach(function(pair) {
    var parts = pair.split(',').map(function(s) { return parseInt(s.trim(), 10); });
    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) result.push([parts[0], parts[1]]);
  });
  return result;
}

function buildAndRun() {
  var raw = document.getElementById('inp-intervals').value;
  var intervals = parseIntervals(raw);
  if (intervals.length < 2) { alert('Need at least 2 intervals (format: start,end;start,end).'); return; }
  simSteps = simulate(intervals);
  nav.load(simSteps);
}

function fmtIv(iv) { return '[' + iv[0] + ',' + iv[1] + ']'; }

function simulate(intervals) {
  var steps = [];
  function snap(phase, desc, lines, opts) {
    opts = opts || {};
    steps.push({
      phase: phase, desc: desc, lines: lines,
      sorted: (opts.sorted || intervals).slice(), isSorted: !!opts.isSorted,
      currentIdx: opts.currentIdx !== undefined ? opts.currentIdx : -1,
      status: (opts.status || []).slice(),
      decision: opts.decision !== undefined ? opts.decision : null,
      canAttend: opts.canAttend !== undefined ? opts.canAttend : null,
      conflict: opts.conflict !== undefined ? opts.conflict : -1,
    });
  }
  snap('Input', 'Input: ' + intervals.length + ' intervals. Can one person attend all meetings without overlap?', [1], { sorted: intervals.slice(), isSorted: false, status: new Array(intervals.length).fill(null) });
  var sorted = intervals.slice().sort(function(a, b) { return a[0] - b[0]; });
  snap('Sort', 'Sort by start time: ' + sorted.map(fmtIv).join(' → ') + '. After sorting, overlaps can only occur between adjacent intervals.', [2], { sorted: sorted.slice(), isSorted: true, status: new Array(sorted.length).fill(null) });
  var status = new Array(sorted.length).fill(null);
  status[0] = 'ok';
  snap('Init', 'First interval ' + fmtIv(sorted[0]) + ' is our anchor — mark it OK and start comparing.', [3], { sorted: sorted, isSorted: true, currentIdx: 0, status: status.slice() });
  for (var i = 1; i < sorted.length; i++) {
    var cur = sorted[i], prev = sorted[i - 1];
    snap('Compare', 'Check ' + fmtIv(cur) + ' vs ' + fmtIv(prev) + ': does ' + cur[0] + ' < ' + prev[1] + '?', [3, 4], { sorted: sorted, isSorted: true, currentIdx: i, status: status.slice(), decision: null });
    if (cur[0] < prev[1]) {
      status[i] = 'conflict';
      snap('Conflict', cur[0] + ' < ' + prev[1] + ' → OVERLAP! ' + fmtIv(cur) + ' starts before ' + fmtIv(prev) + ' ends.', [4, 5], { sorted: sorted, isSorted: true, currentIdx: i, status: status.slice(), decision: 'conflict', conflict: i });
      snap('Done', 'Overlap detected. Return False — you CANNOT attend all meetings.', [5], { sorted: sorted, isSorted: true, currentIdx: i, status: status.slice(), canAttend: false, conflict: i });
      return steps;
    } else {
      status[i] = 'ok';
      snap('OK', cur[0] + ' >= ' + prev[1] + ' → no overlap. ' + fmtIv(cur) + ' starts at or after ' + fmtIv(prev) + ' ends.', [3, 4], { sorted: sorted, isSorted: true, currentIdx: i, status: status.slice(), decision: 'ok' });
    }
  }
  snap('Done', 'All ' + sorted.length + ' intervals checked — no overlaps found. Return True — you CAN attend all meetings!', [6], { sorted: sorted, isSorted: true, currentIdx: -1, status: status.slice(), canAttend: true, conflict: -1 });
  return steps;
}

var C = {
  pending:  { fill: '#1a1b26', stroke: '#414868', text: '#565f89' },
  current:  { fill: '#2a2007', stroke: '#e0af68', text: '#e0af68' },
  prev:     { fill: '#0d1a35', stroke: '#7aa2f7', text: '#7aa2f7' },
  ok:       { fill: '#1a2b14', stroke: '#4d7a23', text: '#9ece6a' },
  conflict: { fill: '#2b1420', stroke: '#8b3a4a', text: '#f7768e' },
  axis: '#414868', axisText: '#565f89', label: '#3b4261',
};

function renderStep(snap, animate) {
  renderSVG(snap, animate);
  renderVars(snap, animate);
  renderCode(snap.lines);
}

function renderSVG(snap, animate) {
  var svg = document.getElementById('timeline-svg');
  if (!snap.sorted || snap.sorted.length === 0) return;
  var n = snap.sorted.length, W = 700, PAD_L = 60, PAD_R = 24, CW = W - PAD_L - PAD_R, BAR_H = 20, ROW_H = 30;
  var allVals = []; snap.sorted.forEach(function(iv) { allVals.push(iv[0], iv[1]); });
  var minV = Math.min.apply(null, allVals), maxV = Math.max.apply(null, allVals), span = maxV - minV || 1;
  var vMin = minV - span * 0.1, vMax = maxV + span * 0.1;
  function xS(v) { return PAD_L + (v - vMin) / (vMax - vMin) * CW; }
  var AXIS_Y = 22, ROW_Y0 = 42, TOTAL_H = ROW_Y0 + n * ROW_H + 20;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + TOTAL_H);
  var parts = [];
  var step = Math.max(1, Math.round(span / 5)), tickStart = Math.ceil(minV / step) * step;
  parts.push('<line x1="' + PAD_L + '" y1="' + AXIS_Y + '" x2="' + (W-PAD_R) + '" y2="' + AXIS_Y + '" stroke="' + C.axis + '" stroke-width="1"/>');
  for (var tv = tickStart; tv <= maxV; tv += step) {
    var tx = xS(tv);
    parts.push('<line x1="' + tx + '" y1="' + (AXIS_Y-4) + '" x2="' + tx + '" y2="' + (AXIS_Y+4) + '" stroke="' + C.axis + '" stroke-width="1"/>');
    parts.push('<text x="' + tx + '" y="' + (AXIS_Y+16) + '" text-anchor="middle" fill="' + C.axisText + '" font-size="10" font-family="monospace">' + tv + '</text>');
  }
  parts.push('<text x="' + (PAD_L-4) + '" y="' + (ROW_Y0-6) + '" text-anchor="end" fill="' + C.label + '" font-size="10" font-weight="600">' + (snap.isSorted ? 'SORTED' : 'INPUT') + '</text>');
  snap.sorted.forEach(function(iv, idx) {
    var barY = ROW_Y0 + idx * ROW_H, barCy = barY + BAR_H / 2;
    var x1 = xS(iv[0]), x2 = xS(iv[1]), bw = Math.max(x2 - x1, 4);
    var st;
    if (idx === snap.currentIdx) st = C.current;
    else if (idx === snap.currentIdx - 1 && snap.currentIdx > 0) st = snap.status[idx] === 'ok' ? C.ok : (snap.status[idx] === 'conflict' ? C.conflict : C.prev);
    else if (snap.status[idx] === 'ok') st = C.ok;
    else if (snap.status[idx] === 'conflict') st = C.conflict;
    else st = C.pending;
    if (snap.conflict > 0 && idx === snap.conflict - 1 && snap.status[idx] !== 'conflict') st = C.prev;
    parts.push('<text x="' + (PAD_L-5) + '" y="' + (barCy+4) + '" text-anchor="end" fill="' + st.text + '" font-size="10" font-family="monospace">' + fmtIv(iv) + '</text>');
    parts.push('<rect x="' + x1 + '" y="' + barY + '" width="' + bw + '" height="' + BAR_H + '" rx="4" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="1.5"/>');
    if (bw > 30) parts.push('<text x="' + (x1+bw/2) + '" y="' + (barCy+4) + '" text-anchor="middle" fill="' + st.text + '" font-size="9.5" font-family="monospace" font-weight="600">' + fmtIv(iv) + '</text>');
    if (snap.status[idx] === 'conflict') parts.push('<line x1="' + x1 + '" y1="' + barCy + '" x2="' + (x1+bw) + '" y2="' + barCy + '" stroke="#f7768e" stroke-width="2" opacity="0.7"/>');
  });
  if (snap.currentIdx > 0) {
    var ci = snap.currentIdx, ivCur = snap.sorted[ci], ivPrev = snap.sorted[ci-1];
    if (ivCur && ivPrev) {
      var os = Math.max(ivCur[0], ivPrev[0]), oe = Math.min(ivCur[1], ivPrev[1]);
      if (oe > os && snap.decision === 'conflict') {
        var ox1 = xS(os), ow = Math.max(xS(oe)-ox1, 2), oy = ROW_Y0+(ci-1)*ROW_H, oh = ROW_H*2-4;
        parts.push('<rect x="' + ox1 + '" y="' + oy + '" width="' + ow + '" height="' + oh + '" fill="#f7768e" opacity="0.15" rx="2"/>');
        parts.push('<line x1="' + ox1 + '" y1="' + oy + '" x2="' + ox1 + '" y2="' + (oy+oh) + '" stroke="#f7768e" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>');
        parts.push('<line x1="' + (ox1+ow) + '" y1="' + oy + '" x2="' + (ox1+ow) + '" y2="' + (oy+oh) + '" stroke="#f7768e" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>');
      }
    }
  }
  svg.innerHTML = parts.join('');
}

function renderVars(snap, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id); if (!el) return;
    var text = (val === null || val === undefined) ? '—' : String(val);
    if (animate && el.textContent !== text) gsap.fromTo(el, { scale: 0.85, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    el.textContent = text;
  }
  var ci = snap.currentIdx, cur = ci >= 0 ? snap.sorted[ci] : null, prev = ci > 0 ? snap.sorted[ci-1] : null;
  setVal('vv-curr', cur ? fmtIv(cur) : null);
  setVal('vv-prev', prev ? fmtIv(prev) : null);
  var lhsEl = document.getElementById('cmp-lhs'), rhsEl = document.getElementById('cmp-rhs'), badgeEl = document.getElementById('cmp-badge');
  if (cur && prev) {
    lhsEl.textContent = cur[0]; rhsEl.textContent = prev[1];
    badgeEl.className = 'cmp-badge';
    if (snap.decision === 'ok') { badgeEl.className = 'cmp-badge ok'; badgeEl.textContent = 'no overlap'; }
    else if (snap.decision === 'conflict') { badgeEl.className = 'cmp-badge clash'; badgeEl.textContent = 'OVERLAP'; }
    else badgeEl.textContent = '';
  } else {
    lhsEl.textContent = 'start'; rhsEl.textContent = 'prev.end';
    badgeEl.className = 'cmp-badge'; badgeEl.textContent = '';
  }
}

function renderCode(lines) {
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]); if (!el) return;
    if (lines.indexOf(e[0]) >= 0) el.classList.add('hl'); else el.classList.remove('hl');
  });
}

(function() {
  var handle = document.getElementById('resize-handle'), panel = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) { dragging = true; startX = e.clientX; startW = panel.offsetWidth; handle.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!dragging) return; panel.style.width = Math.min(560, Math.max(120, startW + (startX - e.clientX))) + 'px'; });
  document.addEventListener('mouseup', function() { if (dragging) { dragging = false; handle.classList.remove('dragging'); } });
})();
</script>
