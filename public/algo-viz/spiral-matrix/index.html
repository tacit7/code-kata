<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spiral Matrix</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 18px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; overflow: auto; padding: 10px 12px; }
  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  #desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; min-height: 20px; }

  /* code panel */
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }
  .cm { color: var(--text-dim); font-style: italic; }

  /* matrix grid */
  .grid-section {
    padding: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column; gap: 10px;
  }
  .grid-scroll { overflow-x: auto; }
  .matrix-wrap { display: inline-flex; flex-direction: column; gap: 5px; }
  .matrix-row { display: flex; gap: 5px; }
  .m-cell {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--border-soft); border-radius: 6px;
    background: #0f0f0f;
    font-size: 1rem; font-weight: 700; font-family: monospace;
    color: var(--text-ghost);
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    position: relative;
  }
  .m-cell[data-state="unvisited"] {
    border-style: dashed; color: var(--text-ghost);
  }
  .m-cell[data-state="current"] {
    border-style: solid; border-color: var(--accent); color: var(--accent-pale);
    background: var(--surface-dark);
  }
  .m-cell[data-state="visited"] {
    border-style: solid; border-color: #2d3148; color: var(--text-dim);
    background: #111420;
  }
  .m-cell[data-state="boundary"] {
    border-style: solid; border-color: #4a3800; color: var(--text-ghost);
    background: #131000;
  }

  /* boundary highlight overlays */
  .m-cell[data-top="1"]    { border-top-color: var(--orange) !important; border-top-style: solid !important; }
  .m-cell[data-bottom="1"] { border-bottom-color: #22c55e !important; border-bottom-style: solid !important; }
  .m-cell[data-left="1"]   { border-left-color: #60a5fa !important; border-left-style: solid !important; }
  .m-cell[data-right="1"]  { border-right-color: #c084fc !important; border-right-style: solid !important; }

  /* output array */
  .output-section {
    padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column; gap: 8px;
  }
  .output-scroll { overflow-x: auto; }
  .output-row { display: flex; gap: 5px; flex-wrap: nowrap; padding-bottom: 4px; min-height: 44px; align-items: center; }
  .out-chip {
    min-width: 36px; height: 36px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2d3148; border-radius: 5px;
    background: #111420;
    font-size: 0.85rem; font-weight: 700; font-family: monospace;
    color: var(--text-dim); flex-shrink: 0;
  }
  .out-chip.fresh {
    border-color: var(--accent); color: var(--accent-pale); background: var(--surface-dark);
  }

  /* direction badge */
  .dir-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 700;
    font-family: monospace;
  }
  .dir-badge.right  { background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.35); color: #c084fc; }
  .dir-badge.down   { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3);  color: #22c55e; }
  .dir-badge.left   { background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); color: #60a5fa; }
  .dir-badge.up     { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.3); color: var(--orange); }
  .dir-badge.done   { background: rgba(234,179,8,0.1);  border: 1px solid rgba(234,179,8,0.3);  color: var(--yellow); }

  /* panel-box */
  .panel-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .panel-title {
    font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
  }

  /* boundary vars */
  .bound-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bound-box {
    padding: 8px 6px;
    background: var(--bg); border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .bound-box.top-b    { border-color: var(--orange); }
  .bound-box.bottom-b { border-color: #22c55e; }
  .bound-box.left-b   { border-color: #60a5fa; }
  .bound-box.right-b  { border-color: #c084fc; }
  .bound-label { font-size: 0.62rem; font-family: monospace; color: var(--text-faint); }
  .bound-val   { font-size: 1.2rem; font-weight: 700; color: var(--text-bright); }

  /* legend */
  .legend-row { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--text-muted); }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .leg-swatch { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:120px;">
      <option value="3x3" selected>3&times;3</option>
      <option value="3x4">3&times;4</option>
      <option value="4x4">4&times;4</option>
      <option value="2x5">2&times;5</option>
      <option value="5x2">5&times;2</option>
      <option value="1x6">1&times;6</option>
    </select>
  </div>
  <div>
    <label>Rows</label>
    <input type="number" id="rowsInput" value="3" min="1" max="8" style="width:64px;" />
  </div>
  <div>
    <label>Cols</label>
    <input type="number" id="colsInput" value="3" min="1" max="8" style="width:64px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Spiral Matrix</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Select a preset and click Run.</div>
    <div class="grid-section" id="grid-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Select a preset and click Run.</span>
    </div>
    <div class="output-section" id="output-section" style="display:none">
      <div class="panel-title">Output (spiral order)</div>
      <div class="output-scroll"><div class="output-row" id="output-row"></div></div>
    </div>
    <div id="dir-badge-wrap"></div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Boundaries</div>
      <div class="bound-grid">
        <div class="bound-box top-b">
          <div class="bound-label">top</div>
          <div class="bound-val" id="bv-top">&mdash;</div>
        </div>
        <div class="bound-box bottom-b">
          <div class="bound-label">bottom</div>
          <div class="bound-val" id="bv-bottom">&mdash;</div>
        </div>
        <div class="bound-box left-b">
          <div class="bound-label">left</div>
          <div class="bound-val" id="bv-left">&mdash;</div>
        </div>
        <div class="bound-box right-b">
          <div class="bound-label">right</div>
          <div class="bound-val" id="bv-right">&mdash;</div>
        </div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Legend</div>
      <div class="legend-row">
        <div class="legend-item">
          <div class="leg-swatch" style="border:2px solid var(--accent);background:var(--surface-dark)"></div>
          <span>Current cell</span>
        </div>
        <div class="legend-item">
          <div class="leg-swatch" style="border:2px solid #2d3148;background:#111420"></div>
          <span>Visited cell</span>
        </div>
        <div class="legend-item">
          <div class="leg-swatch" style="border:2px dashed var(--border-soft);background:#0f0f0f"></div>
          <span>Unvisited</span>
        </div>
        <div class="legend-item" style="margin-top:4px;flex-wrap:wrap;gap:6px">
          <span style="color:var(--orange);font-weight:700;font-size:0.78rem">&mdash; top</span>
          <span style="color:#22c55e;font-weight:700;font-size:0.78rem">&mdash; bottom</span>
          <span style="color:#60a5fa;font-weight:700;font-size:0.78rem">&mdash; left</span>
          <span style="color:#c084fc;font-weight:700;font-size:0.78rem">&mdash; right</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var codeLines = [
  { n: 1,  t: '<span class="kw">def</span> <span class="nb">spiralOrder</span>(matrix):' },
  { n: 2,  t: '  result = []' },
  { n: 3,  t: '  top, bottom = 0, <span class="nb">len</span>(matrix) - 1' },
  { n: 4,  t: '  left, right = 0, <span class="nb">len</span>(matrix[0]) - 1' },
  { n: 5,  t: '  <span class="kw">while</span> top &lt;= bottom <span class="kw">and</span> left &lt;= right:' },
  { n: 6,  t: '    <span class="kw">for</span> c <span class="kw">in</span> <span class="nb">range</span>(left, right + 1):  <span class="cm"># right</span>' },
  { n: 7,  t: '      result.append(matrix[top][c])' },
  { n: 8,  t: '    top += 1' },
  { n: 9,  t: '    <span class="kw">for</span> r <span class="kw">in</span> <span class="nb">range</span>(top, bottom + 1):  <span class="cm"># down</span>' },
  { n: 10, t: '      result.append(matrix[r][right])' },
  { n: 11, t: '    right -= 1' },
  { n: 12, t: '    <span class="kw">if</span> top &lt;= bottom:' },
  { n: 13, t: '      <span class="kw">for</span> c <span class="kw">in</span> <span class="nb">range</span>(right, left - 1, -1):  <span class="cm"># left</span>' },
  { n: 14, t: '        result.append(matrix[bottom][c])' },
  { n: 15, t: '      bottom -= 1' },
  { n: 16, t: '    <span class="kw">if</span> left &lt;= right:' },
  { n: 17, t: '      <span class="kw">for</span> r <span class="kw">in</span> <span class="nb">range</span>(bottom, top - 1, -1):  <span class="cm"># up</span>' },
  { n: 18, t: '        result.append(matrix[r][left])' },
  { n: 19, t: '      left += 1' },
  { n: 20, t: '  <span class="kw">return</span> result' },
];

var PRESETS = {
  '3x3': [3, 3],
  '3x4': [3, 4],
  '4x4': [4, 4],
  '2x5': [2, 5],
  '5x2': [5, 2],
  '1x6': [1, 6]
};

var currentMatrix = [];
var simSteps = [];
var nav;

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + (line.n - 1);
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      updateStatus(snap, cur, total);
    }
  });
  window.nav = nav;

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  buildAndRun();
});

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  var descEl = document.getElementById('desc');
  if (descEl) {
    gsap.fromTo(descEl, { opacity: 0 }, { opacity: 1, duration: 0.15 });
    descEl.textContent = snap.desc;
  }
}

function buildMatrix(rows, cols) {
  var m = [];
  var v = 1;
  for (var r = 0; r < rows; r++) {
    var row = [];
    for (var c = 0; c < cols; c++) { row.push(v++); }
    m.push(row);
  }
  return m;
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value || !PRESETS[sel.value]) return;
  var dims = PRESETS[sel.value];
  document.getElementById('rowsInput').value = dims[0];
  document.getElementById('colsInput').value = dims[1];
  buildAndRun();
}

function randomExample() {
  var rows = 1 + Math.floor(Math.random() * 5);
  var cols = 1 + Math.floor(Math.random() * 5);
  if (rows === 1 && cols === 1) cols = 2;
  document.getElementById('rowsInput').value = rows;
  document.getElementById('colsInput').value = cols;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var rows = parseInt(document.getElementById('rowsInput').value, 10);
  var cols = parseInt(document.getElementById('colsInput').value, 10);
  if (isNaN(rows) || rows < 1) rows = 1;
  if (isNaN(cols) || cols < 1) cols = 1;
  if (rows > 8) rows = 8;
  if (cols > 8) cols = 8;
  document.getElementById('rowsInput').value = rows;
  document.getElementById('colsInput').value = cols;
  currentMatrix = buildMatrix(rows, cols);
  simSteps = simulate(currentMatrix);
  buildGridSection();
  buildOutputSection();
  nav.load(simSteps);
}

// --- Build DOM ---
function buildGridSection() {
  var sec = document.getElementById('grid-section');
  var rows = currentMatrix.length;
  var cols = currentMatrix[0].length;
  var html = '<div class="grid-scroll"><div class="matrix-wrap" id="matrix-wrap">';
  for (var r = 0; r < rows; r++) {
    html += '<div class="matrix-row">';
    for (var c = 0; c < cols; c++) {
      html += '<div class="m-cell" id="mc-' + r + '-' + c + '" data-state="unvisited">'
        + currentMatrix[r][c] + '</div>';
    }
    html += '</div>';
  }
  html += '</div></div>';
  sec.innerHTML = html;
}

function buildOutputSection() {
  var sec = document.getElementById('output-section');
  sec.style.display = '';
  document.getElementById('output-row').innerHTML = '';
}

// --- Simulate ---
function simulate(matrix) {
  var steps = [];
  var rows = matrix.length;
  var cols = matrix[0].length;
  var top = 0, bottom = rows - 1, left = 0, right = cols - 1;
  var result = [];
  var visited = [];
  for (var r = 0; r < rows; r++) { visited.push(new Array(cols).fill(false)); }

  function snap(phase, desc, dir, curR, curC, t, b, l, ri) {
    steps.push({
      phase: phase,
      desc: desc,
      dir: dir,
      curR: curR,
      curC: curC,
      top: t, bottom: b, left: l, right: ri,
      result: result.slice(),
      visited: visited.map(function(row) { return row.slice(); })
    });
  }

  snap('Init', 'Set boundaries: top=0, bottom=' + (rows-1) + ', left=0, right=' + (cols-1) + '. Ready to spiral.', '', -1, -1, top, bottom, left, right);

  while (top <= bottom && left <= right) {
    // traverse right along top row
    for (var c = left; c <= right; c++) {
      snap('Traverse', 'Direction: RIGHT along top row (row ' + top + '). Visit [' + top + '][' + c + '] = ' + matrix[top][c] + '.', 'right', top, c, top, bottom, left, right);
      result.push(matrix[top][c]);
      visited[top][c] = true;
      snap('Collect', 'Collected ' + matrix[top][c] + '. Output so far: [' + result.join(', ') + '].', 'right', top, c, top, bottom, left, right);
    }
    top++;

    // traverse down along right col
    for (var r = top; r <= bottom; r++) {
      snap('Traverse', 'Direction: DOWN along right col (col ' + right + '). Visit [' + r + '][' + right + '] = ' + matrix[r][right] + '.', 'down', r, right, top, bottom, left, right);
      result.push(matrix[r][right]);
      visited[r][right] = true;
      snap('Collect', 'Collected ' + matrix[r][right] + '. Output so far: [' + result.join(', ') + '].', 'down', r, right, top, bottom, left, right);
    }
    right--;

    // traverse left along bottom row
    if (top <= bottom) {
      for (var c = right; c >= left; c--) {
        snap('Traverse', 'Direction: LEFT along bottom row (row ' + bottom + '). Visit [' + bottom + '][' + c + '] = ' + matrix[bottom][c] + '.', 'left', bottom, c, top, bottom, left, right);
        result.push(matrix[bottom][c]);
        visited[bottom][c] = true;
        snap('Collect', 'Collected ' + matrix[bottom][c] + '. Output so far: [' + result.join(', ') + '].', 'left', bottom, c, top, bottom, left, right);
      }
      bottom--;
    }

    // traverse up along left col
    if (left <= right) {
      for (var r = bottom; r >= top; r--) {
        snap('Traverse', 'Direction: UP along left col (col ' + left + '). Visit [' + r + '][' + left + '] = ' + matrix[r][left] + '.', 'up', r, left, top, bottom, left, right);
        result.push(matrix[r][left]);
        visited[r][left] = true;
        snap('Collect', 'Collected ' + matrix[r][left] + '. Output so far: [' + result.join(', ') + '].', 'up', r, left, top, bottom, left, right);
      }
      left++;
    }
  }

  snap('Done', 'All ' + result.length + ' elements collected in spiral order: [' + result.join(', ') + '].', 'done', -1, -1, top, bottom, left, right);
  return steps;
}

// --- Code line highlight mapping ---
function linesFor(s) {
  if (s.phase === 'Init') return [2, 3];
  if (s.phase === 'Done') return [19];
  var isCollect = (s.phase === 'Collect');
  if (s.dir === 'right') return isCollect ? [6] : [5];
  if (s.dir === 'down')  return isCollect ? [9] : [8];
  if (s.dir === 'left')  return isCollect ? [13] : [12];
  if (s.dir === 'up')    return isCollect ? [17] : [16];
  return [4];
}

// --- Render step ---
function applyStep(s, animate) {
  var rows = currentMatrix.length;
  var cols = currentMatrix[0].length;

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var el = document.getElementById('mc-' + r + '-' + c);
      if (!el) continue;

      // state
      var state = 'unvisited';
      if (r === s.curR && c === s.curC) {
        state = 'current';
      } else if (s.visited[r][c]) {
        state = 'visited';
      }
      el.dataset.state = state;

      // boundary edge highlights
      el.dataset.top    = (r === s.top    && c >= s.left && c <= s.right) ? '1' : '0';
      el.dataset.bottom = (r === s.bottom && c >= s.left && c <= s.right) ? '1' : '0';
      el.dataset.left   = (c === s.left   && r >= s.top  && r <= s.bottom) ? '1' : '0';
      el.dataset.right  = (c === s.right  && r >= s.top  && r <= s.bottom) ? '1' : '0';

      if (animate && state === 'current') {
        gsap.fromTo(el, { scale: 0.7 }, { scale: 1.1, duration: 0.18, ease: 'power2.out',
          onComplete: function(e) { gsap.to(e, { scale: 1, duration: 0.12 }); }.bind(null, el)
        });
      }
    }
  }

  // code highlight
  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  linesFor(s).forEach(function(idx) {
    var el = document.getElementById('cl-' + idx);
    if (el) el.classList.add('hl');
  });

  // output chips
  var row = document.getElementById('output-row');
  if (row) {
    var chips = '';
    for (var i = 0; i < s.result.length; i++) {
      var isLast = (i === s.result.length - 1) && s.phase === 'Collect';
      chips += '<div class="out-chip' + (isLast ? ' fresh' : '') + '">' + s.result[i] + '</div>';
    }
    row.innerHTML = chips;
    if (animate && s.phase === 'Collect' && s.result.length > 0) {
      var last = row.lastElementChild;
      if (last) gsap.fromTo(last, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: 'back.out(1.7)' });
    }
  }

  // boundary values
  function setBound(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = (val < 0) ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setBound('bv-top',    s.top);
  setBound('bv-bottom', s.bottom);
  setBound('bv-left',   s.left);
  setBound('bv-right',  s.right);

  // direction badge
  var wrap = document.getElementById('dir-badge-wrap');
  if (wrap) {
    var labels = { right: '&rarr; RIGHT', down: '&darr; DOWN', left: '&larr; LEFT', up: '&uarr; UP', done: '&#10003; Done', '': '' };
    if (s.dir && labels[s.dir] !== undefined && s.dir !== '') {
      wrap.innerHTML = '<div class="dir-badge ' + s.dir + '">' + labels[s.dir] + '</div>';
    } else {
      wrap.innerHTML = '';
    }
  }
}

// --- Resize handle ---
(function(){
  var h = document.getElementById('resize-handle'),
      p = document.getElementById('code-panel'),
      d = false, sx = 0, sw = 0;
  h.addEventListener('mousedown', function(e){ d = true; sx = e.clientX; sw = p.offsetWidth; h.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e){ if(!d) return; p.style.width = Math.min(560, Math.max(120, sw + (sx - e.clientX))) + 'px'; });
  document.addEventListener('mouseup', function(){ if(!d) return; d = false; h.classList.remove('dragging'); });
})();
</script>
