<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reverse Integer</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .viz-inputs input[type=number] { width: 130px; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .result-badge { margin-left: 8px; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: none; font-family: monospace; }
  .result-badge.ok       { background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.4);  color: #22c55e; }
  .result-badge.overflow { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.35); color: #f87171; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: stretch; padding: 16px; gap: 12px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); min-height: 28px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  #sidebar { width: 0; flex-shrink: 0; overflow: hidden; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border-color: var(--accent); background: var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* digit strip */
  .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .strip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .strip-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); width: 72px; flex-shrink: 0; }
  .digit-cells { display: flex; gap: 6px; flex-wrap: wrap; }
  .dcel { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.1rem; font-weight: 700; font-family: monospace; border: 2px solid var(--border); background: #0f0f0f; color: var(--text-ghost); transition: all 0.25s; }
  .dcel.active  { border-color: var(--accent); color: var(--accent-pale); background: var(--surface-dark); }
  .dcel.popped  { border-color: #f87171; color: #fca5a5; background: rgba(239,68,68,0.08); }
  .dcel.done    { border-color: #2d3148; color: var(--text-ghost); background: #0a0a0f; opacity: 0.45; }
  .dcel.rev-new { border-color: #22c55e; color: #86efac; background: rgba(34,197,94,0.08); }
  .dcel.rev-old { border-color: #2d3148; color: var(--text-dim); background: #111420; }
  .dcel.neg     { border-color: #facc15; color: #fef08a; background: rgba(234,179,8,0.08); }
  .sign-pill { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; font-family: monospace; border: 1px solid #facc15; color: #fef08a; background: rgba(234,179,8,0.08); }
  .op-scroll { flex: 1; overflow-y: auto; max-height: 200px; }
  .op-list { display: flex; flex-direction: column; gap: 5px; }
  .op-row { background: var(--surface-dark); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 7px 10px; font-size: 0.8rem; font-family: monospace; display: flex; flex-direction: column; gap: 2px; transition: border-color 0.2s; }
  .op-row.current { border-color: var(--accent); }
  .op-row.overflow-row { border-color: #f87171; }
  .op-top { display: flex; gap: 10px; align-items: center; }
  .op-iter { font-size: 0.67rem; color: var(--text-ghost); min-width: 36px; }
  .op-action { color: var(--text-bright); font-weight: 600; }
  .op-detail { color: var(--text-dim); font-size: 0.76rem; padding-left: 46px; }
  .overflow-box { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius); padding: 7px 10px; font-size: 0.78rem; color: #fca5a5; font-family: monospace; display: none; }
  .overflow-box.show { display: block; }
  .eq-box { background: var(--surface-dark); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 8px 12px; }
  .eq-line { font-size: 0.82rem; font-family: monospace; color: var(--text-dim); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .eq-val { color: var(--accent-pale); font-weight: 700; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"x":"123"}'>Simple (123)</option>
      <option value='{"x":"0"}'>Zero (0)</option>
      <option value='{"x":"-123"}'>Negative (-123)</option>
      <option value='{"x":"120"}'>Trailing zeros (120)</option>
      <option value='{"x":"1534236469"}'>Large positive (near max)</option>
      <option value='{"x":"1534236470"}'>Overflow positive</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>x =</label>
    <input type="number" id="x-input" value="123" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
  <span class="result-badge" id="result-badge"></span>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Reverse Integer</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Press Run to start.</div>
    <div class="panel-box">
      <div class="panel-title">Digit Strip</div>
      <div class="strip-row">
        <span class="strip-label">original</span>
        <div class="digit-cells" id="orig-cells"></div>
      </div>
      <div class="strip-row">
        <span class="strip-label">reversed</span>
        <div class="digit-cells" id="rev-cells"></div>
      </div>
      <div class="eq-box" id="eq-box">
        <div class="eq-line" id="eq-line"><span style="color:var(--text-ghost)">rev = 0</span></div>
      </div>
      <div class="overflow-box" id="overflow-box"></div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Operation Log</div>
      <div class="op-scroll">
        <div class="op-list" id="op-list"></div>
      </div>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:8px;">Code</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar"></div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="1200">0.5&#215;</option>
    <option value="700" selected>1&#215;</option>
    <option value="350">2&#215;</option>
    <option value="150">4&#215;</option>
  </select>
</div>

<script>
'use strict';

var INT_MAX = 2147483647, INT_MIN = -2147483648;
var nav = null, steps = [];

function simulate(x) {
  var out = [], negative = x < 0, abs = Math.abs(x);
  var digits = String(abs).split('').map(Number), revDigits = [];
  out.push({ phase: 'Init', desc: 'x = ' + x + '. ' + (negative ? 'Negative: strip sign, reverse magnitude, restore sign.' : 'Positive: pop each digit from the right.'), origStates: digits.map(function() { return 'idle'; }), revDigits: [], rev: 0, poppedIdx: -1, isOverflow: false, overflowMsg: '', opIdx: -1, negative: negative, ops: [] });
  var ops = [], rem = abs, rev = 0, iterCount = 0, overflowAt = -1;
  while (rem > 0) {
    var digit = rem % 10; rem = Math.floor(rem / 10); var prevRev = rev;
    var overflowMsg = '', isOverflow = false;
    if (rev > Math.floor(INT_MAX / 10) || (rev === Math.floor(INT_MAX / 10) && digit > 7)) { isOverflow = true; overflowMsg = 'rev (' + rev + ') x10 + ' + digit + ' would exceed INT_MAX. Return 0.'; }
    if (!isOverflow && negative && (rev > Math.floor((-INT_MIN) / 10) || (rev === Math.floor((-INT_MIN) / 10) && digit > 8))) { isOverflow = true; overflowMsg = 'rev (' + rev + ') x10 + ' + digit + ' would exceed |INT_MIN|. Return 0.'; }
    var poppedIdx = digits.length - 1 - iterCount;
    revDigits = [digit].concat(revDigits);
    var origStates = digits.map(function(_, i) { if (i > poppedIdx) return 'done'; if (i === poppedIdx) return 'popped'; return 'idle'; });
    if (isOverflow) {
      overflowAt = iterCount;
      ops.push({ iter: iterCount + 1, action: 'OVERFLOW GUARD', detail: overflowMsg, isOverflow: true });
      out.push({ phase: 'Overflow', desc: 'Overflow detected - return 0.', origStates: origStates, revDigits: revDigits.slice(), rev: prevRev, poppedIdx: poppedIdx, isOverflow: true, overflowMsg: overflowMsg, opIdx: ops.length - 1, negative: negative, ops: ops.slice() });
      break;
    }
    rev = rev * 10 + digit;
    ops.push({ iter: iterCount + 1, action: 'pop digit = ' + digit + ',  rev = ' + prevRev + ' x 10 + ' + digit + ' = ' + rev, detail: 'rem = ' + rem, isOverflow: false });
    var origStates2 = digits.map(function(_, i) { if (i > poppedIdx) return 'done'; if (i === poppedIdx) return 'popped'; return 'idle'; });
    out.push({ phase: 'Iter ' + (iterCount + 1), desc: 'Popped digit ' + digit + ' -> rev = ' + prevRev + ' x 10 + ' + digit + ' = ' + rev + (rem === 0 ? '. Done!' : '. rem = ' + rem + '.'), origStates: origStates2, revDigits: revDigits.slice(), rev: rev, poppedIdx: poppedIdx, isOverflow: false, overflowMsg: '', opIdx: ops.length - 1, negative: negative, ops: ops.slice() });
    iterCount++;
  }
  if (overflowAt === -1) {
    var finalResult = negative ? -rev : rev;
    out.push({ phase: 'Result', desc: (negative ? 'Restore sign: -' + rev + ' = ' : '') + finalResult + '. Answer: ' + finalResult, origStates: digits.map(function() { return 'done'; }), revDigits: revDigits.slice(), rev: rev, poppedIdx: -1, isOverflow: false, overflowMsg: '', opIdx: ops.length, negative: negative, ops: ops.slice(), result: finalResult });
  }
  return out;
}

function buildOrigCells(digits, states, negative) {
  var container = document.getElementById('orig-cells'); container.innerHTML = '';
  if (negative) { var neg = document.createElement('div'); neg.className = 'sign-pill'; neg.textContent = '-'; container.appendChild(neg); }
  digits.forEach(function(d, i) { var el = document.createElement('div'); el.className = 'dcel ' + (states[i] || 'idle'); el.textContent = d; container.appendChild(el); });
}

function buildRevCells(revDigits, negative) {
  var container = document.getElementById('rev-cells'); container.innerHTML = '';
  if (negative && revDigits.length > 0) { var neg = document.createElement('div'); neg.className = 'sign-pill'; neg.textContent = '-'; container.appendChild(neg); }
  revDigits.forEach(function(d, i) { var el = document.createElement('div'); el.className = 'dcel ' + (i === 0 ? 'rev-new' : 'rev-old'); el.textContent = d; container.appendChild(el); });
}

function buildOpList(ops, currentOpIdx) {
  var list = document.getElementById('op-list'); list.innerHTML = '';
  ops.forEach(function(op, i) {
    var row = document.createElement('div');
    row.className = 'op-row' + (i === currentOpIdx ? ' current' : '') + (op.isOverflow ? ' overflow-row' : '');
    var top = document.createElement('div'); top.className = 'op-top';
    var iter = document.createElement('span'); iter.className = 'op-iter'; iter.textContent = '#' + op.iter;
    var action = document.createElement('span'); action.className = 'op-action'; action.style.color = op.isOverflow ? '#f87171' : ''; action.textContent = op.action;
    top.appendChild(iter); top.appendChild(action); row.appendChild(top);
    if (op.detail) { var detail = document.createElement('div'); detail.className = 'op-detail'; detail.textContent = op.detail; row.appendChild(detail); }
    list.appendChild(row);
  });
  var cur = list.children[currentOpIdx]; if (cur) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function applyStep(snap) {
  var digits = String(Math.abs(parseInt(document.getElementById('x-input').value, 10))).split('').map(Number);
  buildOrigCells(digits, snap.origStates, snap.negative);
  buildRevCells(snap.revDigits, snap.negative);
  buildOpList(snap.ops, snap.opIdx);
  var eq = document.getElementById('eq-line');
  if (snap.revDigits.length === 0) { eq.innerHTML = '<span style="color:var(--text-ghost)">rev = 0</span>'; }
  else {
    var revStr = (snap.negative ? '-' : '') + snap.rev;
    if (snap.result !== undefined) revStr = String(snap.result);
    eq.innerHTML = '<span style="color:var(--text-dim)">rev =</span> <span class="eq-val">' + revStr + '</span>';
  }
  var ovBox = document.getElementById('overflow-box');
  if (snap.isOverflow && snap.overflowMsg) { ovBox.className = 'overflow-box show'; ovBox.textContent = snap.overflowMsg; }
  else { ovBox.className = 'overflow-box'; }
  var badge = document.getElementById('result-badge');
  if (snap.result !== undefined) { badge.className = 'result-badge ok'; badge.textContent = '-> ' + snap.result; badge.style.display = ''; }
  else if (snap.isOverflow) { badge.className = 'result-badge overflow'; badge.textContent = '-> 0 (overflow)'; badge.style.display = ''; }
  else { badge.style.display = 'none'; }
}

function buildAndRun() {
  var x = parseInt(document.getElementById('x-input').value, 10);
  if (isNaN(x)) return;
  document.getElementById('result-badge').style.display = 'none';
  document.getElementById('op-list').innerHTML = '';
  document.getElementById('overflow-box').className = 'overflow-box';
  steps = simulate(x);
  nav.load(steps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel'); if (!sel.value) return;
  var d = JSON.parse(sel.value); document.getElementById('x-input').value = d.x; buildAndRun();
}

function randomExample() {
  var examples = [100, -456, 9999, 1, 0, -2147483648, 2147483647, 534236469];
  var x = examples[Math.floor(Math.random() * examples.length)];
  document.getElementById('x-input').value = x;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

window.addEventListener('DOMContentLoaded', function() {
  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-badge').textContent = snap.phase || 'Setup';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      var descEl = document.getElementById('desc');
      gsap.fromTo(descEl, { opacity: 0 }, { opacity: 1, duration: 0.15 });
      descEl.textContent = snap.desc;
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
  document.getElementById('x-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') buildAndRun(); });
  buildAndRun();
});

(function() {
  var handle = document.getElementById('resize-handle'), panel = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) { dragging = true; startX = e.clientX; startW = panel.offsetWidth; handle.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!dragging) return; var delta = startX - e.clientX; panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px'; });
  document.addEventListener('mouseup', function() { if (!dragging) return; dragging = false; handle.classList.remove('dragging'); });
})();
</script>
</body>
</html>
