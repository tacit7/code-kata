<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merge Sort</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; overflow-y: auto; }

  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }

  /* Bar chart */
  #bar-chart { width: 100%; max-width: 640px; height: 180px; display: flex; align-items: flex-end; gap: 4px; padding: 0 2px 28px 2px; position: relative; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 14px; height: 100%; position: relative; }
  .bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.15s ease, background-color 0.2s ease; }
  .bar.c-default  { background: var(--text-dim); opacity: 0.6; }
  .bar.c-active   { background: var(--accent); opacity: 0.85; }
  .bar.c-placing  { background: var(--purple); }
  .bar.c-sorted   { background: var(--green); }
  .bar-val { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; color: var(--text-dim); white-space: nowrap; }
  .bar-idx { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-size: 0.55rem; color: var(--text-ghost); white-space: nowrap; }

  /* Legend */
  #legend-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Recursion brackets */
  #brackets-area { width: 100%; max-width: 640px; padding: 0 2px; display: flex; flex-direction: column; gap: 2px; min-height: 14px; }
  .bracket-row { position: relative; height: 14px; }
  .bracket { position: absolute; top: 2px; height: 10px; border-left: 1px solid; border-bottom: 1px solid; border-right: 1px solid; box-sizing: border-box; }
  .bracket.ancestor { border-color: var(--border); }
  .bracket.current  { border-color: var(--accent); }
  .bracket.single   { border: none; border-left: 1px solid; height: 10px; }
  .bracket.single.ancestor { border-color: var(--border); }
  .bracket.single.current  { border-color: var(--accent); }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }
  .cm { color: var(--text-dim); font-style: italic; }

  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value="38,27,43,3,9,82,10,15" selected>Random 8</option>
      <option value="1,3,2,4,6,5,7,8">Nearly sorted</option>
      <option value="9,8,7,6,5,4,3,2,1">Reverse sorted</option>
      <option value="5,5,5,5,5,5">All same</option>
      <option value="4,2,7,1">Small (4)</option>
      <option value="64,25,12,22,11,90,45,33,17,58">Large (10)</option>
      <option value="2,1">Two elements</option>
    </select>
  </div>
  <div>
    <label>Array</label>
    <input type="text" id="arrayInput" value="38,27,43,3,9,82,10,15" style="width:200px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Merge Sort</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div id="bar-chart"></div>
    <div id="brackets-area"></div>
    <div id="legend-row">
      <div class="legend-item"><div class="legend-dot" style="background:var(--text-dim);opacity:0.6"></div>Unsorted</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Active range</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Placing</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Sorted</div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">State</div>
      <div class="var-item"><span class="var-key">phase  </span> <span class="var-val" id="sb-phase">&#8212;</span></div>
      <div class="var-item"><span class="var-key">depth  </span> <span class="var-val" id="sb-depth">0</span></div>
      <div class="var-item"><span class="var-key">comps  </span> <span class="var-val" id="sb-cmp">0</span></div>
      <div class="var-item"><span class="var-key">step   </span> <span class="var-val" id="sb-step">&#8212;</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step" onclick="resetViz()">&#8635; Reset</button>
  <select id="speedSel">
    <option value="900">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
  var codeLines = [
    { n:  1, t: '<span class="kw">def</span> <span class="nb">merge_sort</span>(arr):' },
    { n:  2, t: '  <span class="kw">if</span> len(arr) &lt;= 1: <span class="kw">return</span> arr' },
    { n:  3, t: '  mid = len(arr) // 2' },
    { n:  4, t: '  left  = merge_sort(arr[:mid])' },
    { n:  5, t: '  right = merge_sort(arr[mid:])' },
    { n:  6, t: '  <span class="kw">return</span> _merge(left, right)' },
    { n:  7, t: '' },
    { n:  8, t: '<span class="kw">def</span> <span class="nb">_merge</span>(left, right):' },
    { n:  9, t: '  result = []' },
    { n: 10, t: '  i = j = 0' },
    { n: 11, t: '  <span class="cm"># merge into result</span>' },
    { n: 12, t: '  <span class="kw">while</span> i &lt; len(left) <span class="kw">and</span> j &lt; len(right):' },
    { n: 13, t: '    <span class="kw">if</span> left[i] &lt;= right[j]:' },
    { n: 14, t: '      result.append(left[i]); i += 1' },
    { n: 15, t: '    <span class="kw">else</span>:' },
    { n: 16, t: '      result.append(right[j]); j += 1' },
    { n: 17, t: '  result.extend(left[i:])' },
    { n: 18, t: '  result.extend(right[j:])' },
    { n: 19, t: '  <span class="kw">return</span> result' },
  ];

  window.addEventListener('DOMContentLoaded', function() {
    var codeBody = document.getElementById('code-body');
    codeLines.forEach(function(line, i) {
      var el = document.createElement('div');
      el.className = 'cl';
      el.id = 'cl-' + i;
      el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
      codeBody.appendChild(el);
    });

    if (window.self !== window.top) {
      var bl = document.querySelector('.back-link');
      if (bl) bl.style.display = 'none';
    }

    window.nav = VizNav({
      btnPrev:  document.getElementById('prevBtn'),
      btnNext:  document.getElementById('stepBtn'),
      btnPlay:  document.getElementById('playBtn'),
      speedSel: document.getElementById('speedSel'),
      render: function(snap, cur, total) { renderStep(snap, cur, total); }
    });

    buildAndRun();
  });

  // ── Simulation ──────────────────────────────────────────────────────────────
  var lastArr = [];

  function simulate(inputArr) {
    var steps = [];
    var n = inputArr.length;
    var work = inputArr.slice();
    var colors = new Array(n).fill('default');
    var cmpCount = 0;

    var rangeStack = [];

    function snap(msg, codeLine, depth, phase) {
      steps.push({
        arr: work.slice(),
        colors: colors.slice(),
        msg: msg,
        codeLine: codeLine,
        depth: depth,
        phase: phase || 'divide',
        cmp: cmpCount,
        ranges: rangeStack.slice(),
      });
    }

    function setRange(lo, hi, color) {
      for (var x = lo; x <= hi; x++) colors[x] = color;
    }

    function mergeSort(lo, hi, depth) {
      rangeStack.push({lo: lo, hi: hi});
      if (lo >= hi) {
        colors[lo] = 'sorted';
        snap('Base case: [' + lo + '] = ' + work[lo] + ', already sorted', 1, depth, 'base');
        rangeStack.pop();
        return;
      }
      var mid = Math.floor((lo + hi) / 2);
      setRange(lo, hi, 'active');
      snap('Split [' + lo + '..' + hi + '] → [' + lo + '..' + mid + '] | [' + (mid+1) + '..' + hi + ']', 2, depth, 'divide');
      setRange(lo, hi, 'default');
      snap('Recurse left: merge_sort(arr[:' + (mid+1) + '])', 3, depth, 'divide');
      mergeSort(lo, mid, depth + 1);
      snap('Recurse right: merge_sort(arr[' + (mid+1) + ':])', 4, depth, 'divide');
      mergeSort(mid + 1, hi, depth + 1);
      snap('_merge(left, right)', 5, depth, 'merge');
      merge(lo, mid, hi, depth);
      rangeStack.pop();
    }

    function merge(lo, mid, hi, depth) {
      var L = work.slice(lo, mid + 1);
      var R = work.slice(mid + 1, hi + 1);
      snap('result = []  L=[' + L.join(',') + '] R=[' + R.join(',') + ']', 8, depth, 'merge');
      var i = 0, j = 0, k = lo;
      snap('i = j = 0  — start merging', 9, depth, 'merge');
      while (i < L.length && j < R.length) {
        cmpCount++;
        setRange(lo, hi, 'active');
        snap('Compare left[' + i + ']=' + L[i] + ' vs right[' + j + ']=' + R[j], 12, depth, 'compare');
        if (L[i] <= R[j]) {
          work[k] = L[i];
          colors[k] = 'placing';
          snap('left[' + i + ']=' + L[i] + ' ≤ right[' + j + ']=' + R[j] + '  →  append ' + L[i], 13, depth, 'compare');
          colors[k] = 'sorted';
          i++;
        } else {
          work[k] = R[j];
          colors[k] = 'placing';
          snap('left[' + i + ']=' + L[i] + ' > right[' + j + ']=' + R[j] + '  →  append ' + R[j], 15, depth, 'compare');
          colors[k] = 'sorted';
          j++;
        }
        k++;
      }
      while (i < L.length) {
        work[k] = L[i];
        colors[k] = 'placing';
        snap('extend left[' + i + ']=' + L[i] + ' → [' + k + ']', 16, depth, 'merge');
        colors[k] = 'sorted';
        i++; k++;
      }
      while (j < R.length) {
        work[k] = R[j];
        colors[k] = 'placing';
        snap('extend right[' + j + ']=' + R[j] + ' → [' + k + ']', 17, depth, 'merge');
        colors[k] = 'sorted';
        j++; k++;
      }
      setRange(lo, hi, 'sorted');
      snap('Merged [' + lo + '..' + hi + ']: [' + work.slice(lo, hi+1).join(',') + ']', 18, depth, 'merged');
    }

    snap('Start: arr = [' + work.join(', ') + ']', 0, 0, 'start');
    mergeSort(0, n - 1, 0);
    setRange(0, n - 1, 'sorted');
    snap('Sorted! [' + work.join(', ') + ']', 18, 0, 'done');
    return steps;
  }

  // ── Rendering ────────────────────────────────────────────────────────────────
  var maxVal = 1;

  function renderStep(snap, cur, total) {
    // Bars
    var chart = document.getElementById('bar-chart');
    chart.innerHTML = '';
    var n = snap.arr.length;
    var showLabels = n <= 16;
    snap.arr.forEach(function(val, i) {
      var wrap = document.createElement('div');
      wrap.className = 'bar-wrap';
      var bar = document.createElement('div');
      bar.className = 'bar c-' + (snap.colors[i] || 'default');
      var pct = maxVal > 0 ? Math.max(3, Math.round((val / maxVal) * 90)) : 10;
      bar.style.height = pct + '%';
      wrap.appendChild(bar);
      if (showLabels) {
        var vl = document.createElement('div'); vl.className = 'bar-val'; vl.textContent = val; wrap.appendChild(vl);
        var il = document.createElement('div'); il.className = 'bar-idx'; il.textContent = i; wrap.appendChild(il);
      }
      chart.appendChild(wrap);
    });

    // Header
    document.getElementById('phase-badge').textContent = snap.phase.toUpperCase();
    document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
    document.getElementById('desc').textContent = snap.msg;

    // Sidebar
    document.getElementById('sb-phase').textContent = snap.phase;
    document.getElementById('sb-depth').textContent = snap.depth;
    document.getElementById('sb-cmp').textContent = snap.cmp;
    document.getElementById('sb-step').textContent = (cur + 1) + ' / ' + total;

    // Recursion brackets
    var bracketsArea = document.getElementById('brackets-area');
    bracketsArea.innerHTML = '';
    var n = snap.arr.length;
    (snap.ranges || []).forEach(function(range, level) {
      var isCurrent = level === snap.ranges.length - 1;
      var row = document.createElement('div');
      row.className = 'bracket-row';
      var b = document.createElement('div');
      var leftPct  = (range.lo / n) * 100;
      var widthPct = ((range.hi - range.lo + 1) / n) * 100;
      if (range.lo === range.hi) {
        b.className = 'bracket single ' + (isCurrent ? 'current' : 'ancestor');
        b.style.left  = leftPct + '%';
        b.style.width = widthPct + '%';
      } else {
        b.className = 'bracket ' + (isCurrent ? 'current' : 'ancestor');
        b.style.left  = leftPct + '%';
        b.style.width = widthPct + '%';
      }
      row.appendChild(b);
      bracketsArea.appendChild(row);
    });

    // Code highlight
    codeLines.forEach(function(_, i) {
      var el = document.getElementById('cl-' + i);
      if (el) el.classList.remove('hl');
    });
    var active = document.getElementById('cl-' + snap.codeLine);
    if (active) {
      active.classList.add('hl');
      active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  // ── Controls ─────────────────────────────────────────────────────────────────
  function buildAndRun() {
    var raw = document.getElementById('arrayInput').value;
    var arr = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); })
                            .filter(function(n) { return !isNaN(n); });
    if (arr.length < 2 || arr.length > 20) {
      document.getElementById('desc').textContent = 'Enter 2-20 numbers.';
      return;
    }
    lastArr = arr;
    maxVal = Math.max.apply(null, arr);
    if (maxVal === 0) maxVal = 1;
    window.nav.load(simulate(arr));
  }

  function resetViz() { buildAndRun(); }

  function loadPreset() {
    var sel = document.getElementById('presetSel');
    if (!sel.value) return;
    document.getElementById('arrayInput').value = sel.value;
    buildAndRun();
  }

  function randomExample() {
    var n = 5 + Math.floor(Math.random() * 7);
    var arr = Array.from({length: n}, function() { return 1 + Math.floor(Math.random() * 95); });
    document.getElementById('arrayInput').value = arr.join(',');
    document.getElementById('presetSel').value = '';
    buildAndRun();
  }

  (function() {
    var handle = document.getElementById('resize-handle');
    var panel  = document.getElementById('code-panel');
    var dragging = false, startX = 0, startW = 0;
    handle.addEventListener('mousedown', function(e) {
      dragging = true; startX = e.clientX; startW = panel.offsetWidth;
      handle.classList.add('dragging'); e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var delta = startX - e.clientX;
      panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false; handle.classList.remove('dragging');
    });
  })();
</script>
</body>
</html>
