<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge Sort</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    /* ── Merge Sort specific styles ── */
    .viz-inputs {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      padding: 10px 0 14px; width: 100%; max-width: 95%;
    }
    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    .viz-inputs input[type="text"] {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm, 6px);
      padding: 6px 10px; font-size: 0.85rem; width: 240px;
    }
    .viz-inputs select {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm, 6px);
      padding: 6px 10px; font-size: 0.85rem; cursor: pointer;
    }

    .nav-row {
      display: flex; gap: 12px; margin-bottom: 14px; align-items: stretch;
    }
    .controls-panel {
      flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg, 8px); padding: 10px 14px;
    }
    .btn-step {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm, 6px); color: var(--text);
      cursor: pointer; font-size: 0.9rem; font-weight: 700;
      padding: 8px 14px; transition: all 0.15s;
    }
    .btn-step:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
    .btn-step:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-play {
      background: var(--accent); border: none;
      border-radius: var(--radius-sm, 6px); color: #fff;
      cursor: pointer; font-size: 0.9rem; font-weight: 700;
      padding: 8px 18px; transition: background 0.15s;
    }
    .btn-play:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-play:disabled { opacity: 0.35; cursor: not-allowed; }
    #speedSel {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm, 6px);
      padding: 6px 10px; font-size: 0.85rem; cursor: pointer;
    }

    .status-panel {
      flex: 1; min-width: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg, 8px); padding: 10px 14px;
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
    }
    .phase-label {
      font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
    }
    .step-desc { font-size: 0.88rem; color: var(--text-muted); min-height: 1.2em; }

    /* ── Main grid: bars left, code right ── */
    .main-row {
      display: grid; grid-template-columns: 1fr 260px; gap: 14px; align-items: start;
    }
    @media (max-width: 860px) { .main-row { grid-template-columns: 1fr; } }

    /* ── Bar chart panel ── */
    .bars-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg, 8px); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .panel-title {
      font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
    }

    /* Stats row */
    .stats-row {
      display: flex; gap: 14px; flex-wrap: wrap;
    }
    .stat-chip {
      font-size: 0.72rem; color: var(--text-dim);
      background: var(--bg); border: 1px solid var(--border-soft);
      border-radius: 4px; padding: 3px 8px;
    }
    .stat-chip span { color: var(--accent); font-weight: 700; }

    /* Bar chart */
    #bar-chart {
      height: 180px; display: flex; align-items: flex-end;
      gap: 4px; padding: 0 2px 24px 2px; position: relative;
    }
    .bar-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      min-width: 14px; height: 100%; position: relative;
    }
    .bar {
      width: 100%; border-radius: 3px 3px 0 0;
      transition: height 0.15s ease, background-color 0.2s ease;
    }
    .bar.c-default  { background: var(--text-dim); opacity: 0.6; }
    .bar.c-active   { background: var(--accent); opacity: 0.85; }
    .bar.c-comparing{ background: var(--orange); }
    .bar.c-placing  { background: var(--purple); }
    .bar.c-sorted   { background: var(--green); }

    .bar-val {
      position: absolute; bottom: -20px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem; color: var(--text-dim); white-space: nowrap;
      font-family: monospace;
    }
    .bar-idx {
      position: absolute; bottom: -32px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem; color: var(--text-ghost); white-space: nowrap;
    }

    /* Legend */
    .legend-row {
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-dim); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* Depth indicator */
    .depth-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--text-dim);
    }
    .depth-pip {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); margin-right: 1px;
    }

    /* ── Code panel ── */
    .code-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg, 8px); padding: 14px 0 14px 0;
      overflow-x: auto;
    }
    .code-title {
      font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); margin-bottom: 8px; padding: 0 14px;
    }
    #code-body {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.73rem; line-height: 1.7; margin: 0;
    }
    .cl {
      display: block; padding: 1px 14px;
      white-space: pre; border-left: 2px solid transparent;
      color: var(--text-muted); transition: all 0.2s;
    }
    .cl.hl {
      background: rgba(122,162,247,0.12);
      border-left-color: var(--accent);
      color: var(--text);
    }
    .kw { color: var(--purple); }
    .cm { color: var(--text-dim); font-style: italic; }
    .nb { color: var(--green); }
    .step-counter {
      font-size: 0.7rem; color: var(--text-dim);
      text-align: center; padding: 10px 14px 0;
      border-top: 1px solid var(--border-soft); margin-top: 8px;
    }

    .viz-area { width: 100%; max-width: 95%; }
  </style>
</head>

<body class="page">
  <div class="page-header">
    <a class="back-link" href="../index.html">&#8592; All Algorithms</a>
    <div>
      <div class="page-title">Merge Sort</div>
      <div style="font-size:0.78rem;color:var(--text-dim);margin-top:4px;">Divide &amp; Conquer &middot; O(n log n) time &middot; O(n) space</div>
    </div>
  </div>

  <!-- User inputs: presets + array field + Run + Random -->
  <div class="viz-inputs">
    <div class="field">
      <label>Preset</label>
      <select id="presetSel" onchange="loadPreset()">
        <option value="">&#8212; pick a preset &#8212;</option>
        <option value="38,27,43,3,9,82,10,15" selected>Random 8 elements</option>
        <option value="1,3,2,4,6,5,7,8">Nearly sorted</option>
        <option value="9,8,7,6,5,4,3,2,1">Reverse sorted</option>
        <option value="5,5,5,5,5,5">All same</option>
        <option value="4,2,7,1">Small (4)</option>
        <option value="64,25,12,22,11,90,45,33,17,58">Large (10)</option>
        <option value="2,1">Two elements</option>
      </select>
    </div>
    <div class="field">
      <label>Array</label>
      <input type="text" id="arrayInput" value="38,27,43,3,9,82,10,15" placeholder="e.g. 38,27,43,3" />
    </div>
    <button onclick="buildAndRun()" style="background:var(--accent);border:none;color:#fff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:0.85rem;font-weight:700;">Run</button>
    <button onclick="randomExample()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:0.85rem;">&#127922; Random</button>
  </div>

  <!-- Empty controls div (hidden by iframe bridge) -->
  <div class="controls"></div>

  <div class="viz-area">
    <!-- Nav row: playback buttons + status message -->
    <div class="nav-row">
      <div class="controls-panel">
        <button class="btn-step" id="prevBtn" disabled>&#8592;</button>
        <button class="btn-step" id="stepBtn" disabled>&#8594;</button>
        <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
        <button class="btn-step" id="resetBtn" onclick="resetViz()" style="font-size:0.78rem;padding:8px 10px;">&#8635;</button>
        <select id="speedSel">
          <option value="900">Slow</option>
          <option value="350" selected>Medium</option>
          <option value="100">Fast</option>
        </select>
      </div>
      <div class="status-panel">
        <div class="phase-label" id="phase-label">&#8212;</div>
        <div class="step-desc" id="step-desc">Choose a preset or enter an array and press Run.</div>
      </div>
    </div>

    <!-- Main content row -->
    <div class="main-row">
      <!-- Left: bar chart + stats + legend -->
      <div class="bars-panel">
        <div class="panel-title">Array State</div>

        <div class="stats-row">
          <div class="stat-chip">Step <span id="stepNum">&#8212;</span> / <span id="totalNum">&#8212;</span></div>
          <div class="stat-chip">Depth <span id="depthNum">0</span></div>
          <div class="stat-chip">Comparisons <span id="cmpNum">0</span></div>
          <div class="stat-chip">Phase <span id="phaseChip">&#8212;</span></div>
        </div>

        <div class="depth-row" id="depth-row">Recursion depth: <span id="depth-pips"></span></div>

        <div id="bar-chart"></div>

        <div class="legend-row">
          <div class="legend-item"><div class="legend-dot" style="background:var(--text-dim);opacity:0.6"></div>Unsorted</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Active range</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Comparing</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Placing</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Merged/Sorted</div>
        </div>
      </div>

      <!-- Right: code panel -->
      <div class="code-panel">
        <div class="code-title">Pseudocode</div>
        <pre id="code-body"></pre>
        <div class="step-counter" id="step-counter">&#8212;</div>
      </div>
    </div>
  </div>

  <script>
    // ── Code lines ──────────────────────────────────────────────────────────────
    var codeLines = [
      '<span class="kw">def</span> <span class="nb">merge_sort</span>(arr):',                                                    // 0
      '  <span class="kw">if</span> len(arr) &lt;= 1: <span class="kw">return</span> arr',                            // 1
      '  mid = len(arr) // 2',                                                       // 2
      '  left  = merge_sort(arr[:mid])',                                              // 3
      '  right = merge_sort(arr[mid:])',                                              // 4
      '  <span class="kw">return</span> _merge(left, right)',                                          // 5
      '',                                                                             // 6
      '<span class="kw">def</span> <span class="nb">_merge</span>(left, right):',                                                  // 7
      '  result = []',                                                                // 8
      '  i = j = 0',                                                                 // 9
      '  <span class="cm"># merge into result</span>',                                               // 10
      '  <span class="kw">while</span> i &lt; len(left) <span class="kw">and</span> j &lt; len(right):',              // 11
      '    <span class="kw">if</span> left[i] &lt;= right[j]:',                                      // 12
      '      result.append(left[i]); i += 1',                                        // 13
      '    <span class="kw">else</span>:',                                                              // 14
      '      result.append(right[j]); j += 1',                                       // 15
      '  result.extend(left[i:])',                                                    // 16
      '  result.extend(right[j:])',                                                   // 17
      '  <span class="kw">return</span> result',                                                        // 18
    ];

    // Build code panel
    window.addEventListener('DOMContentLoaded', function() {
      var pre = document.getElementById('code-body');
      codeLines.forEach(function(line, i) {
        var div = document.createElement('div');
        div.className = 'cl';
        div.id = 'cl' + i;
        div.innerHTML = line || ' ';
        pre.appendChild(div);
      });

      // Hide back-link when in iframe
      if (window.self !== window.top) {
        var bl = document.querySelector('.back-link');
        if (bl) bl.style.display = 'none';
      }

      buildAndRun();
    });

    // ── Simulation ──────────────────────────────────────────────────────────────
    var nav;
    var lastArr = [];

    function simulate(inputArr) {
      var steps = [];
      var n = inputArr.length;
      var work = inputArr.slice();
      var colors = new Array(n).fill('default');
      var cmpCount = 0;

      function snap(msg, codeLine, depth, phase, cmpL, cmpR) {
        steps.push({
          arr: work.slice(),
          colors: colors.slice(),
          msg: msg,
          codeLine: codeLine,
          depth: depth,
          phase: phase || 'divide',
          cmp: cmpCount,
          cmpL: cmpL !== undefined ? cmpL : null,
          cmpR: cmpR !== undefined ? cmpR : null,
        });
      }

      function setRange(lo, hi, color) {
        for (var x = lo; x <= hi; x++) colors[x] = color;
      }

      function mergeSort(lo, hi, depth) {
        if (lo >= hi) {
          colors[lo] = 'sorted';
          snap('Base case: [' + lo + '] = ' + work[lo] + ', already sorted', 1, depth, 'base');
          return;
        }

        var mid = Math.floor((lo + hi) / 2);
        setRange(lo, hi, 'active');
        snap(
          'Split [' + lo + '..' + hi + '] → [' + lo + '..' + mid + '] | [' + (mid+1) + '..' + hi + ']',
          2, depth, 'divide'
        );
        setRange(lo, hi, 'default');

        // Recurse left
        snap('Recurse left: mergeSort(' + lo + ', ' + mid + ')', 3, depth, 'divide');
        mergeSort(lo, mid, depth + 1);

        // Recurse right
        snap('Recurse right: mergeSort(' + (mid+1) + ', ' + hi + ')', 4, depth, 'divide');
        mergeSort(mid + 1, hi, depth + 1);

        // Merge
        snap('merge(' + lo + ', ' + mid + ', ' + hi + ')', 5, depth, 'merge');
        merge(lo, mid, hi, depth);
      }

      function merge(lo, mid, hi, depth) {
        var L = work.slice(lo, mid + 1);
        var R = work.slice(mid + 1, hi + 1);

        snap(
          'Copy L=[' + L.join(',') + '], R=[' + R.join(',') + ']',
          8, depth, 'merge'
        );

        var i = 0, j = 0, k = lo;
        snap('i=0, j=0, k=' + lo + '  — start merging', 10, depth, 'merge');

        while (i < L.length && j < R.length) {
          cmpCount++;
          setRange(lo, hi, 'active');
          snap(
            'Compare L[' + i + ']=' + L[i] + ' vs R[' + j + ']=' + R[j],
            12, depth, 'compare', L[i], R[j]
          );

          if (L[i] <= R[j]) {
            work[k] = L[i];
            setRange(lo, hi, 'active');
            colors[k] = 'placing';
            snap('L[' + i + ']=' + L[i] + ' ≤ R[' + j + ']=' + R[j] + '  →  place ' + L[i] + ' at [' + k + ']', 13, depth, 'compare');
            colors[k] = 'sorted';
            i++;
          } else {
            work[k] = R[j];
            setRange(lo, hi, 'active');
            colors[k] = 'placing';
            snap('L[' + i + ']=' + L[i] + ' > R[' + j + ']=' + R[j] + '  →  place ' + R[j] + ' at [' + k + ']', 15, depth, 'compare');
            colors[k] = 'sorted';
            j++;
          }
          k++;
        }

        while (i < L.length) {
          work[k] = L[i];
          setRange(lo, hi, 'active');
          colors[k] = 'placing';
          snap('Copy remaining L[' + i + ']=' + L[i] + ' → [' + k + ']', 16, depth, 'merge');
          colors[k] = 'sorted';
          i++; k++;
        }

        while (j < R.length) {
          work[k] = R[j];
          setRange(lo, hi, 'active');
          colors[k] = 'placing';
          snap('Copy remaining R[' + j + ']=' + R[j] + ' → [' + k + ']', 17, depth, 'merge');
          colors[k] = 'sorted';
          j++; k++;
        }

        setRange(lo, hi, 'sorted');
        snap(
          'Merged [' + lo + '..' + hi + ']: [' + work.slice(lo, hi+1).join(',') + ']',
          18, depth, 'merged'
        );
      }

      snap('Start: array = [' + work.join(', ') + ']', 0, 0, 'start');
      mergeSort(0, n - 1, 0);
      setRange(0, n - 1, 'sorted');
      snap('Array fully sorted! ✓', 18, 0, 'done');

      return steps;
    }

    // ── Rendering ───────────────────────────────────────────────────────────────
    var maxVal = 1;

    function renderStep(snap, cur, total) {
      // Bars
      var chart = document.getElementById('bar-chart');
      chart.innerHTML = '';
      var n = snap.arr.length;
      var showLabels = n <= 16;

      snap.arr.forEach(function(val, i) {
        var wrap = document.createElement('div');
        wrap.className = 'bar-wrap';

        var bar = document.createElement('div');
        bar.className = 'bar c-' + (snap.colors[i] || 'default');
        var pct = maxVal > 0 ? Math.max(3, Math.round((val / maxVal) * 90)) : 10;
        bar.style.height = pct + '%';
        wrap.appendChild(bar);

        if (showLabels) {
          var vLabel = document.createElement('div');
          vLabel.className = 'bar-val';
          vLabel.textContent = val;
          wrap.appendChild(vLabel);

          var iLabel = document.createElement('div');
          iLabel.className = 'bar-idx';
          iLabel.textContent = i;
          wrap.appendChild(iLabel);
        }

        chart.appendChild(wrap);
      });

      // Status
      document.getElementById('phase-label').textContent = snap.phase.toUpperCase();
      document.getElementById('step-desc').textContent = snap.msg;
      document.getElementById('stepNum').textContent = cur + 1;
      document.getElementById('totalNum').textContent = total;
      document.getElementById('depthNum').textContent = snap.depth;
      document.getElementById('cmpNum').textContent = snap.cmp;
      document.getElementById('phaseChip').textContent = snap.phase;
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' of ' + total;

      // Depth pips
      var pipsContainer = document.getElementById('depth-pips');
      pipsContainer.innerHTML = '';
      for (var d = 0; d <= Math.min(snap.depth, 9); d++) {
        var pip = document.createElement('span');
        pip.className = 'depth-pip';
        pip.style.opacity = d === snap.depth ? '1' : '0.3';
        pipsContainer.appendChild(pip);
      }

      // Code highlight
      codeLines.forEach(function(_, i) {
        var el = document.getElementById('cl' + i);
        if (el) el.classList.remove('hl');
      });
      var active = document.getElementById('cl' + snap.codeLine);
      if (active) {
        active.classList.add('hl');
        active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    // ── Build and run ────────────────────────────────────────────────────────────
    function buildAndRun() {
      var raw = document.getElementById('arrayInput').value;
      var arr = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); })
                              .filter(function(n) { return !isNaN(n); });

      if (arr.length < 2 || arr.length > 20) {
        document.getElementById('step-desc').textContent = 'Enter 2–20 numbers.';
        return;
      }

      lastArr = arr;
      maxVal = Math.max.apply(null, arr);
      if (maxVal === 0) maxVal = 1;

      var steps = simulate(arr);

      if (!nav) {
        nav = VizNav({
          btnPrev: document.getElementById('prevBtn'),
          btnNext: document.getElementById('stepBtn'),
          btnPlay: document.getElementById('playBtn'),
          speedSel: document.getElementById('speedSel'),
          render: renderStep,
        });
      }

      nav.load(steps);
    }

    function resetViz() {
      if (nav) nav.stopPlay();
      buildAndRun();
    }

    function loadPreset() {
      var sel = document.getElementById('presetSel');
      if (!sel.value) return;
      document.getElementById('arrayInput').value = sel.value;
      buildAndRun();
    }

    function randomExample() {
      var n = 5 + Math.floor(Math.random() * 7); // 5-11 elements
      var arr = Array.from({length: n}, function() { return 1 + Math.floor(Math.random() * 95); });
      document.getElementById('arrayInput').value = arr.join(',');
      document.getElementById('presetSel').value = '';
      buildAndRun();
    }
  </script>
</body>
</html>
