<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Min Cost to Connect All Points</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  .panel-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .code-line { display: flex; align-items: center; padding: 2px 0 2px 6px; white-space: pre; border-left: 2px solid transparent; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .code-line.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; } .fn { color: var(--blue); } .bi { color: var(--orange); } .st { color: #9ece6a; }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* page-specific */
  .graph-wrap { width: 100%; max-width: 560px; aspect-ratio: 1.4; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  #graph-svg { width: 100%; height: 100%; }
  .node-circle { stroke-width: 2.5; transition: fill 0.3s, stroke 0.3s; }
  .node-circle.state-unvisited { fill: #1a1b2e; stroke: #414868; }
  .node-circle.state-queued { fill: #3d3524; stroke: #e0af68; }
  .node-circle.state-popped { fill: #1a1f3a; stroke: #7dcfff; }
  .node-circle.state-mst { fill: #1a2a1a; stroke: #9ece6a; }
  .node-label { fill: var(--text-bright); font-size: 13px; font-weight: 700; font-family: monospace; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .node-coord { fill: var(--text-dim); font-size: 9.5px; font-weight: 600; font-family: monospace; text-anchor: middle; pointer-events: none; }
  .edge-bg { stroke: #252640; stroke-width: 1; stroke-dasharray: 3 4; fill: none; opacity: 0.5; }
  .edge-mst { stroke: #9ece6a; stroke-width: 2.5; fill: none; }
  .edge-active { stroke: #7dcfff; stroke-width: 2; fill: none; stroke-dasharray: 5 3; }
  .edge-improved { stroke: #e0af68; stroke-width: 2.5; fill: none; }
  .edge-weight-bg { fill: var(--bg); }
  .edge-weight { fill: var(--text-dim); font-size: 10px; font-weight: 700; font-family: monospace; text-anchor: middle; dominant-baseline: central; }
  .edge-weight.mst { fill: #9ece6a; } .edge-weight.active { fill: #7dcfff; } .edge-weight.improved { fill: #e0af68; }
  .info-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; max-width: 560px; }
  .info-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 6px; }
  .cost-cells { display: flex; gap: 6px; flex-wrap: wrap; }
  .cost-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; min-width: 40px; }
  .cost-cell.queued { border-color: #e0af68; background: #3d3524; }
  .cost-cell.popped { border-color: #7dcfff; background: #1a1f3a; }
  .cost-cell.mst { border-color: #9ece6a; background: #1a2a1a; }
  .cc-node { font-size: 0.65rem; color: var(--text-dim); font-weight: 600; }
  .cc-val { font-size: 0.85rem; font-weight: 700; font-family: monospace; color: var(--text-bright); }
  .heap-list { display: flex; gap: 5px; flex-wrap: wrap; min-height: 24px; align-items: center; }
  .heap-chip { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; font-weight: 700; background: #3d3524; border: 1px solid #e0af68; color: #e0af68; }
  .heap-chip.top { background: #1a1f3a; border-color: #7dcfff; color: #7dcfff; }
  .result-badge { font-size: 0.85rem; font-weight: 700; padding: 4px 12px; border-radius: 6px; display: none; }
  .result-badge.success { background: #1a2a1a; color: #9ece6a; border: 1px solid #9ece6a; display: block; }
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }
  .legend-line { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="default">Default (&#8594;20)</option>
      <option value="square">Square (&#8594;9)</option>
      <option value="collinear">Collinear (&#8594;8)</option>
    </select>
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Min Cost to Connect All Points</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Select a preset and click Run.</div>
    <div class="graph-wrap">
      <svg id="graph-svg" viewBox="0 0 560 420" preserveAspectRatio="xMidYMid meet">
        <g id="edges-bg-g"></g>
        <g id="edges-mst-g"></g>
        <g id="edge-active-g"></g>
        <g id="nodes-g"></g>
      </svg>
    </div>
    <div class="info-box">
      <div class="info-title">Total MST Cost: <span id="total-val">&#8212;</span> &nbsp;|&nbsp; <span class="result-badge" id="result-badge" style="display:inline-block"></span></div>
    </div>
    <div class="info-box">
      <div class="info-title">cost[] &#8212; cheapest edge to each unvisited node</div>
      <div class="cost-cells" id="cost-cells"><span style="color:var(--text-dim);font-size:0.78rem">&#8212;</span></div>
    </div>
    <div class="info-box">
      <div class="info-title">Min-Heap (cost, node)</div>
      <div class="heap-list" id="heap-list"><span style="color:var(--text-dim);font-size:0.78rem">empty</span></div>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Legend</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="legend-row"><div class="legend-dot" style="background:#1a1b2e;border-color:#414868"></div><span>Unvisited</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#3d3524;border-color:#e0af68"></div><span>In heap</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#1a1f3a;border-color:#7dcfff"></div><span>Popped</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#1a2a1a;border-color:#9ece6a"></div><span>In MST</span></div>
      <div class="legend-row"><div class="legend-line" style="background:#9ece6a"></div><span>MST edge</span></div>
      <div class="legend-row"><div class="legend-line" style="background:#7dcfff"></div><span>Examined</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">minCostConnectPoints</span>(points):'],
  [2,  '    n = <span class="bi">len</span>(points)'],
  [3,  '    cost = [<span class="bi">float</span>(<span class="st">\'inf\'</span>)] * n'],
  [4,  '    cost[<span class="nb">0</span>] = <span class="nb">0</span>'],
  [5,  '    in_mst = [<span class="kw">False</span>] * n'],
  [6,  '    heap = [(<span class="nb">0</span>, <span class="nb">0</span>)]  <span class="cm"># (cost, node)</span>'],
  [7,  '    total = <span class="nb">0</span>'],
  [8,  '    <span class="kw">while</span> heap:'],
  [9,  '        c, u = <span class="fn">heappop</span>(heap)'],
  [10, '        <span class="kw">if</span> in_mst[u]: <span class="kw">continue</span>  <span class="cm"># stale</span>'],
  [11, '        in_mst[u] = <span class="kw">True</span>'],
  [12, '        total += c'],
  [13, '        <span class="kw">for</span> v <span class="kw">in</span> <span class="bi">range</span>(n):'],
  [14, '            <span class="kw">if</span> in_mst[v]: <span class="kw">continue</span>'],
  [15, '            d = <span class="bi">abs</span>(px[u]-px[v]) + <span class="bi">abs</span>(py[u]-py[v])'],
  [16, '            <span class="kw">if</span> d < cost[v]:'],
  [17, '                cost[v] = d'],
  [18, '                <span class="fn">heappush</span>(heap, (d, v))'],
  [19, '    <span class="kw">return</span> total'],
];

var PRESETS = {
  'default': {
    label: 'Default — 5 points, answer = 20',
    points: [[0,0],[2,2],[3,10],[5,2],[7,0]],
    pos: [{x:55,y:345},{x:184,y:285},{x:248,y:55},{x:376,y:285},{x:505,y:345}]
  },
  'square': {
    label: 'Square corners — 4 points, answer = 9',
    points: [[0,0],[0,3],[3,3],[3,0]],
    pos: [{x:160,y:330},{x:160,y:90},{x:400,y:90},{x:400,y:330}]
  },
  'collinear': {
    label: 'Collinear — 4 points, answer = 8',
    points: [[0,5],[2,5],[6,5],[8,5]],
    pos: [{x:50,y:210},{x:170,y:210},{x:410,y:210},{x:530,y:210}]
  }
};

var currentPreset = 'default';
var simSteps = [], nav, gPreset = null;

function loadPreset() {
  var sel = document.getElementById('presetSel');
  currentPreset = sel ? sel.value : 'default';
}

function randomExample() {
  var keys = ['default', 'square', 'collinear'];
  currentPreset = keys[Math.floor(Math.random() * keys.length)];
  document.getElementById('presetSel').value = currentPreset;
  buildAndRun();
}

function buildAndRun() {
  loadPreset();
  gPreset = PRESETS[currentPreset];
  renderGraph(null);
  simSteps = simulate(gPreset);
  nav.load(simSteps);
}

var NODE_R = 20;
function midPt(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function perpOff(a,b,dist){var dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;return{ox:-dy/len*dist,oy:dx/len*dist};}
function svgLine(parent,cls,x1,y1,x2,y2){var el=document.createElementNS('http://www.w3.org/2000/svg','line');el.setAttribute('x1',x1);el.setAttribute('y1',y1);el.setAttribute('x2',x2);el.setAttribute('y2',y2);el.setAttribute('class',cls);parent.appendChild(el);return el;}
function svgWeightLabel(parent,x,y,text,cls){var rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',x-10);rect.setAttribute('y',y-8);rect.setAttribute('width',20);rect.setAttribute('height',16);rect.setAttribute('rx',3);rect.setAttribute('class','edge-weight-bg');parent.appendChild(rect);var wt=document.createElementNS('http://www.w3.org/2000/svg','text');wt.setAttribute('x',x);wt.setAttribute('y',y);wt.setAttribute('class','edge-weight '+cls);wt.textContent=text;parent.appendChild(wt);}

function renderGraph(snap) {
  var bgG=document.getElementById('edges-bg-g'),mstG=document.getElementById('edges-mst-g'),activeG=document.getElementById('edge-active-g'),nodesG=document.getElementById('nodes-g');
  bgG.innerHTML='';mstG.innerHTML='';activeG.innerHTML='';nodesG.innerHTML='';
  var pos=gPreset.pos,pts=gPreset.points,n=pos.length;
  var states=snap?snap.states:pos.map(function(_,i){return i===0?'queued':'unvisited';});
  var mstEdges=snap?snap.mstEdges:[],activeEdge=snap?snap.activeEdge:null;
  var mstSet={};mstEdges.forEach(function(e){mstSet[e.u+'-'+e.v]=true;mstSet[e.v+'-'+e.u]=true;});
  for(var i=0;i<n;i++)for(var j=i+1;j<n;j++){if(mstSet[i+'-'+j])continue;if(activeEdge&&((activeEdge.u===i&&activeEdge.v===j)||(activeEdge.u===j&&activeEdge.v===i)))continue;svgLine(bgG,'edge-bg',pos[i].x,pos[i].y,pos[j].x,pos[j].y);}
  mstEdges.forEach(function(e){var a=pos[e.u],b=pos[e.v];svgLine(mstG,'edge-mst',a.x,a.y,b.x,b.y);var mid=midPt(a,b),off=perpOff(a,b,13);svgWeightLabel(mstG,mid.x+off.ox,mid.y+off.oy,e.w,'mst');});
  if(activeEdge){var a=pos[activeEdge.u],b=pos[activeEdge.v];var cls=activeEdge.improved?'edge-improved':'edge-active',wcls=activeEdge.improved?'improved':'active';svgLine(activeG,cls,a.x,a.y,b.x,b.y);var mid=midPt(a,b),off=perpOff(a,b,13);svgWeightLabel(activeG,mid.x+off.ox,mid.y+off.oy,activeEdge.d,wcls);}
  pos.forEach(function(p,i){var g=document.createElementNS('http://www.w3.org/2000/svg','g');var circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.setAttribute('cx',p.x);circle.setAttribute('cy',p.y);circle.setAttribute('r',NODE_R);circle.setAttribute('class','node-circle state-'+(states[i]||'unvisited'));g.appendChild(circle);var label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x',p.x);label.setAttribute('y',p.y);label.setAttribute('class','node-label');label.textContent=i;g.appendChild(label);var coordY=p.y>300?p.y-NODE_R-7:p.y+NODE_R+13;var coord=document.createElementNS('http://www.w3.org/2000/svg','text');coord.setAttribute('x',p.x);coord.setAttribute('y',coordY);coord.setAttribute('class','node-coord');coord.textContent='('+pts[i][0]+','+pts[i][1]+')';g.appendChild(coord);nodesG.appendChild(g);});
}

function simulate(preset) {
  var points=preset.points,n=points.length,steps=[],INF=Infinity;
  var cost=[],i;for(i=0;i<n;i++)cost.push(INF);cost[0]=0;
  var inMST=[];for(i=0;i<n;i++)inMST.push(false);
  var parent=[];for(i=0;i<n;i++)parent.push(-1);
  var heap=[{c:0,u:0}],total=0,mstEdges=[];
  var states=[];for(i=0;i<n;i++)states.push('unvisited');states[0]='queued';
  function ds(d){return d===INF?'∞':d;}
  function snap(phase,desc,lines,activeEdge){var sh=heap.slice().sort(function(a,b){return a.c-b.c||a.u-b.u;});steps.push({phase:phase,desc:desc,lines:lines,states:states.slice(),cost:cost.slice(),heap:sh,mstEdges:mstEdges.slice(),activeEdge:activeEdge||null,total:total});}
  snap('Init','cost[0] = 0, all others = ∞. Push (0, 0) to heap. Prim\'s grows the MST from node 0 outward.',[3,4,5,6,7],null);
  while(heap.length>0){
    heap.sort(function(a,b){return a.c-b.c||a.u-b.u;});
    var top=heap.shift(),c=top.c,u=top.u;
    if(inMST[u]){snap('Stale','Pop ('+c+', node '+u+'). Already in MST — stale entry. Skip.',[9,10],null);continue;}
    inMST[u]=true;states[u]='popped';
    if(parent[u]!==-1)mstEdges.push({u:parent[u],v:u,w:c});
    total+=c;
    var addDesc=u===0?'Pop (0, node 0). Source node — free to add (cost=0). Total = 0. Examine all other nodes.':'Pop ('+c+', node '+u+'). Add edge '+parent[u]+'→'+u+' (cost='+c+') to MST. Running total = '+total+'.';
    snap('Pop',addDesc,[9,10,11,12],null);
    states[u]='mst';
    snap('Settle','Node '+u+' is now in MST. Scan all unvisited nodes to see if this node offers a cheaper connection.',[11,12,13],null);
    for(var v=0;v<n;v++){
      if(inMST[v])continue;
      var dx=Math.abs(points[u][0]-points[v][0]),dy=Math.abs(points[u][1]-points[v][1]),d=dx+dy;
      snap('Examine','Edge '+u+'→'+v+': |'+points[u][0]+'-'+points[v][0]+'|+|'+points[u][1]+'-'+points[v][1]+'| = '+d+'. cost['+v+'] = '+ds(cost[v])+'.',[13,14,15,16],{u:u,v:v,d:d,improved:false});
      if(d<cost[v]){var oldCost=cost[v];cost[v]=d;parent[v]=u;if(states[v]!=='mst')states[v]='queued';heap.push({c:d,u:v});snap('Update','Improved! cost['+v+']: '+ds(oldCost)+' → '+d+'. Push ('+d+', '+v+') to heap.',[16,17,18],{u:u,v:v,d:d,improved:true});}
      else{snap('Skip','No improvement — cost['+v+'] = '+ds(cost[v])+' ≤ '+d+'. Keep existing.',[15,16],null);}
    }
  }
  var edgeList=mstEdges.map(function(e){return e.u+'→'+e.v+'('+e.w+')';}).join(', ');
  snap('Done','MST complete! Edges: '+edgeList+'. Total minimum cost = '+total+'.',[19],null);
  return steps;
}

function applyStep(snap) {
  renderGraph(snap);
  updateCost(snap.cost,snap.states);
  updateHeap(snap.heap);
  setCodeLines(snap.lines);
  document.getElementById('total-val').textContent=snap.total;
  var badge=document.getElementById('result-badge');
  badge.className='result-badge';badge.textContent='';
  if(snap.phase==='Done'){badge.className='result-badge success';badge.textContent='Total MST cost = '+snap.total;}
}

function updateCost(cost,states){
  var el=document.getElementById('cost-cells');
  if(!cost){el.innerHTML='<span style="color:var(--text-dim);font-size:0.78rem">—</span>';return;}
  el.innerHTML=cost.map(function(val,i){var display=val===Infinity?'∞':val;var st=states?(states[i]||'unvisited'):'unvisited';var cls='cost-cell';if(st==='popped')cls+=' popped';else if(st==='mst')cls+=' mst';else if(st==='queued')cls+=' queued';return '<div class="'+cls+'"><div class="cc-node">'+i+'</div><div class="cc-val">'+display+'</div></div>';}).join('');
}

function updateHeap(heap){
  var el=document.getElementById('heap-list');
  if(!heap||heap.length===0){el.innerHTML='<span style="color:var(--text-dim);font-size:0.78rem">empty</span>';return;}
  var sorted=heap.slice().sort(function(a,b){return a.c-b.c||a.u-b.u;});
  el.innerHTML=sorted.map(function(item,idx){var cls=idx===0?'heap-chip top':'heap-chip';return '<div class="'+cls+'">('+item.c+', '+item.u+')</div>';}).join('');
}

function setCodeLines(lines){
  CODE.forEach(function(e){var el=document.getElementById('cl-'+e[0]);if(!el)return;el.classList.toggle('hl',!!(lines&&lines.indexOf(e[0])>=0));});
}

function buildCodePanel(){
  var body=document.getElementById('code-body');
  body.innerHTML=CODE.map(function(e){return '<div class="code-line" id="cl-'+e[0]+'"><span class="ln">'+e[0]+'</span><span>'+e[1]+'</span></div>';}).join('');
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  loadPreset();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function() { nav.stopPlay(); nav.goTo(0); });
});

(function(){
  var handle=document.getElementById('resize-handle'),panel=document.getElementById('code-panel');
  var dragging=false,startX=0,startW=0;
  handle.addEventListener('mousedown',function(e){dragging=true;startX=e.clientX;startW=panel.offsetWidth;handle.classList.add('dragging');e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!dragging)return;panel.style.width=Math.min(560,Math.max(120,startW+(startX-e.clientX)))+'px';});
  document.addEventListener('mouseup',function(){if(dragging){dragging=false;handle.classList.remove('dragging');}});
})();
</script>
</body>
</html>
