<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merge Two Sorted Lists</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; overflow: hidden; }

  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }

  #list-canvas { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 18px; }

  .row-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 5px; }

  .list-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0; min-height: 70px; }

  .node-wrap { display: flex; flex-direction: column; align-items: center; position: relative; }
  .node-box {
    width: 48px; height: 48px; border-radius: 8px;
    background: #1e293b; border: 2px solid #334155; color: #f1f5f9;
    font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .25s, background .25s, opacity .25s;
    position: relative; z-index: 1;
  }
  .node-box.hl-l1     { border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f620; }
  .node-box.hl-l2     { border-color: #8b5cf6; box-shadow: 0 0 0 3px #8b5cf620; }
  .node-box.hl-curr   { border-color: #22c55e; box-shadow: 0 0 0 3px #22c55e20; }
  .node-box.hl-picked { border-color: #eab308; background: #451a0330; box-shadow: 0 0 0 3px #eab30820; }
  .node-box.hl-done   { border-color: #22c55e; background: #14532d40; color: #4ade80; }
  .node-box.hl-appended { border-color: #a3e635; background: #1a2e1a40; }
  .node-box.faded     { opacity: 0.3; }
  .node-box.pulse     { animation: nodePulse .5s ease; }
  @keyframes nodePulse { 0%,100%{box-shadow:0 0 0 0 #10b98140} 50%{box-shadow:0 0 0 8px #10b98130} }

  .badges { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 4px; min-height: 18px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .05em; }
  .badge-l1   { background: #1e3a5f; color: #3b82f6; border: 1px solid #3b82f6; }
  .badge-l2   { background: #2e1065; color: #8b5cf6; border: 1px solid #8b5cf6; }
  .badge-curr { background: #1a2e1a; color: #22c55e; border: 1px solid #22c55e; }
  .badge-picked { background: #45280a; color: #eab308; border: 1px solid #eab308; }
  .badge-dummy { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }

  .arrow { display: flex; align-items: center; width: 28px; flex-shrink: 0; }
  .arrow svg { width: 28px; height: 16px; }
  .null-marker { font-size: 10px; color: var(--text-dim); margin-left: 4px; padding: 0 4px; }

  #sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .ptr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptr-table td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
  .ptr-table td:first-child { color: var(--text-muted); width: 44px; }
  .ptr-table td:last-child { color: var(--text); font-weight: 600; }
  .list-text { font-size: 11px; color: var(--text-muted); line-height: 1.8; }

  #code-wrap { flex-shrink: 0; background: #0d1117; border-top: 1px solid var(--border); }
  #code-toggle { width: 100%; background: #161b22; color: var(--text-muted); border: none; border-bottom: 1px solid var(--border); padding: 5px 12px; font-size: 11px; text-align: left; cursor: pointer; font-family: inherit; }
  #code-toggle:hover { color: var(--text); }
  #code-body { overflow: auto; max-height: 160px; padding: 10px 14px; }
  pre { font-size: 11px; line-height: 1.7; font-family: inherit; }
  .code-line { padding: 0 4px; border-radius: 3px; display: block; transition: background .2s; white-space: pre; }
  .code-line.active { background: #451a0350; color: #fbbf24; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .cm { color: #546e7a; font-style: italic; }
  .str { color: #c3e88d; } .num { color: #f78c6c; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  .viz-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 10px 0 14px; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs input { background: var(--bg-card, #1e293b); color: var(--text-main, #f1f5f9); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; width: 140px; font-family: inherit; }
  .viz-inputs select { background: var(--bg-card, #1e293b); color: var(--text-main, #f1f5f9); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; }
  .btn-run { padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
  .btn-rand { padding: 7px 14px; background: var(--bg-card, #1e293b); color: var(--text-main, #f1f5f9); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
</style>
</head>
<body>

<div class="viz-inputs" style="padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value="1,2,4|1,3,4">[1,2,4] + [1,3,4]</option>
      <option value="1,3,5|2,4,6">[1,3,5] + [2,4,6]</option>
      <option value="1|2,3,4">[1] + [2,3,4]</option>
      <option value="|1,2,3">[] + [1,2,3]</option>
      <option value="5|1">[5] + [1]</option>
    </select>
  </div>
  <div>
    <label>List 1 (comma-sep)</label>
    <input id="inp1" type="text" value="1,2,4" placeholder="e.g. 1,2,4" />
  </div>
  <div>
    <label>List 2 (comma-sep)</label>
    <input id="inp2" type="text" value="1,3,4" placeholder="e.g. 1,3,4" />
  </div>
  <button class="btn-run" onclick="buildAndRun()">Run</button>
  <button class="btn-rand" onclick="randomExample()">&#x1F3B2; Random</button>
</div>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Merge Two Sorted Lists</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Initializing...</div>
    <div id="list-canvas"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <table class="ptr-table" id="ptr-table"><tbody></tbody></table>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">State</div>
      <div class="list-text" id="list-state"></div>
    </div>
  </div>
</div>

<div id="code-wrap">
  <button id="code-toggle">&#x25BC; Code (click to collapse)</button>
  <div id="code-body">
    <pre id="code-pre"></pre>
  </div>
</div>

<div class="nav-row" id="nav-row">
  <button id="prevBtn" class="btn-step">&#x2190; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#x2192;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#x21BA; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&times;</option>
    <option value="400" selected>1&times;</option>
    <option value="200">2&times;</option>
    <option value="100">4&times;</option>
  </select>
</div>

<script>
// ─── Code lines ─────────────────────────────────────────────────────────────
const CODE_LINES = [
  { n: 1,  t: '<span class=kw>def</span> <span class=fn>mergeTwoLists</span>(l1, l2):' },
  { n: 2,  t: '    dummy = curr = ListNode(<span class=num>0</span>)' },
  { n: 3,  t: '    <span class=kw>while</span> l1 <span class=kw>and</span> l2:' },
  { n: 4,  t: '        <span class=kw>if</span> l1.val &lt;= l2.val:' },
  { n: 5,  t: '            curr.next = l1' },
  { n: 6,  t: '            l1 = l1.next' },
  { n: 7,  t: '        <span class=kw>else</span>:' },
  { n: 8,  t: '            curr.next = l2' },
  { n: 9,  t: '            l2 = l2.next' },
  { n: 10, t: '        curr = curr.next' },
  { n: 11, t: '    curr.next = l1 <span class=kw>or</span> l2' },
  { n: 12, t: '    <span class=kw>return</span> dummy.next' },
];

// ─── Build snapshots ────────────────────────────────────────────────────────
function buildSnapshots(list1Vals, list2Vals) {
  // Each node: { id, val, listOrigin: 1|2|"dummy", consumed: false }
  // Snapshot shape: { phase, description, active_line,
  //   l1Remaining, l2Remaining,       // arrays of node ids still in input lists
  //   mergedOrder,                     // ordered ids in merged result so far
  //   l1_ptr, l2_ptr, curr_ptr,        // current pointer ids (null if exhausted/none)
  //   picked_id,                       // id just picked this step (null otherwise)
  //   comparison,                      // string like "l1(1) <= l2(3) → pick l1"
  //   allNodes                         // id -> {id, val, origin}
  // }

  // Assign ids: list1 nodes get ids 1..n1, list2 nodes get ids 100..100+n2, dummy=0
  const allNodes = {};
  const n1 = list1Vals.length;
  const n2 = list2Vals.length;

  list1Vals.forEach((v, i) => { allNodes[i+1] = { id: i+1, val: v, origin: 1 }; });
  list2Vals.forEach((v, i) => { allNodes[100+i] = { id: 100+i, val: v, origin: 2 }; });
  allNodes[0] = { id: 0, val: 0, origin: "dummy" };

  const l1Ids = list1Vals.map((_, i) => i+1);
  const l2Ids = list2Vals.map((_, i) => 100+i);

  const snaps = [];

  function snap(phase, description, extra) {
    const base = {
      phase, description,
      active_line: 0,
      l1Remaining: [],
      l2Remaining: [],
      mergedOrder: [],
      l1_ptr: null, l2_ptr: null, curr_ptr: null,
      picked_id: null,
      comparison: null,
      allNodes,
    };
    return { ...base, ...extra };
  }

  // INIT snap
  snaps.push(snap("init",
    "Create dummy head node. l1 points to first node of list 1, l2 to first of list 2, curr = dummy.",
    {
      active_line: 2,
      l1Remaining: [...l1Ids],
      l2Remaining: [...l2Ids],
      mergedOrder: [],
      l1_ptr: l1Ids[0] || null,
      l2_ptr: l2Ids[0] || null,
      curr_ptr: 0,
    }
  ));

  // Simulate the merge
  let l1Rem = [...l1Ids];
  let l2Rem = [...l2Ids];
  let merged = [];

  while (l1Rem.length > 0 && l2Rem.length > 0) {
    const id1 = l1Rem[0];
    const id2 = l2Rem[0];
    const v1 = allNodes[id1].val;
    const v2 = allNodes[id2].val;

    // Step: show comparison
    const cmp = v1 <= v2
      ? "l1(" + v1 + ") ≤ l2(" + v2 + ") → pick l1"
      : "l2(" + v2 + ") < l1(" + v1 + ") → pick l2";

    snaps.push(snap("compare",
      "Compare: " + cmp + ". curr.next = picked node, advance picked pointer.",
      {
        active_line: v1 <= v2 ? 4 : 7,
        l1Remaining: [...l1Rem],
        l2Remaining: [...l2Rem],
        mergedOrder: [...merged],
        l1_ptr: id1,
        l2_ptr: id2,
        curr_ptr: merged.length > 0 ? merged[merged.length-1] : 0,
        picked_id: v1 <= v2 ? id1 : id2,
        comparison: cmp,
      }
    ));

    // Pick
    let pickedId;
    if (v1 <= v2) {
      pickedId = id1;
      l1Rem.shift();
    } else {
      pickedId = id2;
      l2Rem.shift();
    }
    merged.push(pickedId);

    // Step: after picking — curr advances
    snaps.push(snap("compare",
      "Picked node " + allNodes[pickedId].val + ". curr advances to this node. Merged so far: [" + merged.map(id => allNodes[id].val).join("→") + "].",
      {
        active_line: 10,
        l1Remaining: [...l1Rem],
        l2Remaining: [...l2Rem],
        mergedOrder: [...merged],
        l1_ptr: l1Rem[0] || null,
        l2_ptr: l2Rem[0] || null,
        curr_ptr: pickedId,
        picked_id: pickedId,
        comparison: cmp,
      }
    ));
  }

  // Append remaining
  const remaining = l1Rem.length > 0 ? l1Rem : l2Rem;
  const remainOrigin = l1Rem.length > 0 ? 1 : 2;
  if (remaining.length > 0) {
    const remVals = remaining.map(id => allNodes[id].val).join("→");
    snaps.push(snap("append",
      "One list exhausted. Append remaining " + (remainOrigin === 1 ? "l1" : "l2") + ": [" + remVals + "] directly.",
      {
        active_line: 11,
        l1Remaining: [...l1Rem],
        l2Remaining: [...l2Rem],
        mergedOrder: [...merged],
        l1_ptr: l1Rem[0] || null,
        l2_ptr: l2Rem[0] || null,
        curr_ptr: merged.length > 0 ? merged[merged.length-1] : 0,
        picked_id: null,
        comparison: null,
      }
    ));
    merged = merged.concat(remaining);
  }

  // Done
  const finalVals = merged.map(id => allNodes[id].val).join("→");
  snaps.push(snap("done",
    "Complete! Merged result: [" + finalVals + "]. Return dummy.next.",
    {
      active_line: 12,
      l1Remaining: [],
      l2Remaining: [],
      mergedOrder: [...merged],
      l1_ptr: null,
      l2_ptr: null,
      curr_ptr: null,
      picked_id: null,
      comparison: null,
    }
  ));

  return snaps;
}

// ─── Render helpers ──────────────────────────────────────────────────────────
const ARROW_SVG = `<svg viewBox="0 0 28 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <line x1="0" y1="8" x2="22" y2="8" stroke="#475569" stroke-width="2"/>
  <polygon points="20,4 28,8 20,12" fill="#475569"/>
</svg>`;

function renderListRow(nodeIds, snap, labelText, forcePhase) {
  // nodeIds: ordered array of node ids
  const { l1_ptr, l2_ptr, curr_ptr, picked_id, phase, mergedOrder, allNodes } = snap;
  let html = "";
  if (labelText) html += `<div class="row-label">${labelText}</div>`;
  html += `<div class="list-row">`;

  nodeIds.forEach((nid, i) => {
    const node = allNodes[nid];
    if (!node) return;

    const cls = ["node-box"];
    const badges = [];
    const isDone = phase === "done";
    const isAppended = (snap.phase === "append" || snap.phase === "done") && mergedOrder.includes(nid);

    if (isDone) {
      cls.push("hl-done");
    } else {
      if (nid === picked_id) cls.push("hl-picked");
      else if (nid === l1_ptr) cls.push("hl-l1");
      else if (nid === l2_ptr) cls.push("hl-l2");
      else if (nid === curr_ptr) cls.push("hl-curr");
    }

    if (nid === 0 && !isDone) badges.push(`<span class="badge badge-dummy">dummy</span>`);
    if (nid === l1_ptr && !isDone) badges.push(`<span class="badge badge-l1">l1</span>`);
    if (nid === l2_ptr && !isDone) badges.push(`<span class="badge badge-l2">l2</span>`);
    if (nid === curr_ptr && !isDone) badges.push(`<span class="badge badge-curr">curr</span>`);
    if (nid === picked_id && !isDone) badges.push(`<span class="badge badge-picked">✓ pick</span>`);

    // consumed nodes from input rows get faded
    if (forcePhase === "input" && mergedOrder.includes(nid)) {
      cls.push("faded");
    }

    const displayVal = nid === 0 ? "D" : node.val;

    html += `<div class="node-wrap">
      <div class="${cls.join(" ")}">${displayVal}</div>
      <div class="badges">${badges.join("")}</div>
    </div>`;

    if (i < nodeIds.length - 1) {
      html += `<div class="arrow">${ARROW_SVG}</div>`;
    } else {
      html += `<span class="null-marker">∅</span>`;
    }
  });

  html += "</div>";
  return html;
}

function buildVizHtml(snap) {
  const { l1Remaining, l2Remaining, mergedOrder, allNodes, phase } = snap;

  // Build full original l1 and l2 id arrays from allNodes
  const l1All = Object.values(allNodes).filter(n => n.origin === 1).sort((a,b) => a.id - b.id).map(n => n.id);
  const l2All = Object.values(allNodes).filter(n => n.origin === 2).sort((a,b) => a.id - b.id).map(n => n.id);

  let html = "";

  if (l1All.length > 0 || l2All.length > 0) {
    html += renderListRow(l1All, snap, "List 1", "input");
    html += renderListRow(l2All, snap, "List 2", "input");
  } else {
    html += `<div class="row-label">Both lists empty</div>`;
  }

  // Merged row: dummy + merged nodes
  const mergedRowIds = [0, ...mergedOrder];
  html += renderListRow(mergedRowIds, snap, "Merged Result", "merged");

  return html;
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function updateSidebar(snap) {
  const { l1_ptr, l2_ptr, curr_ptr, allNodes, phase, comparison, mergedOrder, l1Remaining, l2Remaining } = snap;

  function ptrVal(id) {
    if (id === null || id === undefined) return `<span style="color:var(--text-dim)">None</span>`;
    if (id === 0) return `<span style="color:var(--text)">dummy(0)</span>`;
    const n = allNodes[id];
    return n ? `<span style="color:var(--text)">${n.val}</span>` : `<span style="color:var(--text-dim)">None</span>`;
  }

  let rows = "";
  rows += `<tr><td>l1</td><td>${ptrVal(l1_ptr)}</td></tr>`;
  rows += `<tr><td>l2</td><td>${ptrVal(l2_ptr)}</td></tr>`;
  rows += `<tr><td>curr</td><td>${ptrVal(curr_ptr)}</td></tr>`;
  document.querySelector("#ptr-table tbody").innerHTML = rows;

  let stateHtml = "";
  if (comparison) {
    stateHtml += `<div style="color:var(--yellow,#eab308);margin-bottom:6px;">${comparison}</div>`;
  }
  stateHtml += `<div>Merged: ${mergedOrder.length} node${mergedOrder.length !== 1 ? "s" : ""}</div>`;
  if (mergedOrder.length > 0) {
    const vals = mergedOrder.map(id => allNodes[id].val).join("→");
    stateHtml += `<div style="color:var(--green,#22c55e);margin-top:3px;">[D→${vals}]</div>`;
  }
  stateHtml += `<div style="margin-top:6px;">l1 left: ${l1Remaining.length}</div>`;
  stateHtml += `<div>l2 left: ${l2Remaining.length}</div>`;
  document.getElementById("list-state").innerHTML = stateHtml;
}

// ─── Code panel ───────────────────────────────────────────────────────────────
function renderCode(activeLine) {
  const pre = document.getElementById("code-pre");
  pre.innerHTML = CODE_LINES.map(l => {
    const cls = l.n === activeLine ? "code-line active" : "code-line";
    return `<span class="${cls}">${l.t || " "}</span>`;
  }).join("");
  const active = pre.querySelector(".active");
  if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

const PHASE_LABELS = {
  init: "Init",
  compare: "Compare & Pick",
  append: "Append Remaining",
  done: "Done",
};

// ─── applyStep ───────────────────────────────────────────────────────────────
function applyStep(snap, animated) {
  document.getElementById("phase-badge").textContent = PHASE_LABELS[snap.phase] || snap.phase;
  document.getElementById("desc").textContent = snap.description;

  const canvas = document.getElementById("list-canvas");
  canvas.innerHTML = buildVizHtml(snap);

  if (animated && snap.picked_id !== null) {
    const boxes = canvas.querySelectorAll(".node-box");
    boxes.forEach(box => {
      if (box.textContent == String(snap.allNodes[snap.picked_id]?.val)) {
        box.classList.add("pulse");
        setTimeout(() => box.classList.remove("pulse"), 600);
      }
    });
  }

  updateSidebar(snap);
  renderCode(snap.active_line);
}

function updateStatus(snap, cur, total) {
  document.getElementById("step-counter").textContent = `Step ${cur} / ${total}`;
}

// ─── Code toggle ──────────────────────────────────────────────────────────────
let codeExpanded = true;
document.getElementById("code-toggle").addEventListener("click", () => {
  codeExpanded = !codeExpanded;
  document.getElementById("code-body").style.display = codeExpanded ? "block" : "none";
  document.getElementById("code-toggle").textContent = (codeExpanded ? "▼" : "▶") + " Code (click to " + (codeExpanded ? "collapse" : "expand") + ")";
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (window.nav) window.nav.reset();
});

// ─── viz-inputs logic ─────────────────────────────────────────────────────────
function parseList(str) {
  if (!str || str.trim() === "") return [];
  return str.split(",").map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
}

function loadPreset() {
  const sel = document.getElementById("presetSel");
  const val = sel.value;
  if (!val) return;
  const [p1, p2] = val.split("|");
  document.getElementById("inp1").value = p1 || "";
  document.getElementById("inp2").value = p2 || "";
  buildAndRun();
}

function buildAndRun() {
  const list1 = parseList(document.getElementById("inp1").value);
  const list2 = parseList(document.getElementById("inp2").value);
  const snaps = buildSnapshots(list1, list2);
  if (window.nav) window.nav.load(snaps);
}

function randomExample() {
  function randSortedList(maxLen) {
    const len = Math.floor(Math.random() * 4) + 1;
    const arr = [];
    let cur = Math.floor(Math.random() * 3);
    for (let i = 0; i < len; i++) {
      arr.push(cur);
      cur += Math.floor(Math.random() * 4) + 1;
    }
    return arr;
  }
  document.getElementById("inp1").value = randSortedList(4).join(",");
  document.getElementById("inp2").value = randSortedList(4).join(",");
  document.getElementById("presetSel").value = "";
  buildAndRun();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  window.nav = VizNav({
    btnPrev: document.getElementById("prevBtn"),
    btnNext: document.getElementById("stepBtn"),
    btnPlay: document.getElementById("playBtn"),
    speedSel: document.getElementById("speedSel"),
    render: function(snap, cur, total) { applyStep(snap, cur > 0); updateStatus(snap, cur, total); }
  });

  buildAndRun();
});
</script>
</body>
</html>
