<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hand of Straights — Visualization</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; overflow: auto; padding: 10px 12px; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  .panel-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 8px; }

  /* freq grid */
  #freq-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .freq-cell {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 12px; border-radius: var(--radius);
    background: var(--surface2); border: 2px solid var(--border);
    min-width: 54px; transition: background 0.15s, border-color 0.15s;
  }
  .freq-cell.state-idle    { border-color: var(--border); }
  .freq-cell.state-active  { border-color: var(--accent); background: rgba(122,162,247,0.12); }
  .freq-cell.state-zero    { border-color: var(--border); opacity: 0.35; }
  .freq-cell.state-missing { border-color: #f7768e; background: rgba(247,118,142,0.12); }
  .freq-cell.state-done    { border-color: #9ece6a; background: rgba(158,206,106,0.08); }
  .freq-val { font-size: 1.3rem; font-weight: 700; color: var(--text-bright); line-height: 1; }
  .freq-card { font-size: 0.78rem; font-weight: 600; color: var(--text-dim); }

  /* hand cards display */
  #hand-display { display: flex; flex-wrap: wrap; gap: 5px; }
  .hand-card {
    width: 36px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; font-size: 1rem; font-weight: 700;
    border: 2px solid var(--border); background: var(--surface2);
    color: var(--text-bright); transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  .hand-card.state-idle   { }
  .hand-card.state-used   { opacity: 0.25; background: var(--bg); }
  .hand-card.state-active { border-color: var(--accent); background: rgba(122,162,247,0.15); }

  #step-desc { font-size: 0.85rem; color: var(--text-bright); min-height: 1.4em; line-height: 1.5; }

  /* groups (sidebar) */
  #groups-list { display: flex; flex-direction: column; gap: 6px; }
  .group-row {
    display: flex; gap: 4px; align-items: center;
    padding: 6px 8px; border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
  }
  .group-row.group-done  { border-color: #9ece6a; background: rgba(158,206,106,0.08); }
  .group-row.group-error { border-color: #f7768e; background: rgba(247,118,142,0.1); }
  .group-card-chip {
    padding: 3px 8px; border-radius: 3px;
    font-size: 0.82rem; font-weight: 700;
    background: rgba(122,162,247,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  #result-box {
    padding: 10px 12px; border-radius: var(--radius);
    font-size: 0.9rem; font-weight: 700; text-align: center;
    display: none;
  }
  #result-box.res-true  { background: rgba(158,206,106,0.15); border: 1px solid #9ece6a; color: #9ece6a; }
  #result-box.res-false { background: rgba(247,118,142,0.15); border: 1px solid #f7768e; color: #f7768e; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value='{"hand":"1,2,3,4","groupSize":"2"}'>Success: Simple pairs</option>
      <option value='{"hand":"1,2,3,6,2,3,4,7,8","groupSize":"3"}' selected>Success: Triplets</option>
      <option value='{"hand":"1,2,4","groupSize":"2"}'>Fail: Missing 3</option>
      <option value='{"hand":"5,6,7","groupSize":"3"}'>Success: Single group</option>
      <option value='{"hand":"1,2,3,4,5","groupSize":"5"}'>Success: Large group</option>
      <option value='{"hand":"1,1,2,2,3,3","groupSize":"3"}'>Success: Duplicates</option>
    </select>
  </div>
  <div>
    <label for="hand-input">Hand</label>
    <input id="hand-input" type="text" value="1,2,3,6,2,3,4,7,8" style="width:180px;" />
  </div>
  <div>
    <label for="group-input">Group Size</label>
    <input id="group-input" type="number" min="1" value="3" style="width:70px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Hand of Straights</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="step-desc">Press Run to start.</div>
    <div>
      <div class="panel-title">Hand</div>
      <div id="hand-display"></div>
    </div>
    <div>
      <div class="panel-title">Frequency Map</div>
      <div id="freq-grid"></div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel"></div>

  <div id="sidebar">
    <div class="panel-title">Groups Formed</div>
    <div id="result-box"></div>
    <div id="groups-list"></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ── simulate ───────────────────────────────────────────────────────────────
function buildSteps(hand, groupSize) {
  var steps = [];
  var n = hand.length;

  function push(desc, extra) {
    steps.push(Object.assign({
      desc: desc,
      freq: null,
      sortedCards: null,
      groups: [],
      freqStates: {},   // card -> 'idle'|'active'|'zero'|'missing'|'done'
      handStates: [],   // per-index: 'idle'|'used'|'active'
      result: null,
    }, extra));
  }

  var emptyHandStates = hand.map(function() { return 'idle'; });

  // step 0: show initial hand
  push('Initial hand: [' + hand.join(', ') + ']. Group size = ' + groupSize + '.', {
    freq: null,
    sortedCards: null,
    freqStates: {},
    handStates: emptyHandStates.slice(),
    groups: [],
    result: null,
  });

  // step 1: count frequencies
  var freq = {};
  hand.forEach(function(c) { freq[c] = (freq[c] || 0) + 1; });
  var sortedCards = Object.keys(freq).map(Number).sort(function(a,b){ return a-b; });

  var freqStates0 = {};
  sortedCards.forEach(function(c) { freqStates0[c] = 'idle'; });

  push('Count frequency of each card. freq = {' +
    sortedCards.map(function(c){ return c+':'+freq[c]; }).join(', ') + '}.', {
    freq: Object.assign({}, freq),
    sortedCards: sortedCards.slice(),
    freqStates: Object.assign({}, freqStates0),
    handStates: emptyHandStates.slice(),
    groups: [],
    result: null,
  });

  // step 2: sort
  push('Sort unique cards: [' + sortedCards.join(', ') + ']. Process in ascending order.', {
    freq: Object.assign({}, freq),
    sortedCards: sortedCards.slice(),
    freqStates: Object.assign({}, freqStates0),
    handStates: emptyHandStates.slice(),
    groups: [],
    result: null,
  });

  // track which hand indices have been consumed
  var handLeft = hand.slice(); // null when consumed
  var groups = [];
  var failed = false;
  var failCard = null;

  var curFreq = Object.assign({}, freq);

  for (var si = 0; si < sortedCards.length; si++) {
    var card = sortedCards[si];

    if (curFreq[card] === 0) {
      // mark as zero, skip
      var skipStates = {};
      sortedCards.forEach(function(c) {
        skipStates[c] = curFreq[c] === 0 ? 'zero' : 'idle';
      });
      skipStates[card] = 'zero';
      push('Card ' + card + ': freq=0, already fully used. Skip.', {
        freq: Object.assign({}, curFreq),
        sortedCards: sortedCards.slice(),
        freqStates: skipStates,
        handStates: buildHandStates(hand, handLeft),
        groups: groups.map(function(g){ return g.slice(); }),
        result: null,
      });
      continue;
    }

    // try to form groups starting at card
    var count = curFreq[card];
    push('Card ' + card + ': freq=' + count + '. Must form ' + count + ' group(s) of size ' + groupSize + ' starting at ' + card + '.', {
      freq: Object.assign({}, curFreq),
      sortedCards: sortedCards.slice(),
      freqStates: makeFreqStates(sortedCards, curFreq, card),
      handStates: buildHandStates(hand, handLeft),
      groups: groups.map(function(g){ return g.slice(); }),
      result: null,
    });

    // For each of the `count` groups
    for (var g = 0; g < count; g++) {
      var group = [];
      var groupOk = true;

      for (var offset = 0; offset < groupSize; offset++) {
        var need = card + offset;

        if (!curFreq[need] || curFreq[need] === 0) {
          // missing card — fail
          groupOk = false;
          failCard = need;

          var failStates = makeFreqStates(sortedCards, curFreq, card);
          if (failStates[need] !== undefined) failStates[need] = 'missing';

          push('Need card ' + need + ' for group starting at ' + card + ' — freq=' + (curFreq[need] || 0) + '. MISSING! Return false.', {
            freq: Object.assign({}, curFreq),
            sortedCards: sortedCards.slice(),
            freqStates: failStates,
            handStates: buildHandStates(hand, handLeft),
            groups: groups.map(function(g){ return g.slice(); }),
            result: false,
          });
          failed = true;
          break;
        }

        group.push(need);
        curFreq[need]--;

        // consume from handLeft
        consumeFromHand(handLeft, need);
      }

      if (failed) break;

      groups.push(group);

      var afterStates = makeFreqStates(sortedCards, curFreq, card);
      push('Formed group [' + group.join(', ') + ']. Decremented each card\'s freq. Groups so far: ' + groups.length + '.', {
        freq: Object.assign({}, curFreq),
        sortedCards: sortedCards.slice(),
        freqStates: afterStates,
        handStates: buildHandStates(hand, handLeft),
        groups: groups.map(function(gg){ return gg.slice(); }),
        result: null,
      });
    }

    if (failed) break;
  }

  if (!failed) {
    var doneStates = {};
    sortedCards.forEach(function(c) { doneStates[c] = 'done'; });
    push('All cards placed into ' + groups.length + ' consecutive group(s) of size ' + groupSize + '. Return true.', {
      freq: Object.assign({}, curFreq),
      sortedCards: sortedCards.slice(),
      freqStates: doneStates,
      handStates: hand.map(function() { return 'used'; }),
      groups: groups.map(function(g){ return g.slice(); }),
      result: true,
    });
  }

  return steps;
}

function makeFreqStates(sortedCards, freq, activeCard) {
  var s = {};
  sortedCards.forEach(function(c) {
    s[c] = freq[c] === 0 ? 'zero' : (c === activeCard ? 'active' : 'idle');
  });
  return s;
}

function buildHandStates(hand, handLeft) {
  return hand.map(function(c, i) {
    return handLeft[i] === null ? 'used' : 'idle';
  });
}

function consumeFromHand(handLeft, card) {
  for (var i = 0; i < handLeft.length; i++) {
    if (handLeft[i] === card) {
      handLeft[i] = null;
      return;
    }
  }
}

// ── parse input ────────────────────────────────────────────────────────────
function parseHand(raw) {
  return raw.trim().split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
}

// ── render ─────────────────────────────────────────────────────────────────
var _lastHand = null;

function applyStep(snap) {
  document.getElementById('step-desc').textContent = snap.desc;
  renderHand(snap);
  renderFreqGrid(snap);
  renderGroups(snap);
  renderResult(snap.result);
}

function updateStatus(snap, cur, total) {
  var phase = 'Step';
  if (snap.result === true) phase = 'Complete';
  else if (snap.result === false) phase = 'Failed';
  else if (cur === 0) phase = 'Setup';
  document.getElementById('phase-badge').textContent = phase;
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

function renderHand(snap) {
  var display = document.getElementById('hand-display');
  if (!display.children.length) return;
  var cells = display.querySelectorAll('.hand-card');
  cells.forEach(function(el, i) {
    el.className = 'hand-card state-' + (snap.handStates ? snap.handStates[i] : 'idle');
  });
}

function renderFreqGrid(snap) {
  var grid = document.getElementById('freq-grid');
  if (!snap.freq || !snap.sortedCards) {
    grid.innerHTML = '<span style="color:var(--text-dim);font-size:0.82rem">—</span>';
    return;
  }
  grid.innerHTML = snap.sortedCards.map(function(c) {
    var state = snap.freqStates[c] || 'idle';
    return '<div class="freq-cell state-' + state + '">' +
      '<div class="freq-val">' + snap.freq[c] + '</div>' +
      '<div class="freq-card">' + c + '</div>' +
      '</div>';
  }).join('');
}

function renderGroups(snap) {
  var list = document.getElementById('groups-list');
  if (!snap.groups || !snap.groups.length) {
    list.innerHTML = '<span style="color:var(--text-dim);font-size:0.75rem;font-style:italic">none yet</span>';
    return;
  }
  list.innerHTML = snap.groups.map(function(g, i) {
    return '<div class="group-row group-done">' +
      g.map(function(c) { return '<span class="group-card-chip">' + c + '</span>'; }).join('') +
    '</div>';
  }).join('');

  if (snap.result === false) {
    var errRow = document.createElement('div');
    errRow.className = 'group-row group-error';
    errRow.innerHTML = '<span style="font-size:0.8rem;color:#f7768e">✕ Missing card</span>';
    list.appendChild(errRow);
  }
}

function renderResult(result) {
  var box = document.getElementById('result-box');
  if (result === null || result === undefined) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  box.className = 'result-box ' + (result ? 'res-true' : 'res-false');
  box.textContent = result ? 'true' : 'false';
}

// ── setup hand display ─────────────────────────────────────────────────────
function setupHandDisplay(hand) {
  var display = document.getElementById('hand-display');
  display.innerHTML = hand.map(function(c) {
    return '<div class="hand-card state-idle">' + c + '</div>';
  }).join('');
}

// ── wire up ────────────────────────────────────────────────────────────────
window.nav = VizNav({
  btnPrev:  document.getElementById('prevBtn'),
  btnNext:  document.getElementById('stepBtn'),
  btnPlay:  document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render:   function(snap, cur, total) {
    applyStep(snap);
    updateStatus(snap, cur, total);
  },
});

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.goTo(0);
});

function doLoad() {
  var raw = document.getElementById('hand-input').value;
  var gs  = parseInt(document.getElementById('group-input').value, 10);
  var hand = parseHand(raw);
  if (!hand.length || isNaN(gs) || gs < 1) {
    alert('Enter a valid hand and group size.');
    return;
  }
  setupHandDisplay(hand);
  var steps = buildSteps(hand, gs);
  window.nav.load(steps);
}

function buildAndRun() {
  doLoad();
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('hand-input').value = d.hand;
  document.getElementById('group-input').value = d.groupSize;
  buildAndRun();
}

function randomExample() {
  var groupSize = Math.floor(Math.random() * 4) + 2;
  var handLen = Math.floor(Math.random() * 8) + 4;
  var hand = [];
  for (var i = 0; i < handLen; i++) {
    hand.push(Math.floor(Math.random() * 10) + 1);
  }
  document.getElementById('hand-input').value = hand.join(',');
  document.getElementById('group-input').value = groupSize.toString();
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

document.getElementById('hand-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLoad();
});

// ── resize handle ──────────────────────────────────────────────────────────
(function(){
  var h=document.getElementById('resize-handle'),p=document.getElementById('code-panel'),d=false,sx=0,sw=0;
  h.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('dragging');e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!d)return;p.style.width=Math.min(560,Math.max(120,sw+(sx-e.clientX)))+'px';});
  document.addEventListener('mouseup',function(){if(!d)return;d=false;h.classList.remove('dragging');});
})();

doLoad();
</script>
</body>
</html>
