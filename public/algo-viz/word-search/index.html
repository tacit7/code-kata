<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Search</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area { width: 100%; max-width: 90%; }
    .main-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .left-col, .right-col { display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 700px) { .main-row { grid-template-columns: 1fr; } }

    .page-sub { font-size: 0.8rem; color: var(--text-dim); margin-left: auto; white-space: nowrap; }

    .sect {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* Grid */
    .grid-wrap {
      display: flex; justify-content: center; margin-top: 6px;
    }
    .grid-table {
      display: grid;
      gap: 6px;
    }
    .grid-cell {
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border); border-radius: 8px;
      background: var(--bg);
      font-size: 1.3rem; font-weight: 700; font-family: monospace;
      color: var(--text-dim);
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      position: relative;
      user-select: none;
    }
    .grid-cell .cell-coord {
      position: absolute; top: 2px; left: 4px;
      font-size: 0.44rem; color: var(--text-ghost); font-family: monospace;
    }
    /* States */
    .grid-cell.current  { border-color: var(--yellow);  color: var(--yellow-light); background: #201700; }
    .grid-cell.on-path  { border-color: var(--accent);  color: var(--accent-pale);  background: #0d1a3e; }
    .grid-cell.match    { border-color: var(--green);   color: var(--green-light);  background: var(--green-bg); }
    .grid-cell.fail     { border-color: var(--red);     color: var(--red-light);    background: #280a10; }
    .grid-cell.visited  { border-color: var(--accent);  color: var(--accent-pale);  background: #0d1a3e; opacity: 0.6; }
    .grid-cell.start    { border-color: var(--purple);  color: var(--purple);       background: #1a1030; }

    /* Word progress */
    .word-row {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; align-items: center;
    }
    .word-char {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border); border-radius: 6px;
      background: var(--bg);
      font-size: 1rem; font-weight: 700; font-family: monospace;
      color: var(--text-dim);
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      position: relative;
    }
    .word-char .char-idx {
      position: absolute; top: -9px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.5rem; color: var(--text-ghost); font-family: monospace;
    }
    .word-char.matched  { border-color: var(--green);  color: var(--green-light);  background: var(--green-bg); }
    .word-char.current  { border-color: var(--yellow); color: var(--yellow-light); background: #201700; }
    .word-char.failed   { border-color: var(--red);    color: var(--red);          background: #280a10; }

    /* Call stack */
    .stack-body {
      font-family: monospace; font-size: 0.74rem;
      max-height: 180px; overflow-y: auto; margin-top: 4px;
    }
    .stack-frame { padding: 1px 0; color: var(--text-muted); white-space: nowrap; }
    .stack-frame.top { color: var(--accent-pale); font-weight: 700; }
    .stack-frame.win { color: var(--green); font-weight: 700; }

    /* Code */
    .code-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .code-header { padding: 8px 14px; font-size: 0.72rem; font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg); }
    .code-body { padding: 10px 0; font-size: 0.78rem; line-height: 1.75; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 14px; }
    .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }

    /* Nav */
    .btn-play {
      background: #15803d; border: none; border-radius: var(--radius-sm);
      color: #fff; cursor: pointer; font-size: 0.88rem; font-weight: 600;
      padding: 9px 16px; transition: background 0.2s;
    }
    .btn-play:hover { background: #166534; }
    .btn-play.playing { background: #c2410c; }
    .btn-play.playing:hover { background: #9a3412; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    .speed-select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 0.85rem; padding: 8px 10px; outline: none; width: 80px;
    }
    .nav-row { display: flex; gap: 8px; align-items: center; }

    /* Var grid */
    .var-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .var-box {
      padding: 10px 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); display: flex; flex-direction: column;
      align-items: center; gap: 3px;
    }
    .var-box.ab { border-color: var(--accent); }
    .var-box.ob { border-color: #b45309; }
    .var-box.gb { border-color: var(--green-border); }
    .var-label { font-size: 0.62rem; font-family: monospace; color: var(--text-faint); text-align: center; }
    .var-val   { font-size: 1.05rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }

    /* Result badge */
    .result-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-size: 0.88rem; font-weight: 700; font-family: monospace;
      border: 1px solid var(--border); color: var(--text-dim);
    }
    .result-badge.found { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .result-badge.not-found { border-color: var(--red); color: var(--red); background: #200a0a; }

    /* Path display */
    .path-row {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; min-height: 36px; align-items: center;
    }
    .path-chip {
      padding: 3px 8px; border: 1px solid var(--accent); border-radius: 4px;
      font-family: monospace; font-size: 0.75rem; color: var(--accent-pale);
      background: #0d1a3e;
    }
    .path-chip.won { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .path-empty { color: var(--text-ghost); font-size: 0.82rem; font-style: italic; }

    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .nb { color: var(--green); }
    .cm { color: var(--text-ghost); }
    .st { color: var(--yellow-light); }
  </style>
</head>
<body class="page">

<div class="page-header">
  <a class="back-link" href="../index.html">&larr; All Algorithms</a>
  <div class="page-title">Word Search</div>
  <div class="page-sub">LeetCode 79 &middot; Backtracking &middot; DFS from every cell</div>
</div>

<div class="controls">
  <div class="field">
    <label>Grid rows (semicolon-separated)</label>
    <input id="inp-grid" type="text" value="ABCE;SFCS;ADEE" style="width:200px;font-family:monospace;font-size:0.9rem" />
  </div>
  <div class="field">
    <label>Word</label>
    <input id="inp-word" type="text" value="ABCCED" style="width:120px;font-family:monospace;font-size:0.9rem" />
  </div>
  <button class="btn-primary" onclick="buildAndRun()">Build</button>
</div>

<div class="viz-area">
  <div class="main-row">

    <!-- ── Left ── -->
    <div class="left-col">

      <!-- Grid -->
      <div class="sect">
        <div class="panel-title">Grid <span class="panel-sub" id="grid-sub"></span></div>
        <div class="grid-wrap">
          <div class="grid-table" id="grid-table">
            <span style="color:var(--text-ghost);font-size:0.82rem">Click Build.</span>
          </div>
        </div>
      </div>

      <!-- Word progress -->
      <div class="sect">
        <div class="panel-title">Word Progress <span class="panel-sub" id="word-sub"></span></div>
        <div class="word-row" id="word-row">
          <span class="path-empty">—</span>
        </div>
      </div>

      <!-- Current path (cells visited so far in this DFS branch) -->
      <div class="sect">
        <div class="panel-title">Path so far</div>
        <div class="path-row" id="path-row">
          <span class="path-empty">none</span>
        </div>
      </div>

    </div>

    <!-- ── Right ── -->
    <div class="right-col">

      <!-- Variables -->
      <div class="sect">
        <div class="panel-title">Variables</div>
        <div class="var-grid">
          <div class="var-box ab">
            <div class="var-label">start cell</div>
            <div class="var-val" id="vv-start">—</div>
          </div>
          <div class="var-box ob">
            <div class="var-label">word[idx]</div>
            <div class="var-val" id="vv-target">—</div>
          </div>
          <div class="var-box gb">
            <div class="var-label">result</div>
            <div class="var-val" id="vv-result">—</div>
          </div>
        </div>
        <div id="result-badge-wrap" style="margin-top:6px"></div>
      </div>

      <!-- Call stack -->
      <div class="sect">
        <div class="panel-title">Call Stack <span class="panel-sub" id="stack-sub"></span></div>
        <div class="stack-body" id="stack-body">
          <span style="color:var(--text-ghost);font-size:0.82rem">—</span>
        </div>
      </div>

      <!-- Code -->
      <div class="code-panel">
        <div class="code-header">Python &middot; DFS backtracking</div>
        <div class="code-body" id="code-body"></div>
      </div>

    </div>

  </div>
</div>

<!-- Bottom nav -->
<div class="nav-bar">
  <div class="nav-row">
    <button class="btn-secondary" id="prevBtn">&larr; Prev</button>
    <button class="playBtn" id="playBtn">Play</button>
    <button class="btn-secondary" id="stepBtn">Next &rarr;</button>
    <select class="speedSel" id="speedSel">
      <option value="800">0.8s</option>
      <option value="500" selected>0.5s</option>
      <option value="300">0.3s</option>
      <option value="150">0.15s</option>
      <option value="80">0.08s</option>
    </select>
  </div>
  <div class="step-counter" id="step-counter">—</div>
  <div class="step-desc" id="step-desc">Click Build to start.</div>
</div>

<script>
// ── Code lines ───────────────────────────────────────────────────────────────
var CODE = [
  { t: '<span class="kw">def</span> <span class="fn">exist</span>(board, word):' },
  { t: '  rows, cols = len(board), len(board[0])' },
  { t: '' },
  { t: '  <span class="kw">def</span> <span class="fn">dfs</span>(r, c, idx):' },
  { t: '    <span class="cm"># base: matched all chars</span>' },
  { t: '    <span class="kw">if</span> idx == len(word): <span class="kw">return</span> <span class="nb">True</span>' },
  { t: '    <span class="cm"># bounds / visited / mismatch</span>' },
  { t: '    <span class="kw">if</span> (r &lt; 0 <span class="kw">or</span> r &gt;= rows <span class="kw">or</span>' },
  { t: '        c &lt; 0 <span class="kw">or</span> c &gt;= cols <span class="kw">or</span>' },
  { t: '        board[r][c] != word[idx]): <span class="kw">return</span> <span class="nb">False</span>' },
  { t: '    tmp, board[r][c] = board[r][c], <span class="st">"#"</span>  <span class="cm"># mark visited</span>' },
  { t: '    found = (<span class="fn">dfs</span>(r+1,c,idx+1) <span class="kw">or</span> <span class="fn">dfs</span>(r-1,c,idx+1) <span class="kw">or</span>' },
  { t: '             <span class="fn">dfs</span>(r,c+1,idx+1) <span class="kw">or</span> <span class="fn">dfs</span>(r,c-1,idx+1))' },
  { t: '    board[r][c] = tmp  <span class="cm"># unmark (backtrack)</span>' },
  { t: '    <span class="kw">return</span> found' },
  { t: '' },
  { t: '  <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span>(rows):' },
  { t: '    <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span>(cols):' },
  { t: '      <span class="kw">if</span> <span class="fn">dfs</span>(r, c, 0): <span class="kw">return</span> <span class="nb">True</span>' },
  { t: '  <span class="kw">return</span> <span class="nb">False</span>' },
];

function renderCode(hlLines) {
  var html = '';
  CODE.forEach(function(line, i) {
    var cls = (hlLines && hlLines.indexOf(i) !== -1) ? ' hl' : '';
    html += '<div class="code-line' + cls + '"><span class="ln">' + (i+1) + '</span>' + line.t + '</div>';
  });
  document.getElementById('code-body').innerHTML = html;
}

// ── Step builder ─────────────────────────────────────────────────────────────
var GRID = [], WORD = '', ROWS = 0, COLS = 0;

function buildSteps() {
  var steps = [];
  var board = GRID.map(function(r) { return r.slice(); }); // mutable copy

  // DFS with step recording
  function dfs(r, c, idx, pathSoFar, callStack) {
    var frame = 'dfs(' + r + ',' + c + ',' + idx + ')';
    var stack = callStack.concat([frame]);

    // bounds / char check
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== WORD[idx]) {
      steps.push({
        type: 'fail',
        r: r, c: c, idx: idx,
        path: pathSoFar.slice(),
        stack: stack.slice(),
        desc: (r < 0 || r >= ROWS || c < 0 || c >= COLS)
          ? 'Out of bounds — backtrack.'
          : 'board[' + r + '][' + c + '] = "' + (board[r][c] || '?') + '" ≠ word[' + idx + '] = "' + WORD[idx] + '" — backtrack.',
        codeHl: [7, 8, 9],
      });
      return false;
    }

    // match
    var tmp = board[r][c];
    board[r][c] = '#'; // mark visited
    var newPath = pathSoFar.concat([[r, c]]);

    // base case: word fully matched
    if (idx === WORD.length - 1) {
      steps.push({
        type: 'found',
        r: r, c: c, idx: idx,
        path: newPath.slice(),
        stack: stack.slice(),
        desc: 'Matched word[' + idx + '] = "' + WORD[idx] + '" at (' + r + ',' + c + '). All ' + WORD.length + ' chars matched — FOUND!',
        codeHl: [5],
      });
      board[r][c] = tmp;
      return true;
    }

    // enter cell
    steps.push({
      type: 'enter',
      r: r, c: c, idx: idx,
      path: newPath.slice(),
      stack: stack.slice(),
      desc: 'board[' + r + '][' + c + '] = "' + tmp + '" matches word[' + idx + '] = "' + WORD[idx] + '". Mark visited, recurse.',
      codeHl: [10, 11, 12],
    });

    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    var found = false;
    for (var d = 0; d < dirs.length; d++) {
      var nr = r + dirs[d][0], nc = c + dirs[d][1];
      if (dfs(nr, nc, idx + 1, newPath, stack)) {
        found = true;
        break;
      }
    }

    board[r][c] = tmp; // unmark
    if (!found) {
      steps.push({
        type: 'backtrack',
        r: r, c: c, idx: idx,
        path: pathSoFar.slice(),
        stack: callStack.slice(),
        desc: 'No neighbor matched word[' + (idx+1) + '] = "' + WORD[idx+1] + '" — backtrack from (' + r + ',' + c + ').',
        codeHl: [13, 14],
      });
    }
    return found;
  }

  // outer loop
  var found = false;
  outer:
  for (var r = 0; r < ROWS && !found; r++) {
    for (var c = 0; c < COLS && !found; c++) {
      steps.push({
        type: 'try-start',
        r: r, c: c, idx: 0,
        path: [],
        stack: ['exist()'],
        desc: 'Try starting DFS at (' + r + ',' + c + ') for word[0] = "' + WORD[0] + '".',
        codeHl: [16, 17, 18],
      });
      if (dfs(r, c, 0, [], ['exist()'])) {
        found = true;
      }
    }
  }

  if (!found) {
    steps.push({
      type: 'done-false',
      r: -1, c: -1, idx: -1,
      path: [],
      stack: [],
      desc: 'Exhausted all starting cells — word "' + WORD + '" not found.',
      codeHl: [19],
    });
  }

  return steps;
}

// ── Render ───────────────────────────────────────────────────────────────────
var STEPS = [], GRID_CELLS = [];

function renderSnap(snap, cursor, total) {
  // Step counter + desc
  document.getElementById('step-counter').textContent = 'Step ' + (cursor + 1) + ' / ' + total;
  document.getElementById('step-desc').textContent = snap.desc;

  // Grid cells
  var pathSet = {};
  (snap.path || []).forEach(function(p) { pathSet[p[0] + ',' + p[1]] = true; });

  GRID_CELLS.forEach(function(row, r) {
    row.forEach(function(el, c) {
      var key = r + ',' + c;
      var cls = '';
      if (snap.type === 'found' && pathSet[key]) {
        cls = 'match';
      } else if (snap.r === r && snap.c === c) {
        if (snap.type === 'fail') cls = 'fail';
        else if (snap.type === 'backtrack') cls = 'visited';
        else cls = 'current';
      } else if (pathSet[key]) {
        cls = 'on-path';
      }
      el.className = 'grid-cell' + (cls ? ' ' + cls : '');
    });
  });

  // Word progress
  var wordRow = document.getElementById('word-row');
  var wordHtml = '';
  for (var i = 0; i < WORD.length; i++) {
    var wCls = '';
    if (snap.type === 'found' && i <= snap.idx) {
      wCls = 'matched';
    } else if (snap.type === 'fail' && i === snap.idx) {
      wCls = 'failed';
    } else if (i < snap.idx) {
      wCls = 'matched';
    } else if (i === snap.idx && snap.type !== 'fail' && snap.type !== 'backtrack' && snap.type !== 'done-false') {
      wCls = 'current';
    }
    wordHtml += '<div class="word-char' + (wCls ? ' ' + wCls : '') + '"><span class="char-idx">' + i + '</span>' + WORD[i] + '</div>';
  }
  wordRow.innerHTML = wordHtml;
  document.getElementById('word-sub').textContent = '(' + snap.idx + '/' + WORD.length + ')';

  // Path chips
  var pathRow = document.getElementById('path-row');
  var pathHtml = '';
  var won = snap.type === 'found';
  if (snap.path && snap.path.length > 0) {
    snap.path.forEach(function(p, pi) {
      pathHtml += '<div class="path-chip' + (won ? ' won' : '') + '">(' + p[0] + ',' + p[1] + ')</div>';
      if (pi < snap.path.length - 1) {
        pathHtml += '<span style="color:var(--text-ghost);font-size:0.75rem">→</span>';
      }
    });
  } else {
    pathHtml = '<span class="path-empty">none</span>';
  }
  pathRow.innerHTML = pathHtml;

  // Variables
  document.getElementById('vv-start').textContent =
    snap.path && snap.path.length > 0 ? '(' + snap.path[0][0] + ',' + snap.path[0][1] + ')' : '—';
  document.getElementById('vv-target').textContent =
    snap.idx >= 0 && snap.idx < WORD.length ? '"' + WORD[snap.idx] + '"' : '—';

  var resBadge = document.getElementById('result-badge-wrap');
  var resVal = document.getElementById('vv-result');
  if (snap.type === 'found') {
    resVal.textContent = 'True';
    resVal.style.color = 'var(--green)';
    resBadge.innerHTML = '<div class="result-badge found">✓ FOUND</div>';
  } else if (snap.type === 'done-false') {
    resVal.textContent = 'False';
    resVal.style.color = 'var(--red)';
    resBadge.innerHTML = '<div class="result-badge not-found">✗ NOT FOUND</div>';
  } else {
    resVal.textContent = '…';
    resVal.style.color = '';
    resBadge.innerHTML = '';
  }

  // Call stack
  var stackBody = document.getElementById('stack-body');
  var stackHtml = '';
  if (snap.stack && snap.stack.length > 0) {
    var frames = snap.stack.slice().reverse();
    frames.forEach(function(f, fi) {
      var cls = fi === 0
        ? (snap.type === 'found' ? 'win' : 'top')
        : '';
      stackHtml += '<div class="stack-frame' + (cls ? ' ' + cls : '') + '">' + f + '</div>';
    });
    document.getElementById('stack-sub').textContent = '(depth ' + snap.stack.length + ')';
  } else {
    stackHtml = '<span style="color:var(--text-ghost);font-size:0.82rem">—</span>';
    document.getElementById('stack-sub').textContent = '';
  }
  stackBody.innerHTML = stackHtml;

  // Code
  renderCode(snap.codeHl);
}

// ── Build & run ──────────────────────────────────────────────────────────────
var nav;

function buildAndRun() {
  var rawGrid = document.getElementById('inp-grid').value.trim();
  var rawWord = document.getElementById('inp-word').value.trim().toUpperCase();
  if (!rawGrid || !rawWord) return;

  GRID = rawGrid.toUpperCase().split(';').map(function(row) {
    return row.trim().split('');
  });
  WORD = rawWord;
  ROWS = GRID.length;
  COLS = GRID[0].length;

  // Build DOM grid
  var table = document.getElementById('grid-table');
  table.style.gridTemplateColumns = 'repeat(' + COLS + ', 52px)';
  table.innerHTML = '';
  GRID_CELLS = [];
  GRID.forEach(function(row, r) {
    GRID_CELLS.push([]);
    row.forEach(function(ch, c) {
      var el = document.createElement('div');
      el.className = 'grid-cell';
      el.innerHTML = '<span class="cell-coord">' + r + ',' + c + '</span>' + ch;
      table.appendChild(el);
      GRID_CELLS[r].push(el);
    });
  });

  document.getElementById('grid-sub').textContent = '(' + ROWS + '×' + COLS + ')';

  STEPS = buildSteps();

  if (!nav) {
    nav = VizNav({
      btnPrev:  document.getElementById('prevBtn'),
      btnNext:  document.getElementById('stepBtn'),
      btnPlay:  document.getElementById('playBtn'),
      speedSel: document.getElementById('speedSel'),
      render:   renderSnap,
    });
  }
  nav.load(STEPS);
}
