<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Median From Data Stream</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    .panel {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:14px 16px;
      display:flex; flex-direction:column; gap:10px;
      overflow:hidden; min-height:0;
    }
    .panel-title {
      font-size:0.72rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.08em;
      flex-shrink:0;
    }
    .panel-title.max-title { color:#f472b6; }
    .panel-title.min-title { color:#60a5fa; }

    .panel-sub {
      font-size:0.72rem; color:var(--text-dim); flex-shrink:0;
      font-family:monospace;
    }

    .tree-wrap { flex:1; overflow:hidden; min-height:0; display:flex; align-items:center; justify-content:center; }
    svg.heap-tree { width:100%; height:100%; overflow:visible; }

    .node-circle { transition:fill 0.25s, stroke 0.25s; }
    .node-text {
      font-family:monospace; font-size:13px; font-weight:700;
      dominant-baseline:central; text-anchor:middle;
      fill:var(--text-bright); pointer-events:none;
    }
    .node-label {
      font-family:monospace; font-size:9px;
      dominant-baseline:central; text-anchor:middle;
      pointer-events:none;
    }
    .tree-edge { transition:stroke 0.25s; }

    .center-col {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:16px; width:120px; flex-shrink:0;
    }

    .median-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:14px 12px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      text-align:center; width:100%;
    }
    .median-label {
      font-size:0.68rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.08em; color:var(--text-dim);
    }
    .median-val {
      font-family:monospace; font-size:1.6rem; font-weight:700;
      color:#fbbf24; line-height:1; transition:color 0.3s;
    }
    .median-val.pending { color:var(--text-ghost); font-size:1.1rem; }
    .median-formula { font-family:monospace; font-size:0.7rem; color:var(--text-dim); line-height:1.4; }

    .size-badges { display:flex; flex-direction:column; gap:6px; width:100%; }
    .size-badge {
      font-size:0.72rem; font-family:monospace; text-align:center;
      padding:4px 8px; border-radius:6px; border:1px solid var(--border);
      background:var(--bg);
    }
    .size-badge.max-badge { color:#f472b6; border-color:#be185d; }
    .size-badge.min-badge { color:#60a5fa; border-color:#1d4ed8; }

    .empty-hint { color:var(--text-ghost); font-size:0.8rem; text-align:center; font-family:monospace; }

    /* ─── Canonical layout ─────────────────────────────── */
    body { background:var(--bg); color:var(--text); font-family:"Fira Code",monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    .viz-inputs { width:100%; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:12px; align-items:center; flex-shrink:0; }
    .viz-inputs .field { display:flex; flex-direction:column; gap:4px; }
    .viz-inputs label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); }
    .viz-inputs input[type="text"] { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:6px 10px; font-size:0.85rem; width:200px; font-family:monospace; }
    .viz-inputs select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:6px 10px; font-size:0.85rem; cursor:pointer; }
    .viz-inputs button { padding:7px 18px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; font-size:0.85rem; }
    .viz-inputs button.random-btn { padding:7px 14px; background:var(--surface); color:var(--text); border:1px solid var(--border); }
    #header { padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-shrink:0; }
    #phase-badge { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 10px; border-radius:var(--radius-sm); background:#1e3a5f; color:var(--blue); border:1px solid var(--blue); }
    #step-counter { font-size:12px; color:var(--text-muted); margin-left:auto; }
    #main { display:flex; flex:1; overflow:hidden; }
    #viz-area { flex:1; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; padding:16px; gap:12px; overflow-y:auto; }
    #resize-handle { width:5px; flex-shrink:0; cursor:col-resize; background:transparent; border-left:1px solid var(--border); transition:background .15s; z-index:10; }
    #resize-handle:hover, #resize-handle.dragging { background:var(--accent); }
    #code-panel { width:350px; min-width:120px; max-width:560px; flex-shrink:0; background: var(--surface-dark); border-right:1px solid var(--border); overflow-y:auto; overflow-x:auto; padding:10px 12px; display:flex; flex-direction:column; }
    #sidebar { width:220px; flex-shrink:0; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:12px; }
    #nav-row { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--surface); border-top:1px solid var(--border); }
    .btn-step { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:6px 14px; cursor:pointer; font-size:0.82rem; }
    .btn-play { background:#15803d; border:none; color:#fff; border-radius:var(--radius-sm); padding:6px 14px; cursor:pointer; font-size:0.82rem; font-weight:600; }
    .code-panel-title { font-size:0.67rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
    .heap-grid { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; width:100%; flex:1; min-height:0; }
  </style>
</head>
<body class="page">

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value='{"stream":"1,2,3"}'>Basic (1, 2, 3)</option>
      <option value='{"stream":"5"}'>Single (5)</option>
      <option value='{"stream":"1,2,3,4"}'>Even count (1, 2, 3, 4)</option>
      <option value='{"stream":"-1,0,1,2,3"}'>With negatives (-1, 0, 1, 2, 3)</option>
      <option value='{"stream":"5,15,1,3,8,7,9,10,20,12"}'>Larger stream (10 values)</option>
      <option value='{"stream":"100,100,100,1,1"}'>With duplicates</option>
    </select>
  </div>
  <div class="field">
    <label>Stream values (comma-separated)</label>
    <input id="inp-stream" type="text" value="1,2,3" />
  </div>
  <button onclick="buildAndRun()">Build &amp; Run</button>
  <button class="random-btn" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">&#8212;</span>
  <span style="font-size:13px;font-weight:700;">Find Median From Data Stream</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="heap-grid">
      <!-- maxHeap panel -->
      <div class="panel">
        <div class="panel-title max-title">maxHeap &#8212; lower half</div>
        <div class="panel-sub" id="max-array">[]</div>
        <div class="tree-wrap">
          <svg class="heap-tree" id="max-svg" viewBox="0 0 300 220">
            <text x="150" y="110" class="empty-hint" font-family="monospace" font-size="13" fill="var(--text-ghost)" text-anchor="middle">empty</text>
          </svg>
        </div>
      </div>

      <!-- center median display -->
      <div class="center-col">
        <div class="median-card">
          <div class="median-label">findMedian</div>
          <div class="median-val pending" id="median-val">&#8212;</div>
          <div class="median-formula" id="median-formula"></div>
        </div>
        <div class="size-badges">
          <div class="size-badge max-badge" id="max-size-badge">max: 0</div>
          <div class="size-badge min-badge" id="min-size-badge">min: 0</div>
        </div>
      </div>

      <!-- minHeap panel -->
      <div class="panel">
        <div class="panel-title min-title">minHeap &#8212; upper half</div>
        <div class="panel-sub" id="min-array">[]</div>
        <div class="tree-wrap">
          <svg class="heap-tree" id="min-svg" viewBox="0 0 300 220">
            <text x="150" y="110" class="empty-hint" font-family="monospace" font-size="13" fill="var(--text-ghost)" text-anchor="middle">empty</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div style="font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);margin-bottom:6px;">Status</div>
    <div id="phase-label" style="font-size:0.75rem;font-weight:700;color:var(--text-dim);">&#8212;</div>
    <div id="step-desc" style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;line-height:1.5;">Enter stream values then click Build &amp; Run.</div>
    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:0.7rem;color:var(--text-dim);line-height:1.6;">
      <div style="font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Complexity</div>
      <div>addNum: O(log n)</div>
      <div>findMedian: O(1)</div>
      <div>Space: O(n)</div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step" disabled>&#8592; Prev</button>
  <button id="stepBtn" class="btn-step" disabled>Step &#8594;</button>
  <button id="playBtn" class="btn-play" disabled>Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var currentStream = [];

// ── Max-Heap ─────────────────────────────────────────────────────────────────
function maxPush(h, v) {
  h.push(v);
  var i = h.length - 1;
  while (i > 0) {
    var p = (i - 1) >> 1;
    if (h[i] > h[p]) { var t=h[i]; h[i]=h[p]; h[p]=t; i=p; } else break;
  }
}
function maxPop(h) {
  var top = h[0], last = h.pop();
  if (h.length > 0) { h[0] = last; siftDownMax(h, 0); }
  return top;
}
function siftDownMax(h, i) {
  while (true) {
    var l=2*i+1, r=2*i+2, lg=i;
    if (l<h.length && h[l]>h[lg]) lg=l;
    if (r<h.length && h[r]>h[lg]) lg=r;
    if (lg!==i) { var t=h[i]; h[i]=h[lg]; h[lg]=t; i=lg; } else break;
  }
}

// ── Min-Heap ──────────────────────────────────────────────────────────────────
function minPush(h, v) {
  h.push(v);
  var i = h.length - 1;
  while (i > 0) {
    var p = (i - 1) >> 1;
    if (h[i] < h[p]) { var t=h[i]; h[i]=h[p]; h[p]=t; i=p; } else break;
  }
}
function minPop(h) {
  var top = h[0], last = h.pop();
  if (h.length > 0) { h[0] = last; siftDownMin(h, 0); }
  return top;
}
function siftDownMin(h, i) {
  while (true) {
    var l=2*i+1, r=2*i+2, sm=i;
    if (l<h.length && h[l]<h[sm]) sm=l;
    if (r<h.length && h[r]<h[sm]) sm=r;
    if (sm!==i) { var t=h[i]; h[i]=h[sm]; h[sm]=t; i=sm; } else break;
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
function simulate(stream) {
  var steps = [];
  var maxH = [], minH = [];
  var medians = [];

  function snap(phase, desc, opts) {
    opts = opts || {};
    steps.push({
      phase:        phase,
      desc:         desc,
      maxH:         maxH.slice(),
      minH:         minH.slice(),
      highlight:    opts.highlight || null,
      medians:      medians.slice(),
      showMedian:   opts.showMedian || false,
      streamIdx:    opts.streamIdx !== undefined ? opts.streamIdx : -1,
    });
  }

  snap('Start', 'Two heaps ready. maxHeap holds the lower half, minHeap holds the upper half.', {});

  for (var si = 0; si < stream.length; si++) {
    var num = stream[si];

    maxPush(maxH, num);
    snap('addNum:push-max', 'add(' + num + '): push ' + num + ' → maxHeap. top=' + maxH[0] + '.', {
      streamIdx: si,
      highlight: {heap:'max', val:num},
    });

    var moved = maxPop(maxH);
    minPush(minH, moved);
    snap('addNum:balance', 'Move maxHeap.top()=' + moved + ' → minHeap. Ensures minHeap always holds values ≥ maxHeap.', {
      streamIdx: si,
      highlight: {heap:'min', val:moved},
    });

    if (minH.length > maxH.length) {
      var back = minPop(minH);
      maxPush(maxH, back);
      snap('addNum:rebalance', 'minHeap.size(' + (minH.length+1) + ') > maxHeap.size(' + (maxH.length-1) + ') → move minHeap.top()=' + back + ' back to maxHeap. maxHeap ≥ minHeap always.', {
        streamIdx: si,
        highlight: {heap:'max', val:back},
      });
    }

    var med;
    if (maxH.length === minH.length) {
      med = (maxH[0] + minH[0]) / 2;
      medians = medians.concat([med]);
      snap('findMedian', 'Equal sizes → median = (maxTop + minTop) / 2 = (' + maxH[0] + ' + ' + minH[0] + ') / 2 = ' + med + '.', {
        streamIdx: si,
        showMedian: true,
        highlight: {heap:'both', maxVal:maxH[0], minVal:minH[0]},
      });
    } else {
      med = maxH[0];
      medians = medians.concat([med]);
      snap('findMedian', 'maxHeap larger → median = maxHeap.top() = ' + med + '.', {
        streamIdx: si,
        showMedian: true,
        highlight: {heap:'max', val:maxH[0]},
      });
    }
  }

  snap('Done', 'Stream complete. Medians: [' + medians.join(', ') + '].', { showMedian: true });
  return steps;
}

// ── Tree Drawing ──────────────────────────────────────────────────────────────
function drawHeapTree(svgEl, heap, highlight, isMax) {
  svgEl.innerHTML = '';

  if (!heap || heap.length === 0) {
    var t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x','150'); t.setAttribute('y','110');
    t.setAttribute('font-family','monospace'); t.setAttribute('font-size','13');
    t.setAttribute('fill','var(--text-ghost)'); t.setAttribute('text-anchor','middle');
    t.textContent = 'empty';
    svgEl.appendChild(t);
    return;
  }

  var n = heap.length;
  var W = 300, H = 220;
  var levels = Math.floor(Math.log2(n)) + 1;
  var rowH = Math.min(60, Math.floor((H - 20) / levels));
  var r = Math.min(20, Math.floor(rowH * 0.38));

  var mainColor = isMax ? '#f472b6' : '#60a5fa';
  var hlColor   = '#fbbf24';
  var bgBase    = isMax ? '#2a0a1f' : '#0a1a2a';
  var bgHl      = '#2a2000';

  var pos = [];
  for (var i = 0; i < n; i++) {
    var lvl = Math.floor(Math.log2(i + 1));
    var posInLvl = i - (Math.pow(2, lvl) - 1);
    var nodesInLvl = Math.pow(2, lvl);
    var x = W * (posInLvl + 0.5) / nodesInLvl;
    var y = 20 + rowH * lvl;
    pos.push({x:x, y:y});
  }

  for (var i = 1; i < n; i++) {
    var pi = (i - 1) >> 1;
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', pos[pi].x); line.setAttribute('y1', pos[pi].y);
    line.setAttribute('x2', pos[i].x);  line.setAttribute('y2', pos[i].y);
    line.setAttribute('stroke','var(--border)'); line.setAttribute('stroke-width','1.5');
    line.classList.add('tree-edge');
    svgEl.appendChild(line);
  }

  for (var i = 0; i < n; i++) {
    var val = heap[i];
    var isHl = false;
    if (highlight) {
      if (highlight.heap === 'both') {
        isHl = isMax ? (val === highlight.maxVal && i === 0) : (val === highlight.minVal && i === 0);
      } else {
        var heapMatch = (isMax && highlight.heap === 'max') || (!isMax && highlight.heap === 'min');
        if (heapMatch && highlight.val !== undefined) {
          isHl = (val === highlight.val);
          var found = false;
          for (var j = 0; j < i; j++) { if (heap[j] === highlight.val) { found=true; break; } }
          if (found) isHl = false;
        }
      }
    }
    var isRoot = (i === 0);

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');

    var circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circ.setAttribute('cx', pos[i].x); circ.setAttribute('cy', pos[i].y);
    circ.setAttribute('r', r);
    circ.setAttribute('fill', isHl ? bgHl : bgBase);
    circ.setAttribute('stroke', isHl ? hlColor : (isRoot ? mainColor : 'var(--border)'));
    circ.setAttribute('stroke-width', isRoot ? '2' : '1.5');
    circ.classList.add('node-circle');
    g.appendChild(circ);

    var txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', pos[i].x); txt.setAttribute('y', pos[i].y);
    txt.setAttribute('font-size', r < 16 ? '10' : '13');
    txt.classList.add('node-text');
    txt.setAttribute('fill', isHl ? hlColor : (isRoot ? mainColor : 'var(--text-bright)'));
    txt.textContent = val;
    g.appendChild(txt);

    if (isRoot) {
      var lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
      lbl.setAttribute('x', pos[i].x); lbl.setAttribute('y', pos[i].y + r + 10);
      lbl.setAttribute('font-size','9'); lbl.classList.add('node-label');
      lbl.setAttribute('fill', mainColor);
      lbl.textContent = isMax ? 'top (max)' : 'top (min)';
      g.appendChild(lbl);
    }

    svgEl.appendChild(g);
  }
}

// ── Render step ───────────────────────────────────────────────────────────────
function applyStep(s) {
  var maxSvg = document.getElementById('max-svg');
  var minSvg = document.getElementById('min-svg');

  var hl = s.highlight;
  var maxHl = null, minHl = null;
  if (hl) {
    if (hl.heap === 'max')  maxHl = hl;
    if (hl.heap === 'min')  minHl = hl;
    if (hl.heap === 'both') { maxHl = hl; minHl = hl; }
  }
  drawHeapTree(maxSvg, s.maxH, maxHl, true);
  drawHeapTree(minSvg, s.minH, minHl, false);

  document.getElementById('max-array').textContent = '[' + s.maxH.join(', ') + ']';
  document.getElementById('min-array').textContent = '[' + s.minH.join(', ') + ']';

  document.getElementById('max-size-badge').textContent = 'max: ' + s.maxH.length;
  document.getElementById('min-size-badge').textContent = 'min: ' + s.minH.length;

  var medEl = document.getElementById('median-val');
  var fmEl  = document.getElementById('median-formula');
  if (s.medians.length > 0) {
    var latest = s.medians[s.medians.length - 1];
    medEl.textContent = latest;
    medEl.className = 'median-val';
    if (s.showMedian) {
      medEl.style.color = '#fbbf24';
      if (s.maxH.length === s.minH.length && s.maxH.length > 0) {
        fmEl.textContent = '(' + s.maxH[0] + ' + ' + s.minH[0] + ') / 2';
      } else {
        fmEl.textContent = 'maxHeap.top() = ' + (s.maxH[0] !== undefined ? s.maxH[0] : '?');
      }
    } else {
      medEl.style.color = 'var(--text-dim)';
      fmEl.textContent = '';
    }
  } else {
    medEl.textContent = '—';
    medEl.className = 'median-val pending';
    fmEl.textContent = '';
  }

  document.getElementById('phase-label').textContent = s.phase;
  document.getElementById('step-desc').textContent = s.desc;
}

// ── Wire-up ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      document.getElementById('phase-label').textContent = 'Step ' + (cur+1) + ' / ' + total + '  ·  ' + snap.phase;
    }
  });
  buildAndRun();
});

function parseCSV(raw) {
  return raw.split(',').map(function(s){ return parseFloat(s.trim()); }).filter(function(n){ return !isNaN(n); });
}

function buildAndRun() {
  var stream = parseCSV(document.getElementById('inp-stream').value);
  if (!stream.length) return;
  currentStream = stream;
  simSteps = simulate(stream);
  nav.load(simSteps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-stream').value = d.stream;
  buildAndRun();
}

function randomExample() {
  var presetSel = document.getElementById('presetSel');
  presetSel.value = '';
  var count = Math.floor(Math.random() * 8) + 3;
  var stream = [];
  for (var i = 0; i < count; i++) {
    stream.push(Math.floor(Math.random() * 100) - 30);
  }
  document.getElementById('inp-stream').value = stream.join(',');
  buildAndRun();
}
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
