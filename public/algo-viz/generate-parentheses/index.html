<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Parentheses</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area { width: 100%; max-width: 98%; }
    .main-row { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
    @media (max-width: 800px) { .main-row { grid-template-columns: 1fr; } }

    /* tree */
    .tree-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    #tree-svg { display: block; width: 100%; }

    /* right col */
    .right-col { display: flex; flex-direction: column; gap: 12px; }

    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel-title {
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
    }

    /* nav row */
    .nav-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-play {
      background: #15803d; border: none; border-radius: var(--radius-sm);
      color: #fff; cursor: pointer; font-size: 0.88rem; font-weight: 600;
      padding: 8px 14px; transition: background 0.2s; white-space: nowrap;
    }
    .btn-play:hover { background: #166534; }
    .btn-play.playing { background: #c2410c; }
    .btn-play.playing:hover { background: #9a3412; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    .speed-select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 0.85rem; padding: 8px 10px; outline: none; width: 80px;
    }

    /* var grid */
    .var-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .var-box {
      padding: 10px 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .var-box.accent-border { border-color: var(--accent); }
    .var-box.green-border  { border-color: var(--green-border); }
    .var-box.amber-border  { border-color: #b45309; }
    .var-label { font-size: 0.62rem; font-family: monospace; color: var(--text-faint); text-align: center; }
    .var-val   { font-size: 1.1rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }

    /* results list */
    .results-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 220px; overflow-y: auto;
    }
    .result-item {
      font-family: monospace; font-size: 0.9rem; font-weight: 700;
      padding: 5px 10px; border-radius: 5px;
      background: var(--green-bg); color: var(--green);
      border: 1px solid var(--green-border);
      opacity: 0;
    }
    .result-item.visible { opacity: 1; }

    /* legend */
    .leg-row { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--text-muted); }
    .leg-item { display: flex; align-items: center; gap: 8px; }
    .leg-swatch { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }

    /* code */
    .code-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .code-header {
      padding: 8px 14px; font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .code-body { padding: 10px 0; font-size: 0.78rem; line-height: 1.75; white-space: pre; }
    .cl {
      display: flex; align-items: stretch; border-left: 3px solid transparent;
      padding: 0 14px 0 0; white-space: pre;
    }
    .cl .ln {
      width: 26px; min-width: 26px; text-align: right;
      color: #3d4468; user-select: none; padding-right: 14px;
      font-size: 0.7rem; line-height: 1.75;
    }
    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .cm { color: #3d4468; font-style: italic; }
    .op { color: var(--text); }
    .nb { color: var(--green); }
  </style>
</head>
<body class="page">

  <div class="page-title">Generate Parentheses</div>
  <div class="page-sub">LeetCode 22 &middot; Backtracking with open/close counters &middot; O(4ⁿ/√n) time</div>
</div>

<div class="controls">
  <div class="field">
    <label>n (pairs)</label>
    <select id="inp-n" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.9rem;padding:7px 10px;outline:none;">

<div class="viz-area">
  <div class="main-row">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="tree-wrap">
        <svg id="tree-svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="code-panel">

    </div>

    <div class="right-col">
      <div class="panel-box">
        <div class="nav-row">

          <button class="btn-step" id="btn-next" disabled>&rarr;</button>
          <button class="btn-play" id="btn-play" disabled>&#9654; Play</button>
          <select class="speed-select" id="speed-select">
            <option value="700">Slow</option>

        </div>
        <div style="font-size:0.72rem;color:var(--text-dim);margin-top:2px" id="phase-label">&mdash;</div>
        <div style="font-size:0.82rem;color:var(--text-muted)" id="step-desc">Select n and click Build &amp; Run.</div>
      </div>

      <div class="panel-box">
        <div class="panel-title">State</div>
        <div class="var-grid">
          <div class="var-box">
            <div class="var-label">n</div>

          </div>
          <div class="var-box accent-border">
            <div class="var-label">open</div>

          </div>

            <div class="var-label">close</div>

          </div>
        </div>
        <div style="margin-top:4px">
          <div class="var-label" style="margin-bottom:4px">current string</div>
          <div id="vv-str" style="font-family:monospace;font-size:1.1rem;font-weight:700;color:var(--text-bright);letter-spacing:0.12em;min-height:24px">&mdash;</div>
        </div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Results <span id="result-count" style="font-weight:400;color:var(--text-faint)"></span></div>
        <div class="results-list" id="results-list">
          <span style="color:var(--text-faint);font-size:0.82rem;font-style:italic">None yet.</span>
        </div>

      <div class="panel-box">
        <div class="panel-title">Legend</div>
        <div class="leg-row">
          <div class="leg-item">
            <div class="leg-swatch" style="background:#1e2130;border:2px solid #2d3148"></div>
            Unvisited node
          </div>
          <div class="leg-item">
            <div class="leg-swatch" style="background:#4338ca;border:2px solid var(--accent)"></div>
            Active call
          </div>
          <div class="leg-item">
            <div class="leg-swatch" style="background:#052e16;border:2px solid #16a34a"></div>
            Leaf — valid combo
          </div>
          <div class="leg-item">
            <div class="leg-swatch" style="background:#1c0d00;border:2px solid #b45309"></div>
            Returned (explored)
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var nav, simSteps = [], currentN = 3;

var CODE_LINES = [
  [1,  '<span class="kw">def</span> <span class="fn">generate</span><span class="op">(</span>n<span class="op">):</span>'],
  [2,  '    res <span class="op">=</span> <span class="op">[]</span>'],
  [0,  ''],
  [4,  '    <span class="kw">def</span> <span class="fn">backtrack</span><span class="op">(</span>s<span class="op">,</span> open<span class="op">,</span> close<span class="op">):</span>'],
  [5,  '        <span class="kw">if</span> <span class="bi">len</span><span class="op">(</span>s<span class="op">)</span> <span class="op">==</span> <span class="nb">2</span> <span class="op">*</span> n<span class="op">:</span>'],
  [6,  '            res<span class="op">.</span><span class="fn">append</span><span class="op">(</span>s<span class="op">)  </span><span class="cm"># complete combo</span>'],
  [7,  '            <span class="kw">return</span>'],
  [0,  ''],
  [9,  '        <span class="kw">if</span> open <span class="op">&lt;</span> n<span class="op">:</span>'],
  [10, '            <span class="fn">backtrack</span><span class="op">(</span>s <span class="op">+</span> <span class="nb">"("</span><span class="op">,</span> open <span class="op">+</span> <span class="nb">1</span><span class="op">,</span> close<span class="op">)</span>'],
  [11, '        <span class="kw">if</span> close <span class="op">&lt;</span> open<span class="op">:</span>'],
  [12, '            <span class="fn">backtrack</span><span class="op">(</span>s <span class="op">+</span> <span class="nb">")"</span><span class="op">,</span> open<span class="op">,</span> close <span class="op">+</span> <span class="nb">1</span><span class="op">)</span>'],
  [0,  ''],
  [14, '    <span class="fn">backtrack</span><span class="op">(</span><span class="nb">""</span><span class="op">,</span> <span class="nb">0</span><span class="op">,</span> <span class="nb">0</span><span class="op">)</span>'],
  [15, '    <span class="kw">return</span> res'],
];

// ─── SVG helpers ──────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

// ─── Layout ───────────────────────────────────────────────────────────────────
var nodeMap = {};

function layoutTree(nodes) {
  // nodes: [{id, parentId, label, depth, childIndex (among siblings)}]
  // compute x by in-order traversal order
  var byDepth = {};
  nodes.forEach(function(n) {
    if (!byDepth[n.depth]) byDepth[n.depth] = [];
    byDepth[n.depth].push(n);
  });

  // assign in-order index
  var inIdx = 0;
  function inorder(nodeId) {
    var node = nodeMap[nodeId];
    if (!node) return;
    if (node.leftChildId) inorder(node.leftChildId);
    node._inIdx = inIdx++;
    if (node.rightChildId) inorder(node.rightChildId);
  }
  // find root
  var root = nodes.find(function(n) { return n.parentId === null; });
  if (!root) return;
  inorder(root.id);

  var count = nodes.length;
  var maxDepth = 0;
  nodes.forEach(function(n) { if (n.depth > maxDepth) maxDepth = n.depth; });

  var xSpace = Math.max(50, Math.min(90, 760 / Math.max(1, count)));
  var ySpace = 72;
  var padX = 36, padY = 36;
  var VW = padX * 2 + (count - 1) * xSpace;
  var VH = padY * 2 + maxDepth * ySpace + 44;
  if (VW < 500) VW = 500;

  var svg = document.getElementById('tree-svg');
  svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);

  var R = VW > 700 ? 20 : 16;

  nodes.forEach(function(n) {
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + n.depth * ySpace + R;
    n.R = R;
  });

  return { VW: VW, VH: VH, R: R };
}

// ─── SVG render ───────────────────────────────────────────────────────────────
var COLORS = {
  idle:   { fill: '#1e2130', stroke: '#2d3148', text: 'var(--text-muted)' },
  active: { fill: '#4338ca', stroke: 'var(--accent)', text: '#fff' },
  leaf:   { fill: '#052e16', stroke: '#16a34a', text: 'var(--green)' },
  done:   { fill: '#1c0d00', stroke: '#b45309', text: '#d97706' },
};

function renderSVG(nodes) {
  var svg = document.getElementById('tree-svg');
  svg.innerHTML = '';

  var edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeG.id = 'edges';
  var nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeG.id = 'nodes-g';
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  // draw edges
  nodes.forEach(function(n) {
    if (n.parentId === null) return;
    var parent = nodeMap[n.parentId];
    if (!parent) return;
    var line = svgEl('line', {
      id: 'edge-' + parent.id + '-' + n.id,
      x1: parent.x, y1: parent.y, x2: n.x, y2: n.y,
      stroke: '#2d3148', 'stroke-width': 1.5, 'stroke-linecap': 'round',
    });
    edgeG.appendChild(line);

    // edge label
    var mx = (parent.x + n.x) / 2;
    var my = (parent.y + n.y) / 2;
    var lbl = svgEl('text', {
      id: 'elbl-' + parent.id + '-' + n.id,
      x: mx + (n.x < parent.x ? -8 : 8),
      y: my,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#6b7280', 'font-size': 11, 'font-weight': '700',
      'font-family': 'monospace',
    });
    lbl.textContent = n.edgeLabel;
    edgeG.appendChild(lbl);
  });

  // draw nodes
  nodes.forEach(function(n) {
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'node-g-' + n.id;

    var c = svgEl('circle', {
      id: 'nc-' + n.id,
      cx: n.x, cy: n.y, r: n.R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': 2,
    });
    g.appendChild(c);

    // label: short string or counters
    var displayLabel = n.label.length > 5 ? n.label.slice(-4) + '…' : n.label;
    var t = svgEl('text', {
      id: 'nt-' + n.id,
      x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.max(8, Math.round(n.R * 0.6)),
      'font-weight': 'bold',
      'font-family': 'monospace',
    });
    // show o/c counts to keep nodes small
    t.textContent = n.open + ',' + n.close;
    g.appendChild(t);

    // tooltip title
    var title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = '"' + n.label + '" open=' + n.open + ' close=' + n.close;
    g.appendChild(title);

    nodeG.appendChild(g);
  });
}

// ─── Simulation ───────────────────────────────────────────────────────────────
function simulate(n) {
  var steps = [];
  var allNodes = [];
  var idCounter = 0;
  nodeMap = {};

  function makeNode(parentId, label, open, close, edgeLabel) {
    var id = idCounter++;
    var parent = parentId !== null ? nodeMap[parentId] : null;
    var depth = parent ? parent.depth + 1 : 0;
    var node = {
      id: id, parentId: parentId, label: label,
      open: open, close: close, edgeLabel: edgeLabel || '',
      depth: depth, state: 'idle',
      leftChildId: null, rightChildId: null, _inIdx: 0, x: 0, y: 0, R: 20,
    };
    nodeMap[id] = node;
    allNodes.push(node);
    if (parent) {
      if (parent.leftChildId === null) parent.leftChildId = id;
      else parent.rightChildId = id;
    }
    return node;
  }

  var results = [];
  var stateSnap = {}; // id -> state

  function snap(phase, desc, lines, activeId) {
    var sm = {};
    allNodes.forEach(function(nd) { sm[nd.id] = nd.state; });
    steps.push({
      phase: phase, desc: desc, lines: lines,
      activeId: activeId !== null ? activeId : -1,
      stateMap: JSON.parse(JSON.stringify(sm)),
      results: results.slice(),
      nodesSnapshot: allNodes.map(function(nd) {
        return { id: nd.id, x: nd.x, y: nd.y, R: nd.R, open: nd.open, close: nd.close, label: nd.label, parentId: nd.parentId, edgeLabel: nd.edgeLabel, depth: nd.depth, leftChildId: nd.leftChildId, rightChildId: nd.rightChildId, _inIdx: nd._inIdx };
      }),
    });
  }

  function backtrack(parentId, s, open, close, edgeLabel) {
    var node = makeNode(parentId, s, open, close, edgeLabel);
    node.state = 'active';

    if (s.length === 2 * n) {
      snap('Leaf', '"' + s + '" — length = 2n. Valid combination found!', [5, 6, 7], node.id);
      results.push(s);
      node.state = 'leaf';
      snap('Result', 'Added "' + s + '" to results.', [6], node.id);
      return;
    }

    snap('Enter', 'backtrack("' + s + '", open=' + open + ', close=' + close + ')', [4, 5], node.id);

    var addedOpen = false, addedClose = false;

    if (open < n) {
      snap('Branch', 'open (' + open + ') < n (' + n + '). Can add "(". Branching left.', [9, 10], node.id);
      backtrack(node.id, s + '(', open + 1, close, '(');
      addedOpen = true;
      node.state = 'active';
    }

    if (close < open) {
      snap('Branch', 'close (' + close + ') < open (' + open + '). Can add ")". Branching right.', [11, 12], node.id);
      backtrack(node.id, s + ')', open, close + 1, ')');
      addedClose = true;
      node.state = 'active';
    }

    node.state = 'done';
    snap('Return', 'Done exploring "' + s + '". Backtrack.', [4], node.id);
  }

  // root call
  var rootNode = makeNode(null, '', 0, 0, '');
  rootNode.state = 'active';
  snap('Start', 'Call backtrack("", 0, 0). Starting recursion.', [14], rootNode.id);

  // now actually run (re-simulate properly by tracking the tree structure)
  // reset
  allNodes = [];
  nodeMap = {};
  idCounter = 0;
  results = [];
  steps = [];

  function bt2(parentId, s, open, close, edgeLabel) {
    var node = makeNode(parentId, s, open, close, edgeLabel);
    // layout immediately so coords exist when we snapshot
    layoutTree(allNodes);
    node.state = 'active';

    if (s.length === 2 * n) {
      snap('Leaf', '"' + s + '" — length = 2n. Valid combination found!', [5, 6, 7], node.id);
      results.push(s);
      node.state = 'leaf';
      snap('Result', 'Added "' + s + '" to results (' + results.length + ' so far).', [6], node.id);
      return;
    }

    snap('Enter', 'backtrack("' + s + '", open=' + open + ', close=' + close + ')', [4, 5], node.id);

    if (open < n) {
      snap('Branch→(', 'open (' + open + ') < n (' + n + ') → can add "(". Recurse.', [9, 10], node.id);
      bt2(node.id, s + '(', open + 1, close, '(');
      node.state = 'active';
      layoutTree(allNodes);
    }

    if (close < open) {
      snap('Branch→)', 'close (' + close + ') < open (' + open + ') → can add ")". Recurse.', [11, 12], node.id);
      bt2(node.id, s + ')', open, close + 1, ')');
      node.state = 'active';
      layoutTree(allNodes);
    }

    node.state = 'done';
    snap('Return', 'Explored all branches of "' + s + '". Backtrack.', [4], node.id);
  }

  bt2(null, '', 0, 0, '');

  var finalSnap = JSON.parse(JSON.stringify(steps[steps.length - 1]));
  finalSnap.phase = 'Done';
  finalSnap.desc = 'Complete. Found ' + results.length + ' valid combination' + (results.length === 1 ? '' : 's') + ' for n=' + n + '.';
  finalSnap.lines = [15];
  steps.push(finalSnap);

  return steps;
}

// ─── Apply step ──────────────────────────────────────────────────────────────
var prevLines = [];

function applyStep(s, animate) {
  // Rebuild SVG from snapshot if node count changed
  var nodes = s.nodesSnapshot;
  var svg = document.getElementById('tree-svg');

  // Check if we need to rebuild (new nodes added)
  var existingNodes = svg.querySelectorAll('circle[id^="nc-"]');
  if (existingNodes.length !== nodes.length) {
    // Rebuild from snapshot
    var snapshotNodeMap = {};
    nodes.forEach(function(n) { snapshotNodeMap[n.id] = n; });
    // temporarily replace nodeMap for renderSVG
    var savedNodeMap = nodeMap;
    nodeMap = snapshotNodeMap;

    // Find VW/VH from snapshot layout
    var maxDepth = 0, count = nodes.length;
    nodes.forEach(function(n) { if (n.depth > maxDepth) maxDepth = n.depth; });
    var xSpace = Math.max(50, Math.min(90, 760 / Math.max(1, count)));
    var padX = 36, padY = 36, ySpace = 72;
    var VW = padX * 2 + (count - 1) * xSpace;
    if (VW < 500) VW = 500;
    var R = VW > 700 ? 20 : 16;
    var VH = padY * 2 + maxDepth * ySpace + R + 44;
    svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);

    nodeMap = savedNodeMap;
    renderSVGFromSnapshot(nodes, VW, VH, R);
  }

  // Apply states
  nodes.forEach(function(n) {
    var state = s.stateMap[n.id] || 'idle';
    setNodeColor(n.id, state, animate);
  });

  // Highlight active node
  if (s.activeId >= 0) {
    var activeNode = nodes.find(function(n) { return n.id === s.activeId; });
    if (activeNode) {
      updateVars(activeNode, s, animate);
    }
  }

  // Results
  updateResults(s.results, animate);

  // Code
  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

function renderSVGFromSnapshot(nodes, VW, VH, R) {
  var svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);

  var edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  var nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  var nm = {};
  nodes.forEach(function(n) { nm[n.id] = n; });

  nodes.forEach(function(n) {
    if (n.parentId === null) return;
    var parent = nm[n.parentId];
    if (!parent) return;
    edgeG.appendChild(svgEl('line', {
      id: 'edge-' + parent.id + '-' + n.id,
      x1: parent.x, y1: parent.y, x2: n.x, y2: n.y,
      stroke: '#2d3148', 'stroke-width': 1.5, 'stroke-linecap': 'round',
    }));
    var mx = (parent.x + n.x) / 2;
    var my = (parent.y + n.y) / 2;
    var lbl = svgEl('text', {
      id: 'elbl-' + parent.id + '-' + n.id,
      x: mx + (n.x < parent.x ? -9 : 9), y: my,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#6272a4', 'font-size': 11, 'font-weight': '700', 'font-family': 'monospace',
    });
    lbl.textContent = n.edgeLabel;
    edgeG.appendChild(lbl);
  });

  nodes.forEach(function(n) {
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'node-g-' + n.id;
    g.appendChild(svgEl('circle', {
      id: 'nc-' + n.id, cx: n.x, cy: n.y, r: R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': 2,
    }));
    var t = svgEl('text', {
      id: 'nt-' + n.id, x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.max(8, Math.round(R * 0.6)),
      'font-weight': 'bold', 'font-family': 'monospace',
    });
    t.textContent = n.open + ',' + n.close;
    g.appendChild(t);
    var title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = '"' + n.label + '" open=' + n.open + ' close=' + n.close;
    g.appendChild(title);
    nodeG.appendChild(g);
  });
}

function setNodeColor(id, state, animate) {
  var c = COLORS[state] || COLORS.idle;
  var nc = document.getElementById('nc-' + id);
  var nt = document.getElementById('nt-' + id);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: 0.25, attr: { fill: c.fill, stroke: c.stroke } });
    if (nt) gsap.to(nt, { duration: 0.25, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

function updateVars(node, s, animate) {
  function setV(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    if (animate && el.textContent !== String(val)) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    }
    el.textContent = val;
  }
  setV('vv-n', currentN);
  setV('vv-open', node.open);
  setV('vv-close', node.close);
  var strEl = document.getElementById('vv-str');
  if (strEl) {
    var display = node.label || '""';
    if (animate && strEl.textContent !== display) {
      gsap.fromTo(strEl, { opacity: 0 }, { opacity: 1, duration: 0.2 });
    }
    strEl.textContent = display;
  }
}

function updateResults(results, animate) {
  var list = document.getElementById('results-list');
  var count = document.getElementById('result-count');
  if (!results || results.length === 0) {
    list.innerHTML = '<span style="color:var(--text-faint);font-size:0.82rem;font-style:italic">None yet.</span>';
    if (count) count.textContent = '';
    return;
  }
  if (count) count.textContent = '(' + results.length + ')';
  // Build items
  list.innerHTML = '';
  results.forEach(function(r, i) {
    var item = document.createElement('div');
    item.className = 'result-item visible';
    item.textContent = r;
    list.appendChild(item);
  });
}

// ─── Code highlighting ────────────────────────────────────────────────────────
var HL_BG   = 'rgba(99,102,241,0.12)';
var HL_NONE = 'rgba(99,102,241,0)';
var HL_BORD = 'var(--accent)';
var NO_BORD = 'transparent';

function setCodeLines(oldLines, newLines, animate) {
  var DUR = 0.2;
  (oldLines || []).filter(function(n) { return !(newLines || []).includes(n); }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_NONE, borderLeftColor: NO_BORD, duration: DUR });
    } else {
      el.style.backgroundColor = ''; el.style.borderLeftColor = '';
    }
  });
  (newLines || []).filter(function(n) { return !(oldLines || []).includes(n); }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.06 });
    } else {
      el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD;
    }
  });
}

// ─── Build code panel ─────────────────────────────────────────────────────────
function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE_LINES.map(function(e) {
    var ln = e[0], html = e[1];
    return '<div class="cl"' + (ln > 0 ? ' id="cl-' + ln + '"' : '') + '>'
      + '<span class="ln">' + (ln > 0 ? ln : '') + '</span>'
      + '<span>' + html + '</span></div>';
  }).join('');
}

// ─── Build & Run ──────────────────────────────────────────────────────────────
function buildAndRun() {
  currentN = parseInt(document.getElementById('inp-n').value, 10);
  buildCodePanel();
  prevLines = [];
  document.getElementById('results-list').innerHTML = '<span style="color:var(--text-faint);font-size:0.82rem;font-style:italic">None yet.</span>';
  document.getElementById('result-count').textContent = '';
  document.getElementById('vv-n').textContent = currentN;
  document.getElementById('vv-open').textContent = '—';
  document.getElementById('vv-close').textContent = '—';
  document.getElementById('vv-str').textContent = '—';
  document.getElementById('step-desc').textContent = 'Running…';

  simSteps = simulate(currentN);
  nav.load(simSteps);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('btn-back'),
    btnNext: document.getElementById('btn-next'),
    btnPlay: document.getElementById('btn-play'),
    speedSel: document.getElementById('speed-select'),
    render: function(s, cur, total) {
      applyStep(s, cur > 0);
      var pl = document.getElementById('phase-label');
      var sd = document.getElementById('step-desc');
      if (pl) pl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + s.phase;
      if (sd) {
        gsap.fromTo(sd, { opacity: 0 }, { opacity: 1, duration: 0.15 });
        sd.textContent = s.desc;
      }
    }
  });
  buildAndRun();
});
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
