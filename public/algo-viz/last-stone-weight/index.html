<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Stone Weight</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
    #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

    /* -- Description -- */
    #desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; min-height: 20px; }

    /* -- Two-panel area -- */
    .middle {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      overflow: hidden;
    }
    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
      overflow: hidden;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
      flex-shrink: 0;
    }

    /* -- Heap visual -- */
    .heap-list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
    }
    .heap-row {
      display: flex; align-items: center; gap: 8px;
    }
    .heap-bar-wrap {
      flex: 1; height: 26px;
      background: var(--bg); border-radius: 4px;
      overflow: hidden;
    }
    .heap-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.25s ease;
    }
    .heap-bar.stone-y { background: var(--orange); }
    .heap-bar.stone-x { background: var(--red); }
    .heap-val {
      font-size: 0.82rem; font-weight: 700; font-family: monospace;
      color: var(--text-bright); min-width: 30px; text-align: right;
    }
    .heap-rank {
      font-size: 0.65rem; color: var(--text-ghost); font-family: monospace;
      min-width: 20px;
    }

    /* -- Collision log -- */
    .log-list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
    }
    .log-entry {
      background: var(--bg); border: 1px solid var(--border-soft);
      border-radius: 6px; padding: 8px 12px;
      font-size: 0.8rem; font-family: monospace;
      color: var(--text-muted);
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-entry.current {
      border-color: var(--accent);
      background: rgba(122,162,247,0.06);
    }
    .log-smash { color: var(--orange-light); font-weight: 700; }
    .log-result-destroyed { color: var(--red-light); }
    .log-result-survivor  { color: var(--green); }

    /* -- Code panel -- */
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
    .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
    .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
    .kw { color: var(--purple); }
    .nb { color: var(--green); }
    .cm { color: var(--text-dim); font-style: italic; }

    /* -- Sidebar -- */
    .sidebar-section { font-size: 11px; margin-bottom: 14px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
    .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
    .var-item:last-child { border-bottom: none; }
    .var-key { color: var(--text-dim); }
    .var-val { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:180px;">
      <option value="">— pick a preset —</option>
      <option value='{"stones":"2,7,4,1,8,1"}' selected>Example (default)</option>
      <option value='{"stones":"3,3,3"}'>All equal</option>
      <option value='{"stones":"5"}'>Single stone</option>
      <option value='{"stones":"2,2"}'>Two equal</option>
      <option value='{"stones":"5,10"}'>Two different</option>
      <option value='{"stones":"100,50,25"}'>Large cascade</option>
    </select>
  </div>
  <div>
    <label>Stones (comma-separated)</label>
    <input id="stonesInput" type="text" value="2,7,4,1,8,1" spellcheck="false" style="width:200px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Last Stone Weight</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div class="middle">
      <!-- Left: heap -->
      <div class="panel-box">
        <div class="panel-title">Max-Heap (sorted descending)</div>
        <div class="heap-list" id="heapList"></div>
      </div>
      <!-- Right: collision log -->
      <div class="panel-box">
        <div class="panel-title">Collision Log</div>
        <div class="log-list" id="logList"></div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Variables</div>
      <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Stats</div>
      <div class="var-item"><span class="var-key">remaining</span> = <span class="var-val" id="stoneCount">—</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// -- Code panel source --------------------------------------------------------
const codeLines = [
  { n: 1, t: '<span class="kw">def</span> <span class="nb">last_stone_weight</span>(stones):' },
  { n: 2, t: '  heap = [-s <span class="kw">for</span> s <span class="kw">in</span> stones]' },
  { n: 3, t: '  <span class="nb">heapify</span>(heap)' },
  { n: 4, t: '  <span class="kw">while</span> <span class="nb">len</span>(heap) > 1:' },
  { n: 5, t: '    y = -<span class="nb">heappop</span>(heap)' },
  { n: 6, t: '    x = -<span class="nb">heappop</span>(heap)' },
  { n: 7, t: '    <span class="kw">if</span> y != x:' },
  { n: 8, t: '      <span class="nb">heappush</span>(heap, -(y - x))' },
  { n: 9, t: '  <span class="kw">return</span> -heap[0] <span class="kw">if</span> heap <span class="kw">else</span> 0' },
];

// -- Simulation ---------------------------------------------------------------

function buildSteps(stones) {
  // Clone so we can mutate
  var heap = stones.slice().sort(function(a,b){ return b-a; });
  var steps = [];
  var log = [];   // accumulated collision log

  // Step 0: initial state
  steps.push({
    heap: heap.slice(),
    log: log.slice(),
    y: null, x: null, result: null,
    desc: 'Initial heap. Largest stone is at the top.',
    phase: 'Setup',
    lines: [1, 2],
  });

  while (heap.length >= 2) {
    // Pop two heaviest
    var y = heap.shift();
    var x = heap.shift();

    var entry;
    if (x === y) {
      // Both destroyed
      entry = { y: y, x: x, result: 0, destroyed: true };
      steps.push({
        heap: heap.slice(),
        log: log.slice().concat([entry]),
        y: y, x: x, result: null,
        desc: 'Smash: y=' + y + ' vs x=' + x + '. Equal — both destroyed.',
        phase: 'Smash',
        currentLog: entry,
        lines: [3, 4, 5, 6],
      });
    } else {
      var remainder = y - x;
      // Insert remainder back into sorted position
      var inserted = false;
      for (var i = 0; i < heap.length; i++) {
        if (heap[i] < remainder) {
          heap.splice(i, 0, remainder);
          inserted = true;
          break;
        }
      }
      if (!inserted) heap.push(remainder);

      entry = { y: y, x: x, result: remainder, destroyed: false };
      steps.push({
        heap: heap.slice(),
        log: log.slice().concat([entry]),
        y: y, x: x, result: remainder,
        desc: 'Smash: y=' + y + ' vs x=' + x + '. Survivor=' + remainder + ' pushed back.',
        phase: 'Smash',
        currentLog: entry,
        lines: [3, 4, 5, 6, 7],
      });
    }
    log.push(entry);
  }

  // Final step
  var finalStone = heap.length === 1 ? heap[0] : 0;
  steps.push({
    heap: heap.slice(),
    log: log.slice(),
    y: null, x: null, result: finalStone,
    desc: heap.length === 0
      ? 'All stones destroyed. Result = 0.'
      : 'One stone remains. Result = ' + finalStone + '.',
    phase: 'Done',
    lines: [8],
  });

  return steps;
}

// -- Render -------------------------------------------------------------------

var heapList  = document.getElementById('heapList');
var logList   = document.getElementById('logList');
var stoneCount = document.getElementById('stoneCount');

function renderHeap(heap, y, x) {
  heapList.innerHTML = '';
  if (heap.length === 0) {
    heapList.innerHTML = '<div style="color:var(--text-ghost);font-size:0.8rem;font-family:monospace;">— empty —</div>';
    return;
  }
  var max = heap[0] || 1;
  heap.forEach(function(val, i) {
    var pct = Math.max(4, Math.round((val / max) * 100));
    var barClass = 'heap-bar';
    if (val === y && y !== null) barClass += ' stone-y';
    else if (val === x && x !== null) barClass += ' stone-x';

    var row = document.createElement('div');
    row.className = 'heap-row';
    row.innerHTML =
      '<span class="heap-rank">#' + (i+1) + '</span>' +
      '<div class="heap-bar-wrap"><div class="' + barClass + '" style="width:' + pct + '%"></div></div>' +
      '<span class="heap-val">' + val + '</span>';
    heapList.appendChild(row);
  });
}

function renderLog(log, currentEntry) {
  logList.innerHTML = '';
  if (log.length === 0) {
    logList.innerHTML = '<div style="color:var(--text-ghost);font-size:0.8rem;font-family:monospace;">No collisions yet.</div>';
    return;
  }
  log.forEach(function(entry, i) {
    var isCurrent = (currentEntry && i === log.length - 1);
    var div = document.createElement('div');
    div.className = 'log-entry' + (isCurrent ? ' current' : '');

    var smash = '<span class="log-smash">y=' + entry.y + ' &#x2715; x=' + entry.x + '</span>';
    var res;
    if (entry.destroyed) {
      res = '<span class="log-result-destroyed">&#10005; both destroyed</span>';
    } else {
      res = '<span class="log-result-survivor">&#10003; ' + entry.result + ' survives</span>';
    }
    div.innerHTML = '<div>' + smash + '</div><div>' + res + '</div>';
    logList.appendChild(div);
  });
  // scroll latest into view
  logList.lastElementChild && logList.lastElementChild.scrollIntoView({ block: 'nearest' });
}

function applyStep(snap) {
  renderHeap(snap.heap, snap.y, snap.x);
  renderLog(snap.log, snap.currentLog);

  document.getElementById('desc').textContent = snap.desc;
  stoneCount.textContent = snap.heap.length;

  // Code highlight
  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  (snap.lines || []).forEach(function(idx) {
    var el = document.getElementById('cl-' + idx);
    if (el) el.classList.add('hl');
  });

  // Sidebar variables
  var varsDiv = document.getElementById('vars-items');
  var html = '';
  if (snap.y !== null) html += '<div class="var-item"><span class="var-key">y</span> = <span class="var-val">' + snap.y + '</span></div>';
  if (snap.x !== null) html += '<div class="var-item"><span class="var-key">x</span> = <span class="var-val">' + snap.x + '</span></div>';
  if (snap.result !== null) html += '<div class="var-item"><span class="var-key">result</span> = <span class="var-val">' + snap.result + '</span></div>';
  varsDiv.innerHTML = html || '<span style="color:var(--text-dim);">—</span>';
}

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

// -- Boot ---------------------------------------------------------------------

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + (line.n - 1);
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  document.getElementById('stonesInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') buildAndRun();
  });

  buildAndRun();
});

function buildAndRun() {
  var raw = document.getElementById('stonesInput').value;
  var stones = raw.split(',').map(function(s){ return parseInt(s.trim(), 10); }).filter(function(n){ return !isNaN(n) && n > 0; });
  if (stones.length < 1) return;
  var steps = buildSteps(stones);
  window.nav.load(steps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('stonesInput').value = d.stones;
  buildAndRun();
}

function randomExample() {
  var count = Math.floor(Math.random() * 6) + 2;
  var stones = [];
  for (var i = 0; i < count; i++) {
    stones.push(Math.floor(Math.random() * 100) + 1);
  }
  document.getElementById('stonesInput').value = stones.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// -- Resize handle (verbatim from two-sum) ------------------------------------
(function(){
  var h=document.getElementById('resize-handle'),p=document.getElementById('code-panel'),d=false,sx=0,sw=0;
  h.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('dragging');e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!d)return;p.style.width=Math.min(560,Math.max(120,sw+(sx-e.clientX)))+'px';});
  document.addEventListener('mouseup',function(){if(!d)return;d=false;h.classList.remove('dragging');});
})();
</script>
</body>
</html>
