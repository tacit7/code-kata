<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two Sum II – Input Array Is Sorted</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  /* ── layout ── */
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:monospace; }
  #main { display:flex; flex:1; overflow:hidden; gap:0; }

  /* ── left: code panel ── */
  #code-panel {
    width:280px; min-width:220px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #code-panel h3 { margin:0; padding:10px 14px; font-size:.8rem; color:var(--text-muted); border-bottom:1px solid var(--border); letter-spacing:.06em; text-transform:uppercase; }
  #code-lines { flex:1; overflow-y:auto; padding:8px 0; }
  .code-line { display:flex; gap:8px; padding:2px 10px; font-size:.78rem; line-height:1.65; white-space:pre; }
  .code-line .ln { color:var(--text-dim); width:18px; text-align:right; flex-shrink:0; user-select:none; }
  .code-line .code { color:var(--text-muted); }
  .code-line.active { background:rgba(59,130,246,.18); }
  .code-line.active .code { color:var(--text); }

  /* ── center: array + sum display ── */
  #center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px; overflow:hidden; }
  #preset-row { display:flex; gap:8px; align-items:center; font-size:.78rem; color:var(--text-muted); }
  #preset-row button { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:3px 10px; border-radius:var(--radius-sm); cursor:pointer; font-size:.78rem; }
  #preset-row button.active { border-color:var(--accent); color:var(--accent); }

  #array-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; }
  #pointer-row { display:flex; gap:8px; position:relative; height:28px; }
  .ptr-label {
    width:56px; text-align:center; font-weight:700; font-size:.85rem;
    border-radius:var(--radius-sm); padding:2px 0; line-height:1.4;
    transition:opacity .25s;
  }
  .ptr-label.ptr-L { color:#3b82f6; background:rgba(59,130,246,.12); }
  .ptr-label.ptr-R { color:#f97316; background:rgba(249,115,22,.12); }
  .ptr-label.ptr-hidden { opacity:0; }

  #array-row { display:flex; gap:8px; }
  .cell {
    width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--border); border-radius:8px; font-size:1.2rem; font-weight:700;
    background:var(--surface); position:relative; transition:border-color .25s, background .25s;
  }
  .cell .idx { position:absolute; bottom:-22px; font-size:.7rem; color:var(--text-dim); width:100%; text-align:center; }
  .cell.active-L { border-color:#3b82f6; background:rgba(59,130,246,.1); }
  .cell.active-R { border-color:#f97316; background:rgba(249,115,22,.1); }
  .cell.active-LR { border-color:#22c55e; background:rgba(34,197,94,.15); color:#22c55e; }

  #sum-display {
    margin-top:28px; padding:14px 24px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); font-size:.9rem; text-align:center; min-width:340px; min-height:48px;
    line-height:1.5;
  }
  #sum-display .sum-eq { color:var(--text-muted); }
  #sum-display .sum-val { color:var(--accent); font-weight:700; }
  #sum-display .cmp-gt { color:var(--red); }
  #sum-display .cmp-lt { color:var(--blue); }
  #sum-display .cmp-eq { color:var(--green); }

  /* ── right panel ── */
  #right-panel { width:260px; min-width:200px; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .rp-section { display:flex; flex-direction:column; overflow:hidden; }
  .rp-section:first-child { flex:0 0 auto; border-bottom:1px solid var(--border); }
  .rp-section:last-child { flex:1; }
  .rp-title { font-size:.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; padding:8px 12px; border-bottom:1px solid var(--border); }

  #state-table { width:100%; border-collapse:collapse; font-size:.78rem; }
  #state-table td { padding:5px 12px; border-bottom:1px solid rgba(51,65,85,.5); }
  #state-table td:first-child { color:var(--text-dim); width:50%; }
  #state-table td:last-child { color:var(--text); font-weight:600; text-align:right; }
  #state-table td.val-changed { color:var(--accent); }

  #log-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
  .log-entry { font-size:.72rem; padding:5px 8px; border-radius:var(--radius-sm); background:rgba(15,23,42,.4); border-left:2px solid var(--border); color:var(--text-muted); }
  .log-entry.latest { border-left-color:var(--accent); color:var(--text); }
  .log-entry .log-cmp-gt { color:var(--red); }
  .log-entry .log-cmp-lt { color:var(--blue); }
  .log-entry .log-cmp-eq { color:var(--green); }

  /* ── status bar ── */
  #status-bar { background:var(--surface); border-top:1px solid var(--border); padding:8px 14px; font-size:.8rem; color:var(--text-muted); display:flex; align-items:center; gap:8px; }
  #step-counter { margin-left:auto; }

  /* ── nav row ── */
  .nav-row { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--surface); border-top:1px solid var(--border); }
</style>
</head>
<body>

<div id="main">
  <!-- Left: code panel -->
  <div id="code-panel">
    <h3>Python</h3>
    <div id="code-lines"></div>
  </div>

  <!-- Center -->
  <div id="center">
    <div id="preset-row">
      <span>Preset:</span>
      <button id="p1" class="active" onclick="loadPreset(0)">A: [2,7,11,15] t=9</button>
      <button id="p2" onclick="loadPreset(1)">B: [1,3,4,5,7,11] t=9</button>
    </div>

    <div id="array-wrap">
      <div id="pointer-row"></div>
      <div id="array-row"></div>
    </div>

    <div id="sum-display">—</div>
  </div>

  <!-- Right panel -->
  <div id="right-panel">
    <div class="rp-section">
      <div class="rp-title">Pointer State</div>
      <table id="state-table">
        <tr><td>left</td><td id="st-left">—</td></tr>
        <tr><td>right</td><td id="st-right">—</td></tr>
        <tr><td>numbers[left]</td><td id="st-nl">—</td></tr>
        <tr><td>numbers[right]</td><td id="st-nr">—</td></tr>
        <tr><td>sum</td><td id="st-sum">—</td></tr>
        <tr><td>target</td><td id="st-target">—</td></tr>
      </table>
    </div>
    <div class="rp-section">
      <div class="rp-title">Decision Log</div>
      <div id="log-list"></div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div id="status-bar">
  <span id="status-msg">Ready</span>
  <span id="step-counter"></span>
</div>

<!-- Nav controls -->
<div class="nav-row">
  <button id="prevBtn" class="btn-step">← Prev</button>
  <button id="stepBtn" class="btn-step">Step →</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">↺ Reset</button>
  <select id="speedSel">
    <option value="800">0.5×</option>
    <option value="400" selected>1×</option>
    <option value="200">2×</option>
    <option value="100">4×</option>
  </select>
</div>

<script>
// ── Code lines ──────────────────────────────────────────────────────────────
const CODE = [
  'def twoSum(numbers, target):',
  '    left, right = 0, len(numbers) - 1',
  '',
  '    while left < right:',
  '        current_sum = numbers[left] + numbers[right]',
  '',
  '        if current_sum == target:',
  '            return [left + 1, right + 1]',
  '        elif current_sum < target:',
  '            left += 1',
  '        else:',
  '            right -= 1',
];

function buildCode() {
  const container = document.getElementById('code-lines');
  container.innerHTML = '';
  CODE.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'code-line';
    div.id = 'cl-' + (i + 1);
    div.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="code">' + escHtml(line) + '</span>';
    container.appendChild(div);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setActiveLines(lines) {
  document.querySelectorAll('.code-line.active').forEach(el => el.classList.remove('active'));
  (lines || []).forEach(n => {
    const el = document.getElementById('cl-' + n);
    if (el) el.classList.add('active');
  });
}

// ── Snapshot generator ──────────────────────────────────────────────────────
function buildSnapshots(numbers, target) {
  const snaps = [];
  const log = [];

  function addSnap(phase, left, right, sum, comparison, action, result, message, activeLines) {
    snaps.push({ phase, left, right, sum, comparison, action, result, message, activeLines, log: log.map(e => ({...e})) });
  }

  // INIT
  addSnap('init', 0, numbers.length - 1, null, null, null, null,
    'Initialize left=0, right=' + (numbers.length - 1),
    [2]);

  let left = 0;
  let right = numbers.length - 1;

  while (left < right) {
    const sum = numbers[left] + numbers[right];
    let comparison, action, message, moveMsg;

    if (sum === target) {
      comparison = 'eq';
      action = 'found';
      message = 'numbers[' + left + ']+numbers[' + right + '] = ' + numbers[left] + '+' + numbers[right] + ' = ' + sum + ' == ' + target + ' → FOUND! Return [' + (left+1) + ', ' + (right+1) + ']';
      addSnap('found', left, right, sum, comparison, action, [left+1, right+1], message, [5, 7, 8]);
      log.push({ step: snaps.length, left, right, sum, comparison, action });
      addSnap('done', left, right, sum, 'eq', 'found', [left+1, right+1], 'Answer: [' + (left+1) + ', ' + (right+1) + '] (1-indexed)', [8]);
      break;
    } else if (sum < target) {
      comparison = 'lt';
      action = 'move_left';
      message = 'numbers[' + left + ']+numbers[' + right + '] = ' + numbers[left] + '+' + numbers[right] + ' = ' + sum + ' < ' + target + ' → move left pointer right';
      addSnap('check', left, right, sum, comparison, action, null, message, [5, 7, 9]);
      log.push({ step: snaps.length, left, right, sum, comparison, action });
      moveMsg = 'Sum too small: increment left to ' + (left + 1);
      left += 1;
      addSnap('move', left, right, null, comparison, action, null, moveMsg, [10]);
    } else {
      comparison = 'gt';
      action = 'move_right';
      message = 'numbers[' + left + ']+numbers[' + right + '] = ' + numbers[left] + '+' + numbers[right] + ' = ' + sum + ' > ' + target + ' → move right pointer left';
      addSnap('check', left, right, sum, comparison, action, null, message, [5, 7, 9, 11]);
      log.push({ step: snaps.length, left, right, sum, comparison, action });
      moveMsg = 'Sum too large: decrement right to ' + (right - 1);
      right -= 1;
      addSnap('move', left, right, null, comparison, action, null, moveMsg, [12]);
    }
  }

  return snaps;
}

// ── Presets ─────────────────────────────────────────────────────────────────
const PRESETS = [
  { numbers: [2, 7, 11, 15], target: 9 },
  { numbers: [1, 3, 4, 5, 7, 11], target: 9 },
];
let currentPreset = 0;
let snapshots = [];
let nav;

function loadPreset(idx) {
  currentPreset = idx;
  document.querySelectorAll('#preset-row button').forEach((b, i) => b.classList.toggle('active', i === idx));
  const { numbers, target } = PRESETS[idx];
  snapshots = buildSnapshots(numbers, target);
  buildArray(numbers);
  buildPointers(numbers.length);
  if (nav) nav.reset(snapshots);
}

// ── Array DOM ────────────────────────────────────────────────────────────────
function buildArray(numbers) {
  const row = document.getElementById('array-row');
  row.innerHTML = '';
  numbers.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell-' + i;
    cell.innerHTML = v + '<span class="idx">' + i + '</span>';
    row.appendChild(cell);
  });
}

function buildPointers(n) {
  const row = document.getElementById('pointer-row');
  row.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const lbl = document.createElement('div');
    lbl.className = 'ptr-label ptr-hidden';
    lbl.id = 'ptr-' + i;
    lbl.style.width = '56px';
    row.appendChild(lbl);
    if (i < n - 1) {
      const gap = document.createElement('div');
      gap.style.width = '8px';
      row.appendChild(gap);
    }
  }
}

// ── Render step ──────────────────────────────────────────────────────────────
function applyStep(snap, animate) {
  const { numbers, target } = PRESETS[currentPreset];
  const { phase, left, right, sum, comparison, activeLines, log, result } = snap;

  // Array cell classes
  document.querySelectorAll('.cell').forEach((c, i) => {
    c.classList.remove('active-L', 'active-R', 'active-LR');
    if (phase === 'found' || phase === 'done') {
      if (i === left && i === right) c.classList.add('active-LR');
      else if (i === left) c.classList.add('active-LR');
      else if (i === right) c.classList.add('active-LR');
    } else {
      if (i === left && i === right) c.classList.add('active-LR');
      else if (i === left) c.classList.add('active-L');
      else if (i === right) c.classList.add('active-R');
    }
  });

  // Pointer labels
  document.querySelectorAll('.ptr-label').forEach(el => {
    el.className = 'ptr-label ptr-hidden';
    el.textContent = '';
  });
  const pL = document.getElementById('ptr-' + left);
  const pR = document.getElementById('ptr-' + right);
  if (pL) {
    if (left === right) {
      pL.className = 'ptr-label ptr-hidden'; // shown as LR below
    }
    pL.className = 'ptr-label ptr-L';
    pL.textContent = 'L';
  }
  if (pR && left !== right) {
    pR.className = 'ptr-label ptr-R';
    pR.textContent = 'R';
  } else if (pR && left === right) {
    pR.className = 'ptr-label ptr-L'; // share L style for same index
    pR.textContent = 'L=R';
  }

  // Sum display
  const sd = document.getElementById('sum-display');
  if (sum === null) {
    sd.innerHTML = '<span class="sum-eq">—</span>';
  } else {
    let cmpClass = comparison === 'gt' ? 'cmp-gt' : comparison === 'lt' ? 'cmp-lt' : 'cmp-eq';
    let cmpSym = comparison === 'gt' ? '&gt;' : comparison === 'lt' ? '&lt;' : '=';
    let action = comparison === 'gt' ? '→ right--' : comparison === 'lt' ? '→ left++' : '→ FOUND!';
    sd.innerHTML = 'numbers[' + left + '] + numbers[' + right + '] = ' +
      '<span class="sum-val">' + numbers[left] + ' + ' + numbers[right] + ' = ' + sum + '</span>' +
      ' <span class="' + cmpClass + '">' + cmpSym + ' ' + target + ' ' + action + '</span>';
  }

  // State table
  document.getElementById('st-left').textContent = left;
  document.getElementById('st-right').textContent = right;
  document.getElementById('st-nl').textContent = numbers[left];
  document.getElementById('st-nr').textContent = numbers[right];
  document.getElementById('st-sum').textContent = sum !== null ? sum : '—';
  document.getElementById('st-target').textContent = target;

  // Decision log
  const logEl = document.getElementById('log-list');
  logEl.innerHTML = '';
  log.forEach((entry, i) => {
    const isLatest = i === log.length - 1;
    const div = document.createElement('div');
    div.className = 'log-entry' + (isLatest ? ' latest' : '');
    let cmpClass = entry.comparison === 'gt' ? 'log-cmp-gt' : entry.comparison === 'lt' ? 'log-cmp-lt' : 'log-cmp-eq';
    let cmpSym = entry.comparison === 'gt' ? '>' : entry.comparison === 'lt' ? '<' : '=';
    let act = entry.action === 'move_right' ? 'right--' : entry.action === 'move_left' ? 'left++' : 'FOUND';
    div.innerHTML = '[' + entry.left + ',' + entry.right + '] ' +
      numbers[entry.left] + '+' + numbers[entry.right] + '=' + entry.sum +
      ' <span class="' + cmpClass + '">' + cmpSym + target + ' → ' + act + '</span>';
    logEl.appendChild(div);
  });
  if (logEl.lastChild) logEl.lastChild.scrollIntoView({ block: 'nearest' });

  // Code highlight
  setActiveLines(activeLines);

  // GSAP pulse on active cells
  if (animate && typeof gsap !== 'undefined') {
    const cells = [];
    if (phase === 'found' || phase === 'done') {
      for (let i = 0; i < numbers.length; i++) {
        const el = document.getElementById('cell-' + i);
        if (el && (i === left || i === right)) cells.push(el);
      }
    } else {
      [left, right].forEach(idx => {
        const el = document.getElementById('cell-' + idx);
        if (el) cells.push(el);
      });
    }
    if (cells.length) gsap.fromTo(cells, { scale: 1 }, { scale: 1.08, duration: .12, yoyo: true, repeat: 1, ease: 'power1.inOut' });
  }
}

function updateStatus(snap, cur, total) {
  document.getElementById('status-msg').textContent = snap.message;
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + (total - 1);
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  buildCode();
  const { numbers, target } = PRESETS[0];
  snapshots = buildSnapshots(numbers, target);
  buildArray(numbers);
  buildPointers(numbers.length);

  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) { applyStep(snap, cur > 0); updateStatus(snap, cur, total); }
  });
  nav.reset(snapshots);

  document.getElementById('resetBtn').addEventListener('click', function() {
    nav.reset(snapshots);
  });
});
</script>
</body>
</html>
