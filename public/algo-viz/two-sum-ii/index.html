<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two Sum II</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* viz-inputs bar */
  .viz-inputs { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .vi-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .vi-input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; font-family: inherit; }
  .vi-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; font-family: inherit; cursor: pointer; }
  .vi-btn { padding: 7px 18px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; font-family: inherit; }
  .vi-btn-run { background: var(--accent); color: #fff; }
  .vi-btn-rand { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  /* Header */
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  /* Main layout */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* Viz area */
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 24px; overflow: hidden; }

  /* Description */
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }

  /* Array canvas */
  #array-canvas { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .array-row { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 0; }

  /* Node */
  .node-wrap { display: flex; flex-direction: column; align-items: center; }
  .node-box {
    width: 48px; height: 48px; border-radius: 8px;
    background: #1e293b; border: 2px solid #334155; color: #f1f5f9;
    font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .25s, background .25s, opacity .25s;
    margin: 0 4px;
  }
  .node-box.highlight-left  { border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f620; }
  .node-box.highlight-right { border-color: #f97316; box-shadow: 0 0 0 3px #f9731620; }
  .node-box.highlight-match { border-color: #22c55e; background: #14532d40; color: #4ade80; box-shadow: 0 0 0 3px #22c55e30; }
  .node-box.faded { opacity: 0.3; }
  .node-box.pulse { animation: nodePulse .5s ease; }
  @keyframes nodePulse { 0%,100%{box-shadow:0 0 0 0 #10b98140} 50%{box-shadow:0 0 0 8px #10b98130} }

  /* Index labels */
  .index-label { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

  /* Pointer badges */
  .badges { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 4px; min-height: 18px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .05em; }
  .badge-left  { background: #1e3a5f; color: #3b82f6; border: 1px solid #3b82f6; }
  .badge-right { background: #431407; color: #f97316; border: 1px solid #f97316; }
  .badge-match { background: #1a2e1a; color: #22c55e; border: 1px solid #22c55e; }

  /* Sum display */
  #sum-display { display: none; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .sum-part { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sum-val { font-size: 20px; font-weight: 700; }
  .sum-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
  .sum-op { font-size: 18px; color: var(--text-dim); }
  .sum-result { font-size: 20px; font-weight: 700; }
  .sum-cmp { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
  .sum-cmp.lt { background: #451a03; color: #f97316; }
  .sum-cmp.gt { background: #1e1b4b; color: #818cf8; }
  .sum-cmp.eq { background: #14532d; color: #4ade80; }

  /* Sidebar */
  #sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .ptr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptr-table td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
  .ptr-table td:first-child { color: var(--text-muted); width: 54px; }
  .ptr-table td:last-child { color: var(--text); font-weight: 600; }
  .list-text { font-size: 11px; color: var(--text-muted); line-height: 1.6; }

  /* Code panel */
  #code-panel { width: 220px; min-width: 120px; max-width: 560px; overflow-x: auto; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; flex-shrink: 0; }
  #code-pre { font-size: 11px; line-height: 1.7; font-family: inherit; overflow-x: auto; }
  .code-line { padding: 0 4px; border-radius: 3px; display: block; transition: background .2s; white-space: pre; }
  .code-line.active { background: #451a0350; color: #fbbf24; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .cm { color: #546e7a; font-style: italic; }
  .str { color: #c3e88d; } .num { color: #f78c6c; }

  /* Nav */
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  #resize-handle { width:5px; flex-shrink:0; cursor:col-resize; background:transparent; border-right:1px solid var(--border); transition:background .15s; z-index:10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label class="vi-label">Preset</label>
    <select id="presetSel" class="vi-select" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value="2,7,11,15|9">[2,7,11,15] target=9</option>
      <option value="2,3,4|6">[2,3,4] target=6</option>
      <option value="-1,0|-1">[-1,0] target=-1</option>
      <option value="1,2,3,4,5|8">[1,2,3,4,5] target=8</option>
      <option value="3,3|6">[3,3] target=6</option>
    </select>
  </div>
  <div>
    <label class="vi-label">Array (sorted, comma-sep)</label>
    <input id="numsInput" class="vi-input" type="text" value="2,7,11,15" style="width:200px;" />
  </div>
  <div>
    <label class="vi-label">Target</label>
    <input id="targetInput" class="vi-input" type="number" value="9" style="width:80px;" />
  </div>
  <button class="vi-btn vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>

<div id="header">
  <span id="phase-badge">Init</span>
  <span style="font-size:13px;font-weight:700;">Two Sum II</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <pre id="code-pre"></pre>
  </div>
  <div id="resize-handle"></div>
  <div id="viz-area">
    <div id="desc">Initializing...</div>
    <div id="array-canvas"></div>
    <div id="sum-display"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <table class="ptr-table" id="ptr-table">
        <tbody></tbody>
      </table>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">State</div>
      <div class="list-text" id="list-state"></div>
    </div>
  </div>
</div>


<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8634; Reset</button>
  <select id="speedSel">
    <option value="800">0.5x</option>
    <option value="400" selected>1x</option>
    <option value="200">2x</option>
    <option value="100">4x</option>
  </select>
</div>

<script>
// ─── Code lines ────────────────────────────────────────────────────────────
const CODE_LINES = [
  { n: 1, t: '<span class="kw">def</span> <span class="fn">twoSum</span>(numbers, target):' },
  { n: 2, t: '    left, right = <span class="num">0</span>, <span class="fn">len</span>(numbers) - <span class="num">1</span>' },
  { n: 3, t: '    <span class="kw">while</span> left &lt; right:' },
  { n: 4, t: '        s = numbers[left] + numbers[right]' },
  { n: 5, t: '        <span class="kw">if</span> s == target:' },
  { n: 6, t: '            <span class="kw">return</span> [left+<span class="num">1</span>, right+<span class="num">1</span>]' },
  { n: 7, t: '        <span class="kw">elif</span> s &lt; target:' },
  { n: 8, t: '            left += <span class="num">1</span>' },
  { n: 9, t: '        <span class="kw">else</span>:' },
  { n: 10, t: '            right -= <span class="num">1</span>' },
];

// ─── Build snapshots ───────────────────────────────────────────────────────
function buildSnapshots(nums, target) {
  const snaps = [];

  function snap(phase, description, left, right, activeLine, sumVal, cmp) {
    return {
      phase, description,
      nums: [...nums],
      target,
      left, right,
      activeLine,
      sumVal: (sumVal !== undefined && sumVal !== null) ? sumVal : null,
      cmp: cmp || 'none'
    };
  }

  // Init step
  snaps.push(snap(
    'init',
    'Initialize: left = 0 (nums[0]=' + nums[0] + '), right = ' + (nums.length-1) + ' (nums[' + (nums.length-1) + ']=' + nums[nums.length-1] + '). Converge inward to find the pair.',
    0, nums.length - 1, 2, null, 'none'
  ));

  let left = 0, right = nums.length - 1;
  while (left < right) {
    const s = nums[left] + nums[right];
    const cmp = s === target ? 'eq' : s < target ? 'lt' : 'gt';

    // Compute sum step
    snaps.push(snap(
      'search',
      'Compute: nums[' + left + '] + nums[' + right + '] = ' + nums[left] + ' + ' + nums[right] + ' = ' + s + '. Compare to target ' + target + '.',
      left, right, 4, s, cmp
    ));

    if (s === target) {
      snaps.push(snap(
        'found',
        'Found! ' + nums[left] + ' + ' + nums[right] + ' = ' + s + ' == target ' + target + '. Answer (1-indexed): [' + (left+1) + ', ' + (right+1) + '].',
        left, right, 6, s, 'eq'
      ));
      break;
    } else if (s < target) {
      snaps.push(snap(
        'search',
        'Sum ' + s + ' < target ' + target + ': move left pointer right to increase the sum.',
        left, right, 8, s, 'lt'
      ));
      left++;
    } else {
      snaps.push(snap(
        'search',
        'Sum ' + s + ' > target ' + target + ': move right pointer left to decrease the sum.',
        left, right, 10, s, 'gt'
      ));
      right--;
    }
  }

  return snaps;
}

// ─── Render array canvas ───────────────────────────────────────────────────
function renderArrayCanvas(snap) {
  const { nums, left, right, phase, sumVal, cmp, target } = snap;
  const canvas = document.getElementById('array-canvas');

  let rowHtml = '<div class="array-row">';
  nums.forEach(function(val, i) {
    var cls = 'node-box';
    if (phase === 'found' && (i === left || i === right)) {
      cls += ' highlight-match';
    } else if (i === left) {
      cls += ' highlight-left';
    } else if (i === right) {
      cls += ' highlight-right';
    } else if (i < left || i > right) {
      cls += ' faded';
    }

    var badges = '';
    if (i === left && phase === 'found') badges += '<span class="badge badge-match">L</span>';
    else if (i === left) badges += '<span class="badge badge-left">L</span>';
    if (i === right && phase === 'found') badges += '<span class="badge badge-match">R</span>';
    else if (i === right) badges += '<span class="badge badge-right">R</span>';

    rowHtml += '<div class="node-wrap">' +
      '<div class="' + cls + '">' + val + '</div>' +
      '<div class="badges">' + badges + '</div>' +
      '<div class="index-label">' + i + '</div>' +
    '</div>';
  });
  rowHtml += '</div>';
  canvas.innerHTML = rowHtml;

  // Sum display
  const sumEl = document.getElementById('sum-display');
  if (sumVal !== null) {
    sumEl.style.display = 'flex';
    var cmpText = '';
    var sumColor = '#f1f5f9';
    if (cmp === 'eq') { cmpText = '= ' + target + ' ✓'; sumColor = '#22c55e'; }
    else if (cmp === 'lt') { cmpText = '< ' + target + ' → left++'; sumColor = '#f97316'; }
    else if (cmp === 'gt') { cmpText = '> ' + target + ' → right--'; sumColor = '#818cf8'; }
    sumEl.innerHTML =
      '<div class="sum-part"><div class="sum-val" style="color:#3b82f6">' + nums[left] + '</div><div class="sum-lbl">nums[L]</div></div>' +
      '<div class="sum-op">+</div>' +
      '<div class="sum-part"><div class="sum-val" style="color:#f97316">' + nums[right] + '</div><div class="sum-lbl">nums[R]</div></div>' +
      '<div class="sum-op">=</div>' +
      '<div class="sum-part"><div class="sum-result" style="color:' + sumColor + '">' + sumVal + '</div><div class="sum-lbl">sum</div></div>' +
      '<div class="sum-cmp ' + cmp + '">' + cmpText + '</div>';
  } else {
    sumEl.style.display = 'none';
  }
}

// ─── Update sidebar ────────────────────────────────────────────────────────
function updateSidebar(snap) {
  const { nums, left, right, target, sumVal, cmp, phase } = snap;
  const tbody = document.querySelector('#ptr-table tbody');

  function ptrVal(idx) {
    return '<span style="color:var(--text)">idx=' + idx + ', val=' + nums[idx] + '</span>';
  }

  var rows = '';
  rows += '<tr><td>left</td><td>' + ptrVal(left) + '</td></tr>';
  rows += '<tr><td>right</td><td>' + ptrVal(right) + '</td></tr>';
  rows += '<tr><td>target</td><td><span style="color:var(--text)">' + target + '</span></td></tr>';
  if (sumVal !== null) {
    var sumColor = cmp === 'eq' ? '#22c55e' : cmp === 'lt' ? '#f97316' : '#818cf8';
    rows += '<tr><td>sum</td><td><span style="color:' + sumColor + '">' + sumVal + '</span></td></tr>';
  }
  tbody.innerHTML = rows;

  var stateEl = document.getElementById('list-state');
  var stateHtml = '<div>Array: [' + nums.join(', ') + ']</div>';
  if (left <= right) {
    stateHtml += '<div style="margin-top:4px">Window: [' + nums.slice(left, right+1).join(', ') + ']</div>';
  }
  if (phase === 'found') {
    stateHtml += '<div style="margin-top:6px;color:var(--green);font-weight:700">Answer: [' + (left+1) + ', ' + (right+1) + '] (1-indexed)</div>';
  }
  stateEl.innerHTML = stateHtml;
}

// ─── Render code panel ─────────────────────────────────────────────────────
function renderCode(activeLine) {
  var pre = document.getElementById('code-pre');
  pre.innerHTML = CODE_LINES.map(function(l) {
    var cls = l.n === activeLine ? 'code-line active' : 'code-line';
    return '<span class="' + cls + '">' + (l.t || ' ') + '</span>';
  }).join('');
  var active = pre.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ─── Phase label map ───────────────────────────────────────────────────────
const PHASE_LABELS = { init: 'Init', search: 'Searching', found: 'Found' };

// ─── applyStep ─────────────────────────────────────────────────────────────
function applyStep(snap) {
  var badge = document.getElementById('phase-badge');
  badge.textContent = PHASE_LABELS[snap.phase] || snap.phase;
  if (snap.phase === 'found') {
    badge.style.background = '#14532d40';
    badge.style.color = '#22c55e';
    badge.style.borderColor = '#22c55e';
  } else {
    badge.style.background = '#1e3a5f';
    badge.style.color = 'var(--blue)';
    badge.style.borderColor = 'var(--blue)';
  }
  document.getElementById('desc').textContent = snap.description;
  renderArrayCanvas(snap);
  updateSidebar(snap);
  renderCode(snap.activeLine);
}

function updateStatus(snap, cur, total) {
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.reset();
});

// ─── viz-inputs handlers ───────────────────────────────────────────────────
function getCurrentInputs() {
  var numsStr = document.getElementById('numsInput').value;
  var target = parseInt(document.getElementById('targetInput').value, 10);
  var nums = numsStr.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
  return { nums: nums, target: target };
}

function buildAndRun() {
  var inp = getCurrentInputs();
  if (inp.nums.length < 2 || isNaN(inp.target)) return;
  var snaps = buildSnapshots(inp.nums, inp.target);
  if (window.nav) window.nav.load(snaps);
  document.getElementById('presetSel').value = '';
}

function loadPreset() {
  var val = document.getElementById('presetSel').value;
  if (!val) return;
  var parts = val.split('|');
  document.getElementById('numsInput').value = parts[0];
  document.getElementById('targetInput').value = parts[1];
  buildAndRun();
}

function randomExample() {
  var sizes = [3, 4, 5, 6];
  var n = sizes[Math.floor(Math.random() * sizes.length)];
  var nums = [];
  var cur = Math.floor(Math.random() * 5) - 2;
  for (var i = 0; i < n; i++) {
    cur += Math.floor(Math.random() * 5) + 1;
    nums.push(cur);
  }
  // Pick two valid indices for a guaranteed answer
  var i1 = Math.floor(Math.random() * (n - 1));
  var i2 = i1 + 1 + Math.floor(Math.random() * (n - i1 - 1));
  var target = nums[i1] + nums[i2];
  document.getElementById('numsInput').value = nums.join(',');
  document.getElementById('targetInput').value = target;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ─── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var inp = getCurrentInputs();
  var snaps = buildSnapshots(inp.nums, inp.target);

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });

  window.nav.load(snaps);
});

(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = e.clientX - startX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
