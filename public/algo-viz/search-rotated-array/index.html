<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search in Rotated Sorted Array</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    .viz-area {
      width: 100%;
      max-width: 92%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .main-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }

    @media (max-width: 800px) {
      .main-row { grid-template-columns: 1fr; }
    }

    /* Array */
    #array-container {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      min-height: 110px;
      padding: 16px 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 6px);
      flex-wrap: wrap;
      position: relative;
    }

    .array-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: monospace;
      font-size: 0.85rem;
      position: relative;
    }

    .cell-val {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      border: 2px solid transparent;
      transition: all 0.25s ease;
      background: var(--accent, #7aa2f7);
      color: #fff;
    }

    .cell-val.eliminated {
      background: #2a2a3a;
      color: #555;
      border-color: #333;
    }

    .cell-val.in-range {
      background: var(--accent, #7aa2f7);
      color: #fff;
    }

    .cell-val.sorted-left {
      background: #1a3a5c;
      border-color: #3b82f6;
      color: #93c5fd;
      box-shadow: 0 0 6px rgba(59,130,246,0.25);
    }

    .cell-val.sorted-right {
      background: #2d1b4e;
      border-color: #a855f7;
      color: #d8b4fe;
      box-shadow: 0 0 6px rgba(168,85,247,0.25);
    }

    .cell-val.mid-cell {
      background: var(--orange, #e0af68) !important;
      color: #000 !important;
      border-color: #f59e0b !important;
      box-shadow: 0 0 10px rgba(224,175,104,0.5) !important;
    }

    .cell-val.found-cell {
      background: var(--green, #9ece6a) !important;
      color: #000 !important;
      border-color: #4ade80 !important;
      box-shadow: 0 0 12px rgba(158,206,106,0.55) !important;
    }

    .cell-idx {
      font-size: 0.6rem;
      color: var(--text-dim, #565f89);
    }

    .cell-ptr {
      font-size: 0.6rem;
      font-weight: 700;
      height: 14px;
      display: flex;
      gap: 2px;
    }

    .ptr-l { color: #3b82f6; }
    .ptr-r { color: #a855f7; }
    .ptr-m { color: var(--orange, #e0af68); }

    /* Var panel */
    .var-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 6px);
      padding: 14px 16px;
    }

    .var-item { display: flex; flex-direction: column; gap: 3px; }

    .var-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim, #565f89);
    }

    .var-value {
      font-size: 1rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--text, #c0caf5);
    }

    .var-value.v-l { color: #3b82f6; }
    .var-value.v-r { color: #a855f7; }
    .var-value.v-mid { color: var(--orange, #e0af68); }
    .var-value.v-found { color: var(--green, #9ece6a); }
    .var-value.v-notfound { color: var(--red, #f7768e); }

    /* Status */
    .status-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 6px);
      padding: 12px 16px;
    }

    .status-phase {
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim, #565f89);
    }

    .status-desc {
      font-size: 0.84rem;
      color: var(--text-muted, #a9b1d6);
      line-height: 1.5;
    }

    .status-result {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--green, #9ece6a);
      margin-top: 2px;
    }

    .status-result.not-found { color: var(--red, #f7768e); }

    /* Intuition note */
    .intuition-note {
      font-size: 0.75rem;
      color: var(--text-dim, #565f89);
      padding: 6px 10px;
      background: rgba(122,162,247,0.06);
      border-left: 3px solid var(--accent, #7aa2f7);
      border-radius: 0 4px 4px 0;
      line-height: 1.4;
    }

    /* Code panel */
    .code-panel {
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 6px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .code-header {
      padding: 9px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--text-dim, #565f89);
    }

    .code-body {
      padding: 10px 0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.74rem;
      line-height: 1.75;
      overflow-x: auto;
    }

    .code-line {
      display: flex;
      align-items: stretch;
      border-left: 3px solid transparent;
      padding: 0 14px 0 0;
      white-space: pre;
      transition: background 0.2s, border-color 0.2s;
    }

    .code-line.hl {
      background: rgba(122, 162, 247, 0.12);
      border-left-color: var(--accent, #7aa2f7);
      padding-left: 6px;
    }

    .code-line .ln {
      width: 28px;
      min-width: 28px;
      text-align: right;
      color: #3d4468;
      user-select: none;
      padding-right: 14px;
      font-size: 0.68rem;
    }

    .code-line .code { color: var(--text-muted, #a9b1d6); }
    .kw { color: #bb9af7; }
    .fn { color: #7aa2f7; }
    .cm { color: #565f89; font-style: italic; }
    .num { color: #ff9e64; }
    .op { color: #89dceb; }

    /* Legend */
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 6px);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: var(--text-muted, #a9b1d6);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 2px solid transparent;
    }

    .ld-mid { background: var(--orange, #e0af68); }
    .ld-found { background: var(--green, #9ece6a); }
    .ld-left { background: #1a3a5c; border-color: #3b82f6; }
    .ld-right { background: #2d1b4e; border-color: #a855f7; }
    .ld-elim { background: #2a2a3a; border-color: #333; }

    /* Nav row */
    .nav-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm, 4px);
      color: var(--text);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 7px 13px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-step:hover:not(:disabled) {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-step:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-play {
      background: #15803d;
      border: none;
      border-radius: var(--radius-sm, 4px);
      color: #fff;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 7px 16px;
      transition: background 0.2s;
    }

    .btn-play:hover:not(:disabled) { background: #16a34a; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }

    #speedSel {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm, 4px);
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .page-sub { color: var(--text-dim); font-size: 0.84rem; }
    .step-counter { font-size: 0.78rem; color: var(--text-dim); margin-left: auto; }
  </style>
</head>
<body class="page">
  <div class="page-header">
    <a class="back-link" href="../index.html">← All Algorithms</a>
    <div>
      <div class="page-title">Search in Rotated Sorted Array</div>
      <div class="page-sub">LeetCode #33 · binary search · O(log n) time · O(1) space</div>
    </div>
  </div>

  <div class="controls">
    <div class="field">
      <label for="numsInput">Array (rotated sorted):</label>
      <input type="text" id="numsInput" value="4,5,6,7,0,1,2" />
    </div>
    <div class="field">
      <label for="targetInput">Target:</label>
      <input type="number" id="targetInput" value="0" />
    </div>
    <button class="btn-primary" id="buildBtn">Build &amp; Run</button>
  </div>

  <div class="viz-area">
    <div class="nav-row">
      <button id="prevBtn" class="btn-step">← Prev</button>
      <button id="stepBtn" class="btn-step">Step →</button>
      <button id="playBtn" class="btn-play">Play</button>
      <button id="resetBtn" class="btn-step">↺ Reset</button>
      <select id="speedSel">
        <option value="800">0.5×</option>
        <option value="400" selected>1×</option>
        <option value="200">2×</option>
        <option value="100">4×</option>
      </select>
      <span class="step-counter" id="stepCounter">Step 0 / 0</span>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld-mid"></div>mid</div>
      <div class="legend-item"><div class="legend-dot ld-found"></div>found</div>
      <div class="legend-item"><div class="legend-dot ld-left"></div>sorted left half</div>
      <div class="legend-item"><div class="legend-dot ld-right"></div>sorted right half</div>
      <div class="legend-item"><div class="legend-dot ld-elim"></div>eliminated</div>
    </div>

    <div class="main-row">
      <!-- Left column -->
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="panel-box">
          <div style="font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:10px">Array</div>
          <div id="array-container"></div>
        </div>

        <div class="var-panel">
          <div class="var-item">
            <div class="var-label">l</div>
            <div class="var-value v-l" id="varL">—</div>
          </div>
          <div class="var-item">
            <div class="var-label">r</div>
            <div class="var-value v-r" id="varR">—</div>
          </div>
          <div class="var-item">
            <div class="var-label">mid</div>
            <div class="var-value v-mid" id="varMid">—</div>
          </div>
          <div class="var-item">
            <div class="var-label">nums[mid]</div>
            <div class="var-value" id="varNumMid">—</div>
          </div>
          <div class="var-item">
            <div class="var-label">target</div>
            <div class="var-value" id="varTarget">—</div>
          </div>
          <div class="var-item">
            <div class="var-label">sorted half</div>
            <div class="var-value" id="varSorted">—</div>
          </div>
        </div>

        <div class="status-panel">
          <div class="status-phase" id="phaseLabel">—</div>
          <div class="intuition-note" id="intuitionNote" style="display:none"></div>
          <div class="status-desc" id="stepDesc">Click Build &amp; Run to start.</div>
          <div class="status-result" id="resultMsg" style="display:none"></div>
        </div>
      </div>

      <!-- Right column: code -->
      <div class="code-panel">
        <div class="code-header">Python Solution</div>
        <div class="code-body" id="codeBody"></div>
      </div>
    </div>
  </div>

  <script>
    var nav;

    const CODE = [
      {t: '<span class="kw">def</span> <span class="fn">search</span>(nums, target):',                     raw: 'def search(nums, target):'},
      {t: '    l, r = <span class="num">0</span>, len(nums) - <span class="num">1</span>',               raw: '    l, r = 0, len(nums) - 1'},
      {t: '    <span class="kw">while</span> l &lt;= r:',                                                   raw: '    while l <= r:'},
      {t: '        mid = (l + r) // <span class="num">2</span>',                                           raw: '        mid = (l + r) // 2'},
      {t: '        <span class="kw">if</span> nums[mid] == target:',                                        raw: '        if nums[mid] == target:'},
      {t: '            <span class="kw">return</span> mid',                                                  raw: '            return mid'},
      {t: '        <span class="kw">if</span> nums[l] &lt;= nums[mid]:  <span class="cm"># left half sorted</span>', raw: '        if nums[l] <= nums[mid]:  # left half sorted'},
      {t: '            <span class="kw">if</span> nums[l] &lt;= target &lt; nums[mid]:',                   raw: '            if nums[l] <= target < nums[mid]:'},
      {t: '                r = mid - <span class="num">1</span>',                                           raw: '                r = mid - 1'},
      {t: '            <span class="kw">else</span>:',                                                        raw: '            else:'},
      {t: '                l = mid + <span class="num">1</span>',                                           raw: '                l = mid + 1'},
      {t: '        <span class="kw">else</span>:  <span class="cm"># right half sorted</span>',              raw: '        else:  # right half sorted'},
      {t: '            <span class="kw">if</span> nums[mid] &lt; target &lt;= nums[r]:',                   raw: '            if nums[mid] < target <= nums[r]:'},
      {t: '                l = mid + <span class="num">1</span>',                                           raw: '                l = mid + 1'},
      {t: '            <span class="kw">else</span>:',                                                        raw: '            else:'},
      {t: '                r = mid - <span class="num">1</span>',                                           raw: '                r = mid - 1'},
      {t: '    <span class="kw">return</span> -<span class="num">1</span>',                                    raw: '    return -1'},
    ];

    function buildCodePanel() {
      const body = document.getElementById('codeBody');
      body.innerHTML = CODE.map((c, i) =>
        `<div class="code-line" id="cl-${i}"><span class="ln">${i + 1}</span><span class="code">${c.t}</span></div>`
      ).join('');
    }

    function hlLines(lines) {
      for (let i = 0; i < CODE.length; i++) {
        const el = document.getElementById('cl-' + i);
        el.classList.toggle('hl', lines.includes(i));
      }
    }

    function simulate(nums, target) {
      const steps = [];

      steps.push({
        phase: 'Initialize',
        desc: `Set l = 0, r = ${nums.length - 1}. Array has ${nums.length} elements.`,
        intuition: 'Key insight: one half of a rotated array is always sorted. We use this to decide which half to search.',
        l: 0, r: nums.length - 1, mid: null,
        sortedHalf: null, decision: null,
        result: null, lines: [0, 1]
      });

      let l = 0, r = nums.length - 1;

      while (l <= r) {
        const mid = Math.floor((l + r) / 2);
        const numsMid = nums[mid];

        steps.push({
          phase: 'Compute Mid',
          desc: `mid = (${l} + ${r}) // 2 = ${mid}. nums[mid] = ${numsMid}. Check if target ${target} found.`,
          intuition: null,
          l, r, mid,
          sortedHalf: null, decision: null,
          result: null, lines: [2, 3, 4]
        });

        if (numsMid === target) {
          steps.push({
            phase: 'Found!',
            desc: `nums[${mid}] = ${numsMid} equals target ${target}. Return index ${mid}.`,
            intuition: null,
            l, r, mid,
            sortedHalf: null, decision: 'found',
            result: mid, lines: [4, 5]
          });
          break;
        }

        const leftSorted = nums[l] <= numsMid;
        const sortedHalf = leftSorted ? 'left' : 'right';

        if (leftSorted) {
          // left half [l..mid] is sorted
          const inLeftRange = nums[l] <= target && target < numsMid;
          if (inLeftRange) {
            steps.push({
              phase: 'Left Sorted → Go Left',
              desc: `nums[${l}]=${nums[l]} ≤ nums[${mid}]=${numsMid} → left half [${l}..${mid}] is sorted. ` +
                    `${nums[l]} ≤ ${target} < ${numsMid} ✓ → target is in left half. Set r = ${mid} - 1 = ${mid - 1}.`,
              intuition: `Left half is sorted, and target ${target} falls in [${nums[l]}, ${numsMid - 1}] → safe to go left.`,
              l, r, mid,
              sortedHalf, decision: 'go-left',
              result: null, lines: [6, 7, 8]
            });
            r = mid - 1;
          } else {
            steps.push({
              phase: 'Left Sorted → Go Right',
              desc: `nums[${l}]=${nums[l]} ≤ nums[${mid}]=${numsMid} → left half sorted. ` +
                    `${target} not in [${nums[l]}, ${numsMid - 1}] → target must be right. Set l = ${mid} + 1 = ${mid + 1}.`,
              intuition: `Left half is sorted but target ${target} isn't in it → it must be in the right half.`,
              l, r, mid,
              sortedHalf, decision: 'go-right',
              result: null, lines: [6, 7, 9, 10]
            });
            l = mid + 1;
          }
        } else {
          // right half [mid..r] is sorted
          const inRightRange = numsMid < target && target <= nums[r];
          if (inRightRange) {
            steps.push({
              phase: 'Right Sorted → Go Right',
              desc: `nums[${l}]=${nums[l]} > nums[${mid}]=${numsMid} → right half [${mid}..${r}] is sorted. ` +
                    `${numsMid} < ${target} ≤ ${nums[r]} ✓ → target is in right half. Set l = ${mid} + 1 = ${mid + 1}.`,
              intuition: `Right half is sorted, and target ${target} falls in (${numsMid}, ${nums[r]}] → safe to go right.`,
              l, r, mid,
              sortedHalf, decision: 'go-right',
              result: null, lines: [11, 12, 13]
            });
            l = mid + 1;
          } else {
            steps.push({
              phase: 'Right Sorted → Go Left',
              desc: `nums[${l}]=${nums[l]} > nums[${mid}]=${numsMid} → right half sorted. ` +
                    `${target} not in (${numsMid}, ${nums[r]}] → target must be left. Set r = ${mid} - 1 = ${mid - 1}.`,
              intuition: `Right half is sorted but target ${target} isn't in it → it must be in the left half.`,
              l, r, mid,
              sortedHalf, decision: 'go-left',
              result: null, lines: [11, 12, 14, 15]
            });
            r = mid - 1;
          }
        }
      }

      if (!steps[steps.length - 1].result && steps[steps.length - 1].phase !== 'Found!') {
        steps.push({
          phase: 'Not Found',
          desc: `l = ${l} > r = ${r}. Search space exhausted. Target ${target} not in array. Return -1.`,
          intuition: null,
          l, r, mid: null,
          sortedHalf: null, decision: 'not-found',
          result: -1, lines: [2, 16]
        });
      }

      return steps.map(s => ({ ...s, nums, target }));
    }

    function applyStep(snap, _animate) {
      const { nums, target, l, r, mid, sortedHalf, decision, result, phase, desc, intuition, lines } = snap;

      hlLines(lines);

      document.getElementById('varL').textContent = l !== null && l !== undefined ? l : '—';
      document.getElementById('varR').textContent = r !== null && r !== undefined ? r : '—';
      document.getElementById('varMid').textContent = mid !== null && mid !== undefined ? mid : '—';
      document.getElementById('varNumMid').textContent = mid !== null && mid !== undefined ? nums[mid] : '—';
      document.getElementById('varTarget').textContent = target;
      document.getElementById('varSorted').textContent = sortedHalf ? sortedHalf : '—';

      // Render array
      const container = document.getElementById('array-container');
      container.innerHTML = '';
      for (let i = 0; i < nums.length; i++) {
        const cellDiv = document.createElement('div');
        cellDiv.className = 'array-cell';

        const val = document.createElement('div');
        val.className = 'cell-val';
        val.textContent = nums[i];

        if (decision === 'found' && i === mid) {
          val.classList.add('found-cell');
        } else if (i === mid) {
          val.classList.add('mid-cell');
        } else if (l !== null && r !== null && (i < l || i > r)) {
          val.classList.add('eliminated');
        } else if (sortedHalf === 'left' && mid !== null && i >= l && i <= mid) {
          val.classList.add('sorted-left');
        } else if (sortedHalf === 'right' && mid !== null && i >= mid && i <= r) {
          val.classList.add('sorted-right');
        } else {
          val.classList.add('in-range');
        }

        cellDiv.appendChild(val);

        const idx = document.createElement('div');
        idx.className = 'cell-idx';
        idx.textContent = '[' + i + ']';
        cellDiv.appendChild(idx);

        // Pointer labels below index
        const ptrs = [];
        if (i === l && l !== null) ptrs.push('<span class="ptr-l">L</span>');
        if (i === r && r !== null) ptrs.push('<span class="ptr-r">R</span>');
        if (i === mid && mid !== null) ptrs.push('<span class="ptr-m">M</span>');
        const ptrDiv = document.createElement('div');
        ptrDiv.className = 'cell-ptr';
        ptrDiv.innerHTML = ptrs.join('');
        cellDiv.appendChild(ptrDiv);

        container.appendChild(cellDiv);
      }

      // Status
      document.getElementById('phaseLabel').textContent = phase;
      document.getElementById('stepDesc').textContent = desc;

      const noteEl = document.getElementById('intuitionNote');
      if (intuition) {
        noteEl.textContent = intuition;
        noteEl.style.display = '';
      } else {
        noteEl.style.display = 'none';
      }

      const resEl = document.getElementById('resultMsg');
      if (result !== null && result !== undefined) {
        resEl.style.display = '';
        if (result >= 0) {
          resEl.className = 'status-result';
          resEl.textContent = '✓ Found at index ' + result;
        } else {
          resEl.className = 'status-result not-found';
          resEl.textContent = '✗ Not found (return -1)';
        }
      } else {
        resEl.style.display = 'none';
      }
    }

    function updateStatus(snap, cur, total) {
      document.getElementById('stepCounter').textContent = 'Step ' + cur + ' / ' + (total - 1);
    }

    function buildAndRun() {
      const numsStr = document.getElementById('numsInput').value;
      const targetVal = parseInt(document.getElementById('targetInput').value);
      const nums = numsStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
      if (!nums.length || isNaN(targetVal)) { alert('Invalid input.'); return; }
      const steps = simulate(nums, targetVal);
      nav.load(steps);
    }

    window.addEventListener('DOMContentLoaded', function () {
      buildCodePanel();

      nav = VizNav({
        btnPrev: document.getElementById('prevBtn'),
        btnNext: document.getElementById('stepBtn'),
        btnPlay: document.getElementById('playBtn'),
        speedSel: document.getElementById('speedSel'),
        render: function (snap, cur, total) { applyStep(snap, cur > 0); updateStatus(snap, cur, total); }
      });

      document.getElementById('resetBtn').addEventListener('click', function () { nav.reset(); });
      document.getElementById('buildBtn').addEventListener('click', buildAndRun);

      buildAndRun();

      if (window.self !== window.top) {
        const bl = document.querySelector('.back-link');
        if (bl) bl.style.display = 'none';
      }
    });
  </script>
</body>
</html>
