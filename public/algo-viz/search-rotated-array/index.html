<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search Rotated Array</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px 20px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 600px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(var(--accent-ch),0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); } .var-val { color: var(--accent); font-weight: 700; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* UNIQUE VIZ CSS */
  .array-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: monospace; font-size: 0.85rem; position: relative; }
  .cell-val { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 700; font-size: 1rem; border: 2px solid transparent; transition: all 0.25s ease; background: var(--accent); color: #fff; }
  .cell-val.eliminated { background: #2a2a3a; color: #555; border-color: #333; }
  .cell-val.in-range { background: var(--accent); color: #fff; }
  .cell-val.sorted-left { background: #1a3a5c; border-color: #3b82f6; color: #93c5fd; box-shadow: 0 0 6px rgba(59,130,246,0.25); }
  .cell-val.sorted-right { background: #2d1b4e; border-color: #a855f7; color: #d8b4fe; box-shadow: 0 0 6px rgba(168,85,247,0.25); }
  .cell-val.mid-cell { background: var(--orange) !important; color: #000 !important; border-color: #f59e0b !important; box-shadow: 0 0 10px rgba(var(--yellow-ch),0.5) !important; }
  .cell-val.found-cell { background: var(--green) !important; color: #000 !important; border-color: #4ade80 !important; box-shadow: 0 0 12px rgba(var(--green-ch),0.55) !important; }
  .cell-idx { font-size: 0.6rem; color: var(--text-dim); }
  .cell-ptr { font-size: 0.6rem; font-weight: 700; height: 14px; display: flex; gap: 2px; }
  .ptr-l { color: #3b82f6; } .ptr-r { color: #a855f7; } .ptr-m { color: var(--orange); }
  .var-value { font-size: 1rem; font-weight: 700; font-family: monospace; color: var(--text); }
  .var-value.v-l { color: #3b82f6; } .var-value.v-r { color: #a855f7; }
  .var-value.v-mid { color: var(--orange); } .var-value.v-found { color: var(--green); }
  .var-value.v-notfound { color: var(--red); }
  .var-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .status-result { font-size: 0.9rem; font-weight: 700; color: var(--green); }
  .status-result.not-found { color: var(--red); }
  .intuition-note { font-size: 0.75rem; color: var(--text-dim); padding: 6px 10px; background: rgba(var(--accent-ch),0.06); border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; line-height: 1.4; max-width: 560px; width: 100%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; width: 100%; max-width: 600px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--text-muted); }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 2px solid transparent; }
  .ld-mid { background: var(--orange); } .ld-found { background: var(--green); }
  .ld-left { background: #1a3a5c; border-color: #3b82f6; } .ld-right { background: #2d1b4e; border-color: #a855f7; }
  .ld-elim { background: #2a2a3a; border-color: #333; }
  #array-container { display: flex; gap: 6px; align-items: flex-start; min-height: 110px; padding: 16px 20px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; flex-wrap: wrap; width: 100%; max-width: 600px; }
  .fn { color: #7aa2f7; } .num { color: #ff9e64; } .op { color: #89dceb; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column">
    <label for="presetSel">Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"nums":"4,5,6,7,0,1,2","target":"0"}'>Find 0 in rotated array</option>
      <option value='{"nums":"4,5,6,7,0,1,2","target":"4"}'>Find 4 (left half)</option>
      <option value='{"nums":"4,5,6,7,0,1,2","target":"1"}'>Find 1 (right half)</option>
      <option value='{"nums":"1,3,5,7,9","target":"5"}'>No rotation (sorted)</option>
      <option value='{"nums":"3","target":"3"}'>Single element (found)</option>
      <option value='{"nums":"3","target":"1"}'>Single element (not found)</option>
      <option value='{"nums":"1,3","target":"3"}'>Two elements (right)</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column">
    <label for="numsInput">Array (rotated sorted):</label>
    <input type="text" id="numsInput" value="4,5,6,7,0,1,2" style="width:180px" />
  </div>
  <div style="display:flex;flex-direction:column">
    <label for="targetInput">Target:</label>
    <input type="number" id="targetInput" value="0" style="width:80px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Search Rotated Array</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld-mid"></div>mid</div>
      <div class="legend-item"><div class="legend-dot ld-found"></div>found</div>
      <div class="legend-item"><div class="legend-dot ld-left"></div>sorted left half</div>
      <div class="legend-item"><div class="legend-dot ld-right"></div>sorted right half</div>
      <div class="legend-item"><div class="legend-dot ld-elim"></div>eliminated</div>
    </div>
    <div id="array-container"></div>
    <div id="intuitionNote" class="intuition-note" style="display:none"></div>
    <div id="resultMsg" class="status-result" style="display:none"></div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:8px;">Code</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Variables</div>
      <div class="var-item"><span class="var-key">l &nbsp;&nbsp;&nbsp;</span> <span class="var-val v-l" id="varL">—</span></div>
      <div class="var-item"><span class="var-key">r &nbsp;&nbsp;&nbsp;</span> <span class="var-val v-r" id="varR">—</span></div>
      <div class="var-item"><span class="var-key">mid &nbsp;</span> <span class="var-val v-mid" id="varMid">—</span></div>
      <div class="var-item"><span class="var-key">nums[m]</span> <span class="var-val" id="varNumMid">—</span></div>
      <div class="var-item"><span class="var-key">target </span> <span class="var-val" id="varTarget">—</span></div>
      <div class="var-item"><span class="var-key">sorted </span> <span class="var-val" id="varSorted">—</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var CODE = [
  {t: '<span class="kw">def</span> <span class="fn">search</span>(nums, target):'},
  {t: '    l, r = <span class="num">0</span>, len(nums) - <span class="num">1</span>'},
  {t: '    <span class="kw">while</span> l &lt;= r:'},
  {t: '        mid = (l + r) // <span class="num">2</span>'},
  {t: '        <span class="kw">if</span> nums[mid] == target:'},
  {t: '            <span class="kw">return</span> mid'},
  {t: '        <span class="kw">if</span> nums[l] &lt;= nums[mid]:  <span class="cm"># left half sorted</span>'},
  {t: '            <span class="kw">if</span> nums[l] &lt;= target &lt; nums[mid]:'},
  {t: '                r = mid - <span class="num">1</span>'},
  {t: '            <span class="kw">else</span>:'},
  {t: '                l = mid + <span class="num">1</span>'},
  {t: '        <span class="kw">else</span>:  <span class="cm"># right half sorted</span>'},
  {t: '            <span class="kw">if</span> nums[mid] &lt; target &lt;= nums[r]:'},
  {t: '                l = mid + <span class="num">1</span>'},
  {t: '            <span class="kw">else</span>:'},
  {t: '                r = mid - <span class="num">1</span>'},
  {t: '    <span class="kw">return</span> -<span class="num">1</span>'},
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE.forEach(function(c, i) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + i;
    el.innerHTML = '<span class="ln">' + (i + 1) + '</span>' + c.t;
    body.appendChild(el);
  });
}

function hlLines(lines) {
  for (var i = 0; i < CODE.length; i++) {
    var el = document.getElementById('cl-' + i);
    if (el) el.classList.toggle('hl', lines.includes(i));
  }
}

function simulate(nums, target) {
  var steps = [];
  steps.push({
    phase: 'Initialize', desc: 'Set l = 0, r = ' + (nums.length - 1) + '. Array has ' + nums.length + ' elements.',
    intuition: 'Key insight: one half of a rotated array is always sorted. We use this to decide which half to search.',
    l: 0, r: nums.length - 1, mid: null, sortedHalf: null, decision: null, result: null, lines: [0, 1]
  });
  var l = 0, r = nums.length - 1;
  while (l <= r) {
    var mid = Math.floor((l + r) / 2);
    var numsMid = nums[mid];
    steps.push({
      phase: 'Compute Mid', desc: 'mid = (' + l + ' + ' + r + ') // 2 = ' + mid + '. nums[mid] = ' + numsMid + '. Check if target ' + target + ' found.',
      intuition: null, l: l, r: r, mid: mid, sortedHalf: null, decision: null, result: null, lines: [2, 3, 4]
    });
    if (numsMid === target) {
      steps.push({
        phase: 'Found!', desc: 'nums[' + mid + '] = ' + numsMid + ' equals target ' + target + '. Return index ' + mid + '.',
        intuition: null, l: l, r: r, mid: mid, sortedHalf: null, decision: 'found', result: mid, lines: [4, 5]
      });
      break;
    }
    var leftSorted = nums[l] <= numsMid;
    var sortedHalf = leftSorted ? 'left' : 'right';
    if (leftSorted) {
      var inLeftRange = nums[l] <= target && target < numsMid;
      if (inLeftRange) {
        steps.push({ phase: 'Left Sorted → Go Left',
          desc: 'nums[' + l + ']=' + nums[l] + ' ≤ nums[' + mid + ']=' + numsMid + ' → left half sorted. ' + nums[l] + ' ≤ ' + target + ' < ' + numsMid + ' ✓ → Set r = ' + (mid - 1) + '.',
          intuition: 'Left half is sorted, target ' + target + ' falls in [' + nums[l] + ', ' + (numsMid - 1) + '] → go left.',
          l: l, r: r, mid: mid, sortedHalf: sortedHalf, decision: 'go-left', result: null, lines: [6, 7, 8] });
        r = mid - 1;
      } else {
        steps.push({ phase: 'Left Sorted → Go Right',
          desc: 'nums[' + l + ']=' + nums[l] + ' ≤ nums[' + mid + ']=' + numsMid + ' → left sorted. ' + target + ' not in [' + nums[l] + ', ' + (numsMid - 1) + '] → Set l = ' + (mid + 1) + '.',
          intuition: 'Left half is sorted but target ' + target + " isn't in it → must be right.",
          l: l, r: r, mid: mid, sortedHalf: sortedHalf, decision: 'go-right', result: null, lines: [6, 7, 9, 10] });
        l = mid + 1;
      }
    } else {
      var inRightRange = numsMid < target && target <= nums[r];
      if (inRightRange) {
        steps.push({ phase: 'Right Sorted → Go Right',
          desc: 'nums[' + l + ']=' + nums[l] + ' > nums[' + mid + ']=' + numsMid + ' → right sorted. ' + numsMid + ' < ' + target + ' ≤ ' + nums[r] + ' ✓ → Set l = ' + (mid + 1) + '.',
          intuition: 'Right half is sorted, target ' + target + ' falls in (' + numsMid + ', ' + nums[r] + '] → go right.',
          l: l, r: r, mid: mid, sortedHalf: sortedHalf, decision: 'go-right', result: null, lines: [11, 12, 13] });
        l = mid + 1;
      } else {
        steps.push({ phase: 'Right Sorted → Go Left',
          desc: 'nums[' + l + ']=' + nums[l] + ' > nums[' + mid + ']=' + numsMid + ' → right sorted. ' + target + ' not in (' + numsMid + ', ' + nums[r] + '] → Set r = ' + (mid - 1) + '.',
          intuition: 'Right half is sorted but target ' + target + " isn't in it → must be left.",
          l: l, r: r, mid: mid, sortedHalf: sortedHalf, decision: 'go-left', result: null, lines: [11, 12, 14, 15] });
        r = mid - 1;
      }
    }
  }
  var last = steps[steps.length - 1];
  if (!last.result && last.phase !== 'Found!') {
    steps.push({
      phase: 'Not Found', desc: 'l = ' + l + ' > r = ' + r + '. Search space exhausted. Return -1.',
      intuition: null, l: l, r: r, mid: null, sortedHalf: null, decision: 'not-found', result: -1, lines: [2, 16]
    });
  }
  return steps.map(function(s) { return Object.assign({}, s, { nums: nums, target: target }); });
}

function applyStep(snap) {
  var nums = snap.nums, target = snap.target, l = snap.l, r = snap.r, mid = snap.mid;
  var sortedHalf = snap.sortedHalf, decision = snap.decision, result = snap.result;
  var intuition = snap.intuition;

  hlLines(snap.lines);

  document.getElementById('varL').textContent = l !== null && l !== undefined ? l : '—';
  document.getElementById('varR').textContent = r !== null && r !== undefined ? r : '—';
  document.getElementById('varMid').textContent = mid !== null && mid !== undefined ? mid : '—';
  document.getElementById('varNumMid').textContent = mid !== null && mid !== undefined ? nums[mid] : '—';
  document.getElementById('varTarget').textContent = target;
  document.getElementById('varSorted').textContent = sortedHalf ? sortedHalf : '—';

  var container = document.getElementById('array-container');
  container.innerHTML = '';
  for (var i = 0; i < nums.length; i++) {
    var cellDiv = document.createElement('div');
    cellDiv.className = 'array-cell';
    var val = document.createElement('div');
    val.className = 'cell-val';
    val.textContent = nums[i];
    if (decision === 'found' && i === mid) val.classList.add('found-cell');
    else if (i === mid) val.classList.add('mid-cell');
    else if (l !== null && r !== null && (i < l || i > r)) val.classList.add('eliminated');
    else if (sortedHalf === 'left' && mid !== null && i >= l && i <= mid) val.classList.add('sorted-left');
    else if (sortedHalf === 'right' && mid !== null && i >= mid && i <= r) val.classList.add('sorted-right');
    else val.classList.add('in-range');
    cellDiv.appendChild(val);
    var idx = document.createElement('div');
    idx.className = 'cell-idx';
    idx.textContent = '[' + i + ']';
    cellDiv.appendChild(idx);
    var ptrs = [];
    if (i === l && l !== null) ptrs.push('<span class="ptr-l">L</span>');
    if (i === r && r !== null) ptrs.push('<span class="ptr-r">R</span>');
    if (i === mid && mid !== null) ptrs.push('<span class="ptr-m">M</span>');
    var ptrDiv = document.createElement('div');
    ptrDiv.className = 'cell-ptr';
    ptrDiv.innerHTML = ptrs.join('');
    cellDiv.appendChild(ptrDiv);
    container.appendChild(cellDiv);
  }

  var noteEl = document.getElementById('intuitionNote');
  if (intuition) { noteEl.textContent = intuition; noteEl.style.display = ''; }
  else { noteEl.style.display = 'none'; }

  var resEl = document.getElementById('resultMsg');
  if (result !== null && result !== undefined) {
    resEl.style.display = '';
    if (result >= 0) { resEl.className = 'status-result'; resEl.textContent = '✓ Found at index ' + result; }
    else { resEl.className = 'status-result not-found'; resEl.textContent = '✗ Not found (return -1)'; }
  } else { resEl.style.display = 'none'; }
}

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || '';
  document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
  document.getElementById('desc').textContent = snap.desc || '';
}

function buildAndRun() {
  var numsStr = document.getElementById('numsInput').value;
  var targetVal = parseInt(document.getElementById('targetInput').value);
  var nums = numsStr.split(',').map(function(s) { return parseInt(s.trim()); }).filter(function(n) { return !isNaN(n); });
  if (!nums.length || isNaN(targetVal)) { alert('Invalid input.'); return; }
  var steps = simulate(nums, targetVal);
  window.nav.load(steps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('numsInput').value = d.nums;
  document.getElementById('targetInput').value = d.target;
  buildAndRun();
}

function randomExample() {
  var size = Math.floor(Math.random() * 5) + 3;
  var arr = [];
  for (var i = 0; i < size; i++) arr.push(Math.floor(Math.random() * 100));
  arr.sort(function(a, b) { return a - b; });
  var rotIdx = Math.floor(Math.random() * arr.length);
  var rotated = arr.slice(rotIdx).concat(arr.slice(0, rotIdx));
  var target = rotated[Math.floor(Math.random() * rotated.length)];
  document.getElementById('numsInput').value = rotated.join(',');
  document.getElementById('targetInput').value = target;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  window.nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) { applyStep(snap); updateStatus(snap, cur, total); }
  });
  document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });
  buildAndRun();
});

(function() {
  var handle = document.getElementById('resize-handle');
  var panel = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
