<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimum Window Substring</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Fira Code', 'Cascadia Code', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .viz-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); display: block; margin-bottom: 3px; }
  .viz-inputs input, .viz-inputs select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; font-family: inherit; }
  .viz-inputs button { padding: 7px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.85rem; border: 1px solid var(--border); }
  .btn-run { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-rand { background: #1e293b; color: var(--text); }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 4px; background: #1e3a5f; color: #3b82f6; border: 1px solid #3b82f6; transition: background .3s, color .3s, border-color .3s; }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 18px; overflow: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 620px; min-height: 36px; line-height: 1.5; }

  #need-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .need-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-right: 4px; }
  .need-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; border: 1.5px solid #475569; background: #1e293b; color: #94a3b8; display: flex; gap: 6px; align-items: center; transition: border-color .25s, background .25s, color .25s; }
  .need-pill.satisfied { border-color: #22c55e; background: #14532d40; color: #4ade80; }
  .need-pill.partial { border-color: #f59e0b; background: #451a0330; color: #fbbf24; }

  #string-area { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; width: 100%; max-width: 820px; }
  .str-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
  #char-row { display: flex; flex-wrap: wrap; gap: 5px; }

  .char-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .char-box {
    width: 40px; height: 40px; border-radius: 7px;
    background: #1e293b; border: 2px solid #334155;
    color: #f1f5f9; font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .char-box.in-window { border-color: #3b82f6; box-shadow: 0 0 0 2px #3b82f620; }
  .char-box.at-left { border-color: #22c55e; box-shadow: 0 0 0 3px #22c55e30; }
  .char-box.at-right { border-color: #f97316; box-shadow: 0 0 0 3px #f9731630; }
  .char-box.at-both { border-color: #a855f7; box-shadow: 0 0 0 3px #a855f730; }
  .char-box.needed-sat { background: #14532d40; }
  .char-box.needed-part { background: #451a0330; }
  .char-box.in-best { background: #1e1b4b; border-color: #8b5cf6; box-shadow: 0 0 0 3px #8b5cf630; }
  .char-idx { font-size: 9px; color: var(--text-dim); }
  .ptr-badges { display: flex; gap: 2px; min-height: 14px; }
  .ptr-b { font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
  .ptr-l { background: #14532d40; color: #22c55e; border: 1px solid #22c55e; }
  .ptr-r { background: #431407; color: #f97316; border: 1px solid #f97316; }
  .ptr-lr { background: #2e1065; color: #a855f7; border: 1px solid #a855f7; }

  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .ptr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptr-table td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
  .ptr-table td:first-child { color: var(--text-muted); }
  .ptr-table td:last-child { color: var(--text); font-weight: 600; }
  .wc-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .wc-pill { font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #64748b; }
  .wc-pill.sat { border-color: #22c55e; color: #4ade80; background: #14532d40; }
  .wc-pill.part { border-color: #f59e0b; color: #fbbf24; background: #451a0330; }

  #code-panel {
    width: 220px;
    min-width: 120px;
    max-width: 560px;
    overflow-x: auto;
    flex-shrink: 0;
    background: #0d1117;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
  }
  .code-panel-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  pre { font-size: 11px; line-height: 1.7; font-family: inherit; }
  .code-line { padding: 0 4px; border-radius: 3px; display: block; transition: background .2s; white-space: pre; }
  .code-line.active { background: #1d2d44; color: #fbbf24; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .cm { color: #546e7a; font-style: italic; }
  .str { color: #c3e88d; } .num { color: #f78c6c; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { opacity: .9; }
  select { padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  #resize-handle { width:5px; flex-shrink:0; cursor:col-resize; background:transparent; border-right:1px solid var(--border); transition:background .15s; z-index:10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value="ADOBECODEBANC|ABC">ADOBECODEBANC / ABC</option>
      <option value="a|a">a / a</option>
      <option value="a|aa">a / aa (impossible)</option>
      <option value="AAAABC|ABC">AAAABC / ABC</option>
      <option value="aa|aa">aa / aa</option>
    </select>
  </div>
  <div>
    <label>s</label>
    <input type="text" id="inputS" value="ADOBECODEBANC" style="width:180px;" />
  </div>
  <div>
    <label>t</label>
    <input type="text" id="inputT" value="ABC" style="width:80px;" />
  </div>
  <button class="btn-run" onclick="buildAndRun()">Run</button>
  <button class="btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>

<div id="header">
  <span id="phase-badge">Expand</span>
  <span style="font-size:13px;font-weight:700;">Minimum Window Substring</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <pre id="code-pre"></pre>
  </div>
  <div id="resize-handle"></div>
  <div id="viz-area">
    <div id="desc">Initializing...</div>
    <div id="need-row"></div>
    <div id="string-area">
      <div class="str-label">s</div>
      <div id="char-row"></div>
    </div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Pointers</div>
      <table class="ptr-table" id="ptr-table"><tbody></tbody></table>
    </div>
    <div>
      <div class="sidebar-title">Window Counts</div>
      <div class="wc-pills" id="window-counts"></div>
    </div>
    <div>
      <div class="sidebar-title">Best Result</div>
      <div id="result-info" style="font-size:11px;color:var(--text-muted);line-height:1.6;"></div>
    </div>
  </div>
</div>


<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8634; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
const CODE_LINES = [
  { n:  1, t: '<span class="kw">def</span> <span class="fn">minWindow</span>(s, t):' },
  { n:  2, t: '    need = Counter(t)' },
  { n:  3, t: '    have, want = <span class="num">0</span>, len(need)' },
  { n:  4, t: '    window = {}' },
  { n:  5, t: '    res, resLen = [-<span class="num">1</span>, -<span class="num">1</span>], float(<span class="str">"inf"</span>)' },
  { n:  6, t: '    left = <span class="num">0</span>' },
  { n:  7, t: '    <span class="kw">for</span> right <span class="kw">in</span> range(len(s)):' },
  { n:  8, t: '        c = s[right]' },
  { n:  9, t: '        window[c] = window.get(c, <span class="num">0</span>) + <span class="num">1</span>' },
  { n: 10, t: '        <span class="kw">if</span> c <span class="kw">in</span> need <span class="kw">and</span> window[c] == need[c]:' },
  { n: 11, t: '            have += <span class="num">1</span>' },
  { n: 12, t: '        <span class="kw">while</span> have == want:' },
  { n: 13, t: '            <span class="kw">if</span> right - left + <span class="num">1</span> < resLen:' },
  { n: 14, t: '                resLen = right - left + <span class="num">1</span>' },
  { n: 15, t: '                res = [left, right]' },
  { n: 16, t: '            window[s[left]] -= <span class="num">1</span>' },
  { n: 17, t: '            <span class="kw">if</span> s[left] <span class="kw">in</span> need <span class="kw">and</span> window[s[left]] < need[s[left]]:' },
  { n: 18, t: '                have -= <span class="num">1</span>' },
  { n: 19, t: '            left += <span class="num">1</span>' },
  { n: 20, t: '    l, r = res' },
  { n: 21, t: '    <span class="kw">return</span> s[l : r+<span class="num">1</span>] <span class="kw">if</span> resLen != float(<span class="str">"inf"</span>) <span class="kw">else</span> <span class="str">""</span>' },
];

// ─── buildSnapshots ────────────────────────────────────────────────────────
function buildSnapshots(s, t) {
  const snaps = [];

  // Build need map
  const need = {};
  for (const c of t) need[c] = (need[c] || 0) + 1;
  const want = Object.keys(need).length;

  let win = {};
  let have = 0;
  let left = 0;
  let resLeft = -1, resRight = -1, resLen = Infinity;

  function mkSnap(phase, description, active_line, right) {
    return {
      phase, description, active_line,
      s, t,
      need: Object.assign({}, need),
      left, right,
      window: Object.assign({}, win),
      have, want,
      best: resLen === Infinity ? null : {
        left: resLeft, right: resRight,
        sub: s.slice(resLeft, resRight + 1)
      }
    };
  }

  // Initial snap
  const needStr = Object.entries(need).map(function(e) { return e[0] + ':' + e[1]; }).join(', ');
  snaps.push(mkSnap('expand',
    'Initialize: need={' + needStr + '}, want=' + want + '. left=0, have=0/' + want + '. Start expanding right pointer through s.',
    3, -1));

  for (let right = 0; right < s.length; right++) {
    const c = s[right];
    win[c] = (win[c] || 0) + 1;
    const haveChanged = !!(need[c] && win[c] === need[c]);
    if (haveChanged) have++;

    snaps.push(mkSnap('expand',
      'Expand right=' + right + ': add s[' + right + ']=' + JSON.stringify(c) + '. window[' + JSON.stringify(c) + ']=' + win[c] + '. ' +
        (haveChanged
          ? JSON.stringify(c) + ' count satisfied (' + win[c] + '/' + need[c] + ') → have=' + have + '/' + want + '.'
          : 'have=' + have + '/' + want + '.'),
      haveChanged ? 11 : 9, right));

    while (have === want) {
      const winLen = right - left + 1;
      const winSub = s.slice(left, right + 1);
      const isBest = winLen < resLen;
      if (isBest) {
        resLen = winLen;
        resLeft = left;
        resRight = right;
      }

      snaps.push(mkSnap('shrink',
        'have=' + have + '=want. Window "' + winSub + '" (len=' + winLen + '). ' +
          (isBest
            ? 'New best! Record res=[' + left + ',' + right + '] "' + winSub + '".'
            : 'Not better than "' + s.slice(resLeft, resRight + 1) + '" (len=' + resLen + ').'),
        isBest ? 14 : 13, right));

      const lc = s[left];
      win[lc]--;
      const haveDrop = !!(need[lc] && win[lc] < need[lc]);
      if (haveDrop) have--;
      left++;

      snaps.push(mkSnap(have === want ? 'shrink' : 'expand',
        'Shrink: remove s[' + (left - 1) + ']=' + JSON.stringify(lc) + '. window[' + JSON.stringify(lc) + ']=' + win[lc] + '. ' +
          (haveDrop
            ? JSON.stringify(lc) + ' count dropped below need → have=' + have + '/' + want + '. Exit shrink loop.'
            : 'have=' + have + '/' + want + '. Continue shrinking.'),
        haveDrop ? 18 : 16, right));
    }
  }

  const finalSub = resLen === Infinity ? '""' : '"' + s.slice(resLeft, resRight + 1) + '"';
  snaps.push(mkSnap('done',
    'Done! Minimum window: ' + finalSub +
      (resLen !== Infinity ? ' (len=' + resLen + ', indices [' + resLeft + ',' + resRight + ']).' : ' — no valid window found.'),
    21, s.length - 1));

  return snaps;
}

// ─── Render helpers ────────────────────────────────────────────────────────
function renderNeedRow(snap) {
  const { need, window: win } = snap;
  let html = '<span class="need-label">t needs:</span>';
  const entries = Object.entries(need);
  for (let i = 0; i < entries.length; i++) {
    const ch = entries[i][0], cnt = entries[i][1];
    const got = win[ch] || 0;
    const cls = got >= cnt ? 'need-pill satisfied' : (got > 0 ? 'need-pill partial' : 'need-pill');
    html += '<div class="' + cls + '"><span>' + ch + '</span><span style="font-size:10px;opacity:.8">' + got + '/' + cnt + '</span></div>';
  }
  document.getElementById('need-row').innerHTML = html;
}

function renderCharRow(snap) {
  const { s, left, right, best, phase, need, window: win } = snap;
  let html = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const inWindow = right >= 0 && i >= left && i <= right;
    const isLeft = right >= 0 && i === left;
    const isRight = right >= 0 && i === right;
    const isNeeded = need[ch] !== undefined;
    const got = win[ch] || 0;
    const needCnt = need[ch] || 0;

    let cls = 'char-box';
    if (phase === 'done' && best && i >= best.left && i <= best.right) {
      cls += ' in-best';
    } else {
      if (inWindow) cls += ' in-window';
      if (isLeft && isRight) cls += ' at-both';
      else if (isLeft) cls += ' at-left';
      else if (isRight) cls += ' at-right';
      if (inWindow && isNeeded) {
        cls += (got >= needCnt ? ' needed-sat' : ' needed-part');
      }
    }

    let badge = '';
    if (right >= 0) {
      if (isLeft && isRight) badge = '<span class="ptr-b ptr-lr">l=r</span>';
      else if (isLeft) badge = '<span class="ptr-b ptr-l">l</span>';
      else if (isRight) badge = '<span class="ptr-b ptr-r">r</span>';
    }

    html += '<div class="char-wrap">' +
      '<div class="' + cls + '">' + ch + '</div>' +
      '<div class="char-idx">' + i + '</div>' +
      '<div class="ptr-badges">' + badge + '</div>' +
      '</div>';
  }
  document.getElementById('char-row').innerHTML = html;
}

function updateSidebar(snap) {
  const { left, right, have, want, window: win, need, best, s } = snap;

  // Pointer table
  const tbody = document.querySelector('#ptr-table tbody');
  const winStr = (right >= 0 && right >= left) ? s.slice(left, right + 1) : '';
  const winLen = winStr.length;
  let rows = '<tr><td>left</td><td>' + left + '</td></tr>';
  rows += '<tr><td>right</td><td>' + (right >= 0 ? right : '—') + '</td></tr>';
  rows += '<tr><td>have</td><td>' + have + ' / ' + want + '</td></tr>';
  if (right >= 0) {
    rows += '<tr><td>window</td><td>"' + winStr + '"</td></tr>';
    rows += '<tr><td>len</td><td>' + winLen + '</td></tr>';
  }
  tbody.innerHTML = rows;

  // Window counts
  let whtml = '';
  const entries = Object.entries(need);
  for (let i = 0; i < entries.length; i++) {
    const ch = entries[i][0], cnt = entries[i][1];
    const got = win[ch] || 0;
    const cls = got >= cnt ? 'wc-pill sat' : (got > 0 ? 'wc-pill part' : 'wc-pill');
    whtml += '<span class="' + cls + '">' + ch + ': ' + got + '/' + cnt + '</span>';
  }
  document.getElementById('window-counts').innerHTML = whtml;

  // Result
  const ri = document.getElementById('result-info');
  if (best) {
    ri.innerHTML = 'Best: <span style="color:#8b5cf6;font-weight:700;">"' + best.sub + '"</span><br>len=' + best.sub.length + '<br>indices [' + best.left + ', ' + best.right + ']';
  } else {
    ri.innerHTML = '<span style="color:var(--text-dim)">No result yet</span>';
  }
}

function renderCode(activeLine) {
  const pre = document.getElementById('code-pre');
  pre.innerHTML = CODE_LINES.map(function(l) {
    const cls = l.n === activeLine ? 'code-line active' : 'code-line';
    return '<span class="' + cls + '">' + l.t + '</span>';
  }).join('');
  const active = pre.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ─── Phase badge colors ────────────────────────────────────────────────────
const PHASE_META = {
  expand: { label: 'Expand',  bg: '#1e3a5f', color: '#3b82f6' },
  shrink: { label: 'Shrink',  bg: '#431407', color: '#f97316' },
  done:   { label: 'Done',    bg: '#14532d', color: '#22c55e' },
};

function applyStep(snap) {
  const meta = PHASE_META[snap.phase] || PHASE_META.expand;
  const badge = document.getElementById('phase-badge');
  badge.textContent = meta.label;
  badge.style.background = meta.bg;
  badge.style.color = meta.color;
  badge.style.borderColor = meta.color;

  document.getElementById('desc').textContent = snap.description;
  renderNeedRow(snap);
  renderCharRow(snap);
  updateSidebar(snap);
  renderCode(snap.active_line);
}

function updateStatus(snap, cur, total) {
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.reset();
});

// ─── viz-inputs handlers ──────────────────────────────────────────────────
function loadPreset() {
  var val = document.getElementById('presetSel').value;
  if (!val) return;
  var parts = val.split('|');
  document.getElementById('inputS').value = parts[0];
  document.getElementById('inputT').value = parts[1];
  buildAndRun();
}

function buildAndRun() {
  var s = document.getElementById('inputS').value.trim();
  var t = document.getElementById('inputT').value.trim();
  if (!s || !t) return;
  var snaps = buildSnapshots(s, t);
  if (window.nav) window.nav.load(snaps);
}

var RANDOM_EXAMPLES = [
  ['OUZODYXAZV', 'XYZ'],
  ['BANCDCBC', 'ABC'],
  ['AABCBAB', 'AB'],
  ['XYZYX', 'XYZ'],
  ['abcabdebac', 'cda'],
  ['timetopractice', 'toc'],
];

function randomExample() {
  var ex = RANDOM_EXAMPLES[Math.floor(Math.random() * RANDOM_EXAMPLES.length)];
  document.getElementById('inputS').value = ex[0];
  document.getElementById('inputT').value = ex[1];
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ─── Init ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var snaps = buildSnapshots('ADOBECODEBANC', 'ABC');
  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });
  window.nav.load(snaps);
});

(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = e.clientX - startX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
