<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Insert Interval</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); max-width: 600px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 340px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: #bb9af7; } .fn { color: #7dcfff; } .bi { color: #ff9e64; } .op { color: #c0caf5; } .nb { color: #9ece6a; } .cm { color: #3b4261; } .st { color: #e0af68; }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* PAGE-SPECIFIC */
  .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .timeline-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  #timeline-svg { width: 100%; display: block; overflow: visible; }
  .var-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .var-box { padding: 10px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .var-box.accent-border { border-color: var(--accent); }
  .var-box.yellow-border { border-color: var(--yellow); }
  .var-box.purple-border { border-color: #bb9af7; }
  .var-label { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); text-align: center; }
  .var-val { font-size: 1.1rem; font-weight: 700; color: var(--text-bright); font-family: monospace; }
  .phase-box { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .phase-indicator { display: flex; gap: 6px; flex-wrap: wrap; }
  .phase-pip { padding: 3px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: 700; font-family: monospace; border: 1px solid var(--border); color: var(--text-faint); background: var(--bg); transition: all 0.2s; }
  .phase-pip.active-before { background: #1a2b14; color: #9ece6a; border-color: #4d7a23; }
  .phase-pip.active-merge  { background: #1a1535; color: #bb9af7; border-color: #6b4fa0; }
  .phase-pip.active-after  { background: #0d1a35; color: #7aa2f7; border-color: #3b5ba0; }
  .phase-pip.done { opacity: 0.45; }
  .result-badge { font-size: 0.82rem; font-weight: 600; padding: 5px 12px; border-radius: 6px; font-family: monospace; display: none; }
  .result-badge.show { display: block; background: #1a2b14; color: #9ece6a; border: 1px solid #4d7a23; }
  .legend-row { display: flex; flex-direction: column; gap: 7px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; margin-right: 6px; }
  .right-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; align-items: start; }
  @media (max-width: 800px) { .right-panels { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"intervals":"1,3,6,9,12,15","newIv":"2,7"}'>Gap left</option>
      <option value='{"intervals":"1,2,3,5,6,7,8,10,12,16","newIv":"4,9"}'>Full overlap</option>
      <option value='{"intervals":"1,3,6,9","newIv":"11,14"}'>Append right</option>
      <option value='{"intervals":"5,7","newIv":"1,2"}'>Insert start</option>
      <option value='{"intervals":"1,2,3,6,7,8","newIv":"4,5"}'>Insert middle</option>
      <option value='{"intervals":"1,5,6,9","newIv":"2,8"}'>Full merge</option>
    </select>
  </div>
  <div>
    <label>Existing intervals (flat pairs: s,e,...)</label>
    <input id="inp-intervals" type="text" value="1,3,6,9,12,15" style="width:200px" />
  </div>
  <div>
    <label>New interval</label>
    <input id="inp-new" type="text" value="2,7" style="width:80px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Insert Interval</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Choose a preset and click Run.</div>

    <div class="timeline-panel">
      <div class="panel-title">Timeline</div>
      <svg id="timeline-svg" viewBox="0 0 700 100" preserveAspectRatio="xMidYMid meet">
        <text x="350" y="55" text-anchor="middle" fill="#3b4261" font-size="13" font-family="monospace">Run simulation to see timeline</text>
      </svg>
    </div>

    <div class="right-panels">
      <div class="panel-box">
        <div class="panel-title">Phase Tracker</div>
        <div class="phase-box">
          <div class="phase-indicator">
            <span class="phase-pip" id="pip-before">&#9312; Before</span>
            <span class="phase-pip" id="pip-merge">&#9313; Merge</span>
            <span class="phase-pip" id="pip-after">&#9314; After</span>
          </div>
        </div>
        <div class="var-grid">
          <div class="var-box yellow-border">
            <div class="var-label">current interval</div>
            <div class="var-val" id="vv-curr">&mdash;</div>
          </div>
          <div class="var-box purple-border">
            <div class="var-label">new interval (growing)</div>
            <div class="var-val" id="vv-new">&mdash;</div>
          </div>
        </div>
        <div class="result-badge" id="result-badge"></div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Legend</div>
        <div class="legend-row">
          <div><div class="legend-swatch" style="background:#1a1535;border:1.5px solid #bb9af7"></div><span style="font-size:0.75rem">New interval (to insert / growing)</span></div>
          <div><div class="legend-swatch" style="background:#2a2007;border:1.5px solid #e0af68"></div><span style="font-size:0.75rem">Current existing interval (being compared)</span></div>
          <div><div class="legend-swatch" style="background:#1a2b14;border:1.5px solid #4d7a23"></div><span style="font-size:0.75rem">Result interval (finalised)</span></div>
          <div><div class="legend-swatch" style="background:#1a1b26;border:1.5px solid #414868"></div><span style="font-size:0.75rem">Pending</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step" disabled>&#8592; Prev</button>
  <button id="stepBtn" class="btn-step" disabled>Step &#8594;</button>
  <button id="playBtn" class="btn-play" disabled>Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">insert</span><span class="op">(</span>intervals<span class="op">,</span> newInterval<span class="op">):</span>'],
  [2,  '    res <span class="op">=</span> <span class="op">[]</span>'],
  [3,  '    <span class="kw">for</span> i<span class="op">,</span> iv <span class="kw">in</span> <span class="bi">enumerate</span><span class="op">(</span>intervals<span class="op">):</span>'],
  [4,  '        <span class="cm"># Phase 1 &#8211; iv ends before new starts</span>'],
  [5,  '        <span class="kw">if</span> iv<span class="op">[</span><span class="nb">1</span><span class="op">]</span> <span class="op">&lt;</span> newInterval<span class="op">[</span><span class="nb">0</span><span class="op">]:</span>'],
  [6,  '            res<span class="op">.</span><span class="bi">append</span><span class="op">(</span>iv<span class="op">)</span>'],
  [7,  '        <span class="cm"># Phase 2 &#8211; iv overlaps new interval</span>'],
  [8,  '        <span class="kw">elif</span> iv<span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">&lt;=</span> newInterval<span class="op">[</span><span class="nb">1</span><span class="op">]:</span>'],
  [9,  '            newInterval<span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">=</span> <span class="bi">min</span><span class="op">(</span>newInterval<span class="op">[</span><span class="nb">0</span><span class="op">],</span> iv<span class="op">[</span><span class="nb">0</span><span class="op">])</span>'],
  [10, '            newInterval<span class="op">[</span><span class="nb">1</span><span class="op">]</span> <span class="op">=</span> <span class="bi">max</span><span class="op">(</span>newInterval<span class="op">[</span><span class="nb">1</span><span class="op">],</span> iv<span class="op">[</span><span class="nb">1</span><span class="op">])</span>'],
  [11, '        <span class="cm"># Phase 3 &#8211; iv starts after new ends</span>'],
  [12, '        <span class="kw">else</span><span class="op">:</span>'],
  [13, '            res<span class="op">.</span><span class="bi">append</span><span class="op">(</span>newInterval<span class="op">)</span>'],
  [14, '            newInterval <span class="op">=</span> iv'],
  [15, '    res<span class="op">.</span><span class="bi">append</span><span class="op">(</span>newInterval<span class="op">)</span>'],
  [16, '    <span class="kw">return</span> res'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  loadPreset();

  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      renderStep(snap, cur > 0);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
      var badge = document.getElementById('result-badge');
      if (badge) {
        badge.className = 'result-badge';
        badge.textContent = '';
        if (snap.phase === 'Done') {
          badge.className = 'result-badge show';
          badge.textContent = 'Result: ' + snap.result.map(fmtIv).join(', ');
        }
      }
      gsap.fromTo(document.getElementById('desc'), { opacity: 0 }, { opacity: 1, duration: 0.15 });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    buildAndRun();
  });
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    return '<div class="cl" id="cl-' + e[0] + '"><span class="ln">' + e[0] + '</span><span>' + e[1] + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-intervals').value = d.intervals;
  document.getElementById('inp-new').value = d.newIv;
  buildAndRun();
}

function randomExample() {
  var randInt = function(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; };
  var randIntervals = function() {
    var count = randInt(1, 4);
    var vals = [];
    for (var i = 0; i < count; i++) { var a = randInt(0, 8); vals.push(a, randInt(a + 1, a + 5)); }
    return vals.join(',');
  };
  var randNewIv = function() { var a = randInt(0, 12); return a + ',' + randInt(a + 1, a + 4); };
  document.getElementById('presetSel').value = '';
  document.getElementById('inp-intervals').value = randIntervals();
  document.getElementById('inp-new').value = randNewIv();
  buildAndRun();
}

function parseIntervals(raw) {
  var nums = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
  var result = [];
  for (var i = 0; i + 1 < nums.length; i += 2) {
    if (nums[i] <= nums[i + 1]) result.push([nums[i], nums[i + 1]]);
  }
  return result;
}

function buildAndRun() {
  var intervals = parseIntervals(document.getElementById('inp-intervals').value);
  var newParsed  = parseIntervals(document.getElementById('inp-new').value);
  if (intervals.length < 1 || newParsed.length < 1) { alert('Need at least 1 existing interval and a valid new interval.'); return; }
  simSteps = simulate(intervals, newParsed[0].slice());
  nav.load(simSteps);
}

function fmtIv(iv) { return '[' + iv[0] + ',' + iv[1] + ']'; }

function simulate(intervals, newInterval) {
  var steps = [];
  var res   = [];
  var newIv = newInterval.slice();

  function snap(phase, desc, lines, opts) {
    opts = opts || {};
    steps.push({ phase: phase, desc: desc, lines: lines, intervals: intervals.slice(), currentIdx: opts.currentIdx !== undefined ? opts.currentIdx : -1, newIv: (opts.newIv || newIv).slice(), result: (opts.result || res).map(function(x) { return x.slice(); }), sweepPhase: opts.sweepPhase || 'before', newInserted: !!opts.newInserted });
  }

  snap('Input', 'Input: ' + intervals.length + ' existing intervals + new interval ' + fmtIv(newIv) + '. Will sweep left-to-right in three phases.', [1, 2], { sweepPhase: 'before', result: [], currentIdx: -1 });

  var newInserted = false;
  for (var i = 0; i < intervals.length; i++) {
    var iv = intervals[i];
    if (iv[1] < newIv[0]) {
      snap('Phase ①', fmtIv(iv) + ' ends at ' + iv[1] + ' before new starts at ' + newIv[0] + ' → copy to result.', [3, 5, 6], { currentIdx: i, sweepPhase: 'before', result: res.slice(), newIv: newIv.slice() });
      res.push(iv.slice());
    } else if (iv[0] <= newIv[1]) {
      var oldNew = newIv.slice();
      newIv[0] = Math.min(newIv[0], iv[0]);
      newIv[1] = Math.max(newIv[1], iv[1]);
      snap('Phase ②', fmtIv(iv) + ' overlaps new interval. Expand: [min(' + oldNew[0] + ',' + iv[0] + '), max(' + oldNew[1] + ',' + iv[1] + ')] = ' + fmtIv(newIv) + '.', [3, 8, 9, 10], { currentIdx: i, sweepPhase: 'merge', result: res.slice(), newIv: newIv.slice() });
    } else {
      if (!newInserted) {
        snap('Phase ③', 'New interval ' + fmtIv(newIv) + ' is fully placed. Flush it to result, then copy ' + fmtIv(iv) + '.', [3, 12, 13, 14], { currentIdx: i, sweepPhase: 'after', result: res.concat([newIv.slice()]), newIv: iv.slice(), newInserted: true });
        res.push(newIv.slice());
        newIv = iv.slice();
        newInserted = true;
      } else {
        snap('Phase ③', fmtIv(iv) + ' starts after new ends → copy to result.', [3, 12, 13, 14], { currentIdx: i, sweepPhase: 'after', result: res.slice(), newIv: newIv.slice(), newInserted: true });
        res.push(newIv.slice());
        newIv = iv.slice();
      }
    }
  }
  res.push(newIv.slice());
  snap('Done', 'All intervals processed. Result: ' + res.map(fmtIv).join(', '), [15, 16], { currentIdx: -1, sweepPhase: 'done', result: res.slice(), newIv: newIv.slice(), newInserted: true });
  return steps;
}

function renderStep(snap, animate) {
  renderSVG(snap, animate);
  renderVars(snap, animate);
  renderCode(snap.lines);
  renderPhase(snap.sweepPhase);
}

var C = {
  pending:   { fill: '#1a1b26', stroke: '#414868', text: '#565f89' },
  processed: { fill: '#1e1e2e', stroke: '#292e42', text: '#3b4261' },
  current:   { fill: '#2a2007', stroke: '#e0af68', text: '#e0af68' },
  newIv:     { fill: '#1a1535', stroke: '#bb9af7', text: '#bb9af7' },
  completed: { fill: '#1a2b14', stroke: '#4d7a23', text: '#9ece6a' },
  axis:      '#414868', axisText: '#565f89', label: '#3b4261', divider: '#292e42',
};

function renderSVG(snap, animate) {
  var svg = document.getElementById('timeline-svg');
  if (!snap.intervals || snap.intervals.length === 0) return;
  var n = snap.intervals.length, W = 700, PAD_L = 58, PAD_R = 24, CW = W - PAD_L - PAD_R;
  var BAR_H = 20, ROW_H = 28;
  var allVals = [];
  snap.intervals.forEach(function(iv) { allVals.push(iv[0], iv[1]); });
  allVals.push(snap.newIv[0], snap.newIv[1]);
  snap.result.forEach(function(iv) { allVals.push(iv[0], iv[1]); });
  var minV = Math.min.apply(null, allVals), maxV = Math.max.apply(null, allVals);
  var span = maxV - minV || 1, vPad = span * 0.08;
  var vMin = minV - vPad, vMax = maxV + vPad;
  function xS(v) { return PAD_L + (v - vMin) / (vMax - vMin) * CW; }
  var AXIS_Y = 22, INP_Y0 = 42, DIV1_Y = INP_Y0 + n * ROW_H + 8;
  var NEW_Y0 = DIV1_Y + 22, DIV2_Y = NEW_Y0 + ROW_H + 6, RES_Y0 = DIV2_Y + 22;
  var TOTAL_H = RES_Y0 + ROW_H + 12;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + TOTAL_H);
  var parts = [];
  var rawStep = span / 5, step = Math.max(1, Math.round(rawStep)), tickStart = Math.ceil(minV / step) * step;
  parts.push('<line x1="' + PAD_L + '" y1="' + AXIS_Y + '" x2="' + (W - PAD_R) + '" y2="' + AXIS_Y + '" stroke="' + C.axis + '" stroke-width="1"/>');
  for (var tv = tickStart; tv <= maxV; tv += step) {
    var tx = xS(tv);
    parts.push('<line x1="' + tx + '" y1="' + (AXIS_Y - 4) + '" x2="' + tx + '" y2="' + (AXIS_Y + 4) + '" stroke="' + C.axis + '" stroke-width="1"/>');
    parts.push('<text x="' + tx + '" y="' + (AXIS_Y + 16) + '" text-anchor="middle" fill="' + C.axisText + '" font-size="10" font-family="monospace">' + tv + '</text>');
  }
  parts.push('<text x="' + (PAD_L - 4) + '" y="' + (INP_Y0 - 6) + '" text-anchor="end" fill="' + C.label + '" font-size="10" font-weight="600" letter-spacing="0.05em">INPUTS</text>');
  snap.intervals.forEach(function(iv, idx) {
    var barY = INP_Y0 + idx * ROW_H, barCy = barY + BAR_H / 2, x1 = xS(iv[0]), x2 = xS(iv[1]), bw = Math.max(x2 - x1, 2);
    var style = (idx === snap.currentIdx) ? C.current : (snap.currentIdx >= 0 && idx < snap.currentIdx) ? C.processed : C.pending;
    parts.push('<text x="' + (PAD_L - 5) + '" y="' + (barCy + 4) + '" text-anchor="end" fill="' + style.text + '" font-size="10" font-family="monospace">' + fmtIv(iv) + '</text>');
    parts.push('<rect x="' + x1 + '" y="' + barY + '" width="' + bw + '" height="' + BAR_H + '" rx="4" fill="' + style.fill + '" stroke="' + style.stroke + '" stroke-width="1.5"/>');
  });
  parts.push('<line x1="' + (PAD_L - 10) + '" y1="' + DIV1_Y + '" x2="' + (W - PAD_R) + '" y2="' + DIV1_Y + '" stroke="' + C.divider + '" stroke-dasharray="4,4"/>');
  parts.push('<text x="' + (PAD_L - 4) + '" y="' + (NEW_Y0 - 5) + '" text-anchor="end" fill="' + C.label + '" font-size="10" font-weight="600" letter-spacing="0.05em">NEW IV</text>');
  var niv = snap.newIv, nx1 = xS(niv[0]), nx2 = xS(niv[1]), nbw = Math.max(nx2 - nx1, 2), ncy = NEW_Y0 + BAR_H / 2;
  parts.push('<rect x="' + nx1 + '" y="' + NEW_Y0 + '" width="' + nbw + '" height="' + BAR_H + '" rx="4" fill="' + C.newIv.fill + '" stroke="' + C.newIv.stroke + '" stroke-width="2"/>');
  if (nbw > 28) parts.push('<text x="' + (nx1 + nbw / 2) + '" y="' + (ncy + 4) + '" text-anchor="middle" fill="' + C.newIv.text + '" font-size="9.5" font-family="monospace" font-weight="700">' + fmtIv(niv) + '</text>');
  parts.push('<line x1="' + (PAD_L - 10) + '" y1="' + DIV2_Y + '" x2="' + (W - PAD_R) + '" y2="' + DIV2_Y + '" stroke="' + C.divider + '" stroke-dasharray="4,4"/>');
  parts.push('<text x="' + (PAD_L - 4) + '" y="' + (RES_Y0 - 5) + '" text-anchor="end" fill="' + C.label + '" font-size="10" font-weight="600" letter-spacing="0.05em">RESULT</text>');
  if (snap.result.length > 0) {
    snap.result.forEach(function(iv) {
      var rx1 = xS(iv[0]), rx2 = xS(iv[1]), rbw = Math.max(rx2 - rx1, 2), rcy = RES_Y0 + BAR_H / 2;
      parts.push('<rect x="' + rx1 + '" y="' + RES_Y0 + '" width="' + rbw + '" height="' + BAR_H + '" rx="4" fill="' + C.completed.fill + '" stroke="' + C.completed.stroke + '" stroke-width="1.5"/>');
      if (rbw > 28) parts.push('<text x="' + (rx1 + rbw / 2) + '" y="' + (rcy + 4) + '" text-anchor="middle" fill="' + C.completed.text + '" font-size="9.5" font-family="monospace" font-weight="600">' + fmtIv(iv) + '</text>');
    });
  } else {
    parts.push('<text x="' + (PAD_L + 10) + '" y="' + (RES_Y0 + 13) + '" fill="' + C.label + '" font-size="10" font-family="monospace">building…</text>');
  }
  svg.innerHTML = parts.join('');
}

function renderVars(snap, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = (val === null || val === undefined) ? '\u2014' : val;
    if (animate && el.textContent !== text) gsap.fromTo(el, { scale: 0.85, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    el.textContent = text;
  }
  var cur = snap.currentIdx >= 0 ? snap.intervals[snap.currentIdx] : null;
  setVal('vv-curr', cur ? fmtIv(cur) : null);
  setVal('vv-new', fmtIv(snap.newIv));
}

function renderPhase(sweepPhase) {
  var pips = { before: document.getElementById('pip-before'), merge: document.getElementById('pip-merge'), after: document.getElementById('pip-after') };
  Object.keys(pips).forEach(function(key) { pips[key].className = 'phase-pip'; });
  if (sweepPhase === 'before') { pips.before.classList.add('active-before'); pips.merge.classList.add('done'); pips.after.classList.add('done'); }
  else if (sweepPhase === 'merge') { pips.before.classList.add('done'); pips.merge.classList.add('active-merge'); pips.after.classList.add('done'); }
  else if (sweepPhase === 'after' || sweepPhase === 'done') { pips.before.classList.add('done'); pips.merge.classList.add('done'); pips.after.classList.add('active-after'); }
}

function renderCode(lines) {
  CODE.forEach(function(e) {
    var el = document.getElementById('cl-' + e[0]);
    if (!el) return;
    if (lines.indexOf(e[0]) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

// ── Resize handle ────────────────────────────────────────────────
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) { dragging = true; startX = e.clientX; startW = panel.offsetWidth; handle.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!dragging) return; var delta = startX - e.clientX; panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px'; });
  document.addEventListener('mouseup', function() { if (dragging) { dragging = false; handle.classList.remove('dragging'); } });
})();
</script>
