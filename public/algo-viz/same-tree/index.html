<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Same Tree</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* ─── Viz-specific ─────────────────────────────────────────── */
  .trees-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .tree-cell {
    position: relative;
    border-right: 1px solid var(--border);
  }
  .tree-cell:last-child { border-right: none; }
  .tree-label {
    position: absolute;
    top: 8px; left: 12px;
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  .tree-svg { display: block; width: 100%; }

  .step-desc-line { font-size: 13px; color: var(--text-muted); line-height: 1.5; min-height: 20px; }

  .code-header {
    font-size: 0.67rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.11em;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .code-body {
    flex: 1;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.78rem; line-height: 1.7; overflow-x: auto;
  }
  .cl {
    display: flex; align-items: stretch;
    border-left: 3px solid transparent;
    padding: 0 14px 0 0;
    transition: background-color 0.01s;
    white-space: pre;
  }
  .cl .ln {
    width: 28px; min-width: 28px; text-align: right;
    color: #3d4468; user-select: none;
    padding-right: 14px; font-size: 0.72rem; line-height: 1.7;
  }
  .cl .code { color: var(--text-muted); }
  .kw  { color: var(--purple); }
  .fn  { color: var(--blue); }
  .bi  { color: var(--orange); }
  .str { color: var(--green); }
  .cm  { color: #3d4468; font-style: italic; }
  .op  { color: var(--text); }

  .panel-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 14px;
  }
  .panel-title {
    font-size: 0.67rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.11em;
    color: var(--text-dim); margin-bottom: 10px;
  }
  .compare-row {
    display: flex; align-items: center; gap: 10px; min-height: 42px;
    justify-content: center;
  }
  .cmp-chip {
    background: #1e2130; color: var(--text);
    border: 1.5px solid #2d3148; border-radius: 8px;
    padding: 6px 12px; font-size: 0.95rem; font-weight: 700;
    min-width: 42px; text-align: center;
  }
  .cmp-chip.null { color: var(--text-faint); font-style: italic; border-style: dashed; }
  .cmp-op { color: var(--text-dim); font-size: 1.1rem; font-weight: 700; }
  .verdict {
    padding: 10px 14px;
    border-radius: 7px; font-weight: 700; text-align: center;
    font-size: 0.92rem;
    background: #1e2130; color: var(--text-faint); border: 1px solid var(--border);
  }
  .verdict.ok   { background: #052e16; color: var(--green);  border-color: #16a34a; }
  .verdict.bad  { background: #3f0a14; color: #fb7185; border-color: #e11d48; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--text-muted); align-items: center; }
  .leg-item { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value='{"treeA":"[1,2,3]","treeB":"[1,2,3]"}'>Trees match (identical)</option>
      <option value='{"treeA":"[1,2,3]","treeB":"[1,3,2]"}'>Different structure</option>
      <option value='{"treeA":"[1,2]","treeB":"[1,null,2]"}'>Null position differs</option>
      <option value='{"treeA":"[]","treeB":"[]"}'>Both empty</option>
      <option value='{"treeA":"[1]","treeB":"[1]"}'>Single node, matching</option>
      <option value='{"treeA":"[1,2,3,4,5,6,7]","treeB":"[1,2,3,4,5,6,7]"}'>Larger matching trees</option>
    </select>
  </div>
  <div>
    <label>Tree A (level-order)</label>
    <input id="inp-a" type="text" value="[1,2,3,4,5]" style="width:170px;" />
  </div>
  <div>
    <label>Tree B (level-order)</label>
    <input id="inp-b" type="text" value="[1,2,4,null,5]" style="width:170px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Same Tree</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="trees-wrap">
      <div class="tree-cell">
        <span class="tree-label">Tree A</span>
        <svg id="svg-A" class="tree-svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="tree-cell">
        <span class="tree-label">Tree B</span>
        <svg id="svg-B" class="tree-svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>

    <div class="step-desc-line" id="step-desc">Click Run to start.</div>

    <div class="legend">
      <div class="leg-item">
        <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1e2130" stroke="#2d3148" stroke-width="2"/></svg>
        Unvisited
      </div>
      <div class="leg-item">
        <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#c2410c" stroke="var(--orange)" stroke-width="2"/></svg>
        Comparing
      </div>
      <div class="leg-item">
        <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#052e16" stroke="#16a34a" stroke-width="2"/></svg>
        Matched
      </div>
      <div class="leg-item">
        <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#3f0a14" stroke="#e11d48" stroke-width="2"/></svg>
        Mismatch
      </div>
      <div class="leg-item">
        <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2"/></svg>
        Null node
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-header">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Current Comparison</div>
      <div class="compare-row">
        <div class="cmp-chip null" id="cmp-a">—</div>
        <span class="cmp-op" id="cmp-op">vs</span>
        <div class="cmp-chip null" id="cmp-b">—</div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Result</div>
      <div class="verdict" id="verdict">running…</div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ─── Code panel ───────────────────────────────────────────────────────────────
const CODE_LINES = [
  [1, `<span class="kw">def</span> <span class="fn">isSameTree</span><span class="op">(</span>p<span class="op">,</span> q<span class="op">):</span>`],
  [2, `    <span class="kw">if</span> p <span class="kw">is None and</span> q <span class="kw">is None</span><span class="op">:</span>`],
  [3, `        <span class="kw">return True</span>`],
  [4, `    <span class="kw">if</span> p <span class="kw">is None or</span> q <span class="kw">is None</span><span class="op">:</span>`],
  [5, `        <span class="kw">return False</span>`],
  [6, `    <span class="kw">if</span> p<span class="op">.</span>val <span class="op">!=</span> q<span class="op">.</span>val<span class="op">:</span>`],
  [7, `        <span class="kw">return False</span>`],
  [8, `    <span class="kw">return</span> <span class="fn">isSameTree</span><span class="op">(</span>p<span class="op">.</span>left<span class="op">,</span> q<span class="op">.</span>left<span class="op">)</span> <span class="kw">and</span> <span class="op">\</span>`],
  [9, `           <span class="fn">isSameTree</span><span class="op">(</span>p<span class="op">.</span>right<span class="op">,</span> q<span class="op">.</span>right<span class="op">)</span>`],
];

function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = `cl-${ln}`;
    row.innerHTML = `<span class="ln">${ln > 0 ? ln : ''}</span><span class="code">${html}</span>`;
    body.appendChild(row);
  });
}

// ─── Colors ───────────────────────────────────────────────────────────────────
const COLORS = {
  idle:     { fill: '#1e2130', stroke: '#2d3148', text: 'var(--text-muted)' },
  active:   { fill: '#c2410c', stroke: 'var(--orange)', text: '#ffffff' },
  matched:  { fill: '#052e16', stroke: '#16a34a', text: 'var(--green)' },
  mismatch: { fill: '#3f0a14', stroke: '#e11d48', text: '#fb7185' },
  visited:  { fill: '#062416', stroke: '#15803d', text: '#86efac' },
};

// ─── Globals ─────────────────────────────────────────────────────────────────
let treeA = null, treeB = null;
let nodesA = {}, nodesB = {};   // id -> node {id, val, x, y, isNull, leftId, rightId}
let steps  = [];

// ─── Parse LeetCode level-order ──────────────────────────────────────────────
// Returns {root, nodes} — nodes keyed by string id (assigned BFS order).
function parseTree(text) {
  let arr;
  try { arr = JSON.parse(text); } catch { return null; }
  if (!Array.isArray(arr)) return null;
  if (arr.length === 0) return { root: null, nodes: {} };

  const nodes = {};
  let nextId = 0;
  function mkNode(val, isNull) {
    const id = String(nextId++);
    const n = { id, val, isNull, leftId: null, rightId: null };
    nodes[id] = n;
    return n;
  }

  const root = mkNode(arr[0], arr[0] === null);
  if (root.isNull) return { root: null, nodes: {} };

  const q = [root];
  let i = 1;
  while (q.length && i < arr.length) {
    const cur = q.shift();
    if (cur.isNull) continue;
    // left
    if (i < arr.length) {
      const v = arr[i++];
      if (v !== null) {
        const c = mkNode(v, false);
        cur.leftId = c.id;
        q.push(c);
      }
    }
    // right
    if (i < arr.length) {
      const v = arr[i++];
      if (v !== null) {
        const c = mkNode(v, false);
        cur.rightId = c.id;
        q.push(c);
      }
    }
  }
  return { root, nodes };
}

// ─── Layout ──────────────────────────────────────────────────────────────────
// In-order x assignment; depth-based y. Includes phantom null children at
// missing child positions so structural mismatches are visible.
function layout(root, nodes, vw, vh) {
  const order = []; // in-order list of {id, isReal}
  const phantoms = {}; // id -> phantom node (negative id space)
  let phantomCounter = -1;

  function ensureChild(parent, side) {
    const childIdField = side === 'L' ? 'leftId' : 'rightId';
    if (parent[childIdField] != null) return nodes[parent[childIdField]];
    const pid = String(phantomCounter--);
    const ph = { id: pid, val: null, isNull: true, leftId: null, rightId: null, isPhantom: true, parentId: parent.id };
    phantoms[pid] = ph;
    parent[childIdField] = pid;
    return ph;
  }

  function depthOf(node, d) {
    if (!node || node.isNull || node.isPhantom) return d;
    const lid = node.leftId, rid = node.rightId;
    const ld = lid != null ? depthOf(nodes[lid], d + 1) : d;
    const rd = rid != null ? depthOf(nodes[rid], d + 1) : d;
    return Math.max(ld, rd);
  }
  const maxDepth = root ? depthOf(root, 0) : 0;

  function addPhantoms(node) {
    if (!node || node.isPhantom) return;
    const has = (node.leftId != null) || (node.rightId != null);
    if (has) {
      const l = node.leftId != null ? nodes[node.leftId] : ensureChild(node, 'L');
      const r = node.rightId != null ? nodes[node.rightId] : ensureChild(node, 'R');
      if (!l.isPhantom) addPhantoms(l);
      if (!r.isPhantom) addPhantoms(r);
    }
  }
  if (root) addPhantoms(root);

  const all = Object.assign({}, nodes, phantoms);

  let xIdx = 0;
  function inorder(nodeId, depth) {
    if (nodeId == null) return;
    const n = all[nodeId];
    if (!n) return;
    inorder(n.leftId, depth + 1);
    n.x = xIdx++;
    n.depth = depth;
    order.push(n);
    inorder(n.rightId, depth + 1);
  }
  if (root) inorder(root.id, 0);

  const total = Math.max(1, order.length);
  const PAD_X = 30, PAD_Y = 32;
  const dx = (vw - PAD_X * 2) / total;
  const dy = (vh - PAD_Y * 2) / Math.max(1, maxDepth);

  order.forEach(n => {
    n.px = PAD_X + (n.x + 0.5) * dx;
    n.py = PAD_Y + n.depth * dy;
  });

  return { all, order, maxDepth };
}

// ─── Render SVG for one tree ─────────────────────────────────────────────────
function renderTree(svgId, root, nodes) {
  const svg = document.getElementById(svgId);
  svg.innerHTML = '';
  const VW = 400, VH = 300;
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);

  if (!root) {
    const t = svgEl('text', { x: VW/2, y: VH/2, 'text-anchor':'middle', fill:'var(--text-faint)', 'font-size': 14 });
    t.textContent = '(empty tree)';
    svg.appendChild(t);
    return { all: {}, order: [], maxDepth: 0 };
  }

  const lay = layout(root, nodes, VW, VH);
  const all = lay.all;
  const R = lay.order.length <= 5 ? 18 : lay.order.length <= 10 ? 15 : 12;

  const edgeG = svgG('edges-' + svgId);
  const nodeG = svgG('nodes-' + svgId);
  svg.appendChild(edgeG); svg.appendChild(nodeG);

  Object.values(all).forEach(n => {
    if (n.isPhantom || n.isNull) return;
    [['leftId','L'], ['rightId','R']].forEach(([f]) => {
      const cid = n[f];
      if (cid == null) return;
      const c = all[cid];
      if (!c) return;
      edgeG.appendChild(svgEl('line', {
        id: `edge-${svgId}-${n.id}-${c.id}`,
        x1: n.px, y1: n.py, x2: c.px, y2: c.py,
        stroke: c.isPhantom ? '#374151' : '#2d3148',
        'stroke-width': c.isPhantom ? 1.2 : 2,
        'stroke-dasharray': c.isPhantom ? '3 3' : '0',
        'stroke-linecap': 'round',
      }));
    });
  });

  Object.values(all).forEach(n => {
    const g = svgG(`g-${svgId}-${n.id}`);
    if (n.isPhantom) {
      g.appendChild(svgEl('circle', {
        id: `nc-${svgId}-${n.id}`, cx: n.px, cy: n.py, r: R * 0.7,
        fill: 'none', stroke: '#475569', 'stroke-width': 1.5, 'stroke-dasharray': '2 2',
      }));
      const t = svgEl('text', {
        id: `nt-${svgId}-${n.id}`, x: n.px, y: n.py,
        'text-anchor':'middle', 'dominant-baseline':'middle',
        fill: 'var(--text-faint)', 'font-size': Math.round(R * 0.6), 'font-style':'italic',
      });
      t.textContent = '∅';
      g.appendChild(t);
    } else {
      g.appendChild(svgEl('circle', {
        id: `nc-${svgId}-${n.id}`, cx: n.px, cy: n.py, r: R,
        fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': 2.5,
      }));
      const t = svgEl('text', {
        id: `nt-${svgId}-${n.id}`, x: n.px, y: n.py,
        'text-anchor':'middle', 'dominant-baseline':'middle',
        fill: COLORS.idle.text,
        'font-size': Math.round(R * 0.75), 'font-weight':'bold',
        'font-family': 'Segoe UI, system-ui, sans-serif',
      });
      t.textContent = n.val;
      g.appendChild(t);
    }
    nodeG.appendChild(g);
  });

  return lay;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id;
  return g;
}

// ─── Simulation ──────────────────────────────────────────────────────────────
// Each step: { phase, desc, lines, activeA, activeB, stateA:{id:state}, stateB:{id:state}, result }
function simulate(rootA, nodesA, rootB, nodesB) {
  const out = [];
  const stateA = {}, stateB = {};
  Object.keys(nodesA).forEach(id => stateA[id] = 'idle');
  Object.keys(nodesB).forEach(id => stateB[id] = 'idle');
  let finalResult = null;

  function snap(opts) {
    out.push(Object.assign({
      phase: 'compare', desc: '', lines: [],
      activeA: null, activeB: null,
      stateA: { ...stateA }, stateB: { ...stateB },
      result: finalResult,
    }, opts));
  }

  snap({
    phase: 'start',
    desc: 'Start comparison at the roots of both trees.',
    lines: [1],
  });

  function recurse(pId, qId, path) {
    if (finalResult === false) return; // short-circuit (still emit reads though)

    const p = pId != null ? nodesA[pId] : null;
    const q = qId != null ? nodesB[qId] : null;
    const aLabel = p ? p.val : 'null';
    const bLabel = q ? q.val : 'null';

    // Step 1: enter — highlight active candidates
    if (p) stateA[pId] = 'active';
    if (q) stateB[qId] = 'active';
    snap({
      phase: 'enter',
      desc: `Visit ${path}: compare A=${aLabel} with B=${bLabel}.`,
      lines: [1],
      activeA: p ? pId : null,
      activeB: q ? qId : null,
    });

    // Step 2: null checks
    if (!p && !q) {
      snap({
        phase: 'null-match',
        desc: `Both sides null — this branch matches. Return True.`,
        lines: [2, 3],
        activeA: null, activeB: null,
      });
      return;
    }
    if (!p || !q) {
      if (p) stateA[pId] = 'mismatch';
      if (q) stateB[qId] = 'mismatch';
      finalResult = false;
      snap({
        phase: 'null-mismatch',
        desc: `One side is null, the other is ${p ? p.val : q.val} — structural mismatch. Return False.`,
        lines: [4, 5],
        activeA: p ? pId : null,
        activeB: q ? qId : null,
        result: false,
      });
      return;
    }

    // Both real — value check
    if (p.val !== q.val) {
      stateA[pId] = 'mismatch';
      stateB[qId] = 'mismatch';
      finalResult = false;
      snap({
        phase: 'value-mismatch',
        desc: `Values differ (${p.val} ≠ ${q.val}) — return False.`,
        lines: [6, 7],
        activeA: pId, activeB: qId,
        result: false,
      });
      return;
    }

    // Values match — mark matched, recurse
    stateA[pId] = 'matched';
    stateB[qId] = 'matched';
    snap({
      phase: 'value-match',
      desc: `Values match (${p.val} == ${q.val}) — recurse into both subtrees.`,
      lines: [6, 8, 9],
      activeA: pId, activeB: qId,
    });

    // mark visited (dimmed) before descending
    stateA[pId] = 'visited';
    stateB[qId] = 'visited';

    recurse(p.leftId,  q.leftId,  `${path}.left`);
    if (finalResult === false) return;
    recurse(p.rightId, q.rightId, `${path}.right`);
  }

  recurse(rootA ? rootA.id : null, rootB ? rootB.id : null, 'root');

  if (finalResult === null) finalResult = true;
  snap({
    phase: 'done',
    desc: finalResult ? 'Traversal complete — every node matched. Trees are the same.'
                      : 'Stopped early on first difference. Trees are NOT the same.',
    lines: finalResult ? [8, 9] : [],
    result: finalResult,
  });

  return out;
}

// ─── Build ──────────────────────────────────────────────────────────────────
function buildAndRun() {
  buildCodePanel();
  const a = parseTree(document.getElementById('inp-a').value);
  const b = parseTree(document.getElementById('inp-b').value);
  if (!a || !b) {
    document.getElementById('step-desc').textContent = 'Bad input — use JSON arrays like [1,2,3,null,4].';
    return;
  }
  treeA = a.root; nodesA = a.nodes;
  treeB = b.root; nodesB = b.nodes;

  renderTree('svg-A', treeA, nodesA);
  renderTree('svg-B', treeB, nodesB);

  steps = simulate(treeA, nodesA, treeB, nodesB);
  window.nav.load(steps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-a').value = d.treeA;
  document.getElementById('inp-b').value = d.treeB;
  buildAndRun();
}

function randomExample() {
  // Generate random but valid trees for Same Tree
  const generators = [
    // Identical matching trees
    () => {
      const size = Math.floor(Math.random() * 4) + 1;
      const arr = [];
      for (let i = 0; i < size; i++) arr.push(Math.floor(Math.random() * 9) + 1);
      return [arr, arr];
    },
    // Different structures
    () => {
      const arr1 = [1, 2, 3];
      const arr2 = [1, 3, 2];
      return [arr1, arr2];
    },
    // One empty
    () => {
      const arr = [Math.floor(Math.random() * 5) + 1];
      return [arr, []];
    },
    // Nulls at different positions
    () => {
      const arr1 = [1, 2, null, 4];
      const arr2 = [1, 2, 3, null];
      return [arr1, arr2];
    },
    // Single node matching
    () => {
      const val = Math.floor(Math.random() * 10) + 1;
      return [[val], [val]];
    },
  ];

  const choice = generators[Math.floor(Math.random() * generators.length)];
  const [treeA, treeB] = choice();
  document.getElementById('inp-a').value = JSON.stringify(treeA);
  document.getElementById('inp-b').value = JSON.stringify(treeB);
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ─── Apply step ─────────────────────────────────────────────────────────────
function applyStep(s, animate) {
  Object.entries(s.stateA).forEach(([id, st]) => setNodeColor('svg-A', id, st, animate));
  Object.entries(s.stateB).forEach(([id, st]) => setNodeColor('svg-B', id, st, animate));

  // Comparison panel chips
  const a = s.activeA != null ? nodesA[s.activeA] : null;
  const b = s.activeB != null ? nodesB[s.activeB] : null;
  const chipA = document.getElementById('cmp-a');
  const chipB = document.getElementById('cmp-b');
  chipA.textContent = a ? a.val : (s.activeA === null && s.phase !== 'start' ? '∅' : '—');
  chipB.textContent = b ? b.val : (s.activeB === null && s.phase !== 'start' ? '∅' : '—');
  chipA.classList.toggle('null', !a);
  chipB.classList.toggle('null', !b);

  // Verdict banner
  const v = document.getElementById('verdict');
  if (s.result === true)  { v.textContent = '✓ Trees are the same'; v.className = 'verdict ok'; }
  else if (s.result === false) { v.textContent = '✗ Trees differ';      v.className = 'verdict bad'; }
  else                     { v.textContent = 'running…';                 v.className = 'verdict'; }

  // Pulse the active nodes on real animations
  if (animate && s.activeA != null) pulseNode('svg-A', s.activeA, s.phase);
  if (animate && s.activeB != null) pulseNode('svg-B', s.activeB, s.phase);

  setCodeLines([], s.lines, animate);
}

function pulseNode(svgId, id, phase) {
  const g = document.getElementById(`g-${svgId}-${id}`);
  if (!g) return;
  if (phase === 'value-mismatch' || phase === 'null-mismatch') {
    gsap.fromTo(g, { x: -3 }, { x: 3, repeat: 5, yoyo: true, duration: 0.05, onComplete: () => gsap.set(g, { x: 0 }) });
  } else {
    gsap.fromTo(g, { scale: 1 }, { scale: 1.15, yoyo: true, repeat: 1, duration: 0.18, transformOrigin: 'center', svgOrigin: getCenter(svgId, id) });
  }
}
function getCenter(svgId, id) {
  const c = document.getElementById(`nc-${svgId}-${id}`);
  if (!c) return '0 0';
  return `${c.getAttribute('cx')} ${c.getAttribute('cy')}`;
}

// ─── Code line highlight ─────────────────────────────────────────────────────
const HL_BG   = 'rgba(var(--orange-ch),0.13)';
const HL_BORD = 'var(--orange)';

let activeLines = [];
function setCodeLines(_unused, newLines, animate) {
  const DUR = 0.22;
  activeLines.filter(n => !newLines.includes(n)).forEach(n => {
    const el = document.getElementById(`cl-${n}`);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: 'rgba(0,0,0,0)', borderLeftColor: 'transparent', duration: DUR });
      gsap.to(el.querySelector('.ln'), { color: '#3d4468', duration: DUR });
    } else {
      el.style.backgroundColor = '';
      el.style.borderLeftColor = '';
      const ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  newLines.filter(n => !activeLines.includes(n)).forEach(n => {
    const el = document.getElementById(`cl-${n}`);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.06 });
      gsap.to(el.querySelector('.ln'), { color: 'var(--orange)', duration: DUR, delay: 0.06 });
    } else {
      el.style.backgroundColor = HL_BG;
      el.style.borderLeftColor = HL_BORD;
      const ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--orange)';
    }
  });
  if (newLines.length) {
    const el = document.getElementById(`cl-${newLines[0]}`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  activeLines = newLines.slice();
}

// ─── Node color ──────────────────────────────────────────────────────────────
function setNodeColor(svgId, id, state, animate, dur = 0.28) {
  const c = COLORS[state] || COLORS.idle;
  const nc = document.getElementById(`nc-${svgId}-${id}`);
  const nt = document.getElementById(`nt-${svgId}-${id}`);
  if (!nc) return;
  // phantom nodes stay dashed/null styling — only update real circles
  if (nc.getAttribute('stroke-dasharray') === '2 2') return;
  if (animate) {
    gsap.to(nc, { duration: dur, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke } });
    gsap.to(nt, { duration: dur, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke);
    nt.setAttribute('fill', c.text);
  }
}

// ─── Status ──────────────────────────────────────────────────────────────────
function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  var desc = document.getElementById('step-desc');
  if (desc) desc.textContent = snap.desc;
}

// ─── Init ────────────────────────────────────────────────────────────────────
window.nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    updateStatus(snap, cur, total);
  }
});

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.goTo(0);
});

buildAndRun();

// ─── Resize handle ───────────────────────────────────────────────────────────
(function(){
  var h=document.getElementById('resize-handle'),p=document.getElementById('code-panel'),d=false,sx=0,sw=0;
  h.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('dragging');e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!d)return;p.style.width=Math.min(560,Math.max(120,sw+(sx-e.clientX)))+'px';});
  document.addEventListener('mouseup',function(){if(!d)return;d=false;h.classList.remove('dragging');});
})();
</script>
