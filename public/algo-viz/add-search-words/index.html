<script>
// ─── Default operations ────────────────────────────────────────────────────────
var DEFAULT_OPERATIONS = [
  { type: 'addWord', word: 'bad' },
  { type: 'addWord', word: 'dad' },
  { type: 'addWord', word: 'mad' },
  { type: 'search',  word: 'pad', expected: false },
  { type: 'search',  word: 'bad', expected: true  },
  { type: 'search',  word: '.ad', expected: true  },
  { type: 'search',  word: 'b..', expected: true  },
];
var OPERATIONS = DEFAULT_OPERATIONS.slice();

// ─── Colors ───────────────────────────────────────────────────────────────────
var C = {
  hidden:    { fill: '#0d1020', stroke: '#1a1d2e', text: '#1e2335' },
  idle:      { fill: '#1e2130', stroke: '#2d3148', text: '#a9b1d6' },
  path:      { fill: '#1e1a3a', stroke: '#6366f1', text: '#b4c6fc' },
  active:    { fill: '#4338ca', stroke: '#818cf8', text: '#ffffff' },
  wildcard:  { fill: '#0d3030', stroke: '#0ea5e9', text: '#7dd3fc' },
  found:     { fill: '#052e16', stroke: '#16a34a', text: '#4ade80' },
  not_found: { fill: '#3b0a0a', stroke: '#dc2626', text: '#fca5a5' },
};

var EDGE = {
  hidden:    { stroke: '#1a1d2e', opacity: '0.25' },
  idle:      { stroke: '#2d3148', opacity: '1' },
  path:      { stroke: '#6366f1', opacity: '1' },
  wildcard:  { stroke: '#0ea5e9', opacity: '1' },
  found:     { stroke: '#16a34a', opacity: '1' },
  not_found: { stroke: '#dc2626', opacity: '1' },
};

// ─── Code lines ───────────────────────────────────────────────────────────────
var CODE_LINES = [
  [1,  '<span class="kw">class</span> <span class="fn">TrieNode</span><span class="op">:</span>'],
  [2,  '    <span class="kw">def</span> <span class="fn">__init__</span><span class="op">(</span>self<span class="op">):</span>'],
  [3,  '        self.children <span class="op">=</span> <span class="op">{}</span>'],
  [4,  '        self.is_end <span class="op">=</span> <span class="bi">False</span>'],
  [0,  ''],
  [6,  '<span class="kw">class</span> <span class="fn">WordDictionary</span><span class="op">:</span>'],
  [7,  '    <span class="kw">def</span> <span class="fn">__init__</span><span class="op">(</span>self<span class="op">):</span>'],
  [8,  '        self.root <span class="op">=</span> TrieNode<span class="op">()</span>'],
  [0,  ''],
  [10, '    <span class="kw">def</span> <span class="fn">addWord</span><span class="op">(</span>self<span class="op">,</span> word<span class="op">):</span>'],
  [11, '        node <span class="op">=</span> self.root'],
  [12, '        <span class="kw">for</span> ch <span class="kw">in</span> word<span class="op">:</span>'],
  [13, '            <span class="kw">if</span> ch <span class="kw">not in</span> node.children<span class="op">:</span>'],
  [14, '                node.children<span class="op">[</span>ch<span class="op">]</span> <span class="op">=</span> TrieNode<span class="op">()</span>'],
  [15, '            node <span class="op">=</span> node.children<span class="op">[</span>ch<span class="op">]</span>'],
  [16, '        node.is_end <span class="op">=</span> <span class="bi">True</span>'],
  [0,  ''],
  [18, '    <span class="kw">def</span> <span class="fn">search</span><span class="op">(</span>self<span class="op">,</span> word<span class="op">):</span>'],
  [19, '        <span class="kw">def</span> <span class="fn">dfs</span><span class="op">(</span>node<span class="op">,</span> i<span class="op">):</span>'],
  [20, '            <span class="kw">if</span> i <span class="op">==</span> <span class="bi">len</span><span class="op">(</span>word<span class="op">):</span>'],
  [21, '                <span class="kw">return</span> node.is_end'],
  [22, '            ch <span class="op">=</span> word<span class="op">[</span>i<span class="op">]</span>'],
  [23, '            <span class="kw">if</span> ch <span class="op">==</span> <span class="str">"."</span><span class="op">:</span>'],
  [24, '                <span class="kw">for</span> child <span class="kw">in</span> node.children.values<span class="op">():</span>'],
  [25, '                    <span class="kw">if</span> <span class="fn">dfs</span><span class="op">(</span>child<span class="op">,</span> i <span class="op">+</span> <span class="bi">1</span><span class="op">):</span>'],
  [26, '                        <span class="kw">return</span> <span class="bi">True</span>'],
  [27, '                <span class="kw">return</span> <span class="bi">False</span>'],
  [28, '            <span class="kw">if</span> ch <span class="kw">not in</span> node.children<span class="op">:</span>'],
  [29, '                <span class="kw">return</span> <span class="bi">False</span>'],
  [30, '            <span class="kw">return</span> <span class="fn">dfs</span><span class="op">(</span>node.children<span class="op">[</span>ch<span class="op">]</span><span class="op">,</span> i <span class="op">+</span> <span class="bi">1</span><span class="op">)</span>'],
  [31, '        <span class="kw">return</span> <span class="fn">dfs</span><span class="op">(</span>self.root<span class="op">,</span> <span class="bi">0</span><span class="op">)</span>'],
];

// ─── Trie build ───────────────────────────────────────────────────────────────
var nextId = 0;
var nodeMap = {};
var trieRoot = null;

function makeNode(ch, parent) {
  var n = {
    id: nextId++,
    char: ch,
    children: {},
    parent: parent || null,
    depth: parent ? parent.depth + 1 : 0,
    x: 0, y: 0,
  };
  nodeMap[n.id] = n;
  return n;
}

function buildTrie() {
  nextId = 0;
  nodeMap = {};
  trieRoot = makeNode('·', null);

  OPERATIONS.filter(function(op) { return op.type === 'addWord'; }).forEach(function(op) {
    var node = trieRoot;
    op.word.split('').forEach(function(ch) {
      if (!node.children[ch]) {
        node.children[ch] = makeNode(ch, node);
      }
      node = node.children[ch];
    });
  });
}

// ─── Layout ───────────────────────────────────────────────────────────────────
var R = 22;
var LEVEL_H = 74;
var PAD_X = 55;
var PAD_Y = 42;

function layout() {
  var leafIdx = 0;

  function postOrder(node) {
    var keys = Object.keys(node.children).sort();
    if (!keys.length) { node._xIdx = leafIdx++; return; }
    keys.forEach(function(k) { postOrder(node.children[k]); });
    var first = node.children[keys[0]]._xIdx;
    var last  = node.children[keys[keys.length - 1]]._xIdx;
    node._xIdx = (first + last) / 2;
  }
  postOrder(trieRoot);

  var leafCount  = Math.max(1, leafIdx);
  var xSpacing   = Math.min(100, Math.max(72, 520 / leafCount));
  var maxDepth   = Object.values(nodeMap).reduce(function(m, n) { return Math.max(m, n.depth); }, 0);
  var VW = Math.max(300, PAD_X * 2 + (leafCount - 1) * xSpacing);
  var VH = PAD_Y * 2 + maxDepth * LEVEL_H + R + 10;
  var startX = VW / 2 - (leafCount - 1) * xSpacing / 2;

  function setCoords(node) {
    node.x = startX + node._xIdx * xSpacing;
    node.y = PAD_Y + node.depth * LEVEL_H;
    Object.keys(node.children).sort().forEach(function(k) { setCoords(node.children[k]); });
  }
  setCoords(trieRoot);
  return { VW: VW, VH: VH };
}

// ─── SVG render ───────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

function renderSVG(dims) {
  var svg = document.getElementById('trie-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 ' + dims.VW + ' ' + dims.VH);

  var edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeG.id = 'edges';
  var nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeG.id = 'nodes';
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  Object.values(nodeMap).forEach(function(n) {
    if (n.parent) {
      edgeG.appendChild(svgEl('line', {
        id: 'edge-' + n.id,
        x1: n.parent.x, y1: n.parent.y,
        x2: n.x, y2: n.y,
        stroke: EDGE.hidden.stroke,
        'stroke-width': 2.5,
        'stroke-linecap': 'round',
        opacity: EDGE.hidden.opacity,
      }));

      // Edge label — char at 40% along edge, offset perpendicularly
      var mx = n.parent.x + (n.x - n.parent.x) * 0.4;
      var my = n.parent.y + (n.y - n.parent.y) * 0.4;
      var dx = n.x - n.parent.x;
      var dy = n.y - n.parent.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var ox = (-dy / len) * 9;
      var oy = (dx / len) * 9;
      edgeG.appendChild(svgEl('text', {
        id: 'elabel-' + n.id,
        x: mx + ox, y: my + oy,
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        fill: '#3d4468',
        'font-size': '11',
        'font-weight': '600',
        'font-family': 'JetBrains Mono, Fira Code, monospace',
      }));
      document.getElementById
        ? (function() {
            var el = edgeG.lastChild;
            el.textContent = n.char;
          })()
        : null;
    }

    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'ng-' + n.id;

    g.appendChild(svgEl('circle', {
      id: 'nc-' + n.id,
      cx: n.x, cy: n.y, r: R,
      fill: C.hidden.fill, stroke: C.hidden.stroke, 'stroke-width': 2.5,
    }));

    var innerRing = svgEl('circle', {
      id: 'ni-' + n.id,
      cx: n.x, cy: n.y, r: R - 7,
      fill: 'none', stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 1.5,
    });
    innerRing.style.display = 'none';
    g.appendChild(innerRing);

    var t = svgEl('text', {
      id: 'nt-' + n.id,
      x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: C.hidden.text,
      'font-size': Math.round(R * 0.78),
      'font-weight': '700',
      'font-family': 'Segoe UI, system-ui, sans-serif',
    });
    t.textContent = n.char;
    g.appendChild(t);
    nodeG.appendChild(g);
  });
}

// ─── Simulation ───────────────────────────────────────────────────────────────
function simulate() {
  var steps = [];
  var existsMap = {};
  var isEndMap  = {};

  Object.values(nodeMap).forEach(function(n) {
    existsMap[n.id] = (n.id === trieRoot.id);
    isEndMap[n.id]  = false;
  });

  function makeNS(base) {
    var ns = {};
    Object.values(nodeMap).forEach(function(n) {
      ns[n.id] = existsMap[n.id] ? base : 'hidden';
    });
    return ns;
  }

  function snap(phase, desc, opIdx, nodeStates, resultState, codeLines) {
    steps.push({
      phase: phase,
      desc: desc,
      opIdx: opIdx !== undefined ? opIdx : -1,
      existsMap: Object.assign({}, existsMap),
      isEndMap:  Object.assign({}, isEndMap),
      nodeStates: Object.assign({}, nodeStates),
      resultState: resultState || null,
      codeLines: codeLines || [],
    });
  }

  var ns0 = makeNS('hidden');
  ns0[trieRoot.id] = 'active';
  snap('Start', 'WordDictionary initialized — empty trie with root node.', -1, ns0, null, []);

  OPERATIONS.forEach(function(op, opIdx) {

    if (op.type === 'addWord') {
      var word = op.word;

      var nsInit = makeNS('idle');
      nsInit[trieRoot.id] = 'active';
      snap('addWord("' + word + '")', 'addWord("' + word + '"): node = self.root', opIdx, nsInit, null, [10, 11]);

      var node = trieRoot;
      var pathIds = [trieRoot.id];

      word.split('').forEach(function(ch) {
        var child = node.children[ch];
        var existed = existsMap[child.id];

        if (!existed) {
          existsMap[child.id] = true;
          var ns2 = makeNS('idle');
          pathIds.forEach(function(id) { ns2[id] = 'path'; });
          ns2[child.id] = 'active';
          snap('addWord("' + word + '")', "ch='" + ch + "': not in children → create TrieNode()", opIdx, ns2, null, [12, 13, 14]);
        } else {
          var ns2 = makeNS('idle');
          pathIds.forEach(function(id) { ns2[id] = 'path'; });
          ns2[child.id] = 'active';
          snap('addWord("' + word + '")', "ch='" + ch + "': already in children → follow", opIdx, ns2, null, [12, 13, 15]);
        }

        node = child;
        pathIds.push(node.id);
      });

      isEndMap[node.id] = true;
      var nsEnd = makeNS('idle');
      pathIds.forEach(function(id, i) {
        nsEnd[id] = i === pathIds.length - 1 ? 'found' : 'path';
      });
      snap('addWord("' + word + '")', 'End of "' + word + '" — set node.is_end = True.', opIdx, nsEnd, null, [16]);

    } else if (op.type === 'search') {
      var word = op.word;

      var nsInit = makeNS('idle');
      nsInit[trieRoot.id] = 'active';
      snap('search("' + word + '")', 'search("' + word + '"): call dfs(root, 0)', opIdx, nsInit, null, [18, 19, 31]);

      (function() {
        function dfs(node, depth, pathIds) {
          if (depth === word.length) {
            var result = isEndMap[node.id];
            var ns = makeNS('idle');
            pathIds.forEach(function(id, i) {
              ns[id] = i === pathIds.length - 1 ? (result ? 'found' : 'not_found') : 'path';
            });
            snap(
              'search("' + word + '")',
              'i == len(word): return node.is_end = ' + result,
              opIdx, ns, result ? 'found' : 'not_found', [20, 21]
            );
            return result;
          }

          var ch = word[depth];

          if (ch === '.') {
            var childKeys = Object.keys(node.children).sort().filter(function(k) {
              return existsMap[node.children[k].id];
            });

            if (!childKeys.length) {
              var ns = makeNS('idle');
              pathIds.forEach(function(id, i) {
                ns[id] = i === pathIds.length - 1 ? 'not_found' : 'path';
              });
              snap(
                'search("' + word + '")',
                "ch='.': no children → return False",
                opIdx, ns, 'not_found', [23, 24, 27]
              );
              return false;
            }

            // Wildcard fan-out: show all children as candidates
            var nsFan = makeNS('idle');
            pathIds.forEach(function(id) { nsFan[id] = 'path'; });
            childKeys.forEach(function(k) { nsFan[node.children[k].id] = 'wildcard'; });
            snap(
              'search("' + word + '")',
              "ch='.': wildcard — fan out to " + childKeys.length + " child" + (childKeys.length > 1 ? 'ren' : '') + " [" + childKeys.join(', ') + "]",
              opIdx, nsFan, null, [22, 23, 24]
            );

            var found = false;
            for (var i = 0; i < childKeys.length && !found; i++) {
              var childNode = node.children[childKeys[i]];
              var newPath = pathIds.concat([childNode.id]);

              var nsTry = makeNS('idle');
              newPath.forEach(function(id, j) {
                nsTry[id] = j === newPath.length - 1 ? 'active' : 'path';
              });
              snap(
                'search("' + word + '")',
                "ch='.': try branch '" + childKeys[i] + "' → dfs(" + childKeys[i] + ", " + (depth + 1) + ")",
                opIdx, nsTry, null, [24, 25]
              );

              found = dfs(childNode, depth + 1, newPath);
            }

            if (!found) {
              var nsNoMatch = makeNS('idle');
              pathIds.forEach(function(id, i) {
                nsNoMatch[id] = i === pathIds.length - 1 ? 'not_found' : 'path';
              });
              snap(
                'search("' + word + '")',
                "ch='.': all branches exhausted → return False",
                opIdx, nsNoMatch, 'not_found', [27]
              );
            }

            return found;

          } else {
            if (!node.children[ch] || !existsMap[node.children[ch].id]) {
              var ns = makeNS('idle');
              pathIds.forEach(function(id, i) {
                ns[id] = i === pathIds.length - 1 ? 'not_found' : 'path';
              });
              snap(
                'search("' + word + '")',
                "ch='" + ch + "': not in children → return False",
                opIdx, ns, 'not_found', [28, 29]
              );
              return false;
            }

            var childNode = node.children[ch];
            var newPath = pathIds.concat([childNode.id]);
            var ns = makeNS('idle');
            newPath.forEach(function(id, j) {
              ns[id] = j === newPath.length - 1 ? 'active' : 'path';
            });
            snap(
              'search("' + word + '")',
              "ch='" + ch + "': found → dfs(children['" + ch + "'], " + (depth + 1) + ")",
              opIdx, ns, null, [28, 30]
            );

            return dfs(childNode, depth + 1, newPath);
          }
        }

        dfs(trieRoot, 0, [trieRoot.id]);
      })();
    }
  });

  snap('Done', 'All operations complete.', -1, makeNS('idle'), null, []);
  return steps;
}

// ─── Apply step ───────────────────────────────────────────────────────────────
var prevCodeLines = [];

function applyStep(step, animate) {
  Object.values(nodeMap).forEach(function(n) {
    var state = !step.existsMap[n.id] ? 'hidden' : (step.nodeStates[n.id] || 'idle');
    setNodeColor(n.id, state, animate);
    setIsEnd(n.id, step.isEndMap[n.id]);
    setEdgeLabelColor(n.id, state, animate);
  });

  Object.values(nodeMap).forEach(function(n) {
    if (!n.parent) return;
    setEdgeColor(n.id, step, animate);
  });

  setCodeLines(prevCodeLines, step.codeLines, animate);
  prevCodeLines = step.codeLines || [];
  updateOpsList(step.opIdx);
  updateResultBadge(step);
}

function setNodeColor(id, state, animate) {
  var c  = C[state] || C.idle;
  var nc = document.getElementById('nc-' + id);
  var nt = document.getElementById('nt-' + id);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: 0.25, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke } });
    if (nt) gsap.to(nt, { duration: 0.25, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill);
    nc.setAttribute('stroke', c.stroke);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

function setIsEnd(id, isEnd) {
  var ni = document.getElementById('ni-' + id);
  if (!ni) return;
  ni.style.display = isEnd ? '' : 'none';
}

function setEdgeLabelColor(id, state, animate) {
  var el = document.getElementById('elabel-' + id);
  if (!el) return;
  var col = state === 'hidden'   ? '#1a1d2e'
           : state === 'wildcard' ? '#0ea5e9'
           : (state === 'path' || state === 'active' || state === 'found' || state === 'not_found') ? '#6366f1'
           : '#3d4468';
  if (animate) {
    gsap.to(el, { duration: 0.25, attr: { fill: col } });
  } else {
    el.setAttribute('fill', col);
  }
}

function setEdgeColor(childId, step, animate) {
  var edge = document.getElementById('edge-' + childId);
  if (!edge) return;

  var n = nodeMap[childId];
  if (!step.existsMap[n.parent.id] || !step.existsMap[childId]) {
    applyEdge(edge, EDGE.hidden.stroke, EDGE.hidden.opacity, animate);
    return;
  }

  var state = step.nodeStates[childId] || 'idle';
  var stroke, opacity;

  if (state === 'hidden') {
    stroke = EDGE.hidden.stroke; opacity = EDGE.hidden.opacity;
  } else if (state === 'found') {
    stroke = EDGE.found.stroke; opacity = '1';
  } else if (state === 'not_found') {
    stroke = EDGE.not_found.stroke; opacity = '1';
  } else if (state === 'wildcard') {
    stroke = EDGE.wildcard.stroke; opacity = '1';
  } else if (state === 'path' || state === 'active') {
    stroke = EDGE.path.stroke; opacity = '1';
  } else {
    stroke = EDGE.idle.stroke; opacity = '1';
  }

  applyEdge(edge, stroke, opacity, animate);
}

function applyEdge(edge, stroke, opacity, animate) {
  if (animate) {
    gsap.to(edge, { duration: 0.25, attr: { stroke: stroke, opacity: opacity } });
  } else {
    edge.setAttribute('stroke', stroke);
    edge.setAttribute('opacity', opacity);
  }
}

// ─── Code highlighting ────────────────────────────────────────────────────────
var HL_BG   = 'rgba(255,158,100,0.13)';
var HL_NONE = 'rgba(255,158,100,0)';
var HL_BORD = 'var(--orange)';
var NO_BORD = 'transparent';

function setCodeLines(oldLines, newLines, animate) {
  var DUR = 0.2;

  oldLines.filter(function(n) { return newLines.indexOf(n) === -1; }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_NONE, borderLeftColor: NO_BORD, duration: DUR });
      var ln = el.querySelector('.ln');
      if (ln) gsap.to(ln, { color: '#3d4468', duration: DUR });
    } else {
      el.style.backgroundColor = '';
      el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln');
      if (ln) ln.style.color = '';
    }
  });

  newLines.filter(function(n) { return oldLines.indexOf(n) === -1; }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.05 });
      var ln = el.querySelector('.ln');
      if (ln) gsap.to(ln, { color: 'var(--orange)', duration: DUR, delay: 0.05 });
    } else {
      el.style.backgroundColor = HL_BG;
      el.style.borderLeftColor = HL_BORD;
      var ln = el.querySelector('.ln');
      if (ln) ln.style.color = 'var(--orange)';
    }
  });

  if (newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ─── Operations list ──────────────────────────────────────────────────────────
function buildOpsList() {
  var list = document.getElementById('op-list');
  list.innerHTML = '';
  OPERATIONS.forEach(function(op, i) {
    var div = document.createElement('div');
    div.className = 'op-item';
    div.id = 'op-' + i;

    var icon = document.createElement('span');
    icon.className = 'op-icon';
    icon.textContent = '○';

    var typeSpan = document.createElement('span');
    typeSpan.className = 'op-type t-' + op.type;
    typeSpan.textContent = op.type;

    var wordSpan = document.createElement('span');
    wordSpan.textContent = '("' + op.word + '")';

    div.appendChild(icon);
    div.appendChild(typeSpan);
    div.appendChild(wordSpan);

    if (op.type === 'search' && op.expected !== undefined) {
      var res = document.createElement('span');
      res.className = 'op-result ' + (op.expected ? 'r-true' : 'r-false');
      res.textContent = '→ ' + op.expected;
      div.appendChild(res);
    }

    list.appendChild(div);
  });
}

function updateOpsList(opIdx) {
  OPERATIONS.forEach(function(_, i) {
    var item = document.getElementById('op-' + i);
    if (!item) return;
    var icon = item.querySelector('.op-icon');
    item.className = 'op-item';
    icon.textContent = '○';
    if (i < opIdx)      { item.classList.add('done');    icon.textContent = '✓'; }
    else if (i === opIdx) { item.classList.add('current'); icon.textContent = '→'; }
  });
}

// ─── Result badge ─────────────────────────────────────────────────────────────
function updateResultBadge(step) {
  var badge = document.getElementById('result-badge');
  badge.className = 'result-badge';
  badge.textContent = '';
  if (step.resultState === 'found') {
    badge.classList.add('found');
    badge.textContent = 'True — found';
  } else if (step.resultState === 'not_found') {
    badge.classList.add('fail');
    badge.textContent = 'False — not found';
  }
}

// ─── Code panel ───────────────────────────────────────────────────────────────
function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(function(entry) {
    var ln = entry[0], html = entry[1];
    var row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML =
      '<span class="ln">' + (ln > 0 ? ln : '') + '</span>' +
      '<span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

// ─── Rebuild ──────────────────────────────────────────────────────────────────
var nav;

function rebuild() {
  buildTrie();
  var dims = layout();
  renderSVG(dims);

  // Set edge label text after render
  Object.values(nodeMap).forEach(function(n) {
    if (!n.parent) return;
    var el = document.getElementById('elabel-' + n.id);
    if (el) el.textContent = n.char;
  });

  buildCodePanel();
  buildOpsList();
  prevCodeLines = [];
  var steps = simulate();
  nav.load(steps);
}

// ─── Interactive controls ─────────────────────────────────────────────────────
function handleAddWord() {
  var input = document.getElementById('add-input');
  var word = input.value.trim().toLowerCase().replace(/[^a-z]/g, '');
  if (!word) return;
  OPERATIONS.push({ type: 'addWord', word: word });
  input.value = '';
  rebuild();
}

function handleSearch() {
  var input = document.getElementById('search-input');
  var word = input.value.trim().toLowerCase().replace(/[^a-z.]/g, '');
  if (!word) return;
  OPERATIONS.push({ type: 'search', word: word });
  input.value = '';
  rebuild();
}

function handleReset() {
  OPERATIONS = DEFAULT_OPERATIONS.slice();
  rebuild();
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
nav = VizNav({
  btnPrev: document.getElementById('btn-back'),
  btnNext: document.getElementById('btn-next'),
  btnPlay: document.getElementById('btn-play'),
  speedSel: document.getElementById('speed-select'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var phaseEl = document.getElementById('phase-label');
    var descEl  = document.getElementById('step-desc');
    if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
    if (descEl)  descEl.textContent  = snap.desc;
  }
});

document.getElementById('btn-add-word').addEventListener('click', handleAddWord);
document.getElementById('btn-search-word').addEventListener('click', handleSearch);
document.getElementById('btn-reset').addEventListener('click', handleReset);
document.getElementById('add-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleAddWord();
});
document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleSearch();
});

rebuild();
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
</body>
