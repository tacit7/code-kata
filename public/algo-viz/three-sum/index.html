function randomExample() {
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
  const min = -50, max = 50;
  const count = Math.floor(Math.random() * 5) + 4; // 4-8 numbers
  const nums = [];
  for (let i = 0; i < count; i++) {
    nums.push(Math.floor(Math.random() * (max - min + 1)) + min);
  }
  document.getElementById('inp-nums').value = nums.join(',');
  buildAndRun();
}

</script>

function randomExample() {

  <style>

<script>
var nav;
var currentNums = [];
var allSteps = [];
var currentStep = null;

// ── Presets ────────────────────────────────────────────────────────────────
const presets = [
  { name: "Example", nums: [-1, 0, 1, 2, -1, -4] },
  { name: "All zeros", nums: [0, 0, 0, 0] },
  { name: "No triplets", nums: [1, 2, -2, -1] },
  { name: "Duplicates", nums: [-4, -2, -2, -1, 0, 1, 2, 2, 3] },
];

function loadPreset(idx, btn) {
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const p = presets[idx];
  document.getElementById('inp-nums').value = p.nums.join(',');
  buildAndRun();
}

// ── Simulate 3Sum ────────────────────────────────────────────────────────────
function simulate(nums) {
  const steps = [];
  const sorted = [...nums].sort((a,b) => a - b);
  const result = [];

  // Step 0: initial
  steps.push({
    phase: 'Start',
    desc: 'Array sorted. Initialize outer loop.',
    i: -1, l: -1, r: -1, sum: null,
    triplets: [],
    lines: [1, 2]
  });

  for (let i = 0; i < sorted.length - 2; i++) {
    // Skip duplicates in i
    if (i > 0 && sorted[i] === sorted[i-1]) {
      steps.push({
        phase: `i=${i} (skip dup)`,
        desc: `nums[${i}] = ${sorted[i]} already processed, skip.`,
        i, l: -1, r: -1, sum: null,
        triplets: [...result],
        lines: [4, 5]
      });
      continue;
    }

    // Start inner loop for this i
    steps.push({
      phase: `i=${i}`,
      desc: `Fixed nums[i]=${sorted[i]}. Start two-pointer search from i+1 to n-1.`,
      i, l: i + 1, r: sorted.length - 1, sum: null,
      triplets: [...result],
      lines: [6, 7]
    });

    let l = i + 1, r = sorted.length - 1;
    while (l < r) {
      const s = sorted[i] + sorted[l] + sorted[r];

      steps.push({
        phase: `i=${i}, l=${l}, r=${r}`,
        desc: `Calculate: ${sorted[i]} + ${sorted[l]} + ${sorted[r]} = ${s}`,
        i, l, r, sum: s,
        triplets: [...result],
        lines: [8, 9]
      });

      if (s === 0) {
        // Found triplet
        result.push([sorted[i], sorted[l], sorted[r]]);

        steps.push({
          phase: `Found!`,
          desc: `Sum = 0. Add triplet [${sorted[i]}, ${sorted[l]}, ${sorted[r]}] to result.`,
          i, l, r, sum: s,
          triplets: [...result],
          lines: [10, 11]
        });

        // Skip duplicates for l
        while (l < r && sorted[l] === sorted[l+1]) {
          l++;
          steps.push({
            phase: `Skip l dup`,
            desc: `nums[${l}] = ${sorted[l]} duplicate, skip.`,
            i, l, r, sum: s,
            triplets: [...result],
            lines: [12, 13]
          });
        }

        // Skip duplicates for r
        while (l < r && sorted[r] === sorted[r-1]) {
          r--;
          steps.push({
            phase: `Skip r dup`,
            desc: `nums[${r}] = ${sorted[r]} duplicate, skip.`,
            i, l, r, sum: s,
            triplets: [...result],
            lines: [14, 15]
          });
        }

        l++;
        r--;

        steps.push({
          phase: `Move pointers`,
          desc: `Move l right and r left to search for more triplets.`,
          i, l, r, sum: null,
          triplets: [...result],
          lines: [16, 17]
        });
      } else if (s < 0) {
        l++;
        steps.push({
          phase: `s < 0`,
          desc: `Sum too small. Move l right to increase sum.`,
          i, l, r, sum: s,
          triplets: [...result],
          lines: [18, 19]
        });
      } else {
        r--;
        steps.push({
          phase: `s > 0`,
          desc: `Sum too large. Move r left to decrease sum.`,
          i, l, r, sum: s,
          triplets: [...result],
          lines: [20, 21]
        });
      }
    }
  }

  // Final
  steps.push({
    phase: 'Done',
    desc: `Found ${result.length} triplet${result.length === 1 ? '' : 's'}.`,
    i: -1, l: -1, r: -1, sum: null,
    triplets: result,
    lines: [22]
  });

  return steps;
}

// ── Build & Run ────────────────────────────────────────────────────────────
function buildAndRun() {
  const raw = document.getElementById('inp-nums').value
    .split(',')
    .map(s => parseInt(s.trim()))
    .filter(n => !isNaN(n));

  if (raw.length < 3) {
    alert('Need at least 3 numbers');
    return;
  }

  currentNums = raw;
  allSteps = simulate(currentNums);
  nav.load(allSteps);
}

// ── Rendering ────────────────────────────────────────────────────────────────
function applyStep(snap, animate) {
  currentStep = snap;

  // Update phase & description
  document.getElementById('phase-label').textContent = snap.phase || '—';
  document.getElementById('step-desc').textContent = snap.desc || '';

  // Draw sorted array with pointer highlights
  const sorted = [...currentNums].sort((a,b) => a - b);
  const row = document.getElementById('array-row');
  row.innerHTML = '';

  sorted.forEach((val, idx) => {
    const cell = document.createElement('div');
    cell.className = 'array-cell';
    cell.style.marginBottom = '20px'; // space for labels

    let isI = idx === snap.i;
    let isL = idx === snap.l;
    let isR = idx === snap.r;

    if (isI && isL && isR) cell.classList.add('ilr-ptr');
    else if (isI && isL) cell.classList.add('il-ptr');
    else if (isI && isR) cell.classList.add('ir-ptr');
    else if (isL && isR) cell.classList.add('lr-ptr');
    else if (isI) cell.classList.add('i-ptr');
    else if (isL) cell.classList.add('l-ptr');
    else if (isR) cell.classList.add('r-ptr');

    cell.textContent = val;

    // Add pointer labels
    if (isI) {
      const lbl = document.createElement('div');
      lbl.className = 'pointer-label label-i';
      lbl.textContent = 'i';
      cell.appendChild(lbl);
    }
    if (isL) {
      const lbl = document.createElement('div');
      lbl.className = 'pointer-label label-l';
      lbl.textContent = 'l';
      cell.appendChild(lbl);
    }
    if (isR) {
      const lbl = document.createElement('div');
      lbl.className = 'pointer-label label-r';
      lbl.textContent = 'r';
      cell.appendChild(lbl);
    }

    row.appendChild(cell);
  });

  // Update variables
  document.getElementById('vv-i').textContent = snap.i >= 0 ? snap.i : '—';
  document.getElementById('vv-l').textContent = snap.l >= 0 ? snap.l : '—';
  document.getElementById('vv-r').textContent = snap.r >= 0 ? snap.r : '—';
  document.getElementById('vv-sum').textContent = snap.sum !== null ? snap.sum : '—';

  // Update sum display
  const sumDisp = document.getElementById('sum-display');
  if (snap.i >= 0 && snap.l >= 0 && snap.r >= 0 && snap.sum !== null) {
    const i_val = sorted[snap.i];
    const l_val = sorted[snap.l];
    const r_val = sorted[snap.r];
    sumDisp.textContent = `${i_val} + ${l_val} + ${r_val} = ${snap.sum}`;
  } else {
    sumDisp.textContent = 'nums[i] + nums[l] + nums[r] = ?';
  }

  // Update sum badge
  const badge = document.getElementById('sum-badge');
  badge.className = 'sum-badge';
  if (snap.sum === 0) {
    badge.classList.add('found');
    badge.textContent = '✓ Found';
  } else if (snap.sum !== null && snap.sum < 0) {
    badge.classList.add('low');
    badge.textContent = 'Too small ↑';
  } else if (snap.sum !== null && snap.sum > 0) {
    badge.classList.add('high');
    badge.textContent = 'Too large ↓';
  }

  // Update triplets
  const tripRow = document.getElementById('triplets-row');
  if (snap.triplets.length === 0) {
    tripRow.innerHTML = '<span class="no-triplets">None yet</span>';
  } else {
    tripRow.innerHTML = snap.triplets
      .map(t => `<div class="triplet-chip">[${t[0]}, ${t[1]}, ${t[2]}]</div>`)
      .join('');
  }

  // Code highlighting
  setCodeLines(snap.lines || []);
}

function setCodeLines(activeLines) {
  document.querySelectorAll('.code-line').forEach((el, idx) => {
    if (activeLines.includes(idx + 1)) {
      el.classList.add('hl');
    } else {
      el.classList.remove('hl');
    }
  });
}

// ── Initialize ────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  // Setup VizNav
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
    }
  });

  // Setup code panel
  const codeLines = [
    `<span class="kw">def</span> <span class="fn">three_sum</span>(<span class="nb">nums</span>):`,
    `&nbsp;&nbsp;<span class="nb">nums</span>.<span class="fn">sort</span>()`,
    `&nbsp;&nbsp;<span class="nb">result</span> = []`,
    `&nbsp;&nbsp;<span class="kw">for</span> <span class="bi">i</span> <span class="kw">in</span> <span class="fn">range</span>(<span class="fn">len</span>(<span class="nb">nums</span>) - 2):`,
    `&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="bi">i</span> > 0 <span class="op">and</span> <span class="nb">nums</span>[<span class="bi">i</span>] == <span class="nb">nums</span>[<span class="bi">i</span>-1]:`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">continue</span>`,
    `&nbsp;&nbsp;&nbsp;&nbsp;<span class="bi">l</span>, <span class="bi">r</span> = <span class="bi">i</span> + 1, <span class="fn">len</span>(<span class="nb">nums</span>) - 1`,
    `&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">while</span> <span class="bi">l</span> < <span class="bi">r</span>:`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="bi">s</span> = <span class="nb">nums</span>[<span class="bi">i</span>] + <span class="nb">nums</span>[<span class="bi">l</span>] + <span class="nb">nums</span>[<span class="bi">r</span>]`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="bi">s</span> == 0:`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="nb">result</span>.<span class="fn">append</span>([<span class="nb">nums</span>[<span class="bi">i</span>], <span class="nb">nums</span>[<span class="bi">l</span>], <span class="nb">nums</span>[<span class="bi">r</span>]])`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">while</span> <span class="bi">l</span> < <span class="bi">r</span> <span class="op">and</span> <span class="nb">nums</span>[<span class="bi">l</span>] == <span class="nb">nums</span>[<span class="bi">l</span>+1]: <span class="bi">l</span> += 1`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">while</span> <span class="bi">l</span> < <span class="bi">r</span> <span class="op">and</span> <span class="nb">nums</span>[<span class="bi">r</span>] == <span class="nb">nums</span>[<span class="bi">r</span>-1]: <span class="bi">r</span> -= 1`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="bi">l</span> += 1; <span class="bi">r</span> -= 1`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">elif</span> <span class="bi">s</span> < 0:`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="bi">l</span> += 1`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">else</span>:`,
    `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="bi">r</span> -= 1`,
    `&nbsp;&nbsp;<span class="kw">return</span> <span class="nb">result</span>`,
  ];

  const codeBody = document.getElementById('code-body');
  codeBody.innerHTML = codeLines
    .map((line, idx) => `<div class="code-line"><span class="ln">${idx+1}</span>&nbsp;&nbsp;${line}</div>`)
    .join('');

  // Auto-run default
  buildAndRun();
});

// Hide back-link in iframe
if (window.self !== window.top) {
  const bl = document.querySelector('.back-link');
  if (bl) bl.style.display = 'none';
}

function randomExample() {
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
  const min = -50, max = 50;
  const count = Math.floor(Math.random() * 5) + 4; // 4-8 numbers
  const nums = [];
  for (let i = 0; i < count; i++) {
    nums.push(Math.floor(Math.random() * (max - min + 1)) + min);
  }
  document.getElementById('inp-nums').value = nums.join(',');
  buildAndRun();
}

</script>
</body>
