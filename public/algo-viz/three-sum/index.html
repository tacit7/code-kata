<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3Sum</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; overflow: hidden; }

  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 580px; min-height: 36px; line-height: 1.5; }

  #array-canvas { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 700px; }

  .array-row { display: flex; align-items: flex-end; gap: 4px; flex-wrap: wrap; justify-content: center; }

  .node-wrap { display: flex; flex-direction: column; align-items: center; }
  .node-idx { font-size: 9px; color: var(--text-dim); margin-bottom: 3px; }
  .node-box {
    width: 48px; height: 48px; border-radius: 8px;
    background: #1e293b; border: 2px solid #334155; color: #f1f5f9;
    font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .25s, background .25s;
  }
  .node-box.hi-i     { border-color: #eab308; background: #45280a30; box-shadow: 0 0 0 3px #eab30820; }
  .node-box.hi-left  { border-color: #3b82f6; background: #1e3a5f30; box-shadow: 0 0 0 3px #3b82f620; }
  .node-box.hi-right { border-color: #f97316; background: #43140730; box-shadow: 0 0 0 3px #f9731620; }
  .node-box.hi-both  { border-color: #22c55e; background: #14532d40; box-shadow: 0 0 0 3px #22c55e20; }
  .node-box.hi-done  { border-color: #22c55e; background: #14532d40; color: #4ade80; }
  .node-box.pulse { animation: nodePulse .5s ease; }
  @keyframes nodePulse { 0%,100%{box-shadow:0 0 0 0 #10b98140} 50%{box-shadow:0 0 0 8px #10b98130} }

  .badges { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 4px; min-height: 18px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .05em; }
  .badge-i     { background: #45280a; color: #eab308; border: 1px solid #eab308; }
  .badge-left  { background: #1e3a5f; color: #3b82f6; border: 1px solid #3b82f6; }
  .badge-right { background: #431407; color: #f97316; border: 1px solid #f97316; }

  #triplets-area { min-height: 28px; text-align: center; }
  .triplets-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .triplets-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .triplet-chip { background: #14532d40; border: 1px solid #22c55e; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: #4ade80; font-weight: 600; }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .ptr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptr-table td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
  .ptr-table td:first-child { color: var(--text-muted); width: 50px; }
  .ptr-table td:last-child { color: var(--text); font-weight: 600; }
  .triplet-list-sidebar { font-size: 11px; color: var(--text-muted); line-height: 1.8; }
  .triplet-entry { color: #4ade80; font-weight: 600; }

  #resize-handle {
    width: 5px;
    flex-shrink: 0;
    cursor: col-resize;
    background: transparent;
    border-left: 1px solid var(--border);
    transition: background .15s;
    z-index: 10;
  }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel {
    width: 350px;
    min-width: 120px;
    max-width: 560px;
    flex-shrink: 0;
    background: #0d1117;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
  }
  .code-panel-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  pre { font-size: 11px; line-height: 1.7; font-family: inherit; }
  .code-line { padding: 0 4px; border-radius: 3px; display: block; transition: background .2s; white-space: pre; }
  .code-line.active { background: #451a0350; color: #fbbf24; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .cm { color: #546e7a; font-style: italic; }
  .str { color: #c3e88d; } .num { color: #f78c6c; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div id="header">
  <span id="phase-badge">Sort</span>
  <span style="font-size:13px;font-weight:700;">3Sum</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value="-1,0,1,2,-1,-4">[-1,0,1,2,-1,-4]</option>
      <option value="0,0,0">[0,0,0]</option>
      <option value="-2,0,0,2,2">[-2,0,0,2,2]</option>
      <option value="-4,-1,-1,0,1,2">[-4,-1,-1,0,1,2]</option>
      <option value="1,2,3">[1,2,3]</option>
    </select>
  </div>
  <div>
    <label>Array (comma-separated)</label>
    <input type="text" id="arrayInput" value="-1,0,1,2,-1,-4" style="width:180px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Initializing...</div>
    <div id="array-canvas"></div>
    <div id="triplets-area"></div>
  </div>

  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <pre id="code-pre"></pre>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Pointers</div>
      <table class="ptr-table" id="ptr-table">
        <tbody></tbody>
      </table>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Triplets Found</div>
      <div class="triplet-list-sidebar" id="triplet-sidebar"></div>
    </div>
  </div>
</div>

<div class="controls"></div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
const CODE_LINES = [
  { n:  1, t: `<span class="fn">nums</span>.sort()` },
  { n:  2, t: `<span class="fn">res</span> = []` },
  { n:  3, t: `<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="fn">len</span>(nums) - <span class="num">2</span>):` },
  { n:  4, t: `  <span class="kw">if</span> i &gt; <span class="num">0</span> <span class="kw">and</span> nums[i] == nums[i-<span class="num">1</span>]:` },
  { n:  5, t: `    <span class="kw">continue</span>  <span class="cm"># skip duplicate i</span>` },
  { n:  6, t: `  l, r = i + <span class="num">1</span>, <span class="fn">len</span>(nums) - <span class="num">1</span>` },
  { n:  7, t: `  <span class="kw">while</span> l &lt; r:` },
  { n:  8, t: `    s = nums[i] + nums[l] + nums[r]` },
  { n:  9, t: `    <span class="kw">if</span> s == <span class="num">0</span>:` },
  { n: 10, t: `      res.append([nums[i], nums[l], nums[r]])` },
  { n: 11, t: `      <span class="kw">while</span> l &lt; r <span class="kw">and</span> nums[l] == nums[l+<span class="num">1</span>]: l += <span class="num">1</span>` },
  { n: 12, t: `      <span class="kw">while</span> l &lt; r <span class="kw">and</span> nums[r] == nums[r-<span class="num">1</span>]: r -= <span class="num">1</span>` },
  { n: 13, t: `      l += <span class="num">1</span>; r -= <span class="num">1</span>` },
  { n: 14, t: `    <span class="kw">elif</span> s &lt; <span class="num">0</span>: l += <span class="num">1</span>` },
  { n: 15, t: `    <span class="kw">else</span>: r -= <span class="num">1</span>` },
  { n: 16, t: `<span class="kw">return</span> res` },
];

function buildSnapshots(inputArr) {
  const snaps = [];
  const nums = [...inputArr];

  function mkSnap(phase, description, extra) {
    return {
      phase, description,
      nums: [...nums],
      i_idx: null, l_idx: null, r_idx: null,
      cur_sum: null,
      triplets: [],
      active_line: 0,
      skip_i: false,
      ...extra,
    };
  }

  // Before sort
  snaps.push(mkSnap('sort',
    'Input: [' + inputArr.join(', ') + ']. Sort the array first so two pointers work correctly.',
    { nums: [...inputArr], active_line: 1 }
  ));

  nums.sort((a, b) => a - b);

  // After sort
  snaps.push(mkSnap('sort',
    'Sorted: [' + nums.join(', ') + ']. For each fixed i, use left=i+1 and right=n−1 to find pairs summing to −nums[i].',
    { active_line: 2 }
  ));

  const triplets = [];
  const n = nums.length;

  for (let i = 0; i <= n - 3; i++) {
    if (i > 0 && nums[i] === nums[i - 1]) {
      snaps.push(mkSnap('fix_i',
        'i=' + i + ': nums[' + i + ']=' + nums[i] + ' equals nums[' + (i-1) + ']=' + nums[i-1] + ' — duplicate. Skip to avoid duplicate triplets.',
        { i_idx: i, active_line: 4, skip_i: true, triplets: triplets.map(t => [...t]) }
      ));
      continue;
    }

    snaps.push(mkSnap('fix_i',
      'Fix i=' + i + ' (nums[i]=' + nums[i] + '). Set left=' + (i+1) + ', right=' + (n-1) + '. Need pairs summing to ' + (-nums[i]) + '.',
      { i_idx: i, l_idx: i + 1, r_idx: n - 1, active_line: 6, triplets: triplets.map(t => [...t]) }
    ));

    let l = i + 1;
    let r = n - 1;

    while (l < r) {
      const s = nums[i] + nums[l] + nums[r];

      snaps.push(mkSnap('search',
        'i=' + i + '(' + nums[i] + '), left=' + l + '(' + nums[l] + '), right=' + r + '(' + nums[r] + '). Sum = ' + nums[i] + '+' + nums[l] + '+' + nums[r] + ' = ' + s + '.',
        { i_idx: i, l_idx: l, r_idx: r, cur_sum: s, active_line: 8, triplets: triplets.map(t => [...t]) }
      ));

      if (s === 0) {
        triplets.push([nums[i], nums[l], nums[r]]);
        snaps.push(mkSnap('search',
          'Sum = 0! Found triplet [' + nums[i] + ', ' + nums[l] + ', ' + nums[r] + ']. Record it, then skip duplicates and advance both pointers.',
          { i_idx: i, l_idx: l, r_idx: r, cur_sum: s, active_line: 10, triplets: triplets.map(t => [...t]) }
        ));

        while (l < r && nums[l] === nums[l + 1]) l++;
        while (l < r && nums[r] === nums[r - 1]) r--;
        l++; r--;

        if (l < r) {
          snaps.push(mkSnap('search',
            'After advancing: left=' + l + '(' + nums[l] + '), right=' + r + '(' + nums[r] + '). Continue searching.',
            { i_idx: i, l_idx: l, r_idx: r, cur_sum: null, active_line: 13, triplets: triplets.map(t => [...t]) }
          ));
        }
      } else if (s < 0) {
        l++;
        snaps.push(mkSnap('search',
          'Sum ' + s + ' < 0 — too small. Move left pointer right to increase sum. left → ' + l + '.',
          { i_idx: i, l_idx: l, r_idx: r, cur_sum: null, active_line: 14, triplets: triplets.map(t => [...t]) }
        ));
      } else {
        r--;
        snaps.push(mkSnap('search',
          'Sum ' + s + ' > 0 — too large. Move right pointer left to decrease sum. right → ' + r + '.',
          { i_idx: i, l_idx: l, r_idx: r, cur_sum: null, active_line: 15, triplets: triplets.map(t => [...t]) }
        ));
      }
    }
  }

  const resultStr = triplets.length > 0
    ? triplets.map(t => '[' + t.join(',') + ']').join(', ')
    : 'none';
  snaps.push(mkSnap('done',
    'Complete! Found ' + triplets.length + ' triplet(s): ' + resultStr + '.',
    { active_line: 16, triplets: triplets.map(t => [...t]) }
  ));

  return snaps;
}

function renderArray(snap) {
  const { nums, i_idx, l_idx, r_idx, phase } = snap;
  let html = '<div class="array-row">';
  nums.forEach((val, idx) => {
    let cls = 'node-box';
    if (phase === 'done') {
      cls += ' hi-done';
    } else if (idx === i_idx && (idx === l_idx || idx === r_idx)) {
      cls += ' hi-both';
    } else if (idx === i_idx) {
      cls += ' hi-i';
    } else if (idx === l_idx && idx === r_idx) {
      cls += ' hi-both';
    } else if (idx === l_idx) {
      cls += ' hi-left';
    } else if (idx === r_idx) {
      cls += ' hi-right';
    }

    const badges = [];
    if (idx === i_idx && phase !== 'sort') badges.push('<span class="badge badge-i">i</span>');
    if (idx === l_idx && phase === 'search') badges.push('<span class="badge badge-left">left</span>');
    if (idx === r_idx && phase === 'search') badges.push('<span class="badge badge-right">right</span>');

    html += '<div class="node-wrap">'
      + '<div class="node-idx">' + idx + '</div>'
      + '<div class="' + cls + '">' + val + '</div>'
      + '<div class="badges">' + badges.join('') + '</div>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

function renderTriplets(triplets) {
  if (!triplets || triplets.length === 0) return '';
  return '<div class="triplets-label">Triplets Found</div>'
    + '<div class="triplets-list">'
    + triplets.map(t => '<span class="triplet-chip">[' + t.join(', ') + ']</span>').join('')
    + '</div>';
}

function updateSidebar(snap) {
  const tbody = document.querySelector('#ptr-table tbody');
  const { phase, nums, i_idx, l_idx, r_idx, cur_sum } = snap;

  function val(idx) {
    if (idx === null || idx === undefined) return '<span style="color:var(--text-dim)">—</span>';
    return '<span style="color:var(--text)">' + nums[idx] + ' (idx ' + idx + ')</span>';
  }
  function sumVal(s) {
    if (s === null || s === undefined) return '<span style="color:var(--text-dim)">—</span>';
    const col = s === 0 ? '#4ade80' : s < 0 ? '#3b82f6' : '#f97316';
    return '<span style="color:' + col + ';font-weight:700;">' + s + '</span>';
  }

  let rows = '';
  if (phase === 'sort') {
    rows = '<tr><td colspan="2" style="color:var(--text-dim);text-align:center;">Sorting…</td></tr>';
  } else if (phase === 'done') {
    rows = '<tr><td colspan="2" style="color:#4ade80;text-align:center;">Complete!</td></tr>';
  } else {
    rows += '<tr><td>i</td><td>' + val(i_idx) + '</td></tr>';
    if (phase === 'search') {
      rows += '<tr><td>left</td><td>' + val(l_idx) + '</td></tr>';
      rows += '<tr><td>right</td><td>' + val(r_idx) + '</td></tr>';
      rows += '<tr><td>sum</td><td>' + sumVal(cur_sum) + '</td></tr>';
    }
  }
  tbody.innerHTML = rows;

  const sidebarEl = document.getElementById('triplet-sidebar');
  if (!snap.triplets || snap.triplets.length === 0) {
    sidebarEl.innerHTML = '<span style="color:var(--text-dim)">None yet</span>';
  } else {
    sidebarEl.innerHTML = snap.triplets.map(function(t, i) {
      return '<div class="triplet-entry">' + (i + 1) + '. [' + t.join(', ') + ']</div>';
    }).join('');
  }
}

function renderCode(activeLine) {
  const pre = document.getElementById('code-pre');
  pre.innerHTML = CODE_LINES.map(function(l) {
    const cls = l.n === activeLine ? 'code-line active' : 'code-line';
    return '<span class="' + cls + '">' + (l.t || ' ') + '</span>';
  }).join('');
  const active = pre.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const PHASE_LABELS = {
  sort: 'Sort',
  fix_i: 'Fix i',
  search: 'Search',
  done: 'Done',
};

function applyStep(snap) {
  const badge = document.getElementById('phase-badge');
  if (snap.phase === 'fix_i' && snap.i_idx !== null && !snap.skip_i) {
    badge.textContent = 'Fix i=' + snap.i_idx;
  } else {
    badge.textContent = PHASE_LABELS[snap.phase] || snap.phase;
  }

  document.getElementById('desc').textContent = snap.description;
  document.getElementById('array-canvas').innerHTML = renderArray(snap);
  document.getElementById('triplets-area').innerHTML = renderTriplets(snap.triplets);
  updateSidebar(snap);
  renderCode(snap.active_line);
}

function updateStatus(snap, cur, total) {
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

document.getElementById('resetBtn').addEventListener('click', function() {
  if (window.nav) window.nav.reset();
});

function loadPreset() {
  const sel = document.getElementById('presetSel');
  if (sel.value) {
    document.getElementById('arrayInput').value = sel.value;
    buildAndRun();
  }
}

function buildAndRun() {
  const raw = document.getElementById('arrayInput').value;
  const arr = raw.split(',').map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); });
  if (arr.length < 3) { alert('Need at least 3 numbers.'); return; }
  const snaps = buildSnapshots(arr);
  if (window.nav) window.nav.load(snaps);
}

function randomExample() {
  const n = 4 + Math.floor(Math.random() * 4);
  const arr = Array.from({ length: n }, function() { return Math.floor(Math.random() * 13) - 6; });
  document.getElementById('arrayInput').value = arr.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

document.addEventListener('DOMContentLoaded', function() {
  const snaps = buildSnapshots([-1, 0, 1, 2, -1, -4]);

  window.nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) { applyStep(snap); updateStatus(snap, cur, total); }
  });

  window.nav.load(snaps);
});

(function() {
  const handle = document.getElementById('resize-handle');
  const panel  = document.getElementById('code-panel');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const delta = startX - e.clientX;
    const newW = Math.min(480, Math.max(120, startW + delta));
    panel.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
