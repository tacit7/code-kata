<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lowest Common Ancestor of BST</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; padding: 12px 16px; gap: 8px; overflow-y: auto; }
    #desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 340px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; display: flex; flex-direction: column; }
    .code-header { padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); flex-shrink: 0; }
    .code-body { padding: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; line-height: 1.75; overflow-x: auto; }
    .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 14px 0 0; white-space: pre; }
    .cl .ln { width: 28px; min-width: 28px; text-align: right; color: #3d4468; user-select: none; padding-right: 14px; font-size: 0.72rem; line-height: 1.75; }
    .cl .code { color: var(--text-muted); }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-section { font-size: 11px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-step:hover { background: #334155; }
    .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-play:hover { background: var(--accent-hover); }
    select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

    /* LCA BST unique CSS */
    .tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; flex-shrink: 0; }
    #tree-svg { display: block; width: 100%; }
    .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
    .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); margin-bottom: 6px; }
    .targets-row { display: flex; align-items: center; gap: 6px; }
    .target-slot { flex: 1; background: var(--surface-dark); border: 1px solid var(--border); border-radius: 5px; padding: 5px 6px; text-align: center; }
    .target-slot.p-slot { border-color: #16a34a; }
    .target-slot.q-slot { border-color: #2563eb; }
    .ts-label { color: var(--text-dim); font-size: 0.58rem; margin-bottom: 2px; }
    .ts-val { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700; color: var(--text-bright); }
    .targets-vs { color: var(--text-dim); font-size: 0.72rem; font-weight: 600; flex-shrink: 0; }
    .decision-box { background: var(--surface-dark); border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; min-height: 32px; display: flex; align-items: center; gap: 6px; color: var(--text-dim); }
    .decision-box.go-left  { border-color: #4f46e5; color: #a5b4fc; background: #1e1a3a; }
    .decision-box.go-right { border-color: #0ea5e9; color: #7dd3fc; background: #082f49; }
    .decision-box.lca-found { border-color: #d97706; color: #fcd34d; background: #1c1207; }
    .path-trail { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 24px; }
    .trail-node { background: #1e1a3a; color: #a5b4fc; border: 1px solid #4f46e5; border-radius: 3px; padding: 1px 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 600; }
    .trail-arrow { color: var(--text-dim); font-size: 0.7rem; }
    .trail-empty { color: var(--text-faint); font-size: 0.75rem; font-style: italic; }
    .result-badge-lca { font-size: 0.88rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; text-align: center; }
    .result-badge-lca.lca-result { background: #1c1207; color: #fcd34d; border: 1px solid #d97706; }
    .kw { color: var(--purple); } .fn { color: var(--blue); } .bi { color: var(--orange); }
    .cm { color: #3d4468; font-style: italic; } .op { color: var(--text); }
    .pv { color: #4ade80; } .qv { color: #60a5fa; } .cv { color: #fcd34d; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="preset-sel" onchange="applyPreset()" style="width:auto;height:30px">
      <option value="6,2,8,0,4,7,9,null,null,3,5|2|8">p=2, q=8 → LCA splits at root</option>
      <option value="6,2,8,0,4,7,9,null,null,3,5|2|4">p=2, q=4 → LCA is ancestor (p itself)</option>
      <option value="20,10,30,5,15,25,35|5|15">p=5, q=15 → LCA one level up</option>
    </select>
  </div>
  <div>
    <label>Tree (level-order)</label>
    <input id="inp-tree" type="text" value="6,2,8,0,4,7,9,null,null,3,5" style="width:240px" />
  </div>
  <div>
    <label>p</label>
    <input id="inp-p" type="number" value="2" style="width:56px" />
  </div>
  <div>
    <label>q</label>
    <input id="inp-q" type="number" value="8" style="width:56px" />
  </div>
  <button class="vi-btn-run" onclick="build()">Build &amp; Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Lowest Common Ancestor of BST</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="desc">Choose a preset and click Build &amp; Run.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-header">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Targets</div>
      <div class="targets-row">
        <div class="target-slot p-slot">
          <div class="ts-label">p</div>
          <div class="ts-val" id="tv-p">&mdash;</div>
        </div>
        <div class="targets-vs">vs</div>
        <div class="target-slot" id="cur-slot" style="border-color:#6366f1">
          <div class="ts-label">cur.val</div>
          <div class="ts-val" id="tv-cur">&mdash;</div>
        </div>
        <div class="targets-vs">vs</div>
        <div class="target-slot q-slot">
          <div class="ts-label">q</div>
          <div class="ts-val" id="tv-q">&mdash;</div>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Decision</div>
      <div class="decision-box" id="decision-box">Waiting&hellip;</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Path Taken <span style="font-size:0.58rem;color:var(--text-faint);font-weight:400;text-transform:none">(root → LCA)</span></div>
      <div class="path-trail" id="path-trail"><span class="trail-empty">not started</span></div>
    </div>
    <div class="sidebar-section">
      <div id="result-badge" class="result-badge-lca" style="display:none"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:5px;font-size:0.68rem;color:var(--text-muted)">
        <span><svg width="10" height="10" style="vertical-align:middle"><circle cx="5" cy="5" r="4.5" fill="#1e2130" stroke="#2d3148" stroke-width="1.5"/></svg> Unvisited</span>
        <span><svg width="10" height="10" style="vertical-align:middle"><circle cx="5" cy="5" r="4.5" fill="#312e81" stroke="#818cf8" stroke-width="2"/></svg> Current</span>
        <span><svg width="10" height="10" style="vertical-align:middle"><circle cx="5" cy="5" r="4.5" fill="#1e1a3a" stroke="#4f46e5" stroke-width="1.5"/></svg> Visited</span>
        <span><svg width="10" height="10" style="vertical-align:middle"><circle cx="5" cy="5" r="4.5" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/></svg> p node</span>
        <span><svg width="10" height="10" style="vertical-align:middle"><circle cx="5" cy="5" r="4.5" fill="#082f49" stroke="#2563eb" stroke-width="1.5"/></svg> q node</span>
        <span><svg width="10" height="10" style="vertical-align:middle"><circle cx="5" cy="5" r="4.5" fill="#1c1207" stroke="#d97706" stroke-width="2"/></svg> LCA</span>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&#8592; Prev</button>
  <button class="btn-step" id="stepBtn" disabled>Step &#8594;</button>
  <button class="btn-play" id="playBtn">Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="700">0.5&#215;</option>
    <option value="350" selected>1&#215;</option>
    <option value="120">2&#215;</option>
    <option value="60">4&#215;</option>
  </select>
</div>

<script>
const CODE_LINES = [
  [1, `<span class="kw">def</span> <span class="fn">lowestCommonAncestor</span><span class="op">(</span>root<span class="op">,</span> <span class="pv">p</span><span class="op">,</span> <span class="qv">q</span><span class="op">):</span>`],
  [2, `    cur <span class="op">=</span> root`],
  [3, `    <span class="kw">while</span> cur<span class="op">:</span>`],
  [4, `        <span class="kw">if</span> <span class="pv">p</span>.val <span class="op">&lt;</span> cur.val <span class="kw">and</span> <span class="qv">q</span>.val <span class="op">&lt;</span> cur.val<span class="op">:</span>`],
  [5, `            cur <span class="op">=</span> cur.left    <span class="cm"># both go left</span>`],
  [6, `        <span class="kw">elif</span> <span class="pv">p</span>.val <span class="op">&gt;</span> cur.val <span class="kw">and</span> <span class="qv">q</span>.val <span class="op">&gt;</span> cur.val<span class="op">:</span>`],
  [7, `            cur <span class="op">=</span> cur.right   <span class="cm"># both go right</span>`],
  [8, `        <span class="kw">else</span><span class="op">:</span>`],
  [9, `            <span class="kw">return</span> cur        <span class="cm"># split point &mdash; this IS the LCA</span>`],
];

const COLORS = {
  idle:    { fill: '#1e2130', stroke: '#2d3148', text: '#565f89', sw: 2 },
  current: { fill: '#312e81', stroke: '#818cf8', text: '#e0e7ff', sw: 3.5 },
  visited: { fill: '#1e1a3a', stroke: '#4f46e5', text: '#a5b4fc', sw: 2 },
  p_node:  { fill: '#052e16', stroke: '#16a34a', text: '#4ade80', sw: 2 },
  q_node:  { fill: '#082f49', stroke: '#2563eb', text: '#93c5fd', sw: 2 },
  lca:     { fill: '#1c1207', stroke: '#d97706', text: '#fcd34d', sw: 3.5 },
};

let nodeMap = {};
let R = 22;
let VW = 800, VH = 300;
let prevLines = [];
let pVal, qVal;

function parseLevelOrder(s) {
  return s.split(',').map(t => t.trim()).map(t =>
    (t === '' || t.toLowerCase() === 'null' || t === 'n') ? null : Number(t)
  );
}

let nextId = 0;
function buildTree(vals) {
  nodeMap = {}; nextId = 0;
  if (!vals.length || vals[0] === null) return null;
  const make = val => {
    const n = { id: nextId++, val, left: null, right: null, x: 0, y: 0, depth: 0 };
    nodeMap[n.id] = n; return n;
  };
  const root = make(vals[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < vals.length) {
    const cur = queue.shift();
    if (i < vals.length) { if (vals[i] !== null) { cur.left = make(vals[i]); cur.left.depth = cur.depth + 1; queue.push(cur.left); } i++; }
    if (i < vals.length) { if (vals[i] !== null) { cur.right = make(vals[i]); cur.right.depth = cur.depth + 1; queue.push(cur.right); } i++; }
  }
  return root;
}

function layout(root) {
  let idx = 0, maxD = 0;
  function inorder(n) {
    if (!n) return;
    inorder(n.left);
    n._inIdx = idx++;
    if (n.depth > maxD) maxD = n.depth;
    inorder(n.right);
  }
  inorder(root);
  const count = idx;
  const xSpace = Math.max(60, Math.min(110, 680 / Math.max(1, count)));
  const ySpace = 76;
  const padX = 50, padY = 36;
  VW = Math.max(480, padX * 2 + (count - 1) * xSpace);
  VH = padY * 2 + maxD * ySpace + R * 2 + 20;
  for (const id in nodeMap) {
    const n = nodeMap[id];
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + 26 + n.depth * ySpace + R;
  }
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id; return g;
}

function renderSVG(root) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  R = VW > 650 ? 22 : 18;
  const edgeG = svgG('edges'), nodeG = svgG('nodes');
  svg.appendChild(edgeG); svg.appendChild(nodeG);
  (function drawEdges(n) {
    if (!n) return;
    [n.left, n.right].forEach(c => {
      if (!c) return;
      edgeG.appendChild(svgEl('line', { id: `edge-${n.id}-${c.id}`, x1: n.x, y1: n.y, x2: c.x, y2: c.y, stroke: '#2d3148', 'stroke-width': 2, 'stroke-linecap': 'round' }));
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);
  for (const id in nodeMap) {
    const n = nodeMap[id];
    const g = svgG(`node-g-${n.id}`);
    g.appendChild(svgEl('circle', { id: `nc-${n.id}`, cx: n.x, cy: n.y, r: R, fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': COLORS.idle.sw }));
    const t = svgEl('text', { id: `nt-${n.id}`, x: n.x, y: n.y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: COLORS.idle.text, 'font-size': Math.round(R * 0.75), 'font-weight': 'bold', 'font-family': 'JetBrains Mono, monospace' });
    t.textContent = n.val; g.appendChild(t);
    nodeG.appendChild(g);
  }
}

function findNodeByVal(val) {
  for (const id in nodeMap) { if (nodeMap[id].val === val) return nodeMap[id]; }
  return null;
}

function simulate(root) {
  const stateMap = {};
  for (const id in nodeMap) stateMap[id] = 'idle';
  const path = [];
  const out = [];

  function snap(phase, desc, lines, curId, decision) {
    out.push({ phase, desc, lines: lines || [], stateMap: { ...stateMap }, curId: curId !== undefined ? curId : null, path: [...path], decision: decision || null });
  }

  snap('Start', 'Find LCA of p=' + pVal + ' and q=' + qVal + '. Start at root.', [1, 2, 3]);
  let cur = root;
  while (cur) {
    stateMap[cur.id] = 'current';
    snap('Compare', 'At node ' + cur.val + '. Compare p=' + pVal + ' and q=' + qVal + ' against ' + cur.val + '.', [3, 4], cur.id, null);
    if (pVal < cur.val && qVal < cur.val) {
      snap('GoLeft', 'Both p=' + pVal + ' and q=' + qVal + ' < ' + cur.val + '. LCA must be in the left subtree.', [4, 5], cur.id, 'left');
      path.push(cur.id); stateMap[cur.id] = 'visited'; cur = cur.left;
    } else if (pVal > cur.val && qVal > cur.val) {
      snap('GoRight', 'Both p=' + pVal + ' and q=' + qVal + ' > ' + cur.val + '. LCA must be in the right subtree.', [6, 7], cur.id, 'right');
      path.push(cur.id); stateMap[cur.id] = 'visited'; cur = cur.right;
    } else {
      path.push(cur.id); stateMap[cur.id] = 'lca';
      const pNode = findNodeByVal(pVal), qNode = findNodeByVal(qVal);
      if (pNode && stateMap[pNode.id] !== 'lca') stateMap[pNode.id] = 'p_node';
      if (qNode && stateMap[qNode.id] !== 'lca') stateMap[qNode.id] = 'q_node';
      const reason = pVal === cur.val ? 'p=' + pVal + ' equals cur.val — p itself is LCA.'
        : qVal === cur.val ? 'q=' + qVal + ' equals cur.val — q itself is LCA.'
        : 'p=' + pVal + ' and q=' + qVal + ' split here — one on each side.';
      snap('LCA', 'SPLIT POINT! ' + reason + ' Return node ' + cur.val + '.', [8, 9], cur.id, 'lca');
      snap('Done', '✓ LCA found: node ' + cur.val, [], cur.id, 'lca');
      return out;
    }
  }
  snap('Done', 'No LCA found (p or q not in tree).', [], null, null);
  return out;
}

function setNodeColor(id, colorKey, animate) {
  const c = COLORS[colorKey] || COLORS.idle;
  const nc = document.getElementById('nc-' + id);
  const nt = document.getElementById('nt-' + id);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: 0.28, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke, 'stroke-width': c.sw } });
    if (nt) gsap.to(nt, { duration: 0.28, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke); nc.setAttribute('stroke-width', c.sw);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

function setCodeLines(oldLines, newLines, animate) {
  const HL_BG = 'rgba(99,102,241,0.16)', NO_BG = 'rgba(99,102,241,0)', HL_BORD = '#818cf8', NO_BORD = 'transparent';
  (oldLines || []).filter(n => !(newLines || []).includes(n)).forEach(n => {
    const el = document.getElementById('cl-' + n); if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: NO_BG, borderLeftColor: NO_BORD, duration: 0.2 });
    else { el.style.backgroundColor = ''; el.style.borderLeftColor = ''; }
  });
  (newLines || []).filter(n => !(oldLines || []).includes(n)).forEach(n => {
    const el = document.getElementById('cl-' + n); if (!el) return;
    if (animate) gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: 0.2, delay: 0.05 });
    else { el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD; }
  });
}

function renderPathTrail(path, animate) {
  const c = document.getElementById('path-trail');
  c.innerHTML = '';
  if (!path.length) { c.innerHTML = '<span class="trail-empty">not started</span>'; return; }
  path.forEach((id, i) => {
    if (i > 0) { const arr = document.createElement('span'); arr.className = 'trail-arrow'; arr.textContent = ' → '; c.appendChild(arr); }
    const n = nodeMap[id];
    const el = document.createElement('span'); el.className = 'trail-node'; el.textContent = n ? String(n.val) : '?';
    c.appendChild(el);
    if (animate && i === path.length - 1) gsap.from(el, { opacity: 0, x: -6, duration: 0.18 });
  });
}

function applyStep(s, animate) {
  Object.entries(s.stateMap).forEach(([id, state]) => { setNodeColor(+id, state, animate); });
  const cur = s.curId !== null ? nodeMap[s.curId] : null;
  const setTV = function(id, val, faint) {
    const el = document.getElementById(id); if (!el) return;
    el.textContent = val; el.style.opacity = faint ? '0.4' : '1';
    if (animate) gsap.fromTo(el, { opacity: 0.3 }, { opacity: faint ? 0.4 : 1, duration: 0.18 });
  };
  setTV('tv-p', String(pVal), false); setTV('tv-q', String(qVal), false);
  setTV('tv-cur', cur ? String(cur.val) : '—', !cur);
  const db = document.getElementById('decision-box');
  if (db) {
    db.className = 'decision-box';
    if (s.decision === 'left') { db.className = 'decision-box go-left'; db.innerHTML = '<span style="font-size:1.1rem">←</span> Both &lt; cur.val → go left'; }
    else if (s.decision === 'right') { db.className = 'decision-box go-right'; db.innerHTML = '<span style="font-size:1.1rem">→</span> Both &gt; cur.val → go right'; }
    else if (s.decision === 'lca') { db.className = 'decision-box lca-found'; db.innerHTML = '<span style="font-size:1.1rem">★</span> Split here → this IS the LCA'; }
    else { db.innerHTML = 'Waiting…'; }
    if (animate && s.decision) gsap.from(db, { opacity: 0.4, duration: 0.2 });
  }
  renderPathTrail(s.path, animate);
  const rb = document.getElementById('result-badge');
  if (rb) {
    if (s.phase === 'Done' && s.curId !== null) {
      const lcaNode = nodeMap[s.curId];
      rb.style.display = 'block'; rb.className = 'result-badge-lca lca-result';
      rb.textContent = '★ LCA = node ' + (lcaNode ? lcaNode.val : '?');
      if (animate) gsap.from(rb, { opacity: 0, scale: 0.9, duration: 0.35, ease: 'back.out(1.7)' });
    } else { rb.style.display = 'none'; }
  }
  const descEl = document.getElementById('desc');
  if (descEl) { if (animate) gsap.fromTo(descEl, { opacity: 0.5 }, { opacity: 1, duration: 0.15 }); descEl.textContent = s.desc; }
  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div'); row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

function applyPreset() {
  const sel = document.getElementById('preset-sel');
  const parts = sel.value.split('|');
  document.getElementById('inp-tree').value = parts[0] || '';
  document.getElementById('inp-p').value    = parts[1] || '';
  document.getElementById('inp-q').value    = parts[2] || '';
  build();
}

function build() {
  const txt = document.getElementById('inp-tree').value.trim();
  pVal = Number(document.getElementById('inp-p').value);
  qVal = Number(document.getElementById('inp-q').value);
  const vals = parseLevelOrder(txt);
  buildCodePanel();
  const root = buildTree(vals);
  if (!root) { document.getElementById('tree-svg').innerHTML = ''; document.getElementById('desc').textContent = 'Empty tree — nothing to search.'; return; }
  layout(root);
  renderSVG(root);
  prevLines = [];
  document.getElementById('result-badge').style.display = 'none';
  nav.load(simulate(root));
}

var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    document.getElementById('phase-badge').textContent = snap.phase || '';
    document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
  }
});

document.getElementById('resetBtn').addEventListener('click', function() { build(); });

function loadPreset() { applyPreset(); }
function randomExample() {
  var presets = [
    { tree: '6,2,8,0,4,7,9,null,null,3,5', p: '2', q: '8' },
    { tree: '6,2,8,0,4,7,9,null,null,3,5', p: '2', q: '4' },
    { tree: '20,10,30,5,15,25,35', p: '5', q: '15' },
  ];
  var choice = presets[Math.floor(Math.random() * presets.length)];
  document.getElementById('inp-tree').value = choice.tree;
  document.getElementById('inp-p').value = choice.p;
  document.getElementById('inp-q').value = choice.q;
  build();
}

build();
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
