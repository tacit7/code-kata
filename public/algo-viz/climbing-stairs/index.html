<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Climbing Stairs</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* PAGE-SPECIFIC */
  .dp-track { display: flex; gap: 8px; flex-wrap: wrap; padding: 20px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); min-height: 100px; align-items: flex-end; width: 100%; max-width: 600px; }
  .dp-cell-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  .dp-cell-box { width: 58px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid var(--border); border-radius: 7px; background: #0f0f0f; transition: border-color 0.18s, background 0.18s; position: relative; }
  .dp-cell-box[data-state="empty"]    { border-style: dashed; opacity: 0.45; }
  .dp-cell-box[data-state="filled"]   { border-color: #166534; }
  .dp-cell-box[data-state="current"]  { border-color: var(--accent); background: var(--surface-dark); }
  .dp-cell-box[data-state="prev1"]    { border-color: #b45309; background: #1c0e00; }
  .dp-cell-box[data-state="prev2"]    { border-color: #b91c1c; background: #1c0000; }
  .dp-cell-box[data-state="answer"]   { border-color: #15803d; background: #052e16; }
  .dp-cell-idx { font-size: 0.58rem; color: var(--text-ghost); font-family: monospace; position: absolute; top: 5px; left: 0; right: 0; text-align: center; }
  .dp-cell-val { font-size: 1.15rem; font-weight: 700; font-family: monospace; color: var(--border-soft); margin-top: 10px; }
  .dp-cell-box[data-state="filled"]  .dp-cell-val { color: var(--green); }
  .dp-cell-box[data-state="current"] .dp-cell-val { color: var(--accent-pale); }
  .dp-cell-box[data-state="prev1"]   .dp-cell-val { color: var(--yellow-light); }
  .dp-cell-box[data-state="prev2"]   .dp-cell-val { color: var(--red-light); }
  .dp-cell-box[data-state="answer"]  .dp-cell-val { color: #4ade80; }
  .dp-cell-label-bot { font-size: 0.6rem; color: var(--text-ghost); font-family: monospace; text-align: center; }
  .sum-readout { font-size: 0.85rem; font-family: monospace; color: var(--text-muted); padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 28px; width: 100%; max-width: 600px; }
  .sum-readout strong { color: var(--text-bright); }
  .sum-readout .val-p1 { color: #fbbf24; }
  .sum-readout .val-p2 { color: #f87171; }
  .sum-readout .val-ans { color: #4ade80; font-weight: 700; }
  /* pseudo code in sidebar */
  .pseudo-panel { display: flex; flex-direction: column; gap: 4px; }
  .code-line { display: flex; align-items: center; }
  .code-line.hl { background: var(--border-soft); border-left: 2px solid var(--accent); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"n":"1"}'>Tiny (n=1)</option>
      <option value='{"n":"2"}'>Small (n=2)</option>
      <option value='{"n":"3"}'>Basic (n=3)</option>
      <option value='{"n":"5"}'>Medium (n=5)</option>
      <option value='{"n":"8"}'>Larger (n=8)</option>
      <option value='{"n":"15"}'>Max (n=15)</option>
    </select>
  </div>
  <div>
    <label>n</label>
    <input id="inp-n" type="number" value="8" min="1" max="15" style="width:70px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Climbing Stairs</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Enter n and click Run.</div>
    <div class="dp-track" id="dp-track">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter n and click Run.</span>
    </div>
    <div class="sum-readout" id="sum-readout">&mdash;</div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Pseudocode</div>
    <div class="pseudo-panel" id="pseudo-body" style="font-size:0.72rem;line-height:1.7;font-family:monospace;color:var(--text-muted);white-space:pre"></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">climbStairs</span><span class="op">(</span>n<span class="op">):</span>'],
  [2,  '    dp <span class="op">=</span> <span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">*</span> <span class="op">(</span>n <span class="op">+</span> <span class="nb">1</span><span class="op">)</span>'],
  [3,  '    dp<span class="op">[</span><span class="nb">0</span><span class="op">]</span> <span class="op">=</span> <span class="nb">1</span>'],
  [4,  '    dp<span class="op">[</span><span class="nb">1</span><span class="op">]</span> <span class="op">=</span> <span class="nb">1</span>'],
  [0,  ''],
  [6,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="nb">2</span><span class="op">,</span> n <span class="op">+</span> <span class="nb">1</span><span class="op">):</span>'],
  [7,  '        dp<span class="op">[</span>i<span class="op">]</span> <span class="op">=</span> dp<span class="op">[</span>i<span class="op">-</span><span class="nb">1</span><span class="op">]</span> <span class="op">+</span> dp<span class="op">[</span>i<span class="op">-</span><span class="nb">2</span><span class="op">]</span>'],
  [0,  ''],
  [9,  '    <span class="kw">return</span> dp<span class="op">[</span>n<span class="op">]</span>'],
];

var PSEUDO = [
  [1,  'function climbStairs(n):'],
  [2,  '  dp[0] = 1'],
  [3,  '  dp[1] = 1'],
  [0,  ''],
  [5,  '  for i = 2 to n:'],
  [6,  '    dp[i] = dp[i-1] + dp[i-2]'],
  [0,  ''],
  [8,  '  return dp[n]'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel('code-body', CODE);
  buildCodePanel('pseudo-body', PSEUDO);

  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      renderSnap(snap, cur > 0);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
    }
  });

  buildAndRun();
});

function buildCodePanel(id, lines) {
  var body = document.getElementById(id);
  body.innerHTML = lines.map(function(e) {
    var ln = e[0], html = e[1];
    var idAttr = ln > 0 ? ' id="' + id + '-cl-' + ln + '"' : '';
    return '<div class="code-line"' + idAttr + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function buildAndRun() {
  var n = parseInt(document.getElementById('inp-n').value);
  if (isNaN(n) || n < 1) n = 1;
  if (n > 15) n = 15;
  buildTrack(n);
  simSteps = buildSteps(n);
  nav.load(simSteps);
}

function buildTrack(n) {
  var track = document.getElementById('dp-track');
  track.innerHTML = '';
  for (var i = 0; i <= n; i++) {
    var wrap = document.createElement('div');
    wrap.className = 'dp-cell-wrap';
    wrap.id = 'dpw-' + i;
    wrap.innerHTML =
      '<div class="dp-cell-box" id="dpb-' + i + '" data-state="empty">' +
        '<span class="dp-cell-idx">dp[' + i + ']</span>' +
        '<span class="dp-cell-val" id="dpv-' + i + '">?</span>' +
      '</div>' +
      '<div class="dp-cell-label-bot" id="dpl-' + i + '"></div>';
    track.appendChild(wrap);
  }
}

function buildSteps(n) {
  var dp = new Array(n + 1).fill(null);
  var steps = [];

  function snap(i, desc, lines, phase, prev1, prev2) {
    steps.push({
      i:      i,
      dp:     dp.slice(),
      desc:   desc,
      lines:  lines,
      phase:  phase,
      prev1:  prev1 !== undefined ? prev1 : -1,
      prev2:  prev2 !== undefined ? prev2 : -1,
    });
  }

  snap(-1, 'Allocate dp[0..n] with n+1 slots. All cells empty.', [2], 'Init');
  dp[0] = 1;
  snap(-1, 'dp[0] = 1 \u2014 one way to be at step 0 (do nothing).', [3], 'Init');
  dp[1] = 1;
  snap(-1, 'dp[1] = 1 \u2014 one way to reach step 1 (take one step).', [4], 'Init');

  for (var i = 2; i <= n; i++) {
    snap(i,
      'i = ' + i + '. dp[i] = dp[' + (i-1) + '] + dp[' + (i-2) + '] = ' + dp[i-1] + ' + ' + dp[i-2] + ' = ?',
      [6, 7], 'Compute', i-1, i-2);
    dp[i] = dp[i-1] + dp[i-2];
    snap(i,
      'dp[' + i + '] = ' + dp[i-1] + ' + ' + dp[i-2] + ' = ' + dp[i] + '.',
      [7], 'Compute', i-1, i-2);
  }

  snap(-1, 'dp[' + n + '] = ' + dp[n] + ' \u2014 total distinct ways to climb ' + n + ' stairs.', [9], 'Done');
  return steps;
}

function renderSnap(snap, animate) {
  gsap.killTweensOf('.dp-cell-box');
  gsap.killTweensOf('.dp-cell-val');
  gsap.killTweensOf('.sum-readout');

  var n = snap.dp.length - 1;

  for (var i = 0; i <= n; i++) {
    var box  = document.getElementById('dpb-' + i);
    var valEl = document.getElementById('dpv-' + i);
    var lbl  = document.getElementById('dpl-' + i);
    if (!box || !valEl) continue;

    var prevText = valEl.textContent;
    var val = snap.dp[i];
    var text = val === null ? '?' : String(val);

    var state = 'empty';
    var isDone = snap.phase === 'Done';

    if (isDone && i === n) state = 'answer';
    else if (i === snap.i) state = 'current';
    else if (i === snap.prev1) state = 'prev1';
    else if (i === snap.prev2) state = 'prev2';
    else if (val !== null) state = 'filled';

    box.dataset.state = state;
    valEl.textContent = text;

    if (animate && text !== '?' && prevText !== text) {
      gsap.fromTo(box, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' });
    }
    if (animate && (state === 'prev1' || state === 'prev2')) {
      gsap.fromTo(box, { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1 });
    }
    if (lbl) {
      if (i === snap.prev1) lbl.innerHTML = '<span style="font-size:0.58rem;color:#fbbf24">i-1</span>';
      else if (i === snap.prev2) lbl.innerHTML = '<span style="font-size:0.58rem;color:#f87171">i-2</span>';
      else lbl.innerHTML = '';
    }
  }

  var readout = document.getElementById('sum-readout');
  if (readout) {
    var html = '&mdash;';
    if (snap.i >= 2) {
      var p1 = snap.dp[snap.i - 1];
      var p2 = snap.dp[snap.i - 2];
      var cur = snap.dp[snap.i];
      var p1s = p1 !== null ? String(p1) : '?';
      var p2s = p2 !== null ? String(p2) : '?';
      html = 'dp[' + snap.i + '] = ' +
        '<span class="val-p1">dp[' + (snap.i-1) + ']</span> + ' +
        '<span class="val-p2">dp[' + (snap.i-2) + ']</span> = ' +
        '<span class="val-p1">' + p1s + '</span> + ' +
        '<span class="val-p2">' + p2s + '</span>';
      if (cur !== null) html += ' = <span class="val-ans">' + cur + '</span>';
    } else if (snap.phase === 'Done') {
      var ans = snap.dp[n];
      html = 'Answer: <span class="val-ans">dp[' + n + '] = ' + ans + '</span>';
    }
    readout.innerHTML = html;
    if (animate) gsap.from(readout, { opacity: 0, y: 6, duration: 0.25 });
  }

  setCodeLines('code-body', CODE, snap.lines);
  setCodeLines('pseudo-body', PSEUDO, snap.lines.map(function(l) {
    var map = { 2:2, 3:2, 4:3, 6:5, 7:6, 9:8 };
    return map[l] || l;
  }));
}

function setCodeLines(panelId, lines, activeLines) {
  lines.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById(panelId + '-cl-' + ln);
    if (!el) return;
    if (activeLines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-n').value = d.n;
  buildAndRun();
}

function randomExample() {
  var n = Math.floor(Math.random() * 14) + 1;
  document.getElementById('inp-n').value = n;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) { dragging = false; handle.classList.remove('dragging'); }
  });
})();
</script>
</body>
</html>
