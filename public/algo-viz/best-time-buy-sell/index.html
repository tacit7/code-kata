<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Best Time to Buy and Sell Stock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1b26; color: #c0caf5; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { padding: 10px 16px; background: #24283b; border-bottom: 1px solid #414868; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 13px; font-weight: 600; color: #7aa2f7; }
  .lc-link { font-size: 11px; color: #565f89; text-decoration: none; margin-left: auto; }
  .lc-link:hover { color: #7aa2f7; }

  .main { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 16px; gap: 14px; }

  /* Chart area */
  .chart-wrap { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* State row */
  .state-row { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  .pill { background: #24283b; border: 1px solid #414868; border-radius: 6px; padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 90px; }
  .pill-label { font-size: 10px; color: #565f89; text-transform: uppercase; letter-spacing: .05em; }
  .pill-val { font-size: 15px; font-weight: 700; }
  .val-day { color: #7aa2f7; }
  .val-price { color: #c0caf5; }
  .val-min { color: #f7768e; }
  .val-profit { color: #9ece6a; }
  .val-max { color: #e0af68; }

  /* Viz inputs */
  .viz-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 10px 0 14px; width: 100%; max-width: 90%; }
  .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #565f89; }
  .viz-inputs input[type="text"] { background: #24283b; border: 1px solid #414868; color: #c0caf5; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; width: 220px; font-family: inherit; outline: none; }
  .viz-inputs input[type="text"]:focus { border-color: #7aa2f7; }
  .viz-inputs select { background: #24283b; border: 1px solid #414868; color: #c0caf5; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
  .viz-inputs select:focus { border-color: #7aa2f7; }
  .viz-inputs button { background: #24283b; border: 1px solid #414868; color: #c0caf5; border-radius: 6px; padding: 7px 18px; font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s; }
  .viz-inputs button:hover { background: #2a2d3e; border-color: #7aa2f7; }
  .viz-inputs button.primary { background: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; font-weight: 700; }
  .viz-inputs button.primary:hover { background: #89b4fa; }

  /* Controls */
  .controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
  .btn { background: #24283b; border: 1px solid #414868; color: #c0caf5; border-radius: 6px; padding: 5px 12px; font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { background: #2a2d3e; border-color: #7aa2f7; }
  .btn.primary { background: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; font-weight: 700; }
  .btn.primary:hover { background: #89b4fa; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .speed-label { font-size: 11px; color: #565f89; }
  select.spd { background: #24283b; border: 1px solid #414868; color: #c0caf5; border-radius: 6px; padding: 5px 8px; font-family: inherit; font-size: 12px; cursor: pointer; }

  /* Input area */
  .input-row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .input-row input { background: #24283b; border: 1px solid #414868; color: #c0caf5; border-radius: 6px; padding: 5px 10px; font-family: inherit; font-size: 12px; flex: 1; outline: none; }
  .input-row input:focus { border-color: #7aa2f7; }
  .input-row label { font-size: 11px; color: #565f89; white-space: nowrap; }

  .result-banner { background: #9ece6a18; border: 1px solid #9ece6a40; border-radius: 6px; padding: 6px 12px; font-size: 12px; color: #9ece6a; text-align: center; flex-shrink: 0; }
  .result-banner.none { background: #f7768e18; border-color: #f7768e40; color: #f7768e; }
</style>
</head>
<body>
<header>
  <h1>Best Time to Buy &amp; Sell Stock</h1>
  <span style="font-size:11px;color:#565f89">greedy · one-pass · O(n)</span>
  <a class="lc-link" href="https://leetcode.com/problems/best-time-to-buy-and-sell-stock/" target="_blank">#121 ↗</a>
</header>

<div class="main">
  <div class="viz-inputs">
    <div class="field">
      <label>Preset</label>
      <select id="presetSel" onchange="loadPreset()">
        <option value="">— pick a preset —</option>
        <option value='{"prices":"7,1,5,3,6,4"}'>Example: buy@1 sell@6</option>
        <option value='{"prices":"7,6,4,3,1"}'>Decreasing: no profit</option>
        <option value='{"prices":"1,2,3,4,5"}'>Increasing: buy@1 sell@5</option>
        <option value='{"prices":"1,5,1"}'>Single peak: buy@1 sell@5</option>
        <option value='{"prices":"3,2,6,5,0,3"}'>Two peaks: buy@2 sell@6</option>
        <option value='{"prices":"2,4,1,7,5,11"}'>Volatile: buy@1 sell@11</option>
      </select>
    </div>
    <div class="field">
      <label>Prices</label>
      <input id="pricesInput" type="text" value="7,1,5,3,6,4" />
    </div>
    <button class="btn primary" onclick="buildAndRun()">Run</button>
    <button class="btn" onclick="randomExample()">🎲 Random</button>
  </div>

  <div class="state-row">
    <div class="pill"><span class="pill-label">Day</span><span class="pill-val val-day" id="dayVal">—</span></div>
    <div class="pill"><span class="pill-label">Price</span><span class="pill-val val-price" id="priceVal">—</span></div>
    <div class="pill"><span class="pill-label">Min so far</span><span class="pill-val val-min" id="minVal">—</span></div>
    <div class="pill"><span class="pill-label">Profit today</span><span class="pill-val val-profit" id="todayProfitVal">—</span></div>
    <div class="pill"><span class="pill-label">Max profit</span><span class="pill-val val-max" id="maxProfitVal">0</span></div>
  </div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <div id="resultBanner" class="result-banner" style="display:none"></div>

  <div class="controls">
    <button class="btn primary" id="playBtn">▷ Play</button>
    <button class="btn" id="stepBtn">Step →</button>
    <button class="btn" id="resetBtn">↺ Reset</button>
    <span class="speed-label">Speed:</span>
    <select class="spd" id="speedSel">
      <option value="900">Slow</option>
      <option value="500" selected>Normal</option>
      <option value="200">Fast</option>
    </select>
  </div>
</div>

<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

const $ = id => document.getElementById(id);

// ── State ───────────────────────────────────────────────────────────────────
let prices = [7,1,5,3,6,4];
let step = -1;          // current day index (-1 = not started)
let minPrice = Infinity;
let maxProfit = 0;
let buyDay = -1;        // day of min price (for drawing buy marker)
let bestBuyDay = -1;
let bestSellDay = -1;
let playing = false;
let timer = null;

// ── Parse & load ─────────────────────────────────────────────────────────────
function load() {
  const raw = $('pricesInput').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  if (raw.length < 2) return;
  prices = raw;
  reset();
}

function randomPrices() {
  const n = 8 + Math.floor(Math.random() * 5);
  const arr = [];
  let v = 20 + Math.floor(Math.random() * 80);
  for (let i = 0; i < n; i++) {
    v = Math.max(1, v + Math.floor(Math.random() * 20) - 9);
    arr.push(v);
  }
  $('pricesInput').value = arr.join(',');
  prices = arr;
  reset();
}

function reset() {
  stopPlay();
  step = -1;
  minPrice = Infinity;
  maxProfit = 0;
  buyDay = -1;
  bestBuyDay = -1;
  bestSellDay = -1;
  $('dayVal').textContent = '—';
  $('priceVal').textContent = '—';
  $('minVal').textContent = '—';
  $('todayProfitVal').textContent = '—';
  $('maxProfitVal').textContent = '0';
  $('resultBanner').style.display = 'none';
  draw();
}

// ── Algorithm step ────────────────────────────────────────────────────────────
function advance() {
  if (step >= prices.length - 1) { stopPlay(); return; }
  step++;
  const price = prices[step];

  if (price < minPrice) {
    minPrice = price;
    buyDay = step;
  }
  const todayProfit = price - minPrice;
  if (todayProfit > maxProfit) {
    maxProfit = todayProfit;
    bestBuyDay = buyDay;
    bestSellDay = step;
  }

  $('dayVal').textContent = step + 1;
  $('priceVal').textContent = price;
  $('minVal').textContent = minPrice === Infinity ? '—' : minPrice;
  $('todayProfitVal').textContent = todayProfit >= 0 ? todayProfit : 0;
  $('maxProfitVal').textContent = maxProfit;

  draw();

  if (step === prices.length - 1) {
    stopPlay();
    const banner = $('resultBanner');
    banner.style.display = '';
    if (maxProfit > 0) {
      banner.className = 'result-banner';
      banner.textContent = `✓ Max profit: ${maxProfit}  |  Buy day ${bestBuyDay + 1} @ $${prices[bestBuyDay]}  →  Sell day ${bestSellDay + 1} @ $${prices[bestSellDay]}`;
    } else {
      banner.className = 'result-banner none';
      banner.textContent = 'No profitable transaction possible — return 0';
    }
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  ctx.clearRect(0, 0, W, H);

  if (prices.length === 0) return;

  const PAD = { top: 20, right: 20, bottom: 36, left: 44 };
  const chartW = W - PAD.left - PAD.right;
  const chartH = H - PAD.top - PAD.bottom;
  const n = prices.length;
  const maxP = Math.max(...prices);
  const minP = Math.min(...prices);
  const range = maxP - minP || 1;

  const xOf = i => PAD.left + (i / (n - 1)) * chartW;
  const yOf = v => PAD.top + chartH - ((v - minP) / range) * chartH;

  // Grid lines
  ctx.strokeStyle = '#414868';
  ctx.lineWidth = 0.5;
  for (let t = 0; t <= 4; t++) {
    const v = minP + (range * t) / 4;
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + chartW, y); ctx.stroke();
    ctx.fillStyle = '#565f89';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(v), PAD.left - 6, y + 4);
  }

  // Day labels
  ctx.fillStyle = '#565f89';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    ctx.fillText(`D${i+1}`, xOf(i), PAD.top + chartH + 18);
  }

  // Best profit span (shaded background)
  if (bestBuyDay >= 0 && bestSellDay >= 0 && step === prices.length - 1) {
    ctx.fillStyle = '#9ece6a10';
    ctx.fillRect(xOf(bestBuyDay), PAD.top, xOf(bestSellDay) - xOf(bestBuyDay), chartH);
  }

  // Price line (grey for unvisited)
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    i === 0 ? ctx.moveTo(xOf(i), yOf(prices[i])) : ctx.lineTo(xOf(i), yOf(prices[i]));
  }
  ctx.strokeStyle = '#414868';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Visited portion
  if (step >= 0) {
    ctx.beginPath();
    for (let i = 0; i <= step; i++) {
      i === 0 ? ctx.moveTo(xOf(i), yOf(prices[i])) : ctx.lineTo(xOf(i), yOf(prices[i]));
    }
    ctx.strokeStyle = '#7aa2f7';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Min price horizontal line
  if (step >= 0 && minPrice !== Infinity) {
    const y = yOf(minPrice);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#f7768e88';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xOf(buyDay), y); ctx.lineTo(xOf(step), y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Dots
  for (let i = 0; i < n; i++) {
    const x = xOf(i), y = yOf(prices[i]);
    ctx.beginPath();
    ctx.arc(x, y, i === step ? 5 : 3.5, 0, Math.PI * 2);
    if (i === bestBuyDay && step === prices.length - 1) {
      ctx.fillStyle = '#f7768e';
    } else if (i === bestSellDay && step === prices.length - 1) {
      ctx.fillStyle = '#9ece6a';
    } else if (i === buyDay && step >= 0) {
      ctx.fillStyle = '#f7768ecc';
    } else if (i <= step) {
      ctx.fillStyle = '#7aa2f7';
    } else {
      ctx.fillStyle = '#414868';
    }
    ctx.fill();
    // price label above dot
    if (i <= step || i === 0) {
      ctx.fillStyle = i === step ? '#c0caf5' : '#565f89';
      ctx.font = i === step ? 'bold 11px monospace' : '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(prices[i], x, y - 10);
    }
  }

  // Buy/sell labels on final
  if (step === prices.length - 1 && bestBuyDay >= 0) {
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#f7768e';
    ctx.textAlign = 'center';
    ctx.fillText('BUY', xOf(bestBuyDay), yOf(prices[bestBuyDay]) + 18);
    ctx.fillStyle = '#9ece6a';
    ctx.fillText('SELL', xOf(bestSellDay), yOf(prices[bestSellDay]) - 20);
  }
}

// ── Playback ──────────────────────────────────────────────────────────────────
function startPlay() {
  if (step >= prices.length - 1) reset();
  playing = true;
  $('playBtn').textContent = '⏸ Pause';
  tick();
}

function stopPlay() {
  playing = false;
  clearTimeout(timer);
  $('playBtn').textContent = '▷ Play';
}

function tick() {
  if (!playing) return;
  advance();
  if (step < prices.length - 1) {
    timer = setTimeout(tick, parseInt($('speedSel').value));
  }
}

// ── Viz inputs handlers ───────────────────────────────────────────────────────
function buildAndRun() {
  load();
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('pricesInput').value = d.prices;
  buildAndRun();
}

function randomExample() {
  randomPrices();
  document.getElementById('presetSel').value = '';
}

// ── Events ────────────────────────────────────────────────────────────────────
$('playBtn').addEventListener('click', () => playing ? stopPlay() : startPlay());
$('stepBtn').addEventListener('click', () => { stopPlay(); advance(); });
$('resetBtn').addEventListener('click', reset);
$('pricesInput').addEventListener('keydown', e => e.key === 'Enter' && buildAndRun());

window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
