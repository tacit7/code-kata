<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Best Time to Buy and Sell Stock</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: 16px; gap: 14px; }

  /* State row */
  .state-row { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  .pill { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 90px; }
  .pill-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .pill-val { font-size: 15px; font-weight: 700; }
  .val-day { color: #7aa2f7; }
  .val-price { color: #c0caf5; }
  .val-min { color: #f7768e; }
  .val-profit { color: #9ece6a; }
  .val-max { color: #e0af68; }

  /* Chart area */
  .chart-wrap { position: relative; flex: 1; min-height: 220px; }
  canvas { display: block; width: 100%; height: 100%; }

  .result-banner { background: #9ece6a18; border: 1px solid #9ece6a40; border-radius: 6px; padding: 6px 12px; font-size: 12px; color: #9ece6a; text-align: center; flex-shrink: 0; }
  .result-banner.none { background: #f7768e18; border-color: #f7768e40; color: #f7768e; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }
  .cm { color: var(--text-dim); font-style: italic; }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-play:hover { background: var(--accent-hover); }
  #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:220px;">
      <option value="">— pick a preset —</option>
      <option value='{"prices":"7,1,5,3,6,4"}' selected>Example: buy@1 sell@6</option>
      <option value='{"prices":"7,6,4,3,1"}'>Decreasing: no profit</option>
      <option value='{"prices":"1,2,3,4,5"}'>Increasing: buy@1 sell@5</option>
      <option value='{"prices":"1,5,1"}'>Single peak: buy@1 sell@5</option>
      <option value='{"prices":"3,2,6,5,0,3"}'>Two peaks: buy@2 sell@6</option>
      <option value='{"prices":"2,4,1,7,5,11"}'>Volatile: buy@1 sell@11</option>
    </select>
  </div>
  <div>
    <label>Prices</label>
    <input id="pricesInput" type="text" value="7,1,5,3,6,4" style="width:220px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Best Time to Buy &amp; Sell Stock</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="state-row">
      <div class="pill"><span class="pill-label">Day</span><span class="pill-val val-day" id="dayVal">—</span></div>
      <div class="pill"><span class="pill-label">Price</span><span class="pill-val val-price" id="priceVal">—</span></div>
      <div class="pill"><span class="pill-label">Min so far</span><span class="pill-val val-min" id="minVal">—</span></div>
      <div class="pill"><span class="pill-label">Profit today</span><span class="pill-val val-profit" id="todayProfitVal">—</span></div>
      <div class="pill"><span class="pill-label">Max profit</span><span class="pill-val val-max" id="maxProfitVal">0</span></div>
    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

    <div id="resultBanner" class="result-banner" style="display:none"></div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Variables</div>
      <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// ── Render state (driven by current snapshot) ────────────────────────────────
let prices = [7,1,5,3,6,4];
let step = -1;          // current day index (-1 = not started)
let minPrice = Infinity;
let maxProfit = 0;
let buyDay = -1;        // day of min price (for drawing buy marker)
let bestBuyDay = -1;
let bestSellDay = -1;

const codeLines = [
  { n: 1, t: '<span class="kw">def</span> <span class="nb">max_profit</span>(prices):' },
  { n: 2, t: '  min_price = <span class="nb">float</span>(<span class="nb">"inf"</span>)' },
  { n: 3, t: '  max_profit = 0' },
  { n: 4, t: '  <span class="kw">for</span> price <span class="kw">in</span> prices:' },
  { n: 5, t: '    <span class="kw">if</span> price < min_price:' },
  { n: 6, t: '      min_price = price' },
  { n: 7, t: '    <span class="kw">elif</span> price - min_price > max_profit:' },
  { n: 8, t: '      max_profit = price - min_price' },
  { n: 9, t: '  <span class="kw">return</span> max_profit' },
];

window.addEventListener('DOMContentLoaded', function() {
  const codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    const el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + (line.n - 1);
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  $('pricesInput').addEventListener('keydown', e => { if (e.key === 'Enter') buildAndRun(); });
  window.addEventListener('resize', draw);

  buildAndRun();
});

// ── Build snapshot steps ──────────────────────────────────────────────────────
function simulate(arr) {
  const steps = [];
  let minP = Infinity, maxP = 0, bDay = -1, bestB = -1, bestS = -1;

  steps.push({
    phase: 'Setup', desc: 'Initialize min_price = ∞, max_profit = 0.',
    step: -1, price: null, minPrice: Infinity, maxProfit: 0, todayProfit: null,
    buyDay: -1, bestBuyDay: -1, bestSellDay: -1, done: false, lines: [0, 1, 2]
  });

  for (let i = 0; i < arr.length; i++) {
    const price = arr[i];
    const lines = [3, 4];
    if (price < minP) {
      minP = price;
      bDay = i;
      lines.push(5);
    } else {
      lines.push(6);
    }
    const todayProfit = price - minP;
    let updatedMax = false;
    if (price >= minP && todayProfit > maxP) {
      maxP = todayProfit;
      bestB = bDay;
      bestS = i;
      updatedMax = true;
      lines.push(7);
    }
    const done = i === arr.length - 1;
    steps.push({
      phase: 'Day ' + (i + 1),
      desc: 'price = ' + price + '. min_price = ' + minP + '. profit today = ' + (todayProfit >= 0 ? todayProfit : 0) + '.' + (updatedMax ? ' New max profit = ' + maxP + '.' : ''),
      step: i, price: price, minPrice: minP, maxProfit: maxP, todayProfit: todayProfit >= 0 ? todayProfit : 0,
      buyDay: bDay, bestBuyDay: bestB, bestSellDay: bestS, done: done, lines: lines
    });
  }
  return steps;
}

function buildAndRun() {
  const raw = $('pricesInput').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  if (raw.length < 2) return;
  prices = raw;
  const steps = simulate(prices);
  window.nav.load(steps);
}

// ── Apply a snapshot to the DOM + canvas ──────────────────────────────────────
function applyStep(snap) {
  step = snap.step;
  minPrice = snap.minPrice;
  maxProfit = snap.maxProfit;
  buyDay = snap.buyDay;
  bestBuyDay = snap.bestBuyDay;
  bestSellDay = snap.bestSellDay;

  if (snap.step < 0) {
    $('dayVal').textContent = '—';
    $('priceVal').textContent = '—';
    $('minVal').textContent = '—';
    $('todayProfitVal').textContent = '—';
    $('maxProfitVal').textContent = '0';
  } else {
    $('dayVal').textContent = snap.step + 1;
    $('priceVal').textContent = snap.price;
    $('minVal').textContent = snap.minPrice === Infinity ? '—' : snap.minPrice;
    $('todayProfitVal').textContent = snap.todayProfit;
    $('maxProfitVal').textContent = snap.maxProfit;
  }

  // Variables sidebar
  const varsDiv = $('vars-items');
  if (snap.step < 0) {
    varsDiv.innerHTML = '<div class="var-item"><span class="var-key">min_price</span> = <span class="var-val">∞</span></div>' +
      '<div class="var-item"><span class="var-key">max_profit</span> = <span class="var-val">0</span></div>';
  } else {
    let html = '';
    html += '<div class="var-item"><span class="var-key">price</span> = <span class="var-val">' + snap.price + '</span></div>';
    html += '<div class="var-item"><span class="var-key">min_price</span> = <span class="var-val">' + snap.minPrice + '</span></div>';
    html += '<div class="var-item"><span class="var-key">max_profit</span> = <span class="var-val">' + snap.maxProfit + '</span></div>';
    varsDiv.innerHTML = html;
  }

  // Code highlight
  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  (snap.lines || []).forEach(function(idx) {
    const el = document.getElementById('cl-' + idx);
    if (el) el.classList.add('hl');
  });

  // Result banner
  const banner = $('resultBanner');
  if (snap.done) {
    banner.style.display = '';
    if (snap.maxProfit > 0) {
      banner.className = 'result-banner';
      banner.textContent = '✓ Max profit: ' + snap.maxProfit + '  |  Buy day ' + (snap.bestBuyDay + 1) + ' @ $' + prices[snap.bestBuyDay] + '  →  Sell day ' + (snap.bestSellDay + 1) + ' @ $' + prices[snap.bestSellDay];
    } else {
      banner.className = 'result-banner none';
      banner.textContent = 'No profitable transaction possible — return 0';
    }
  } else {
    banner.style.display = 'none';
  }

  draw();
}

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

// ── Drawing (canvas) ────────────────────────────────────────────────────────
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  ctx.clearRect(0, 0, W, H);

  if (prices.length === 0) return;

  const PAD = { top: 20, right: 20, bottom: 36, left: 44 };
  const chartW = W - PAD.left - PAD.right;
  const chartH = H - PAD.top - PAD.bottom;
  const n = prices.length;
  const maxP = Math.max(...prices);
  const minP = Math.min(...prices);
  const range = maxP - minP || 1;

  const xOf = i => PAD.left + (i / (n - 1)) * chartW;
  const yOf = v => PAD.top + chartH - ((v - minP) / range) * chartH;

  // Grid lines
  ctx.strokeStyle = '#414868';
  ctx.lineWidth = 0.5;
  for (let t = 0; t <= 4; t++) {
    const v = minP + (range * t) / 4;
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + chartW, y); ctx.stroke();
    ctx.fillStyle = '#565f89';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(v), PAD.left - 6, y + 4);
  }

  // Day labels
  ctx.fillStyle = '#565f89';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    ctx.fillText(`D${i+1}`, xOf(i), PAD.top + chartH + 18);
  }

  // Best profit span (shaded background)
  if (bestBuyDay >= 0 && bestSellDay >= 0 && step === prices.length - 1) {
    ctx.fillStyle = '#9ece6a10';
    ctx.fillRect(xOf(bestBuyDay), PAD.top, xOf(bestSellDay) - xOf(bestBuyDay), chartH);
  }

  // Price line (grey for unvisited)
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    i === 0 ? ctx.moveTo(xOf(i), yOf(prices[i])) : ctx.lineTo(xOf(i), yOf(prices[i]));
  }
  ctx.strokeStyle = '#414868';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Visited portion
  if (step >= 0) {
    ctx.beginPath();
    for (let i = 0; i <= step; i++) {
      i === 0 ? ctx.moveTo(xOf(i), yOf(prices[i])) : ctx.lineTo(xOf(i), yOf(prices[i]));
    }
    ctx.strokeStyle = '#7aa2f7';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Min price horizontal line
  if (step >= 0 && minPrice !== Infinity) {
    const y = yOf(minPrice);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#f7768e88';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xOf(buyDay), y); ctx.lineTo(xOf(step), y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Dots
  for (let i = 0; i < n; i++) {
    const x = xOf(i), y = yOf(prices[i]);
    ctx.beginPath();
    ctx.arc(x, y, i === step ? 5 : 3.5, 0, Math.PI * 2);
    if (i === bestBuyDay && step === prices.length - 1) {
      ctx.fillStyle = '#f7768e';
    } else if (i === bestSellDay && step === prices.length - 1) {
      ctx.fillStyle = '#9ece6a';
    } else if (i === buyDay && step >= 0) {
      ctx.fillStyle = '#f7768ecc';
    } else if (i <= step) {
      ctx.fillStyle = '#7aa2f7';
    } else {
      ctx.fillStyle = '#414868';
    }
    ctx.fill();
    // price label above dot
    if (i <= step || i === 0) {
      ctx.fillStyle = i === step ? '#c0caf5' : '#565f89';
      ctx.font = i === step ? 'bold 11px monospace' : '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(prices[i], x, y - 10);
    }
  }

  // Buy/sell labels on final
  if (step === prices.length - 1 && bestBuyDay >= 0) {
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#f7768e';
    ctx.textAlign = 'center';
    ctx.fillText('BUY', xOf(bestBuyDay), yOf(prices[bestBuyDay]) + 18);
    ctx.fillStyle = '#9ece6a';
    ctx.fillText('SELL', xOf(bestSellDay), yOf(prices[bestSellDay]) - 20);
  }
}

// ── Viz inputs handlers ───────────────────────────────────────────────────────
function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('pricesInput').value = d.prices;
  buildAndRun();
}

function randomExample() {
  const n = 8 + Math.floor(Math.random() * 5);
  const arr = [];
  let v = 20 + Math.floor(Math.random() * 80);
  for (let i = 0; i < n; i++) {
    v = Math.max(1, v + Math.floor(Math.random() * 20) - 9);
    arr.push(v);
  }
  document.getElementById('pricesInput').value = arr.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ── Resize handle ─────────────────────────────────────────────────────────────
(function() {
  const handle = document.getElementById('resize-handle');
  const panel  = document.getElementById('code-panel');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    panel.style.width = Math.min(560, Math.max(120, startW + (startX - e.clientX))) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
