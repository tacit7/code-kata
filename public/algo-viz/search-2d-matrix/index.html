<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>74. Search a 2D Matrix</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

    .page-header {
      flex-shrink:0;
      padding:10px 16px 0;
    }
    .page-title {
      font-size:1rem; font-weight:700; color:var(--text-bright); letter-spacing:0.01em;
    }
    .page-sub {
      font-size:0.72rem; color:var(--text-dim); margin-top:2px;
    }

    /* ── viz-inputs ── */
    .viz-inputs {
      display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
      padding:8px 16px 10px; flex-shrink:0; border-bottom:1px solid var(--border-soft);
    }
    .viz-inputs .field { display:flex; flex-direction:column; gap:4px; }
    .viz-inputs label {
      font-size:0.68rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.08em; color:var(--text-dim);
    }
    .viz-inputs select, .viz-inputs textarea, .viz-inputs input {
      background:var(--surface); color:var(--text); border:1px solid var(--border);
      border-radius:6px; font-size:0.82rem; padding:5px 8px;
    }
    .viz-inputs textarea { resize:none; font-family:monospace; width:180px; height:62px; }
    .viz-inputs input[type="number"] { width:72px; }
    .viz-inputs select { min-width:200px; }
    .btn-run {
      padding:7px 18px; background:var(--accent); color:#fff;
      border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.82rem;
    }
    .btn-run:hover { background:var(--accent-hover); }
    .btn-rand {
      padding:7px 14px; background:var(--surface); color:var(--text);
      border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:0.82rem;
    }
    .btn-rand:hover { border-color:var(--accent); }
    .input-error { color:var(--red); font-size:0.73rem; align-self:center; max-width:220px; }

    /* ── main layout ── */
    .viz-root {
      display:flex; flex:1; gap:14px;
      padding:10px 16px 14px; min-height:0;
    }
    .left-col, .right-col {
      display:flex; flex-direction:column; gap:10px; min-width:0;
    }
    .left-col  { flex:1.1; }
    .right-col { flex:1; }

    /* ── panel-box (from shared style via CSS vars) ── */
    .panel-box {
      background:var(--surface); border:1px solid var(--border-soft);
      border-radius:var(--radius-md); padding:10px 12px;
    }
    .panel-title {
      font-size:0.65rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.1em; color:var(--text-dim); margin-bottom:8px;
    }

    /* ── Matrix grid ── */
    #matrixGrid {
      display:grid; gap:5px;
    }
    .cell {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      border-radius:6px; border:2px solid var(--border);
      background:var(--surface-dark); cursor:default; position:relative;
      transition:border-color 0.1s, background 0.1s, opacity 0.1s;
    }
    .cell-val {
      font-size:0.92rem; font-weight:700; color:var(--text-bright);
    }
    .cell-idx {
      font-size:0.52rem; color:var(--text-dim); margin-top:1px; font-family:monospace;
    }
    .cell.eliminated {
      opacity:0.28; border-color:var(--border-soft);
    }
    .cell.eliminated .cell-val { text-decoration:line-through; color:var(--text-ghost); }
    .cell.active {
      border-color:var(--yellow); background:rgba(224,175,104,0.12);
    }
    .cell.active .cell-val { color:var(--yellow-light); }
    .cell.found {
      border-color:var(--green); background:rgba(158,206,106,0.15);
    }
    .cell.found .cell-val { color:var(--green-light); }
    .cell.not-found-cell {
      opacity:0.22; border-color:var(--red);
    }

    /* ── Flattened index bar ── */
    .flat-container { position:relative; padding-top:6px; overflow:hidden; }
    .flat-bracket {
      position:absolute; top:0; height:6px;
      background:rgba(122,162,247,0.35); border-radius:3px 3px 0 0;
      border-top:2px solid var(--accent);
      pointer-events:none; transition:left 0.15s, width 0.15s;
    }
    #flatBar {
      display:flex; gap:3px; flex-wrap:wrap;
    }
    .flat-cell {
      width:28px; height:28px; border-radius:4px;
      border:1px solid var(--border); background:var(--surface-dark);
      display:flex; align-items:center; justify-content:center;
      font-size:0.62rem; font-family:monospace; color:var(--text-dim);
      transition:border-color 0.1s, background 0.1s, opacity 0.1s;
    }
    .flat-cell.flat-eliminated { opacity:0.2; border-color:var(--border-soft); }
    .flat-cell.flat-active {
      border-color:var(--yellow); background:rgba(224,175,104,0.15); color:var(--yellow-light);
    }
    .flat-cell.flat-found {
      border-color:var(--green); background:rgba(158,206,106,0.18); color:var(--green-light);
    }
    .flat-cell.flat-not-found { opacity:0.2; border-color:var(--red); }

    /* ── Nav row ── */
    .nav-row { display:flex; align-items:center; gap:6px; }
    .nav-btn {
      background:var(--surface-dark); border:1px solid var(--border);
      color:var(--text); border-radius:6px; padding:5px 10px;
      cursor:pointer; font-size:0.78rem;
    }
    .nav-btn:hover { border-color:var(--accent); }
    .nav-btn:disabled { opacity:0.35; cursor:default; }
    .nav-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .nav-btn.primary:hover { background:var(--accent-hover); }
    .nav-speed {
      background:var(--surface-dark); border:1px solid var(--border);
      color:var(--text); border-radius:6px; padding:5px 6px; font-size:0.75rem;
    }
    .step-counter { font-size:0.65rem; color:var(--text-dim); margin-top:5px; }
    .phase-badge {
      display:inline-block; font-size:0.6rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.1em;
      color:var(--accent); background:rgba(122,162,247,0.08);
      border:1px solid rgba(122,162,247,0.2);
      border-radius:4px; padding:2px 8px; margin-bottom:6px;
    }
    .phase-badge.found-badge { color:var(--green); background:rgba(158,206,106,0.08); border-color:rgba(158,206,106,0.25); }
    .phase-badge.notfound-badge { color:var(--red); background:rgba(247,118,142,0.08); border-color:rgba(247,118,142,0.25); }
    .step-desc { font-size:0.78rem; color:var(--text-muted); line-height:1.45; }

    /* ── Pointer boxes ── */
    .ptr-row { display:flex; gap:7px; }
    .ptr-box {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
      padding:7px 4px; border-radius:7px;
      background:var(--surface-dark); border:1px solid var(--border);
      transition:border-color 0.1s;
    }
    .ptr-box.active-ptr { border-color:var(--accent); }
    .ptr-label { font-size:0.56rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--text-dim); }
    .ptr-value { font-size:1.05rem; font-weight:700; color:var(--text-bright); font-family:monospace; }
    .ptr-box.lo-box.active-ptr .ptr-value { color:var(--orange); }
    .ptr-box.hi-box.active-ptr .ptr-value { color:var(--blue); }
    .ptr-box.mid-box .ptr-value { color:var(--yellow); }
    .ptr-box.target-box .ptr-value { color:var(--purple); }

    /* ── Decomposition ── */
    .decomp-line {
      font-size:0.8rem; color:var(--text-muted); font-family:monospace;
      padding:2px 0; display:flex; align-items:center; gap:5px;
    }
    .decomp-key { color:var(--accent); font-weight:700; min-width:28px; }
    .decomp-num { color:var(--yellow-light); font-weight:700; }

    /* ── Comparison ── */
    .cmp-expr {
      font-size:0.86rem; font-weight:600; font-family:monospace;
      line-height:1.5;
    }
    .cmp-lt { color:var(--orange); }
    .cmp-gt { color:var(--blue); }
    .cmp-eq { color:var(--green); }

    /* ── Result banner ── */
    .result-banner {
      display:flex; align-items:center; justify-content:center;
      font-size:0.88rem; font-weight:700;
      padding:10px 14px; border-radius:7px;
      letter-spacing:0.02em;
    }
    .result-banner.found-banner {
      background:rgba(158,206,106,0.12); border:1px solid rgba(158,206,106,0.3);
      color:var(--green-light);
    }
    .result-banner.notfound-banner {
      background:rgba(247,118,142,0.10); border:1px solid rgba(247,118,142,0.28);
      color:var(--red-light);
    }
  </style>
</head>
<body>

<div class="page-header">
  <div class="page-title">74. Search a 2D Matrix</div>
  <div class="page-sub">Binary search on flat index &middot; O(log m&middot;n) time &middot; O(1) space</div>
</div>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">&#8212; pick a preset &#8212;</option>
      <option value="0">3&times;4 matrix &mdash; target=3 (Found 0,1)</option>
      <option value="1">3&times;4 matrix &mdash; target=13 (Not found)</option>
      <option value="2">3&times;4 matrix &mdash; target=60 (Found 2,3 last cell)</option>
      <option value="3">3&times;4 matrix &mdash; target=1 (Found 0,0 first cell)</option>
      <option value="4">2&times;2 matrix &mdash; target=6 (Found 1,0)</option>
      <option value="5">1&times;1 matrix &mdash; target=1 (Found 0,0 edge case)</option>
    </select>
  </div>
  <div class="field">
    <label>Matrix rows (comma-separated)</label>
    <textarea id="matrixInput" rows="3" spellcheck="false">1,3,5,7
10,11,16,20
23,30,34,60</textarea>
  </div>
  <div class="field">
    <label>Target</label>
    <input id="targetInput" type="number" value="3" />
  </div>
  <button class="btn-run" onclick="buildAndRun()">Run</button>
  <button class="btn-rand" onclick="randomExample()">&#127922; Random</button>
  <div id="inputError" class="input-error" style="display:none;"></div>
</div>

<div class="viz-root">

  <!-- LEFT COLUMN -->
  <div class="left-col">

    <div class="panel-box">
      <div class="panel-title" id="gridLabel">Matrix</div>
      <div id="matrixGrid"></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Flat Index View &mdash; treat as 1D array [0 &hellip; m&middot;n&minus;1]</div>
      <div class="flat-container" id="flatContainer">
        <div class="flat-bracket" id="flatBracket" style="display:none;"></div>
        <div id="flatBar"></div>
      </div>
    </div>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-col">

    <div style="display:flex;gap:10px;">
      <div class="panel-box" style="flex:0 0 auto;">
        <div class="nav-row">
          <button class="nav-btn" id="prevBtn">&larr;</button>
          <button class="nav-btn" id="stepBtn">&rarr;</button>
          <button class="nav-btn primary" id="playBtn">Play</button>
          <button class="nav-btn" id="resetBtn" onclick="buildAndRun()">&#8635;</button>
          <select class="nav-speed" id="speedSel">
            <option value="1200">Slow</option>
            <option value="650" selected>Normal</option>
            <option value="280">Fast</option>
          </select>
        </div>
        <div class="step-counter" id="counter">Step 0 / 0</div>
      </div>
      <div class="panel-box" style="flex:1;min-width:0;">
        <div class="phase-badge" id="phaseBadge">&#8212;</div>
        <div class="step-desc" id="stepDesc">Load a preset or enter values to begin.</div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Search Pointers</div>
      <div class="ptr-row">
        <div class="ptr-box lo-box">
          <div class="ptr-label">lo</div>
          <div class="ptr-value" id="ptrLo">&#8212;</div>
        </div>
        <div class="ptr-box mid-box">
          <div class="ptr-label">mid</div>
          <div class="ptr-value" id="ptrMid">&#8212;</div>
        </div>
        <div class="ptr-box hi-box">
          <div class="ptr-label">hi</div>
          <div class="ptr-value" id="ptrHi">&#8212;</div>
        </div>
        <div class="ptr-box target-box">
          <div class="ptr-label">target</div>
          <div class="ptr-value" id="ptrTarget">&#8212;</div>
        </div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Mid &rarr; (row, col) Decomposition</div>
      <div id="decompContent"><span style="color:var(--text-dim)">&#8212;</span></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Comparison</div>
      <div id="cmpContent"><span style="color:var(--text-dim)">&#8212;</span></div>
    </div>

    <div id="resultBanner" style="display:none;"></div>

  </div>
</div>

<div class="controls"></div>

<script>
// ── Presets ──────────────────────────────────────────────────────────────────
var PRESETS = [
  { matrix: [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target: 3  },
  { matrix: [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target: 13 },
  { matrix: [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target: 60 },
  { matrix: [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target: 1  },
  { matrix: [[1,4],[6,8]],                           target: 6  },
  { matrix: [[1]],                                   target: 1  }
];

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (sel.value === '') return;
  var p = PRESETS[parseInt(sel.value)];
  document.getElementById('matrixInput').value = p.matrix.map(function(r){ return r.join(','); }).join('\n');
  document.getElementById('targetInput').value = p.target;
  buildAndRun();
}

// ── randomExample ─────────────────────────────────────────────────────────────
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function randomExample() {
  var rows = randInt(2, 4);
  var cols = randInt(2, 5);
  var total = rows * cols;
  var vals = [];
  var cur = randInt(1, 5);
  for (var i = 0; i < total; i++) {
    vals.push(cur);
    cur += randInt(1, 8);
  }
  var matrix = [];
  for (var r = 0; r < rows; r++) {
    matrix.push(vals.slice(r * cols, (r + 1) * cols));
  }
  var target;
  if (Math.random() < 0.6) {
    target = vals[randInt(0, total - 1)];
  } else {
    // Find a gap where a missing value can hide
    var gapIdx = -1;
    for (var k = 0; k < total - 1; k++) {
      if (vals[k + 1] - vals[k] > 1) { gapIdx = k; break; }
    }
    if (gapIdx >= 0) {
      target = randInt(vals[gapIdx] + 1, vals[gapIdx + 1] - 1);
    } else {
      // All adjacent values differ by 1 — go outside the range
      target = vals[total - 1] + randInt(1, 10);
    }
  }
  document.getElementById('matrixInput').value = matrix.map(function(r){ return r.join(','); }).join('\n');
  document.getElementById('targetInput').value = target;
  buildAndRun();
}

// ── Input parsing ──────────────────────────────────────────────────────────────
function parseInputs() {
  var errEl = document.getElementById('inputError');
  errEl.style.display = 'none';

  function err(msg) {
    errEl.textContent = msg;
    errEl.style.display = 'block';
    return null;
  }

  var rawTarget = document.getElementById('targetInput').value.trim();
  var target = parseInt(rawTarget);
  if (isNaN(target)) return err('Target must be an integer.');

  var rawRows = document.getElementById('matrixInput').value.trim().split('\n');
  if (!rawRows.length || (rawRows.length === 1 && rawRows[0] === ''))
    return err('Matrix cannot be empty.');

  var matrix = [];
  var cols = -1;
  for (var r = 0; r < rawRows.length; r++) {
    var trimmed = rawRows[r].trim();
    if (!trimmed) continue;
    var parts = trimmed.split(',').map(function(s){ return parseInt(s.trim()); });
    if (parts.some(isNaN)) return err('Row ' + (r+1) + ' contains non-integer values.');
    if (cols < 0) cols = parts.length;
    else if (parts.length !== cols) return err('Row ' + (r+1) + ' has ' + parts.length + ' values but row 1 has ' + cols + '.');
    matrix.push(parts);
  }
  if (!matrix.length) return err('Matrix cannot be empty.');

  // Validate strictly increasing
  var flat = [];
  for (var i = 0; i < matrix.length; i++) for (var j = 0; j < matrix[i].length; j++) flat.push(matrix[i][j]);
  for (var i = 1; i < flat.length; i++) {
    if (flat[i] <= flat[i-1])
      return err('Matrix must be strictly increasing. flat[' + i + ']=' + flat[i] + ' ≤ flat[' + (i-1) + ']=' + flat[i-1]);
  }

  return { matrix: matrix, target: target };
}

// ── buildSteps ────────────────────────────────────────────────────────────────
function buildSteps(matrix, target) {
  var rows = matrix.length;
  var cols = matrix[0].length;
  var total = rows * cols;
  var steps = [];

  steps.push({
    lo: 0, hi: total - 1, mid: null, midRow: null, midCol: null, midVal: null,
    phase: 'init', found: null, matrix: matrix, target: target, rows: rows, cols: cols,
    label: 'Start: lo=0, hi=' + (total-1) + ', searching for target=' + target
  });

  var lo = 0, hi = total - 1;

  while (lo <= hi) {
    var mid = Math.floor((lo + hi) / 2);
    var midRow = Math.floor(mid / cols);
    var midCol = mid % cols;
    var midVal = matrix[midRow][midCol];

    steps.push({
      lo: lo, hi: hi, mid: mid, midRow: midRow, midCol: midCol, midVal: midVal,
      phase: 'check', found: null, matrix: matrix, target: target, rows: rows, cols: cols,
      label: 'mid = (' + lo + '+' + hi + ')\u00F72 = ' + mid + ' \u2192 (row=' + midRow + ', col=' + midCol + '), matrix[' + midRow + '][' + midCol + '] = ' + midVal
    });

    if (midVal === target) {
      steps.push({
        lo: lo, hi: hi, mid: mid, midRow: midRow, midCol: midCol, midVal: midVal,
        phase: 'found', found: true, matrix: matrix, target: target, rows: rows, cols: cols,
        label: midVal + ' == ' + target + ' \u2192 FOUND at (' + midRow + ', ' + midCol + ')!'
      });
      return steps;
    } else if (midVal < target) {
      var newLo = mid + 1;
      steps.push({
        lo: newLo, hi: hi, mid: mid, midRow: midRow, midCol: midCol, midVal: midVal,
        phase: 'adjust-lo', found: null, matrix: matrix, target: target, rows: rows, cols: cols,
        label: midVal + ' < ' + target + ' \u2192 search right half, lo: ' + lo + ' \u2192 ' + newLo
      });
      lo = newLo;
    } else {
      var newHi = mid - 1;
      steps.push({
        lo: lo, hi: newHi, mid: mid, midRow: midRow, midCol: midCol, midVal: midVal,
        phase: 'adjust-hi', found: null, matrix: matrix, target: target, rows: rows, cols: cols,
        label: midVal + ' > ' + target + ' \u2192 search left half, hi: ' + hi + ' \u2192 ' + newHi
      });
      hi = newHi;
    }
  }

  // not-found: clear mid so no stale highlight
  steps.push({
    lo: lo, hi: hi, mid: null, midRow: null, midCol: null, midVal: null,
    phase: 'not-found', found: false, matrix: matrix, target: target, rows: rows, cols: cols,
    label: 'lo (' + lo + ') > hi (' + hi + ') \u2192 target ' + target + ' not in matrix'
  });

  return steps;
}

// ── render ────────────────────────────────────────────────────────────────────
function render(snap, cursor, total) {
  var lo = snap.lo, hi = snap.hi, mid = snap.mid;
  var midRow = snap.midRow, midCol = snap.midCol, midVal = snap.midVal;
  var phase = snap.phase, target = snap.target;
  var rows = snap.rows, cols = snap.cols;
  var matrix = snap.matrix;
  var totalCells = rows * cols;

  var cellSize = totalCells > 12 ? 44 : 56;
  var cellFont = totalCells > 12 ? '0.78rem' : '0.92rem';

  // Counter
  document.getElementById('counter').textContent = 'Step ' + (cursor + 1) + ' / ' + total;

  // Phase badge
  var phaseLabels = {
    'init': 'Init',
    'check': 'Check',
    'adjust-lo': 'Adjust lo',
    'adjust-hi': 'Adjust hi',
    'found': 'Found ✓',
    'not-found': 'Not Found ✗'
  };
  var badge = document.getElementById('phaseBadge');
  badge.textContent = phaseLabels[phase] || phase;
  badge.className = 'phase-badge' +
    (phase === 'found' ? ' found-badge' : phase === 'not-found' ? ' notfound-badge' : '');
  document.getElementById('stepDesc').textContent = snap.label;

  // Grid label
  document.getElementById('gridLabel').textContent =
    'Matrix (' + rows + '\u00D7' + cols + ' = ' + totalCells + ' cells)';

  // Matrix grid
  var gridEl = document.getElementById('matrixGrid');
  gridEl.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cellSize + 'px)';
  gridEl.innerHTML = '';

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var flatIdx = r * cols + c;
      var val = matrix[r][c];
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';

      if (phase === 'found' && r === midRow && c === midCol) {
        cell.classList.add('found');
      } else if (phase === 'not-found') {
        cell.classList.add('not-found-cell');
      } else if (mid !== null && r === midRow && c === midCol) {
        cell.classList.add('active');
      } else if (flatIdx < lo || flatIdx > hi) {
        cell.classList.add('eliminated');
      }

      var valEl = document.createElement('div');
      valEl.className = 'cell-val';
      valEl.style.fontSize = cellFont;
      valEl.textContent = val;
      cell.appendChild(valEl);

      var idxEl = document.createElement('div');
      idxEl.className = 'cell-idx';
      idxEl.textContent = flatIdx;
      cell.appendChild(idxEl);

      gridEl.appendChild(cell);
    }
  }

  // Flattened bar
  var barEl = document.getElementById('flatBar');
  barEl.innerHTML = '';

  for (var i = 0; i < totalCells; i++) {
    var box = document.createElement('div');
    box.className = 'flat-cell';

    if (phase === 'found' && i === mid) {
      box.classList.add('flat-found');
    } else if (phase === 'not-found') {
      box.classList.add('flat-not-found');
    } else if (i === mid) {
      box.classList.add('flat-active');
    } else if (i < lo || i > hi) {
      box.classList.add('flat-eliminated');
    }

    box.textContent = i;
    barEl.appendChild(box);
  }

  // Bracket: position using flex item widths
  var bracketEl = document.getElementById('flatBracket');
  var containerEl = document.getElementById('flatContainer');
  if (phase !== 'not-found' && lo <= hi && totalCells > 0) {
    // Each flat-cell is 28px + 3px gap = 31px; container offset-based positioning
    var cellW = 31; // 28px cell + 3px gap
    var bracketLeft = lo * cellW;
    var bracketWidth = (hi - lo + 1) * cellW - 3;
    bracketEl.style.display = 'block';
    bracketEl.style.left = bracketLeft + 'px';
    bracketEl.style.width = bracketWidth + 'px';
  } else {
    bracketEl.style.display = 'none';
  }

  // Pointer boxes
  document.getElementById('ptrLo').textContent = lo;
  document.getElementById('ptrMid').textContent = mid !== null ? mid : '\u2014';
  document.getElementById('ptrHi').textContent = hi;
  document.getElementById('ptrTarget').textContent = target;

  // Highlight active pointer
  document.querySelectorAll('.ptr-box').forEach(function(b){ b.classList.remove('active-ptr'); });
  if (phase === 'adjust-lo') document.querySelector('.lo-box').classList.add('active-ptr');
  else if (phase === 'adjust-hi') document.querySelector('.hi-box').classList.add('active-ptr');
  else if (phase === 'check' || phase === 'found') document.querySelector('.mid-box').classList.add('active-ptr');

  // Decomposition panel
  var decompEl = document.getElementById('decompContent');
  if (mid !== null) {
    decompEl.innerHTML =
      '<div class="decomp-line"><span class="decomp-key">mid</span> = (' + lo + ' + ' + hi + ') \u00F7 2 = <span class="decomp-num">' + mid + '</span></div>' +
      '<div class="decomp-line"><span class="decomp-key">row</span> = ' + mid + ' \u00F7 ' + cols + ' = <span class="decomp-num">' + midRow + '</span></div>' +
      '<div class="decomp-line"><span class="decomp-key">col</span> = ' + mid + ' % ' + cols + ' = <span class="decomp-num">' + midCol + '</span></div>';
  } else {
    decompEl.innerHTML = '<span style="color:var(--text-dim)">\u2014</span>';
  }

  // Comparison panel
  var cmpEl = document.getElementById('cmpContent');
  if (midVal !== null) {
    var cmpClass, cmpSymbol, cmpNote;
    if (midVal < target) {
      cmpClass = 'cmp-lt';
      cmpSymbol = ' < ';
      cmpNote = ' \u2192 move lo right';
    } else if (midVal > target) {
      cmpClass = 'cmp-gt';
      cmpSymbol = ' > ';
      cmpNote = ' \u2192 move hi left';
    } else {
      cmpClass = 'cmp-eq';
      cmpSymbol = ' == ';
      cmpNote = ' \u2192 FOUND!';
    }
    cmpEl.innerHTML = '<div class="cmp-expr ' + cmpClass + '">' +
      'matrix[' + midRow + '][' + midCol + '] = ' + midVal + cmpSymbol + target + cmpNote +
      '</div>';
  } else {
    cmpEl.innerHTML = '<span style="color:var(--text-dim)">\u2014</span>';
  }

  // Result banner
  var bannerEl = document.getElementById('resultBanner');
  if (phase === 'found') {
    bannerEl.style.display = 'flex';
    bannerEl.className = 'result-banner found-banner';
    bannerEl.textContent = '\u2713 FOUND at (' + midRow + ', ' + midCol + ') \u2014 matrix[' + midRow + '][' + midCol + '] = ' + midVal;
  } else if (phase === 'not-found') {
    bannerEl.style.display = 'flex';
    bannerEl.className = 'result-banner notfound-banner';
    bannerEl.textContent = '\u2717 NOT FOUND \u2014 target ' + target + ' is not in the matrix';
  } else {
    bannerEl.style.display = 'none';
  }
}

// ── Bootstrap ──────────────────────────────────────────────────────────────────
var btnPrev  = document.getElementById('prevBtn');
var btnNext  = document.getElementById('stepBtn');
var btnPlay  = document.getElementById('playBtn');
var speedSel = document.getElementById('speedSel');

var nav = VizNav({ btnPrev: btnPrev, btnNext: btnNext, btnPlay: btnPlay, speedSel: speedSel, render: render });

function buildAndRun() {
  var parsed = parseInputs();
  if (!parsed) return;
  var steps = buildSteps(parsed.matrix, parsed.target);
  nav.load(steps);
}

// postMessage bridge for parent app control
window.addEventListener('message', function(e) {
  var msg = e.data;
  if (msg === 'prev')  btnPrev.click();
  else if (msg === 'step')  btnNext.click();
  else if (msg === 'play')  btnPlay.click();
  else if (msg === 'reset') buildAndRun();
  else if (msg && msg.type === 'speed') speedSel.value = msg.value;
});

window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('presetSel').value = '0';
  loadPreset();
});
</script>
</body>
</html>
