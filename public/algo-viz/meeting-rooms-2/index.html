<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Rooms II — Visualization</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: 16px; gap: 8px; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* ── code panel ── */
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); }
  .nb { color: var(--green); }
  .cm { color: var(--text-dim); font-style: italic; }

  /* ── gantt panel ── */
  #gantt-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 4px; }
  #gantt-container { position: relative; }
  #gantt-ruler { display: flex; margin-bottom: 6px; margin-left: 68px; font-size: 0.65rem; color: var(--text-dim); }
  .room-row { display: flex; align-items: center; height: 36px; margin-bottom: 6px; }
  .room-label { width: 62px; flex-shrink: 0; font-size: 0.72rem; color: var(--text-dim); text-align: right; padding-right: 8px; font-weight: 600; }
  .room-track { flex: 1; height: 100%; position: relative; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid var(--border); }
  .meeting-bar { position: absolute; top: 4px; height: calc(100% - 8px); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 600; color: #1a1b26; transition: opacity 0.2s; overflow: hidden; white-space: nowrap; }
  .meeting-bar.active-highlight { outline: 2px solid #fff; outline-offset: 1px; }

  #step-desc { font-size: 0.85rem; color: var(--text); min-height: 1.4em; margin-top: 8px; }

  /* ── sidebar: heap + counter ── */
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  #heap-list { display: flex; flex-direction: column; gap: 5px; }
  .heap-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.04); border: 1px solid var(--border); font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .heap-item.heap-min { border-color: var(--accent); background: rgba(122,162,247,0.1); color: var(--accent); }
  .heap-item .heap-room-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #rooms-counter { font-size: 0.82rem; color: var(--text-dim); }
  #rooms-counter span { font-weight: 700; color: var(--accent); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:220px;">
      <option value="">— custom —</option>
      <option value="0,30;5,10;15,20" selected>0,30;5,10;15,20 (2 rooms)</option>
      <option value="7,10;2,4">7,10;2,4 (1 room)</option>
      <option value="1,5;2,6;3,7;4,8">all overlap (4 rooms)</option>
      <option value="1,3;3,5;5,7;7,9">back-to-back (1 room)</option>
      <option value="0,10;1,3;2,4;5,8;6,9">nested mix (3 rooms)</option>
      <option value="1,4;2,5;7,9;8,10;3,6">5 meetings (3 rooms)</option>
    </select>
  </div>
  <div>
    <label>Intervals (start,end;…)</label>
    <input type="text" id="intervals-input" value="0,30;5,10;15,20" style="width:260px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Meeting Rooms II</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="gantt-title">Gantt — Room Assignments</div>
    <div id="gantt-ruler"></div>
    <div id="gantt-rows"></div>
    <div id="step-desc">Press Run to start.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Min-Heap (end times)</div>
      <div id="heap-list"></div>
    </div>
    <div id="rooms-counter">Rooms needed: <span id="rooms-val">—</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ── palette for rooms ──────────────────────────────────────────────────────
var COLORS = [
  '#7aa2f7', '#9ece6a', '#e0af68', '#f7768e', '#bb9af7',
  '#2ac3de', '#ff9e64', '#73daca', '#b4f9f8', '#c0caf5',
];

// ── code display ────────────────────────────────────────────────────────────
var codeLines = [
  { n: 1, t: '<span class="kw">def</span> <span class="nb">min_meeting_rooms</span>(intervals):' },
  { n: 2, t: '  intervals.sort(key=<span class="kw">lambda</span> x: x[0])' },
  { n: 3, t: '  heap = []  <span class="cm"># min-heap of end times</span>' },
  { n: 4, t: '  <span class="kw">for</span> s, e <span class="kw">in</span> intervals:' },
  { n: 5, t: '    <span class="kw">if</span> heap <span class="kw">and</span> heap[0] &lt;= s:' },
  { n: 6, t: '      heapq.heappop(heap)' },
  { n: 7, t: '    heapq.heappush(heap, e)' },
  { n: 8, t: '  <span class="kw">return</span> <span class="nb">len</span>(heap)' },
];

// ── min-heap (array-backed) ────────────────────────────────────────────────
function MinHeap() {
  var h = [];
  function swap(i, j) { var t = h[i]; h[i] = h[j]; h[j] = t; }
  function up(i) {
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (h[p].end <= h[i].end) break;
      swap(p, i); i = p;
    }
  }
  function down(i) {
    var n = h.length;
    while (true) {
      var l = 2*i+1, r = 2*i+2, s = i;
      if (l < n && h[l].end < h[s].end) s = l;
      if (r < n && h[r].end < h[s].end) s = r;
      if (s === i) break;
      swap(s, i); i = s;
    }
  }
  return {
    push: function(item) { h.push(item); up(h.length - 1); },
    pop:  function() {
      var top = h[0]; h[0] = h[h.length - 1]; h.pop(); down(0); return top;
    },
    peek: function() { return h[0]; },
    size: function() { return h.length; },
    snapshot: function() { return h.slice(); },
  };
}

// ── build steps ───────────────────────────────────────────────────────────
function buildSteps(intervals) {
  var steps = [];
  var sorted = intervals.slice().sort(function(a, b) { return a[0] - b[0]; });

  // calc timeline extent
  var maxEnd = 0;
  sorted.forEach(function(iv) { if (iv[1] > maxEnd) maxEnd = iv[1]; });

  // step 0: sorted list
  steps.push({
    phase: 'sort',
    desc: 'Sort intervals by start time: [' + sorted.map(function(iv){ return '['+iv[0]+','+iv[1]+']'; }).join(', ') + ']',
    assignments: [],   // {meetingIdx, room, start, end}
    heap: [],
    activeIdx: -1,
    reused: false,
    roomsNeeded: 0,
    maxEnd: maxEnd,
    sorted: sorted,
    lines: [1, 2],
  });

  var heap = MinHeap();
  var assignments = [];
  var nextRoom = 0;

  sorted.forEach(function(iv, i) {
    var s = iv[0], e = iv[1];
    var reused = false;
    var room;

    if (heap.size() > 0 && heap.peek().end <= s) {
      var freed = heap.pop();
      room = freed.room;
      reused = true;
    } else {
      room = nextRoom++;
    }
    heap.push({ end: e, room: room });
    assignments.push({ meetingIdx: i, room: room, start: s, end: e });

    steps.push({
      phase: 'assign',
      desc: (reused
        ? 'Meeting ['+s+','+e+']: room '+room+' is free (ends ≤ '+s+'). Reuse it. Push end='+e+'.'
        : 'Meeting ['+s+','+e+']: no free room (heap min end > '+s+'). Open new room '+room+'. Push end='+e+'.'
      ),
      assignments: assignments.slice(),
      heap: heap.snapshot().slice().sort(function(a,b){ return a.end - b.end; }),
      activeIdx: i,
      reused: reused,
      roomsNeeded: nextRoom,
      maxEnd: maxEnd,
      sorted: sorted,
      lines: reused ? [3, 4, 5, 6, 7] : [3, 4, 5, 7],
    });
  });

  // final step
  steps.push({
    phase: 'done',
    desc: 'Done. Minimum rooms needed: ' + nextRoom + '.',
    assignments: assignments.slice(),
    heap: heap.snapshot().slice().sort(function(a,b){ return a.end - b.end; }),
    activeIdx: -1,
    reused: false,
    roomsNeeded: nextRoom,
    maxEnd: maxEnd,
    sorted: sorted,
    lines: [8],
  });

  return steps;
}

// ── parse input ───────────────────────────────────────────────────────────
function parseIntervals(raw) {
  var parts = raw.trim().split(';');
  var out = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (!p) continue;
    var nums = p.split(',').map(Number);
    if (nums.length >= 2 && !isNaN(nums[0]) && !isNaN(nums[1])) {
      out.push([nums[0], nums[1]]);
    }
  }
  return out;
}

// ── render ────────────────────────────────────────────────────────────────
function applyStep(snap) {
  document.getElementById('step-desc').textContent = snap.desc;
  document.getElementById('rooms-val').textContent =
    snap.roomsNeeded > 0 ? snap.roomsNeeded : '—';

  renderGantt(snap);
  renderHeap(snap);

  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  (snap.lines || []).forEach(function(n) {
    var el = document.getElementById('cl-' + (n - 1));
    if (el) el.classList.add('hl');
  });
}

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

function renderGantt(snap) {
  var numRooms = snap.roomsNeeded || 1;
  var maxEnd = snap.maxEnd || 30;
  var rowsEl = document.getElementById('gantt-rows');
  var rulerEl = document.getElementById('gantt-ruler');

  // ruler ticks
  var ticks = [];
  var step = Math.ceil(maxEnd / 8);
  for (var t = 0; t <= maxEnd; t += step) {
    ticks.push(t);
  }
  if (ticks[ticks.length - 1] < maxEnd) ticks.push(maxEnd);

  rulerEl.innerHTML = '';
  var rulerInner = document.createElement('div');
  rulerInner.style.cssText = 'position:relative; flex:1; height:16px;';
  ticks.forEach(function(t) {
    var pct = (t / maxEnd) * 100;
    var tick = document.createElement('span');
    tick.textContent = t;
    tick.style.cssText = 'position:absolute; left:' + pct + '%; transform:translateX(-50%); font-size:0.6rem; color:var(--text-dim);';
    rulerInner.appendChild(tick);
  });
  rulerEl.appendChild(rulerInner);

  // build room rows — we need at least numRooms rows
  rowsEl.innerHTML = '';
  for (var r = 0; r < numRooms; r++) {
    var row = document.createElement('div');
    row.className = 'room-row';

    var label = document.createElement('div');
    label.className = 'room-label';
    label.textContent = 'Room ' + r;
    row.appendChild(label);

    var track = document.createElement('div');
    track.className = 'room-track';

    // place bars for this room
    snap.assignments.forEach(function(a) {
      if (a.room !== r) return;
      var bar = document.createElement('div');
      bar.className = 'meeting-bar';
      if (a.meetingIdx === snap.activeIdx) bar.classList.add('active-highlight');

      var left = (a.start / maxEnd) * 100;
      var width = ((a.end - a.start) / maxEnd) * 100;
      bar.style.cssText = 'left:' + left + '%; width:' + Math.max(width, 1) + '%; background:' + COLORS[r % COLORS.length] + ';';
      bar.textContent = a.start + '–' + a.end;
      track.appendChild(bar);
    });

    row.appendChild(track);
    rowsEl.appendChild(row);
  }
}

function renderHeap(snap) {
  var listEl = document.getElementById('heap-list');
  listEl.innerHTML = '';

  if (snap.heap.length === 0) {
    var empty = document.createElement('div');
    empty.style.cssText = 'font-size:0.75rem; color:var(--text-dim); font-style:italic;';
    empty.textContent = 'empty';
    listEl.appendChild(empty);
    return;
  }

  snap.heap.forEach(function(item, i) {
    var el = document.createElement('div');
    el.className = 'heap-item' + (i === 0 ? ' heap-min' : '');

    var dot = document.createElement('div');
    dot.className = 'heap-room-dot';
    dot.style.background = COLORS[item.room % COLORS.length];
    el.appendChild(dot);

    var label = document.createElement('span');
    label.textContent = 'end=' + item.end + '  (R' + item.room + ')' + (i === 0 ? '  ← min' : '');
    el.appendChild(label);

    listEl.appendChild(el);
  });
}

// ── wire up ───────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + (line.n - 1);
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  document.getElementById('intervals-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') buildAndRun();
  });

  buildAndRun();
});

function buildAndRun() {
  var raw = document.getElementById('intervals-input').value;
  var intervals = parseIntervals(raw);
  if (intervals.length === 0) return;
  window.nav.load(buildSteps(intervals));
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  document.getElementById('intervals-input').value = sel.value;
  buildAndRun();
}

function randomExample() {
  var count = 3 + Math.floor(Math.random() * 4);
  var parts = [];
  for (var i = 0; i < count; i++) {
    var start = Math.floor(Math.random() * 20);
    var dur = 2 + Math.floor(Math.random() * 10);
    parts.push(start + ',' + (start + dur));
  }
  document.getElementById('intervals-input').value = parts.join(';');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ── resize handle ───────────────────────────────────────────────────────────
(function(){
  var h=document.getElementById('resize-handle'),p=document.getElementById('code-panel'),d=false,sx=0,sw=0;
  h.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('dragging');e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!d)return;p.style.width=Math.min(560,Math.max(120,sw+(sx-e.clientX)))+'px';});
  document.addEventListener('mouseup',function(){if(!d)return;d=false;h.classList.remove('dragging');});
})();
</script>
</body>
</html>
