<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partition Labels</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .viz-inputs input.inp-str { width: 280px; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; }

    #desc { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; min-height: 20px; }

    /* string display */
    .string-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
      overflow-x: auto;
    }
    .char-row { display: flex; gap: 4px; flex-wrap: nowrap; min-height: 52px; align-items: flex-end; }
    .char-cell {
      min-width: 30px; height: 44px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px solid var(--border-soft); border-radius: 5px;
      font-family: monospace; font-size: 1rem; font-weight: 700;
      color: var(--text-ghost); background: #0f0f0f;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      position: relative; flex-shrink: 0;
    }
    .char-cell[data-state="idle"]      { color: var(--text-ghost); border-color: var(--border-soft); background: #0f0f0f; }
    .char-cell[data-state="scanned"]   { color: var(--text-dim);   border-color: #2a4a2a; background: #0a1a0a; }
    .char-cell[data-state="current"]   { color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); }
    .char-cell[data-state="window"]    { color: #c4b5fd; border-color: #7c3aed; background: #1e1030; }
    .char-cell[data-state="extend"]    { color: #fde68a; border-color: #d97706; background: #1c1000; }
    .char-cell[data-state="close"]     { color: #bbf7d0; border-color: #15803d; background: #052e16; }
    .char-cell[data-state="done"]      { color: #86efac; border-color: #166534; background: #052e16; }
    .char-cell[data-state="building"]  { color: #7dd3fc; border-color: #0284c7; background: #0c1a2e; }

    .idx-row { display: flex; gap: 4px; }
    .idx-cell {
      min-width: 30px; flex-shrink: 0;
      text-align: center; font-size: 0.58rem;
      color: var(--text-ghost); font-family: monospace;
    }

    .partition-bar-row { display: flex; gap: 4px; height: 10px; }
    .partition-seg {
      height: 100%; border-radius: 3px;
      background: transparent;
      flex-shrink: 0;
    }

    /* bottom panels */
    .panels-row { display: flex; gap: 12px; flex-wrap: wrap; }

    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
    }

    /* last_occurrence map */
    .last-occ-grid {
      display: flex; gap: 5px; flex-wrap: wrap;
    }
    .lo-cell {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 5px 7px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; min-width: 38px;
      transition: border-color 0.15s, background 0.15s;
    }
    .lo-cell[data-active="true"] { border-color: var(--accent); background: var(--surface-dark); }
    .lo-cell[data-seen="true"]   { border-color: #0284c7; background: #0c1a2e; }
    .lo-char { font-family: monospace; font-size: 0.9rem; font-weight: 700; color: var(--text-bright); }
    .lo-idx  { font-family: monospace; font-size: 0.75rem; color: var(--text-muted); }
    .lo-idx.active { color: var(--accent-pale); }

    /* pointers */
    .ptr-row { display: flex; gap: 8px; }
    .ptr-box {
      flex: 1; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .ptr-box.ptr-i       { border-color: var(--accent); }
    .ptr-box.ptr-end     { border-color: #7c3aed; }
    .ptr-box.ptr-start   { border-color: #0284c7; }
    .ptr-box.ptr-maxend  { border-color: #d97706; }
    .ptr-label { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); }
    .ptr-val   { font-size: 1.4rem; font-weight: 700; color: var(--text-bright); }

    /* partitions found */
    .parts-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .part-chip {
      padding: 4px 10px; border-radius: 4px;
      font-family: monospace; font-size: 0.82rem; font-weight: 600;
      background: #052e16; border: 1px solid #166534; color: #86efac;
    }

    .legend-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-faint); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 1px solid transparent; }

    /* resize handle + code panel + sidebar */
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
    .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
    .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
    .kw { color: var(--purple); }
    .nb { color: var(--green); }
    .cm { color: var(--text-dim); font-style: italic; }

    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .side-ptr-col { display: flex; flex-direction: column; gap: 8px; }
    .side-ptr-col .ptr-box { flex: none; flex-direction: row; justify-content: space-between; align-items: center; }
    .side-ptr-col .ptr-val { font-size: 1.1rem; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-step:hover { background: #334155; }
    .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-play:hover { background: var(--accent-hover); }
    #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:200px;">
      <option value="">— pick a preset —</option>
      <option value='{"str":"ababcbacadefegdehijhklij"}' selected>Complex (default)</option>
      <option value='{"str":"eccbbbbdec"}'>Simple</option>
      <option value='{"str":"abcdef"}'>All unique</option>
      <option value='{"str":"aaaaaa"}'>All same</option>
      <option value='{"str":"ababab"}'>Two chars</option>
      <option value='{"str":"abcabcabc"}'>Repeating pattern</option>
    </select>
  </div>
  <div>
    <label>String</label>
    <input id="inp-str" class="inp-str" type="text" value="ababcbacadefegdehijhklij" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Partition Labels</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">

    <div id="desc">Enter a string and click Run.</div>

    <div class="string-section" id="string-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter a string and click Run.</span>
    </div>

    <div class="panels-row">
      <div class="panel-box" style="flex:1;min-width:220px">
        <div class="panel-title">last_occurrence</div>
        <div class="last-occ-grid" id="lo-grid">
          <span style="color:var(--text-ghost);font-size:0.78rem">—</span>
        </div>
      </div>

      <div class="panel-box" style="flex:1;min-width:200px">
        <div class="panel-title">Partitions found</div>
        <div class="parts-list" id="parts-list">
          <span style="color:var(--text-ghost);font-size:0.78rem">—</span>
        </div>
        <div class="legend-row" style="margin-top:4px">
          <div class="legend-item"><div class="legend-dot" style="background:var(--surface-dark);border-color:var(--accent)"></div>current i</div>
          <div class="legend-item"><div class="legend-dot" style="background:#1e1030;border-color:#7c3aed"></div>in window</div>
          <div class="legend-item"><div class="legend-dot" style="background:#1c1000;border-color:#d97706"></div>extends end</div>
          <div class="legend-item"><div class="legend-dot" style="background:#052e16;border-color:#15803d"></div>partition close</div>
        </div>
      </div>
    </div>

  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Pointers</div>
      <div class="side-ptr-col">
        <div class="ptr-box ptr-i">
          <div class="ptr-label">i</div>
          <div class="ptr-val" id="vv-i">&mdash;</div>
        </div>
        <div class="ptr-box ptr-start">
          <div class="ptr-label">start</div>
          <div class="ptr-val" id="vv-start">&mdash;</div>
        </div>
        <div class="ptr-box ptr-end">
          <div class="ptr-label">end</div>
          <div class="ptr-val" id="vv-end">&mdash;</div>
        </div>
        <div class="ptr-box ptr-maxend">
          <div class="ptr-label">last[s[i]]</div>
          <div class="ptr-val" id="vv-maxend">&mdash;</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], strLen = 0;

var codeLines = [
  { n: 1,  t: '<span class="kw">def</span> <span class="nb">partition_labels</span>(s):' },
  { n: 2,  t: '  last = {c: i <span class="kw">for</span> i, c <span class="kw">in</span> <span class="nb">enumerate</span>(s)}' },
  { n: 3,  t: '  result = []' },
  { n: 4,  t: '  start = end = 0' },
  { n: 5,  t: '  <span class="kw">for</span> i, c <span class="kw">in</span> <span class="nb">enumerate</span>(s):' },
  { n: 6,  t: '    end = <span class="nb">max</span>(end, last[c])' },
  { n: 7,  t: '    <span class="kw">if</span> i == end:' },
  { n: 8,  t: '      result.append(end - start + 1)' },
  { n: 9,  t: '      start = i + 1' },
  { n: 10, t: '  <span class="kw">return</span> result' },
];

window.addEventListener('DOMContentLoaded', function() {
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + (line.n - 1);
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  buildAndRun();
});

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  document.getElementById('desc').textContent = snap.desc || '';
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-str').value = d.str;
  buildAndRun();
}

function randomExample() {
  var chars = 'abcdefghijklmnopqrstuvwxyz'.split('');
  var len = Math.floor(Math.random() * 15) + 6;
  var result = '';
  for (var i = 0; i < len; i++) {
    result += chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById('inp-str').value = result;
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var s = document.getElementById('inp-str').value.trim().replace(/\s/g, '');
  if (!s) return;
  strLen = s.length;
  buildStringSection(s);
  simSteps = simulate(s);
  window.nav.load(simSteps);
}

/* string display */
function buildStringSection(s) {
  var n = s.length;
  var html = '';

  // partition color bar (placeholder)
  html += '<div class="partition-bar-row" id="part-bar-row">';
  for (var i = 0; i < n; i++) {
    html += '<div class="partition-seg" id="pb-' + i + '" style="min-width:30px;flex-shrink:0"></div>';
  }
  html += '</div>';

  // character cells
  html += '<div class="char-row" id="char-row">';
  for (var i = 0; i < n; i++) {
    html += '<div class="char-cell" id="cc-' + i + '" data-state="idle">' + s[i] + '</div>';
  }
  html += '</div>';

  // index row
  html += '<div class="idx-row">';
  for (var i = 0; i < n; i++) {
    html += '<div class="idx-cell">' + i + '</div>';
  }
  html += '</div>';

  document.getElementById('string-section').innerHTML = html;
}

var PART_COLORS = [
  '#7c3aed','#0284c7','#d97706','#b91c1c','#166534','#0e7490','#c2410c','#7e22ce',
];

/* simulation */
function simulate(s) {
  var n = s.length;
  var steps = [];

  // Build last_occurrence
  var last = {};
  for (var k = 0; k < n; k++) {
    last[s[k]] = k;
  }

  var cellStates  = Array(n).fill('idle');
  var loRevealed  = {};   // chars revealed so far in last_occ
  var partitions  = [];   // [{start, end}] closed partitions

  function push(phase, desc, extra) {
    steps.push(Object.assign({
      phase:      phase,
      desc:       desc,
      cellStates: cellStates.slice(),
      loRevealed: Object.assign({}, loRevealed),
      activeChar: null,
      partitions: partitions.map(function(p) { return Object.assign({}, p); }),
      i:    null,
      start: null,
      end:   null,
      maxend: null,
      lines: [],
    }, extra || {}));
  }

  // Phase 1 — build last_occurrence
  push('Phase 1: Build last_occurrence', 'Scan s right-to-left to record the last index of every character.', { lines: [1] });

  for (var k = 0; k < n; k++) {
    var ch = s[k];
    cellStates[k] = 'building';
    loRevealed[ch] = last[ch];
    push('Phase 1: Build last_occurrence',
      'last[' + ch + '] = ' + last[ch] + ' (last time ' + ch + ' appears).',
      { activeChar: ch, i: k, lines: [1] });
    cellStates[k] = 'idle';
  }
  // Reset cells after phase 1
  cellStates = Array(n).fill('idle');
  push('Phase 1: Build last_occurrence',
    'last_occurrence map complete. Every character final index is recorded.',
    { i: null, lines: [1] });

  // Phase 2 — scan with greedy window
  var start = 0, end = 0;
  push('Phase 2: Greedy scan', 'start=0, end=0. Expand the window: end = max(end, last[s[i]]). When i==end, close the partition.',
    { start: 0, end: 0, lines: [2, 3] });

  for (var i = 0; i < n; i++) {
    var ch = s[i];
    var chLast = last[ch];
    var prevEnd = end;
    cellStates[i] = 'current';

    if (chLast > end) {
      end = chLast;
      // Mark window
      for (var j = start; j <= end; j++) {
        if (cellStates[j] === 'idle') cellStates[j] = 'window';
      }
      cellStates[i] = 'extend';
      push('Phase 2: Greedy scan',
        'i=' + i + ' (' + ch + '): last[' + ch + ']=' + chLast + ' > end=' + prevEnd + '. Extend end -> ' + end + '.',
        { i: i, start: start, end: end, maxend: chLast, activeChar: ch, lines: [4, 5] });
    } else {
      // In window, not extending
      for (var j = start; j <= end; j++) {
        if (cellStates[j] === 'idle') cellStates[j] = 'window';
      }
      cellStates[i] = 'current';
      push('Phase 2: Greedy scan',
        'i=' + i + ' (' + ch + '): last[' + ch + ']=' + chLast + ' <= end=' + end + '. No extension.',
        { i: i, start: start, end: end, maxend: chLast, activeChar: ch, lines: [4, 5] });
    }

    if (i === end) {
      // Close partition
      var size = end - start + 1;
      for (var j = start; j <= end; j++) {
        cellStates[j] = 'close';
      }
      partitions.push({ start: start, end: end });
      push('Phase 2: Greedy scan',
        'i=' + i + ' == end=' + end + '. Close partition [' + start + '..' + end + '] -> size ' + size + '. New start = ' + (end + 1) + '.',
        { i: i, start: start, end: end, maxend: chLast, activeChar: ch, lines: [6, 7, 8] });

      // Transition closed cells to done
      for (var j = start; j <= end; j++) {
        cellStates[j] = 'done';
      }
      start = end + 1;
      end   = start;
    }
  }

  var sizes = partitions.map(function(p) { return p.end - p.start + 1; });
  push('Done',
    'All partitions found: [' + sizes.join(', ') + ']. Each letter appears in exactly one part.',
    { i: null, start: null, end: null, partitions: partitions.map(function(p) { return Object.assign({}, p); }), lines: [9] });

  return steps;
}

/* render */
function applyStep(s, animate) {
  applyCharCells(s.cellStates, s.i, animate);
  applyLoGrid(s.loRevealed, s.activeChar);
  applyPointers(s, animate);
  applyPartitions(s.partitions);
  applyPartBar(s.partitions);
  applyCodeHighlight(s.lines);
}

function applyCodeHighlight(lines) {
  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  (lines || []).forEach(function(idx) {
    var el = document.getElementById('cl-' + idx);
    if (el) el.classList.add('hl');
  });
}

function applyCharCells(states, curI, animate) {
  states.forEach(function(state, i) {
    var el = document.getElementById('cc-' + i);
    if (!el) return;
    var prev = el.dataset.state;
    el.dataset.state = state;
    if (animate && i === curI && prev !== state) {
      gsap.fromTo(el, { scale: 0.8 }, { scale: 1, duration: 0.2, ease: 'back.out(2)' });
    }
    if (animate && state === 'close' && prev !== 'close') {
      gsap.fromTo(el, { scale: 1.15 }, { scale: 1, duration: 0.3, ease: 'back.out(1.7)' });
    }
  });
}

function applyLoGrid(revealed, activeChar) {
  var grid = document.getElementById('lo-grid');
  if (!grid) return;
  var chars = Object.keys(revealed).sort();
  if (!chars.length) {
    grid.innerHTML = '<span style="color:var(--text-ghost);font-size:0.78rem">—</span>';
    return;
  }
  grid.innerHTML = chars.map(function(ch) {
    var isActive = ch === activeChar;
    return '<div class="lo-cell" data-active="' + isActive + '" data-seen="true">' +
      '<div class="lo-char">' + ch + '</div>' +
      '<div class="lo-idx' + (isActive ? ' active' : '') + '">' + revealed[ch] + '</div>' +
      '</div>';
  }).join('');
}

function applyPointers(s, animate) {
  function set(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null || val === undefined ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.75, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  set('vv-i',      s.i);
  set('vv-start',  s.start);
  set('vv-end',    s.end);
  set('vv-maxend', s.maxend);
}

function applyPartitions(parts) {
  var list = document.getElementById('parts-list');
  if (!list) return;
  if (!parts.length) {
    list.innerHTML = '<span style="color:var(--text-ghost);font-size:0.78rem">—</span>';
    return;
  }
  list.innerHTML = parts.map(function(p, idx) {
    var size = p.end - p.start + 1;
    return '<div class="part-chip" style="background:' + partBg(idx) + ';border-color:' + PART_COLORS[idx % PART_COLORS.length] + '">' +
      '[' + p.start + '..' + p.end + '] len=' + size +
      '</div>';
  }).join('');
}

function partBg(idx) {
  var c = PART_COLORS[idx % PART_COLORS.length];
  return c + '22';
}

function applyPartBar(parts) {
  if (!parts.length) return;
  parts.forEach(function(p, idx) {
    var color = PART_COLORS[idx % PART_COLORS.length];
    for (var j = p.start; j <= p.end; j++) {
      var el = document.getElementById('pb-' + j);
      if (el) el.style.background = color;
    }
  });
}

/* resize handle */
(function() {
  var h = document.getElementById('resize-handle'), p = document.getElementById('code-panel'), d = false, sx = 0, sw = 0;
  h.addEventListener('mousedown', function(e) { d = true; sx = e.clientX; sw = p.offsetWidth; h.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!d) return; p.style.width = Math.min(560, Math.max(120, sw + (sx - e.clientX))) + 'px'; });
  document.addEventListener('mouseup', function() { if (!d) return; d = false; h.classList.remove('dragging'); });
})();
</script>
</body>
</html>
