<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Single Number (XOR)</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: #0d1117; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); }
  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); } .var-val { color: var(--accent); font-weight: 700; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  /* PAGE-SPECIFIC */
  .array-section { padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 8px; min-height: 80px; width: 100%; }
  .arr-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .arr-cell { width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border-soft); border-radius: 5px; background: #0f0f0f; font-size: 0.92rem; font-weight: 700; font-family: monospace; color: var(--text-ghost); position: relative; transition: border-color 0.15s; }
  .arr-cell[data-state="processed"] { color: var(--text-dim); border-color: #2d3148; opacity: 0.55; }
  .arr-cell[data-state="processed"]::after { content: "✓"; position: absolute; top: 2px; right: 3px; font-size: 0.55rem; color: var(--green); }
  .arr-cell[data-state="current"] { color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); box-shadow: 0 0 8px rgba(99,102,241,0.25); }
  .arr-indices { display: flex; gap: 6px; }
  .arr-idx { width: 52px; flex-shrink: 0; text-align: center; font-size: 0.6rem; color: var(--text-ghost); font-family: monospace; }
  .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .xor-display { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .xor-label { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); }
  .xor-val { font-size: 2.4rem; font-weight: 700; color: var(--text-bright); font-family: monospace; line-height: 1; }
  .xor-val.done-accent { color: var(--green); }
  .xor-bin { font-size: 0.72rem; font-family: monospace; letter-spacing: 0.18em; color: var(--text-ghost); }
  .bit-flip { color: var(--accent-pale); }
  .eq-display { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.85rem; font-family: monospace; color: var(--text-muted); min-height: 36px; display: flex; align-items: center; }
  .eq-display .eq-hi { color: var(--accent-pale); font-weight: 700; }
  .eq-display .eq-op { color: var(--purple); }
  .eq-display .eq-res { color: var(--green); font-weight: 700; }
  .hint-bar { width: 100%; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); font-size: 0.78rem; color: var(--text-dim); text-align: center; }
  .hint-bar strong { color: var(--accent-pale); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"nums":"4,1,2,1,2"}'>Two pairs + single</option>
      <option value='{"nums":"1"}'>Single element</option>
      <option value='{"nums":"2,2,3,3,5"}'>Multiple pairs + single</option>
      <option value='{"nums":"0,1,0,1,99"}'>Zeros and unique</option>
      <option value='{"nums":"7,7,7,7,7,7,8"}'>Many duplicates</option>
      <option value='{"nums":"10,1,10,2,1"}'>Unsorted pairs</option>
    </select>
  </div>
  <div>
    <label>nums</label>
    <input id="inp-nums" type="text" value="4,1,2,1,2" style="width:180px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Single Number (XOR)</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Enter nums and click Run.</div>
    <div class="array-section" id="array-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter nums and click Run.</span>
    </div>
    <div class="panel-box">
      <div class="panel-title">XOR Accumulator</div>
      <div class="xor-display">
        <div class="xor-label">result</div>
        <div class="xor-val" id="xor-val">—</div>
        <div class="xor-bin" id="xor-bin">&nbsp;</div>
      </div>
      <div class="eq-display" id="eq-display">—</div>
    </div>
    <div class="hint-bar">
      <strong>XOR cancels duplicates</strong> — pairs zero out, the loner survives.
      &nbsp;&nbsp;a &oplus; a = 0 &nbsp;&nbsp;&middot;&nbsp;&nbsp; a &oplus; 0 = a &nbsp;&nbsp;&middot;&nbsp;&nbsp; XOR is commutative &amp; associative.
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div id="vars-items"><span style="color:var(--text-dim);">—</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step" onclick="buildAndRun()">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var numLen = 0;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">singleNumber</span><span class="op">(</span>nums<span class="op">):</span>'],
  [2,  '    result <span class="op">=</span> <span class="nb">0</span>'],
  [0,  ''],
  [4,  '    <span class="kw">for</span> x <span class="kw">in</span> nums<span class="op">:</span>'],
  [5,  '        result <span class="op">=</span> result <span class="op">^</span> x'],
  [0,  ''],
  [7,  '    <span class="kw">return</span> result'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      document.getElementById('phase-badge').textContent = snap.phase || 'Step';
      document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
      if (snap.desc) document.getElementById('desc').textContent = snap.desc;
    }
  });
  buildAndRun();
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="cl"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-nums').value = d.nums;
  buildAndRun();
}

function randomExample() {
  var count = Math.floor(Math.random() * 8) + 2;
  var nums = [];
  for (var i = 0; i < count; i++) {
    nums.push(Math.floor(Math.random() * 100) - 50);
  }
  var uniqueIdx = Math.floor(Math.random() * nums.length);
  nums[uniqueIdx] = Math.floor(Math.random() * 100) - 50;
  for (var j = 0; j < nums.length; j++) {
    if (j !== uniqueIdx) {
      var pair = Math.floor(Math.random() * 100) - 50;
      if (j + 1 < nums.length) {
        nums[j] = pair;
        nums[j + 1] = pair;
        j++;
      }
    }
  }
  document.getElementById('inp-nums').value = nums.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var raw  = document.getElementById('inp-nums').value;
  var nums = raw.split(',')
    .map(function(x) { return parseInt(x.trim(), 10); })
    .filter(function(x) { return !isNaN(x); })
    .slice(0, 32);
  if (nums.length < 1) return;
  numLen = nums.length;
  buildArraySection(nums);
  simSteps = simulate(nums);
  nav.load(simSteps);
}

function buildArraySection(nums) {
  var sec = document.getElementById('array-section');
  sec.innerHTML =
    '<div class="arr-row" id="arr-row"></div>' +
    '<div class="arr-indices" id="arr-indices"></div>';

  var arrRow = document.getElementById('arr-row');
  var idxRow = document.getElementById('arr-indices');

  nums.forEach(function(v, i) {
    var cell = document.createElement('div');
    cell.className = 'arr-cell'; cell.id = 'ac-' + i; cell.dataset.state = 'idle';
    cell.textContent = v; arrRow.appendChild(cell);

    var idx = document.createElement('div');
    idx.className = 'arr-idx'; idx.textContent = i; idxRow.appendChild(idx);
  });
}

function simulate(nums) {
  var steps = [];
  var result = 0;

  function snap(phase, i, prevResult, curResult, desc, lines) {
    steps.push({
      phase:       phase,
      i:           i,
      result:      curResult,
      prevResult:  prevResult,
      nums:        nums.slice(),
      desc:        desc,
      lines:       lines,
    });
  }

  snap('init', -1, 0, 0, 'Initialize result = 0.', [2]);

  for (var i = 0; i < nums.length; i++) {
    var prev = result;
    result   = result ^ nums[i];
    snap('xor', i, prev, result,
      'result = ' + prev + ' ⊕ ' + nums[i] + ' = ' + result + '.',
      [4, 5]);
  }

  snap('done', -1, result, result, 'Unique number = ' + result + '.', [7]);
  return steps;
}

function applyStep(s, animate) {
  applyArrayCells(s.i, s.phase);
  applyXorDisplay(s, animate);
  setEquation(s);
  setCodeLines(s.lines);
  // sidebar
  var items = document.getElementById('vars-items');
  if (items) {
    items.innerHTML =
      '<div class="var-item"><span class="var-key">i      </span><span class="var-val">' + (s.i >= 0 ? s.i : '—') + '</span></div>' +
      '<div class="var-item"><span class="var-key">result </span><span class="var-val">' + s.result + '</span></div>';
  }
}

function applyArrayCells(curI, phase) {
  for (var i = 0; i < numLen; i++) {
    var el = document.getElementById('ac-' + i);
    if (!el) continue;
    if (phase === 'init' || phase === 'done') {
      el.dataset.state = phase === 'done' ? 'processed' : 'idle';
    } else if (i < curI) {
      el.dataset.state = 'processed';
    } else if (i === curI) {
      el.dataset.state = 'current';
    } else {
      el.dataset.state = 'idle';
    }
  }
}

function toBin8(n) {
  var bits = (n >>> 0).toString(2);
  while (bits.length < 8) bits = '0' + bits;
  return bits;
}

function applyXorDisplay(s, animate) {
  var valEl = document.getElementById('xor-val');
  var binEl = document.getElementById('xor-bin');
  if (!valEl || !binEl) return;

  var isDone = s.phase === 'done';
  var changed = animate && (s.result !== s.prevResult);

  if (changed) {
    gsap.fromTo(valEl, { scale: 1.3, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(1.7)' });
  }

  valEl.textContent = s.phase === 'init' ? '0' : String(s.result);
  valEl.className   = 'xor-val' + (isDone ? ' done-accent' : '');

  if (s.phase === 'init') {
    binEl.innerHTML = '00000000';
    return;
  }
  var prevBin = toBin8(s.prevResult);
  var curBin  = toBin8(s.result);
  var html = '';
  for (var b = 0; b < 8; b++) {
    if (curBin[b] !== prevBin[b] && s.phase === 'xor') {
      html += '<span class="bit-flip">' + curBin[b] + '</span>';
    } else {
      html += curBin[b];
    }
  }
  binEl.innerHTML = html;
}

function setEquation(s) {
  var el = document.getElementById('eq-display');
  if (!el) return;

  if (s.phase === 'init') {
    el.innerHTML = '<span style="color:var(--text-ghost)">result initialized to 0</span>';
    return;
  }
  if (s.phase === 'done') {
    el.innerHTML = '<span class="eq-res">&#8594; unique = ' + s.result + '</span>';
    return;
  }
  var prev = s.prevResult;
  var cur  = s.nums[s.i];
  var res  = s.result;
  el.innerHTML =
    '<span class="eq-hi">' + prev + '</span>' +
    ' <span class="eq-op"> &oplus; </span>' +
    '<span class="eq-hi">' + cur + '</span>' +
    ' <span class="eq-op"> = </span>' +
    '<span class="eq-res">' + res + '</span>';
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) { dragging = false; handle.classList.remove('dragging'); }
  });
})();
</script>
</body>
</html>
