<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plus One</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    /* === Canonical layout === */
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; gap: 20px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
    .btn-play { background: #15803d; border: none; color: #fff; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .code-panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    /* === Viz-specific === */
    .array-section {
      padding: 20px 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 10px;
      min-height: 160px; width: 100%; max-width: 600px; align-items: center; justify-content: center;
    }
    .arr-row { display: flex; gap: 8px; flex-wrap: nowrap; }
    .arr-cell {
      width: 56px; height: 64px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border-soft); border-radius: 6px;
      background: #0f0f0f; font-size: 1.6rem; font-weight: 700; font-family: monospace;
      color: var(--text-ghost); position: relative;
    }
    .arr-cell[data-state="done"]      { color: var(--text-bright); border-color: #2d3148; }
    .arr-cell[data-state="current"]   { color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); box-shadow: 0 0 0 3px rgba(var(--accent-ch), 0.12); }
    .arr-cell[data-state="written"]   { color: #86efac; border-color: #15803d; background: #052e16; }
    .arr-cell[data-state="prepended"] { color: #fde68a; border-color: #b45309; background: #1c1207; }
    .carry-tag {
      position: absolute; top: -18px; right: -10px;
      font-size: 0.72rem; font-family: monospace; font-weight: 700;
      padding: 2px 6px; border-radius: 4px; background: #b45309; color: #fff;
    }
    .arr-indices { display: flex; gap: 8px; }
    .arr-idx { width: 56px; flex-shrink: 0; text-align: center; font-size: 0.65rem; color: var(--text-ghost); font-family: monospace; }
    .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .panel-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .var-box { padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .var-box.carry-accent { border-color: #b45309; }
    .var-label { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); }
    .var-val   { font-size: 1.1rem; font-weight: 700; color: var(--text-bright); }
    .code-body { padding: 0; font-size: 0.78rem; line-height: 1.75; flex: 1; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 4px; }
    .code-line.hl { background: rgba(var(--accent-ch),0.1); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }
    .kw { color: var(--purple); } .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); } .nb { color: var(--green); }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .viz-inputs .field { display: flex; flex-direction: column; gap: 4px; }
    .viz-inputs input[type="text"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; width: 180px; }
    .viz-inputs select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
    .viz-inputs button { padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .viz-inputs button:hover { opacity: 0.9; }
    .viz-inputs .random-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div class="field">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"digits":"1,2,3"}'>[1,2,3] — normal</option>
      <option value='{"digits":"1,2,9"}'>[1,2,9] — has 9</option>
      <option value='{"digits":"9,9,9"}'>[9,9,9] — all 9s</option>
      <option value='{"digits":"0"}'>[0] — single 0</option>
      <option value='{"digits":"9"}'>[9] — single 9</option>
      <option value='{"digits":"1,9,9"}'>[1,9,9] — carry propagation</option>
    </select>
  </div>
  <div class="field">
    <label>digits</label>
    <input id="inp-digits" type="text" value="1, 2, 9" />
  </div>
  <button onclick="buildAndRun()">Run</button>
  <button class="random-btn" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-label">&mdash;</span>
  <span style="font-size:13px;font-weight:700;">Plus One</span>
</div>
<div id="main">
  <div id="viz-area">
    <div class="array-section" id="array-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter digits and click Run.</span>
    </div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Status</div>
      <div style="font-size:0.82rem;color:var(--text-muted);line-height:1.45" id="step-desc">Enter digits and click Run.</div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Variables</div>
      <div class="var-box">
        <div class="var-label">i</div>
        <div class="var-val" id="vv-i">&mdash;</div>
      </div>
      <div class="var-box carry-accent">
        <div class="var-label">carry</div>
        <div class="var-val" id="vv-carry">&mdash;</div>
      </div>
      <div class="var-box">
        <div class="var-label">sum</div>
        <div class="var-val" id="vv-sum">&mdash;</div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Why a carry?</div>
      <div style="font-size:0.78rem;color:var(--text-muted);line-height:1.55">
        Adding 1 to a digit can overflow past 9. Replace with <code>sum % 10</code>, push overflow (<code>sum / 10</code>) left. If leftmost overflows, prepend <strong>1</strong>.
      </div>
    </div>
  </div>
</div>
<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>
<script>
var simSteps = [], nav;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">plus_one</span><span class="op">(</span>digits<span class="op">):</span>'],
  [2,  '    carry <span class="op">=</span> <span class="nb">1</span>'],
  [3,  '    i     <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>digits<span class="op">)</span> <span class="op">-</span> <span class="nb">1</span>'],
  [0,  ''],
  [5,  '    <span class="kw">while</span> i <span class="op">&gt;=</span> <span class="nb">0</span> <span class="kw">and</span> carry<span class="op">:</span>'],
  [6,  '        s          <span class="op">=</span> digits<span class="op">[</span>i<span class="op">]</span> <span class="op">+</span> carry'],
  [7,  '        digits<span class="op">[</span>i<span class="op">]</span>  <span class="op">=</span> s <span class="op">%</span> <span class="nb">10</span>'],
  [8,  '        carry      <span class="op">=</span> s <span class="op">//</span> <span class="nb">10</span>'],
  [9,  '        i         <span class="op">-=</span> <span class="nb">1</span>'],
  [0,  ''],
  [11, '    <span class="kw">if</span> carry<span class="op">:</span>'],
  [12, '        digits <span class="op">=</span> <span class="op">[</span><span class="nb">1</span><span class="op">]</span> <span class="op">+</span> digits'],
  [0,  ''],
  [14, '    <span class="kw">return</span> digits'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      var phaseEl = document.getElementById('phase-label');
      var descEl  = document.getElementById('step-desc');
      if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
      if (descEl)  descEl.textContent  = snap.desc;
    }
  });
});

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="code-line"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-digits').value = d.digits;
  buildAndRun();
}

function randomExample() {
  var minLen = 1, maxLen = 6;
  var len = Math.floor(Math.random() * (maxLen - minLen + 1)) + minLen;
  var digits = [];
  for (var i = 0; i < len; i++) {
    digits.push(Math.floor(Math.random() * 10));
  }
  document.getElementById('inp-digits').value = digits.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildAndRun() {
  var raw = document.getElementById('inp-digits').value;
  var digits = raw.split(/[,\s]+/).map(function(x) { return parseInt(x.trim()); }).filter(function(x) { return !isNaN(x) && x >= 0 && x <= 9; });
  if (digits.length < 1) return;
  simSteps = simulate(digits);
  buildArraySection(simSteps);
  nav.load(simSteps);
}

function buildArraySection(steps) {
  var sec = document.getElementById('array-section');
  // Use the final snapshot's array length to size the row (handles prepend).
  var maxLen = 0;
  steps.forEach(function(s) { if (s.arr.length > maxLen) maxLen = s.arr.length; });

  sec.innerHTML =
    '<div class="arr-row" id="arr-row"></div>' +
    '<div class="arr-indices" id="arr-indices"></div>';

  var arrRow = document.getElementById('arr-row');
  var idxRow = document.getElementById('arr-indices');

  for (var k = 0; k < maxLen; k++) {
    var cell = document.createElement('div');
    cell.className = 'arr-cell'; cell.id = 'ac-' + k; cell.dataset.state = 'idle';
    cell.textContent = '';
    arrRow.appendChild(cell);

    var idx = document.createElement('div');
    idx.className = 'arr-idx'; idx.id = 'ai-' + k; idx.textContent = k;
    idxRow.appendChild(idx);
  }
}

// --- Simulate ---
function simulate(digits) {
  var arr = digits.slice();
  var n = arr.length;
  var steps = [];
  var i = n - 1;
  var carry = 1;
  var cellStates = arr.map(function() { return 'idle'; });

  function snap(phase, desc, lines, sum) {
    steps.push({
      phase: phase, desc: desc, lines: lines || [],
      arr: arr.slice(),
      cellStates: cellStates.slice(),
      i: i, carry: carry, sum: sum === undefined ? null : sum,
      prepended: false,
    });
  }

  // Init
  snap('Init', 'carry = 1 (we are adding +1). Start from the rightmost digit, i = ' + i + '.', [2, 3], null);

  while (i >= 0 && carry) {
    cellStates[i] = 'current';
    snap('Read', 'i = ' + i + ', carry = ' + carry + '. Compute s = digits[' + i + '] + carry = ' + arr[i] + ' + ' + carry + ' = ' + (arr[i] + carry) + '.', [5, 6], arr[i] + carry);

    var s = arr[i] + carry;
    arr[i] = s % 10;
    carry = Math.floor(s / 10);
    cellStates[i] = 'written';
    snap('Write', 'digits[' + i + '] = ' + s + ' % 10 = ' + arr[i] + '. carry = ' + s + ' // 10 = ' + carry + '.', [7, 8], s);

    i -= 1;
    if (i >= 0 && carry) {
      snap('Move', 'carry still ' + carry + '. Move left to i = ' + i + '.', [9], null);
    } else if (carry === 0) {
      snap('Stop', 'carry is 0. Loop ends — no more propagation needed.', [5], null);
    } else {
      snap('Stop', 'i = -1. Fell off the left edge with carry = 1.', [5], null);
    }
  }

  if (carry) {
    // Prepend a new 1 cell.
    arr = [1].concat(arr);
    cellStates = ['prepended'].concat(cellStates.map(function() { return 'done'; }));
    steps.push({
      phase: 'Prepend',
      desc: 'carry survived past the front. Prepend a new digit 1: result becomes [' + arr.join(', ') + '].',
      lines: [11, 12],
      arr: arr.slice(),
      cellStates: cellStates.slice(),
      i: -1, carry: carry, sum: null,
      prepended: true,
    });
    carry = 0;
  }

  // Done
  cellStates = cellStates.map(function() { return 'done'; });
  steps.push({
    phase: 'Done',
    desc: 'return digits = [' + arr.join(', ') + '].',
    lines: [14],
    arr: arr.slice(),
    cellStates: cellStates.slice(),
    i: -1, carry: 0, sum: null,
    prepended: false,
  });

  return steps;
}

// --- Render ---
function applyStep(s, animate) {
  applyArrayCells(s, animate);
  applyVars(s, animate);
  setCodeLines(s.lines);
}

function applyArrayCells(s, animate) {
  for (var k = 0; k < s.arr.length; k++) {
    var el = document.getElementById('ac-' + k);
    if (!el) continue;
    var prevText = el.textContent;
    var newText = String(s.arr[k]);
    var state = s.cellStates[k] || 'idle';
    el.dataset.state = state;

    // Carry badge: show on currently active cell when phase Read.
    var existing = el.querySelector('.carry-tag');
    if (existing) existing.remove();
    if (s.phase === 'Read' && k === s.i && s.carry) {
      var tag = document.createElement('div');
      tag.className = 'carry-tag';
      tag.textContent = '+' + s.carry;
      el.appendChild(tag);
      if (animate) gsap.fromTo(tag, { y: -8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: 'back.out(2)' });
    }

    if (prevText !== newText) {
      el.textContent = newText;
      if (animate) gsap.fromTo(el, { scale: 0.5, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.32, ease: 'back.out(2)' });
    } else {
      el.textContent = newText;
    }
  }
  // Hide any remaining cells beyond array length (shouldn't happen since we sized max).
  var rowChildren = document.querySelectorAll('#arr-row .arr-cell');
  for (var k2 = s.arr.length; k2 < rowChildren.length; k2++) {
    rowChildren[k2].textContent = '';
    rowChildren[k2].dataset.state = 'idle';
  }
}

function applyVars(s, animate) {
  function setVal(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null || val === undefined ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
  }
  setVal('vv-i', s.i < 0 ? '—' : s.i);
  setVal('vv-carry', s.carry);
  setVal('vv-sum', s.sum);
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
