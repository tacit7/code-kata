<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Binary Search</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 14px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 320px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
  .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); font-family: 'Fira Code','Cascadia Code',monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); color: var(--text); }
  .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
  .kw { color: var(--purple); } .nb { color: var(--green); } .fn { color: var(--blue); } .op { color: var(--text); }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 5px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); font-size: 0.65rem; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .var-val { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
  .btn-step:hover { background: #334155; }
  .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; font-weight: 600; }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* PAGE-SPECIFIC */
  #array-container { display: flex; gap: 4px; align-items: flex-end; min-height: 100px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); flex-wrap: wrap; width: 100%; max-width: 560px; }
  .array-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: monospace; font-weight: 600; font-size: 0.85rem; transition: all 0.3s ease; }
  .cell-bar { width: 48px; background: var(--accent); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; border: 2px solid transparent; font-weight: 700; height: 48px; }
  .cell-idx { font-size: 0.65rem; color: var(--text-dim); }
  .cell-bar.active { background: var(--yellow); color: #000; border-color: var(--yellow-light); box-shadow: 0 0 8px rgba(224,175,104,0.4); }
  .cell-bar.found { background: var(--green); color: #fff; border-color: var(--green-light); box-shadow: 0 0 12px rgba(158,206,106,0.5); }
  .cell-bar.eliminated { background: #3d3d3d; border-color: #555; color: var(--text-dim); }
  .cell-bar.boundary { border: 2px solid var(--blue); }
  .boundary-label { font-size: 0.6rem; color: var(--text-faint); white-space: nowrap; margin-top: 2px; }
  .status-result { font-size: 0.9rem; font-weight: 700; color: var(--green); margin-top: 4px; }
  .status-result.not-found { color: var(--red); }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"nums":"1,3,5,6","target":"5"}'>Basic (target found)</option>
      <option value='{"nums":"2,5,8,12","target":"2"}'>Target at start</option>
      <option value='{"nums":"1,4,7,11","target":"11"}'>Target at end</option>
      <option value='{"nums":"1,3,5,7","target":"6"}'>Not found</option>
      <option value='{"nums":"5","target":"5"}'>Single element</option>
      <option value='{"nums":"1,3,6,13,16,19,23,28,32,35","target":"13"}'>Large array</option>
    </select>
  </div>
  <div>
    <label>Array (comma-separated)</label>
    <input type="text" id="numsInput" value="-1,0,3,5,9,12" style="width:180px" />
  </div>
  <div>
    <label>Target</label>
    <input type="number" id="targetInput" value="9" style="width:80px" />
  </div>
  <button class="vi-btn-run" id="buildBtn">Run</button>
  <button class="vi-btn-rand" id="randomBtn">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Binary Search</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div id="array-container"></div>
    <div class="status-result" id="result-msg" style="display:none"></div>
  </div>
  <div id="resize-handle"></div>
  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>
  <div id="sidebar">
    <div class="sidebar-title">Variables</div>
    <div class="var-item"><span class="var-key">Left (l)</span><span class="var-val" id="varL">&mdash;</span></div>
    <div class="var-item"><span class="var-key">Right (r)</span><span class="var-val" id="varR">&mdash;</span></div>
    <div class="var-item"><span class="var-key">Mid (m)</span><span class="var-val" id="varMid">&mdash;</span></div>
    <div class="var-item"><span class="var-key">nums[mid]</span><span class="var-val" id="varNumMid">&mdash;</span></div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
  var nav;

  const pythonCode = [
    'def search(nums, target):',
    '    l, r = 0, len(nums) - 1',
    '    while l <= r:',
    '        mid = (l + r) // 2',
    '        if nums[mid] == target:',
    '            return mid',
    '        elif nums[mid] < target:',
    '            l = mid + 1',
    '        else:',
    '            r = mid - 1',
    '    return -1'
  ];

  function buildCodePanel() {
    const codeBody = document.getElementById('code-body');
    codeBody.innerHTML = pythonCode.map((line, idx) => {
      return `<div class="cl" id="cl-${idx}"><span class="ln">${idx + 1}</span><span class="code">${escapeHtml(line)}</span></div>`;
    }).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function setCodeLines(activeLines) {
    for (let i = 0; i < pythonCode.length; i++) {
      const el = document.getElementById(`cl-${i}`);
      if (activeLines.includes(i)) el.classList.add('hl');
      else el.classList.remove('hl');
    }
  }

  function simulate(nums, target) {
    const steps = [];
    steps.push({
      phase: 'Initialize',
      desc: `l = 0, r = ${nums.length - 1}, target = ${target}`,
      l: 0, r: nums.length - 1, mid: null, comparison: null,
      lines: [0, 1], found: false, result: null
    });

    let l = 0, r = nums.length - 1, iterations = 0;
    const maxIters = 50;

    while (l <= r && iterations < maxIters) {
      iterations++;
      const mid = Math.floor((l + r) / 2);
      const numsMid = nums[mid];

      steps.push({
        phase: 'Compute Mid',
        desc: `mid = (${l} + ${r}) // 2 = ${mid}. Check nums[${mid}] = ${numsMid}`,
        l, r, mid, comparison: null, lines: [2, 3], found: false, result: null
      });

      if (numsMid === target) {
        steps.push({
          phase: 'Found!',
          desc: `nums[${mid}] == ${target}. Return ${mid}`,
          l, r, mid, comparison: '=', lines: [4, 5], found: true, result: mid
        });
        break;
      } else if (numsMid < target) {
        steps.push({
          phase: 'Go Right',
          desc: `nums[${mid}] (${numsMid}) < ${target}. Move l to ${mid + 1}`,
          l, r, mid, comparison: '<', lines: [6, 7], found: false, result: null
        });
        l = mid + 1;
      } else {
        steps.push({
          phase: 'Go Left',
          desc: `nums[${mid}] (${numsMid}) > ${target}. Move r to ${mid - 1}`,
          l, r, mid, comparison: '>', lines: [8, 9], found: false, result: null
        });
        r = mid - 1;
      }
    }

    if (!steps[steps.length - 1].found) {
      steps.push({
        phase: 'Not Found',
        desc: `l > r. Target ${target} not in array. Return -1`,
        l, r, mid: null, comparison: null, lines: [2, 10], found: false, result: -1
      });
    }
    return steps;
  }

  function applyStep(snap, animate) {
    const { nums, target, l, r, mid, found, result, phase, desc } = snap;
    setCodeLines(snap.lines);

    document.getElementById('varL').textContent = l !== null ? l : '\u2014';
    document.getElementById('varR').textContent = r !== null ? r : '\u2014';
    document.getElementById('varMid').textContent = mid !== null ? mid : '\u2014';
    document.getElementById('varNumMid').textContent = mid !== null ? nums[mid] : '\u2014';

    const container = document.getElementById('array-container');
    container.innerHTML = '';
    for (let i = 0; i < nums.length; i++) {
      const cellDiv = document.createElement('div');
      cellDiv.className = 'array-cell';
      const bar = document.createElement('div');
      bar.className = 'cell-bar';
      if (found && mid === i) bar.classList.add('found');
      else if (mid === i) bar.classList.add('active');
      else if (i < l || i > r) bar.classList.add('eliminated');
      else if (i === l || i === r) bar.classList.add('boundary');
      bar.textContent = nums[i];
      cellDiv.appendChild(bar);
      const idx = document.createElement('div');
      idx.className = 'cell-idx';
      idx.textContent = `[${i}]`;
      cellDiv.appendChild(idx);
      if (i === l) { const lbl = document.createElement('div'); lbl.className = 'boundary-label'; lbl.textContent = 'l'; cellDiv.appendChild(lbl); }
      if (i === r) { const lbl = document.createElement('div'); lbl.className = 'boundary-label'; lbl.textContent = 'r'; cellDiv.appendChild(lbl); }
      container.appendChild(cellDiv);
    }

    const resultEl = document.getElementById('result-msg');
    if (result !== null) {
      resultEl.style.display = '';
      if (result >= 0) { resultEl.className = 'status-result'; resultEl.textContent = `\u2713 Found at index ${result}`; }
      else { resultEl.className = 'status-result not-found'; resultEl.textContent = `\u2717 Not found (return -1)`; }
    } else {
      resultEl.style.display = 'none';
    }
  }

  function buildAndRun() {
    const numsStr = document.getElementById('numsInput').value;
    const targetStr = document.getElementById('targetInput').value;
    const nums = numsStr.split(',').map(x => { const n = parseInt(x.trim()); return isNaN(n) ? 0 : n; });
    const target = parseInt(targetStr);
    if (isNaN(target) || nums.length === 0) { alert('Invalid input.'); return; }
    const steps = simulate(nums, target);
    steps.forEach(step => { step.nums = nums; step.target = target; });
    nav.load(steps);
  }

  function loadPreset() {
    var sel = document.getElementById('presetSel');
    if (!sel.value) return;
    var d = JSON.parse(sel.value);
    document.getElementById('numsInput').value = d.nums;
    document.getElementById('targetInput').value = d.target;
    buildAndRun();
  }

  function randomExample() {
    const len = Math.floor(Math.random() * 6) + 3;
    const nums = [];
    let val = Math.floor(Math.random() * 20) - 10;
    for (let i = 0; i < len; i++) { val += Math.floor(Math.random() * 5) + 1; nums.push(val); }
    let target;
    if (Math.random() < 0.5 && nums.length > 0) target = nums[Math.floor(Math.random() * nums.length)];
    else target = Math.floor(Math.random() * 100) - 50;
    document.getElementById('numsInput').value = nums.join(',');
    document.getElementById('targetInput').value = target;
    document.getElementById('presetSel').value = '';
    buildAndRun();
  }

  window.addEventListener('DOMContentLoaded', function() {
    buildCodePanel();
    nav = VizNav({
      btnPrev: document.getElementById('prevBtn'),
      btnNext: document.getElementById('stepBtn'),
      btnPlay: document.getElementById('playBtn'),
      speedSel: document.getElementById('speedSel'),
      render: function(snap, cur, total) {
        applyStep(snap, cur > 0);
        document.getElementById('phase-badge').textContent = snap.phase || 'Step';
        document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
        if (snap.desc) document.getElementById('desc').textContent = snap.desc;
      }
    });
    document.getElementById('buildBtn').addEventListener('click', buildAndRun);
    document.getElementById('randomBtn').addEventListener('click', randomExample);
    buildAndRun();
  });
</script>
<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) { dragging = false; handle.classList.remove('dragging'); }
  });
})();
</script>
</body>
</html>
