<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Max Depth of Binary Tree</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; gap: 12px; overflow-y: auto; }
  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 560px; min-height: 36px; line-height: 1.5; }
  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
  #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 12px; display: flex; flex-direction: column; }
  .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 14px 0 0; white-space: pre; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
  .cl .ln { width: 28px; min-width: 28px; text-align: right; color: #3d4468; user-select: none; padding-right: 14px; font-size: 0.72rem; line-height: 1.7; }
  .cl .code { color: var(--text-muted); }
  .kw { color: var(--purple); } .nb { color: var(--green); } .cm { color: var(--text-dim); font-style: italic; }
  #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  /* UNIQUE VIZ CSS */
  .tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; width: 100%; }
  #tree-svg { display: block; width: 100%; }
  .fn { color: var(--blue); } .bi { color: var(--orange); } .op { color: var(--text); }
  .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
  .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); margin-bottom: 8px; }
  .depth-row { display: flex; gap: 8px; }
  .depth-slot { flex: 1; background: var(--surface-dark); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; }
  .depth-slot .ds-label { color: var(--text-dim); font-size: 0.65rem; margin-bottom: 3px; }
  .depth-slot .ds-val { color: var(--text-bright); font-size: 1rem; font-weight: 700; }
  .depth-slot.active-slot { border-color: var(--accent); }
  .depth-slot .ds-val.unknown { color: var(--text-faint); }
  #call-stack { display: flex; flex-direction: column-reverse; gap: 5px; min-height: 40px; }
  .cs-frame { background: #1e1a3a; color: var(--accent-pale); border: 1px solid var(--accent); border-radius: 6px; padding: 5px 11px; font-size: 0.84rem; font-weight: 600; font-family: monospace; }
  .cs-frame.top { background: #4338ca; color: #fff; }
  .cs-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; font-size: 0.78rem; color: var(--text-muted); }
  .leg-item { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<div class="viz-inputs">
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"tree":"1"}'>Single Node</option>
      <option value='{"tree":"1,2,3"}'>Two-level tree</option>
      <option value='{"tree":"3,9,20,null,null,15,7"}'>Balanced tree</option>
      <option value='{"tree":"1,2,3,4"}'>Left skewed</option>
      <option value='{"tree":"1,null,2,null,3,null,4"}'>Right skewed</option>
      <option value='{"tree":"5,4,8,11,null,13,4,7,2,null,1"}'>Complex</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <label>Level-order (use null for empty)</label>
    <input id="inp-tree" type="text" value="3,9,20,null,null,15,7" style="width:240px" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Max Depth of Binary Tree</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <div class="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="legend">
      <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#1e2130" stroke="#2d3148" stroke-width="2"/></svg> Unvisited</div>
      <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#4338ca" stroke="var(--accent)" stroke-width="2"/></svg> Active</div>
      <div class="leg-item"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#052e16" stroke="#16a34a" stroke-width="2"/></svg> Computed</div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:8px;">Python</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="panel-box">
      <div class="panel-title">Active Frame — Depths</div>
      <div class="depth-row">
        <div class="depth-slot" id="slot-left">
          <div class="ds-label">left_depth</div>
          <div class="ds-val unknown" id="ds-left">—</div>
        </div>
        <div class="depth-slot" id="slot-right">
          <div class="ds-label">right_depth</div>
          <div class="ds-val unknown" id="ds-right">—</div>
        </div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-title">Call Stack <span style="font-size:0.65rem;font-weight:400;color:var(--text-faint)">(top = active)</span></div>
      <div id="call-stack"><span class="cs-empty">empty</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
// ─── Code lines ───────────────────────────────────────────────────────────────
const CODE_LINES = [
  [1, `<span class="kw">def</span> <span class="fn">maxDepth</span><span class="op">(</span>root<span class="op">):</span>`],
  [2, `    <span class="kw">if</span> root <span class="kw">is</span> <span class="bi">None</span><span class="op">:</span>`],
  [3, `        <span class="kw">return</span> <span class="bi">0</span>`],
  [0, ``],
  [5, `    left  <span class="op">=</span> <span class="fn">maxDepth</span><span class="op">(</span>root.left<span class="op">)</span>`],
  [6, `    right <span class="op">=</span> <span class="fn">maxDepth</span><span class="op">(</span>root.right<span class="op">)</span>`],
  [0, ``],
  [8, `    <span class="kw">return</span> <span class="fn">max</span><span class="op">(</span>left<span class="op">,</span> right<span class="op">)</span> <span class="op">+</span> <span class="bi">1</span>`],
];

function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = `cl-${ln}`;
    row.innerHTML =
      `<span class="ln">${ln > 0 ? ln : ''}</span>` +
      `<span class="code">${html}</span>`;
    body.appendChild(row);
  });
}

// ─── Node state colors ────────────────────────────────────────────────────────
const COLORS = {
  idle:   { fill: '#1e2130', stroke: '#2d3148', text: 'var(--text-muted)' },
  active: { fill: '#4338ca', stroke: 'var(--accent)', text: 'var(--accent-pale)' },
  done:   { fill: '#052e16', stroke: '#16a34a', text: 'var(--green)' },
};
const EDGE_DEFAULT = '#2d3148';

// ─── Global state ─────────────────────────────────────────────────────────────
let nodeMap = {};
let R = 22;
let VW = 800, VH = 320;

// ─── Build tree from level-order ──────────────────────────────────────────────
function parseLevelOrder(s) {
  return s.split(',').map(t => t.trim()).map(t =>
    (t === '' || t.toLowerCase() === 'null' || t === 'n') ? null : Number(t)
  );
}

let nextId = 0;
function buildTree(vals) {
  nodeMap = {};
  nextId = 0;
  if (!vals.length || vals[0] === null) return null;
  const makeNode = (val) => {
    const n = { id: nextId++, val, left: null, right: null, x: 0, y: 0, depth: 0 };
    nodeMap[n.id] = n;
    return n;
  };
  const root = makeNode(vals[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < vals.length) {
    const cur = queue.shift();
    if (i < vals.length) {
      if (vals[i] !== null) { cur.left = makeNode(vals[i]); cur.left.depth = cur.depth + 1; queue.push(cur.left); }
      i++;
    }
    if (i < vals.length) {
      if (vals[i] !== null) { cur.right = makeNode(vals[i]); cur.right.depth = cur.depth + 1; queue.push(cur.right); }
      i++;
    }
  }
  return root;
}

// ─── Layout ───────────────────────────────────────────────────────────────────
function layout(root) {
  let idx = 0, maxD = 0;
  function inorder(node) {
    if (!node) return;
    inorder(node.left);
    node._inIdx = idx++;
    if (node.depth > maxD) maxD = node.depth;
    inorder(node.right);
  }
  inorder(root);
  const count = idx;
  const xSpace = Math.max(60, Math.min(110, 700 / Math.max(1, count)));
  const ySpace = 70;
  const padX = 40, padY = 30;
  VW = padX * 2 + (count - 1) * xSpace;
  VH = padY * 2 + maxD * ySpace + R * 2 + 24;
  if (VW < 400) VW = 400;
  for (const id in nodeMap) {
    const n = nodeMap[id];
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + 22 + n.depth * ySpace + R;
  }
}

// ─── SVG helpers ──────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id;
  return g;
}

function renderSVG(root) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  R = VW > 700 ? 22 : 18;

  const edgeG = svgG('edges');
  const nodeG = svgG('nodes');
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  (function drawEdges(n) {
    if (!n) return;
    [n.left, n.right].forEach(c => {
      if (!c) return;
      edgeG.appendChild(svgEl('line', {
        id: `edge-${n.id}-${c.id}`,
        x1: n.x, y1: n.y, x2: c.x, y2: c.y,
        stroke: EDGE_DEFAULT, 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);

  for (const id in nodeMap) {
    const n = nodeMap[id];
    const g = svgG(`node-g-${n.id}`);

    const badge = svgEl('text', {
      id: `nb-${n.id}`,
      x: n.x, y: n.y - R - 6,
      'text-anchor': 'middle', 'dominant-baseline': 'auto',
      fill: '#16a34a', 'font-size': 13, 'font-weight': '800',
      'font-family': 'JetBrains Mono, monospace',
      opacity: 0,
    });
    badge.textContent = '';
    g.appendChild(badge);

    g.appendChild(svgEl('circle', {
      id: `nc-${n.id}`, cx: n.x, cy: n.y, r: R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': 2.5,
    }));
    const t = svgEl('text', {
      id: `nt-${n.id}`, x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.round(R * 0.75), 'font-weight': 'bold',
      'font-family': 'Segoe UI, system-ui, sans-serif',
    });
    t.textContent = n.val;
    g.appendChild(t);
    nodeG.appendChild(g);
  }
}

// ─── Simulation ───────────────────────────────────────────────────────────────
function simulate(root) {
  const stateMap = {};
  const depthMap = {};
  for (const id in nodeMap) { stateMap[id] = 'idle'; depthMap[id] = null; }
  const callStack = [];
  const out = [];

  function snap(phase, desc, lines, activeLeft, activeRight) {
    out.push({
      phase, desc, lines: lines || [],
      stateMap: { ...stateMap },
      depthMap: { ...depthMap },
      callStack: [...callStack],
      activeLeft: activeLeft !== undefined ? activeLeft : null,
      activeRight: activeRight !== undefined ? activeRight : null,
    });
  }

  function dfs(node) {
    if (!node) {
      callStack.push('maxDepth(None)');
      snap('Base', 'root is None → return 0.', [2, 3], null, null);
      callStack.pop();
      return 0;
    }
    callStack.push(`maxDepth(${node.val})`);
    stateMap[node.id] = 'active';
    snap('Visit', `Enter maxDepth(${node.val}).`, [1, 2], null, null);

    snap('Left', `Call maxDepth(root.left) from node ${node.val}.`, [5], null, null);
    const leftD = dfs(node.left);

    snap('Right', `Call maxDepth(root.right) from node ${node.val}. left_depth = ${leftD}.`, [6], leftD, null);
    const rightD = dfs(node.right);

    const result = Math.max(leftD, rightD) + 1;
    depthMap[node.id] = result;
    stateMap[node.id] = 'done';
    snap('Return', `max(${leftD}, ${rightD}) + 1 = ${result}. Return ${result} from ${node.val}.`, [8], leftD, rightD);

    callStack.pop();
    return result;
  }

  snap('Start', `Call maxDepth(root = ${root.val}).`, []);
  const ans = dfs(root);
  snap('Done', `Max depth = ${ans}.`, []);
  return out;
}

// ─── Apply step ───────────────────────────────────────────────────────────────
let prevLines = [];

function applyStep(s, animate) {
  Object.entries(s.stateMap).forEach(([id, st]) => setNodeColor(+id, st, animate));

  for (const id in s.depthMap) {
    const badge = document.getElementById(`nb-${id}`);
    if (!badge) continue;
    const val = s.depthMap[id];
    if (val !== null) {
      badge.textContent = val;
      if (animate) {
        gsap.to(badge, { opacity: 1, duration: 0.3 });
      } else {
        badge.setAttribute('opacity', 1);
      }
    } else {
      badge.textContent = '';
      badge.setAttribute('opacity', 0);
    }
  }

  const slotL = document.getElementById('slot-left');
  const slotR = document.getElementById('slot-right');
  const dsL   = document.getElementById('ds-left');
  const dsR   = document.getElementById('ds-right');

  if (s.activeLeft !== null) {
    dsL.textContent = s.activeLeft;
    dsL.className = 'ds-val';
    slotL.className = 'depth-slot active-slot';
  } else {
    dsL.textContent = '—';
    dsL.className = 'ds-val unknown';
    slotL.className = 'depth-slot';
  }
  if (s.activeRight !== null) {
    dsR.textContent = s.activeRight;
    dsR.className = 'ds-val';
    slotR.className = 'depth-slot active-slot';
  } else {
    dsR.textContent = '—';
    dsR.className = 'ds-val unknown';
    slotR.className = 'depth-slot';
  }

  renderCallStack(s.callStack, animate);
  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

// ─── Code line highlighting ───────────────────────────────────────────────────
const HL_BG   = 'rgba(var(--orange-ch),0.13)';
const HL_NONE = 'rgba(var(--orange-ch),0)';
const HL_BORD = 'var(--orange)';
const NO_BORD = 'transparent';

function setCodeLines(oldLines, newLines, animate) {
  const DUR = 0.22;
  (oldLines || []).filter(n => !(newLines || []).includes(n)).forEach(n => {
    const el = document.getElementById(`cl-${n}`);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_NONE, borderLeftColor: NO_BORD, duration: DUR });
      gsap.to(el.querySelector('.ln'), { color: '#3d4468', duration: DUR });
    } else {
      el.style.backgroundColor = ''; el.style.borderLeftColor = '';
      const ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  (newLines || []).filter(n => !(oldLines || []).includes(n)).forEach(n => {
    const el = document.getElementById(`cl-${n}`);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.08 });
      gsap.to(el.querySelector('.ln'), { color: 'var(--orange)', duration: DUR, delay: 0.08 });
    } else {
      el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD;
      const ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--orange)';
    }
  });
  if (newLines && newLines.length) {
    const el = document.getElementById(`cl-${newLines[0]}`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ─── Node color ───────────────────────────────────────────────────────────────
function setNodeColor(id, state, animate, dur) {
  dur = dur || 0.3;
  const c  = COLORS[state] || COLORS.idle;
  const nc = document.getElementById(`nc-${id}`);
  const nt = document.getElementById(`nt-${id}`);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: dur, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke } });
    gsap.to(nt, { duration: dur, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

// ─── Call stack ───────────────────────────────────────────────────────────────
function renderCallStack(stack, animate) {
  const c = document.getElementById('call-stack');
  c.innerHTML = '';
  if (!stack.length) {
    c.innerHTML = '<span class="cs-empty">empty</span>';
    return;
  }
  stack.forEach((label, i) => {
    const el = document.createElement('div');
    el.className = 'cs-frame' + (i === stack.length - 1 ? ' top' : '');
    el.textContent = label;
    c.appendChild(el);
    if (animate && i === stack.length - 1) {
      gsap.from(el, { opacity: 0, x: -10, duration: 0.2 });
    }
  });
}

// ─── Build / Run ──────────────────────────────────────────────────────────────
function build() {
  const txt = document.getElementById('inp-tree').value.trim();
  const vals = parseLevelOrder(txt);
  buildCodePanel();
  const root = buildTree(vals);
  if (!root) {
    document.getElementById('tree-svg').innerHTML = '';
    document.getElementById('desc').textContent = 'Empty tree.';
    return;
  }
  layout(root);
  renderSVG(root);
  prevLines = [];
  nav.load(simulate(root));
}

function buildAndRun() {
  build();
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-tree').value = d.tree;
  buildAndRun();
}

function randomExample() {
  var presets = [
    '1',
    '1,2,3',
    '3,9,20,null,null,15,7',
    '1,2,3,4',
    '1,null,2,null,3,null,4',
    '5,4,8,11,null,13,4,7,2,null,1',
  ];
  var idx = Math.floor(Math.random() * presets.length);
  document.getElementById('inp-tree').value = presets[idx];
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    document.getElementById('phase-badge').textContent = snap.phase || '';
    document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
    var desc = document.getElementById('desc');
    if (desc) desc.textContent = snap.desc || '';
  }
});

document.getElementById('resetBtn').addEventListener('click', function() { buildAndRun(); });

build();
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
