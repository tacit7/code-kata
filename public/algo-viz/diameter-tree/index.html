<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    .viz-area {
      width: 100%; max-width: 90%;
      display: flex; flex-direction: column; gap: 12px;
    }

    .tree-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    #tree-svg { display: block; width: 100%; }

    .bottom-row {
      display: grid;
      grid-template-columns: 50% 1fr;
      gap: 12px;
      align-items: start;
    }
    .right-col { display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 680px) { .bottom-row { grid-template-columns: 1fr; } }

    .code-panel {
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .code-header {
      padding: 9px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.11em;
      color: var(--text-dim);
    }
    .code-body {
      padding: 10px 0;
      flex: 1;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.78rem;
      line-height: 1.7;
      overflow-x: auto;
    }
    .cl {
      display: flex; align-items: stretch;
      border-left: 3px solid transparent;
      padding: 0 14px 0 0;
      transition: background-color 0.01s;
      white-space: pre;
    }
    .cl .ln {
      width: 28px; min-width: 28px;
      text-align: right; color: #3d4468;
      user-select: none; padding-right: 14px;
      font-size: 0.72rem; line-height: 1.7;
    }
    .cl .code { color: var(--text-muted); }

    .kw  { color: var(--purple); }
    .fn  { color: var(--blue); }
    .bi  { color: var(--orange); }
    .str { color: var(--green); }
    .cm  { color: #3d4468; font-style: italic; }
    .op  { color: var(--text); }

    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 18px;
    }
    .panel-title {
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.11em;
      color: var(--text-dim); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }

    /* Diameter counter */
    .diameter-panel { text-align: center; padding: 16px 18px 14px; }
    .diameter-label {
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.11em;
      color: var(--text-dim); margin-bottom: 8px;
    }
    #diameter-val {
      font-size: 3.5rem; font-weight: 800;
      color: var(--orange);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1; display: block;
    }
    #path-eq {
      font-size: 0.82rem; color: var(--text-muted);
      margin-top: 6px; font-family: 'JetBrains Mono', monospace;
      min-height: 1.3em;
    }

    /* Call stack */
    #call-stack {
      display: flex; flex-direction: column-reverse; gap: 5px;
      min-height: 40px;
    }
    .cs-frame {
      background: #1e1a3a; color: var(--accent-pale);
      border: 1px solid var(--accent); border-radius: 6px;
      padding: 5px 11px; font-size: 0.84rem; font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .cs-frame.top { background: #4338ca; color: #fff; }
    .cs-empty { color: var(--text-faint); font-size: 0.82rem; font-style: italic; }

    /* Height slots */
    .depth-row { display: flex; gap: 10px; }
    .depth-slot {
      flex: 1;
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }
    .depth-slot .ds-label { color: var(--text-dim); font-size: 0.7rem; margin-bottom: 4px; }
    .depth-slot .ds-val { color: var(--text-bright); font-size: 1.1rem; font-weight: 700; }
    .depth-slot.active-slot { border-color: var(--accent); }
    .depth-slot .ds-val.unknown { color: var(--text-faint); }
  </style>
</head>
<body class="page">

<script>
// ─── Code lines ───────────────────────────────────────────────────────────────
const CODE_LINES = [
  [1,  `<span class="kw">def</span> <span class="fn">dfs</span><span class="op">(</span>node<span class="op">):</span>`],
  [2,  `    <span class="kw">if</span> node <span class="kw">is</span> <span class="bi">None</span><span class="op">:</span>`],
  [3,  `        <span class="kw">return</span> <span class="bi">0</span>`],
  [0,  ``],
  [5,  `    left_h  <span class="op">=</span> <span class="fn">dfs</span><span class="op">(</span>node.left<span class="op">)</span>`],
  [6,  `    right_h <span class="op">=</span> <span class="fn">dfs</span><span class="op">(</span>node.right<span class="op">)</span>`],
  [0,  ``],
  [8,  `    diameter <span class="op">=</span> <span class="fn">max</span><span class="op">(</span>diameter<span class="op">,</span> left_h <span class="op">+</span> right_h<span class="op">)</span>`],
  [9,  `    <span class="kw">return</span> <span class="fn">max</span><span class="op">(</span>left_h<span class="op">,</span> right_h<span class="op">)</span> <span class="op">+</span> <span class="bi">1</span>`],
];

function buildCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE_LINES.forEach(([ln, html]) => {
    const row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = `cl-${ln}`;
    row.innerHTML =
      `<span class="ln">${ln > 0 ? ln : ''}</span>` +
      `<span class="code">${html}</span>`;
    body.appendChild(row);
  });
}

// ─── Colors ───────────────────────────────────────────────────────────────────
const COLORS = {
  idle:   { fill: '#1e2130', stroke: '#2d3148',     text: 'var(--text-muted)' },
  active: { fill: '#4338ca', stroke: 'var(--accent)', text: 'var(--accent-pale)' },
  done:   { fill: '#052e16', stroke: '#16a34a',     text: 'var(--green)' },
  path:   { fill: '#3d2800', stroke: '#ff9e64',     text: '#ff9e64' },
};
const EDGE_DEFAULT = '#2d3148';
const EDGE_PATH    = '#ff9e64';

// ─── Global state ─────────────────────────────────────────────────────────────
let nodeMap = {};
let R = 22;
let VW = 800, VH = 320;

// ─── Parse level-order ────────────────────────────────────────────────────────
function parseLevelOrder(s) {
  return s.split(',').map(t => t.trim()).map(t =>
    (t === '' || t.toLowerCase() === 'null' || t === 'n') ? null : Number(t)
  );
}

// ─── Build tree ───────────────────────────────────────────────────────────────
let nextId = 0;
function buildTree(vals) {
  nodeMap = {};
  nextId = 0;
  if (!vals.length || vals[0] === null) return null;
  const makeNode = (val) => {
    const n = { id: nextId++, val, left: null, right: null, x: 0, y: 0, depth: 0 };
    nodeMap[n.id] = n;
    return n;
  };
  const root = makeNode(vals[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < vals.length) {
    const cur = queue.shift();
    if (i < vals.length) {
      if (vals[i] !== null) { cur.left = makeNode(vals[i]); cur.left.depth = cur.depth + 1; queue.push(cur.left); }
      i++;
    }
    if (i < vals.length) {
      if (vals[i] !== null) { cur.right = makeNode(vals[i]); cur.right.depth = cur.depth + 1; queue.push(cur.right); }
      i++;
    }
  }
  return root;
}

// ─── Layout ───────────────────────────────────────────────────────────────────
function layout(root) {
  let idx = 0, maxD = 0;
  function inorder(node) {
    if (!node) return;
    inorder(node.left);
    node._inIdx = idx++;
    if (node.depth > maxD) maxD = node.depth;
    inorder(node.right);
  }
  inorder(root);
  const count = idx;
  const xSpace = Math.max(60, Math.min(110, 700 / Math.max(1, count)));
  const ySpace = 70;
  const padX = 40, padY = 30;
  VW = padX * 2 + (count - 1) * xSpace;
  VH = padY * 2 + maxD * ySpace + R * 2 + 24;
  if (VW < 400) VW = 400;
  for (const id in nodeMap) {
    const n = nodeMap[id];
    n.x = padX + n._inIdx * xSpace;
    n.y = padY + 22 + n.depth * ySpace + R;
  }
}

// ─── SVG helpers ──────────────────────────────────────────────────────────────
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}
function svgG(id) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  if (id) g.id = id;
  return g;
}

function renderSVG(root) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  R = VW > 700 ? 22 : 18;

  const edgeG = svgG('edges');
  const nodeG = svgG('nodes');
  svg.appendChild(edgeG);
  svg.appendChild(nodeG);

  (function drawEdges(n) {
    if (!n) return;
    [n.left, n.right].forEach(c => {
      if (!c) return;
      edgeG.appendChild(svgEl('line', {
        id: `edge-${n.id}-${c.id}`,
        x1: n.x, y1: n.y, x2: c.x, y2: c.y,
        stroke: EDGE_DEFAULT, 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);

  for (const id in nodeMap) {
    const n = nodeMap[id];
    const g = svgG(`node-g-${n.id}`);

    const badge = svgEl('text', {
      id: `nb-${n.id}`,
      x: n.x, y: n.y - R - 6,
      'text-anchor': 'middle', 'dominant-baseline': 'auto',
      fill: '#16a34a', 'font-size': 13, 'font-weight': '800',
      'font-family': 'JetBrains Mono, monospace',
      opacity: 0,
    });
    badge.textContent = '';
    g.appendChild(badge);

    g.appendChild(svgEl('circle', {
      id: `nc-${n.id}`, cx: n.x, cy: n.y, r: R,
      fill: COLORS.idle.fill, stroke: COLORS.idle.stroke, 'stroke-width': 2.5,
    }));
    const t = svgEl('text', {
      id: `nt-${n.id}`, x: n.x, y: n.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: COLORS.idle.text,
      'font-size': Math.round(R * 0.75), 'font-weight': 'bold',
      'font-family': 'Segoe UI, system-ui, sans-serif',
    });
    t.textContent = n.val;
    g.appendChild(t);
    nodeG.appendChild(g);
  }
}

// ─── Path helpers ─────────────────────────────────────────────────────────────
// Walk `steps` hops from node, always choosing the taller child
function deepPath(node, steps, heightCache) {
  const ids = [];
  let cur = node;
  for (let i = 0; i < steps && cur; i++) {
    const lh = cur.left  ? (heightCache[cur.left.id]  != null ? heightCache[cur.left.id]  : 0) : -1;
    const rh = cur.right ? (heightCache[cur.right.id] != null ? heightCache[cur.right.id] : 0) : -1;
    let next = null;
    if (lh >= rh && cur.left)      next = cur.left;
    else if (cur.right)            next = cur.right;
    if (!next) break;
    ids.push(next.id);
    cur = next;
  }
  return ids;
}

// Build edge pairs from ordered path node IDs
function buildPathEdges(pathNodes) {
  const edges = [];
  for (let i = 0; i < pathNodes.length - 1; i++) {
    const a = nodeMap[pathNodes[i]];
    const b = nodeMap[pathNodes[i + 1]];
    if (!a || !b) continue;
    if ((a.left && a.left.id === b.id) || (a.right && a.right.id === b.id)) {
      edges.push([a.id, b.id]);
    } else {
      edges.push([b.id, a.id]);
    }
  }
  return edges;
}

// ─── Simulation ───────────────────────────────────────────────────────────────
function simulate(root) {
  const stateMap = {};
  const heightMap = {};
  for (const id in nodeMap) { stateMap[id] = 'idle'; heightMap[id] = null; }

  let diameter = 0;
  let pathNodes = [];
  let pathEdges = [];
  const callStack = [];
  const out = [];

  function snap(phase, desc, lines, activeLeft, activeRight) {
    out.push({
      phase, desc,
      lines:     lines || [],
      stateMap:  Object.assign({}, stateMap),
      heightMap: Object.assign({}, heightMap),
      diameter,
      pathNodes: pathNodes.slice(),
      pathEdges: pathEdges.map(function(e) { return e.slice(); }),
      callStack: callStack.slice(),
      activeLeft:  activeLeft  !== undefined ? activeLeft  : null,
      activeRight: activeRight !== undefined ? activeRight : null,
    });
  }

  function dfs(node) {
    if (!node) {
      callStack.push('dfs(None)');
      snap('Base', 'node is None → return 0.', [2, 3]);
      callStack.pop();
      return 0;
    }

    callStack.push('dfs(' + node.val + ')');
    stateMap[node.id] = 'active';
    snap('Visit', 'Enter dfs(' + node.val + ').', [1, 2]);

    snap('Left', 'Call dfs(node.left) from node ' + node.val + '.', [5]);
    var leftH = dfs(node.left);

    snap('Right', 'Call dfs(node.right) from node ' + node.val + '. left_h = ' + leftH + '.', [6], leftH, null);
    var rightH = dfs(node.right);

    var path = leftH + rightH;
    if (path > diameter) {
      diameter = path;
      var leftArm = node.left
        ? [node.left.id].concat(deepPath(node.left, leftH - 1, heightMap))
        : [];
      var rightArm = node.right
        ? [node.right.id].concat(deepPath(node.right, rightH - 1, heightMap))
        : [];
      pathNodes = leftArm.reverse().concat([node.id]).concat(rightArm);
      pathEdges = buildPathEdges(pathNodes);
    }

    var height = Math.max(leftH, rightH) + 1;
    heightMap[node.id] = height;
    stateMap[node.id] = 'done';
    snap('Return',
      'path = ' + leftH + ' + ' + rightH + ' = ' + path +
      '. diameter = ' + diameter +
      '. Return height ' + height + ' from node ' + node.val + '.',
      [8, 9], leftH, rightH);

    callStack.pop();
    return height;
  }

  snap('Start', 'Call dfs(root = ' + root.val + '). diameter starts at 0.', []);
  dfs(root);
  snap('Done', 'Diameter of binary tree = ' + diameter + '.', []);
  return out;
}

// ─── Apply step ───────────────────────────────────────────────────────────────
var prevLines = [];
var prevDiameter = 0;

function applyStep(s, animate) {
  // node colors — path nodes override 'done' with 'path' color
  var pathSet = {};
  s.pathNodes.forEach(function(id) { pathSet[id] = true; });

  Object.keys(s.stateMap).forEach(function(id) {
    var st = s.stateMap[id];
    var effective = (pathSet[+id] && st === 'done') ? 'path' : st;
    setNodeColor(+id, effective, animate);
  });

  // height badges
  Object.keys(s.heightMap).forEach(function(id) {
    var badge = document.getElementById('nb-' + id);
    if (!badge) return;
    var val = s.heightMap[id];
    if (val !== null) {
      badge.textContent = val;
      badge.setAttribute('fill', pathSet[+id] ? '#ff9e64' : '#16a34a');
      if (animate) {
        gsap.to(badge, { opacity: 1, duration: 0.3 });
      } else {
        badge.setAttribute('opacity', 1);
      }
    } else {
      badge.textContent = '';
      badge.setAttribute('opacity', 0);
    }
  });

  // edges — reset all, then highlight path edges
  document.querySelectorAll('#edges line').forEach(function(el) {
    if (animate) {
      gsap.to(el, { attr: { stroke: EDGE_DEFAULT, 'stroke-width': 2 }, duration: 0.2 });
    } else {
      el.setAttribute('stroke', EDGE_DEFAULT);
      el.setAttribute('stroke-width', 2);
    }
  });
  s.pathEdges.forEach(function(pair) {
    var el = document.getElementById('edge-' + pair[0] + '-' + pair[1]);
    if (!el) return;
    if (animate) {
      gsap.to(el, { attr: { stroke: EDGE_PATH, 'stroke-width': 3.5 }, duration: 0.3 });
    } else {
      el.setAttribute('stroke', EDGE_PATH);
      el.setAttribute('stroke-width', 3.5);
    }
  });

  // diameter counter
  var dEl = document.getElementById('diameter-val');
  if (dEl) {
    if (s.diameter !== prevDiameter && animate) {
      gsap.from(dEl, { scale: 1.5, duration: 0.35, ease: 'back.out(2)' });
    }
    dEl.textContent = s.diameter;
  }
  prevDiameter = s.diameter;

  // path equation below diameter number
  var pEq = document.getElementById('path-eq');
  if (pEq) {
    if (s.activeLeft !== null && s.activeRight !== null) {
      pEq.textContent = s.activeLeft + ' + ' + s.activeRight + ' = ' + (s.activeLeft + s.activeRight);
    } else {
      pEq.textContent = '';
    }
  }

  // height slots
  var slotL = document.getElementById('slot-left');
  var slotR = document.getElementById('slot-right');
  var dsL   = document.getElementById('ds-left');
  var dsR   = document.getElementById('ds-right');

  if (s.activeLeft !== null) {
    dsL.textContent = s.activeLeft;
    dsL.className = 'ds-val';
    slotL.className = 'depth-slot active-slot';
  } else {
    dsL.textContent = '—';
    dsL.className = 'ds-val unknown';
    slotL.className = 'depth-slot';
  }
  if (s.activeRight !== null) {
    dsR.textContent = s.activeRight;
    dsR.className = 'ds-val';
    slotR.className = 'depth-slot active-slot';
  } else {
    dsR.textContent = '—';
    dsR.className = 'ds-val unknown';
    slotR.className = 'depth-slot';
  }

  // call stack
  renderCallStack(s.callStack, animate);

  // code lines
  setCodeLines(prevLines, s.lines, animate);
  prevLines = s.lines || [];
}

// ─── Code highlighting ────────────────────────────────────────────────────────
var HL_BG   = 'rgba(var(--orange-ch),0.13)';
var HL_NONE = 'rgba(var(--orange-ch),0)';
var HL_BORD = 'var(--orange)';
var NO_BORD = 'transparent';

function setCodeLines(oldLines, newLines, animate) {
  var DUR = 0.22;
  (oldLines || []).filter(function(n) { return !(newLines || []).includes(n); }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_NONE, borderLeftColor: NO_BORD, duration: DUR });
      gsap.to(el.querySelector('.ln'), { color: '#3d4468', duration: DUR });
    } else {
      el.style.backgroundColor = ''; el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  (newLines || []).filter(function(n) { return !(oldLines || []).includes(n); }).forEach(function(n) {
    var el = document.getElementById('cl-' + n);
    if (!el) return;
    if (animate) {
      gsap.to(el, { backgroundColor: HL_BG, borderLeftColor: HL_BORD, duration: DUR, delay: 0.08 });
      gsap.to(el.querySelector('.ln'), { color: 'var(--orange)', duration: DUR, delay: 0.08 });
    } else {
      el.style.backgroundColor = HL_BG; el.style.borderLeftColor = HL_BORD;
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--orange)';
    }
  });
  if (newLines && newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ─── Node color ───────────────────────────────────────────────────────────────
function setNodeColor(id, state, animate, dur) {
  dur = dur || 0.3;
  var c  = COLORS[state] || COLORS.idle;
  var nc = document.getElementById('nc-' + id);
  var nt = document.getElementById('nt-' + id);
  if (!nc) return;
  if (animate) {
    gsap.to(nc, { duration: dur, ease: 'power2.out', attr: { fill: c.fill, stroke: c.stroke } });
    gsap.to(nt, { duration: dur, attr: { fill: c.text } });
  } else {
    nc.setAttribute('fill', c.fill); nc.setAttribute('stroke', c.stroke);
    if (nt) nt.setAttribute('fill', c.text);
  }
}

// ─── Call stack ───────────────────────────────────────────────────────────────
function renderCallStack(stack, animate) {
  var c = document.getElementById('call-stack');
  c.innerHTML = '';
  if (!stack.length) {
    c.innerHTML = '<span class="cs-empty">empty</span>';
    return;
  }
  stack.forEach(function(label, i) {
    var el = document.createElement('div');
    el.className = 'cs-frame' + (i === stack.length - 1 ? ' top' : '');
    el.textContent = label;
    c.appendChild(el);
    if (animate && i === stack.length - 1) {
      gsap.from(el, { opacity: 0, x: -10, duration: 0.2 });
    }
  });
}

// ─── Build / Run ──────────────────────────────────────────────────────────────
function build() {
  var txt  = document.getElementById('inp-tree').value.trim();
  var vals = parseLevelOrder(txt);
  buildCodePanel();
  var root = buildTree(vals);
  if (!root) {
    document.getElementById('tree-svg').innerHTML = '';
    document.getElementById('step-desc').textContent = 'Empty tree.';
    return;
  }
  layout(root);
  renderSVG(root);
  prevLines    = [];
  prevDiameter = 0;
  var dEl = document.getElementById('diameter-val');
  if (dEl) dEl.textContent = '0';
  var pEq = document.getElementById('path-eq');
  if (pEq) pEq.textContent = '';
  nav.load(simulate(root));
}

// ─── Init ─────────────────────────────────────────────────────────────────────
var nav = VizNav({
  btnPrev:  document.getElementById('btn-back'),
  btnNext:  document.getElementById('btn-next'),
  btnPlay:  document.getElementById('btn-play'),
  speedSel: document.getElementById('speed-select'),
  render: function(snap, cur, total) {
    applyStep(snap, cur > 0);
    var el = document.getElementById('phase-label');
    if (el) el.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
    var d = document.getElementById('step-desc');
    if (d) d.textContent = snap.desc;
  }
});

build();
</script>
<script>
  if (window.self !== window.top) {
    var bl = document.querySelector('.back-link');
    if (bl) bl.style.display = 'none';
  }
</script>
