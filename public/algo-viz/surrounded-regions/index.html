<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surrounded Regions</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 0; display: flex; flex-direction: column; }
    #sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-section { font-size: 11px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-step:hover { background: #334155; }
    .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-play:hover { background: var(--accent-hover); }

    /* Unique CSS */
    .grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100px; flex-shrink: 0; }
    #grid { display: grid; gap: 4px; user-select: none; }
    .cell { border-radius: 5px; box-sizing: border-box; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 800; transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
    .step-desc-bar { font-size: 12px; color: var(--text-muted); line-height: 1.4; padding: 6px 0; }
    .code-header { padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); flex-shrink: 0; }
    .code-body { padding: 10px 0; flex: 1; font-family: 'JetBrains Mono','Fira Code','Cascadia Code',monospace; font-size: 0.73rem; line-height: 1.7; overflow-x: auto; }
    .cl { display: flex; align-items: stretch; border-left: 3px solid transparent; padding: 0 14px 0 0; white-space: pre; }
    .cl .ln { width: 28px; min-width: 28px; text-align: right; color: #3d4468; user-select: none; padding-right: 14px; font-size: 0.68rem; line-height: 1.7; }
    .cl .code { color: var(--text-muted); }
    .kw  { color: var(--purple); } .fn  { color: var(--blue); } .bi  { color: var(--orange); }
    .op  { color: var(--text); }   .cm  { color: #3d4468; font-style: italic; }
    .nb  { color: var(--green); }  .st  { color: var(--yellow); }
    .panel-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
    .panel-title { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.11em; color: var(--text-dim); margin-bottom: 8px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: 700; line-height: 1; margin-bottom: 2px; }
    .stat-lbl { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .stack-col { display: flex; flex-direction: column; gap: 3px; min-height: 24px; max-height: 100px; overflow-y: auto; }
    .stack-chip { border-radius: 4px; padding: 2px 7px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; font-family: monospace; }
    .stack-empty { color: var(--text-faint); font-size: 0.75rem; font-style: italic; }
    select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:auto;height:30px">
      <option value="">— pick a preset —</option>
      <option value='{"grid":"XXXX;XOOX;XXOX;XOXX"}'>Basic Example</option>
      <option value='{"grid":"XXX;XOX;XXX"}'>Minimal 3×3</option>
      <option value='{"grid":"XOOOX;XOXOX;XOOOX"}'>Larger grid</option>
      <option value='{"grid":"OOOOO;OXOXO;OOOOO"}'>Mostly O</option>
      <option value='{"grid":"XXXXX;XOOOX;XOXOX;XOOOX;XXXXX"}'>5×5</option>
      <option value='{"grid":"OOOO"}'>All border</option>
    </select>
  </div>
  <div>
    <label>Grid rows (semicolons, e.g. XXXX;XOOX;XXOX;XOXX)</label>
    <input type="text" id="inp-grid" value="XXXX;XOOX;XXOX;XOXX" style="width:280px;height:30px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:0 8px;font-size:0.82rem;font-family:inherit" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">&#127922; Random</button>
</div>
<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Surrounded Regions</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="grid-wrap">
      <div id="grid"></div>
    </div>
    <div class="step-desc-bar" id="step-desc">Enter a grid above and click Run.</div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-header">Python &mdash; Reverse Flood Fill</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Stats</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="stat-safe" style="color:#7aa2f7">—</div>
          <div class="stat-lbl">Safe (S)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-captured" style="color:#f7768e">—</div>
          <div class="stat-lbl">Captured</div>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">DFS Stack</div>
      <div id="stack-items" class="stack-col"><span class="stack-empty">not started</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:5px;font-size:0.7rem;color:var(--text-muted)">
        <div style="display:flex;align-items:center;gap:7px"><div style="width:18px;height:14px;border-radius:3px;background:#1a1e2a;border:2px solid #2d3a50;flex-shrink:0"></div><span>X — wall</span></div>
        <div style="display:flex;align-items:center;gap:7px"><div style="width:18px;height:14px;border-radius:3px;background:#1c2a40;border:2px solid #4a6080;flex-shrink:0"></div><span>O — unvisited</span></div>
        <div style="display:flex;align-items:center;gap:7px"><div style="width:18px;height:14px;border-radius:3px;background:#2d1a4d;border:2px solid #bb9af7;flex-shrink:0"></div><span>O — active DFS</span></div>
        <div style="display:flex;align-items:center;gap:7px"><div style="width:18px;height:14px;border-radius:3px;background:#1a1e3a;border:2px solid #7aa2f7;flex-shrink:0"></div><span>S — safe</span></div>
        <div style="display:flex;align-items:center;gap:7px"><div style="width:18px;height:14px;border-radius:3px;background:#3d1515;border:2px solid #f7768e;flex-shrink:0"></div><span>Captured → X</span></div>
        <div style="display:flex;align-items:center;gap:7px"><div style="width:18px;height:14px;border-radius:3px;background:#1a3a1a;border:2px solid #9ece6a;flex-shrink:0"></div><span>Restored → O</span></div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button class="btn-step" id="prevBtn" disabled>&#8592; Prev</button>
  <button class="btn-step" id="stepBtn" disabled>Step &#8594;</button>
  <button class="btn-play" id="playBtn" disabled>&#9654; Play</button>
  <button class="btn-step" id="resetBtn">&#8635; Reset</button>
  <select id="speedSel">
    <option value="700">0.5&#215;</option>
    <option value="250" selected>1&#215;</option>
    <option value="80">2&#215;</option>
    <option value="40">4&#215;</option>
  </select>
</div>

<script>
var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">solve</span><span class="op">(</span>board<span class="op">):</span>'],
  [2,  '    rows, cols <span class="op">=</span> <span class="bi">len</span><span class="op">(</span>board<span class="op">),</span> <span class="bi">len</span><span class="op">(</span>board<span class="op">[</span><span class="nb">0</span><span class="op">])</span>'],
  [3,  '    DIRS <span class="op">= [(-</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),(</span><span class="nb">1</span><span class="op">,</span><span class="nb">0</span><span class="op">),(</span><span class="nb">0</span><span class="op">,-</span><span class="nb">1</span><span class="op">),(</span><span class="nb">0</span><span class="op">,</span><span class="nb">1</span><span class="op">)]</span>'],
  [0,  ''],
  [4,  '    <span class="kw">def</span> <span class="fn">dfs</span><span class="op">(</span>r, c<span class="op">):</span>  <span class="cm"># mark border-connected Os as safe</span>'],
  [5,  '        <span class="kw">if not</span> <span class="op">(</span><span class="nb">0</span> <span class="op">&lt;=</span> r <span class="op">&lt;</span> rows <span class="kw">and</span> <span class="nb">0</span> <span class="op">&lt;=</span> c <span class="op">&lt;</span> cols<span class="op">):</span> <span class="kw">return</span>'],
  [6,  '        <span class="kw">if</span> board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] !=</span> <span class="st">"O"</span><span class="op">:</span> <span class="kw">return</span>'],
  [7,  '        board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] =</span> <span class="st">"S"</span>  <span class="cm"># mark safe</span>'],
  [8,  '        <span class="kw">for</span> dr, dc <span class="kw">in</span> DIRS<span class="op">:</span>'],
  [9,  '            <span class="fn">dfs</span><span class="op">(</span>r<span class="op">+</span>dr, c<span class="op">+</span>dc<span class="op">)</span>'],
  [0,  ''],
  [10, '    <span class="cm"># Phase 1: DFS from every border O</span>'],
  [11, '    <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>rows<span class="op">):</span>'],
  [12, '        <span class="kw">for</span> c <span class="kw">in</span> <span class="op">[</span><span class="nb">0</span><span class="op">,</span> cols<span class="op">-</span><span class="nb">1</span><span class="op">]:</span>'],
  [13, '            <span class="kw">if</span> board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] ==</span> <span class="st">"O"</span><span class="op">:</span> <span class="fn">dfs</span><span class="op">(</span>r, c<span class="op">)</span>'],
  [14, '    <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>cols<span class="op">):</span>'],
  [15, '        <span class="kw">if</span> board<span class="op">[</span><span class="nb">0</span><span class="op">][</span>c<span class="op">] ==</span> <span class="st">"O"</span><span class="op">:</span> <span class="fn">dfs</span><span class="op">(</span><span class="nb">0</span><span class="op">,</span> c<span class="op">)</span>'],
  [16, '        <span class="kw">if</span> board<span class="op">[</span>rows<span class="op">-</span><span class="nb">1</span><span class="op">][</span>c<span class="op">] ==</span> <span class="st">"O"</span><span class="op">:</span> <span class="fn">dfs</span><span class="op">(</span>rows<span class="op">-</span><span class="nb">1</span><span class="op">,</span> c<span class="op">)</span>'],
  [0,  ''],
  [17, '    <span class="cm"># Phase 2: flip — O&#8594;X (captured), S&#8594;O (restored)</span>'],
  [18, '    <span class="kw">for</span> r <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>rows<span class="op">):</span>'],
  [19, '        <span class="kw">for</span> c <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span>cols<span class="op">):</span>'],
  [20, '            <span class="kw">if</span> board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] ==</span> <span class="st">"O"</span><span class="op">:</span>  board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] =</span> <span class="st">"X"</span>'],
  [21, '            <span class="kw">elif</span> board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] ==</span> <span class="st">"S"</span><span class="op">:</span> board<span class="op">[</span>r<span class="op">][</span>c<span class="op">] =</span> <span class="st">"O"</span>'],
];

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = '';
  CODE.forEach(function(pair) {
    var ln = pair[0], html = pair[1];
    var row = document.createElement('div');
    row.className = 'cl';
    if (ln > 0) row.id = 'cl-' + ln;
    row.innerHTML = '<span class="ln">' + (ln > 0 ? ln : '') + '</span><span class="code">' + html + '</span>';
    body.appendChild(row);
  });
}

var ROWS = 0, COLS = 0;
var simSteps = [];
var prevLines = [];

function parseGrid() {
  var raw = document.getElementById('inp-grid').value.trim().toUpperCase();
  var rows = raw.split(';').map(function(r) { return r.trim(); }).filter(function(r) { return r.length > 0; });
  if (!rows.length) return null;
  var maxC = rows.reduce(function(m, r) { return Math.max(m, r.length); }, 0);
  return rows.map(function(r) {
    var arr = r.split('');
    while (arr.length < maxC) arr.push('X');
    return arr;
  });
}

function cellStyle(state) {
  switch(state) {
    case 'X':         return { bg: '#1a1e2a', border: '#2d3a50', color: '#3b4261', char: 'X' };
    case 'O':         return { bg: '#1c2a40', border: '#4a6080', color: '#7dcfff', char: 'O' };
    case 'dfs-cur':   return { bg: '#2d1a4d', border: '#bb9af7', color: '#f0e0ff', char: 'O' };
    case 'dfs-stk':   return { bg: '#1e1030', border: '#7048a0', color: '#c0a0ff', char: 'O' };
    case 'S':         return { bg: '#1a1e3a', border: '#7aa2f7', color: '#7aa2f7', char: 'S' };
    case 'captured':  return { bg: '#3d1515', border: '#f7768e', color: '#f7768e', char: 'X' };
    case 'restored':  return { bg: '#1a3a1a', border: '#9ece6a', color: '#9ece6a', char: 'O' };
    default:          return { bg: '#1a1e2a', border: '#2d3a50', color: '#3b4261', char: '?' };
  }
}

function buildSteps(grid) {
  var rows = grid.length;
  var cols = grid[0].length;
  var steps = [];
  var cellSt = grid.map(function(row) {
    return row.map(function(v) { return v === 'O' ? 'O' : 'X'; });
  });

  function snap(phase, desc, lines, stack) {
    var safe = 0, cap = 0;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (cellSt[r][c] === 'S' || cellSt[r][c] === 'restored') safe++;
        if (cellSt[r][c] === 'captured') cap++;
      }
    }
    steps.push({ phase: phase, desc: desc, lines: lines || [], cells: cellSt.map(function(r) { return r.slice(); }), stack: (stack || []).slice(), safeCount: safe, capturedCount: cap });
  }

  snap('Init', 'Board loaded. Phase 1 will DFS from all border Os to mark border-connected cells as safe (S).', [1, 2, 3]);

  var DIRS = [[-1,0],[1,0],[0,-1],[0,1]];

  function dfsIter(sr, sc) {
    var stack = [[sr, sc]];
    cellSt[sr][sc] = 'dfs-stk';
    snap('Phase 1 — Border DFS', 'Border O at (' + sr + ',' + sc + '). Starting DFS.', [13, 4], stack);
    while (stack.length > 0) {
      var cur = stack.pop();
      var cr = cur[0], cc = cur[1];
      if (cellSt[cr][cc] === 'dfs-stk') cellSt[cr][cc] = 'dfs-cur';
      snap('Phase 1 — Border DFS', 'Processing (' + cr + ',' + cc + '). Mark as S (safe). Check neighbors.', [7, 8], stack);
      cellSt[cr][cc] = 'S';
      for (var d = 0; d < DIRS.length; d++) {
        var nr = cr + DIRS[d][0], nc = cc + DIRS[d][1];
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        if (cellSt[nr][nc] !== 'O') continue;
        cellSt[nr][nc] = 'dfs-stk';
        stack.push([nr, nc]);
      }
      if (stack.length > 0) snap('Phase 1 — Border DFS', '(' + cr + ',' + cc + ') marked S. Stack has ' + stack.length + ' cell(s) remaining.', [8, 9], stack);
    }
    snap('Phase 1 — Border DFS', 'DFS from border O at (' + sr + ',' + sc + ') complete.', [10, 11], []);
  }

  snap('Phase 1 — Scan Border', 'Scanning left/right border columns for O cells.', [11, 12]);
  for (var r = 0; r < rows; r++) {
    for (var cEdge of [0, cols - 1]) {
      if (cols <= 1) { cEdge = 0; }
      if (cellSt[r][cEdge] === 'O') dfsIter(r, cEdge);
      if (cols <= 1) break;
    }
  }
  snap('Phase 1 — Scan Border', 'Scanning top/bottom border rows for O cells.', [14, 15, 16]);
  for (var c = 0; c < cols; c++) {
    if (cellSt[0][c] === 'O') dfsIter(0, c);
    if (rows > 1 && cellSt[rows-1][c] === 'O') dfsIter(rows-1, c);
  }
  snap('Phase 1 — Done', 'All border-connected Os marked S. Remaining O cells are fully surrounded — they will be captured.', [10, 17]);

  snap('Phase 2 — Flip', 'Scanning every cell: O → X (captured), S → O (restored).', [18, 19]);
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (cellSt[r][c] === 'O') {
        cellSt[r][c] = 'captured';
        snap('Phase 2 — Flip', '(' + r + ',' + c + ') is O with no border connection — captured! Flip to X.', [20], []);
      } else if (cellSt[r][c] === 'S') {
        cellSt[r][c] = 'restored';
        snap('Phase 2 — Flip', '(' + r + ',' + c + ') is S (border-connected) — restore to O.', [21], []);
      }
    }
  }

  var finalCap = 0, finalSafe = 0;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (cellSt[r][c] === 'captured') finalCap++;
      if (cellSt[r][c] === 'restored') finalSafe++;
    }
  }
  snap('Done', 'Flip complete. ' + finalCap + ' cell(s) captured, ' + finalSafe + ' cell(s) restored.', []);
  return steps;
}

function renderGridShell() {
  var container = document.getElementById('grid');
  var maxW = container.parentElement.clientWidth - 40;
  var cellSize = Math.max(28, Math.min(72, Math.floor(maxW / COLS) - 4));
  var fontSize = Math.max(0.65, Math.min(1.1, cellSize / 40)) + 'rem';
  container.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellSize + 'px)';
  container.innerHTML = '';
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-' + r + '-' + c;
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = fontSize;
      container.appendChild(cell);
    }
  }
}

function applyStep(snap) {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var el = document.getElementById('cell-' + r + '-' + c);
      if (!el) continue;
      var st = snap.cells[r][c];
      var sty = cellStyle(st);
      el.style.backgroundColor = sty.bg;
      el.style.borderColor = sty.border;
      el.style.color = sty.color;
      el.textContent = sty.char;
    }
  }
  renderStack(snap.stack);
  document.getElementById('stat-safe').textContent = snap.safeCount;
  document.getElementById('stat-captured').textContent = snap.capturedCount;
  setCodeLines(snap.lines || []);
}

function renderStack(stack) {
  var container = document.getElementById('stack-items');
  container.innerHTML = '';
  if (!stack || !stack.length) { container.innerHTML = '<span class="stack-empty">empty</span>'; return; }
  for (var i = stack.length - 1; i >= 0; i--) {
    var rc = stack[i];
    var chip = document.createElement('div');
    chip.className = 'stack-chip';
    chip.style.backgroundColor = '#2d1a4d';
    chip.style.color = '#c0a0ff';
    chip.style.borderLeft = '3px solid #bb9af7';
    chip.textContent = '(' + rc[0] + ',' + rc[1] + ')';
    container.appendChild(chip);
  }
}

var HL_BG = 'rgba(var(--accent-ch),0.12)';

function setCodeLines(newLines) {
  prevLines.forEach(function(n) {
    if (newLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = ''; el.style.borderLeftColor = '';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = '';
    }
  });
  newLines.forEach(function(n) {
    if (prevLines.indexOf(n) === -1) {
      var el = document.getElementById('cl-' + n); if (!el) return;
      el.style.backgroundColor = HL_BG; el.style.borderLeftColor = 'var(--accent)';
      var ln = el.querySelector('.ln'); if (ln) ln.style.color = 'var(--accent)';
    }
  });
  if (newLines.length) {
    var el = document.getElementById('cl-' + newLines[0]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  prevLines = newLines.slice();
}

function buildViz() {
  nav.stopPlay();
  var grid = parseGrid();
  if (!grid) { document.getElementById('step-desc').textContent = 'Could not parse grid.'; return; }
  ROWS = grid.length; COLS = grid[0].length;
  simSteps = buildSteps(grid);
  renderGridShell();
  prevLines = [];
  document.getElementById('stat-safe').textContent = '—';
  document.getElementById('stat-captured').textContent = '—';
  document.getElementById('stack-items').innerHTML = '<span class="stack-empty">not started</span>';
  nav.load(simSteps);
}

var nav = VizNav({
  btnPrev: document.getElementById('prevBtn'),
  btnNext: document.getElementById('stepBtn'),
  btnPlay: document.getElementById('playBtn'),
  speedSel: document.getElementById('speedSel'),
  render: function(snap, cur, total) {
    applyStep(snap);
    document.getElementById('phase-badge').textContent = snap.phase || '';
    document.getElementById('step-counter').textContent = 'Step ' + (cur + 1) + ' / ' + total;
    var descEl = document.getElementById('step-desc');
    if (descEl) descEl.textContent = snap.desc;
  }
});

document.getElementById('resetBtn').addEventListener('click', function() { buildViz(); });
window.addEventListener('resize', function() { if (ROWS > 0) renderGridShell(); });

buildCodePanel();
buildViz();

function buildAndRun() { buildViz(); }

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var d = JSON.parse(sel.value);
  document.getElementById('inp-grid').value = d.grid;
  buildViz();
}

function randomExample() {
  var rows = Math.floor(Math.random() * 5) + 3;
  var cols = Math.floor(Math.random() * 5) + 3;
  var grid = [];
  for (var r = 0; r < rows; r++) {
    var row = '';
    for (var c = 0; c < cols; c++) {
      var isBorder = (r === 0 || r === rows - 1 || c === 0 || c === cols - 1);
      row += (isBorder ? (Math.random() < 0.7) : (Math.random() < 0.5)) ? 'X' : 'O';
    }
    grid.push(row);
  }
  document.getElementById('presetSel').value = '';
  document.getElementById('inp-grid').value = grid.join(';');
  buildViz();
}
</script>

<script>
(function() {
  var handle = document.getElementById('resize-handle');
  var panel  = document.getElementById('code-panel');
  var dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
