<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas Station</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code","Cascadia Code",monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px; }
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; }
    #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-step:hover { background: #334155; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play:hover { background: var(--accent-hover); }
    #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

    /* ---- viz-specific ---- */
    .array-section {
      padding: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column; gap: 8px;
      min-height: 120px;
      overflow-x: auto;
    }
    .arr-row { display: flex; gap: 6px; flex-wrap: nowrap; }

    .station-cell {
      width: 56px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px;
    }
    .cell-net {
      width: 56px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border-soft); border-radius: 5px;
      background: #0f0f0f;
      font-size: 0.95rem; font-weight: 700; font-family: monospace;
      color: var(--text-ghost);
      position: relative;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .cell-net[data-state="idle"]      { color: var(--text-ghost); border-color: var(--border-soft); background: #0f0f0f; }
    .cell-net[data-state="visited"]   { color: var(--text-dim); border-color: #166534; background: #052e16; }
    .cell-net[data-state="current"]   { color: var(--accent-pale); border-color: var(--accent); background: var(--surface-dark); }
    .cell-net[data-state="start"]     { color: #fef08a; border-color: #ca8a04; background: #422006; }
    .cell-net[data-state="reset"]     { color: #fecaca; border-color: #b91c1c; background: #450a0a; }
    .cell-net[data-state="winner"]    { color: #bbf7d0; border-color: #15803d; background: #14532d; }

    .cell-label {
      font-size: 0.6rem; font-family: monospace;
      color: var(--text-ghost); text-align: center; line-height: 1.2;
    }
    .arr-indices { display: flex; gap: 6px; }
    .arr-idx {
      width: 56px; flex-shrink: 0;
      text-align: center; font-size: 0.6rem;
      color: var(--text-ghost); font-family: monospace;
    }

    /* start-marker arrow */
    .start-marker-row { display: flex; gap: 6px; height: 14px; }
    .start-marker { width: 56px; flex-shrink: 0; text-align: center; font-size: 0.75rem; line-height: 1; }
    .start-marker.active { color: #ca8a04; }

    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
    }

    .var-main { display: flex; gap: 8px; }
    .var-box {
      flex: 1; padding: 10px 8px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .var-box.tank-accent  { border-color: var(--accent); }
    .var-box.total-accent { border-color: #166534; }
    .var-box.start-accent { border-color: #ca8a04; }
    .var-label  { font-size: 0.65rem; font-family: monospace; color: var(--text-faint); }
    .var-val    { font-size: 1.4rem; font-weight: 700; color: var(--text-bright); }
    .var-val.neg { color: #fca5a5; }
    .var-val.pos { color: #86efac; }

    .var-sub { display: flex; gap: 8px; }
    .var-box-sm {
      flex: 1; padding: 6px 4px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .var-label-sm { font-size: 0.6rem; font-family: monospace; color: var(--text-ghost); text-align: center; }
    .var-val-sm   { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); }

    .result-card {
      padding: 10px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.85rem; font-family: monospace; color: var(--text-muted);
    }
    .result-card.success { border-color: #15803d; background: #052e16; color: #bbf7d0; }
    .result-card.fail    { border-color: #b91c1c; background: #450a0a; color: #fecaca; }
    .result-card strong { color: var(--text-bright); }

    .code-header {
      padding: 0 0 8px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim);
    }
    .code-body { font-size: 0.78rem; line-height: 1.75; white-space: pre; }
    .code-line { display: flex; align-items: center; padding: 0 4px; }
    .code-line.hl { background: rgba(122,162,247,0.12); border-left: 2px solid var(--accent); }
    .ln { min-width: 24px; color: var(--text-ghost); user-select: none; font-size: 0.7rem; }

    .kw { color: var(--purple); }
    .fn { color: var(--blue); }
    .bi { color: var(--orange); }
    .op { color: var(--text); }
    .nb { color: var(--green); }
    .cm { color: var(--text-ghost); font-style: italic; }

    .bar-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-faint); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--border-soft); }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()">
      <option value="">— pick a preset —</option>
      <option value='{"gas":"1,2,3,4,5","cost":"3,4,5,1,2"}'>Solvable (simple)</option>
      <option value='{"gas":"3,3,4","cost":"3,4,4"}'>Solvable (start at 1)</option>
      <option value='{"gas":"2,3,4","cost":"3,4,3"}'>Impossible (not enough gas)</option>
      <option value='{"gas":"5,1,2,3,4","cost":"4,4,1,5,1"}'>Edge case (reset required)</option>
      <option value='{"gas":"5","cost":"4"}'>Single station (solvable)</option>
      <option value='{"gas":"1,2","cost":"2,1"}'>Two stations (solvable)</option>
    </select>
  </div>
  <div>
    <label>Gas</label>
    <input id="inp-gas" type="text" value="1,2,3,4,5" style="width:180px;" />
  </div>
  <div>
    <label>Cost</label>
    <input id="inp-cost" type="text" value="3,4,5,1,2" style="width:180px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Gas Station</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div class="array-section" id="array-section">
      <span style="color:var(--text-dim);font-size:0.82rem">Enter gas/cost arrays and click Run.</span>
    </div>

    <div class="panel-box">
      <div class="panel-title" id="phase-label">&mdash;</div>
      <div style="font-size:0.82rem;color:var(--text-muted);margin-top:2px" id="step-desc">Enter arrays and click Run.</div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Variables</div>
      <div class="var-main">
        <div class="var-box">
          <div class="var-label">i</div>
          <div class="var-val" id="vv-i">&mdash;</div>
        </div>
        <div class="var-box tank-accent">
          <div class="var-label">current_tank</div>
          <div class="var-val" id="vv-tank">&mdash;</div>
        </div>
        <div class="var-box total-accent">
          <div class="var-label">total_gain</div>
          <div class="var-val" id="vv-total">&mdash;</div>
        </div>
        <div class="var-box start-accent">
          <div class="var-label">start</div>
          <div class="var-val" id="vv-start">&mdash;</div>
        </div>
      </div>
      <div class="var-sub">
        <div class="var-box-sm">
          <div class="var-label-sm">gas[i]</div>
          <div class="var-val-sm" id="vv-gas">&mdash;</div>
        </div>
        <div class="var-box-sm">
          <div class="var-label-sm">cost[i]</div>
          <div class="var-val-sm" id="vv-cost">&mdash;</div>
        </div>
        <div class="var-box-sm">
          <div class="var-label-sm">net[i]</div>
          <div class="var-val-sm" id="vv-net">&mdash;</div>
        </div>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">Result</div>
      <div class="result-card" id="result-card">&mdash;</div>
      <div class="bar-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#422006;border-color:#ca8a04"></div>start candidate</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--surface-dark);border-color:var(--accent)"></div>current i</div>
        <div class="legend-item"><div class="legend-dot" style="background:#052e16;border-color:#166534"></div>visited</div>
        <div class="legend-item"><div class="legend-dot" style="background:#450a0a;border-color:#b91c1c"></div>reset here</div>
        <div class="legend-item"><div class="legend-dot" style="background:#14532d;border-color:#15803d"></div>answer</div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-header">Python</div>
    <div class="code-body" id="code-body"></div>
  </div>

  <div id="sidebar"></div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
var simSteps = [], nav;
var stationCount = 0;

var CODE = [
  [1,  '<span class="kw">def</span> <span class="fn">can_complete_circuit</span><span class="op">(</span>gas, cost<span class="op">):</span>'],
  [2,  '    total_gain <span class="op">=</span> current_tank <span class="op">=</span> start <span class="op">=</span> <span class="nb">0</span>'],
  [0,  ''],
  [4,  '    <span class="kw">for</span> i <span class="kw">in</span> <span class="bi">range</span><span class="op">(</span><span class="bi">len</span><span class="op">(</span>gas<span class="op">)):</span>'],
  [5,  '        net <span class="op">=</span> gas<span class="op">[</span>i<span class="op">]</span> <span class="op">-</span> cost<span class="op">[</span>i<span class="op">]</span>'],
  [6,  '        total_gain <span class="op">+=</span> net'],
  [7,  '        current_tank <span class="op">+=</span> net'],
  [0,  ''],
  [9,  '        <span class="kw">if</span> current_tank <span class="op">&lt;</span> <span class="nb">0</span><span class="op">:</span>'],
  [10, '            start <span class="op">=</span> i <span class="op">+</span> <span class="nb">1</span>'],
  [11, '            current_tank <span class="op">=</span> <span class="nb">0</span>'],
  [0,  ''],
  [13, '    <span class="kw">return</span> start <span class="kw">if</span> total_gain <span class="op">&gt;=</span> <span class="nb">0</span> <span class="kw">else</span> <span class="op">-</span><span class="nb">1</span>'],
];

window.addEventListener('DOMContentLoaded', function() {
  buildCodePanel();
  nav = window.nav = VizNav({
    btnPrev: document.getElementById('prevBtn'),
    btnNext: document.getElementById('stepBtn'),
    btnPlay: document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap, cur > 0);
      updateStatus(snap, cur, total);
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });
  buildAndRun();
});

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  var phaseEl = document.getElementById('phase-label');
  var descEl  = document.getElementById('step-desc');
  if (phaseEl) phaseEl.textContent = 'Step ' + (cur + 1) + ' / ' + total + '  ·  ' + snap.phase;
  if (descEl)  descEl.textContent  = snap.desc;
}

function buildCodePanel() {
  var body = document.getElementById('code-body');
  body.innerHTML = CODE.map(function(e) {
    var ln = e[0], html = e[1];
    var id = ln > 0 ? ' id="cl-' + ln + '"' : '';
    return '<div class="code-line"' + id + '><span class="ln">' + (ln || '') + '</span><span>' + html + '</span></div>';
  }).join('');
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  try {
    var d = JSON.parse(sel.value);
    document.getElementById('inp-gas').value = d.gas;
    document.getElementById('inp-cost').value = d.cost;
    buildAndRun();
  } catch (e) {
    console.error('Error loading preset:', e);
  }
}

function parseArr(id) {
  return document.getElementById(id).value
    .split(',')
    .map(function(x) { return parseInt(x.trim()); })
    .filter(function(x) { return !isNaN(x); });
}

function buildAndRun() {
  var gas  = parseArr('inp-gas');
  var cost = parseArr('inp-cost');
  if (gas.length < 1 || gas.length !== cost.length) return;
  stationCount = gas.length;
  buildArraySection(gas, cost);
  simSteps = simulate(gas, cost);
  nav.load(simSteps);
}

function randomExample() {
  var n = Math.floor(Math.random() * 7) + 2;
  var gas = [], cost = [];
  for (var i = 0; i < n; i++) {
    gas.push(Math.floor(Math.random() * 10) + 1);
    cost.push(Math.floor(Math.random() * 10) + 1);
  }
  document.getElementById('inp-gas').value = gas.join(',');
  document.getElementById('inp-cost').value = cost.join(',');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

function buildArraySection(gas, cost) {
  var sec = document.getElementById('array-section');
  var n = gas.length;

  var html = '<div class="start-marker-row" id="marker-row">';
  for (var i = 0; i < n; i++) {
    html += '<div class="start-marker" id="sm-' + i + '"></div>';
  }
  html += '</div>';

  html += '<div class="arr-row" id="arr-row">';
  for (var i = 0; i < n; i++) {
    var net = gas[i] - cost[i];
    var sign = net >= 0 ? '+' : '';
    html += '<div class="station-cell">';
    html += '<div class="cell-net" id="ac-' + i + '" data-state="idle">' + sign + net + '</div>';
    html += '<div class="cell-label">g:' + gas[i] + ' c:' + cost[i] + '</div>';
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="arr-indices" id="arr-indices">';
  for (var i = 0; i < n; i++) {
    html += '<div class="arr-idx">' + i + '</div>';
  }
  html += '</div>';

  sec.innerHTML = html;
}

function simulate(gas, cost) {
  var n = gas.length;
  var steps = [];
  var totalGain = 0, currentTank = 0, start = 0;
  var cellStates = Array.from({length: n}, function() { return 'idle'; });

  function snap(phase, desc, lines, i, gasI, costI, netI) {
    steps.push({
      phase: phase, desc: desc, lines: lines,
      cellStates: cellStates.slice(),
      totalGain: totalGain,
      currentTank: currentTank,
      start: start,
      i: i,
      gasI: gasI !== undefined ? gasI : null,
      costI: costI !== undefined ? costI : null,
      netI: netI !== undefined ? netI : null,
      result: null,
    });
  }
  function snapResult(phase, desc, lines, result) {
    steps.push({
      phase: phase, desc: desc, lines: lines,
      cellStates: cellStates.slice(),
      totalGain: totalGain,
      currentTank: currentTank,
      start: start,
      i: null, gasI: null, costI: null, netI: null,
      result: result,
    });
  }

  snap('Init', 'total_gain = current_tank = start = 0. Scan stations left to right; reset start whenever tank goes negative.', [2], -1);

  for (var i = 0; i < n; i++) {
    var g = gas[i], c = cost[i], net = g - c;

    cellStates[i] = 'current';
    snap('Scan', 'Station ' + i + ': gas=' + g + ', cost=' + c + ', net=' + (net >= 0 ? '+' : '') + net + '.', [4, 5], i, g, c, net);

    totalGain   += net;
    currentTank += net;
    snap('Accumulate', 'total_gain += ' + net + ' → ' + totalGain + '.  current_tank += ' + net + ' → ' + currentTank + '.', [6, 7], i, g, c, net);

    if (currentTank < 0) {
      cellStates[i] = 'reset';
      var newStart = i + 1;
      snap('Reset', 'current_tank = ' + currentTank + ' < 0 at station ' + i + '. Cannot start from anywhere ≤ ' + i + '. start ← ' + newStart + ', current_tank ← 0.', [9, 10, 11], i, g, c, net);
      start = newStart;
      currentTank = 0;
    } else {
      cellStates[i] = 'visited';
      if (i === start) {
        cellStates[i] = 'start';
      }
    }
  }

  var answer = totalGain >= 0 ? start : -1;
  if (answer >= 0 && answer < n) {
    for (var j = 0; j < n; j++) {
      if (cellStates[j] === 'start') cellStates[j] = 'winner';
      if (cellStates[j] === 'visited') cellStates[j] = 'visited';
    }
    cellStates[answer] = 'winner';
    snapResult('Done', 'total_gain = ' + totalGain + ' ≥ 0 → trip is possible. Answer: start = ' + answer + '.', [13], answer);
  } else {
    snapResult('Done', 'total_gain = ' + totalGain + ' < 0 → total gas < total cost. No valid start. Return -1.', [13], -1);
  }

  return steps;
}

function applyStep(s, animate) {
  applyArrayCells(s.cellStates, s.i, s.start, animate);
  applyStartMarkers(s.start);
  applyVars(s, animate);
  applyResult(s.result, s);
  setCodeLines(s.lines);
}

function applyArrayCells(states, curI, startI, animate) {
  states.forEach(function(state, i) {
    var el = document.getElementById('ac-' + i);
    if (!el) return;
    var prev = el.dataset.state;
    el.dataset.state = state;

    if (animate && i === curI && state === 'current' && prev !== 'current') {
      gsap.fromTo(el, { scale: 0.82 }, { scale: 1, duration: 0.22, ease: 'back.out(2)' });
    }
    if (animate && state === 'reset' && prev !== 'reset') {
      gsap.fromTo(el, { x: -6 }, { x: 0, duration: 0.35, ease: 'elastic.out(1, 0.4)' });
    }
    if (animate && state === 'winner' && prev !== 'winner') {
      gsap.fromTo(el, { scale: 1.22 }, { scale: 1, duration: 0.35, ease: 'back.out(1.8)' });
    }
    if (animate && state === 'start' && prev !== 'start') {
      gsap.fromTo(el, { scale: 1.15 }, { scale: 1, duration: 0.25, ease: 'back.out(1.5)' });
    }
  });
}

function applyStartMarkers(startI) {
  for (var i = 0; i < stationCount; i++) {
    var el = document.getElementById('sm-' + i);
    if (!el) continue;
    if (i === startI) {
      el.textContent = '▲';
      el.className = 'start-marker active';
    } else {
      el.textContent = '';
      el.className = 'start-marker';
    }
  }
}

function applyVars(s, animate) {
  function setVal(id, val, colorClass) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = val === null || val === undefined ? '—' : String(val);
    if (animate && el.textContent !== text) {
      gsap.fromTo(el, { scale: 0.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.7)' });
    }
    el.textContent = text;
    el.className = 'var-val' + (colorClass ? ' ' + colorClass : '');
  }

  var tankColor = s.currentTank === null ? '' : (s.currentTank < 0 ? 'neg' : (s.currentTank > 0 ? 'pos' : ''));
  var totalColor = s.totalGain === null ? '' : (s.totalGain < 0 ? 'neg' : (s.totalGain > 0 ? 'pos' : ''));

  setVal('vv-i',     s.i >= 0 ? s.i : null);
  setVal('vv-tank',  s.currentTank !== null ? s.currentTank : null, tankColor);
  setVal('vv-total', s.totalGain !== null ? s.totalGain : null, totalColor);
  setVal('vv-start', s.start !== null ? s.start : null);

  function setSmall(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = val === null || val === undefined ? '—' : String(val);
  }
  var netSign = s.netI !== null && s.netI >= 0 ? '+' : '';
  setSmall('vv-gas',  s.gasI);
  setSmall('vv-cost', s.costI);
  setSmall('vv-net',  s.netI !== null ? netSign + s.netI : null);
}

function applyResult(result, s) {
  var card = document.getElementById('result-card');
  if (!card) return;
  if (result === null || result === undefined) {
    card.className = 'result-card';
    card.textContent = '—';
  } else if (result >= 0) {
    card.className = 'result-card success';
    card.innerHTML = '<strong>start = ' + result + '</strong> &mdash; begin at station ' + result + ' to complete the circuit';
  } else {
    card.className = 'result-card fail';
    card.innerHTML = '<strong>-1</strong> &mdash; total gas &lt; total cost, no valid starting point';
  }
}

function setCodeLines(lines) {
  CODE.forEach(function(e) {
    var ln = e[0]; if (!ln) return;
    var el = document.getElementById('cl-' + ln);
    if (!el) return;
    if (lines.indexOf(ln) >= 0) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

(function() {
  var h = document.getElementById('resize-handle'), p = document.getElementById('code-panel'), d = false, sx = 0, sw = 0;
  h.addEventListener('mousedown', function(e) { d = true; sx = e.clientX; sw = p.offsetWidth; h.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!d) return; p.style.width = Math.min(560, Math.max(120, sw + (sx - e.clientX))) + 'px'; });
  document.addEventListener('mouseup', function() { if (!d) return; d = false; h.classList.remove('dragging'); });
})();
</script>
</body>
</html>
