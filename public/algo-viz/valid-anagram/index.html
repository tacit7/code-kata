<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valid Anagram</title>
<link rel="stylesheet" href="../shared/style.css" />
<script src="../shared/gsap.min.js"></script>
<script src="../shared/viz.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
  #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .viz-inputs { width: 100%; max-width: 100%; padding: 10px 16px; background: var(--surface); border: none; border-bottom: 1px solid var(--border); border-radius: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
  .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; appearance: none; -webkit-appearance: none; }
  .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; border: none; }
  .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }

  #viz-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; overflow-y: auto; }

  #desc { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 600px; min-height: 36px; line-height: 1.5; }

  .panel-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }

  .string-row { width: 100%; max-width: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .string-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
  .string-display { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 1.2rem; letter-spacing: 0.15em; color: var(--text); display: flex; gap: 6px; flex-wrap: wrap; }
  .char { display: flex; align-items: center; justify-content: center; width: 32px; height: 40px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; transition: all 0.25s ease; }
  .char.current { background: #4338ca; border-color: var(--accent); color: #fff; font-weight: 700; }
  .char.processed { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }

  .freq-panel { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
  .freq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
  .freq-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; font-family: 'JetBrains Mono', monospace; transition: all 0.25s ease; }
  .freq-cell .char-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .freq-cell .count-val { font-size: 1.4rem; font-weight: 700; color: var(--text-bright); }
  .freq-cell.positive { background: var(--green-bg); border-color: var(--green-border); }
  .freq-cell.positive .count-val { color: var(--green); }
  .freq-cell.negative { background: #2a0f14; border-color: #6b2030; }
  .freq-cell.negative .count-val { color: var(--red); }
  .freq-cell.active { border-color: var(--accent); box-shadow: 0 0 8px rgba(122,162,247,0.3); }

  .result-banner { font-size: 0.95rem; font-weight: 700; padding: 8px 16px; border-radius: 6px; display: none; width: fit-content; }
  .result-banner.true { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); display: block; }
  .result-banner.false { background: #2a0f14; color: var(--red); border: 1px solid #6b2030; display: block; }

  #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  #code-panel { width: 360px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: auto; padding: 10px 0; display: flex; flex-direction: column; }
  .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin: 0 12px 8px; }

  .cl { display: flex; align-items: stretch; padding: 0 14px 0 0; white-space: pre; border-left: 3px solid transparent; }
  .cl .ln { width: 28px; min-width: 28px; text-align: right; color: var(--text-dim); user-select: none; padding-right: 14px; font-size: 0.72rem; line-height: 1.75; }
  .cl .code { color: var(--text-muted); font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.78rem; line-height: 1.75; }
  .cl.hl { background: rgba(122,162,247,0.12); border-left-color: var(--accent); }
  .kw { color: var(--purple); }
  .fn { color: var(--blue); }
  .bi { color: var(--orange); }
  .cm { color: var(--text-dim); font-style: italic; }
  .str { color: var(--green); }
  .num { color: var(--yellow); }

  #sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-section { font-size: 11px; }
  .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }
  .var-item { font-size: 11px; font-family: monospace; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-soft); }
  .var-item:last-child { border-bottom: none; }
  .var-key { color: var(--text-dim); }
  .var-val { color: var(--accent); font-weight: 700; }

  #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .btn-step, .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  .btn-step:hover { background: #334155; }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-play:hover { background: var(--accent-hover); }
  #nav-row select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }

  @media (max-width: 900px) {
    .string-row { grid-template-columns: 1fr; }
    .freq-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
  }
</style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:220px;">
      <option value="">— custom —</option>
      <option value="anagram|nagaram" selected>anagram / nagaram &#10003;</option>
      <option value="rat|car">rat / car &#10003;</option>
      <option value="listen|silent">listen / silent &#10003;</option>
      <option value="hello|world">hello / world &#10007;</option>
      <option value="cat|act">cat / act &#10003;</option>
      <option value="aab|baa">aab / baa &#10003;</option>
      <option value="ab|a">ab / a &#10007; (diff length)</option>
      <option value="aacc|ccac">aacc / ccac &#10007; (wrong freq)</option>
    </select>
  </div>
  <div>
    <label>String s</label>
    <input type="text" id="sInput" value="anagram" style="width:140px;" />
  </div>
  <div>
    <label>String t</label>
    <input type="text" id="tInput" value="nagaram" style="width:140px;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Valid Anagram</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>

    <div class="string-row">
      <div class="string-panel">
        <div class="panel-label">String s (building)</div>
        <div class="string-display" id="stringS"></div>
      </div>
      <div class="string-panel">
        <div class="panel-label">String t (matching)</div>
        <div class="string-display" id="stringT"></div>
      </div>
    </div>

    <div class="freq-panel">
      <div class="panel-label">Character Frequency</div>
      <div class="freq-grid" id="freqGrid"></div>
    </div>

    <div class="result-banner" id="resultBanner"></div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Python</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Variables</div>
      <div id="vars-items"><span style="color:var(--text-dim);">&mdash;</span></div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="700">Slow</option>
    <option value="250" selected>Medium</option>
    <option value="80">Fast</option>
  </select>
</div>

<script>
var nav;

const pythonCode = [
  '<span class="kw">def</span> <span class="fn">is_anagram</span>(<span class="bi">s</span>, <span class="bi">t</span>):',
  '    <span class="kw">if</span> <span class="fn">len</span>(<span class="bi">s</span>) != <span class="fn">len</span>(<span class="bi">t</span>):',
  '        <span class="kw">return</span> <span class="num">False</span>',
  '    <span class="bi">count</span> = {}',
  '    <span class="kw">for</span> <span class="bi">c</span> <span class="kw">in</span> <span class="bi">s</span>:',
  '        <span class="bi">count</span>[<span class="bi">c</span>] = <span class="bi">count</span>.<span class="fn">get</span>(<span class="bi">c</span>, <span class="num">0</span>) + <span class="num">1</span>',
  '    <span class="kw">for</span> <span class="bi">c</span> <span class="kw">in</span> <span class="bi">t</span>:',
  '        <span class="bi">count</span>[<span class="bi">c</span>] = <span class="bi">count</span>.<span class="fn">get</span>(<span class="bi">c</span>, <span class="num">0</span>) - <span class="num">1</span>',
  '        <span class="kw">if</span> <span class="bi">count</span>[<span class="bi">c</span>] &lt; <span class="num">0</span>:',
  '            <span class="kw">return</span> <span class="num">False</span>',
  '    <span class="kw">return</span> <span class="num">True</span>'
];

function renderCodePanel() {
  const body = document.getElementById('code-body');
  body.innerHTML = pythonCode.map((line, i) =>
    `<div class="cl" id="cl-${i}"><div class="ln">${i + 1}</div><div class="code">${line}</div></div>`
  ).join('');
}

function setCodeLines(activeLines) {
  document.querySelectorAll('.cl').forEach((el, i) => {
    if (activeLines.includes(i)) {
      el.classList.add('hl');
    } else {
      el.classList.remove('hl');
    }
  });
}

function buildFreqGrid(chars) {
  const grid = document.getElementById('freqGrid');
  grid.innerHTML = chars.map(char =>
    `<div class="freq-cell" id="freq-${char}">
       <div class="char-label">${char}</div>
       <div class="count-val" id="count-${char}">0</div>
     </div>`
  ).join('');
}

function updateFreqCell(char, value) {
  const cell = document.getElementById(`freq-${char}`);
  const countEl = document.getElementById(`count-${char}`);
  if (!cell) return;

  countEl.textContent = value;
  cell.classList.remove('positive', 'negative', 'active');

  if (value > 0) {
    cell.classList.add('positive');
  } else if (value < 0) {
    cell.classList.add('negative');
  }
}

function markFreqCellActive(char) {
  document.querySelectorAll('.freq-cell').forEach(c => c.classList.remove('active'));
  const cell = document.getElementById(`freq-${char}`);
  if (cell) cell.classList.add('active');
}

function renderStringDisplay(id, str, currentIdx) {
  const display = document.getElementById(id);
  display.innerHTML = str.split('').map((char, i) => {
    let cls = '';
    if (i === currentIdx) cls = 'current';
    else if (i < currentIdx) cls = 'processed';
    return `<div class="char ${cls}">${char}</div>`;
  }).join('');
}

function simulate(s, t) {
  const steps = [];

  steps.push({
    phase: 'Length Check',
    desc: `Comparing lengths: s="${s}" (len ${s.length}) vs t="${t}" (len ${t.length})`,
    sIdx: -1,
    tIdx: -1,
    count: {},
    activeChar: '',
    activeLines: [1, 2]
  });

  if (s.length !== t.length) {
    steps.push({
      phase: 'Invalid',
      desc: `Strings have different lengths! Result: false`,
      sIdx: -1,
      tIdx: -1,
      count: {},
      activeChar: '',
      result: false,
      activeLines: [2, 3]
    });
    return steps;
  }

  const count = {};
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    count[c] = (count[c] || 0) + 1;
    steps.push({
      phase: 'Phase 1: Build Count',
      desc: `Processing s[${i}]='${c}': count['${c}'] = ${count[c]}`,
      sIdx: i,
      tIdx: -1,
      count: {...count},
      activeChar: c,
      activeLines: [4, 5, 6]
    });
  }

  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    count[c] = (count[c] || 0) - 1;

    if (count[c] < 0) {
      steps.push({
        phase: 'Phase 2: Match (FAILED)',
        desc: `Processing t[${i}]='${c}': count['${c}'] = ${count[c]} (negative!)`,
        sIdx: -1,
        tIdx: i,
        count: {...count},
        activeChar: c,
        result: false,
        activeLines: [7, 8, 9, 10]
      });
      return steps;
    } else {
      steps.push({
        phase: 'Phase 2: Match',
        desc: `Processing t[${i}]='${c}': count['${c}'] = ${count[c]}`,
        sIdx: -1,
        tIdx: i,
        count: {...count},
        activeChar: c,
        activeLines: [7, 8]
      });
    }
  }

  steps.push({
    phase: 'Complete',
    desc: `All characters matched! Result: true`,
    sIdx: -1,
    tIdx: -1,
    count: {...count},
    activeChar: '',
    result: true,
    activeLines: [11]
  });

  return steps;
}

function applyStep(snap) {
  const count = snap.count || {};

  renderStringDisplay('stringS', document.getElementById('sInput').value, snap.sIdx);
  renderStringDisplay('stringT', document.getElementById('tInput').value, snap.tIdx);

  const chars = Object.keys(count).sort();
  if (chars.length === 0 && snap.sIdx === -1 && snap.tIdx === -1) {
    const s = document.getElementById('sInput').value;
    const t = document.getElementById('tInput').value;
    const all = new Set([...s, ...t]);
    buildFreqGrid(Array.from(all).sort());
  } else if (chars.length > 0) {
    buildFreqGrid(chars);
    chars.forEach(c => {
      updateFreqCell(c, count[c] || 0);
    });
    if (snap.activeChar) {
      markFreqCellActive(snap.activeChar);
    }
  }

  setCodeLines(snap.activeLines || []);

  const banner = document.getElementById('resultBanner');
  if (snap.result !== undefined) {
    banner.textContent = snap.result ? 'Valid Anagram (true)' : 'Not an Anagram (false)';
    banner.className = 'result-banner ' + (snap.result ? 'true' : 'false');
  } else {
    banner.className = 'result-banner';
  }

  const varsDiv = document.getElementById('vars-items');
  let html = '';
  if (snap.sIdx !== -1) html += `<div class="var-item"><span class="var-key">s[i]</span> = <span class="var-val">${snap.sIdx}</span></div>`;
  if (snap.tIdx !== -1) html += `<div class="var-item"><span class="var-key">t[i]</span> = <span class="var-val">${snap.tIdx}</span></div>`;
  if (snap.activeChar) html += `<div class="var-item"><span class="var-key">char</span> = <span class="var-val">'${snap.activeChar}'</span></div>`;
  if (snap.result !== undefined) html += `<div class="var-item"><span class="var-key">result</span> = <span class="var-val">${snap.result}</span></div>`;
  varsDiv.innerHTML = html || '<span style="color:var(--text-dim);">&mdash;</span>';
}

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || '—';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
  document.getElementById('desc').textContent = snap.desc || '';
}

window.addEventListener('DOMContentLoaded', function() {
  renderCodePanel();

  nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });

  buildAndRun();
});

function buildAndRun() {
  const s = document.getElementById('sInput').value.trim();
  const t = document.getElementById('tInput').value.trim();
  if (!s || !t) return;

  const steps = simulate(s, t);
  nav.load(steps);
}

function loadPreset() {
  const sel = document.getElementById('presetSel');
  if (!sel.value) return;
  const [s, t] = sel.value.split('|');
  document.getElementById('sInput').value = s;
  document.getElementById('tInput').value = t;
  buildAndRun();
}

function randomExample() {
  const chars = 'abcdefghijklmnop';
  const len = 3 + Math.floor(Math.random() * 5);
  const arr = Array.from({length: len}, () => chars[Math.floor(Math.random() * chars.length)]);
  const s = arr.join('');
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  if (Math.random() < 0.5) {
    const idx = Math.floor(Math.random() * len);
    shuffled[idx] = chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById('sInput').value = s;
  document.getElementById('tInput').value = shuffled.join('');
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

(function() {
  const handle = document.getElementById('resize-handle');
  const panel  = document.getElementById('code-panel');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const delta = startX - e.clientX;
    panel.style.width = Math.min(560, Math.max(120, startW + delta)) + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
})();
</script>
</body>
</html>
