<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiply Strings</title>
  <link rel="stylesheet" href="../shared/style.css" />
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Fira Code", "Cascadia Code", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #phase-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-sm); background: #1e3a5f; color: var(--blue); border: 1px solid var(--blue); }
    #step-counter { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .viz-inputs { width: 100%; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; flex-shrink: 0; }
    .viz-inputs label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .viz-inputs select, .viz-inputs input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; height: 30px; font-size: 0.82rem; font-family: inherit; }
    .vi-btn-run { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; }
    .vi-btn-rand { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .mul-sym { font-size: 1rem; color: var(--text-dim); font-weight: 700; align-self: flex-end; padding-bottom: 5px; }

    #main { display: flex; flex: 1; overflow: hidden; }
    #viz-area { flex: 1; overflow: auto; display: flex; flex-direction: column; }

    #desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; padding: 12px 16px 0; min-height: 20px; }

    .result-badge {
      align-self: center; margin: 8px 16px 0; padding: 4px 14px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 700; display: none;
      background: rgba(var(--accent-ch), 0.12);
      border: 1px solid rgba(var(--accent-ch), 0.4);
      color: var(--accent-pale); font-family: monospace;
    }

    /* two-panel layout */
    .middle {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; padding: 16px; overflow: hidden;
    }
    @media (max-width: 720px) { .middle { grid-template-columns: 1fr; } }

    .panel-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px;
      display: flex; flex-direction: column; gap: 10px; overflow: hidden;
    }
    .panel-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim); flex-shrink: 0;
    }

    /* grid panel */
    .grid-scroll { overflow: auto; flex: 1; }
    .mul-table {
      border-collapse: separate; border-spacing: 4px;
      font-family: monospace; font-size: 0.9rem;
    }
    .mul-table th, .mul-table td {
      width: 44px; height: 38px; text-align: center;
      border-radius: 6px;
    }
    .mul-table .hdr-cell {
      font-weight: 700; font-size: 0.88rem; color: var(--text-dim);
      background: var(--surface-dark); border: 1px solid var(--border);
    }
    .mul-table .hdr-cell.hl-col {
      color: var(--accent-pale); border-color: var(--accent);
      background: rgba(var(--accent-ch), 0.1);
    }
    .mul-table .row-hdr {
      font-weight: 700; font-size: 0.88rem; color: var(--text-dim);
      background: var(--surface-dark); border: 1px solid var(--border);
    }
    .mul-table .row-hdr.hl-row {
      color: #fb923c; border-color: #fb923c;
      background: rgba(251,146,60,0.1);
    }
    .mul-table .prod-cell {
      color: var(--text-ghost); background: #0f0f0f;
      border: 1px solid #1e1e2e;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .mul-table .prod-cell.done {
      color: var(--text-dim); border-color: #2d3148;
      background: #111420;
    }
    .mul-table .prod-cell.active {
      color: var(--yellow); border-color: var(--yellow);
      background: rgba(234,179,8,0.12);
      font-weight: 700;
    }
    .mul-table .idx-cell {
      font-size: 0.65rem; color: var(--text-ghost);
      border: none; background: transparent;
    }

    /* result array panel */
    .result-scroll { flex: 1; overflow: auto; }
    .arr-wrap { display: flex; flex-direction: column; gap: 10px; }
    .arr-indices { display: flex; gap: 4px; }
    .arr-idx { width: 44px; text-align: center; font-size: 0.62rem; color: var(--text-ghost); font-family: monospace; }
    .arr-row { display: flex; gap: 4px; }
    .arr-cell {
      width: 44px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #1e1e2e; border-radius: 6px;
      font-family: monospace; font-size: 1rem; font-weight: 700;
      color: var(--text-ghost); background: #0f0f0f;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
      position: relative;
    }
    .arr-cell.p1 { border-color: #c084fc; color: #e9d5ff; background: rgba(192,132,252,0.1); }
    .arr-cell.p2 { border-color: var(--yellow); color: #fef08a; background: rgba(234,179,8,0.1); }
    .arr-cell.nonzero { border-color: #2d3148; color: var(--text-bright); background: #111420; }
    .arr-cell.final-ok { border-color: var(--accent); color: var(--accent-pale); background: rgba(var(--accent-ch),0.08); }
    .arr-cell.final-zero { border-color: #1e1e2e; color: var(--text-ghost); background: #0a0a10; text-decoration: line-through; opacity: 0.5; }
    .arr-ptrs { display: flex; gap: 4px; }
    .arr-ptr { width: 44px; text-align: center; font-size: 0.62rem; font-family: monospace; font-weight: 700; min-height: 14px; }
    .arr-ptr.p1-lbl { color: #c084fc; }
    .arr-ptr.p2-lbl { color: var(--yellow); }

    /* mul info box (in sidebar) */
    .mul-info {
      background: var(--surface-dark); border: 1px solid var(--border-soft);
      border-radius: var(--radius); padding: 10px 14px;
      font-family: monospace; font-size: 0.82rem;
      display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
    }
    .mul-info-row { display: flex; flex-direction: column; gap: 2px; }
    .mil { color: var(--text-dim); font-size: 0.7rem; }
    .miv { color: var(--text-bright); font-weight: 700; word-break: break-all; }
    .miv.accent { color: var(--accent-pale); }
    .miv.yellow { color: var(--yellow); }
    .miv.purple { color: #c084fc; }

    /* resize + code panel */
    #resize-handle { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid var(--border); transition: background .15s; z-index: 10; }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

    #code-panel { width: 350px; min-width: 120px; max-width: 560px; flex-shrink: 0; background: var(--surface-dark); overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; }
    .code-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
    .cl { display: flex; align-items: stretch; padding: 2px 0; white-space: pre; border-left: 2px solid transparent; padding-left: 6px; color: var(--text-muted); transition: all 0.2s; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.8; }
    .cl.hl { background: rgba(var(--accent-ch),0.12); border-left-color: var(--accent); color: var(--text); }
    .ln { display: inline-block; width: 20px; text-align: right; color: var(--text-dim); user-select: none; margin-right: 10px; font-size: 0.7rem; }
    .kw { color: var(--purple); }
    .nb { color: var(--green); }
    .cm { color: var(--text-dim); font-style: italic; }

    #sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 6px; }

    #nav-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-step { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-step:hover { background: #334155; }
    .btn-play { padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent); border: 1px solid var(--accent); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-play:hover { background: var(--accent-hover); }
    #speedSel { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>

<div class="viz-inputs">
  <div>
    <label>Preset</label>
    <select id="presetSel" onchange="loadPreset()" style="width:180px;">
      <option value="">— pick a preset —</option>
      <option value="123|456" selected>123 × 456</option>
      <option value="2|3">2 × 3</option>
      <option value="99|99">99 × 99</option>
      <option value="12|0">12 × 0</option>
      <option value="408|5">408 × 5</option>
      <option value="1000|1000">1000 × 1000</option>
      <option value="9999|9999">9999 × 9999</option>
    </select>
  </div>
  <div>
    <label>num1</label>
    <input type="text" id="num1-input" value="123" maxlength="6" style="width:90px;text-align:center;" />
  </div>
  <span class="mul-sym">×</span>
  <div>
    <label>num2</label>
    <input type="text" id="num2-input" value="456" maxlength="6" style="width:90px;text-align:center;" />
  </div>
  <button class="vi-btn-run" onclick="buildAndRun()">Run</button>
  <button class="vi-btn-rand" onclick="randomExample()">🎲 Random</button>
</div>

<div class="controls"></div>

<div id="header">
  <span id="phase-badge">Setup</span>
  <span style="font-size:13px;font-weight:700;">Multiply Strings</span>
  <span id="step-counter">Step 0 / 0</span>
</div>

<div id="main">
  <div id="viz-area">
    <div id="desc">Click Run to start.</div>
    <span class="result-badge" id="result-badge"></span>
    <div class="middle">
      <!-- LEFT: multiplication grid -->
      <div class="panel-box">
        <div class="panel-title">Partial Products Grid</div>
        <div class="grid-scroll">
          <table class="mul-table" id="mul-table"></table>
        </div>
      </div>
      <!-- RIGHT: result array -->
      <div class="panel-box">
        <div class="panel-title">Result Array  <span style="font-size:0.6rem;color:var(--text-ghost);font-weight:400;text-transform:none;letter-spacing:0">(length = m + n)</span></div>
        <div class="result-scroll">
          <div class="arr-wrap" id="arr-wrap"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="resize-handle"></div>

  <div id="code-panel">
    <div class="code-panel-title">Code</div>
    <div id="code-body"></div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-title">Current Multiply</div>
      <div class="mul-info" id="mul-info">
        <div class="mul-info-row">
          <span class="mil">digit1</span><span class="miv purple" id="mi-d1">—</span>
        </div>
        <div class="mul-info-row">
          <span class="mil">digit2</span><span class="miv yellow" id="mi-d2">—</span>
        </div>
        <div class="mul-info-row">
          <span class="mil">mul</span><span class="miv yellow" id="mi-mul">—</span>
        </div>
        <div class="mul-info-row">
          <span class="mil">total</span><span class="miv" id="mi-total">—</span>
        </div>
        <div class="mul-info-row">
          <span class="mil">result[p2]</span><span class="miv yellow" id="mi-p2v">—</span>
        </div>
        <div class="mul-info-row">
          <span class="mil">carry → p1</span><span class="miv purple" id="mi-p1v">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="nav-row">
  <button id="prevBtn" class="btn-step">&#8592; Prev</button>
  <button id="stepBtn" class="btn-step">Step &#8594;</button>
  <button id="playBtn" class="btn-play">Play</button>
  <button id="resetBtn" class="btn-step">&#8635; Reset</button>
  <select id="speedSel">
    <option value="800">0.5&#215;</option>
    <option value="400" selected>1&#215;</option>
    <option value="200">2&#215;</option>
    <option value="100">4&#215;</option>
  </select>
</div>

<script>
'use strict';

var steps = [];
var NUM1 = '', NUM2 = '';

var codeLines = [
  { n: 1,  t: '<span class="kw">def</span> <span class="nb">multiply</span>(num1, num2):' },
  { n: 2,  t: '  m, n = <span class="nb">len</span>(num1), <span class="nb">len</span>(num2)' },
  { n: 3,  t: '  result = [0] * (m + n)' },
  { n: 4,  t: '  <span class="kw">for</span> i <span class="kw">in</span> <span class="nb">range</span>(m-1, -1, -1):' },
  { n: 5,  t: '    <span class="kw">for</span> j <span class="kw">in</span> <span class="nb">range</span>(n-1, -1, -1):' },
  { n: 6,  t: '      mul = <span class="nb">int</span>(num1[i]) * <span class="nb">int</span>(num2[j])' },
  { n: 7,  t: '      p1, p2 = i+j, i+j+1' },
  { n: 8,  t: '      total = mul + result[p2]' },
  { n: 9,  t: '      result[p2] = total % 10' },
  { n: 10, t: '      result[p1] += total // 10' },
  { n: 11, t: '  res = \'\'.join(<span class="nb">map</span>(<span class="nb">str</span>, result)).lstrip(\'0\')' },
  { n: 12, t: '  <span class="kw">return</span> res <span class="kw">or</span> \'0\'' },
];

// ── simulate ──────────────────────────────────────────────────────────────────

function simulate(num1, num2) {
  var m = num1.length, n = num2.length;
  var result = new Array(m + n).fill(0);
  var out = [];

  // Init step
  out.push({
    phase: 'Init',
    desc: 'num1 = "' + num1 + '"  ×  num2 = "' + num2 + '". Allocate result array of size ' + (m + n) + ' (= ' + m + ' + ' + n + ').',
    result: result.slice(),
    activeI: -1, activeJ: -1,
    p1: -1, p2: -1,
    d1: null, d2: null, mul: null, total: null, newP2: null, carry: null,
    done: false, finalStr: null,
    lines: [1, 2]
  });

  for (var i = m - 1; i >= 0; i--) {
    for (var j = n - 1; j >= 0; j--) {
      var d1 = parseInt(num1[i], 10);
      var d2 = parseInt(num2[j], 10);
      var mul = d1 * d2;
      var p1 = i + j, p2 = i + j + 1;
      var total = mul + result[p2];
      var newP2 = total % 10;
      var carry = Math.floor(total / 10);
      result[p2] = newP2;
      result[p1] += carry;

      out.push({
        phase: 'i=' + i + ', j=' + j,
        desc: 'num1[' + i + '](' + d1 + ') × num2[' + j + '](' + d2 + ') = ' + mul
            + '   total = ' + mul + ' + result[' + p2 + '](' + (total - carry*10 === newP2 ? (total - mul) : (total - mul)) + ') = ' + total
            + '   → result[' + p2 + '] = ' + newP2 + ',  carry ' + carry + ' → result[' + p1 + ']',
        result: result.slice(),
        activeI: i, activeJ: j,
        p1: p1, p2: p2,
        d1: d1, d2: d2, mul: mul, total: total, newP2: newP2, carry: carry,
        done: false, finalStr: null,
        lines: [5, 6, 7, 8, 9, 10]
      });
    }
  }

  // Finalize
  var resStr = result.join('').replace(/^0+/, '') || '0';
  out.push({
    phase: 'Result',
    desc: 'Result array → "' + result.join('') + '" → strip leading zeros → "' + resStr + '"',
    result: result.slice(),
    activeI: -1, activeJ: -1,
    p1: -1, p2: -1,
    d1: null, d2: null, mul: null, total: null, newP2: null, carry: null,
    done: true, finalStr: resStr,
    lines: [11, 12]
  });

  return out;
}

// ── build table ───────────────────────────────────────────────────────────────

function buildTable(num1, num2) {
  var m = num1.length, n = num2.length;
  var tbl = document.getElementById('mul-table');
  tbl.innerHTML = '';

  // Header row: empty corner + num1 digit headers
  var hdrRow = document.createElement('tr');
  var corner = document.createElement('th');
  corner.className = 'hdr-cell';
  corner.style.background = 'transparent';
  corner.style.border = 'none';
  hdrRow.appendChild(corner);

  // num1 column headers (left to right = index 0 to m-1)
  for (var j2 = 0; j2 < m; j2++) {
    var th = document.createElement('th');
    th.className = 'hdr-cell';
    th.id = 'col-hdr-' + j2;
    th.textContent = num1[j2];
    hdrRow.appendChild(th);
  }
  tbl.appendChild(hdrRow);

  // Index label row
  var idxRow = document.createElement('tr');
  var idxCorner = document.createElement('td');
  idxCorner.className = 'idx-cell';
  idxRow.appendChild(idxCorner);
  for (var j3 = 0; j3 < m; j3++) {
    var idxTd = document.createElement('td');
    idxTd.className = 'idx-cell';
    idxTd.textContent = 'i=' + j3;
    idxRow.appendChild(idxTd);
  }
  tbl.appendChild(idxRow);

  // Data rows: one per num2 digit
  for (var i2 = 0; i2 < n; i2++) {
    var row = document.createElement('tr');

    // row header: num2 digit + index
    var rowHdr = document.createElement('td');
    rowHdr.className = 'row-hdr';
    rowHdr.id = 'row-hdr-' + i2;
    rowHdr.innerHTML = num2[i2] + '<div style="font-size:0.58rem;font-weight:400;color:var(--text-ghost)">j=' + i2 + '</div>';
    row.appendChild(rowHdr);

    for (var j4 = 0; j4 < m; j4++) {
      var td = document.createElement('td');
      td.className = 'prod-cell';
      td.id = 'cell-' + j4 + '-' + i2;  // id = cell-<num1_idx>-<num2_idx>
      td.textContent = '—';
      row.appendChild(td);
    }
    tbl.appendChild(row);
  }
}

// ── build result array DOM ─────────────────────────────────────────────────────

function buildArrDOM(len) {
  var wrap = document.getElementById('arr-wrap');
  wrap.innerHTML = '';

  // index labels
  var idxDiv = document.createElement('div');
  idxDiv.className = 'arr-indices';
  for (var k = 0; k < len; k++) {
    var span = document.createElement('div');
    span.className = 'arr-idx';
    span.textContent = '[' + k + ']';
    idxDiv.appendChild(span);
  }
  wrap.appendChild(idxDiv);

  // cells
  var rowDiv = document.createElement('div');
  rowDiv.className = 'arr-row';
  for (var k2 = 0; k2 < len; k2++) {
    var cell = document.createElement('div');
    cell.className = 'arr-cell';
    cell.id = 'ac-' + k2;
    cell.textContent = '0';
    rowDiv.appendChild(cell);
  }
  wrap.appendChild(rowDiv);

  // pointer labels
  var ptrDiv = document.createElement('div');
  ptrDiv.className = 'arr-ptrs';
  for (var k3 = 0; k3 < len; k3++) {
    var lbl = document.createElement('div');
    lbl.className = 'arr-ptr';
    lbl.id = 'ap-' + k3;
    ptrDiv.appendChild(lbl);
  }
  wrap.appendChild(ptrDiv);
}

// ── apply step ────────────────────────────────────────────────────────────────

function applyStep(snap) {
  var m = NUM1.length, n = NUM2.length;
  var len = m + n;

  // --- grid ---
  // clear all highlights
  for (var ci = 0; ci < m; ci++) {
    var colHdr = document.getElementById('col-hdr-' + ci);
    if (colHdr) colHdr.className = 'hdr-cell';
  }
  for (var cj = 0; cj < n; cj++) {
    var rowHdr = document.getElementById('row-hdr-' + cj);
    if (rowHdr) rowHdr.className = 'row-hdr';
  }

  // fill in all cells that have been computed (activeI, activeJ marks current)
  for (var gi = 0; gi < m; gi++) {
    for (var gj = 0; gj < n; gj++) {
      var cellEl = document.getElementById('cell-' + gi + '-' + gj);
      if (!cellEl) continue;
      // determine if this cell has been computed yet
      // processing order: i from m-1 down to 0, j from n-1 down to 0
      var computedOrder = (m - 1 - gi) * n + (n - 1 - gj);
      var currentOrder = snap.activeI < 0 ? -1 : (m - 1 - snap.activeI) * n + (n - 1 - snap.activeJ);

      if (snap.done) {
        cellEl.className = 'prod-cell done';
        cellEl.textContent = parseInt(NUM1[gi], 10) * parseInt(NUM2[gj], 10);
      } else if (computedOrder < currentOrder) {
        cellEl.className = 'prod-cell done';
        cellEl.textContent = parseInt(NUM1[gi], 10) * parseInt(NUM2[gj], 10);
      } else if (computedOrder === currentOrder) {
        cellEl.className = 'prod-cell active';
        cellEl.textContent = snap.mul !== null ? snap.mul : '?';
      } else {
        cellEl.className = 'prod-cell';
        cellEl.textContent = '—';
      }
    }
  }

  // highlight active col/row headers
  if (snap.activeI >= 0) {
    var colH = document.getElementById('col-hdr-' + snap.activeI);
    if (colH) colH.className = 'hdr-cell hl-col';
    var rowH = document.getElementById('row-hdr-' + snap.activeJ);
    if (rowH) rowH.className = 'row-hdr hl-row';
  }

  // --- result array ---
  for (var k = 0; k < len; k++) {
    var cell2 = document.getElementById('ac-' + k);
    var ptrEl = document.getElementById('ap-' + k);
    if (!cell2) continue;
    cell2.textContent = snap.result[k];

    var cls = 'arr-cell';
    var ptrTxt = '';
    var ptrCls = 'arr-ptr';

    if (!snap.done) {
      if (k === snap.p1) {
        cls += ' p1';
        ptrTxt = 'p1';
        ptrCls += ' p1-lbl';
      } else if (k === snap.p2) {
        cls += ' p2';
        ptrTxt = 'p2';
        ptrCls += ' p2-lbl';
      } else if (snap.result[k] !== 0) {
        cls += ' nonzero';
      }
    } else {
      // final: determine leading zeros
      var firstNonZero = snap.result.findIndex(function(v) { return v !== 0; });
      if (firstNonZero < 0) firstNonZero = len - 1;
      if (k < firstNonZero) {
        cls += ' final-zero';
      } else {
        cls += ' final-ok';
      }
    }

    cell2.className = cls;
    if (ptrEl) {
      ptrEl.textContent = ptrTxt;
      ptrEl.className = ptrCls;
    }
  }

  // --- info box ---
  if (snap.d1 !== null) {
    document.getElementById('mi-d1').textContent = snap.d1 + '  (num1[' + snap.activeI + '])';
    document.getElementById('mi-d2').textContent = snap.d2 + '  (num2[' + snap.activeJ + '])';
    document.getElementById('mi-mul').textContent = snap.mul;
    document.getElementById('mi-total').textContent = 'mul(' + snap.mul + ') + result[p2](' + (snap.total - snap.mul) + ') = ' + snap.total;
    document.getElementById('mi-p2v').textContent = snap.total + ' % 10 = ' + snap.newP2;
    document.getElementById('mi-p1v').textContent = '⌊' + snap.total + ' / 10⌋ = ' + snap.carry + '  → result[p1] += ' + snap.carry;
  } else {
    document.getElementById('mi-d1').textContent = '—';
    document.getElementById('mi-d2').textContent = '—';
    document.getElementById('mi-mul').textContent = '—';
    document.getElementById('mi-total').textContent = '—';
    document.getElementById('mi-p2v').textContent = '—';
    document.getElementById('mi-p1v').textContent = '—';
  }

  // --- result badge ---
  var badge = document.getElementById('result-badge');
  if (snap.done) {
    badge.textContent = '"' + NUM1 + '" × "' + NUM2 + '" = "' + snap.finalStr + '"';
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }

  // --- desc ---
  var descEl = document.getElementById('desc');
  if (descEl) {
    gsap.fromTo(descEl, { opacity: 0 }, { opacity: 1, duration: 0.15 });
    descEl.textContent = snap.desc;
  }

  // --- code highlight ---
  document.querySelectorAll('.cl').forEach(function(cl) { cl.classList.remove('hl'); });
  (snap.lines || []).forEach(function(nLine) {
    var el = document.getElementById('cl-' + nLine);
    if (el) el.classList.add('hl');
  });
}

// ── status ────────────────────────────────────────────────────────────────────

function updateStatus(snap, cur, total) {
  document.getElementById('phase-badge').textContent = snap.phase || 'Step';
  document.getElementById('step-counter').textContent = 'Step ' + cur + ' / ' + total;
}

// ── init ──────────────────────────────────────────────────────────────────────

function validate(s) {
  return /^\d+$/.test(s) && s.length >= 1 && s.length <= 6;
}

function buildAndRun() {
  var n1 = document.getElementById('num1-input').value.trim();
  var n2 = document.getElementById('num2-input').value.trim();
  if (!validate(n1) || !validate(n2)) return;

  NUM1 = n1; NUM2 = n2;
  document.getElementById('result-badge').style.display = 'none';

  steps = simulate(NUM1, NUM2);
  buildTable(NUM1, NUM2);
  buildArrDOM(NUM1.length + NUM2.length);

  window.nav.load(steps);
}

function loadPreset() {
  var sel = document.getElementById('presetSel');
  if (!sel.value) return;
  var parts = sel.value.split('|');
  document.getElementById('num1-input').value = parts[0];
  document.getElementById('num2-input').value = parts[1];
  buildAndRun();
}

function randomExample() {
  var len1 = 1 + Math.floor(Math.random() * 4);
  var len2 = 1 + Math.floor(Math.random() * 4);
  function randNum(len) {
    var s = '' + (1 + Math.floor(Math.random() * 9)); // no leading zero
    for (var k = 1; k < len; k++) s += Math.floor(Math.random() * 10);
    return s;
  }
  document.getElementById('num1-input').value = randNum(len1);
  document.getElementById('num2-input').value = randNum(len2);
  document.getElementById('presetSel').value = '';
  buildAndRun();
}

document.addEventListener('DOMContentLoaded', function() {
  // build code panel
  var codeBody = document.getElementById('code-body');
  codeLines.forEach(function(line) {
    var el = document.createElement('div');
    el.className = 'cl';
    el.id = 'cl-' + line.n;
    el.innerHTML = '<span class="ln">' + line.n + '</span>' + line.t;
    codeBody.appendChild(el);
  });

  window.nav = VizNav({
    btnPrev:  document.getElementById('prevBtn'),
    btnNext:  document.getElementById('stepBtn'),
    btnPlay:  document.getElementById('playBtn'),
    speedSel: document.getElementById('speedSel'),
    render: function(snap, cur, total) {
      applyStep(snap);
      updateStatus(snap, cur, total);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (window.nav) window.nav.goTo(0);
  });

  document.getElementById('num1-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') buildAndRun();
  });
  document.getElementById('num2-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') buildAndRun();
  });

  buildAndRun();
});

// ── resize handle ───────────────────────────────────────────────────────────
(function() {
  var h = document.getElementById('resize-handle'), p = document.getElementById('code-panel'), d = false, sx = 0, sw = 0;
  h.addEventListener('mousedown', function(e) { d = true; sx = e.clientX; sw = p.offsetWidth; h.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e) { if (!d) return; p.style.width = Math.min(560, Math.max(120, sw + (sx - e.clientX))) + 'px'; });
  document.addEventListener('mouseup', function() { if (!d) return; d = false; h.classList.remove('dragging'); });
})();
</script>
